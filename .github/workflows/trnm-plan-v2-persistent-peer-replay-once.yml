name: Trillionnium Plan v2 Persistent Peer Replay Once

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/trnm-plan-v2-persistent-peer-replay-once.yml

permissions:
  contents: write

concurrency:
  group: trnm-plan-v2-persistent-peer-replay-once
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_PARENT_SHA: 52156ac5a2d7d6870b44f5504ffa144f1fe8c322
      TARGET_BRANCH: work/plan-v2-full-gap-closure-20260902
    steps:
      - name: Check out exact qualification trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0

      - name: Qualify and publish the exact persistent replay slice
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/trnm_plan_v2_persistent_peer_replay_once.py
