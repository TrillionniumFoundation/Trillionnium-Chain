name: PoCO-only convergence R11 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-only-convergence-r11-once-20260910.yml

concurrency:
  group: poco-only-final-convergence
  cancel-in-progress: true

permissions:
  contents: write

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r11-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"
  PRODUCTION_PORTS_COMMIT: 2ae1915c39774938dc7c8a0799a1224bb5024f2c
  REMOTE_SIGNER_FIX_COMMIT: 2f01213918e8da288ce5f598447318c9113edaa2

jobs:
  converge:
    name: Qualify and publish one immutable native PoCO tree
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact convergence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source identity and install pinned tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked
          git fetch --no-tags origin "$PRODUCTION_PORTS_COMMIT" "$REMOTE_SIGNER_FIX_COMMIT"
          git cat-file -e "$PRODUCTION_PORTS_COMMIT^{commit}"
          git cat-file -e "$REMOTE_SIGNER_FIX_COMMIT^{commit}"

      - name: Materialize corrected immutable product candidate
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$PRODUCTION_PORTS_COMMIT" -- \
            trillionnium/crates/trnm-node-boundary-v0/src/lib.rs \
            trillionnium/crates/trnm-node-boundary-v0/src/production_ports.rs \
            trillionnium/crates/trnm-tx-lifecycle-v0/src/lib.rs \
            trillionnium/crates/trnm-tx-lifecycle-v0/src/production.rs
          git checkout "$REMOTE_SIGNER_FIX_COMMIT" -- \
            trillionnium/crates/trnm-consensus-remote-signer-service/tests/external_authority_adapter.rs \
            trillionnium/crates/trnm-consensus-remote-signer-service/tests/external_service_os.rs \
            trillionnium/crates/trnm-consensus-remote-signer-service/tests/os_process_fixture.rs \
            trillionnium/crates/trnm-consensus-remote-signer-service/tests/pending_reservation_os.rs

          python3 tools/temporary_poco_convergence_r5.py prepare

          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          raw_key = Path("trillionnium/crates/trnm-poco-node/tests/raw_key_boundary.rs")
          text = raw_key.read_text(encoding="utf-8")
          old = '#[cfg(all(test, feature = \\"recovery-test-support\\", target_os = \\"linux\\"))]\\nmod recovery_tests;'
          new = '#[cfg(all(test, feature = \\"recovery-process-test-support\\", target_os = \\"linux\\"))]\\nmod recovery_tests;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("raw-key recovery gate assertion drift")
          raw_key.write_text(text, encoding="utf-8")

          complete = Path("trillionnium/crates/trnm-native-execution-v0/vectors/native-complete-durable-p-v0.json")
          document = json.loads(complete.read_text(encoding="utf-8"))
          assert document["inputs"]["initial_state_root_hex"] == "30f2bc697ac873698ebc4cacc4f547952c251db516ccc6502599a06007b27d49"
          assert document["expected"]["payload_root_hex"] == "02da78cb57b3e0cf4f15861b4b5e7af0f423826fbf56a5ef9b01f99389c68dbb"
          assert document["expected"]["post_state_root_hex"] == "11382d0234e2665f2f14199d88980738fb07f15dafa692ca5d1ad0147a62672a"
          assert document["expected"]["receipts_root_hex"] == "97ce54b75b5e428992460f65804d73540c790594d32bad1616282c271a66cfa0"
          assert document["expected"]["evidence_root_hex"] == "df2f0138177d79d16f277d2c45d5a9fdbe492daa75c2b28fb901f3450022b047"

          for vector in (
              Path("trillionnium/crates/trnm-native-execution-v0/vectors/legacy-runtime-jmt-v0.json"),
              complete,
          ):
              digest = hashlib.sha256(vector.read_bytes()).hexdigest()
              vector.with_name(vector.name + ".sha256").write_text(digest + "\n", encoding="ascii")
          PY

          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          python3 tools/temporary_poco_convergence_r5.py refresh-pins

          rm -f \
            tools/temporary_native_purge.py \
            tools/temporary_poco_convergence_r5.py \
            .github/workflows/apply-poco-only-purge-temporary.yml \
            .github/workflows/poco-only-full-tree-audit.yml \
            .github/workflows/poco-purge-source-snapshot.yml \
            .github/workflows/poco-only-convergence-r2-once-20260909.yml \
            .github/workflows/poco-only-convergence-r3-once-20260909.yml \
            .github/workflows/poco-only-convergence-r4-once-20260909.yml \
            .github/workflows/poco-only-convergence-r5-once-20260909.yml \
            .github/workflows/poco-only-convergence-r6-once-20260910.yml \
            .github/workflows/poco-only-convergence-r7-once-20260910.yml \
            .github/workflows/poco-only-convergence-r8-once-20260910.yml \
            .github/workflows/poco-only-convergence-r9-once-20260910.yml \
            .github/workflows/poco-only-convergence-r10-once-20260910.yml \
            .github/workflows/poco-only-convergence-r11-once-20260910.yml \
            .github/workflows/poco-cli-materialization-diagnostic-once-20260909.yml \
            .github/workflows/poco-cli-compile-diagnostic-once-20260909.yml \
            .github/workflows/poco-workspace-serial-diagnostic-once-20260909.yml \
            .github/workflows/poco-r7-source-identity-diagnostic-once-20260910.yml \
            .github/workflows/poco-r7-source-identity-diagnostic-v2-once-20260910.yml \
            .github/workflows/poco-native-vector-refresh-diagnostic-once-20260910.yml \
            .github/workflows/nonexistent \
            DO_NOT_CREATE \
            DO_NOT_CREATE_2

          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "chore(poco): publish corrected qualified native-only tree"

          FINAL_COMMIT="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
          rm -rf /tmp/trnm-r11-final
          git worktree add --detach /tmp/trnm-r11-final "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r11-final rev-parse HEAD)" = "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r11-final rev-parse 'HEAD^{tree}')" = "$FINAL_TREE"
          test -z "$(git -C /tmp/trnm-r11-final status --porcelain --untracked-files=all)"
          echo "commit=$FINAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$FINAL_TREE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$FINAL_COMMIT" >/tmp/trnm-r11-final-commit.txt
          printf '%s\n' "$FINAL_TREE" >/tmp/trnm-r11-final-tree.txt

      - name: Verify exact-source PoCO truth and fail-closed release boundary
        working-directory: /tmp/trnm-r11-final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.materialize.outputs.commit }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ steps.materialize.outputs.tree }}"
          python3 -m compileall -q scripts tools formal conformance
          python3 scripts/ci/check_native_consensus_only.py | tee /tmp/trnm-r11-native-only.json
          bash scripts/ci/check_canonical_development_plan.sh
          bash scripts/ci/check_poco_bft_mainline_truth.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          python3 scripts/ci/test_external_evidence_v1.py
          set +e
          python3 scripts/ci/check_external_evidence_v1.py --require-all \
            --source-commit "$(git rev-parse HEAD)" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --output /tmp/trnm-r11-external-evidence.json \
            >/tmp/trnm-r11-external-evidence.stdout \
            2>/tmp/trnm-r11-external-evidence.stderr
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q "external evidence gate remains open" /tmp/trnm-r11-external-evidence.stderr
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Compile every native and contract target
        working-directory: /tmp/trnm-r11-final
        shell: bash
        run: |
          set -euo pipefail
          test -z "${RUSTC_WRAPPER:-}"
          test -z "${RUSTC_WORKSPACE_WRAPPER:-}"
          rm -rf "$CARGO_TARGET_DIR"
          cargo check --manifest-path trillionnium/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r11-workspace-check.log
          cargo check --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r11-contract-check.log

      - name: Execute corrected targeted and complete regression corpus
        working-directory: /tmp/trnm-r11-final
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-execution-v0 --lib --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r11-native-execution-test.log
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --test raw_key_boundary --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r11-raw-key-test.log
          timeout --signal=TERM --kill-after=30s 7200s \
            cargo test --manifest-path trillionnium/Cargo.toml \
              --workspace --all-targets --locked --offline --no-fail-fast -j 1 -- \
              --test-threads=1 \
            2>&1 | tee /tmp/trnm-r11-workspace-test.log
          cargo test --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r11-contract-test.log
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute strict production-boundary Clippy
        working-directory: /tmp/trnm-r11-final
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 -- -D warnings \
            2>&1 | tee /tmp/trnm-r11-contract-clippy.log
          cd trillionnium
          : >/tmp/trnm-r11-boundary-clippy.log
          for package in \
            trnm-state trnm-consensus-types trnm-consensus-crypto \
            trnm-consensus-core trnm-consensus-safety-rules \
            trnm-consensus-safety-store trnm-consensus-signer-journal \
            trnm-native-application trnm-native-application-sqlite \
            trnm-native-execution-v0 trnm-durable-file-adapters-v0 \
            trnm-tx-lifecycle-v0 trnm-state-sync-v0 trnm-migration-v0 \
            trnm-control-plane-v0 trnm-release-bundle-v0 trnm-node-boundary-v0 \
            trnm-poco-node-production-v0 trnm-production-adapter-conformance-v0 \
            trnm-poco-node trnm-poco-node-authority trnm-poco-node-io \
            trnm-poco-node-host trnm-poco-node-cli
          do
            echo "strict-clippy package=${package}" | tee -a /tmp/trnm-r11-boundary-clippy.log
            cargo clippy -p "$package" --all-targets --locked --offline -j 1 -- -D warnings \
              2>&1 | tee -a /tmp/trnm-r11-boundary-clippy.log
          done
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Recheck immutable tree and publish only the qualified commit
        working-directory: /tmp/trnm-r11-final
        shell: bash
        run: |
          set -euo pipefail
          FINAL_COMMIT="${{ steps.materialize.outputs.commit }}"
          FINAL_TREE="${{ steps.materialize.outputs.tree }}"
          test "$(git rev-parse HEAD)" = "$FINAL_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$FINAL_TREE"
          python3 scripts/ci/check_native_consensus_only.py | tee /tmp/trnm-r11-native-only-final.json
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE" push origin "$FINAL_COMMIT:refs/heads/$TARGET_BRANCH"

      - name: Upload exact failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r11-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/trnm-r11-final-commit.txt
            /tmp/trnm-r11-final-tree.txt
            /tmp/trnm-r11-native-only.json
            /tmp/trnm-r11-native-only-final.json
            /tmp/trnm-r11-external-evidence.json
            /tmp/trnm-r11-external-evidence.stdout
            /tmp/trnm-r11-external-evidence.stderr
            /tmp/trnm-r11-workspace-check.log
            /tmp/trnm-r11-contract-check.log
            /tmp/trnm-r11-native-execution-test.log
            /tmp/trnm-r11-raw-key-test.log
            /tmp/trnm-r11-workspace-test.log
            /tmp/trnm-r11-contract-test.log
            /tmp/trnm-r11-contract-clippy.log
            /tmp/trnm-r11-boundary-clippy.log
