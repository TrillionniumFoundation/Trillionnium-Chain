      - name: Verify all committed source bytes again after success or failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-typed-store-observations"
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-typed-store-observations/source-after.json" 2>&1 | tee "$RUNNER_TEMP/hia-typed-store-observations/source-after.log"
      - name: Package all actual reports snapshots logs and build evidence without traversing FIFOs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -B - "$TRNM_TYPED_STAGE" <<'PY_TYPED_ARTIFACT'
          import hashlib, json, os, shutil, sys, tarfile
          from pathlib import Path
          stage = sys.argv[1]
          root = Path(os.environ['RUNNER_TEMP'])
          output = root / 'hia-typed-store-artifact'
          output.mkdir(mode=0o700)
          stage_path = root / ('hia-typed-store-' + stage)
          record = {'schema': 'trnm.hia.typed-store.ci-evidence-package.v1', 'stage': stage,
              'source': os.environ.get('TRNM_EXPECTED_SOURCE_SHA'), 'run_id': os.environ.get('GITHUB_RUN_ID'),
              'attempt': os.environ.get('GITHUB_RUN_ATTEMPT'), 'job': os.environ.get('GITHUB_JOB'),
              'qualification_status_not_changed_by_packaging': True,
              'excluded_reconstructible_original_source': 'original/isolated-source',
              'excluded_cargo_target': str(root / 'hia-typed-store-cargo-target'), 'files': {}, 'error': None}
          def identity(path):
              value, size = hashlib.sha256(), 0
              with path.open('rb') as stream:
                  while block := stream.read(1 << 20):
                      value.update(block)
                      size += len(block)
              return {'bytes': size, 'sha256': value.hexdigest()}
          def copy_if_present(source, relative):
              if not source.exists():
                  return
              if source.is_symlink() or not source.is_file():
                  raise ValueError('Expected regular direct handoff: ' + str(source))
              before = identity(source)
              destination = output / relative
              destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
              if identity(destination) != before or identity(source) != before:
                  raise ValueError('Handoff changed during packaging: ' + str(source))
              record['files'][relative] = before
          try:
              roots = {'observations': root / 'hia-typed-store-observations',
                       'bootstrap': root / 'hia-bootstrap', 'stage': stage_path}
              if stage == 'native':
                  roots['original'] = root / 'hia-typed-store-original'
              # Tar records FIFO/hardlink metadata without reading FIFO endpoints. Upload
              # only this regular archive and regular handoffs, never a live fixture tree.
              def retain(member):
                  if member.name == 'original/isolated-source' or member.name.startswith('original/isolated-source/'):
                      return None
                  return member
              archive = output / 'complete-evidence.tar.xz'
              with tarfile.open(archive, 'x:xz', preset=1, dereference=False) as stream:
                  for label, path in roots.items():
                      if path.exists():
                          stream.add(path, arcname=label, filter=retain)
              record['files'][archive.name] = identity(archive)
              copy_if_present(stage_path / 'report.json', 'report.json')
              copy_if_present(stage_path / 'maximum-state.kv.xz', 'maximum-state.kv.xz')
              if stage == 'native':
                  copy_if_present(root / 'hia-typed-store-observations/native-binding.json', 'native-binding.json')
              else:
                  previous = {'produce': 'native', 'cold': 'produce', 'bounds': 'cold'}[stage]
                  prior = root / ('hia-typed-store-prior-' + previous)
                  copy_if_present(prior / 'native-binding.json', 'native-binding.json')
                  copy_if_present(prior / 'ci-provenance.json', 'ancestry/' + previous + '-ci-provenance.json')
                  if previous != 'native':
                      copy_if_present(prior / 'report.json', 'ancestry/' + previous + '-report.json')
                  if stage == 'bounds':
                      copy_if_present(prior / 'ancestry/produce-report.json', 'ancestry/produce-report.json')
          finally:
              error = sys.exc_info()[1]
              if error is not None:
                  record['error'] = type(error).__name__ + ': ' + str(error)
              with (output / 'ci-provenance.json').open('x') as stream:
                  json.dump(record, stream, sort_keys=True, indent=2)
                  stream.write('\n')
