  - docs/development/agents/**
  - docs/development/AGENT_*
  - docs/development/packages/README.md
  - scripts/ci/check_agent_development_docs_v1.sh
  forbidden_surfaces:
  - Rust protocol/runtime/consensus implementation
  - writes to docs/development/CURRENT_SNAPSHOT_V1.* owned by A01
  - production, activation, release-ready or normative-freeze flags
  - merging its own PR
  prompt_document: docs/development/agents/AGENT_PROMPT_PACK_V1.md
  prompt_anchor: A00
- id: A01
  name: G0 Truth, Provenance and Reproducibility
  gate: G0
  package_id: G0_TRUTH_PROVENANCE_V1
