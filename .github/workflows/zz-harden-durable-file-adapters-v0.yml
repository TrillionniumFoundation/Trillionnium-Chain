name: harden-durable-file-adapters-v0

on:
  push:
    branches: [work/plan-v2-durable-adapters-20260902]
    paths: [.github/workflows/zz-harden-durable-file-adapters-v0.yml]

permissions:
  contents: write

jobs:
  harden:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/plan-v2-durable-adapters-20260902' &&
      github.actor == 'Franksudoman'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Close manifest, directory, and active-handle review gaps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('trillionnium/crates/trnm-durable-file-adapters-v0/src/lib.rs')
          text = path.read_text()
          text = text.replace(
              '''    SnapshotManifestV0, StagingIdentityV0,
};
''',
              '''    SnapshotManifestV0, StagingIdentityV0, MAX_CHUNK_BYTES_V0,
    MAX_CHUNK_COUNT_V0, MAX_SNAPSHOT_BYTES_V0,
};
''',
              1,
          )
          old_manifest = '''        if manifest.manifest_digest == SyncDigestV0([0; 32])
            || manifest.state_root == SyncDigestV0([0; 32])
            || manifest.height <= self.current.height
            || manifest.chunk_count == 0
            || manifest.maximum_chunk_bytes == 0
            || manifest.total_bytes == 0
        {
'''
          new_manifest = '''        if manifest.manifest_digest == SyncDigestV0([0; 32])
            || manifest.manifest_digest != manifest.canonical_digest()
            || manifest.state_root == SyncDigestV0([0; 32])
            || manifest.chunk_root == SyncDigestV0([0; 32])
            || manifest.height <= self.current.height
            || manifest.chunk_count == 0
            || manifest.chunk_count > MAX_CHUNK_COUNT_V0
            || manifest.maximum_chunk_bytes == 0
            || manifest.maximum_chunk_bytes as usize > MAX_CHUNK_BYTES_V0
            || manifest.total_bytes == 0
            || manifest.total_bytes > MAX_SNAPSHOT_BYTES_V0
        {
'''
          if old_manifest not in text:
              raise SystemExit('snapshot manifest validation anchor missing')
          text = text.replace(old_manifest, new_manifest, 1)

          expected_loop = '''        let mut total_bytes = 0_u64;
        for index in 0..active.chunk_count {
            let path = active.path.join(format!("chunk-{index:08}.bin"));
            let metadata = fs::metadata(path).map_err(|error| {
                if error.kind() == io::ErrorKind::NotFound {
                    DurableFileErrorV0::IncompleteSnapshot
                } else {
                    DurableFileErrorV0::Io(error)
                }
            })?;
            total_bytes = total_bytes
                .checked_add(metadata.len())
                .ok_or(DurableFileErrorV0::SequenceOverflow)?;
        }
'''
          strict_loop = '''        let mut observed_chunks = 0_u32;
        for entry in fs::read_dir(&active.path)? {
            let entry = entry?;
            let file_type = entry.file_type()?;
            let name = entry.file_name();
            let name = name
                .to_str()
                .ok_or_else(|| DurableFileErrorV0::RecoveryRequired(entry.path()))?;
            if name == "MANIFEST.v0" {
                if !file_type.is_file() {
                    return Err(DurableFileErrorV0::RecoveryRequired(entry.path()));
                }
                continue;
            }
            let Some(index_text) = name
                .strip_prefix("chunk-")
                .and_then(|value| value.strip_suffix(".bin"))
            else {
                return Err(DurableFileErrorV0::RecoveryRequired(entry.path()));
            };
            let index = index_text
                .parse::<u32>()
                .map_err(|_| DurableFileErrorV0::RecoveryRequired(entry.path()))?;
            if !file_type.is_file() || index >= active.chunk_count {
                return Err(DurableFileErrorV0::RecoveryRequired(entry.path()));
            }
            observed_chunks = observed_chunks
                .checked_add(1)
                .ok_or(DurableFileErrorV0::SequenceOverflow)?;
        }
        if observed_chunks != active.chunk_count {
            return Err(DurableFileErrorV0::IncompleteSnapshot);
        }
        let mut total_bytes = 0_u64;
        for index in 0..active.chunk_count {
            let path = active.path.join(format!("chunk-{index:08}.bin"));
            let metadata = fs::metadata(path).map_err(|error| {
                if error.kind() == io::ErrorKind::NotFound {
                    DurableFileErrorV0::IncompleteSnapshot
                } else {
                    DurableFileErrorV0::Io(error)
                }
            })?;
            total_bytes = total_bytes
                .checked_add(metadata.len())
                .ok_or(DurableFileErrorV0::SequenceOverflow)?;
        }
'''
          if expected_loop not in text:
              raise SystemExit('staging inventory anchor missing')
          text = text.replace(expected_loop, strict_loop, 1)

          old_abort = '''        let active = self
            .active
            .take()
            .ok_or(DurableFileErrorV0::UnknownStaging)?;
        Self::staging_matches(&active, staging)?;
        if active.identity.generation == self.current.generation {
'''
          new_abort = '''        let active = self
            .active
            .take()
            .ok_or(DurableFileErrorV0::UnknownStaging)?;
        if let Err(error) = Self::staging_matches(&active, staging) {
            self.active = Some(active);
            return Err(error);
        }
        if active.identity.generation == self.current.generation {
'''
          if old_abort not in text:
              raise SystemExit('abort active-handle anchor missing')
          text = text.replace(old_abort, new_abort, 1)
          required = [
              'manifest.manifest_digest != manifest.canonical_digest()',
              'observed_chunks != active.chunk_count',
              'self.active = Some(active);\n            return Err(error);',
          ]
          if not all(item in text for item in required):
              raise SystemExit('durable adapter hardening incomplete')
          path.write_text(text)

          registry = Path('config/repository-blocker-cores-v0.toml')
          rtext = registry.read_text()
          if 'name = "trnm-durable-file-adapters-v0"' not in rtext:
              rtext = rtext.rstrip() + '''

[[crate]]
name = "trnm-durable-file-adapters-v0"
path = "trillionnium/crates/trnm-durable-file-adapters-v0"
primary_module = "M15"
secondary_modules = ["M13"]
authority = "process-locked hash-chained authority journal and immutable snapshot-generation/current-pointer CAS adapters"
production_allowed = true
lab_fixture = false
owner = "TrillionniumFoundation"
technical_design = "docs/development/TRNM_DURABLE_FILE_ADAPTERS_V0.md"
slo_class = "durable-authority-and-recovery-storage"
testkit = "unit-and-production-adapter-conformance"
failure_model = ["exclusive-lock-conflict", "truncated-tail", "hash-chain-corruption", "identity-substitution", "stage-or-height-discontinuity", "write-or-sync-poison", "manifest-mismatch", "chunk-substitution", "extra-staging-file", "current-root-cas-conflict", "post-commit-directory-sync-degradation"]
'''
          registry.write_text(rtext)
          PY
          rm .github/workflows/zz-harden-durable-file-adapters-v0.yml
          git config user.name 'trnm-closure-bot'
          git config user.email 'trnm-closure-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(adapter): harden snapshot inventory and recovery handles'
          git push origin "HEAD:${GITHUB_REF_NAME}"
