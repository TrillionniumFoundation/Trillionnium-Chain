name: qualify-plan-v2-exact-head

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/zz-qualify-plan-v2-exact-head.yml

permissions:
  contents: write

concurrency:
  group: qualify-plan-v2-exact-head-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: work/plan-v2-full-gap-closure-20260902
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  qualify:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/plan-v2-full-gap-closure-20260902' &&
      github.actor == 'Franksudoman' &&
      github.triggering_actor == github.actor &&
      !contains(github.event.head_commit.message, '[exact-head-qualified]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source and install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          toolchain="$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'])
          PY
          )"
          rustup toolchain install "${toolchain}" --profile minimal --component rustfmt --component clippy
          rustup default "${toolchain}"
          rustc --version --verbose
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked

      - name: Validate repository and development truth
        shell: bash
        run: |
          set -euo pipefail
          test "$(find docs/development -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 1
          test -f docs/development/TRNM_AI_NATIVE_BLOCKCHAIN_DEVELOPMENT_PLAN.md
          python3 - <<'PY'
          from pathlib import Path
          import json, tomllib
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text())
          for path in Path('.').rglob('*.toml'):
              if '.git' not in path.parts and 'target' not in path.parts:
                  with path.open('rb') as handle: tomllib.load(handle)
          truth=json.loads(Path('config/consensus-mainline.json').read_text())
          for key in ('production_candidate','production_consensus_activation','public_testnet_ready','release_ready'):
              if key in truth and truth[key] is not False:
                  raise SystemExit(f'machine truth promoted: {key}')
          plan=Path('docs/development/TRNM_AI_NATIVE_BLOCKCHAIN_DEVELOPMENT_PLAN.md').read_text()
          for marker in ('production_candidate = true','production_consensus_activation = true','public_testnet_ready = true','release_ready = true'):
              if marker in plan: raise SystemExit(f'plan promoted truth: {marker}')
          PY
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_build_closures_v1.py --verify-cargo-tree
          python3 scripts/ci/check_node_decomposition_v1.py
          if [[ -f scripts/check_repository_blocker_registry_v0.py ]]; then
            python3 scripts/check_repository_blocker_registry_v0.py
          fi

      - name: Compile full active workspace and verify format
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked --offline

      - name: Test and lint authority-critical packages
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            trnm-consensus-core
            trnm-consensus-safety-rules
            trnm-consensus-safety-store
            trnm-consensus-signer-journal
            trnm-consensus-external-node-checkpoint
            trnm-native-application
            trnm-native-application-sqlite
            trnm-native-execution-v0
            trnm-poco-mvcc-fee-v1
            trnm-poco-node
            trnm-poco-node-authority
            trnm-poco-node-io
            trnm-poco-node-host
            trnm-poco-node-cli
            trnm-control-plane-v0
            trnm-durable-file-adapters-v0
            trnm-migration-v0
            trnm-node-boundary-v0
            trnm-poco-node-production-v0
            trnm-production-adapter-conformance-v0
            trnm-release-bundle-v0
            trnm-state-sync-v0
            trnm-tx-lifecycle-v0
          )
          for package in "${packages[@]}"; do
            cargo test --manifest-path trillionnium/Cargo.toml -p "${package}" --all-targets --locked --offline
            cargo clippy --manifest-path trillionnium/Cargo.toml -p "${package}" --all-targets --locked --offline -- -D warnings
          done

      - name: Validate default CLI remains fail closed
        shell: bash
        run: |
          set -euo pipefail
          status="$(cargo run --manifest-path trillionnium/Cargo.toml -p trnm-poco-node-cli --bin trnm-poco-node-cli --locked --offline -- status)"
          for fact in \
            '"production_candidate":false' \
            '"authority_gate_open":false' \
            '"production_activation":false' \
            '"start_permitted":false'
          do
            printf '%s\n' "${status}" | grep -q "${fact}"
          done
          set +e
          cargo run --manifest-path trillionnium/Cargo.toml -p trnm-poco-node-cli --bin trnm-poco-node-cli --locked --offline -- start \
            >"${RUNNER_TEMP}/start.stdout" 2>"${RUNNER_TEMP}/start.stderr"
          rc=$?
          set -e
          test "${rc}" -ne 0
          grep -q 'node host start blocked' "${RUNNER_TEMP}/start.stderr"

      - name: Validate contract workspace when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f contracts/Cargo.toml ]]; then
            cargo test --manifest-path contracts/Cargo.toml --workspace --locked
          fi

      - name: Record exact-head repository qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/repository
          tree="$(git write-tree)"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          report={
              'schema':'trnm-plan-v2-exact-head-qualification-v1',
              'qualified_parent_commit':os.environ['GITHUB_SHA'],
              'qualified_worktree_tree':subprocess.check_output(['git','write-tree'],text=True).strip(),
              'workspace_all_targets_check':'PASS',
              'authority_package_tests':'PASS',
              'authority_package_clippy':'PASS',
              'cargo_tree_closures':'PASS',
              'module_coverage':'PASS',
              'node_decomposition':'PASS',
              'default_start_fail_closed':'PASS',
              'independent_review':False,
              'external_multi_host_evidence':False,
              'external_hsm_anchor_evidence':False,
              'external_power_loss_evidence':False,
              'external_audit_evidence':False,
              'soak_activation_evidence':False,
              'production_candidate':False,
              'production_consensus_activation':False,
              'public_testnet_ready':False,
              'release_ready':False,
              'result':'PASS',
          }
          Path('docs/evidence/repository/PLAN_V2_EXACT_HEAD_QUALIFICATION_V1.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit qualification receipt and retire carrier
        shell: bash
        run: |
          set -euo pipefail
          for path in .github/workflows/zz-*.yml; do
            [[ -e "${path}" ]] && git rm "${path}"
          done
          git config user.name 'Franksudoman'
          git config user.email 'sunfocapital@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m '[exact-head-qualified] ci(plan): record repository qualification'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
