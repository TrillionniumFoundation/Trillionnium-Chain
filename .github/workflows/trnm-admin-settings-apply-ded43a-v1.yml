name: TRNM administrator settings apply ded43a v1

on:
  push:
    branches:
      - ops/admin-settings-apply-ded43a-v1-20260909

permissions:
  contents: read
  issues: write

concurrency:
  group: trnm-admin-settings-apply-ded43a-v1
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and read back exact repository security settings
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.actor == github.triggering_actor &&
      (github.actor == 'ProfHepta' || github.actor == 'Tomasrgbsf' || github.actor == 'Franksudoman' || github.actor == 'ProfAlexQI')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUBJECT_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
      SUBJECT_TREE: c0791ffb57e05fde43f87bfed1a3b4656c09efc0
      EXPECTED_MAIN_SHA: b2d485e5641614ea0ca34ebf80a5f7843ff1e6d9
      ADMIN_TOKEN: ${{ secrets.TRNM_GITHUB_ADMIN_TOKEN || secrets.GH_ADMIN_TOKEN || secrets.ADMIN_GITHUB_TOKEN || secrets.REPOSITORY_ADMIN_TOKEN }}
      COMMENT_TOKEN: ${{ github.token }}
      MUTATION_TICKET: TRNM-RPO-GITHUB-SETTINGS-001-20260909
      VERIFICATION_TICKET: TRNM-RPO-GITHUB-SETTINGS-001-VERIFY-20260909
    steps:
      - name: Check out exact immutable Plan v2 subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact subject, expected main and clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${SUBJECT_TREE}"
          git diff --quiet
          git diff --cached --quiet
          live_main="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          test "${live_main}" = "${EXPECTED_MAIN_SHA}"
          test -n "${MUTATION_TICKET}"
          test -n "${VERIFICATION_TICKET}"
          test "${MUTATION_TICKET}" != "${VERIFICATION_TICKET}"

      - name: Require a real administrator credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"
          actor="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user | jq -r '.login')"
          test -n "${actor}"
          printf '%s\n' "${actor}" > "${RUNNER_TEMP}/admin-actor"

      - name: Replay repository administration contract tests before mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_main_protection_v1.py
          mapfile -t codeql_tests < <(find scripts -type f \( -iname '*codeql*test*.py' -o -iname 'test*codeql*.py' \) -print | sort)
          test "${#codeql_tests[@]}" -gt 0
          for test_file in "${codeql_tests[@]}"; do
            python3 "${test_file}"
          done
          python3 -m compileall -q scripts/admin scripts/ci
          git diff --quiet
          git diff --cached --quiet

      - name: Capture old settings and apply exact fail-closed policy
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/trnm-admin-apply"
          mkdir -p "${root}/before" "${root}/after"
          api() {
            curl --fail-with-body --silent --show-error \
              --connect-timeout 20 --max-time 90 --retry 2 --retry-all-errors \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$@"
          }
          api "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main/protection" \
            > "${root}/before/branch-protection.json"
          api "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets?per_page=100" \
            > "${root}/before/rulesets.json"
          api "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/default-setup" \
            > "${root}/before/codeql-default-setup.json"

          live_main_before="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          test "${live_main_before}" = "${EXPECTED_MAIN_SHA}"

          cat > "${root}/desired-branch-protection.json" <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": [
                "repository-truth",
                "protocol-contract",
                "fuzz-smoke",
                "external-evidence-contract",
                "rust-baseline"
              ]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismissal_restrictions": {},
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": true,
              "required_approving_review_count": 2,
              "require_last_push_approval": true,
              "bypass_pull_request_allowances": {}
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": true,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON

          live_main_pre_put="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          test "${live_main_pre_put}" = "${EXPECTED_MAIN_SHA}"
          api --request PUT \
            -H 'Content-Type: application/json' \
            --data-binary @"${root}/desired-branch-protection.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main/protection" \
            > "${root}/after/branch-protection-put-response.json"
          live_main_post_put="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          test "${live_main_post_put}" = "${EXPECTED_MAIN_SHA}"

          cat > "${root}/desired-codeql-default-setup.json" <<'JSON'
          {
            "state": "configured",
            "languages": ["actions", "javascript-typescript", "python", "rust"],
            "query_suite": "extended",
            "threat_model": "remote_and_local",
            "runner_type": "standard"
          }
          JSON
          api --request PATCH \
            -H 'Content-Type: application/json' \
            --data-binary @"${root}/desired-codeql-default-setup.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/default-setup" \
            > "${root}/after/codeql-patch-response.json"

          live_main_post_patch="$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha')"
          test "${live_main_post_patch}" = "${EXPECTED_MAIN_SHA}"
          validation_run_id="$(jq -r '.run_id // empty' "${root}/after/codeql-patch-response.json")"
          test -n "${validation_run_id}"
          printf '%s\n' "${validation_run_id}" > "${root}/after/codeql-validation-run-id"
          echo "validation_run_id=${validation_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for returned CodeQL validation run without substituting old checks
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/trnm-admin-apply"
          run_id="${{ steps.apply.outputs.validation_run_id }}"
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            run="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            printf '%s\n' "${run}" > "${root}/after/codeql-validation-run.json"
            status="$(jq -r '.status' <<<"${run}")"
            if [[ "${status}" = completed ]]; then
              test "$(jq -r '.conclusion' <<<"${run}")" = success
              exit 0
            fi
            sleep 20
          done
          echo "CodeQL validation run did not complete successfully inside the bounded window" >&2
          exit 1

      - name: Read back and verify every authority-bearing field twice
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/trnm-admin-apply"
          api() {
            curl --fail-with-body --silent --show-error \
              --connect-timeout 20 --max-time 90 --retry 2 --retry-all-errors \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$@"
          }
          snapshot() {
            local suffix="$1"
            api "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main/protection" \
              > "${root}/after/branch-protection-${suffix}.json"
            api "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets?per_page=100" \
              > "${root}/after/rulesets-${suffix}.json"
            api "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/default-setup" \
              > "${root}/after/codeql-default-setup-${suffix}.json"
            api "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              > "${root}/after/main-ref-${suffix}.json"
          }
          snapshot one
          sleep 10
          snapshot two
          diff -u "${root}/after/branch-protection-one.json" "${root}/after/branch-protection-two.json"
          diff -u "${root}/after/rulesets-one.json" "${root}/after/rulesets-two.json"
          diff -u "${root}/after/codeql-default-setup-one.json" "${root}/after/codeql-default-setup-two.json"
          diff -u "${root}/after/main-ref-one.json" "${root}/after/main-ref-two.json"

          protection="${root}/after/branch-protection-two.json"
          codeql="${root}/after/codeql-default-setup-two.json"
          test "$(jq -r '.required_status_checks.strict' "${protection}")" = true
          mapfile -t contexts < <(jq -r '.required_status_checks.contexts[].context // .required_status_checks.contexts[]' "${protection}" | sort)
          expected=(external-evidence-contract fuzz-smoke protocol-contract repository-truth rust-baseline)
          test "${contexts[*]}" = "${expected[*]}"
          test "$(jq -r '.enforce_admins.enabled' "${protection}")" = true
          test "$(jq -r '.required_pull_request_reviews.dismiss_stale_reviews' "${protection}")" = true
          test "$(jq -r '.required_pull_request_reviews.require_code_owner_reviews' "${protection}")" = true
          test "$(jq -r '.required_pull_request_reviews.required_approving_review_count' "${protection}")" = 2
          test "$(jq -r '.required_pull_request_reviews.require_last_push_approval' "${protection}")" = true
          test "$(jq -r '.required_linear_history.enabled' "${protection}")" = true
          test "$(jq -r '.required_conversation_resolution.enabled' "${protection}")" = true
          test "$(jq -r '.allow_force_pushes.enabled' "${protection}")" = false
          test "$(jq -r '.allow_deletions.enabled' "${protection}")" = false

          test "$(jq -r '.state' "${codeql}")" = configured
          mapfile -t languages < <(jq -r '.languages[]' "${codeql}" | sort)
          expected_languages=(actions javascript-typescript python rust)
          test "${languages[*]}" = "${expected_languages[*]}"
          test "$(jq -r '.query_suite' "${codeql}")" = extended
          test "$(jq -r '.threat_model' "${codeql}")" = remote_and_local
          test "$(jq -r '.runner_type' "${codeql}")" = standard
          test "$(jq -r '.object.sha' "${root}/after/main-ref-two.json")" = "${EXPECTED_MAIN_SHA}"

          actor="$(cat "${RUNNER_TEMP}/admin-actor")"
          jq -n \
            --arg schema trnm-admin-settings-apply-evidence-v1 \
            --arg subject_sha "${SUBJECT_SHA}" \
            --arg subject_tree "${SUBJECT_TREE}" \
            --arg main_sha "${EXPECTED_MAIN_SHA}" \
            --arg actor "${actor}" \
            --arg mutation_ticket "${MUTATION_TICKET}" \
            --arg verification_ticket "${VERIFICATION_TICKET}" \
            --arg validation_run_id "${{ steps.apply.outputs.validation_run_id }}" \
            --argjson branch_protection_applied_and_read_back true \
            --argjson codeql_default_setup_applied_and_read_back true \
            --argjson negative_enforcement_corpus_complete false \
            --argjson settings_gate_complete false \
            --argjson all_gaps_closed false \
            '{schema:$schema,subject_sha:$subject_sha,subject_tree:$subject_tree,main_sha:$main_sha,actor:$actor,mutation_ticket:$mutation_ticket,verification_ticket:$verification_ticket,validation_run_id:$validation_run_id,branch_protection_applied_and_read_back:$branch_protection_applied_and_read_back,codeql_default_setup_applied_and_read_back:$codeql_default_setup_applied_and_read_back,negative_enforcement_corpus_complete:$negative_enforcement_corpus_complete,settings_gate_complete:$settings_gate_complete,all_gaps_closed:$all_gaps_closed}' \
            > "${root}/after/evidence.json"
          (
            cd "${root}"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload immutable before/after settings evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-admin-settings-apply-${{ github.run_id }}
          path: ${{ runner.temp }}/trnm-admin-apply/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Publish bounded result to settings blocker
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ env.COMMENT_TOKEN }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/trnm-admin-apply"
          if [[ -s "${root}/after/evidence.json" ]]; then
            actor="$(jq -r '.actor' "${root}/after/evidence.json")"
            validation="$(jq -r '.validation_run_id' "${root}/after/evidence.json")"
            result=true
          else
            actor="unresolved"
            validation="unresolved"
            result=false
          fi
          cat > "${RUNNER_TEMP}/settings-comment.md" <<EOF
          <!-- trnm-admin-settings-apply-ded43a-v1 -->
          ## Live security-settings application result

          - subject: \`${SUBJECT_SHA}\` / \`${SUBJECT_TREE}\`
          - frozen main: \`${EXPECTED_MAIN_SHA}\`
          - authenticated administrator: \`${actor}\`
          - apply/readback complete: \`${result}\`
          - returned CodeQL validation run: \`${validation}\`
          - normal-actor negative enforcement corpus complete: \`false\`
          - full settings gate closed: \`false\`

          Complete before/after responses and hashes are retained in workflow run
          \`${GITHUB_RUN_ID}\`. No production, testnet, release or activation authority is
          created. The settings Gate remains open until the independent normal-actor
          rejection corpus is completed on the stable configuration.
          EOF
          jq -n --rawfile body "${RUNNER_TEMP}/settings-comment.md" '{body:$body}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/40/comments" --input -

      - name: Verify immutable subject source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${SUBJECT_TREE}"
          git diff --quiet
          git diff --cached --quiet
