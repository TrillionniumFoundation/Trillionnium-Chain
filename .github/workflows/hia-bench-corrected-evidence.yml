name: hia-bench-corrected-evidence
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/chain-hia-native]
permissions:
  contents: read
concurrency:
  group: hia-bench-corrected-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
  TRNM_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
jobs:
  corrected-bench-raw:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/chain-hia-native')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          persist-credentials: false
      - name: Checkout pinned HIA compiler source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: hia-toolchain
          persist-credentials: false
          sparse-checkout: |
            hepta
            tools
            examples
            docs
            tests
            formal
      - name: Verify checkout and bootstrap exact self-host compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
          bash scripts/project-preflight.sh --audit
          export HIA_TOOLCHAIN_ROOT="$GITHUB_WORKSPACE/hia-toolchain"
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/bench-corrected-bootstrap"
          python3 - "$RUNNER_TEMP/bench-corrected-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, os, sys
          with open(sys.argv[1]) as source:
              info = json.load(source)
          expected = '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54'
          if info.get('status') != 'PASS' or info.get('compiler_sha256') != expected or not info.get('compiler'):
              raise SystemExit('Bench native compiler identity differs')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_TOOLCHAIN_ROOT=' + os.environ['HIA_TOOLCHAIN_ROOT'] + '\n')
              out.write('HIA_NATIVE_COMPILER=' + info['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + expected + '\n')
          PY
      - name: Fetch unchanged locked Cargo graph for the offline tests
        run: cargo fetch --locked --manifest-path trillionnium/Cargo.toml
      - name: Execute the four corrected Bench methods and seal the allowlist
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/hia-bench-corrected"
          scope=(--head "$TRNM_EXPECTED_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT")
          python3 -B hia/tools/bench_corrected_evidence.py run "${scope[@]}" \
            --capture "$base/raw-capture" --qualification "$base/completion.json"
          python3 -B hia/tools/bench_corrected_evidence.py collect "${scope[@]}" \
            --capture "$base/raw-capture" --qualification "$base/completion.json" --archive "$base/carrier/corrected-bench.zip"
      - name: Read back the exact isolated corrected-Bench ZIP
        run: |
          set -euo pipefail
          python3 -B -m unittest scripts.ci.test_bench_corrected_evidence -v
          base="$RUNNER_TEMP/hia-bench-corrected"
          python3 -B hia/tools/bench_corrected_evidence.py verify \
            --head "$TRNM_EXPECTED_SOURCE_SHA" --tree "$(git rev-parse HEAD^{tree})" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --qualification "$base/completion.json" --archive "$base/carrier/corrected-bench.zip"
          cp "$base/completion.json" "$base/carrier/completion.json"
      - name: Retain only the bounded corrected Bench carrier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-bench-corrected-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-bench-corrected/carrier/corrected-bench.zip
            ${{ runner.temp }}/hia-bench-corrected/carrier/completion.json
          if-no-files-found: error
          retention-days: 30
