name: trnm-a23-native-replay-floor-implement

on:
  push:
    branches:
      - feature/chain-a23-p2-native-replay-floor-v1-20260831
    paths:
      - .github/workflows/trnm-a23-native-replay-floor-implement.yml

permissions:
  contents: write

concurrency:
  group: trnm-a23-native-replay-floor-implement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-native-replay-floor:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-a23-p2-native-replay-floor-v1-20260831' &&
      github.actor == 'Tomasrgbsf'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact A23 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-a23-p2-native-replay-floor-v1-20260831
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable implementation lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bfb0287cef0e0bd2b8c9a99df8c23eb502a611a4"
          test "$(git rev-parse HEAD^^)" = "692c49bbde3cdfe199d014d13992c844d4a4213c"
          git merge-base --is-ancestor 2384e7e4ceb1fe63a0f29e91dab274d74940a8d3 HEAD

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0

      - name: Apply exact source patch
        run: |
          set -euo pipefail
          python3 -B -m py_compile scripts/ci/a23_implement_native_replay_floor_v1.py
          python3 -B scripts/ci/a23_implement_native_replay_floor_v1.py
          sed -i "s/__A23_IMPLEMENTATION_PARENT__/$(git rev-parse HEAD)/" \
            .github/workflows/trnm-a23-native-replay-floor-verify.yml
          test -z "$(grep -R '__A23_IMPLEMENTATION_PARENT__' \
            .github/workflows/trnm-a23-native-replay-floor-verify.yml || true)"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git diff --check

      - name: Run focused implementation regressions
        run: |
          set -euo pipefail
          cargo check --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-execution-v0 --all-targets --locked
          cargo check --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal --all-targets --locked
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-execution-v0 \
            finalized_commit_adapter_runs_signed_tx_to_state_proof_and_reopen_v0 --locked
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal \
            native_replay_floor_purges_only_strictly_finalized_contiguous_prefix_v1 --locked
          python3 -B scripts/ci/a22_capability_authority_audit_v1.py

      - name: Remove temporary write surfaces and publish candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trnm-a23-native-replay-floor-inventory.yml
          git rm .github/workflows/trnm-a23-native-replay-floor-implement.yml
          git rm scripts/ci/a23_implement_native_replay_floor_v1.py
          git add -A
          git diff --cached --check
          git commit -m "feat(tx): bind tombstone purge to native replay floor"
          git push origin "HEAD:feature/chain-a23-p2-native-replay-floor-v1-20260831"
