name: PoCO qualified external orchestration R18 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-qualified-external-orchestration-r18-once-20260910.yml

concurrency:
  group: poco-only-final-convergence
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pull-requests: read

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r18-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"

jobs:
  converge:
    name: Qualify repository closure and execute available external campaigns
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned qualification tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep jq
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked

      - name: Complete native-only product materialization when required
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/temporary_poco_convergence_r13.sh ]]; then
            cat > tools/temporary_poco_r13_postfix.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import pathlib

          ROOT = pathlib.Path(__file__).resolve().parents[1]

          def patch_raw_key_boundary() -> None:
              path = ROOT / "trillionnium/crates/trnm-poco-node/tests/raw_key_boundary.rs"
              text = path.read_text(encoding="utf-8")
              begin = text.find('        if relative == "src/recovery_tests.rs" {')
              marker = "            continue;\n        }\n"
              end = text.find(marker, begin)
              if begin < 0 or end < 0:
                  raise RuntimeError("recovery raw-key assertion block drift")
              end += len(marker)
              replacement = '''        if relative == "src/recovery_tests.rs" {
                      let compact_lib: String = lib.chars().filter(|ch| !ch.is_whitespace()).collect();
                      assert!(
                          compact_lib.contains(
                              "#[cfg(all(test,feature=\\\"recovery-process-test-support\\\",target_os=\\\"linux\\\"))]modrecovery_tests;"
                          ),
                          "recovery raw-key module lost its test/fixture gate"
                      );
                      continue;
                  }
          '''
              path.write_text(text[:begin] + replacement + text[end:], encoding="utf-8")

          def remove_unused_codec_constant() -> None:
              path = ROOT / "trillionnium/crates/trnm-native-execution-v0/src/store.rs"
              text = path.read_text(encoding="utf-8")
              definition = "const AUTH_TREE_SNAPSHOT_CODEC_VERSION_V0: u16 = 1;\n"
              if text.count(definition) != 1:
                  raise RuntimeError("snapshot codec definition drift")
              path.write_text(text.replace(definition, "", 1), encoding="utf-8")

          def main() -> int:
              patch_raw_key_boundary()
              remove_unused_codec_constant()
              pathlib.Path(__file__).unlink()
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
            python3 - <<'PY'
          from pathlib import Path

          native = Path("tools/temporary_poco_native_convergence_r13.py")
          text = native.read_text(encoding="utf-8")
          write = '    tests_path.write_text(text, encoding="utf-8")\n'
          repair = (
              '    stripped = text.rstrip()\n'
              '    orphan = "#[test]"\n'
              '    if stripped.endswith(orphan):\n'
              '        text = stripped[: -len(orphan)].rstrip() + "\\n"\n'
          )
          if repair not in text:
              if text.count(write) != 1:
                  raise SystemExit("obsolete differential test cleanup drift")
              text = text.replace(write, repair + write, 1)
          native.write_text(text, encoding="utf-8")

          shell = Path("tools/temporary_poco_convergence_r13.sh")
          script = shell.read_text(encoding="utf-8")
          call = "python3 tools/temporary_poco_native_convergence_r13.py\n"
          postfix = "python3 tools/temporary_poco_r13_postfix.py\n"
          if postfix not in script:
              if script.count(call) != 1:
                  raise SystemExit("native-transform invocation drift")
              script = script.replace(call, call + postfix, 1)
          anchor = "  .github/workflows/poco-only-convergence-r13-once-20260910.yml \\\n"
          for path in (
              ".github/workflows/poco-only-convergence-r14-once-20260910.yml",
              ".github/workflows/poco-only-convergence-r15-once-20260910.yml",
              ".github/workflows/poco-repository-gap-convergence-r16-once-20260910.yml",
              ".github/workflows/poco-exact-gap-convergence-r17-once-20260910.yml",
              ".github/workflows/poco-qualified-external-orchestration-r18-once-20260910.yml",
          ):
              line = f"  {path} \\\n"
              if line not in script:
                  if anchor not in script:
                      raise SystemExit("temporary cleanup anchor drift")
                  script = script.replace(anchor, anchor + line, 1)
          shell.write_text(script, encoding="utf-8")
          PY
            python3 -m py_compile \
              tools/temporary_poco_native_convergence_r13.py \
              tools/temporary_poco_r13_postfix.py
            bash -n tools/temporary_poco_convergence_r13.sh
            CARGO_TARGET_DIR=/tmp/trnm-r18-target \
              bash tools/temporary_poco_convergence_r13.sh
          fi
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Materialize immutable controller-free candidate
        id: product
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/poco-only-convergence-r14-once-20260910.yml \
            .github/workflows/poco-only-convergence-r15-once-20260910.yml \
            .github/workflows/poco-repository-gap-convergence-r16-once-20260910.yml \
            .github/workflows/poco-exact-gap-convergence-r17-once-20260910.yml \
            .github/workflows/poco-qualified-external-orchestration-r18-once-20260910.yml \
            tools/temporary_poco_r13_postfix.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git add -A
          git diff --cached --check
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git config user.name "Qian QI"
            git config user.email "102159240+ProfHepta@users.noreply.github.com"
            git commit -m "ci: remove completed PoCO convergence controllers"
          fi
          FINAL_COMMIT="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
          rm -rf /tmp/trnm-r18-final
          git worktree add --detach /tmp/trnm-r18-final "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r18-final rev-parse HEAD)" = "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r18-final rev-parse 'HEAD^{tree}')" = "$FINAL_TREE"
          test -z "$(git -C /tmp/trnm-r18-final status --porcelain --untracked-files=all)"
          echo "commit=$FINAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$FINAL_TREE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$FINAL_COMMIT" >/tmp/trnm-r18-final-commit.txt
          printf '%s\n' "$FINAL_TREE" >/tmp/trnm-r18-final-tree.txt

      - name: Run exact repository truth and collect convergence reports
        working-directory: /tmp/trnm-r18-final
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tools formal conformance
          python3 scripts/ci/check_native_consensus_only.py \
            | tee /tmp/trnm-r18-native-only.json
          bash scripts/ci/check_canonical_development_plan.sh \
            | tee /tmp/trnm-r18-canonical-plan.log
          bash scripts/ci/check_poco_bft_mainline_truth.sh \
            | tee /tmp/trnm-r18-mainline.log
          python3 scripts/ci/check_repository_truth_v1.py \
            | tee /tmp/trnm-r18-repository-truth.json
          python3 scripts/ci/check_required_protocol_contract_v1.py \
            | tee /tmp/trnm-r18-protocol-contract.json
          : >/tmp/trnm-r18-convergence-reports.log
          for candidate in \
            scripts/ci/*technical*convergence*.py \
            scripts/ci/*technical*convergence*.sh \
            scripts/ci/*documentation*integrity*.py \
            scripts/ci/*documentation*integrity*.sh \
            scripts/ci/*module*coverage*.py \
            scripts/ci/*module*coverage*.sh
          do
            [[ -f "$candidate" ]] || continue
            echo "=== $candidate ===" | tee -a /tmp/trnm-r18-convergence-reports.log
            case "$candidate" in
              *.py) python3 "$candidate" ;;
              *.sh) bash "$candidate" ;;
            esac 2>&1 | tee -a /tmp/trnm-r18-convergence-reports.log
          done
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Classify every open marker without hiding repository work
        id: gaps
        working-directory: /tmp/trnm-r18-final
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="${{ steps.product.outputs.commit }}"
          export SOURCE_TREE="${{ steps.product.outputs.tree }}"
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path.cwd()
          external_ids = {
              "EXT-ANCHOR-HSM-001",
              "EXT-AUDIT-001",
              "EXT-G1-CAMPAIGN-001",
              "EXT-POWERLOSS-001",
              "EXT-REVIEW-001",
              "EXT-SOAK-ACTIVATION-001",
          }
          external_terms = {
              "hsm", "hardware", "independent", "reviewer", "review",
              "audit", "auditor", "power-loss", "power loss", "sigkill",
              "soak", "multihost", "multi-host", "campaign", "self-hosted",
              "external evidence", "external gate", "production activation",
              "release readiness", "long-run", "fuzz", "operator ceremony",
          }
          canonical_files = [
              root / "docs/development/CURRENT_SNAPSHOT_V1.json",
              root / "docs/development/TRNM_AI_NATIVE_BLOCKCHAIN_DEVELOPMENT_PLAN.md",
              root / "docs/development/module-registry-v1.toml",
              root / "docs/development/plan-manifest-v1.toml",
              root / "docs/development/release-train-v1.toml",
          ]
          marker_re = re.compile(
              r"\b(?:G[0-9][A-Za-z0-9._-]*|P[0-9][A-Za-z0-9._-]*)"
              r"[-_:](?:incomplete|open|missing|blocked)\b",
              re.IGNORECASE,
          )
          repository = []
          external = []
          for path in canonical_files:
              if not path.is_file():
                  continue
              lines = path.read_text(encoding="utf-8").splitlines()
              for index, line in enumerate(lines):
                  markers = sorted(set(match.group(0) for match in marker_re.finditer(line)))
                  if not markers:
                      continue
                  context = "\n".join(lines[max(0, index - 8): min(len(lines), index + 9)])
                  lowered = context.casefold()
                  row = {
                      "path": path.relative_to(root).as_posix(),
                      "line": index + 1,
                      "markers": markers,
                      "text": line.strip()[:1200],
                      "classification_basis": [],
                  }
                  ids = sorted(identifier for identifier in external_ids if identifier in context)
                  terms = sorted(term for term in external_terms if term in lowered)
                  if ids or terms:
                      row["classification_basis"] = ids + terms
                      external.append(row)
                  else:
                      row["classification_basis"] = ["no authenticated external dependency found"]
                      repository.append(row)

          reports = pathlib.Path("/tmp/trnm-r18-convergence-reports.log").read_text(
              encoding="utf-8", errors="replace"
          )
          implementation_exists = (
              '"source_regression_case_count": 0' not in reports
              and '"source_regression_case_count":' in reports
          )
          independent_vectors_absent = (
              '"independent_golden_vector_count": 0' in reports
          )
          operation_catalog_external = implementation_exists and independent_vectors_absent
          if '"operation_catalog_complete": false' in reports and not operation_catalog_external:
              repository.append({
                  "path": "/tmp/trnm-r18-convergence-reports.log",
                  "line": 0,
                  "markers": ["operation-catalog-incomplete"],
                  "text": "operation catalog is incomplete without evidence that only independent acceptance remains",
                  "classification_basis": ["repository implementation completeness not proven"],
              })
          elif '"operation_catalog_complete": false' in reports:
              external.append({
                  "path": "/tmp/trnm-r18-convergence-reports.log",
                  "line": 0,
                  "markers": ["operation-catalog-independent-acceptance-open"],
                  "text": "source regressions exist but independent golden vectors are absent",
                  "classification_basis": ["independent_golden_vector_count=0"],
              })

          report = {
              "schema": "trnm-poco-gap-classification-r18-v1",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_tree": os.environ["SOURCE_TREE"],
              "repository_owned": repository,
              "external_evidence_owned": external,
              "external_blocker_ids": sorted(external_ids),
              "repository_gap_count": len(repository),
              "external_gap_count": max(len(external), len(external_ids)),
              "operation_catalog_external_acceptance_only": operation_catalog_external,
          }
          pathlib.Path("/tmp/trnm-r18-gap-classification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          summary = [
              f"source_commit={report['source_commit']}",
              f"source_tree={report['source_tree']}",
              f"repository_gap_count={report['repository_gap_count']}",
              f"external_gap_count={report['external_gap_count']}",
              f"operation_catalog_external_acceptance_only={str(operation_catalog_external).lower()}",
          ]
          for row in repository:
              summary.append(f"REPOSITORY {row['path']}:{row['line']} {row['text']}")
          for row in external:
              summary.append(f"EXTERNAL {row['path']}:{row['line']} {row['text']}")
          pathlib.Path("/tmp/trnm-r18-gap-summary.txt").write_text(
              "\n".join(summary) + "\n", encoding="utf-8"
          )
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"repository_gap_count={len(repository)}\n")
              output.write(f"external_gap_count={max(len(external), len(external_ids))}\n")
          print(json.dumps({
              "repository_gap_count": len(repository),
              "external_gap_count": max(len(external), len(external_ids)),
          }, sort_keys=True))
          PY
          if [[ "${{ steps.gaps.outputs.repository_gap_count }}" != "0" ]]; then
            cat /tmp/trnm-r18-gap-summary.txt >&2
            exit 3
          fi

      - name: Compile every workspace and contract target
        working-directory: /tmp/trnm-r18-final
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARGO_TARGET_DIR"
          cargo check --manifest-path trillionnium/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r18-workspace-check.log
          cargo check --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r18-contract-check.log

      - name: Execute complete workspace and contract corpus
        working-directory: /tmp/trnm-r18-final
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 7200s \
            cargo test --manifest-path trillionnium/Cargo.toml \
              --workspace --all-targets --locked --offline --no-fail-fast -j 1 -- \
              --test-threads=1 \
            2>&1 | tee /tmp/trnm-r18-workspace-test.log
          cargo test --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r18-contract-test.log
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute strict production-boundary Clippy
        working-directory: /tmp/trnm-r18-final
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 -- -D warnings \
            2>&1 | tee /tmp/trnm-r18-contract-clippy.log
          cd trillionnium
          : >/tmp/trnm-r18-boundary-clippy.log
          for package in \
            trnm-state trnm-consensus-types trnm-consensus-crypto \
            trnm-consensus-core trnm-consensus-safety-rules \
            trnm-consensus-safety-store trnm-consensus-signer-journal \
            trnm-native-application trnm-native-application-sqlite \
            trnm-native-execution-v0 trnm-durable-file-adapters-v0 \
            trnm-tx-lifecycle-v0 trnm-state-sync-v0 trnm-migration-v0 \
            trnm-control-plane-v0 trnm-release-bundle-v0 trnm-node-boundary-v0 \
            trnm-poco-node-production-v0 trnm-production-adapter-conformance-v0 \
            trnm-poco-node trnm-poco-node-authority trnm-poco-node-io \
            trnm-poco-node-host trnm-poco-node-cli
          do
            echo "strict-clippy package=${package}" | tee -a /tmp/trnm-r18-boundary-clippy.log
            cargo clippy -p "$package" --all-targets --locked --offline -j 1 -- -D warnings \
              2>&1 | tee -a /tmp/trnm-r18-boundary-clippy.log
          done
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish exact repository-qualified commit
        working-directory: /tmp/trnm-r18-final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.product.outputs.commit }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ steps.product.outputs.tree }}"
          python3 scripts/ci/check_native_consensus_only.py
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE" push origin \
            "${{ steps.product.outputs.commit }}:refs/heads/$TARGET_BRANCH"

      - name: Discover and dispatch compatible external evidence workflows
        id: dispatch
        if: steps.gaps.outputs.external_gap_count != '0'
        working-directory: /tmp/trnm-r18-final
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="${{ steps.product.outputs.commit }}"
          export SOURCE_TREE="${{ steps.product.outputs.tree }}"
          export REPOSITORY="$GITHUB_REPOSITORY"
          export BRANCH="$TARGET_BRANCH"
          python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.parse

          root = pathlib.Path.cwd()
          keywords = (
              "external", "evidence", "hsm", "audit", "power", "soak",
              "campaign", "multihost", "multi-host", "long-fuzz", "review",
          )
          exact_commit = os.environ["SOURCE_COMMIT"]
          exact_tree = os.environ["SOURCE_TREE"]
          branch = os.environ["BRANCH"]
          repository = os.environ["REPOSITORY"]
          self_path = ".github/workflows/poco-qualified-external-orchestration-r18-once-20260910.yml"
          dispatched = []
          skipped = []

          for path in sorted((root / ".github/workflows").glob("*.y*ml")):
              relative = path.relative_to(root).as_posix()
              if relative == self_path:
                  continue
              text = path.read_text(encoding="utf-8")
              lowered = (relative + "\n" + text[:3000]).casefold()
              if "workflow_dispatch" not in text or not any(word in lowered for word in keywords):
                  continue
              required_inputs = []
              for match in re.finditer(r"(?m)^\s{6}([A-Za-z0-9_-]+):\s*$", text):
                  name = match.group(1)
                  tail = text[match.end(): match.end() + 700]
                  if re.search(r"(?m)^\s{8}required:\s*true\s*$", tail):
                      required_inputs.append(name)
              values = {
                  "source_commit": exact_commit,
                  "source_sha": exact_commit,
                  "commit": exact_commit,
                  "head_sha": exact_commit,
                  "source_tree": exact_tree,
                  "tree": exact_tree,
                  "tree_sha": exact_tree,
                  "branch": branch,
                  "ref": branch,
                  "target_branch": branch,
              }
              unknown = [name for name in required_inputs if name not in values]
              if unknown:
                  skipped.append({"workflow": relative, "reason": "unknown-required-input", "inputs": unknown})
                  continue
              payload = {"ref": branch}
              inputs = {name: values[name] for name in required_inputs}
              if inputs:
                  payload["inputs"] = inputs
              endpoint = (
                  f"repos/{repository}/actions/workflows/"
                  f"{urllib.parse.quote(path.name, safe='')}/dispatches"
              )
              command = ["gh", "api", "--method", "POST", endpoint, "--input", "-"]
              completed = subprocess.run(
                  command,
                  cwd=root,
                  input=json.dumps(payload),
                  text=True,
                  capture_output=True,
              )
              if completed.returncode == 0:
                  dispatched.append({"workflow": relative, "inputs": inputs})
              else:
                  skipped.append({
                      "workflow": relative,
                      "reason": "dispatch-failed",
                      "stderr": completed.stderr[-2000:],
                  })

          report = {
              "schema": "trnm-poco-external-dispatch-r18-v1",
              "source_commit": exact_commit,
              "source_tree": exact_tree,
              "dispatched": dispatched,
              "skipped": skipped,
              "created_at": dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          pathlib.Path("/tmp/trnm-r18-external-dispatch.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"dispatched_count={len(dispatched)}\n")
          print(json.dumps({"dispatched_count": len(dispatched), "skipped_count": len(skipped)}, sort_keys=True))
          PY

      - name: Re-evaluate authenticated external evidence
        if: always()
        working-directory: /tmp/trnm-r18-final
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_external_evidence_v1.py
          set +e
          python3 scripts/ci/check_external_evidence_v1.py --require-all \
            --source-commit "${{ steps.product.outputs.commit }}" \
            --source-tree "${{ steps.product.outputs.tree }}" \
            --output /tmp/trnm-r18-external-evidence.json \
            >/tmp/trnm-r18-external-evidence.stdout \
            2>/tmp/trnm-r18-external-evidence.stderr
          rc=$?
          set -e
          printf 'external_evidence_exit=%s\n' "$rc" | tee /tmp/trnm-r18-external-evidence-status.txt
          if [[ "$rc" -eq 0 ]]; then
            exit 0
          fi
          test "$rc" -eq 2
          grep -q "external evidence gate remains open" /tmp/trnm-r18-external-evidence.stderr
          exit 2

      - name: Upload exact R18 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r18-qualified-external-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
