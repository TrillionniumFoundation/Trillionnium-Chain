name: rust-l1-testnet-preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'trillionnium/**'
      - 'scripts/ci/check_cargo_offline_ready.sh'
      - 'scripts/ci/check_cargo_offline_unchanged.sh'
      - 'scripts/ci/check_preprovisioned_rust_toolchain.sh'
      - '.github/workflows/rust-l1-testnet-preflight.yml'

permissions:
  contents: read

concurrency:
  group: rust-l1-testnet-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' ||
        (github.actor == 'ProfAlexQI' &&
         github.triggering_actor == 'ProfAlexQI' &&
         (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_NUMERIC: C
      LC_COLLATE: C
      LC_TIME: C
      LC_CTYPE: C
      LC_MESSAGES: C
      LC_MONETARY: C
      LC_MEASUREMENT: C
      LC_NAME: C
      LC_PAPER: C
      LC_ADDRESS: C
      LC_TELEPHONE: C
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "UTF-8"
      PYTHONUTF8: "1"
      CI: "true"
      SOURCE_DATE_EPOCH: "1704067200"
      RUST_TEST_THREADS: "1"
      TRNM_CARGO_OFFLINE_POLICY: "required"
      CARGO_NET_OFFLINE: "true"
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify runner-provisioned Rust toolchain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0

      - name: Verify Cargo offline cache readiness
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock

      - name: Run testnet preflight
        run: |
          set -euo pipefail
          cd trillionnium
          ./scripts/testnet_preflight.sh

      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-l1-testnet-preflight-${{ github.run_id }}
          path: |
            trillionnium/run/preflight/**
            trillionnium/run/audit/**
            trillionnium/run/bench/**
            trillionnium/run/node*.log
            trillionnium/run/parallel-sanity.log
          if-no-files-found: warn

      - name: Verify Cargo offline inputs remained unchanged
        if: always()
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"
