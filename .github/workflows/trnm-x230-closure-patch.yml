name: TRNM apply X230 closure artifact once

on:
  push:
    branches:
      - integration/native-poco-a04-a19-a23-qualified-v1-20260901
    paths:
      - .github/workflows/trnm-x230-closure-patch.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: trnm-apply-x230-closure-artifact-once
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf') &&
      github.triggering_actor == github.actor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/native-poco-a04-a19-a23-qualified-v1-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Download and verify the immutable X230 patch artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/trnm-x230-closure.zip"
          artifact_root="$RUNNER_TEMP/trnm-x230-closure"
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/TrillionniumFoundation/Trillionnium-Chain/actions/artifacts/9794890759/zip" \
            --output "$artifact_zip"
          printf '%s  %s\n' \
            d9d0e75f7310ba06ea08223c47a0d1aff03e43fc943216f39a5b22a41219060d \
            "$artifact_zip" | sha256sum --check --strict
          mkdir -p "$artifact_root"
          unzip -q "$artifact_zip" -d "$artifact_root"
          cd "$artifact_root"
          cat > "$RUNNER_TEMP/trnm-x230-files.sha256" <<'EOF'
          c4a9221922641336265e324f974f79f267c6dbf425afad5c36cd9a2ce874d0b4  .github/workflows/trnm-cometbft-spike.yml
          c0c8939df55e3d286d52afd82dba7f44491d1b421165d95d3886566ee29aeef9  .github/workflows/trnm-gate-quick-check.yml
          083ed744e1b1ffa3fb60fbf9bc32a384ed52bfcb2e1e38ad776fb0bc20aac5bd  .github/workflows/trnm-merge-gates.yml
          7a3b99140c6ac9934ca7659e53483ac822ed68976af1725bbe1a27a0923f53cc  .github/workflows/trnm-poco-bft-v0.yml
          f856eaedb0fd390f2a7d47c98efbe7f69ba17669257653803068758dbb089a55  trillionnium/fuzz/Cargo.lock
          EOF
          sha256sum --check --strict "$RUNNER_TEMP/trnm-x230-files.sha256"

      - name: Apply exact files and encode least-privilege guard classes
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/trnm-x230-closure"
          install -m 0644 "$artifact_root/.github/workflows/trnm-cometbft-spike.yml" \
            .github/workflows/trnm-cometbft-spike.yml
          install -m 0644 "$artifact_root/.github/workflows/trnm-gate-quick-check.yml" \
            .github/workflows/trnm-gate-quick-check.yml
          install -m 0644 "$artifact_root/.github/workflows/trnm-merge-gates.yml" \
            .github/workflows/trnm-merge-gates.yml
          install -m 0644 "$artifact_root/.github/workflows/trnm-poco-bft-v0.yml" \
            .github/workflows/trnm-poco-bft-v0.yml
          install -m 0644 "$artifact_root/trillionnium/fuzz/Cargo.lock" \
            trillionnium/fuzz/Cargo.lock
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_ci_runner_policy.sh")
          text = path.read_text(encoding="utf-8")

          standard_marker = """PAYLOAD_GUARD = (
          """
          maintainer_guard = """MAINTAINER_GUARD = (
              "github.repository == 'TrillionniumFoundation/Trillionnium-Chain' && "
              "(github.event_name == 'schedule' || ((github.actor == 'ProfAlexQI' || "
              "github.actor == 'Tomasrgbsf') && github.triggering_actor == github.actor && "
              "(github.event_name != 'pull_request' || "
              "github.event.pull_request.head.repo.full_name == github.repository)))"
          )

          """
          if text.count(standard_marker) != 1 or "MAINTAINER_GUARD = (" in text:
              raise SystemExit("unexpected standard guard policy shape")
          text = text.replace(standard_marker, maintainer_guard + standard_marker, 1)

          poco_marker = """P1_GUARD = (
          """
          poco_maintainer_guard = """POCO_MAINTAINER_GUARD = (
              "github.repository == 'TrillionniumFoundation/Trillionnium-Chain' && "
              "(github.event_name == 'schedule' && github.ref == 'refs/heads/main' || "
              "((github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf') && "
              "github.triggering_actor == github.actor && "
              "(github.event_name != 'pull_request' || "
              "github.event.pull_request.head.repo.full_name == github.repository)))"
          )

          """
          if text.count(poco_marker) != 1 or "POCO_MAINTAINER_GUARD = (" in text:
              raise SystemExit("unexpected PoCo guard policy shape")
          text = text.replace(poco_marker, poco_maintainer_guard + poco_marker, 1)

          old = '''def required_guard(name: str) -> str:
              if name in {
                  "trnm-payload-replay-recovery-v1.yml",
                  "trnm-replay-to-core-coordinator-v1.yml",
                  "trnm-p2-node-candidate-devnet-cli.yml",
              }:
                  return PAYLOAD_GUARD
              if name == "trnm-poco-bft-v0.yml":
                  return POCO_GUARD
              if name == "p1-rust-sidecar.yml":
                  return P1_GUARD
              return STANDARD_GUARD
          '''
          new = '''def required_guard(name: str) -> str:
              if name in {
                  "trnm-payload-replay-recovery-v1.yml",
                  "trnm-replay-to-core-coordinator-v1.yml",
                  "trnm-p2-node-candidate-devnet-cli.yml",
              }:
                  return PAYLOAD_GUARD
              if name == "trnm-poco-bft-v0.yml":
                  return POCO_MAINTAINER_GUARD
              if name == "p1-rust-sidecar.yml":
                  return P1_GUARD
              if name in {
                  "trnm-canonical-input-fuzz-smoke.yml",
                  "trnm-cometbft-spike.yml",
                  "trnm-gate-quick-check.yml",
                  "trnm-merge-gates.yml",
              }:
                  return MAINTAINER_GUARD
              return STANDARD_GUARD
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one legacy required_guard function")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git rm \
            .github/workflows/trnm-fuzz-lock-refresh.yml \
            .github/workflows/trnm-guard-patch-evidence.yml \
            .github/workflows/trnm-x230-closure-patch.yml

      - name: Validate the final worktree before commit
        run: |
          set -euo pipefail
          bash scripts/check_ci_runner_policy.sh --worktree
          bash scripts/check_cargo_offline_policy.sh --worktree
          git diff --check

      - name: Commit the immutable closure set and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/trnm-cometbft-spike.yml \
            .github/workflows/trnm-gate-quick-check.yml \
            .github/workflows/trnm-merge-gates.yml \
            .github/workflows/trnm-poco-bft-v0.yml \
            scripts/check_ci_runner_policy.sh \
            trillionnium/fuzz/Cargo.lock
          mapfile -t changed < <(git diff --cached --name-only | LC_ALL=C sort)
          expected=(
            .github/workflows/trnm-cometbft-spike.yml
            .github/workflows/trnm-fuzz-lock-refresh.yml
            .github/workflows/trnm-gate-quick-check.yml
            .github/workflows/trnm-guard-patch-evidence.yml
            .github/workflows/trnm-merge-gates.yml
            .github/workflows/trnm-poco-bft-v0.yml
            .github/workflows/trnm-x230-closure-patch.yml
            scripts/check_ci_runner_policy.sh
            trillionnium/fuzz/Cargo.lock
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          git diff --cached --check
          git commit -m 'ci: apply verified X230 lock and trusted guard closure set'
          git push origin HEAD:integration/native-poco-a04-a19-a23-qualified-v1-20260901
