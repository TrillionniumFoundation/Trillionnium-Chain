name: lifecycle-smoke-observability

on:
  push:
    branches: [main]
    paths:
      - 'chain/tools/*.sh'
      - 'chain/tools/examples/*.json'
      - 'chain/tools/LIFECYCLE_SUMMARY_SCHEMA_CONTRACT.md'
      - '.github/workflows/lifecycle-smoke-observability.yml'
  pull_request:
    paths:
      - 'chain/tools/*.sh'
      - 'chain/tools/examples/*.json'
      - 'chain/tools/LIFECYCLE_SUMMARY_SCHEMA_CONTRACT.md'
      - '.github/workflows/lifecycle-smoke-observability.yml'

jobs:
  shell-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq
        run: |
          if command -v jq >/dev/null 2>&1; then
            jq --version
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y jq
          jq --version

      - name: Shellcheck tools
        run: |
          shellcheck chain/tools/lifecycle_smoke.sh \
            chain/tools/lifecycle_smoke_observability_test.sh \
            chain/tools/lifecycle_summary_parser_examples_test.sh \
            chain/tools/lifecycle_summary_fixture_consistency_test.sh \
            chain/tools/lifecycle_summary_contract_sync_test.sh \
            chain/tools/demo_denom_governance_flow.sh

      - name: Bash syntax checks
        run: |
          bash -n chain/tools/lifecycle_smoke.sh
          bash -n chain/tools/lifecycle_smoke_observability_test.sh
          bash -n chain/tools/lifecycle_summary_parser_examples_test.sh
          bash -n chain/tools/lifecycle_summary_fixture_consistency_test.sh
          bash -n chain/tools/lifecycle_summary_contract_sync_test.sh
          bash -n chain/tools/demo_denom_governance_flow.sh

      - name: Lifecycle schema contract self-check (quick)
        run: SELF_CHECK_MODE=schema-contract bash chain/tools/lifecycle_smoke_observability_test.sh

      - name: Lifecycle parser examples
        run: bash chain/tools/lifecycle_summary_parser_examples_test.sh

      - name: Lifecycle fixture consistency
        run: bash chain/tools/lifecycle_summary_fixture_consistency_test.sh

      - name: Lifecycle contract markdown/json sync
        run: bash chain/tools/lifecycle_summary_contract_sync_test.sh

      - name: Lifecycle observability regression (full)
        if: github.event_name == 'push'
        run: bash chain/tools/lifecycle_smoke_observability_test.sh
