              "trusted_return_after_post_close_revalidation = true\n"
              "fresh_connection_schema_revalidation = true\n"
              "wal_shm_identity_pinning = true\n"
          )
          if anchor not in cargo:
              raise SystemExit("cargo metadata anchor missing")
          cargo_path.write_text(cargo.replace(anchor, replacement, 1), encoding="utf-8")
          PY

      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format and test the repaired authority boundary
        working-directory: trillionnium-chain/trillionnium
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked -p trnm-native-application-sqlite --all-targets
          cargo clippy --locked -p trnm-native-application-sqlite --all-targets -- -D warnings
          cargo test --locked -p trnm-native-execution-v0 --all-targets
          cargo check --locked -p trnm-poco-node --all-targets

      - name: Amend the carrier without retaining the temporary workflow
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          rm .github/workflows/trnm-plan-v2-p0-finalization-history-closure.yml
          git diff --check
          git config user.name "trillionnium-closure-bot"
          git config user.email "trillionnium-closure-bot@users.noreply.github.com"
          git add -A
          git commit --amend -m "fix(storage): close finalization-history namespace and schema gaps"
          test "$(git rev-parse HEAD^)" = "3c46293e78a125dec9504e51c355a20216341338"
          test ! -e .github/workflows/trnm-plan-v2-p0-finalization-history-closure.yml
          git push --force-with-lease origin HEAD:integration/native-poco-a04-a19-a23-qualified-v1-20260901
