  native-work-owner-readback:
    needs: native-work-owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Checkout the same exact chain source for independent readback
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the readback checkout to the current source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-work-owner-readback-observations"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-work-owner-readback-observations/source-before.json" 2>&1 | tee "$RUNNER_TEMP/hia-work-owner-readback-observations/source-before.log"
          bash scripts/project-preflight.sh --audit
      - name: Download the complete evidence from this exact producer and attempt
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: hia-work-owner-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-work-owner-artifact
      - name: Require qualified producer evidence from this exact head run and attempt
        run: |
          set -euo pipefail
          python3 -B - "$RUNNER_TEMP/hia-work-owner-artifact" <<'PY'
          from pathlib import Path
          import sys
          from hia.tools import qualify_work_owner_ci as q
          package_root = Path(sys.argv[1])
          package = q.read(package_root / "package-manifest.json")
          expected = q.base.lineage()
          q.need(package.get("qualification_status") == "PASS"
                 and q.same(package.get("lineage"), expected),
                 "Consumer requires qualified evidence from this exact head/run/attempt")
          binding = q.read(package_root / "binding.json")
          q.check_binding(binding, expected)
          q.need(q.same(q.identity(package_root / "binding.json"), package.get("binding")),
                 "Downloaded producer binding bytes differ")
          PY
      - name: Independently read every archived byte and repeat complete evidence admission
        run: |
          set -euo pipefail
          python3 -B -m hia.tools.qualify_work_owner_ci readback --package "$RUNNER_TEMP/hia-work-owner-artifact" --output "$RUNNER_TEMP/hia-work-owner-readback" 2>&1 | tee "$RUNNER_TEMP/hia-work-owner-readback-observations/readback.log"
          python3 -B - "$RUNNER_TEMP/hia-work-owner-readback/readback-result.json" <<'PY'
          from pathlib import Path
          import sys
          from hia.tools import qualify_work_owner_ci as q
          value = q.read(Path(sys.argv[1]))
          q.need(value.get("status") == "QUALIFIED_COMPLETE_READBACK",
                 "Development replay cannot satisfy mandatory hosted readback")
          PY
          cp -- "$RUNNER_TEMP/hia-work-owner-readback/readback-result.json" "$RUNNER_TEMP/hia-work-owner-readback-observations/readback-result.json"
      - name: Verify all committed source bytes after readback success or failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-work-owner-readback-observations"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-work-owner-readback-observations/source-after.json" 2>&1 | tee "$RUNNER_TEMP/hia-work-owner-readback-observations/source-after.log"
      - name: Upload the independent complete readback result and source observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-work-owner-readback-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-work-owner-readback-observations/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

