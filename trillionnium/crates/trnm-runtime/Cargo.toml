[package]
name = "trnm-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "1"
trnm-protocol = { version = "0.1.0", path = "../trnm-protocol" }
trnm-research-protocol = { version = "0.1.0", path = "../trnm-research-protocol" }

[dev-dependencies]
ed25519-dalek = "2"
hex = "0.4"
sha2 = "0.10"
trnm-pouw = { version = "0.1.0", path = "../trnm-pouw" }
trnm-state = { version = "0.1.0", path = "../trnm-state" }
trnm-types = { version = "0.1.0", path = "../trnm-types" }
