name: TRNM exact-source Rust CodeQL disposition candidate ded43a v1

on:
  push:
    branches:
      - security/codeql-complete-disposition-ded43a-v1-20260909
  pull_request:
    paths:
      - 'docs/evidence/security/codeql/ded43a/**'
      - 'scripts/ci/generate_codeql_dispositions_ded43a_v1.py'
      - '.github/workflows/trnm-codeql-disposition-ded43a-v1.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: trnm-codeql-disposition-ded43a-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-complete-disposition:
    name: Generate and validate all 703 exact-source Rust dispositions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUBJECT_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
      SUBJECT_TREE: c0791ffb57e05fde43f87bfed1a3b4656c09efc0
      SOURCE_RUN_ID: '34311122905'
      SOURCE_ARTIFACT_NAME: trnm-rust-codeql-exact-source-ded43a-v3-34311122905
      TRIAGE_RUN_ID: '34312572616'
      TRIAGE_ARTIFACT_NAME: trnm-codeql-triage-ded43a-v2-34312572616
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out disposition carrier with full ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify carrier descends from the exact analyzed source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SUBJECT_SHA}^{commit}"
          test "$(git rev-parse "${SUBJECT_SHA}^{tree}")" = "${SUBJECT_TREE}"
          git merge-base --is-ancestor "${SUBJECT_SHA}" HEAD
          git diff --quiet
          git diff --cached --quiet

      - name: Materialize immutable exact source
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "${RUNNER_TEMP}/subject" "${SUBJECT_SHA}"
          test "$(git -C "${RUNNER_TEMP}/subject" rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git -C "${RUNNER_TEMP}/subject" rev-parse 'HEAD^{tree}')" = "${SUBJECT_TREE}"
          git -C "${RUNNER_TEMP}/subject" diff --quiet
          git -C "${RUNNER_TEMP}/subject" diff --cached --quiet

      - name: Download and verify immutable CodeQL inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/codeql" "${RUNNER_TEMP}/triage"
          gh run download "${SOURCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${SOURCE_ARTIFACT_NAME}" \
            --dir "${RUNNER_TEMP}/codeql"
          gh run download "${TRIAGE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${TRIAGE_ARTIFACT_NAME}" \
            --dir "${RUNNER_TEMP}/triage"
          test -s "${RUNNER_TEMP}/codeql/post-processed/upload.sarif"
          test -s "${RUNNER_TEMP}/triage/triage.json"
          test "$(sha256sum "${RUNNER_TEMP}/codeql/post-processed/upload.sarif" | cut -d' ' -f1)" \
            = "d21b98a0e1b78dc3a45091cf7d2f2a9d24f8811ef08861bc5268d2fb19517f83"
          (cd "${RUNNER_TEMP}/codeql" && sha256sum --check evidence/SHA256SUMS)
          (cd "${RUNNER_TEMP}/triage" && sha256sum --check SHA256SUMS)

      - name: Verify committed disposition contract inputs
        shell: bash
        run: |
          set -euo pipefail
          manifest=docs/evidence/security/codeql/ded43a/MANIFEST.json
          jq -e '
            .schema == "trnm-rust-codeql-disposition-contract-v1" and
            .subject.commit == env.SUBJECT_SHA and
            .subject.tree == env.SUBJECT_TREE and
            .analyzer.workflow_run_id == env.SOURCE_RUN_ID and
            .analyzer.triage_workflow_run_id == env.TRIAGE_RUN_ID and
            .authority.independent_specialist_acceptance == false and
            .authority.alert_dismissal_authorized == false and
            .authority.all_gaps_closed == false
          ' "${manifest}"
          test "$(sha256sum scripts/ci/generate_codeql_dispositions_ded43a_v1.py | cut -d' ' -f1)" \
            = "$(jq -r '.inputs.generator_source_sha256' "${manifest}")"
          test "$(sha256sum docs/evidence/security/codeql/ded43a/manual-semantic-review-v1.json | cut -d' ' -f1)" \
            = "$(jq -r '.inputs.manual_semantic_review_sha256' "${manifest}")"
          test "$(git hash-object .github/workflows/trnm-codeql-disposition-ded43a-v1.yml)" \
            = "$(jq -r '.inputs.workflow_git_blob' "${manifest}")"

      - name: Generate all dispositions and run false-pass mutants
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/validated"
          python3 scripts/ci/generate_codeql_dispositions_ded43a_v1.py \
            --source-root "${RUNNER_TEMP}/subject" \
            --sarif "${RUNNER_TEMP}/codeql/post-processed/upload.sarif" \
            --triage "${RUNNER_TEMP}/triage/triage.json" \
            --manual docs/evidence/security/codeql/ded43a/manual-semantic-review-v1.json \
            --output "${out}" \
            --self-test
          jq -e '
            .counts.total == 703 and
            .counts.unreviewed == 0 and
            .counts.actionable_production_findings == 0 and
            .authority.independent_specialist_acceptance == false and
            .authority.alert_dismissal_authorized == false and
            .authority.official_codeql_gate_success == false and
            .authority.all_gaps_closed == false
          ' "${out}/report.json"

      - name: Retain complete candidate packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-codeql-disposition-candidate-ded43a-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/validated/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Verify no source or carrier mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "${RUNNER_TEMP}/subject" rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git -C "${RUNNER_TEMP}/subject" rev-parse 'HEAD^{tree}')" = "${SUBJECT_TREE}"
          git -C "${RUNNER_TEMP}/subject" diff --quiet
          git -C "${RUNNER_TEMP}/subject" diff --cached --quiet
          git diff --quiet
          git diff --cached --quiet
