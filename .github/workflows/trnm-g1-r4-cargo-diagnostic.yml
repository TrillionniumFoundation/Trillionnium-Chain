name: TRNM G1-R4 fs2 surface audit

on:
  push:
    branches:
      - feature/chain-g1-r4-gap-closure-20260828

permissions:
  contents: read

concurrency:
  group: trnm-g1-r4-fs2-surface-audit
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"

jobs:
  audit-source:
    name: Audit exact fs2 API surface
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-g1-r4-gap-closure-20260828' &&
      github.actor == 'Tomasrgbsf' &&
      github.triggering_actor == 'Tomasrgbsf'
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-g1-r4a-finalization-intent-process-matrix-20260828
          path: trillionnium-chain
          fetch-depth: 0
          persist-credentials: false

      - name: Enumerate every manifest and source API dependency
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh --toolchain 1.95.0
          echo '=== fs2 manifests ==='
          git grep -n -E '^[[:space:]]*fs2[[:space:]]*=' -- '**/Cargo.toml'
          echo '=== fs2 imports and qualified calls ==='
          git grep -n -E 'fs2::|FileExt::' -- '*.rs'
          echo '=== lock method calls ==='
          git grep -n -E '\.(try_)?lock_(shared|exclusive)\(|\.unlock\(|\.allocate\(|\.allocated_size\(' -- '*.rs' || true
          echo '=== non-lock fs2 symbols ==='
          git grep -n -E 'available_space|free_space|total_space|allocation_granularity' -- '*.rs' || true
          test -z "$(git status --porcelain)"
