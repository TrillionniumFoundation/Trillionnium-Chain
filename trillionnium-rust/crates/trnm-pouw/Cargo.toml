[package]
name = "trnm-pouw"
version = "0.1.0"
edition = "2021"

[features]
default = []
real-zk-backend = [
    "dep:ark-bn254",
    "dep:ark-ff",
    "dep:ark-groth16",
    "dep:ark-relations",
    "dep:ark-serialize",
    "dep:ark-snark",
    "dep:rand",
]

[dependencies]
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ark-bn254 = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }
ark-groth16 = { version = "0.4", optional = true }
ark-relations = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }
ark-snark = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
trnm-state = { path = "../trnm-state" }
trnm-types = { path = "../trnm-types" }

[dev-dependencies]
trnm-state = { path = "../trnm-state", features = ["test-utils"] }
