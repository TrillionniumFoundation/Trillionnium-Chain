[package]
name = "trnm-consensus-external-node-checkpoint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "trnm-external-node-checkpoint-v0"
path = "src/main.rs"

[package.metadata.trnm]
lane = "poco-bft-p0-external-whole-node-checkpoint"
protocol = "poco-bft-v0"
append_only_hash_chain = true
cross_process_cas = true
unix_socket_transport = true
strict_scope_expected_target_cas = true
private_key_handling = false
consensus_runtime = false
core_admission = false
safety_rules = false
host_attestation = false
validator_runtime = false
production_signature_producer = false
external_node_checkpoint_operational_integration = false
external_node_checkpoint_production_activation = false
production_activation = false
production_candidate = false

[dependencies]
fs2 = "0.4"
libc = "0.2"
sha2 = "0.10"
trnm-poco-node = { version = "0.1.0", path = "../trnm-poco-node" }

[dev-dependencies]
tempfile = "3"
trnm-consensus-signer-journal = { version = "0.1.0", path = "../trnm-consensus-signer-journal" }
trnm-consensus-types = { version = "0.1.0", path = "../trnm-consensus-types" }
