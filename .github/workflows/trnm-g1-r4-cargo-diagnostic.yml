name: TRNM G1-R4 lock dependency audit

on:
  push:
    branches:
      - feature/chain-g1-r4-gap-closure-20260828

permissions:
  contents: read

concurrency:
  group: trnm-g1-r4-lock-dependency-audit
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"

jobs:
  audit-lock:
    name: Audit fs2/winapi lock ownership
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-g1-r4-gap-closure-20260828' &&
      github.actor == 'Tomasrgbsf' &&
      github.triggering_actor == 'Tomasrgbsf'
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-g1-r4a-finalization-intent-process-matrix-20260828
          path: trillionnium-chain
          fetch-depth: 0
          persist-credentials: false

      - name: Parse exact lock ownership without Cargo index access
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh --toolchain 1.95.0
          python3 - trillionnium/Cargo.lock <<'PY'
          import sys, tomllib
          data = tomllib.loads(open(sys.argv[1], 'rb').read().decode())
          packages = data['package']
          targets = {'fs2','winapi','winapi-i686-pc-windows-gnu','winapi-x86_64-pc-windows-gnu'}
          print('target_packages:')
          for pkg in packages:
              if pkg['name'] in targets:
                  print(pkg['name'], pkg['version'], pkg.get('source'), pkg.get('dependencies', []))
          print('reverse_dependencies:')
          for pkg in packages:
              deps = pkg.get('dependencies', [])
              hits = [dep for dep in deps if dep.split(' ', 1)[0] in targets]
              if hits:
                  print(pkg['name'], pkg['version'], hits)
          fs2_users = [
              (pkg['name'], pkg['version'])
              for pkg in packages
              if any(dep.split(' ', 1)[0] == 'fs2' for dep in pkg.get('dependencies', []))
          ]
          winapi_users = [
              (pkg['name'], pkg['version'])
              for pkg in packages
              if any(dep.split(' ', 1)[0] == 'winapi' for dep in pkg.get('dependencies', []))
          ]
          assert fs2_users == [('trnm-poco-node', '0.1.0')], fs2_users
          assert winapi_users == [('fs2', '0.4.3')], winapi_users
          print('fs2_unique_owner=trnm-poco-node')
          print('winapi_unique_owner=fs2')
          PY
          test -z "$(git status --porcelain)"
