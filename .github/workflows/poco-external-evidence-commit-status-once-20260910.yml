name: PoCO external evidence commit status (one-shot)

on:
  push:
    branches:
      - ops/poco-external-blocker-convergence-20260910-r2
    paths:
      - .github/workflows/poco-external-evidence-commit-status-once-20260910.yml

permissions:
  contents: read
  statuses: write
  pull-requests: write
  metadata: read

env:
  PRODUCT_BRANCH: chore/poco-only-purge-20260909
  EVIDENCE_BRANCH: evidence/poco-external-blocker-convergence-20260910-r2
  PR_NUMBER: "117"

jobs:
  mark-pending:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out operations branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/poco-external-blocker-convergence-20260910-r2
          fetch-depth: 0
          persist-credentials: false

      - name: Bind status to exact product source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PRODUCT_BRANCH" "$EVIDENCE_BRANCH"
          commit=$(git rev-parse "origin/$PRODUCT_BRANCH")
          tree=$(git rev-parse "$commit^{tree}")
          manifest=$(git show "origin/$EVIDENCE_BRANCH:evidence/external-orchestration/execution-pack-v1/manifest.json")
          COMMIT="$commit" TREE="$tree" MANIFEST="$manifest" python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repo=os.environ['GH_REPO']; token=os.environ['GH_TOKEN']
          commit=os.environ['COMMIT']; tree=os.environ['TREE']; branch=os.environ['EVIDENCE_BRANCH']
          manifest=json.loads(os.environ['MANIFEST'])
          assert manifest['source_commit']==commit
          assert manifest['source_tree']==tree
          assert manifest['all_external_blockers_closed'] is False
          target=f'https://github.com/{repo}/tree/{branch}/evidence/external-orchestration/execution-pack-v1'
          payload={
              'state':'pending',
              'target_url':target,
              'description':'Six independently authenticated external PoCO blockers remain open',
              'context':'PoCO external evidence / all six blockers',
          }
          data=json.dumps(payload).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{commit}',data=data,method='POST')
          for k,v in {
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'trnm-external-evidence-status',
          }.items(): req.add_header(k,v)
          try:
              with urllib.request.urlopen(req,timeout=60) as response:
                  result=json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'status write failed: {exc.code} {exc.read().decode(errors="replace")}')
          assert result['state']=='pending'
          assert result['context']==payload['context']
          print(json.dumps({'source_commit':commit,'source_tree':tree,'context':result['context'],'state':result['state']},sort_keys=True))
          PY
