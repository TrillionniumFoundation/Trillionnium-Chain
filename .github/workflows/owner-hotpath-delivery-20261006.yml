name: owner-hotpath-delivery-20261006
on:
  push:
    branches: [fix/chain-owner-hotpath-delivery-20261006]
permissions:
  contents: read
jobs:
  prepare-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: "1"
      PRODUCT_SHA: babd9c6ef2065bfd824fc7602fc0a3a7a6dc4b51
      PRODUCT_TREE: eb356503abaf099bc69b3cec280669c3165867ea
    steps:
      - name: Read exact product source without delivery files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: babd9c6ef2065bfd824fc7602fc0a3a7a6dc4b51
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact source and original project boundary
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/owner-hotpath-evidence"
          mkdir "$out"
          printf 'INCOMPLETE\n' > "$out/result.txt"
          git switch -c fix/chain-owner-hotpath-observation-local "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          git status --porcelain > "$out/status-before.txt"
          test ! -s "$out/status-before.txt"
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$PRODUCT_SHA" --output "$out/source-before.json"
          bash scripts/project-preflight.sh --audit | tee "$out/preflight.stdout"
          printf 'CANDIDATE_SHA=%s\nCANDIDATE_TREE=%s\n' "$PRODUCT_SHA" "$PRODUCT_TREE" > "$out/source.txt"
      - name: Install same fixed compiler and formatter
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Execute exact native controls and strict lint with retained failures
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/owner-hotpath-evidence"
          rustc +1.95.0 --version --verbose > "$out/compiler.txt"
          failed=0
          run_checked() {
            local label="$1"; shift
            printf '%q ' "$@" > "$out/$label.command"
            printf '\n' >> "$out/$label.command"
            local rc=0
            if "$@" > "$out/$label.stdout" 2> "$out/$label.stderr"; then
              rc=0
            else
              rc=$?
              failed=1
            fi
            printf '%s\n' "$rc" > "$out/$label.exit"
            cat "$out/$label.stdout" "$out/$label.stderr"
          }
          run_checked fmt cargo +1.95.0 fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          run_checked mining-new cargo +1.95.0 test --locked --release --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib cooperative_search_tests -- --nocapture
          run_checked delta-new cargo +1.95.0 test --locked --release --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib difference_stream_tests -- --nocapture
          run_checked delta-original cargo +1.95.0 test --locked --release --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib difference_tests -- --nocapture
          run_checked pool-owner cargo +1.95.0 test --locked --release --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --test pool_mining -- --nocapture
          run_checked from-zero env TRNM_PUBLIC_V3_FROM_ZERO_DIR="$out/native" cargo +1.95.0 test --locked --release --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --test public_v3_from_zero -- --nocapture
          run_checked clippy cargo +1.95.0 clippy --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --all-targets --all-features -- -D warnings
          run_checked repository python3 scripts/ci/check_repository.py
          export OBSERVATION_DIR="$out"
          if python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['OBSERVATION_DIR'])
          expected = {
              'mining-new': (5, 'mining::cooperative_search_tests::'),
              'delta-new': (4, 'store::native_authenticated::difference_stream_tests::'),
              'delta-original': (3, 'store::native_authenticated::difference_tests::'),
              'pool-owner': (8, ''),
              'from-zero': (3, ''),
          }
          outcomes = {}
          for label, (count, prefix) in expected.items():
              text = (root / (label + '.stdout')).read_text()
              names = re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. ok$', text, re.M)
              if label == 'from-zero':
                  names = re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. (?:ok|\{[^\n]*\}\nok)$', text, re.M)
              summaries = re.findall(r'^test result: ok\. (\d+) passed; 0 failed; 0 ignored;', text, re.M)
              passed = ((root / (label + '.exit')).read_text().strip() == '0'
                        and summaries == [str(count)] and len(names) == count
                        and len(set(names)) == count and all(n.startswith(prefix) for n in names))
              outcomes[label] = {'passed': passed, 'executed_names': names, 'required_count': count}
          report = json.loads((root / 'native/report.json').read_text())
          native = report.get('finite_target_met') is True and report.get('public_network_ready') is False
          passed = native and all(row['passed'] for row in outcomes.values())
          receipt = {'schema': 'isolated-owner-hotpath-observation-v1',
                     'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                     'run_id': os.environ['GITHUB_RUN_ID'], 'tests': outcomes,
                     'native_finite_target_met': native, 'named_execution_passed': passed,
                     'production_activation': False, 'independent_acceptance': False,
                     'files': {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                               for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'result.txt'}}
          (root / 'named-execution.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({'named_execution_passed': passed, 'tests': outcomes}))
          raise SystemExit(0 if passed else 1)
          PY
          then :; else failed=1; fi
          if python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$PRODUCT_SHA" --output "$out/source-after.json"; then :; else failed=1; fi
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA" || failed=1
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE" || failed=1
          git status --porcelain > "$out/status-after.txt"
          test ! -s "$out/status-after.txt" || failed=1
          printf 'FOCUSED_FAILURE=%s\n' "$failed" | tee "$out/result.txt"
          exit "$failed"
      - name: Retain every success, failure and source identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-hotpath-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-hotpath-evidence/
          if-no-files-found: error
          retention-days: 30
