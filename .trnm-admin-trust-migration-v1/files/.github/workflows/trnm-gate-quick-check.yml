name: trnm-gate-quick-check

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'contracts/**'
      - 'contracts-rust/**'
      - 'config/alert-policy/**'
      - 'docs/runbooks/enterprise_onboarding_runbook_v1.md'
      - 'docs/runbooks/TRNM_POCO_BFT_X230_DEPLOYMENT_BOUNDARY.md'
      - 'scripts/**'
      - 'trillionnium/scripts/**'
      - '.github/workflows/trnm-gate-quick-check.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'contracts/**'
      - 'contracts-rust/**'
      - 'config/alert-policy/**'
      - 'docs/runbooks/enterprise_onboarding_runbook_v1.md'
      - 'docs/runbooks/TRNM_POCO_BFT_X230_DEPLOYMENT_BOUNDARY.md'
      - 'scripts/**'
      - 'trillionnium/scripts/**'
      - '.github/workflows/trnm-gate-quick-check.yml'
  workflow_dispatch:

concurrency:
  group: trnm-gate-quick-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-static-checks:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' ||
        ((github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf' || github.actor == 'Franksudoman') &&
         github.triggering_actor == github.actor &&
         (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Keep numeric parsing/formatting locale-stable (decimal separator, etc.)
      # for shell/python probes that may emit or compare numeric evidence.
      LC_NUMERIC: C
      # Force bytewise collation so sort/uniq behavior is reproducible across
      # runner image refreshes and locale package changes.
      LC_COLLATE: C
      # Keep month/day names and locale-sensitive time formatting stable for
      # any date evidence emitted by shell/python helpers.
      LC_TIME: C
      # Normalize character-class behavior ([[:alpha:]], upper/lower transforms)
      # across runner locale package changes for shell/python regex assertions.
      LC_CTYPE: C
      # Force locale-driven message strings to remain stable across runner
      # image updates so grep/assertions on stderr stay deterministic.
      LC_MESSAGES: C
      # Keep locale-driven monetary formatting deterministic in finance-facing
      # report/gate probes (currency symbol/decimal-group separators).
      LC_MONETARY: C
      # Keep measurement-unit formatting deterministic (metric/imperial labels)
      # for any locale-aware helpers that may emit operational evidence text.
      LC_MEASUREMENT: C
      # Keep page-size/unit locale formatting deterministic for any helpers
      # that emit print/paper-related evidence text.
      LC_PAPER: C
      # Keep locale-derived postal/address formatting deterministic for any
      # helper that may serialize operator/site metadata into evidence logs.
      LC_ADDRESS: C
      # Keep locale-derived personal-name formatting deterministic for any
      # helper that emits operator identity fields in evidence artifacts.
      LC_NAME: C
      # Keep locale-driven telephone formatting deterministic for any helper
      # that serializes operator contact fields into evidence outputs.
      LC_TELEPHONE: C
      # Freeze Python hash randomization so set/dict iteration in shell-driven
      # regression scripts stays deterministic across CI re-runs.
      PYTHONHASHSEED: "0"
      # Prevent interpreter bytecode cache writes (.pyc/__pycache__) so CI
      # workspaces stay side-effect free and reruns remain evidence-stable.
      PYTHONDONTWRITEBYTECODE: "1"
      # Normalize shell/test behavior for tools that branch on CI mode.
      CI: "true"
      # Force deterministic Python stdio encoding regardless of locale fallback
      # behavior on runner image refreshes.
      PYTHONIOENCODING: "UTF-8"
      # Enforce Python UTF-8 mode regardless of ambient locale coercion so text
      # decoding/encoding behavior stays stable across runner image refreshes.
      PYTHONUTF8: "1"
      # Force unbuffered Python stdout/stderr so failure evidence ordering stays
      # stable under runner load and in replayed CI logs.
      PYTHONUNBUFFERED: "1"
      # Ignore user-site Python packages to keep runner-local pip residue from
      # altering module resolution during shell/python gate probes.
      PYTHONNOUSERSITE: "1"
      # Disable pip's periodic version check network call to avoid nondeterministic
      # stderr timing/noise and occasional flaky delays in shell-driven probes.
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # Pin a stable build timestamp for any tooling that emits date metadata
      # (zip/tar/python wheel/etc.) so artifact ordering stays reproducible.
      SOURCE_DATE_EPOCH: "1704067200"
      # Strip gzip header filename/timestamp for deterministic compressed
      # fixtures produced during shell/python regression probes.
      GZIP: "-n"
      # Stabilize created file permissions across runner/image defaults so
      # replay artifacts and git diffs keep deterministic mode bits.
      UMASK: "022"
      TRNM_CARGO_OFFLINE_POLICY: "required"
      CARGO_NET_OFFLINE: "true"
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"
    # This workflow runs dozens of regression scripts; 10 minutes can truncate
    # coverage and hide late-stage failures. Keep enough headroom for full sweep.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify runner-provisioned Rust toolchain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0

      - name: Verify Cargo offline cache readiness
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock \
            contracts/Cargo.toml:contracts/Cargo.lock

      - name: Verify runner-provisioned shellcheck
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null 2>&1
          shellcheck --version

      - name: Quick shell gate (bash -n + shellcheck)
        run: |
          QUICK_GATE_SUMMARY_PATH=run/quick-gate/summary.json \
          ./scripts/quick_gate_shell.sh scripts trillionnium/scripts

      - name: Contracts workspace smoke
        run: |
          ./scripts/check_contracts_workspace_smoke.sh

      - name: Contracts workspace smoke missing manifest guard regression
        run: |
          ./scripts/v2/check_contracts_workspace_smoke_missing_manifest_guard_test.sh

      - name: Contracts workspace smoke missing cargo guard regression
