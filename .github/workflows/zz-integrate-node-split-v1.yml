name: integrate-validated-node-split-v1

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/zz-integrate-node-split-v1.yml

permissions:
  contents: write

concurrency:
  group: integrate-validated-node-split-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: work/plan-v2-full-gap-closure-20260902
  SOURCE_BRANCH: work/node-split-v1-20260902
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  integrate:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/plan-v2-full-gap-closure-20260902' &&
      github.actor == 'Franksudoman' &&
      github.triggering_actor == github.actor &&
      !contains(github.event.head_commit.message, '[node-split-integrated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact integration head with branch credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind target and validated source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          source_sha="$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")"
          test -n "${source_sha}"
          git merge-base --is-ancestor "${GITHUB_SHA}^" "${source_sha}"
          test ! -e .github/workflows/zz-stage-node-split-lock.yml
          test "$(git ls-tree -r --name-only "${source_sha}" -- .github/workflows/zz-stage-node-split-lock.yml | wc -l)" -eq 0
          git show -s --format=%s "${source_sha}" | grep -q '^\[node-split-lock\] ci(node): materialize lock and retire staging carrier$'
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_ENV}"

      - name: Merge source tree without committing
        shell: bash
        run: |
          set -euo pipefail
          git merge --no-ff --no-commit "${source_sha}"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '--diff-filter=ACDMRTUXB'],
              text=True,
          ).splitlines()
          allowed_exact = {
              '.github/CODEOWNERS',
              '.github/workflows/trnm-required-baseline.yml',
              '.github/workflows/trnm-node-decomposition-v1.yml',
              'config/build-closures-v1.toml',
              'config/module-coverage-v1.toml',
              'config/node-decomposition-v1.toml',
              'docs/modules/TRNM_MODULE_TECHNICAL_REFERENCE_V1.md',
              'scripts/ci/check_build_closures_v1.py',
              'scripts/ci/check_node_decomposition_v1.py',
              'trillionnium/Cargo.toml',
              'trillionnium/Cargo.lock',
          }
          allowed_prefixes = (
              'trillionnium/crates/trnm-poco-node-authority/',
              'trillionnium/crates/trnm-poco-node-io/',
              'trillionnium/crates/trnm-poco-node-host/',
              'trillionnium/crates/trnm-poco-node-cli/',
          )
          unexpected = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(f'unexpected node-split paths: {unexpected}')
          required = {
              'config/node-decomposition-v1.toml',
              'scripts/ci/check_node_decomposition_v1.py',
              'trillionnium/crates/trnm-poco-node-authority/Cargo.toml',
              'trillionnium/crates/trnm-poco-node-io/Cargo.toml',
              'trillionnium/crates/trnm-poco-node-host/Cargo.toml',
              'trillionnium/crates/trnm-poco-node-cli/Cargo.toml',
          }
          missing = sorted(required - set(changed))
          if missing:
              raise SystemExit(f'node-split required paths absent: {missing}')
          for path in changed:
              if path.startswith('.github/workflows/zz-'):
                  raise SystemExit(f'temporary carrier entered merge tree: {path}')
          development = Path('docs/development')
          regular_markdown = [p for p in development.glob('*.md') if p.is_file() and not p.is_symlink()]
          if len(regular_markdown) != 1:
              raise SystemExit(f'development truth pollution: {regular_markdown}')
          PY

      - name: Install repository-pinned Rust and fetch locked graph
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 - <<'PY'
          import tomllib
          with open('rust-toolchain.toml', 'rb') as handle:
              print(tomllib.load(handle)['toolchain']['channel'])
          PY
          )"
          rustup toolchain install "${expected}" --profile minimal --component rustfmt --component clippy
          rustup default "${expected}"
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked

      - name: Validate merged decomposition and repository boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check_node_decomposition_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_build_closures_v1.py --verify-cargo-tree
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked --offline
          for package in \
            trnm-poco-node-authority \
            trnm-poco-node-io \
            trnm-poco-node-host \
            trnm-poco-node-cli
          do
            cargo test --manifest-path trillionnium/Cargo.toml \
              -p "${package}" --all-targets --locked --offline
            cargo clippy --manifest-path trillionnium/Cargo.toml \
              -p "${package}" --all-targets --locked --offline -- -D warnings
          done
          status="$(cargo run --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node-cli --bin trnm-poco-node-cli \
            --locked --offline -- status)"
          printf '%s\n' "${status}" | grep -q '"production_candidate":false'
          printf '%s\n' "${status}" | grep -q '"authority_gate_open":false'
          printf '%s\n' "${status}" | grep -q '"production_activation":false'
          printf '%s\n' "${status}" | grep -q '"start_permitted":false'
          set +e
          cargo run --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node-cli --bin trnm-poco-node-cli \
            --locked --offline -- start \
            >"${RUNNER_TEMP}/start.out" 2>"${RUNNER_TEMP}/start.err"
          rc=$?
          set -e
          test "${rc}" -ne 0
          grep -q 'node host start blocked' "${RUNNER_TEMP}/start.err"

      - name: Commit validated merge and retire integration carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rm .github/workflows/zz-integrate-node-split-v1.yml
          git config user.name 'Franksudoman'
          git config user.email 'sunfocapital@gmail.com'
          git commit -m '[node-split-integrated] feat(node): integrate validated M15 decomposition'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
