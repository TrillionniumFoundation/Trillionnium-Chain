name: rust-verifier-poc

on:
  pull_request:
    paths:
      - 'rust/verifier/**'
      - 'scripts/run_rust_verifier_poc.sh'
      - '.github/workflows/rust-verifier-poc.yml'
  push:
    branches: [main]
    paths:
      - 'rust/verifier/**'
      - 'scripts/run_rust_verifier_poc.sh'
      - '.github/workflows/rust-verifier-poc.yml'
  workflow_dispatch:

jobs:
  verifier-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust/verifier

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test

      - name: Fixture verification
        run: |
          mkdir -p ../../data/rust-verifier-ci
          cargo run -- batch --input-dir fixtures --output-dir ../../data/rust-verifier-ci
          test -f ../../data/rust-verifier-ci/match.json
          test -f ../../data/rust-verifier-ci/mismatch.json
