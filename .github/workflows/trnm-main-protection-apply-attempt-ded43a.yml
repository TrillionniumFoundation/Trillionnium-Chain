name: TRNM main protection apply attempt ded43a

on:
  push:
    branches:
      - evidence/codeql-rust-exact-source-ded43a-20260909
    paths:
      - .github/workflows/trnm-main-protection-apply-attempt-ded43a.yml

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  apply-and-read-back:
    name: Apply and read back canonical main protection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/Trillionnium-Chain
      CHANGE_TICKET: TRNM-MAIN-PROTECTION-20260909
      FREEZE_TICKET: TRNM-MAIN-PROTECTION-FREEZE-20260909
    steps:
      - name: Apply exact canonical protection or retain fail-closed denial
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trnm-main-protection"
          mkdir -p "$out/raw"
          export out
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import subprocess

          out = pathlib.Path(os.environ["out"])
          raw = out / "raw"
          repo = os.environ["REPOSITORY"]

          def api(args, name, require=False):
              proc = subprocess.run(["gh", "api", "-i", *args], text=True, capture_output=True)
              combined = proc.stdout + proc.stderr
              (raw / f"{name}.txt").write_text(combined, encoding="utf-8")
              first = combined.splitlines()[0] if combined.splitlines() else ""
              parts = first.split()
              status = int(parts[1]) if len(parts) > 1 and parts[1].isdigit() else None
              body = None
              split = "\r\n\r\n" if "\r\n\r\n" in combined else "\n\n"
              if split in combined:
                  try:
                      body = json.loads(combined.split(split, 1)[1])
                  except Exception:
                      pass
              result = {"status": status, "exit_code": proc.returncode, "body": body}
              if require and (proc.returncode != 0 or status is None or not 200 <= status < 300):
                  raise RuntimeError(f"{name} failed: status={status} rc={proc.returncode}")
              return result

          main_before = api([f"repos/{repo}/branches/main"], "main-before", require=True)
          main_body = main_before["body"] or {}
          main_sha = ((main_body.get("commit") or {}).get("sha"))
          if not main_sha or main_body.get("protected") is not True:
              raise RuntimeError("main is not observed as protected")

          before = api([f"repos/{repo}/branches/main/protection"], "protection-before")
          requested = {
              "required_status_checks": {
                  "strict": True,
                  "contexts": [
                      "repository-truth",
                      "protocol-contract",
                      "fuzz-smoke",
                      "rust-baseline",
                      "external-evidence-contract"
                  ]
              },
              "enforce_admins": True,
              "required_pull_request_reviews": {
                  "dismissal_restrictions": {"users": [], "teams": [], "apps": []},
                  "dismiss_stale_reviews": True,
                  "require_code_owner_reviews": True,
                  "required_approving_review_count": 2,
                  "require_last_push_approval": True,
                  "bypass_pull_request_allowances": {"users": [], "teams": [], "apps": []}
              },
              "restrictions": None,
              "required_linear_history": True,
              "allow_force_pushes": False,
              "allow_deletions": False,
              "block_creations": False,
              "required_conversation_resolution": True,
              "lock_branch": False,
              "allow_fork_syncing": False
          }
          request_path = out / "requested.json"
          request_path.write_text(json.dumps(requested, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          main_pre = api([f"repos/{repo}/branches/main"], "main-prepatch", require=True)
          if (((main_pre["body"] or {}).get("commit") or {}).get("sha")) != main_sha:
              raise RuntimeError("main moved before protection mutation")

          patch = api([
              "--method", "PUT",
              "-H", "Accept: application/vnd.github+json",
              "-H", "X-GitHub-Api-Version: 2022-11-28",
              f"repos/{repo}/branches/main/protection",
              "--input", str(request_path),
          ], "protection-put")

          main_post = api([f"repos/{repo}/branches/main"], "main-postpatch", require=True)
          if (((main_post["body"] or {}).get("commit") or {}).get("sha")) != main_sha:
              raise RuntimeError("main moved during protection mutation")
          after = api([f"repos/{repo}/branches/main/protection"], "protection-after")

          report = {
              "schema": "trnm-main-protection-apply-attempt-v1",
              "captured_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository": repo,
              "main_sha": main_sha,
              "main_protected": True,
              "change_ticket": os.environ["CHANGE_TICKET"],
              "freeze_ticket": os.environ["FREEZE_TICKET"],
              "before_status": before.get("status"),
              "put_status": patch.get("status"),
              "put_exit_code": patch.get("exit_code"),
              "after_status": after.get("status"),
              "production_candidate": False,
              "public_testnet_ready": False,
              "release_ready": False,
          }
          (out / "report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          if patch.get("status") not in (200, 201):
              raise RuntimeError(f"main protection mutation unavailable: status={patch.get('status')} rc={patch.get('exit_code')}")
          if after.get("status") != 200 or not isinstance(after.get("body"), dict):
              raise RuntimeError("main protection readback unavailable")
          PY
      - name: Hash retained administration evidence
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trnm-main-protection"
          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload immutable administration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-main-protection-apply-attempt-${{ github.run_id }}
          path: ${{ runner.temp }}/trnm-main-protection/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
