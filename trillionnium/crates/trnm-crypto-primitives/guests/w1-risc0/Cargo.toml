[workspace]
resolver = "2"
members = ["guest", "host", "relation"]
default-members = ["host"]

# Isolated research workspace: these dependencies are not linked into a node.
# The commit is the upstream RISC Zero SHA-256 accelerator patch. The guest and
# native fixture must produce identical complete journals; acceleration may not
# change W1's SHA-256 domains, byte order or transcript updates.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", rev = "7fd6900c4f637bd15ee2642dfa77110f8f1ad065" }

[profile.release]
opt-level = 3
lto = "thin"
debug = 0
panic = "abort"

[profile.dev]
debug = 0
