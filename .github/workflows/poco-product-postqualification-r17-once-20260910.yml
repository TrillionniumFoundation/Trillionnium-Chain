name: PoCO product postqualification R17 (temporary)

on:
  push:
    branches:
      - ops/poco-external-blocker-convergence-20260910-r2
    paths:
      - .github/workflows/poco-product-postqualification-r17-once-20260910.yml
      - automation/poco_product_r17_driver.py

permissions:
  actions: read
  contents: write

concurrency:
  group: poco-product-postqualification-r17
  cancel-in-progress: true

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  GH_TOKEN: ${{ github.token }}
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r17-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"
  PRODUCTION_PORTS_COMMIT: 2ae1915c39774938dc7c8a0799a1224bb5024f2c
  REMOTE_SIGNER_FIX_COMMIT: 2f01213918e8da288ce5f598447318c9113edaa2
  PIN_REFRESH_SOURCE: c5a2a2100cd05c2853fcaf1cca35fb6f63b6b7ed

jobs:
  postqualify:
    name: Wait, repair operator contracts, and qualify exact product tree
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out orchestration source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/poco-external-blocker-convergence-20260910-r2
          path: orchestrator
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for active product convergence publisher
        shell: bash
        run: |
          set -euo pipefail
          settled=false
          for attempt in $(seq 1 240); do
            active="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs?branch=$TARGET_BRANCH&per_page=100" \
              --jq '[.workflow_runs[] | select(.name | test("PoCO-only convergence R(14|15|16)")) | select(.status != "completed")] | length')"
            if [[ "$active" -eq 0 ]]; then
              settled=true
              break
            fi
            sleep 30
          done
          test "$settled" = true
          sleep 30
          active="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs?branch=$TARGET_BRANCH&per_page=100" \
            --jq '[.workflow_runs[] | select(.name | test("PoCO-only convergence R(14|15|16)")) | select(.status != "completed")] | length')"
          test "$active" -eq 0

      - name: Check out latest product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: product
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned qualification tools
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          rustc --version
          cargo --version
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked
          cp ../orchestrator/automation/poco_product_r17_driver.py \
            tools/temporary_poco_r17_driver.py
          python3 -m py_compile tools/temporary_poco_r17_driver.py

      - name: Resume failed convergence or prepare operator-correct product tree
        id: prepare
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          MODE="$(python3 tools/temporary_poco_r17_driver.py prepare)"
          test "$MODE" = transform -o "$MODE" = product
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [[ "$MODE" = transform ]]; then
            bash -n tools/temporary_poco_convergence_r13.sh
            python3 -m py_compile tools/temporary_poco_native_convergence_r13.py
          else
            python3 tools/temporary_poco_r17_driver.py repair-product
          fi

      - name: Resume full native product generation when needed
        if: steps.prepare.outputs.mode == 'transform'
        working-directory: product
        shell: bash
        env:
          GITHUB_SHA: ${{ steps.prepare.outputs.source_commit }}
        run: bash tools/temporary_poco_convergence_r13.sh

      - name: Refresh canonical pins and commit product-only repair
        if: steps.prepare.outputs.mode == 'product'
        id: candidate
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PIN_REFRESH_SOURCE"
          git show "$PIN_REFRESH_SOURCE:tools/temporary_poco_convergence_r5.py" \
            > tools/temporary_poco_convergence_r5.py
          python3 tools/temporary_poco_convergence_r5.py refresh-pins
          rm -f \
            tools/temporary_poco_convergence_r5.py \
            tools/temporary_poco_r13_postfix.py \
            tools/temporary_poco_r14_postfix.py \
            tools/temporary_poco_r15_postfix.py \
            tools/temporary_poco_r16_driver.py \
            tools/temporary_poco_r17_driver.py \
            .github/workflows/poco-only-convergence-r14-once-20260910.yml \
            .github/workflows/poco-only-convergence-r15-once-20260910.yml \
            .github/workflows/poco-only-convergence-r16-once-20260910.yml
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git add -A
          git diff --cached --check
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "fix(poco): bind native operator defaults to product binaries"
          fi
          FINAL_COMMIT="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$FINAL_COMMIT" >/tmp/trnm-r17-final-commit.txt
          printf '%s\n' "$FINAL_TREE" >/tmp/trnm-r17-final-tree.txt
          echo "commit=$FINAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$FINAL_TREE" >> "$GITHUB_OUTPUT"
          rm -rf /tmp/trnm-r17-final
          git worktree add --detach /tmp/trnm-r17-final "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r17-final rev-parse HEAD)" = "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r17-final rev-parse 'HEAD^{tree}')" = "$FINAL_TREE"
          test -z "$(git -C /tmp/trnm-r17-final status --porcelain --untracked-files=all)"

      - name: Verify exact-source repository and external-evidence truth
        if: steps.prepare.outputs.mode == 'product'
        working-directory: /tmp/trnm-r17-final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.commit }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ steps.candidate.outputs.tree }}"
          python3 -m compileall -q scripts tools formal conformance
          python3 scripts/ci/check_native_consensus_only.py | tee /tmp/trnm-r17-native-only.json
          bash scripts/ci/check_canonical_development_plan.sh
          bash scripts/ci/check_poco_bft_mainline_truth.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          python3 scripts/ci/test_external_evidence_v1.py
          set +e
          python3 scripts/ci/check_external_evidence_v1.py --require-all \
            --source-commit "$(git rev-parse HEAD)" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --output /tmp/trnm-r17-external-evidence.json \
            >/tmp/trnm-r17-external-evidence.stdout \
            2>/tmp/trnm-r17-external-evidence.stderr
          EXTERNAL_RC=$?
          set -e
          if [[ "$EXTERNAL_RC" -eq 2 ]]; then
            grep -q "external evidence gate remains open" /tmp/trnm-r17-external-evidence.stderr
          else
            test "$EXTERNAL_RC" -eq 0
          fi
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify operator script contracts
        if: steps.prepare.outputs.mode == 'product'
        working-directory: /tmp/trnm-r17-final
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/v2/collect_release_operator_preflight.sh
          executed=0
          for test_script in scripts/v2/collect_release_operator_preflight*_test.sh; do
            [[ -f "$test_script" ]] || continue
            echo "operator-contract-test=$test_script"
            bash "$test_script"
            executed=$((executed + 1))
          done
          test "$executed" -gt 0
          grep -q 'target/debug/trnm-poco-node' scripts/v2/collect_release_operator_preflight.sh
          grep -q 'target/debug/trnm-poco-node-cli' scripts/v2/collect_release_operator_preflight.sh
          ! grep -Eq 'trnm-(poco_consensus|external_bft_engine|cometbft)-app' \
            scripts/v2/collect_release_operator_preflight.sh
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Compile every native and contract target
        if: steps.prepare.outputs.mode == 'product'
        working-directory: /tmp/trnm-r17-final
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARGO_TARGET_DIR"
          cargo check --manifest-path trillionnium/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r17-workspace-check.log
          cargo check --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r17-contract-check.log

      - name: Execute targeted and complete regression corpus
        if: steps.prepare.outputs.mode == 'product'
        working-directory: /tmp/trnm-r17-final
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-execution-v0 --lib --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r17-native-execution-test.log
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --test raw_key_boundary --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r17-raw-key-test.log
          timeout --signal=TERM --kill-after=30s 7200s \
            cargo test --manifest-path trillionnium/Cargo.toml \
              --workspace --all-targets --locked --offline --no-fail-fast -j 1 -- \
              --test-threads=1 \
            2>&1 | tee /tmp/trnm-r17-workspace-test.log
          cargo test --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r17-contract-test.log
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute strict production-boundary Clippy
        if: steps.prepare.outputs.mode == 'product'
        working-directory: /tmp/trnm-r17-final
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 -- -D warnings \
            2>&1 | tee /tmp/trnm-r17-contract-clippy.log
          cd trillionnium
          : >/tmp/trnm-r17-boundary-clippy.log
          for package in \
            trnm-state trnm-consensus-types trnm-consensus-crypto \
            trnm-consensus-core trnm-consensus-safety-rules \
            trnm-consensus-safety-store trnm-consensus-signer-journal \
            trnm-native-application trnm-native-application-sqlite \
            trnm-native-execution-v0 trnm-durable-file-adapters-v0 \
            trnm-tx-lifecycle-v0 trnm-state-sync-v0 trnm-migration-v0 \
            trnm-control-plane-v0 trnm-release-bundle-v0 trnm-node-boundary-v0 \
            trnm-poco-node-production-v0 trnm-production-adapter-conformance-v0 \
            trnm-poco-node trnm-poco-node-authority trnm-poco-node-io \
            trnm-poco-node-host trnm-poco-node-cli
          do
            echo "strict-clippy package=${package}" | tee -a /tmp/trnm-r17-boundary-clippy.log
            cargo clippy -p "$package" --all-targets --locked --offline -j 1 -- -D warnings \
              2>&1 | tee -a /tmp/trnm-r17-boundary-clippy.log
          done
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish only the immutable postqualified product tree
        if: steps.prepare.outputs.mode == 'product'
        working-directory: /tmp/trnm-r17-final
        shell: bash
        run: |
          set -euo pipefail
          FINAL_COMMIT="${{ steps.candidate.outputs.commit }}"
          FINAL_TREE="${{ steps.candidate.outputs.tree }}"
          test "$(git rev-parse HEAD)" = "$FINAL_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$FINAL_TREE"
          python3 scripts/ci/check_native_consensus_only.py | tee /tmp/trnm-r17-native-only-final.json
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE/product" fetch origin "$TARGET_BRANCH"
          test "$(git -C "$GITHUB_WORKSPACE/product" rev-parse FETCH_HEAD)" = \
            "${{ steps.prepare.outputs.source_commit }}"
          git -C "$GITHUB_WORKSPACE/product" push origin \
            "$FINAL_COMMIT:refs/heads/$TARGET_BRANCH"

      - name: Upload exact postqualification diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-product-r17-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            /tmp/trnm-r17-final-commit.txt
            /tmp/trnm-r17-final-tree.txt
            /tmp/trnm-r17-native-only.json
            /tmp/trnm-r17-native-only-final.json
            /tmp/trnm-r17-external-evidence.json
            /tmp/trnm-r17-external-evidence.stdout
            /tmp/trnm-r17-external-evidence.stderr
            /tmp/trnm-r17-workspace-check.log
            /tmp/trnm-r17-contract-check.log
            /tmp/trnm-r17-native-execution-test.log
            /tmp/trnm-r17-raw-key-test.log
            /tmp/trnm-r17-workspace-test.log
            /tmp/trnm-r17-contract-test.log
            /tmp/trnm-r17-contract-clippy.log
            /tmp/trnm-r17-boundary-clippy.log
