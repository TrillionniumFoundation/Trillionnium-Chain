name: agent-user-phasea-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trillionnium/crates/trnm-rpc/**'
      - 'trillionnium/crates/trnm-worker-agent/**'
      - 'trillionnium/scripts/run_agent_user_phasea_gate.sh'
      - 'trillionnium/scripts/run_phasea_fault_injection_suite.sh'
      - 'trillionnium/scripts/run_phasea_soak_gate.sh'
      - 'scripts/v2/reliability_soak_harness.py'
      - 'scripts/v2/run_reliability_soak.sh'
      - 'scripts/ci/check_preprovisioned_rust_toolchain.sh'
      - 'scripts/ci/check_cargo_offline_ready.sh'
      - 'scripts/ci/check_cargo_offline_unchanged.sh'
      - 'docs/protocol/agent-user-p2p-communication-min-spec-v0.1.md'
      - 'docs/protocol/agent-user-p2p-phaseA-ops.md'
      - 'docs/OPERATIONS.md'
      - 'OPERATIONS.md'
      - '.github/workflows/agent-user-phasea-gate.yml'
  push:
    branches: [main]
    paths:
      - 'trillionnium/crates/trnm-rpc/**'
      - 'trillionnium/crates/trnm-worker-agent/**'
      - 'trillionnium/scripts/run_agent_user_phasea_gate.sh'
      - 'trillionnium/scripts/run_phasea_fault_injection_suite.sh'
      - 'trillionnium/scripts/run_phasea_soak_gate.sh'
      - 'scripts/v2/reliability_soak_harness.py'
      - 'scripts/v2/run_reliability_soak.sh'
      - 'scripts/ci/check_preprovisioned_rust_toolchain.sh'
      - 'scripts/ci/check_cargo_offline_ready.sh'
      - 'scripts/ci/check_cargo_offline_unchanged.sh'
      - 'docs/protocol/agent-user-p2p-communication-min-spec-v0.1.md'
      - 'docs/protocol/agent-user-p2p-phaseA-ops.md'
      - 'docs/OPERATIONS.md'
      - 'OPERATIONS.md'
      - '.github/workflows/agent-user-phasea-gate.yml'

permissions:
  contents: read

concurrency:
  group: agent-user-phasea-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phasea-gate:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' ||
        ((github.actor == 'ProfAlexQI' ||
         github.actor == 'Franksudoman') &&
         github.triggering_actor == github.actor &&
         (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 45
    env:
      # Keep locale/time behavior deterministic across re-runs for soak evidence,
      # grep/sed assertions, and artifact diffability.
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_NUMERIC: C
      LC_COLLATE: C
      LC_TIME: C
      PYTHONHASHSEED: '0'
      CI: 'true'
      TRNM_CARGO_OFFLINE_POLICY: "required"
      CARGO_NET_OFFLINE: "true"
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify runner-provisioned Rust toolchain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0

      - name: Verify Cargo offline cache readiness
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock

      - name: Run Agent↔User Phase A gate
        run: |
          set -euo pipefail
          cd trillionnium
          ./scripts/run_agent_user_phasea_gate.sh

      - name: Run reliability soak smoke (short)
        run: |
          set -euo pipefail
          ./scripts/v2/run_reliability_soak.sh --duration 1m --clean

      - name: Run phaseA fault injection suite (smoke)
        run: |
          set -euo pipefail
          cd trillionnium
          OUT_DIR=run/health/phasea-fault-suite-ci RUNS=1 ./scripts/run_phasea_fault_injection_suite.sh

      - name: Run phaseA soak SLO gate
        run: |
          set -euo pipefail
          cd trillionnium
          SOAK_RESULT="$(ls -1t ../run/health/reliability-soak-*.json | head -n1)" \
          FAULT_RESULT=run/health/phasea-fault-suite-ci/summary.txt \
          ./scripts/run_phasea_soak_gate.sh

      - name: Upload phaseA artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-user-phasea-gate-${{ github.run_id }}
          path: |
            trillionnium/run/health/agent-user-phasea-gate-*.txt
            trillionnium/run/health/phasea-soak-gate-*.txt
            trillionnium/run/health/phasea-fault-suite-ci/**
            run/health/reliability-soak-*.json
            run/health/reliability-soak-*.txt
            run/health/reliability-soak-*.audit.jsonl
          if-no-files-found: warn

      - name: Verify Cargo offline inputs remained unchanged
        if: always()
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"
