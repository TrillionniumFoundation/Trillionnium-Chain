name: pr55-exact-closure-publisher

on:
  push:
    branches:
      - integration/pr55-exact-closure-publisher-20260831
    paths:
      - .github/workflows/pr55-exact-closure-publisher.yml

permissions:
  contents: read

concurrency:
  group: pr55-exact-closure-publisher-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: 5383d7b47537c52d028d207f3763a65c7cfd86a7
  TARGET_BRANCH: feature/chain-p2-node-candidate-devnet-cli-v1-20260831
  PATCH_SHA256: c93dd9d51fb06aa74b417f01c34374c997cf457323ccf2ba6a5ec7c96266d768
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  qualify:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.actor == 'Tomasrgbsf' &&
      github.triggering_actor == 'Tomasrgbsf'
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      TRNM_CARGO_OFFLINE_POLICY: "required"
    outputs:
      candidate_commit: ${{ steps.freeze.outputs.candidate_commit }}
      candidate_tree: ${{ steps.freeze.outputs.candidate_tree }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out exact read-only carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify carrier, toolchain, and offline cache
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${SOURCE_COMMIT}" HEAD
          mapfile -t changed < <(git diff --name-only "${SOURCE_COMMIT}..HEAD" | sort)
          expected=(
            .ci/pr55-closure.patch.gz.b64.part1
            .ci/pr55-closure.patch.gz.b64.part2
            .ci/pr55-closure.patch.gz.b64.part3
            .ci/pr55-closure.patch.gz.b64.part4
            .github/workflows/pr55-exact-closure-publisher.yml
          )
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#sorted_expected[@]}"
          diff -u <(printf '%s\n' "${sorted_expected[@]}") <(printf '%s\n' "${changed[@]}")
          cat .ci/pr55-closure.patch.gz.b64.part{1,2,3,4} > "$RUNNER_TEMP/pr55.patch.gz.b64"
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 --component rustfmt --component clippy
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock

      - name: Apply and freeze exact candidate
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${SOURCE_COMMIT}"
          base64 -d "$RUNNER_TEMP/pr55.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/pr55.patch"
          echo "${PATCH_SHA256}  $RUNNER_TEMP/pr55.patch" | sha256sum --check
          git apply --index "$RUNNER_TEMP/pr55.patch"
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/trnm-p2-node-candidate-devnet-cli.yml
            docs/development/packages/TRNM_P2_NODE_CANDIDATE_DEVNET_CLI_V1.md
            scripts/check_ci_runner_policy.sh
            scripts/check_ci_runner_policy_test.sh
            scripts/ci/check_candidate_devnet_clippy_v1.sh
            trillionnium/crates/trnm-poco-lab-validator/src/candidate_devnet.rs
          )
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#sorted_expected[@]}"
          diff -u <(printf '%s\n' "${sorted_expected[@]}") <(printf '%s\n' "${changed[@]}")
          git diff --cached --check
          git diff --cached --exit-code -- trillionnium/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(node): isolate candidate Clippy and align trusted guard'
          candidate_commit="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$(git rev-parse HEAD^)" = "${SOURCE_COMMIT}"
          echo "candidate_commit=${candidate_commit}" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=${candidate_tree}" >> "$GITHUB_OUTPUT"

      - name: Qualify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_ci_runner_policy_test.sh
          bash scripts/check_ci_runner_policy.sh --worktree
          bash scripts/check_ci_runner_policy.sh --head
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-lab-validator --all-targets --locked --offline
          bash scripts/ci/check_candidate_devnet_clippy_v1.sh
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-lab-validator --lib --locked --offline candidate_devnet
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-lab-validator --test candidate_devnet_cli --locked --offline
          cargo run --quiet --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-lab-validator --bin trnm-poco-candidate-devnet-validator \
            --locked --offline -- --help | grep -q 'acknowledge-candidate-only'
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          bash scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          bash scripts/ci/check_canonical_development_plan.sh
          bash scripts/project-preflight.sh --audit
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build content-addressed bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr55-qualified"
          mkdir -p "$out"
          candidate="${{ steps.freeze.outputs.candidate_commit }}"
          tree="${{ steps.freeze.outputs.candidate_tree }}"
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
          git update-ref refs/heads/pr55-qualified "$candidate"
          git bundle create "$out/candidate.bundle" refs/heads/pr55-qualified
          git update-ref -d refs/heads/pr55-qualified
          sha256sum "$out/candidate.bundle" > "$out/candidate.bundle.sha256"
          printf '%s\n' "${SOURCE_COMMIT}" > "$out/source-commit"
          printf '%s\n' "$candidate" > "$out/candidate-commit"
          printf '%s\n' "$tree" > "$out/candidate-tree"

      - name: Upload qualified candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr55-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr55-qualified/
          if-no-files-found: error
          retention-days: 3

      - name: Verify offline inputs unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"

  publish:
    needs: qualify
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out carrier without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download qualified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          path: ${{ runner.temp }}/pr55-qualified

      - name: Verify and atomically publish only qualified tree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_COMMIT: ${{ needs.qualify.outputs.candidate_commit }}
          EXPECTED_TREE: ${{ needs.qualify.outputs.candidate_tree }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr55-qualified"
          test "$(cat "$out/source-commit")" = "${SOURCE_COMMIT}"
          test "$(cat "$out/candidate-commit")" = "$EXPECTED_COMMIT"
          test "$(cat "$out/candidate-tree")" = "$EXPECTED_TREE"
          sha256sum --check "$out/candidate.bundle.sha256"
          git bundle verify "$out/candidate.bundle"
          git fetch "$out/candidate.bundle" refs/heads/pr55-qualified:refs/remotes/qualified/pr55
          candidate="$(git rev-parse refs/remotes/qualified/pr55)"
          test "$candidate" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "${candidate}^{tree}")" = "$EXPECTED_TREE"
          test "$(git rev-parse "${candidate}^")" = "${SOURCE_COMMIT}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${SOURCE_COMMIT}"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git push --atomic origin "${candidate}:refs/heads/${TARGET_BRANCH}"
