name: trnm-source-inventory

on:
  workflow_dispatch:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
      - fix/chain-six-class-publish-20260911
    paths:
      - .github/workflows/trnm-source-inventory.yml
      - scripts/ci/publish_native_namespace_objects_v1.py
      - scripts/ci/native_namespace_objects_v1.pack.b64

permissions:
  contents: read

env:
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  TRNM_EXPECTED_SOURCE_SHA: ${{ github.sha }}

jobs:
  exact-source-inventory:
    name: exact-source-inventory-and-bound-blob-transport
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' || ((github.actor == 'ProfAlexQI' ||
      github.actor == 'Franksudoman' || github.actor == 'ProfHepta') &&
      github.triggering_actor == github.actor &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 15
    # One-use, hash-pinned public blob upload below; never updates refs.
    permissions:
      contents: write
    env:
      TRNM_CARGO_OFFLINE_POLICY: "not-applicable"
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          # This one-use blob carrier needs only itself, its prior carrier,
          # and the pinned 8bf base. Ordinary inventory retains full history.
          fetch-depth: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/chain-six-class-publish-20260911' && 3 || 0 }}
          persist-credentials: false

      - name: Verify and package tracked source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRNM_EXPECTED_SOURCE_SHA}"
          root="$RUNNER_TEMP/trnm-source-inventory"
          mkdir -p "$root"
          git rev-parse HEAD > "$root/HEAD"
          git rev-parse 'HEAD^{tree}' > "$root/TREE"
          git ls-files -z > "$root/tracked-files.nul"
          tar --null --files-from "$root/tracked-files.nul" \
            --sort=name --owner=0 --group=0 --numeric-owner \
            --create --gzip --file "$root/tracked-source.tar.gz"
          sha256sum "$root/tracked-source.tar.gz" > "$root/SHA256SUMS"
          printf '%s\n' 'artifact_schema=trnm-exact-source-inventory-v1' > "$root/METADATA.txt"
          printf 'source_commit=%s\n' "$(cat "$root/HEAD")" >> "$root/METADATA.txt"
          printf 'source_tree=%s\n' "$(cat "$root/TREE")" >> "$root/METADATA.txt"
          printf '%s\n' 'authority=read-only-audit-input' >> "$root/METADATA.txt"
          printf '%s\n' 'production_candidate=false' >> "$root/METADATA.txt"
          printf '%s\n' 'release_ready=false' >> "$root/METADATA.txt"
          printf '%s\n' 'activation_authority=false' >> "$root/METADATA.txt"
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload exact-source inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-source-inventory-${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: ${{ runner.temp }}/trnm-source-inventory
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Import verified native blobs without publishing a branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/chain-six-class-publish-20260911'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
          python3 scripts/ci/publish_native_namespace_objects_v1.py --publish \
            --output "$RUNNER_TEMP/native-blob-transport-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Retain blob identities only, not acceptance evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/chain-six-class-publish-20260911'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-blob-transport-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-blob-transport-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 1

# Exact-source audit refresh requested on 2026-09-02; no promotion authority.
