[package]
name = "trnm-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
autobins = false
default-run = "trnm-chain-node"

[package.metadata.trnm]
lane = "legacy-harness"
protocol_features_frozen = true
production_candidate = false

[[bin]]
name = "trnm-sim"
path = "src/main.rs"

[[bin]]
name = "trnm-chain-node"
path = "src/bin/trnm-chain-node.rs"

[[bin]]
name = "trnm-chain-validator"
path = "src/bin/trnm-chain-validator.rs"

[[bin]]
name = "trnm-chain-cli"
path = "src/bin/trnm-chain-cli.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }
trnm-pouw = { path = "../trnm-pouw" }
trnm-state = { path = "../trnm-state" }
trnm-types = { path = "../trnm-types" }
trnm-executor = { path = "../trnm-executor" }
trnm-mempool = { path = "../trnm-mempool" }
trnm-research-protocol = { path = "../trnm-research-protocol" }
trnm-finality-types = { path = "../trnm-finality-types" }
trnm-finality-verifier = { path = "../trnm-finality-verifier" }

[dev-dependencies]
trnm-state = { path = "../trnm-state", features = ["test-utils"] }
