name: TRNM G1-R4 Safety checkpoint v1 gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/trnm-g1-r4-safety-checkpoint-v1.yml"
      - "docs/development/packages/TRNM_G1_R4_SAFETY_CHECKPOINT_V1.md"
      - "docs/development/packages/TRNM_G1_R4_SAFETY_CHECKPOINT_V1.evidence.json"
      - "docs/development/interface-change-requests/A05_G1_R4_INTERFACE_REQUESTS_V1.json"
      - "scripts/ci/check_g1_r4_safety_checkpoint_v1.py"
      - "scripts/ci/check_g1_r4_safety_checkpoint_v1.sh"
      - "trillionnium/crates/trnm-whole-node-checkpoint-types/reference-r4-coordinator-v1/**"
  push:
    branches:
      - main
      - "feature/chain-g1-r4c-full-gap-closure-20260829"
    paths:
      - ".github/workflows/trnm-g1-r4-safety-checkpoint-v1.yml"
      - "docs/development/packages/TRNM_G1_R4_SAFETY_CHECKPOINT_V1.md"
      - "docs/development/packages/TRNM_G1_R4_SAFETY_CHECKPOINT_V1.evidence.json"
      - "docs/development/interface-change-requests/A05_G1_R4_INTERFACE_REQUESTS_V1.json"
      - "scripts/ci/check_g1_r4_safety_checkpoint_v1.py"
      - "scripts/ci/check_g1_r4_safety_checkpoint_v1.sh"
      - "trillionnium/crates/trnm-whole-node-checkpoint-types/reference-r4-coordinator-v1/**"

permissions:
  contents: read

concurrency:
  group: trnm-g1-r4-safety-checkpoint-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: UTF-8
  PYTHONUTF8: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"

jobs:
  safety-checkpoint-contract:
    name: G1-R4 Safety/checkpoint candidate contract
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      ((github.actor == 'ProfAlexQI' &&
        github.triggering_actor == 'ProfAlexQI') ||
       (github.actor == 'Tomasrgbsf' &&
        github.triggering_actor == 'Tomasrgbsf') ||
       (github.actor == 'github-actions[bot]' &&
        github.triggering_actor == 'github-actions[bot]' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.author_association == 'MEMBER')) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trillionnium-chain
          persist-credentials: false
          fetch-depth: 0

      - name: Verify A05 candidate coordinator and independent model
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_g1_r4_safety_checkpoint_v1.sh

      - name: Verify canonical Safety/checkpoint foundations
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          cargo test \
            --manifest-path trillionnium/Cargo.toml \
            --locked --offline \
            -p trnm-whole-node-checkpoint-types \
            -p trnm-consensus-safety-store \
            -p trnm-consensus-signer-journal \
            -p trnm-consensus-external-watermark \
            -p trnm-consensus-external-node-checkpoint

      - name: Verify canonical development plan
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_canonical_development_plan.sh

      - name: Verify native PoCO pre-cutover truth
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover

      - name: Verify project boundary
        working-directory: trillionnium-chain
        run: bash ./scripts/project-preflight.sh --audit
