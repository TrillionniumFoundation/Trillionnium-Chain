name: trnm-a23-native-replay-floor-inventory

on:
  push:
    branches:
      - feature/chain-a23-p2-native-replay-floor-v1-20260831
    paths:
      - .github/workflows/trnm-a23-native-replay-floor-inventory.yml

permissions:
  contents: read

concurrency:
  group: trnm-a23-native-replay-floor-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory-native-replay-floor-seams:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-a23-p2-native-replay-floor-v1-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact A23 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-a23-p2-native-replay-floor-v1-20260831
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable A22 parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2384e7e4ceb1fe63a0f29e91dab274d74940a8d3"

      - name: Inventory exact native replay-floor seams
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path

          queries = {
              Path('trillionnium/crates/trnm-native-execution-v0/src/durable.rs'): (
                  'struct DurablePV0',
                  'struct ConfirmedDurableExecutionHistoryRowV0',
                  'struct FinalizedNativeApplicationReadV0',
                  'impl FinalizedNativeApplicationReadV0',
                  'impl DurableNativeApplicationV0',
                  'signer_nonces',
                  'committed_signer_nonce_v0',
                  'read_finalized_by_height_with_proof_v0',
                  'read_finalized_by_block_id_with_proof_v0',
              ),
              Path('trillionnium/crates/trnm-native-execution-v0/src/store.rs'): (
                  'pub trait NativeExecutionStoreV0',
                  'committed_signer_nonce_v0',
              ),
              Path('trillionnium/crates/trnm-poco-node/src/tx_admission_wal_tombstone_gc_v1.inc'): (
                  'TxAdmissionReplayFloorEvidenceV1',
                  'TxAdmissionReplayFloorVerifierV1',
                  'VerifiedTxAdmissionReplayFloorV1',
                  'purge_tombstones_with_replay_floor_v1',
              ),
              Path('trillionnium/crates/trnm-application-tx-builder-v0/src/lib.rs'): (
                  'BuiltCanonicalTxV0',
                  'signer_id',
                  'protocol_tx_hash_v1',
                  'admission_view_v0',
              ),
          }

          for path, needles in queries.items():
              lines = path.read_text(encoding='utf-8').splitlines()
              print(f'=== FILE {path} lines={len(lines)} ===')
              emitted = set()
              for needle in needles:
                  matches = [index for index, line in enumerate(lines) if needle in line]
                  print(f'QUERY {needle!r} matches={[index + 1 for index in matches]}')
                  for index in matches[:12]:
                      start = max(0, index - 4)
                      end = min(len(lines), index + 8)
                      key = (start, end)
                      if key in emitted:
                          continue
                      emitted.add(key)
                      print(f'--- {path}:{start + 1}-{end} ---')
                      for offset in range(start, end):
                          print(f'{offset + 1}: {lines[offset]}')
          PY

      - name: Confirm probe leaves exact tree clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
