name: trnm-node-commit-exec-focused

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - '.github/workflows/trnm-node-commit-exec-focused.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trnm-node-commit-exec-focused-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"

jobs:
  refresh-lock:
    name: refresh-workspace-lock-x230
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/work/plan-v2-full-gap-closure-20260902' &&
      github.actor == 'ProfHepta' &&
      github.triggering_actor == github.actor
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 15
    steps:
      - name: Check out exact writable branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/plan-v2-full-gap-closure-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source and preprovisioned toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh --toolchain 1.95.0

      - name: Resolve only the workspace lock in strict offline mode
        run: |
          set -euo pipefail
          before_tree=$(git write-tree)
          cargo +1.95.0 metadata \
            --manifest-path trillionnium/Cargo.toml \
            --format-version 1 \
            --no-deps \
            --offline >/dev/null
          git diff --exit-code -- . ':!trillionnium/Cargo.lock'
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^ M trillionnium/Cargo.lock$' || true)"
          if git diff --quiet -- trillionnium/Cargo.lock; then
            echo "workspace_lock_refresh=no-change"
            exit 0
          fi
          git diff --check -- trillionnium/Cargo.lock
          git config user.name 'trnm-lock-refresh[bot]'
          git config user.email 'trnm-lock-refresh[bot]@users.noreply.github.com'
          git add trillionnium/Cargo.lock
          git commit -m 'chore(lock): synchronize authority and host path dependencies'
          git push origin HEAD:refs/heads/work/plan-v2-full-gap-closure-20260902
          echo "workspace_lock_refresh=committed"
          echo "workspace_lock_head=$(git rev-parse HEAD)"
          test "$before_tree" != "$(git write-tree)"
