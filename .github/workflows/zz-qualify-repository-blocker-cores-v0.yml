name: qualify-repository-blocker-cores-v0

on:
  push:
    branches: [work/plan-v2-repository-blockers-closure-20260902]
    paths: [.github/workflows/zz-qualify-repository-blocker-cores-v0.yml]

permissions:
  contents: read

concurrency:
  group: qualify-repository-blocker-cores-v0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/plan-v2-repository-blockers-closure-20260902' &&
      github.actor == 'Franksudoman'
    runs-on: self-hosted
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Exact-source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD^{tree} > /tmp/source-tree
      - name: Prepare deterministic lockfile and validate all repository cores
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/qualification.log) 2>&1
          cd trillionnium
          export CARGO_NET_OFFLINE=true
          cargo generate-lockfile --offline
          cargo fmt --all -- --check
          for package in \
            trnm-node-boundary-v0 \
            trnm-tx-lifecycle-v0 \
            trnm-state-sync-v0 \
            trnm-migration-v0 \
            trnm-control-plane-v0 \
            trnm-poco-node-production-v0 \
            trnm-release-bundle-v0
          do
            cargo test -p "${package}" --locked --offline
          done
          cargo check -p trnm-poco-node-production-v0 --all-targets --locked --offline
          cargo check --workspace --all-targets --locked --offline
      - name: Build exact qualification evidence and lockfile patch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qualification
          git diff --binary -- trillionnium/Cargo.lock > /tmp/qualification/cargo-lock.patch
          cp /tmp/qualification.log /tmp/qualification/qualification.log
          sha256sum /tmp/qualification/qualification.log | awk '{print $1}' > /tmp/qualification/log.sha256
          source_tree="$(cat /tmp/source-tree)"
          log_digest="$(cat /tmp/qualification/log.sha256)"
          lock_digest="$(sha256sum trillionnium/Cargo.lock | awk '{print $1}')"
          cat > /tmp/qualification/evidence.json <<JSON
          {
            "schema": "trnm.repository-blocker-cores-qualification.v0",
            "result": "pass",
            "source_commit": "${GITHUB_SHA}",
            "source_tree": "${source_tree}",
            "branch": "${GITHUB_REF_NAME}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "runner_environment": "self-hosted",
            "cargo_net_offline": true,
            "cargo_lock_sha256": "${lock_digest}",
            "qualification_log_sha256": "${log_digest}",
            "packages": [
              "trnm-node-boundary-v0",
              "trnm-tx-lifecycle-v0",
              "trnm-state-sync-v0",
              "trnm-migration-v0",
              "trnm-control-plane-v0",
              "trnm-poco-node-production-v0",
              "trnm-release-bundle-v0"
            ],
            "commands": [
              "cargo generate-lockfile --offline",
              "cargo fmt --all -- --check",
              "cargo test -p <each-new-package> --locked --offline",
              "cargo check -p trnm-poco-node-production-v0 --all-targets --locked --offline",
              "cargo check --workspace --all-targets --locked --offline"
            ],
            "non_claims": [
              "This repository qualification is not independent review.",
              "It does not prove live multi-host consensus, production adapter wiring, HSM behavior, physical power-loss recovery, external audit, wall-clock soak, governance approval, release readiness, public-testnet readiness, activation, or G5."
            ]
          }
          JSON
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: repository-blocker-cores-qualification-${{ github.sha }}
          path: /tmp/qualification
          if-no-files-found: error
          retention-days: 90

  record:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: repository-blocker-cores-qualification-${{ github.sha }}
          path: /tmp/qualification
      - name: Record exact-source qualification and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')" = "${GITHUB_SHA}"
          git apply --check /tmp/qualification/cargo-lock.patch
          git apply /tmp/qualification/cargo-lock.patch
          mkdir -p docs/evidence/repository
          cp /tmp/qualification/evidence.json \
            docs/evidence/repository/REPOSITORY_BLOCKER_CORES_V0_QUALIFICATION.json
          rm .github/workflows/zz-qualify-repository-blocker-cores-v0.yml
          git config user.name 'trnm-closure-bot'
          git config user.email 'trnm-closure-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(core): qualify repository blocker cores at exact source'
          git push origin "HEAD:${GITHUB_REF_NAME}"
