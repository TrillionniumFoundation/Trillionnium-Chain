name: PoCO final security dispatch (one-shot)

on:
  push:
    branches:
      - ops/poco-external-blocker-convergence-20260910-r2
    paths:
      - .github/workflows/poco-final-security-dispatch-once-20260910.yml

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  security-events: read
  metadata: read

env:
  PRODUCT_BRANCH: chore/poco-only-purge-20260909
  EVIDENCE_BRANCH: evidence/poco-external-blocker-convergence-20260910-r2
  PR_NUMBER: "117"

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out operations branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/poco-external-blocker-convergence-20260910-r2
          fetch-depth: 0
          persist-credentials: true

      - name: Dispatch eligible final-source security workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PRODUCT_BRANCH" "$EVIDENCE_BRANCH" || true
          product_commit=$(git rev-parse "origin/$PRODUCT_BRANCH")
          product_tree=$(git rev-parse "$product_commit^{tree}")
          PRODUCT_COMMIT="$product_commit" PRODUCT_TREE="$product_tree" python3 - <<'PY'
          from __future__ import annotations
          import base64, datetime as dt, json, os, re, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          repo=os.environ['GH_REPO']; token=os.environ['GH_TOKEN']
          branch=os.environ['PRODUCT_BRANCH']; commit=os.environ['PRODUCT_COMMIT']; tree=os.environ['PRODUCT_TREE']
          api='https://api.github.com'
          keywords=re.compile(r'(codeql|security|audit|fuzz|qualification|hardening|supply|dependency)',re.I)

          def req(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(api+path,data=data,method=method)
              for k,v in {
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'trnm-final-security-dispatch',
              }.items(): r.add_header(k,v)
              try:
                  with urllib.request.urlopen(r,timeout=60) as x:
                      b=x.read(); return x.status,json.loads(b) if b else None
              except urllib.error.HTTPError as e:
                  b=e.read().decode(errors='replace')
                  try:b=json.loads(b)
                  except:b={'message':b}
                  return e.code,b

          status,body=req('GET',f'/repos/{repo}/actions/workflows?per_page=100')
          if status!=200: raise SystemExit(f'workflow inventory failed: {status} {body}')
          records=[]
          for wf in body.get('workflows',[]):
              path=wf.get('path') or ''
              name=wf.get('name') or ''
              if not keywords.search(name+' '+path): continue
              st,obj=req('GET',f'/repos/{repo}/contents/{urllib.parse.quote(path,safe="/")}?ref={urllib.parse.quote(branch,safe="")}')
              if st!=200 or not isinstance(obj,dict) or not obj.get('content'):
                  records.append({'workflow_id':wf.get('id'),'name':name,'path':path,'status':'not-present-on-product-branch','read_status':st})
                  continue
              try:text=base64.b64decode(obj['content']).decode(errors='replace')
              except Exception as exc:
                  records.append({'workflow_id':wf.get('id'),'name':name,'path':path,'status':'decode-error','error':repr(exc)})
                  continue
              if 'workflow_dispatch' not in text:
                  records.append({'workflow_id':wf.get('id'),'name':name,'path':path,'status':'no-manual-dispatch'})
                  continue
              # Avoid dispatching any temporary purge/convergence operation from the product source.
              if re.search(r'(temporary|purge|convergence|diagnostic|metadata-cleanup)',name+' '+path,re.I):
                  records.append({'workflow_id':wf.get('id'),'name':name,'path':path,'status':'excluded-operational-workflow'})
                  continue
              ds,resp=req('POST',f'/repos/{repo}/actions/workflows/{wf["id"]}/dispatches',{'ref':branch})
              records.append({'workflow_id':wf.get('id'),'name':name,'path':path,'status':'dispatched' if ds==204 else 'dispatch-failed','http_status':ds,'response':resp})

          ledger={
              'schema':'trnm.poco.final-security-dispatch.v1',
              'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),
              'repository':repo,
              'product_branch':branch,
              'source_commit':commit,
              'source_tree':tree,
              'records':records,
              'dispatch_is_not_external_audit_acceptance':True,
              'external_audit_closed':False,
              'all_external_blockers_closed':False,
              'release_ready':False,
          }
          out=Path(os.environ['RUNNER_TEMP'])/'poco-final-security-dispatch-v1.json'
          out.write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'source_commit':commit,'dispatched':sum(x.get('status')=='dispatched' for x in records),'external_audit_closed':False},sort_keys=True))
          PY

      - name: Publish security dispatch ledger
        shell: bash
        run: |
          set -euo pipefail
          ledger="${RUNNER_TEMP}/poco-final-security-dispatch-v1.json"
          test -s "$ledger"
          worktree="${RUNNER_TEMP}/trnm-security-dispatch-ledger"
          rm -rf "$worktree"
          git worktree add --detach "$worktree" "origin/$EVIDENCE_BRANCH"
          cd "$worktree"
          mkdir -p evidence/external-orchestration
          cp "$ledger" evidence/external-orchestration/poco-final-security-dispatch-v1.json
          git add evidence/external-orchestration/poco-final-security-dispatch-v1.json
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "evidence: record final-source security workflow dispatch"
          git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"

      - name: Comment source-bound dispatch status on PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path
          repo=os.environ['GH_REPO']; token=os.environ['GH_TOKEN']; pr=os.environ['PR_NUMBER']
          ledger=json.loads((Path(os.environ['RUNNER_TEMP'])/'poco-final-security-dispatch-v1.json').read_text())
          dispatched=[x for x in ledger['records'] if x.get('status')=='dispatched']
          lines='\n'.join(f"- `{x['name']}` (`{x['path']}`)" for x in dispatched) or '- No eligible manual security workflow was exposed on the exact product branch.'
          body=(f"### Final-source security workflow dispatch\n\nExact product source: `{ledger['source_commit']}` / tree `{ledger['source_tree']}`.\n\n{lines}\n\n"
                "These runs are supplementary repository-owned evidence. They do not constitute the independent audit required by `EXT-AUDIT-001`, and release status remains fail-closed.")
          data=json.dumps({'body':body}).encode()
          r=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/{pr}/comments',data=data,method='POST')
          for k,v in {'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'trnm-security-dispatch-comment'}.items(): r.add_header(k,v)
          try:
              urllib.request.urlopen(r,timeout=60).read()
          except urllib.error.HTTPError as e:
              raise SystemExit(f'PR comment failed: {e.code} {e.read().decode(errors="replace")}')
          PY
