name: tmp-plan-v2-apply-nonworkflow-patch

on:
  push:
    branches:
      - fix/chain-plan-v2-repository-closure-20260911
    paths:
      - .github/workflows/tmp-plan-v2-apply-nonworkflow-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/chain-plan-v2-repository-closure-20260911
          fetch-depth: 0
      - name: Apply exact non-workflow closure patch
        shell: bash
        run: |
          set -euo pipefail
          cat .plan-v2-tmp/closure.part* > "$RUNNER_TEMP/closure.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/closure.patch.gz.b64" > "$RUNNER_TEMP/closure.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/closure.patch.gz" > "$RUNNER_TEMP/closure.patch"
          git apply --index --check "$RUNNER_TEMP/closure.patch"
          git apply --index "$RUNNER_TEMP/closure.patch"
          git diff --cached --check
          git config user.name "OpenAI Plan v2 closure"
          git config user.email "noreply@openai.com"
          git commit -m "ci(consensus): retire stale local lane and refresh Plan v2 registry"
          git push origin HEAD:fix/chain-plan-v2-repository-closure-20260911
