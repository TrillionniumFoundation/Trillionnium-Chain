name: native-poco-lock-refresh-once

on:
  push:
    branches:
      - fix/chain-restore-native-poco
    paths:
      - '.github/workflows/native-poco-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/chain-restore-native-poco
          fetch-depth: 0

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0

      - name: Generate native workspace lock
        run: cargo generate-lockfile --manifest-path trillionnium/Cargo.toml

      - name: Verify native PoCO repository boundary
        run: bash scripts/ci/check_native_poco_consensus_boundary.sh

      - name: Verify locked workspace metadata
        run: cargo metadata --manifest-path trillionnium/Cargo.toml --locked --no-deps --format-version 1 >/tmp/trnm-metadata.json

      - name: Test PoCO core
        run: cargo test --manifest-path trillionnium/Cargo.toml -p trnm-pouw --lib --locked

      - name: Test native node library
        run: cargo test --manifest-path trillionnium/Cargo.toml -p trnm-node --features native-consensus --lib --locked

      - name: Scan current tree for removed external consensus integration
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEi \
            '(cometbft|tendermint|trnm[-_]consensus[-_]app|trnm[-_]cometbft|(^|[^[:alpha:]])abci([^[:alpha:]]|$))' \
            -- . ':(exclude).github/workflows/native-poco-lock-refresh.yml'; then
            echo 'External consensus integration residue remains in the current tree.' >&2
            exit 1
          fi
          echo 'external_consensus_residue_scan=clean'

      - name: Upload generated lock for audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-poco-cargo-lock-${{ github.run_id }}
          path: trillionnium/Cargo.lock
          if-no-files-found: error

      - name: Commit lock and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/native-poco-lock-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(deps): refresh native PoCO workspace lock'
          git push origin HEAD:fix/chain-restore-native-poco
