name: PoCO qualified gap overlay R20 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-qualified-gap-overlay-r20-once-20260910.yml

concurrency:
  group: poco-only-final-convergence
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pull-requests: read

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r20-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"

jobs:
  converge:
    name: Qualify exact native PoCO tree and execute available evidence campaigns
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact convergence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned tools and compile one-shot controllers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep jq
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked
          python3 -m py_compile \
            tools/temporary_poco_gap_overlay_r19.py \
            tools/temporary_poco_productize_r20.py \
            tools/temporary_poco_qualify_r20.py
          cp tools/temporary_poco_gap_overlay_r19.py /tmp/trnm-r20-overlay.py
          cp tools/temporary_poco_qualify_r20.py /tmp/trnm-r20-qualify.py
          python3 -m py_compile \
            /tmp/trnm-r20-overlay.py \
            /tmp/trnm-r20-qualify.py

      - name: Complete native-only product materialization and re-check out published head
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temporary_poco_productize_r20.py
          if [[ -f tools/temporary_poco_convergence_r13.sh ]]; then
            python3 -m py_compile \
              tools/temporary_poco_native_convergence_r13.py \
              tools/temporary_poco_r13_postfix.py
            bash -n tools/temporary_poco_convergence_r13.sh
            CARGO_TARGET_DIR=/tmp/trnm-r20-target \
              bash tools/temporary_poco_convergence_r13.sh
          fi
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute exact-tree convergence, qualification, publication and evidence orchestration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 /tmp/trnm-r20-qualify.py

      - name: Upload exact R20 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r20-qualified-gap-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/trnm-r20-initial-commit.txt
            /tmp/trnm-r20-initial-tree.txt
            /tmp/trnm-r20-overlay-rounds.log
            /tmp/trnm-r19-overlay-search.json
            /tmp/trnm-r19-overlay-summary.txt
            /tmp/trnm-r20-overlay-applied-count.txt
            /tmp/trnm-r20-gap-classification.json
            /tmp/trnm-r20-gap-summary.txt
            /tmp/trnm-r20-repository-gap-count.txt
            /tmp/trnm-r20-native-only.json
            /tmp/trnm-r20-canonical-plan.log
            /tmp/trnm-r20-mainline.log
            /tmp/trnm-r20-repository-truth.json
            /tmp/trnm-r20-protocol-contract.json
            /tmp/trnm-r20-workspace-check.log
            /tmp/trnm-r20-contract-check.log
            /tmp/trnm-r20-workspace-test.log
            /tmp/trnm-r20-contract-test.log
            /tmp/trnm-r20-contract-clippy.log
            /tmp/trnm-r20-boundary-clippy.log
            /tmp/trnm-r20-final-commit.txt
            /tmp/trnm-r20-final-tree.txt
            /tmp/trnm-r20-external-dispatch.json
            /tmp/trnm-r20-external-runs.json
            /tmp/trnm-r20-external-artifacts
            /tmp/trnm-r20-external-evidence.json
            /tmp/trnm-r20-external-evidence.log
            /tmp/trnm-r20-external-evidence-status.txt
