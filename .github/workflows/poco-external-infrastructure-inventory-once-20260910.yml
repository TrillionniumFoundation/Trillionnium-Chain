name: PoCO external infrastructure inventory (one-shot)

on:
  push:
    branches:
      - ops/poco-external-blocker-convergence-20260910-r2
    paths:
      - .github/workflows/poco-external-infrastructure-inventory-once-20260910.yml

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  metadata: read

env:
  PRODUCT_BRANCH: chore/poco-only-purge-20260909
  EVIDENCE_BRANCH: evidence/poco-external-blocker-convergence-20260910-r2
  PR_NUMBER: "117"

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out operations branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/poco-external-blocker-convergence-20260910-r2
          fetch-depth: 0
          persist-credentials: true

      - name: Query repository and organization infrastructure surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PRODUCT_BRANCH" "$EVIDENCE_BRANCH"
          product_commit=$(git rev-parse "origin/$PRODUCT_BRANCH")
          product_tree=$(git rev-parse "$product_commit^{tree}")
          PRODUCT_COMMIT="$product_commit" PRODUCT_TREE="$product_tree" python3 - <<'PY'
          from __future__ import annotations
          import datetime as dt, json, os, urllib.error, urllib.request
          from pathlib import Path

          repo=os.environ['GH_REPO']; owner=repo.split('/',1)[0]; token=os.environ['GH_TOKEN']
          commit=os.environ['PRODUCT_COMMIT']; tree=os.environ['PRODUCT_TREE']

          def req(path):
              r=urllib.request.Request('https://api.github.com'+path,method='GET')
              for k,v in {
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'trnm-external-infrastructure-inventory',
              }.items():r.add_header(k,v)
              try:
                  with urllib.request.urlopen(r,timeout=60) as x:
                      b=x.read();return x.status,json.loads(b) if b else None
              except urllib.error.HTTPError as e:
                  b=e.read().decode(errors='replace')
                  try:b=json.loads(b)
                  except:b={'message':b}
                  return e.code,b

          surfaces={}
          for key,path in {
              'repository_runners':f'/repos/{repo}/actions/runners?per_page=100',
              'organization_runners':f'/orgs/{owner}/actions/runners?per_page=100',
              'repository_environments':f'/repos/{repo}/environments?per_page=100',
              'repository_variables':f'/repos/{repo}/actions/variables?per_page=100',
              'organization_variables':f'/orgs/{owner}/actions/variables?per_page=100',
          }.items():
              status,body=req(path)
              # Never expose secret values: these endpoints contain names and metadata only.
              surfaces[key]={'status':status,'body':body}

          repo_runners=(surfaces['repository_runners']['body'] or {}).get('runners',[]) \
              if surfaces['repository_runners']['status']==200 else []
          org_runners=(surfaces['organization_runners']['body'] or {}).get('runners',[]) \
              if surfaces['organization_runners']['status']==200 else []
          all_runners=[]
          seen=set()
          for scope,items in [('repository',repo_runners),('organization',org_runners)]:
              for item in items:
                  rid=(scope,item.get('id'))
                  if rid in seen:continue
                  seen.add(rid)
                  all_runners.append({
                      'scope':scope,'id':item.get('id'),'name':item.get('name'),
                      'os':item.get('os'),'status':item.get('status'),'busy':item.get('busy'),
                      'labels':[label.get('name') for label in item.get('labels',[])],
                  })

          requirements={
              'EXT-G1-CAMPAIGN-001':['self-hosted','trnm-poco-g1'],
              'EXT-ANCHOR-HSM-001':['self-hosted','trnm-poco-hsm'],
              'EXT-POWERLOSS-001':['self-hosted','trnm-poco-powerloss'],
              'EXT-SOAK-ACTIVATION-001':['self-hosted','trnm-poco-soak'],
          }
          matches={}
          for blocker,labels in requirements.items():
              required={label.casefold() for label in labels}
              matches[blocker]=[
                  runner for runner in all_runners
                  if required<={label.casefold() for label in runner['labels']}
              ]

          environments=(surfaces['repository_environments']['body'] or {}).get('environments',[]) \
              if surfaces['repository_environments']['status']==200 else []
          environment_names=[item.get('name') for item in environments]
          variable_names=[]
          for key in ('repository_variables','organization_variables'):
              if surfaces[key]['status']==200:
                  variable_names.extend(item.get('name') for item in (surfaces[key]['body'] or {}).get('variables',[]))

          inventory={
              'schema':'trnm.poco.external-infrastructure-inventory.v1',
              'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),
              'repository':repo,'source_commit':commit,'source_tree':tree,
              'api_surface_status':{key:value['status'] for key,value in surfaces.items()},
              'runners':all_runners,
              'required_runner_labels':requirements,
              'matching_runners':matches,
              'environment_names':environment_names,
              'non_secret_variable_names':sorted(set(name for name in variable_names if name)),
              'hardware_or_independence_proven_by_inventory':False,
              'all_external_blockers_closed':False,
              'release_ready':False,
          }
          out=Path(os.environ['RUNNER_TEMP'])/'poco-external-infrastructure-inventory-v1.json'
          out.write_text(json.dumps(inventory,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'api_surface_status':inventory['api_surface_status'],
              'runner_count':len(all_runners),
              'matching_runner_counts':{key:len(value) for key,value in matches.items()},
              'environment_names':environment_names,
              'all_external_blockers_closed':False,
          },sort_keys=True))
          PY

      - name: Publish infrastructure inventory ledger
        shell: bash
        run: |
          set -euo pipefail
          ledger="${RUNNER_TEMP}/poco-external-infrastructure-inventory-v1.json"
          test -s "$ledger"
          worktree="${RUNNER_TEMP}/trnm-infrastructure-inventory-publish"
          rm -rf "$worktree"
          git worktree add --detach "$worktree" "origin/$EVIDENCE_BRANCH"
          cd "$worktree"
          mkdir -p evidence/external-orchestration
          cp "$ledger" evidence/external-orchestration/poco-external-infrastructure-inventory-v1.json
          git add evidence/external-orchestration/poco-external-infrastructure-inventory-v1.json
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "evidence: record external infrastructure inventory"
          git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"

      - name: Comment actionable infrastructure inventory on PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          from pathlib import Path
          repo=os.environ['GH_REPO'];token=os.environ['GH_TOKEN'];pr=os.environ['PR_NUMBER']
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'poco-external-infrastructure-inventory-v1.json').read_text())
          counts={key:len(value) for key,value in d['matching_runners'].items()}
          rows='\n'.join(f'| `{key}` | `{", ".join(d["required_runner_labels"][key])}` | {count} |' for key,count in counts.items())
          marker=f"<!-- trnm-external-infrastructure-inventory-v1:{d['source_commit']} -->"
          body=(f"{marker}\n### External infrastructure inventory\n\nExact source: `{d['source_commit']}` / tree `{d['source_tree']}`.\n\n"
                "| Blocker | Required runner labels | Visible matching runners |\n|---|---|---:|\n"+rows+"\n\n"
                f"API visibility: `{json.dumps(d['api_surface_status'],sort_keys=True)}`.\n\n"
                "Runner visibility and label matching do not prove independent operators, HSM non-exportability, physical power-loss capability, or production-shaped soak execution. All blockers remain OPEN.")
          data=json.dumps({'body':body}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/{pr}/comments',data=data,method='POST')
          for k,v in {'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'trnm-infra-comment'}.items():req.add_header(k,v)
          try:urllib.request.urlopen(req,timeout=60).read()
          except urllib.error.HTTPError as e:raise SystemExit(f'comment failed: {e.code} {e.read().decode(errors="replace")}')
          PY
