name: trnm-admin-trust-migration-once

on:
  push:
    branches:
      - integration/native-poco-a04-a19-a23-qualified-v1-20260901
    paths:
      - .github/workflows/trnm-admin-trust-migration-once.yml

permissions:
  contents: write

concurrency:
  group: trnm-admin-trust-migration-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/integration/native-poco-a04-a19-a23-qualified-v1-20260901' &&
      github.actor == 'Franksudoman'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: f89311c91b5f8b978959f6739164e972ad368c14
      TARGET_BRANCH: integration/native-poco-a04-a19-a23-qualified-v1-20260901
      SELF_PATH: .github/workflows/trnm-admin-trust-migration-once.yml
      SCRIPT_PATH: scripts/ci/trnm_admin_trust_migration_once.py
      STAGING_ROOT: .trnm-admin-trust-migration-v1
    steps:
      - name: Check out exact migration commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-shot source boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = "2"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$SELF_PATH"
          python3 -m py_compile "$SCRIPT_PATH"

      - name: Prepare and validate bounded trust migration
        run: |
          set -euo pipefail
          python3 "$SCRIPT_PATH"
          bash -n scripts/check_ci_runner_policy.sh
          bash -n scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh
          bash scripts/check_ci_runner_policy.sh --worktree
          bash scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh --self-test
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(\.github/workflows/[^/]+\.ya?ml|scripts/check_ci_runner_policy\.sh|scripts/ci/check_poco_bft_v0_workflow_trigger_truth\.sh|scripts/ci/trnm_admin_trust_migration_once\.py)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected migration paths:\n%s\n' "$unexpected" >&2
            exit 2
          fi
          test ! -e "$SELF_PATH"
          test ! -e "$SCRIPT_PATH"

      - name: Materialize validated blobs under ordinary staging paths
        run: |
          set -euo pipefail
          rm -rf "$STAGING_ROOT"
          mkdir -p "$STAGING_ROOT/files"
          : > "$STAGING_ROOT/deletes.txt"
          : > "$STAGING_ROOT/files.txt"
          while IFS= read -r -d '' path; do
            if [[ -f "$path" ]]; then
              mkdir -p "$STAGING_ROOT/files/$(dirname "$path")"
              cp -p -- "$path" "$STAGING_ROOT/files/$path"
              printf '%s\n' "$path" >> "$STAGING_ROOT/files.txt"
            else
              printf '%s\n' "$path" >> "$STAGING_ROOT/deletes.txt"
            fi
          done < <(git diff --name-only -z)
          git rev-parse HEAD > "$STAGING_ROOT/source-commit.txt"
          LC_ALL=C sort -o "$STAGING_ROOT/files.txt" "$STAGING_ROOT/files.txt"
          LC_ALL=C sort -o "$STAGING_ROOT/deletes.txt" "$STAGING_ROOT/deletes.txt"
          test -s "$STAGING_ROOT/files.txt"
          test -s "$STAGING_ROOT/deletes.txt"

          git restore --worktree --staged -- .
          git diff --exit-code -- .
          git add "$STAGING_ROOT"
          test -z "$(git diff --cached --name-only | grep -Ev '^\.trnm-admin-trust-migration-v1/' || true)"
          git diff --cached --check

      - name: Publish validated blobs without modifying workflow paths
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci: stage validated administrator trust blobs"
          git push origin "HEAD:${TARGET_BRANCH}"
