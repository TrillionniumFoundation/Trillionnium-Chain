name: trnm-c0-exact-source-export

on:
  pull_request:
    branches:
      - feature/chain-foundation-recovery-20260908
    paths:
      - '**'

permissions:
  contents: read

concurrency:
  group: trnm-c0-exact-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-export:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.actor == 'ProfHepta' &&
      github.triggering_actor == github.actor &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Archive exact PR source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trnm-source-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz --output="$archive" HEAD
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload exact source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-c0-exact-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/trnm-source-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/trnm-source-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
