name: ops-apply-main-protection-v2

on:
  push:
    branches:
      - ops/main-tree-convergence-audit-20260909
    paths:
      - .github/workflows/ops-apply-main-protection-v2.yml

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ops-apply-main-protection-v2-20260909
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'TrillionniumFoundation/Trillionnium-Chain'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      API_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/Trillionnium-Chain
      PRIMARY_PR: '101'
      FALLBACK_PR: '62'
      MAIN_BRANCH: main
      TRACKING_ISSUE: '40'
      CHANGE_TICKET: user-authorized-main-convergence-20260909
    steps:
      - name: Freeze exact policy source and main
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          primary="$(gh api "repos/$REPOSITORY/pulls/$PRIMARY_PR")"
          if [ "$(jq -r .state <<<"$primary")" = open ]; then
            sha="$(jq -r .head.sha <<<"$primary")"
          else
            fallback="$(gh api "repos/$REPOSITORY/pulls/$FALLBACK_PR")"
            test "$(jq -r .state <<<"$fallback")" = open
            sha="$(jq -r .head.sha <<<"$fallback")"
          fi
          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/$MAIN_BRANCH" --jq .object.sha)"
          test "${#sha}" -eq 40
          test "${#main_sha}" -eq 40
          {
            echo "source_sha=$sha"
            echo "main_sha=$main_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out exact machine policy source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.freeze.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Construct strict GitHub API payload from repository policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.freeze.outputs.source_sha }}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('config/repository-policy-v1.json').read_text())
          required = policy['required_check_names']
          review = policy['required_review_policy']
          merge = policy['required_merge_policy']
          if required != [
              'repository-truth', 'protocol-contract', 'fuzz-smoke',
              'rust-baseline', 'external-evidence-contract'
          ]:
              raise SystemExit(f'unexpected required-check set/order: {required}')
          if review['approvals'] < 2 or not all([
              review['code_owner_review'], review['last_push_approval'],
              review['dismiss_stale_reviews'], review['author_cannot_supply_independent_acceptance'],
          ]):
              raise SystemExit('review policy is weaker than the required contract')
          if not merge['pull_request_only'] or merge['force_push'] or merge['branch_deletion']:
              raise SystemExit('merge policy is weaker than required')
          payload = {
              'required_status_checks': {'strict': True, 'contexts': required},
              'enforce_admins': True,
              'required_pull_request_reviews': {
                  'dismissal_restrictions': {},
                  'dismiss_stale_reviews': True,
                  'require_code_owner_reviews': True,
                  'required_approving_review_count': review['approvals'],
                  'require_last_push_approval': True,
                  'bypass_pull_request_allowances': {},
              },
              'restrictions': None,
              'required_linear_history': True,
              'allow_force_pushes': False,
              'allow_deletions': False,
              'block_creations': False,
              'required_conversation_resolution': True,
              'lock_branch': False,
              'allow_fork_syncing': False,
          }
          Path('/tmp/main-protection-request.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          PY
          python3 -m py_compile \
            scripts/admin/apply_main_protection_v1.py \
            scripts/ci/test_main_protection_v1.py
          python3 scripts/ci/test_main_protection_v1.py

      - name: Attempt live protection mutation and exact readback
        id: live
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/main-protection"
          mkdir -p "$out"
          cp /tmp/main-protection-request.json "$out/request.json"
          printf 'source_sha=%s\nmain_sha=%s\nchange_ticket=%s\n' \
            "${{ steps.freeze.outputs.source_sha }}" \
            "${{ steps.freeze.outputs.main_sha }}" \
            "$CHANGE_TICKET" > "$out/binding.env"
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/$MAIN_BRANCH" --jq .object.sha)" \
            = "${{ steps.freeze.outputs.main_sha }}"

          put_code="$({ curl --silent --show-error \
            --request PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $API_TOKEN" \
            --data-binary @/tmp/main-protection-request.json \
            --output "$out/put-response.json" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$REPOSITORY/branches/$MAIN_BRANCH/protection"; } \
            2>"$out/put.stderr")"
          printf '%s\n' "$put_code" > "$out/put-http-code.txt"

          get_code="$({ curl --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $API_TOKEN" \
            --output "$out/readback.json" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$REPOSITORY/branches/$MAIN_BRANCH/protection"; } \
            2>"$out/get.stderr")"
          printf '%s\n' "$get_code" > "$out/get-http-code.txt"
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/$MAIN_BRANCH" --jq .object.sha)" \
            = "${{ steps.freeze.outputs.main_sha }}"

          result=denied_or_unreadable
          if [ "$put_code" = 200 ] && [ "$get_code" = 200 ]; then
            python3 - "$out" <<'PY'
          import json, sys
          from pathlib import Path
          out=Path(sys.argv[1])
          expected=json.loads((out/'request.json').read_text())
          live=json.loads((out/'readback.json').read_text())
          contexts=set((live.get('required_status_checks') or {}).get('contexts') or [])
          required=set(expected['required_status_checks']['contexts'])
          reviews=live.get('required_pull_request_reviews') or {}
          checks=[
              (live.get('required_status_checks') or {}).get('strict') is True,
              required <= contexts,
              reviews.get('required_approving_review_count',0) >= 2,
              reviews.get('dismiss_stale_reviews') is True,
              reviews.get('require_code_owner_reviews') is True,
              reviews.get('require_last_push_approval') is True,
              (live.get('required_conversation_resolution') or {}).get('enabled') is True,
              (live.get('allow_force_pushes') or {}).get('enabled') is False,
              (live.get('allow_deletions') or {}).get('enabled') is False,
          ]
          if not all(checks):
              raise SystemExit('live main protection readback is weaker than requested')
          PY
            result=applied_and_read_back
          fi
          printf '%s\n' "$result" > "$out/result.txt"
          (
            cd "$out"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          {
            echo "result=$result"
            echo "put_code=$put_code"
            echo "get_code=$get_code"
          } >> "$GITHUB_OUTPUT"

      - name: Record live administrator outcome on tracking issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/main-protection"
          result="$(cat "$out/result.txt" 2>/dev/null || echo preflight_or_execution_failure)"
          put_code="$(cat "$out/put-http-code.txt" 2>/dev/null || echo none)"
          get_code="$(cat "$out/get-http-code.txt" 2>/dev/null || echo none)"
          digest="$(sha256sum "$out/SHA256SUMS" 2>/dev/null | awk '{print $1}' || true)"
          gh api "repos/$REPOSITORY/issues/$TRACKING_ISSUE/comments" \
            -f body="Live main-protection transaction: **$result**; PUT HTTP=\`$put_code\`; GET HTTP=\`$get_code\`; source=\`${{ steps.freeze.outputs.source_sha }}\`; frozen main=\`${{ steps.freeze.outputs.main_sha }}\`; evidence-manifest digest=\`${digest:-unavailable}\`. Even applied/read-back settings do not close RPO-GITHUB-SETTINGS-001 until normal-actor negative denial traces prove PR-only, review, force-push, deletion and administrator enforcement." >/dev/null

      - name: Upload immutable protection packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-protection-v2-${{ github.sha }}
          path: ${{ runner.temp }}/main-protection
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed unless live settings are applied and readable
        if: always()
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/main-protection/result.txt" 2>/dev/null || true)" = applied_and_read_back
