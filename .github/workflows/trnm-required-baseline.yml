name: trnm-required-baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  TRNM_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
jobs:
  repository-truth:
    name: repository-truth
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        run: test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Run actual repository-truth checks
        run: bash scripts/ci/ci_job.sh repository-truth
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
  protocol-contract:
    name: protocol-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        run: test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Install pinned compiler and tools in isolated hosted runner
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Install isolated conformance-only Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/pon-contract-env"
          "$RUNNER_TEMP/pon-contract-env/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r formal/pon-nakamoto-v1/requirements.txt
          echo "$RUNNER_TEMP/pon-contract-env/bin" >> "$GITHUB_PATH"
      - name: Run actual protocol-contract checks
        run: bash scripts/ci/ci_job.sh protocol-contract
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        run: test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Install pinned compiler and tools in isolated hosted runner
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Run actual fuzz-smoke checks
        run: bash scripts/ci/ci_job.sh fuzz-smoke
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
  rust-baseline:
    name: rust-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        run: test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Install pinned compiler and tools in isolated hosted runner
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Install hash-pinned cargo-deny
        env:
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny-0.20.2.tar.gz"
          install_dir="$RUNNER_TEMP/cargo-deny"
          curl --fail --silent --show-error --location \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$archive" | sha256sum --check -
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --strip-components=1 --directory "$install_dir"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Run pinned cargo-deny supply-chain checks
        run: cargo-deny --manifest-path trillionnium/Cargo.toml --all-features --workspace --locked check
      - name: Run actual rust-baseline checks
        run: bash scripts/ci/ci_job.sh rust-baseline
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
  external-evidence-contract:
    name: external-evidence-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        run: test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Run actual external-evidence-contract checks
        run: bash scripts/ci/ci_job.sh external-evidence-contract
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
