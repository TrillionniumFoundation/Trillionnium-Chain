[package]
name = "trnm-w1-full-guest-v2"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["std", "disable-dev-mode"] }
trnm-w1-zk-relation = { path = "../../relation" }

# Same SHA-256 relation and pinned extension as v1. The distinct guest image and
# JOURNAL2 domain bind the added raw A/B artifact commitments.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", rev = "244dc3b08788f7a4ccce14c66896ae3b4f24c166" }
