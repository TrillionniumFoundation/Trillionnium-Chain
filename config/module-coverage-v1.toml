production_authority = false

[policy]
one_primary_module_per_workspace_crate = true
one_primary_module_per_auxiliary_unit = true
all_modules_require_technical_reference = true
all_modules_require_slo_profile = true
all_modules_require_testkit_profile = true
all_modules_require_contract_paths = true
all_modules_require_evidence_roots = true
module_dependency_graph_must_be_acyclic = true
production_may_depend_on_candidate_or_lab = false
control_plane_may_hold_consensus_authority = false

