name: Trillionnium Chain six-machine availability

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this bounded runner probe is being requested
        required: false
        default: operator-check
        type: string

# This is a routing probe, not a Chain build or node campaign. It deliberately
# does not check out source and has no repository token permissions.
permissions: {}

jobs:
  desktop:
    name: Chain desktop runner probe
    runs-on: [self-hosted, linux, x64, chain-fleet, desktop]
    timeout-minutes: 10
    steps:
      - name: Verify desktop slot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = desktop
          uname -a

  rog:
    name: Chain ROG runner probe
    runs-on: [self-hosted, linux, x64, chain-fleet, rog]
    timeout-minutes: 10
    steps:
      - name: Verify ROG slot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = rog
          uname -a

  x230:
    name: Chain X230 runner probe
    runs-on: [self-hosted, linux, x64, chain-fleet, x230]
    timeout-minutes: 10
    steps:
      - name: Verify organization X230 slot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
