syntax = "proto3";
package chain.workload;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "chain/x/workload/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "chain/x/workload/Params";
  option (gogoproto.equal) = true;

  string workload_denom = 1;
  uint64 challenge_window_blocks = 2;
  uint64 challenge_deposit = 3;
  uint64 challenger_slash_percent = 4;
  uint64 worker_slash_percent_on_bad_result = 5;
}