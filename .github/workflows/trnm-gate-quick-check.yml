name: trnm-gate-quick-check

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/trnm-gate-quick-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/trnm-gate-quick-check.yml'
  workflow_dispatch:

jobs:
  shell-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check (scripts)
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            bash -n "$f"
          done

      - name: Shellcheck (scripts)
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            shellcheck "$f"
          done
