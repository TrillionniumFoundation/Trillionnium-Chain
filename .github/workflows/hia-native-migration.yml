      - name: Force both actual Work handshake races and reject invalid states
        run: |-
          set -euo pipefail
          python3 - "$RUNNER_TEMP/hia-work-handshake-original" <<'PY'
          import hashlib, pathlib, sys, tarfile
          source = pathlib.Path('hia/qualification/work-handshake-original-build.tar.xz')
          if hashlib.sha256(source.read_bytes()).hexdigest() != 'bec8554a436aac64b3ef6fd60ed4fba30e93fdf5a48db7c6cdf06e9edce90ed9':
              raise SystemExit('Retained original HIA build archive identity differs')
          target = pathlib.Path(sys.argv[1])
          target.mkdir(mode=0o700)
          seen = set()
          with tarfile.open(source, 'r:xz') as archive:
              for member in archive:
                  name = pathlib.PurePosixPath(member.name)
                  if (not member.isfile() or name.is_absolute() or '..' in name.parts
                          or str(name) != member.name or name.parts[0] != 'original-build'
                          or member.name in seen):
                      raise SystemExit('Retained build has an invalid member')
                  seen.add(member.name)
                  data = archive.extractfile(member).read()
                  if len(data) != member.size:
                      raise SystemExit('Retained build has a truncated member')
                  path = target.joinpath(*name.parts)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with path.open('xb') as stream:
                      stream.write(data)
          if len(seen) != 76:
              raise SystemExit('Retained original build member roster differs')
          PY
