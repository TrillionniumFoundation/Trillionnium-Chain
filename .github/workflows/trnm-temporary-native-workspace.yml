name: temporary-native-workspace
on:
  push:
    branches: [fix/pon-w1-from-zero-cost-20261005]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install exact isolated compiler
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Retain source and checksum-checked dependency inputs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trnm-native-workspace"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source-sha.txt"
          git rev-parse HEAD^{tree} > "$out/source-tree.txt"
          rustc +1.95.0 -Vv > "$out/rustc.txt"
          cargo +1.95.0 vendor --locked --versioned-dirs --manifest-path trillionnium/Cargo.toml "$RUNNER_TEMP/trnm-vendor" > "$out/vendor-config.toml"
          tar -C "$RUNNER_TEMP" -czf "$out/vendor.tar.gz" trnm-vendor
          tar --exclude=.git --exclude=evidence --exclude=target -czf "$out/source.tar.gz" .
          toolchain="$(rustup run 1.95.0 rustc --print sysroot)"
          tar -C "$toolchain" -czf "$out/toolchain.tar.gz" bin lib libexec
          (cd "$out" && sha256sum ./*.tar.gz > SHA256SUMS)
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain isolated inputs, not a test-pass claim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/trnm-native-workspace/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
