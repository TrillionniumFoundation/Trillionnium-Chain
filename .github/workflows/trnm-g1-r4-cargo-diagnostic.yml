name: TRNM G1-R4 Cargo cache authority repair

on:
  push:
    branches:
      - feature/chain-g1-r4-gap-closure-20260828

permissions:
  contents: read

concurrency:
  group: trnm-g1-r4-cargo-cache-authority-repair
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"

jobs:
  verify-repair-and-reverify:
    name: Verify, repair root-owned stamp, and reverify R4A
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-g1-r4-gap-closure-20260828' &&
      github.actor == 'Tomasrgbsf' &&
      github.triggering_actor == 'Tomasrgbsf'
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 150
    steps:
      - name: Checkout exact current R4A source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-g1-r4a-finalization-intent-process-matrix-20260828
          path: trillionnium-chain
          fetch-depth: 0
          persist-credentials: false

      - name: Verify toolchain and immutable repair preconditions
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 \
            --component clippy \
            --component rustfmt
          test "$(git rev-parse HEAD)" = '3a4e2fa066de74025866da94cfe8a9efbfca03aa'
          test -z "$(git status --porcelain)"
          test "$(sha256sum trillionnium/Cargo.lock | awk '{print $1}')" = \
            'ee1e9a8382092a397f1b041107cf6b86e468d521af3aa7963e5f6e714e6c3382'
          command -v sudo >/dev/null 2>&1
          sudo -n true

      - name: Prove the complete current graph is already available offline
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          cargo fetch \
            --manifest-path trillionnium/Cargo.toml \
            --locked \
            --offline
          bash ./scripts/ci/check_finalization_intent_process_matrix_v1.sh
          test -z "$(git status --porcelain)"

      - name: Atomically advance only the reviewed Cargo.lock stamp entry
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          stamp="$HOME/.cargo/trnm-chain-offline-cache-v2.sha256"
          old='72e254afa47d8b92fe8803b35869990bcfaa7f8106d9f0d4ecb45d127fbe150b  trillionnium/Cargo.lock'
          new='ee1e9a8382092a397f1b041107cf6b86e468d521af3aa7963e5f6e714e6c3382  trillionnium/Cargo.lock'
          test -f "$stamp" && test ! -L "$stamp"
          test "$(stat -c '%u' "$stamp")" = 0
          test $((8#$(stat -c '%a' "$stamp") & 0222)) -eq 0
          test "$(grep -Fxc "$old" "$stamp")" -eq 1
          test "$(grep -Fc '  trillionnium/Cargo.lock' "$stamp")" -eq 1
          cp -- "$stamp" "$RUNNER_TEMP/stamp.before"
          awk -v old="$old" -v new="$new" '
            $0 == old { print new; changed++; next }
            { print }
            END { if (changed != 1) exit 17 }
          ' "$stamp" > "$RUNNER_TEMP/stamp.after"
          test "$(grep -Fxc "$new" "$RUNNER_TEMP/stamp.after")" -eq 1
          sudo -n install -o root -g root -m 0444 \
            "$RUNNER_TEMP/stamp.after" "$stamp.new"
          sudo -n mv -f -- "$stamp.new" "$stamp"
          sudo -n sh -c 'sync "$1"; sync "$(dirname "$1")"' sh "$stamp"
          test "$(stat -c '%u' "$stamp")" = 0
          test $((8#$(stat -c '%a' "$stamp") & 0222)) -eq 0
          cmp -s "$RUNNER_TEMP/stamp.after" "$stamp"
          sha256sum "$RUNNER_TEMP/stamp.before" "$stamp"

      - name: Re-run the official immutable offline authority gate
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$state" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock
          ./scripts/ci/check_cargo_offline_unchanged.sh --state "$state"
          bash ./scripts/ci/check_finalization_intent_process_matrix_v1.sh
          bash ./scripts/project-preflight.sh --audit

      - name: Upload authority-repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-g1-r4-cargo-authority-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stamp.before
            ${{ runner.temp }}/stamp.after
          if-no-files-found: warn
          retention-days: 30
