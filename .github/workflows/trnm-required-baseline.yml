name: trnm-required-baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"
  TRNM_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
jobs:
  repository-truth:
    name: repository-truth
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRNM_EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "$TRNM_EXPECTED_SOURCE_SHA")" = commit
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Run actual repository-truth checks
        run: bash scripts/ci/ci_job.sh repository-truth
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
  protocol-contract:
    name: protocol-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRNM_EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "$TRNM_EXPECTED_SOURCE_SHA")" = commit
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Install pinned compiler and tools in isolated hosted runner
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Install isolated conformance-only Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"unsupported runner Python {sys.version.split()[0]}; expected 3.12 for hashed wheels")
          PY
          python3 -m venv "$RUNNER_TEMP/pon-contract-env"
          "$RUNNER_TEMP/pon-contract-env/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r formal/pon-nakamoto-v1/requirements.txt
          echo "$RUNNER_TEMP/pon-contract-env/bin" >> "$GITHUB_PATH"
      - name: Run actual protocol-contract checks
        run: bash scripts/ci/ci_job.sh protocol-contract
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRNM_EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "$TRNM_EXPECTED_SOURCE_SHA")" = commit
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Install pinned compiler and tools in isolated hosted runner
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Run actual fuzz-smoke checks
        run: bash scripts/ci/ci_job.sh fuzz-smoke
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
  rust-baseline:
    name: rust-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRNM_EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "$TRNM_EXPECTED_SOURCE_SHA")" = commit
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Install pinned compiler and tools in isolated hosted runner
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Run actual rust-baseline checks
        run: bash scripts/ci/ci_job.sh rust-baseline
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRNM_EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "$TRNM_EXPECTED_SOURCE_SHA")" = commit
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Install pinned compiler and dependency audit tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 install cargo-deny --version 0.18.5 --locked
          cargo +1.95.0 install cargo-audit --version 0.22.0 --locked
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Run actual supply-chain checks
        run: bash scripts/ci/ci_job.sh supply-chain
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
  external-evidence-contract:
    name: external-evidence-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRNM_EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "$TRNM_EXPECTED_SOURCE_SHA")" = commit
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Run actual external-evidence-contract checks
        run: bash scripts/ci/ci_job.sh external-evidence-contract
      - name: Verify source remained unchanged
        run: test -z "$(git status --porcelain)"
