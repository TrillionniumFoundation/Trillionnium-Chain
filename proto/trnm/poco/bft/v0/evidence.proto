syntax = "proto3";

package trnm.poco.bft.v0;

import "trnm/poco/bft/v0/common.proto";
import "trnm/poco/bft/v0/consensus.proto";
import "trnm/poco/bft/v0/epoch.proto";

// Transport encoding only. Protobuf bytes are NOT signing or evidence-ID
// bytes. Verification reconstructs both original domain-separated signing
// digests and the normalized trnm.poco-bft.double-sign-evidence.v0 digest.
// Each evidence object contains exactly two bounded conflicting records.

// Header-only projection of the exact signed ProposalSignV0 fields. Payload is
// omitted because block_id and payload_root already bind it for equivocation
// comparison; availability/execution is verified elsewhere.
message ProposalEvidenceRecord {
  CommonConsensusContext context = 1;
  uint64 height = 2;
  BlockHeader header = 3;
  bytes block_id = 4;
  bytes justify_qc_digest = 5;
  bytes timeout_certificate_digest = 6; // Empty or exactly 32 bytes.
  bytes handoff_certificate_digest = 7; // Empty or exactly 32 bytes.
  bytes proposer_validator_id = 8;
  bytes signature = 9;

  reserved 64 to 127;
}

message DoubleProposalEvidence {
  ProposalEvidenceRecord first = 1;
  ProposalEvidenceRecord second = 2;

  reserved 64 to 127;
}

// The mandatory v0 objective evidence type. first/second are normalized by
// their reconstructed vote digest, not arrival order.
message DoubleVoteEvidence {
  Vote first = 1;
  Vote second = 2;

  reserved 64 to 127;
}

message ConflictingTimeoutVoteEvidence {
  TimeoutVote first = 1;
  TimeoutVote second = 2;

  reserved 64 to 127;
}

message ConflictingHandoffVoteEvidence {
  HandoffVote first = 1;
  HandoffVote second = 2;

  reserved 64 to 127;
}

// Only DoubleVoteEvidence has frozen mandatory economic handling in v0; the
// additional proof forms are retained as objective diagnostics until their
// slash schedules are activated by a later economic freeze.
message EquivocationEvidence {
  uint32 schema_version = 1; // Logical u16; MUST equal 0.
  bytes genesis_hash = 2;
  string chain_id = 3;
  uint32 protocol_version = 4;
  uint64 epoch = 5;
  bytes validator_set_hash = 6;
  bytes consensus_parameters_hash = 7;
  uint64 view = 8;
  bytes accused_validator_id = 9;

  oneof proof {
    DoubleVoteEvidence double_vote = 16;
    DoubleProposalEvidence double_proposal = 17;
    ConflictingTimeoutVoteEvidence conflicting_timeout_vote = 18;
    ConflictingHandoffVoteEvidence conflicting_handoff_vote = 19;
  }

  bytes evidence_id = 32; // Recomputed normalized domain-separated digest.

  reserved 64 to 127;
}
