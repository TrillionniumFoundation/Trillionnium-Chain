          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$OWNER_ROOT/observations/source-before.json" >"$OWNER_ROOT/observations/source-before.stdout.raw" 2>"$OWNER_ROOT/observations/source-before.stderr.raw"
