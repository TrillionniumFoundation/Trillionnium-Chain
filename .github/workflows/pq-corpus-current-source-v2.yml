name: PQ current declared-source correspondence v2
on:
  pull_request:
permissions:
  contents: read
jobs:
  current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Start the original job clock before checkout
        id: job_clock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, time
          started = time.monotonic_ns()
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
              "pq-corpus-current-v2-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
          if not out.is_absolute():
              raise SystemExit("original output directory must be absolute")
          out.mkdir()
          clock = {
              "schema": "trnm-pq-current-source-job-clock-v1",
              "source_head": os.environ["EXPECTED_HEAD"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "boot_id": pathlib.Path("/proc/sys/kernel/random/boot_id").read_text().strip(),
              "started_monotonic_ns": started,
              "operation_deadline_monotonic_ns": started + 540 * 10**9,
              "full_deadline_monotonic_ns": started + 600 * 10**9,
              "original_job_timeout_seconds": 600,
              "operation_budget_seconds": 540,
              "retention_reserve_seconds": 60,
              "clock_excludes_platform_setup": True,
          }
          with (out / "job-clock.json").open("x", encoding="utf-8") as stream:
              stream.write(json.dumps(clock, sort_keys=True, indent=2) + "\n")
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write("CURRENT_CORPUS_OUT=" + str(out) + "\n")
          PY
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind the complete clean candidate source before observation
        id: source_before
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_HEAD" \
            --output "$CURRENT_CORPUS_OUT/source-before.json" 2>&1 | tee "$CURRENT_CORPUS_OUT/source-before.log"
      - name: Check the original maintenance boundary
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 --version 2>&1 | tee "$CURRENT_CORPUS_OUT/python-version.log"
          bash scripts/project-preflight.sh --audit 2>&1 | tee "$CURRENT_CORPUS_OUT/preflight.log"
      - name: Observe the unchanged 131 controls in two owned serial workers
        id: controls
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/run_pq_fixture_tmpfs_v1.py \
            --output "$CURRENT_CORPUS_OUT/named-controls.json" \
            --fixture-receipt "$CURRENT_CORPUS_OUT/fixture-tmpfs.json" \
            --job-clock "$CURRENT_CORPUS_OUT/job-clock.json" 2>&1 | tee "$CURRENT_CORPUS_OUT/named-controls.log"
      - name: Inspect the separate current source correspondence
        id: correspondence
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/pq_corpus_current_v2.py --root "$GITHUB_WORKSPACE" \
            > "$CURRENT_CORPUS_OUT/current-source.json" 2> "$CURRENT_CORPUS_OUT/current-source.stderr"
          cat "$CURRENT_CORPUS_OUT/current-source.json"
      - name: Check the unchanged generated-inventory policy
        id: inventory
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refresh_distributed_source_inventory.py --check \
            2>&1 | tee "$CURRENT_CORPUS_OUT/inventory.log"
      - name: Recheck the complete clean candidate source
        id: source_after
        if: always() && steps.source_before.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_HEAD" \
            --output "$CURRENT_CORPUS_OUT/source-after.json" 2>&1 | tee "$CURRENT_CORPUS_OUT/source-after.log"
          cmp "$CURRENT_CORPUS_OUT/source-before.json" "$CURRENT_CORPUS_OUT/source-after.json"
      - name: Require every actual stage while retaining HOLD
        if: always()
        shell: bash
        env:
          CURRENT_CORPUS_STEPS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys, time
          sys.path.insert(0, 'scripts/ci')
          import pq_corpus_current_v2 as current
          steps = json.loads(os.environ['CURRENT_CORPUS_STEPS'])
          required = ('job_clock', 'source_before', 'preflight', 'controls', 'correspondence', 'inventory', 'source_after')
          if any(steps.get(name, {}).get('outcome') != 'success' for name in required):
              raise SystemExit('all source and metadata stages must actually succeed')
          out = pathlib.Path(os.environ['CURRENT_CORPUS_OUT'])
          clock = json.loads((out / "job-clock.json").read_bytes())
          checked = time.monotonic_ns()
          observation = {
              "first_step_elapsed_seconds": (checked - clock["started_monotonic_ns"]) / 10**9,
              "original_job_timeout_seconds": 600,
              "platform_setup_and_final_upload_require_original_job_readback": True,
              "within_first_step_deadline": checked <= clock["full_deadline_monotonic_ns"],
          }
          with (out / "pre-upload-clock.json").open("x", encoding="utf-8") as stream:
              stream.write(json.dumps(observation, sort_keys=True, indent=2) + "\n")
          if not observation["within_first_step_deadline"]:
              raise SystemExit("original job deadline exhausted before final artifact retention")
          result = current.verify_report(pathlib.Path.cwd(), (out / 'current-source.json').read_bytes())
          if result['status'] != 'HOLD' or result['source_revision_bound'] is not False:
              raise SystemExit('source-only result cannot acquire qualification')
          print('Current declared-source correspondence observed; original frozen V1 and native qualification remain unchanged.')
          PY
      - name: Retain complete source, named observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pq-corpus-current-v2-${{ env.EXPECTED_HEAD }}-${{ github.run_attempt }}
          path: ${{ env.CURRENT_CORPUS_OUT }}/
          if-no-files-found: error
          retention-days: 30
