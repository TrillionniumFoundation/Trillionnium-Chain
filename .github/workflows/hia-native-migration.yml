      - name: Download exact predecessor prefix-3 from this run and attempt
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: hia-prefix-3-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-prefix-original-download-3
      - name: Validate and transfer every regular byte of predecessor 3
        run: |
          set -euo pipefail
          python3 -B -m hia.tools.qualify_batch_ci unpack --repository "$GITHUB_WORKSPACE/chain" --artifact "$RUNNER_TEMP/hia-prefix-original-download-3/artifact" --destination "$RUNNER_TEMP/hia-prefix-original-prior-3" --profile prefix --part 3 2>&1 | tee "$RUNNER_TEMP/hia-prefix-original-observations/transfer-3.log"
      - name: Install the explicitly selected original Rust compiler
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
      - name: Run all 186 original Prefix histories and six retained tests
        env:
          RUSTUP_TOOLCHAIN: 1.95.0-x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.execution_batch.rust_oracle --repository "$GITHUB_WORKSPACE/chain" --profile prefix --bundle "$RUNNER_TEMP/hia-prefix-original-prior-0/native/bundle" --bundle "$RUNNER_TEMP/hia-prefix-original-prior-1/native/bundle" --bundle "$RUNNER_TEMP/hia-prefix-original-prior-2/native/bundle" --bundle "$RUNNER_TEMP/hia-prefix-original-prior-3/native/bundle" --output "$RUNNER_TEMP/hia-prefix-original-original" --target-dir "$RUNNER_TEMP/hia-prefix-original-cargo-target" 2>&1 | tee "$RUNNER_TEMP/hia-prefix-original-observations/original.log"
      - name: Reparse actual Rust streams and preserve production source and compiler artifacts
        run: |
          set -euo pipefail
          python3 -B -m hia.tools.qualify_batch_ci validate --repository "$GITHUB_WORKSPACE/chain" --kind original-prefix --original "$RUNNER_TEMP/hia-prefix-original-original" --bundle "$RUNNER_TEMP/hia-prefix-original-prior-0/native/bundle" --bundle "$RUNNER_TEMP/hia-prefix-original-prior-1/native/bundle" --bundle "$RUNNER_TEMP/hia-prefix-original-prior-2/native/bundle" --bundle "$RUNNER_TEMP/hia-prefix-original-prior-3/native/bundle" --capture --report "$RUNNER_TEMP/hia-prefix-original-observations/readback.json" 2>&1 | tee "$RUNNER_TEMP/hia-prefix-original-observations/readback.log"
      - name: Require all nine actual original evidence test groups without skips
