name: ops-main-tree-convergence-audit

on:
  push:
    branches:
      - ops/main-tree-convergence-audit-20260909

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ops-main-tree-convergence-audit-20260909
  cancel-in-progress: false

jobs:
  archive-and-lineage:
    if: github.repository == 'TrillionniumFoundation/Trillionnium-Chain'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANONICAL_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
      CANONICAL_TREE: c0791ffb57e05fde43f87bfed1a3b4656c09efc0
      EXPECTED_PARENT_SHA: 680eb90539c6d84c8b797fa9150e4724e4329a9c
      REPOSITORY: TrillionniumFoundation/Trillionnium-Chain
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact audit carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact carrier and canonical source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT_SHA" HEAD)" = ".github/workflows/ops-main-tree-convergence-audit.yml"
          git cat-file -e "$CANONICAL_SHA^{commit}"
          test "$(git rev-parse "$CANONICAL_SHA^{tree}")" = "$CANONICAL_TREE"

      - name: Fetch and freeze every live branch tip
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/main-tree-convergence-lineage"
          mkdir -p "$OUT"
          git fetch --force --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git ls-remote --heads origin | LC_ALL=C sort > "$OUT/branch-heads.txt"
          test -s "$OUT/branch-heads.txt"

          while read -r sha ref; do
            name="${ref#refs/heads/}"
            git update-ref "refs/archive/heads/$name" "$sha"
          done < "$OUT/branch-heads.txt"

          mapfile -t archive_refs < <(
            git for-each-ref --format='%(refname)' refs/archive/heads/ | LC_ALL=C sort
          )
          test "${#archive_refs[@]}" -gt 1
          git bundle create "$OUT/all-branch-history.bundle" "${archive_refs[@]}"
          git bundle verify "$OUT/all-branch-history.bundle" \
            > "$OUT/bundle-verify.txt" 2>&1
          git count-objects -vH > "$OUT/git-object-inventory.txt"
          stat -c '%s' "$OUT/all-branch-history.bundle" > "$OUT/bundle-size-bytes.txt"

      - name: Capture complete pull-request lineage and branch mapping
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/main-tree-convergence-lineage"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          canonical = os.environ["CANONICAL_SHA"]
          out = Path(os.environ["OUT"])

          def get_json(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "trnm-main-tree-convergence-audit-v1",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          pulls = []
          page = 1
          while True:
              query = urllib.parse.urlencode(
                  {"state": "all", "per_page": 100, "page": page, "sort": "created", "direction": "asc"}
              )
              batch = get_json(f"https://api.github.com/repos/{repo}/pulls?{query}")
              if not batch:
                  break
              pulls.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
              if page > 100:
                  raise SystemExit("pull request pagination exceeded 10,000 records")

          normalized = []
          by_head = defaultdict(list)
          for item in pulls:
              row = {
                  "number": item["number"],
                  "state": item["state"],
                  "draft": bool(item.get("draft")),
                  "title": item["title"],
                  "createdAt": item.get("created_at"),
                  "updatedAt": item.get("updated_at"),
                  "closedAt": item.get("closed_at"),
                  "mergedAt": item.get("merged_at"),
                  "mergeCommitSha": item.get("merge_commit_sha"),
                  "headRef": item["head"]["ref"],
                  "headSha": item["head"]["sha"],
                  "headRepo": (item["head"].get("repo") or {}).get("full_name"),
                  "baseRef": item["base"]["ref"],
                  "baseSha": item["base"]["sha"],
                  "author": item["user"]["login"],
              }
              normalized.append(row)
              by_head[row["headRef"]].append(row["number"])

          branch_heads = []
          for line in (out / "branch-heads.txt").read_text(encoding="utf-8").splitlines():
              sha, ref = line.split("\t", 1)
              name = ref.removeprefix("refs/heads/")
              branch_heads.append({
                  "branch": name,
                  "tip": sha,
                  "pullRequests": sorted(by_head.get(name, [])),
              })

          open_pulls = [row for row in normalized if row["state"] == "open"]
          payload = {
              "schema": "trnm-main-tree-pr-lineage-v1",
              "repository": repo,
              "canonicalSha": canonical,
              "carrierSha": os.environ["GITHUB_SHA"],
              "pullRequestCount": len(normalized),
              "openPullRequestCount": len(open_pulls),
              "openPullRequests": open_pulls,
              "pullRequests": normalized,
              "branches": branch_heads,
          }
          (out / "pull-request-lineage.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (out / "lineage-summary.json").write_text(
              json.dumps({
                  "schema": "trnm-main-tree-lineage-summary-v1",
                  "repository": repo,
                  "canonicalSha": canonical,
                  "carrierSha": os.environ["GITHUB_SHA"],
                  "branchCount": len(branch_heads),
                  "pullRequestCount": len(normalized),
                  "openPullRequestCount": len(open_pulls),
                  "branchesWithPullRequests": sum(bool(row["pullRequests"]) for row in branch_heads),
                  "branchesWithoutPullRequests": sum(not row["pullRequests"] for row in branch_heads),
                  "historyBundleCreated": True,
                  "historyBundleIsCodeAcceptance": False,
                  "branchDeletionAuthorized": False,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print((out / "lineage-summary.json").read_text(encoding="utf-8"))
          PY

      - name: Seal lineage and bundle digests
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/main-tree-convergence-lineage"
          (
            cd "$OUT"
            sha256sum \
              all-branch-history.bundle \
              branch-heads.txt \
              bundle-size-bytes.txt \
              bundle-verify.txt \
              git-object-inventory.txt \
              lineage-summary.json \
              pull-request-lineage.json \
              | LC_ALL=C sort > SHA256SUMS
          )
          cat "$OUT/lineage-summary.json"
          cat "$OUT/bundle-size-bytes.txt"
          cat "$OUT/SHA256SUMS"

      - name: Upload immutable all-branch lineage bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-tree-convergence-lineage-${{ github.sha }}
          path: ${{ runner.temp }}/main-tree-convergence-lineage
          if-no-files-found: error
          retention-days: 30
