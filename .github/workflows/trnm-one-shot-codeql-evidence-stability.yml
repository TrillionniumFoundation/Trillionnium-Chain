name: TRNM one-shot CodeQL log-redaction restack

on:
  push:
    branches:
      - automation/apply-codeql-evidence-stability-20260909

permissions:
  contents: write

concurrency:
  group: trnm-one-shot-codeql-log-redaction-restack-v2
  cancel-in-progress: false

jobs:
  restack-child:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CHILD_BRANCH: security/codeql-rust-log-redaction-v1-20260909
      PARENT_BRANCH: security/codeql-default-setup-v1-20260909
      EXPECTED_CHILD_SHA: 32274f6421ff41369cca13fbf35931d3684abc37
      EXPECTED_PARENT_SHA: b3a628744e23fb93ef510ab38a748a2ff7416651
      EXPECTED_MERGE_BASE: 7ab9ce97a5bbc5cb4c7edca7d9d39dc016638d3b
    steps:
      - name: Check out exact child
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/codeql-rust-log-redaction-v1-20260909
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable input tuple
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_CHILD_SHA}"
          test "$(git rev-parse origin/${CHILD_BRANCH})" = "${EXPECTED_CHILD_SHA}"
          test "$(git rev-parse origin/${PARENT_BRANCH})" = "${EXPECTED_PARENT_SHA}"
          test "$(git merge-base HEAD origin/${PARENT_BRANCH})" = "${EXPECTED_MERGE_BASE}"
          git diff --quiet
          git diff --cached --quiet

      - name: Merge stabilized parent without changing child scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit "${EXPECTED_PARENT_SHA}"
          test "$(git rev-parse HEAD^1)" = "${EXPECTED_CHILD_SHA}"
          test "$(git rev-parse HEAD^2)" = "${EXPECTED_PARENT_SHA}"
          actual="$(git diff --name-only "${EXPECTED_PARENT_SHA}"..HEAD | LC_ALL=C sort)"
          expected="$(
            printf '%s\n' \
              'trillionnium/crates/trnm-consensus-app/src/lib.rs' \
              'trillionnium/crates/trnm-node/src/live/node.rs' \
              'trillionnium/crates/trnm-poco-node/src/bin/trnm-poco-g1-process-host.rs' \
              'trillionnium/crates/trnm-rpc/src/reliability.rs' \
              'trillionnium/crates/trnm-rpc/src/reliability/recovery.rs' \
              | LC_ALL=C sort
          )"
          test "${actual}" = "${expected}"
          git diff --check "${EXPECTED_PARENT_SHA}"..HEAD

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 \
            --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0

      - name: Check formatting across workspace and excluded crates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo fmt \
            --manifest-path trillionnium/crates/trnm-consensus-app/Cargo.toml \
            --all -- --check
          cargo fmt \
            --manifest-path trillionnium/crates/trnm-node/Cargo.toml \
            --all -- --check

      - name: Test and lint active workspace redaction targets
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1800s \
            cargo test --manifest-path trillionnium/Cargo.toml \
              -p trnm-poco-node \
              -p trnm-rpc \
              --all-targets --locked --no-fail-fast
          cargo clippy --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node \
            -p trnm-rpc \
            --all-targets --locked -- -D warnings

      - name: Test and lint excluded migration and legacy targets
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1800s \
            cargo test \
              --manifest-path trillionnium/crates/trnm-consensus-app/Cargo.toml \
              --all-targets --locked --no-fail-fast
          cargo clippy \
            --manifest-path trillionnium/crates/trnm-consensus-app/Cargo.toml \
            --all-targets --locked -- -D warnings
          timeout --signal=TERM --kill-after=30s 1800s \
            cargo test \
              --manifest-path trillionnium/crates/trnm-node/Cargo.toml \
              --all-targets --locked --no-fail-fast
          cargo clippy \
            --manifest-path trillionnium/crates/trnm-node/Cargo.toml \
            --all-targets --locked -- -D warnings

      - name: Reconfirm clean five-file delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          actual="$(git diff --name-only "${EXPECTED_PARENT_SHA}"..HEAD | LC_ALL=C sort)"
          expected="$(
            printf '%s\n' \
              'trillionnium/crates/trnm-consensus-app/src/lib.rs' \
              'trillionnium/crates/trnm-node/src/live/node.rs' \
              'trillionnium/crates/trnm-poco-node/src/bin/trnm-poco-g1-process-host.rs' \
              'trillionnium/crates/trnm-rpc/src/reliability.rs' \
              'trillionnium/crates/trnm-rpc/src/reliability/recovery.rs' \
              | LC_ALL=C sort
          )"
          test "${actual}" = "${expected}"
          git diff --check "${EXPECTED_PARENT_SHA}"..HEAD

      - name: Publish exact restacked child
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/${CHILD_BRANCH})" = "${EXPECTED_CHILD_SHA}"
          git push origin "HEAD:${CHILD_BRANCH}"
