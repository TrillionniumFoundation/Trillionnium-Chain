name: PoN recent batch candidate
on:
  push:
    branches: [repair/pon-history-cost-20261009]
    paths:
      - scripts/ci/recent-batch-candidate.patch
      - .github/workflows/pon-recent-batch-candidate.yml
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare fixed original source and apply only the staged patch
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/recent-batch"
          native="$RUNNER_TEMP/native-recent"
          mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "NATIVE=$native" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target-recent" >> "$GITHUB_ENV"
          git worktree add --detach "$native" d4fe8d6f5fab99c05550570fa01ac21db73a4c7e
          git -C "$native" rev-parse HEAD HEAD^{tree} > "$out/base.txt"
          test "$(git -C "$native" rev-parse HEAD^{tree})" = baa6a72a0d21b19d7112e54cf64d622995d6cb6e
          cp scripts/ci/recent-batch-candidate.patch "$out/input.patch"
          git -C "$native" apply --recount "$out/input.patch"
          test "$(git -C "$native" diff --name-only)" = trillionnium/crates/trnm-pon-node/src/store.rs
      - name: Install source compiler, formatter and Clippy
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Format candidate and retain the exact emitted Rust file
        shell: bash
        run: |
          set -euo pipefail
          cd "$NATIVE"
          cargo +1.95.0 fmt --manifest-path trillionnium/Cargo.toml --all
          test "$(git diff --name-only)" = trillionnium/crates/trnm-pon-node/src/store.rs
          cargo +1.95.0 fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          git diff --check
          cp trillionnium/crates/trnm-pon-node/src/store.rs "$OUT/store.candidate.rs"
          git hash-object trillionnium/crates/trnm-pon-node/src/store.rs > "$OUT/candidate.blob"
          sha256sum trillionnium/crates/trnm-pon-node/src/store.rs > "$OUT/candidate.sha256"
          git diff -- trillionnium/crates/trnm-pon-node/src/store.rs > "$OUT/formatted.patch"
      - name: Execute complete original error-boundary suite plus differential recent controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$NATIVE"
          cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib store::error_boundary_tests:: -- --show-output --test-threads=1 2>&1 | tee "$OUT/native.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['OUT'], 'native.log').read_text()
          for name in ('recent_batch_exact_window_and_complete_call_observation', 'recent_batch_retained_corruption_and_read_boundary_match_original', 'recent_batch_branch_reopen_and_callback_errors_preserve_context'):
              assert 'test store::error_boundary_tests::' + name + ' ... ok' in text, name
          assert 'test result: ok.' in text and '0 failed;' in text
          assert 'native-recent-batch-complete-call-v1' in text
          PY
      - name: Execute original native all-target strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd "$NATIVE"
          cargo +1.95.0 clippy --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --all-targets --all-features -- -D warnings 2>&1 | tee "$OUT/clippy.log"
          cmp trillionnium/crates/trnm-pon-node/src/store.rs "$OUT/store.candidate.rs"
          test "$(git diff --name-only)" = trillionnium/crates/trnm-pon-node/src/store.rs
          printf 'staged-native-and-clippy-passed\n' > "$OUT/outcome.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recent-batch-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/recent-batch
          if-no-files-found: error
          retention-days: 30
  retain-blob:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: recent-batch-*-${{ github.run_id }}
          path: candidates
      - name: Retain matching source blob without executing artifacts or moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          roots = sorted(Path('candidates').glob('recent-batch-*'))
          assert len(roots) == 2
          values = []
          for root in roots:
              assert root.joinpath('base.txt').read_text().splitlines() == ['d4fe8d6f5fab99c05550570fa01ac21db73a4c7e', 'baa6a72a0d21b19d7112e54cf64d622995d6cb6e']
              assert root.joinpath('outcome.txt').read_text() == 'staged-native-and-clippy-passed\n'
              path = root / 'store.candidate.rs'
              assert path.is_file() and not path.is_symlink() and 0 < path.stat().st_size < 1024 * 1024
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert digest == root.joinpath('candidate.sha256').read_text().split()[0]
              assert blob == root.joinpath('candidate.blob').read_text().strip()
              values.append(raw)
          assert values[0] == values[1], 'architecture-dependent candidate source'
          request = urllib.request.Request('https://api.github.com/repos/TrillionniumFoundation/Trillionnium-Chain/git/blobs', data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(values[0]).decode()}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == blob
          record = {'blob': blob, 'sha256': digest, 'bytes': len(values[0]), 'base': 'd4fe8d6f5fab99c05550570fa01ac21db73a4c7e', 'source_scope': 'staged-candidate-only', 'branch_changed': False, 'acceptance_granted': False}
          Path('blob.json').write_text(json.dumps(record, sort_keys=True, indent=2) + '\n')
          print(json.dumps(record, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recent-batch-blob-${{ github.run_id }}
          path: blob.json
          if-no-files-found: error
          retention-days: 30
