name: trnm-a18-preflight-mixed-policy

on:
  push:
    branches:
      - feature/chain-a18-repository-truth-ci-hardening-v1-20260830
    paths:
      - .github/workflows/trnm-a18-preflight-mixed-policy.yml

permissions:
  contents: write

concurrency:
  group: trnm-a18-preflight-mixed-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-preflight-policy:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-a18-repository-truth-ci-hardening-v1-20260830' &&
      github.actor == 'Tomasrgbsf'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-a18-repository-truth-ci-hardening-v1-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Split hosted and privileged Cargo policy contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("PROJECT_BOUNDARY.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["canonical_dir"] = "trillionnium-chain"
          data["development"] = True
          data["remote"] = {
              "policy": "required",
              "canonical_slug": "TrillionniumFoundation/Trillionnium-Chain",
              "upstream_required": True,
          }
          data["branch"] = {
              "protected": ["main"],
              "development_regex": "^(feature|fix|chore|docs|test)/chain-[a-z0-9][a-z0-9._-]*$",
          }
          data["deny_changed_paths_regex"] = (
              "^trillionnium/crates/(trnm-first-contact|trnm-game-server|"
              "trnm-campaign-core|trnm-rts-|trnm-online-|trnm-economy-)"
          )
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          finalization = Path("scripts/ci/check_finalization_intent_process_matrix_v1.sh")
          text = finalization.read_text(encoding="utf-8")
          old = "bash scripts/ci/check_mixed_trust_cargo_policy_v1.sh"
          new = "bash scripts/check_cargo_offline_policy.sh --worktree"
          if text.count(old) != 1:
              raise SystemExit("unexpected finalization mixed-policy call count")
          finalization.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git mv scripts/check_cargo_offline_policy.sh scripts/check_privileged_cargo_offline_policy.sh
          cat > scripts/check_cargo_offline_policy.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          source_mode=${1:---worktree}
          case "$source_mode" in
            --worktree|--staged|--head) ;;
            *)
              echo "unsupported mixed-trust Cargo policy source: $source_mode" >&2
              exit 2
              ;;
          esac

          root=$(git rev-parse --show-toplevel)
          root=$(cd "$root" && pwd -P)
          baseline=.github/workflows/trnm-required-baseline.yml
          privileged=scripts/check_privileged_cargo_offline_policy.sh
          test -f "$root/$privileged" || {
            echo "mixed-trust Cargo policy: privileged policy is missing" >&2
            exit 2
          }

          # First validate the complete source in its original representation.
          # This proves that the hosted required baseline and every privileged
          # workflow remain present in their distinct trust classes.
          bash "$root/scripts/check_ci_runner_policy.sh" "$source_mode"

          tmp=$(mktemp -d)
          restore_worktree() {
            if [[ -f "$tmp/trnm-required-baseline.yml" ]]; then
              mv "$tmp/trnm-required-baseline.yml" "$root/$baseline"
            fi
            rm -rf -- "$tmp"
          }
          trap restore_worktree EXIT HUP INT TERM

          case "$source_mode" in
            --worktree)
              test -f "$root/$baseline" || {
                echo "mixed-trust Cargo policy: required hosted baseline is missing" >&2
                exit 2
              }
              mv "$root/$baseline" "$tmp/trnm-required-baseline.yml"
              bash "$root/$privileged" --worktree
              mv "$tmp/trnm-required-baseline.yml" "$root/$baseline"
              ;;
            --staged)
              snapshot="$tmp/snapshot"
              mkdir -p "$snapshot"
              git -C "$root" checkout-index --all --prefix="$snapshot/"
              rm -f "$snapshot/$baseline"
              git -C "$snapshot" init -q
              git -C "$snapshot" add -A
              env \
                GIT_AUTHOR_NAME=trnm-policy-snapshot \
                GIT_AUTHOR_EMAIL=policy-snapshot@example.invalid \
                GIT_COMMITTER_NAME=trnm-policy-snapshot \
                GIT_COMMITTER_EMAIL=policy-snapshot@example.invalid \
                git -C "$snapshot" commit -qm staged-policy-snapshot
              bash "$snapshot/$privileged" --head
              ;;
            --head)
              snapshot="$tmp/snapshot"
              mkdir -p "$snapshot"
              git -C "$root" archive --format=tar HEAD | tar -xf - -C "$snapshot"
              rm -f "$snapshot/$baseline"
              git -C "$snapshot" init -q
              git -C "$snapshot" add -A
              env \
                GIT_AUTHOR_NAME=trnm-policy-snapshot \
                GIT_AUTHOR_EMAIL=policy-snapshot@example.invalid \
                GIT_COMMITTER_NAME=trnm-policy-snapshot \
                GIT_COMMITTER_EMAIL=policy-snapshot@example.invalid \
                git -C "$snapshot" commit -qm head-policy-snapshot
              bash "$snapshot/$privileged" --head
              ;;
          esac

          trap - EXIT HUP INT TERM
          restore_worktree
          printf 'mixed_trust_cargo_policy=passed hosted_required_jobs=5 privileged_offline_jobs=20 source=%s\n' "${source_mode#--}"
          EOF
          chmod +x scripts/check_cargo_offline_policy.sh
          git rm scripts/ci/check_mixed_trust_cargo_policy_v1.sh
          git rm .github/workflows/trnm-a18-preflight-mixed-policy.yml
          git diff --check
      - name: Commit source-only policy migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_BOUNDARY.json \
            scripts/check_cargo_offline_policy.sh \
            scripts/check_privileged_cargo_offline_policy.sh \
            scripts/ci/check_finalization_intent_process_matrix_v1.sh
          git diff --cached --check
          git commit -m "fix(repo): make project preflight mixed-trust aware"
          git push origin "HEAD:${GITHUB_REF_NAME}"
