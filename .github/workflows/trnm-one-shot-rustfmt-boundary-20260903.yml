name: trnm-one-shot-rustfmt-boundary-20260903

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/trnm-one-shot-rustfmt-boundary-20260903.yml

permissions:
  contents: write

concurrency:
  group: trnm-one-shot-rustfmt-boundary-20260903
  cancel-in-progress: false

jobs:
  format-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact triggering source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install pinned formatter
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Format only the reviewed node boundary
        shell: bash
        run: rustfmt +1.95.0 --edition 2021 trillionnium/crates/trnm-node-boundary-v0/src/lib.rs

      - name: Reject an unexpected formatter footprint
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "${changed}" = "trillionnium/crates/trnm-node-boundary-v0/src/lib.rs"

      - name: Publish the exact format repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trillionnium/crates/trnm-node-boundary-v0/src/lib.rs
          git rm .github/workflows/trnm-one-shot-rustfmt-boundary-20260903.yml
          git commit -m "style(node): apply pinned rustfmt to boundary"
          git push origin "HEAD:${GITHUB_REF_NAME}"
