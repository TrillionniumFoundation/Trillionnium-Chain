name: TRNM G2C profile registry and challenge v1 gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/trnm-g2c-profile-registry-v1.yml"
      - "docs/development/packages/TRNM_G2C_VERIFY_CHALLENGE_IMPLEMENTATION_V2.md"
      - "scripts/ci/check_deterministic_reexecution_model_v1.sh"
      - "scripts/ci/check_g2c_profile_registry_v1.sh"
      - "tools/deterministic-reexecution/**"
      - "trillionnium/crates/trnm-poco-verify-challenge-v1/**"
      - "trillionnium/Cargo.toml"
      - "trillionnium/Cargo.lock"

permissions:
  contents: read

concurrency:
  group: trnm-g2c-profile-registry-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: UTF-8
  PYTHONUTF8: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
  TRNM_CARGO_OFFLINE_POLICY: required

jobs:
  g2c-contract:
    name: Closed profile resolution, evidence ordering and challenge lifecycle
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      ((github.actor == 'ProfAlexQI' && github.triggering_actor == 'ProfAlexQI') ||
       (github.actor == 'Tomasrgbsf' && github.triggering_actor == 'Tomasrgbsf') ||
       (github.actor == 'github-actions[bot]' &&
        github.triggering_actor == 'github-actions[bot]' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.author_association == 'MEMBER')) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trillionnium-chain
          persist-credentials: false
          fetch-depth: 0

      - name: Verify runner-provisioned Rust toolchain
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 \
            --component clippy \
            --component rustfmt

      - name: Verify Cargo offline cache readiness
        id: cargo_offline_ready
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock

      - name: Verify G2C candidate
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_g2c_profile_registry_v1.sh

      - name: Verify canonical development plan
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_canonical_development_plan.sh

      - name: Verify native PoCO pre-cutover truth
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover

      - name: Verify project boundary
        working-directory: trillionnium-chain
        run: bash ./scripts/project-preflight.sh --audit

      - name: Verify Cargo offline inputs remained unchanged
        if: always() && steps.cargo_offline_ready.outcome == 'success'
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"
