name: TRNM Canonical Input Fuzz Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/trnm-canonical-input-fuzz-smoke.yml"
      - "rust-toolchain.toml"
      - "scripts/ci/check_canonical_fuzz_smoke.sh"
      - "scripts/ci/install_cargo_fuzz.sh"
      - "scripts/ci/check_preprovisioned_rust_toolchain.sh"
      - "scripts/ci/check_cargo_offline_ready.sh"
      - "scripts/ci/check_cargo_offline_unchanged.sh"
      - "trillionnium/Cargo.lock"
      - "trillionnium/Cargo.toml"
      - "trillionnium/crates/trnm-finality-types/**"
      - "trillionnium/crates/trnm-consensus-types/**"
      - "trillionnium/crates/trnm-protocol/**"
      - "trillionnium/fuzz/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/trnm-canonical-input-fuzz-smoke.yml"
      - "rust-toolchain.toml"
      - "scripts/ci/check_canonical_fuzz_smoke.sh"
      - "scripts/ci/install_cargo_fuzz.sh"
      - "scripts/ci/check_preprovisioned_rust_toolchain.sh"
      - "scripts/ci/check_cargo_offline_ready.sh"
      - "scripts/ci/check_cargo_offline_unchanged.sh"
      - "trillionnium/Cargo.lock"
      - "trillionnium/Cargo.toml"
      - "trillionnium/crates/trnm-finality-types/**"
      - "trillionnium/crates/trnm-consensus-types/**"
      - "trillionnium/crates/trnm-protocol/**"
      - "trillionnium/fuzz/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-smoke:
    name: Bounded public-input fuzz smoke (not a campaign)
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' ||
        ((github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf') &&
         github.triggering_actor == github.actor &&
         (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 45
    env:
      TRNM_CARGO_OFFLINE_POLICY: "cargo-fuzz"
      CARGO_NET_OFFLINE: "true"
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify runner-provisioned Rust toolchain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain nightly-2026-07-27

      - name: Verify Cargo offline cache readiness
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain nightly-2026-07-27 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/fuzz/Cargo.toml:trillionnium/fuzz/Cargo.lock

      - name: Verify runner-provisioned cargo-fuzz
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_cargo_fuzz.sh

      - name: Run bounded three-target smoke
        env:
          TRNM_FUZZ_SMOKE_SECONDS: "15"
        run: ./scripts/ci/check_canonical_fuzz_smoke.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-canonical-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: trillionnium/fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify Cargo offline inputs remained unchanged
        if: always()
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"
