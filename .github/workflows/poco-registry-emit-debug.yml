name: poco-registry-emit-debug

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emit-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/poco-only-purge-20260909
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate registry and remove temporary workflow
        run: |
          set -euo pipefail
          python3 scripts/ci/check_poco_bft_v0_registry.py --emit > docs/protocol/poco-bft-v0/schema/decoder-error-registry-v0.json
          python3 scripts/ci/check_poco_bft_v0_registry.py
          rm .github/workflows/poco-registry-emit-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/protocol/poco-bft-v0/schema/decoder-error-registry-v0.json .github/workflows/poco-registry-emit-debug.yml
          git diff --cached --check
          git commit -m "chore(poco): regenerate canonical decoder registry"
          git push origin HEAD:chore/poco-only-purge-20260909
