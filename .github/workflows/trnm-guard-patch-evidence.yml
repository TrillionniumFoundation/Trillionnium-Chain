name: TRNM maintainer guard patch evidence

on:
  push:
    branches:
      - integration/native-poco-a04-a19-a23-qualified-v1-20260901
    paths:
      - .github/workflows/trnm-guard-patch-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf') &&
      github.triggering_actor == github.actor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Build counted maintainer-guard patch set
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('.github/workflows/trnm-cometbft-spike.yml'),
              Path('.github/workflows/trnm-poco-bft-v0.yml'),
              Path('.github/workflows/trnm-merge-gates.yml'),
              Path('.github/workflows/trnm-gate-quick-check.yml'),
          ]
          pattern = re.compile(
              r"github\.actor == 'ProfAlexQI' &&\n"
              r"(?P<indent>\s*)github\.triggering_actor == 'ProfAlexQI' &&"
          )
          replacement = (
              "(github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf') &&\n"
              r"\g<indent>github.triggering_actor == github.actor &&"
          )
          total = 0
          for path in paths:
              before = path.read_text(encoding='utf-8')
              after, count = pattern.subn(replacement, before)
              if count < 1:
                  raise SystemExit(f'no trusted-actor guard found in {path}')
              if "github.triggering_actor == 'ProfAlexQI'" in after:
                  raise SystemExit(f'stale triggering-actor guard remains in {path}')
              path.write_text(after, encoding='utf-8')
              total += count
              print(f'{path}: replacements={count}')
          if total != 11:
              raise SystemExit(f'unexpected total replacement count: {total}')
          PY
          git diff --check -- \
            .github/workflows/trnm-cometbft-spike.yml \
            .github/workflows/trnm-poco-bft-v0.yml \
            .github/workflows/trnm-merge-gates.yml \
            .github/workflows/trnm-gate-quick-check.yml
      - name: Commit exact verified guard patch set
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/workflows/trnm-cometbft-spike.yml \
            .github/workflows/trnm-poco-bft-v0.yml \
            .github/workflows/trnm-merge-gates.yml \
            .github/workflows/trnm-gate-quick-check.yml
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git commit -m "ci(trust): admit both exact repository maintainers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
