name: TRNM external evidence require-all false-pass repair ded43a v1

on:
  push:
    branches:
      - automation/external-evidence-require-all-fix-ded43a-v1-20260909

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trnm-external-evidence-require-all-fix-ded43a-v1
  cancel-in-progress: false

jobs:
  repair:
    name: Add, test and publish strict require-all guard
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.actor == github.triggering_actor &&
      (github.actor == 'ProfHepta' || github.actor == 'Tomasrgbsf' || github.actor == 'Franksudoman' || github.actor == 'ProfAlexQI')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SUBJECT_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
      SUBJECT_TREE: c0791ffb57e05fde43f87bfed1a3b4656c09efc0
      OUTPUT_BRANCH: security/external-evidence-require-all-fail-closed-v2-20260909
    steps:
      - name: Check out exact immutable subject without persisted credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and reproduce predecessor false-pass
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${SUBJECT_TREE}"
          git diff --quiet
          git diff --cached --quiet
          set +e
          python3 scripts/ci/check_external_evidence_v1.py --require-all \
            > "${RUNNER_TEMP}/predecessor.stdout" \
            2> "${RUNNER_TEMP}/predecessor.stderr"
          predecessor_rc=$?
          set -e
          test "${predecessor_rc}" = 0
          python3 - <<'PY'
          import json
          import pathlib

          text = pathlib.Path("${RUNNER_TEMP}/predecessor.stdout").read_text(encoding="utf-8", errors="replace")
          decoder = json.JSONDecoder()
          objects = []
          for index, char in enumerate(text):
              if char != "{":
                  continue
              try:
                  value, end = decoder.raw_decode(text[index:])
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict):
                  objects.append((end, value))
          if not objects:
              raise SystemExit("predecessor emitted no JSON object")
          value = max(objects, key=lambda item: item[0])[1]
          serialized = json.dumps(value, sort_keys=True).lower()
          if "open" not in serialized and "blocked" not in serialized:
              raise SystemExit("predecessor fixture no longer demonstrates an open blocker")
          PY

      - name: Add strict reusable output guard and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/ci/external_evidence_require_all_guard_v2.py <<'PY'
          """Fail-closed process-output guard for external evidence --require-all.

          The legacy checker remains the semantic/authentication implementation.  This
          guard only prevents a zero process status from being interpreted as full
          acceptance when its own machine-readable report still contains open external
          blocker IDs or does not positively enumerate every accepted external blocker.
          """

          from __future__ import annotations

          import contextlib
          import io
          import json
          import pathlib
          import sys
          from collections.abc import Callable, Iterable, Mapping, Sequence
          from typing import Any


          class RequireAllGuardError(RuntimeError):
              """Raised when full external acceptance is not positively proven."""


          def _json_objects(text: str) -> list[dict[str, Any]]:
              decoder = json.JSONDecoder()
              objects: list[tuple[int, dict[str, Any]]] = []
              for index, char in enumerate(text):
                  if char != "{":
                      continue
                  try:
                      value, end = decoder.raw_decode(text[index:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(value, dict):
                      objects.append((end, value))
              objects.sort(key=lambda item: item[0], reverse=True)
              return [value for _, value in objects]


          def _expected_ids(config_path: pathlib.Path) -> set[str]:
              raw = json.loads(config_path.read_text(encoding="utf-8"))
              blockers = raw.get("external_blockers")
              if not isinstance(blockers, list) or not blockers:
                  raise RequireAllGuardError("machine blocker register has no external blockers")
              result: set[str] = set()
              for item in blockers:
                  if not isinstance(item, Mapping) or not isinstance(item.get("id"), str):
                      raise RequireAllGuardError("malformed external blocker entry")
                  identifier = item["id"]
                  if not identifier.startswith("EXT-"):
                      raise RequireAllGuardError(f"unexpected external blocker id: {identifier}")
                  if identifier in result:
                      raise RequireAllGuardError(f"duplicate external blocker id: {identifier}")
                  result.add(identifier)
              return result


          def _ids_in(value: Any, expected: set[str]) -> set[str]:
              found: set[str] = set()
              if isinstance(value, str):
                  if value in expected:
                      found.add(value)
              elif isinstance(value, Mapping):
                  for key, child in value.items():
                      if isinstance(key, str) and key in expected:
                          found.add(key)
                      found.update(_ids_in(child, expected))
              elif isinstance(value, Sequence) and not isinstance(value, (str, bytes, bytearray)):
                  for child in value:
                      found.update(_ids_in(child, expected))
              return found


          def _is_positive_acceptance(value: Any) -> bool:
              if value is True:
                  return True
              if value in (False, None, ""):
                  return False
              if isinstance(value, str):
                  return value.strip().lower() in {
                      "accepted",
                      "complete",
                      "closed",
                      "pass",
                      "passed",
                      "success",
                      "satisfied",
                      "verified",
                  }
              if isinstance(value, Mapping):
                  for key in ("accepted", "complete", "closed", "verified"):
                      if key in value:
                          return _is_positive_acceptance(value[key])
                  for key in ("status", "result", "conclusion"):
                      if key in value:
                          return _is_positive_acceptance(value[key])
                  # A non-empty authenticated evidence object may be the accepted value,
                  # but only if it contains an immutable digest/signature marker.
                  markers = {
                      "digest",
                      "sha256",
                      "signature",
                      "producer_signature",
                      "reviewer_signature",
                      "artifact_digest",
                  }
                  return bool(set(value).intersection(markers))
              return False


          def _accepted_ids(document: Mapping[str, Any], expected: set[str]) -> set[str]:
              accepted: set[str] = set()

              def visit(value: Any, path: tuple[str, ...]) -> None:
                  if isinstance(value, Mapping):
                      for key, child in value.items():
                          key_text = str(key)
                          lowered = key_text.lower()
                          next_path = (*path, lowered)
                          under_acceptance = any(
                              token in component
                              for component in next_path
                              for token in ("accept", "verified", "satisfied", "closed")
                          )
                          if key_text in expected and under_acceptance and _is_positive_acceptance(child):
                              accepted.add(key_text)
                          if under_acceptance and isinstance(child, Mapping):
                              identifier = child.get("id")
                              if isinstance(identifier, str) and identifier in expected and _is_positive_acceptance(child):
                                  accepted.add(identifier)
                          visit(child, next_path)
                  elif isinstance(value, Sequence) and not isinstance(value, (str, bytes, bytearray)):
                      for child in value:
                          if isinstance(child, str) and child in expected and any(
                              token in component
                              for component in path
                              for token in ("accept", "verified", "satisfied", "closed")
                          ):
                              accepted.add(child)
                          elif isinstance(child, Mapping):
                              identifier = child.get("id")
                              if (
                                  isinstance(identifier, str)
                                  and identifier in expected
                                  and any(
                                      token in component
                                      for component in path
                                      for token in ("accept", "verified", "satisfied", "closed")
                                  )
                                  and _is_positive_acceptance(child)
                              ):
                                  accepted.add(identifier)
                          visit(child, path)

              visit(document, ())
              return accepted


          def _open_ids(document: Mapping[str, Any], expected: set[str]) -> set[str]:
              opened: set[str] = set()

              def visit(value: Any, path: tuple[str, ...]) -> None:
                  if isinstance(value, Mapping):
                      for key, child in value.items():
                          lowered = str(key).lower()
                          next_path = (*path, lowered)
                          under_open = any(
                              token in component
                              for component in next_path
                              for token in ("open", "block", "missing", "pending", "reject", "unaccepted")
                          )
                          if under_open:
                              opened.update(_ids_in(child, expected))
                              if isinstance(key, str) and key in expected and not _is_positive_acceptance(child):
                                  opened.add(key)
                          visit(child, next_path)
                  elif isinstance(value, Sequence) and not isinstance(value, (str, bytes, bytearray)):
                      if any(
                          token in component
                          for component in path
                          for token in ("open", "block", "missing", "pending", "reject", "unaccepted")
                      ):
                          opened.update(_ids_in(value, expected))
                      for child in value:
                          visit(child, path)

              visit(document, ())
              return opened


          def enforce_require_all_report(text: str, config_path: pathlib.Path) -> None:
              expected = _expected_ids(config_path)
              documents = _json_objects(text)
              if not documents:
                  raise RequireAllGuardError("checker emitted no machine-readable JSON report")

              candidates: list[tuple[int, dict[str, Any], set[str], set[str]]] = []
              for document in documents:
                  present = _ids_in(document, expected)
                  accepted = _accepted_ids(document, expected)
                  opened = _open_ids(document, expected)
                  candidates.append((len(present), document, accepted, opened))
              _, _, accepted, opened = max(candidates, key=lambda item: item[0])

              missing = expected - accepted
              contradictory = accepted.intersection(opened)
              if opened or missing or contradictory:
                  details = {
                      "expected": sorted(expected),
                      "accepted": sorted(accepted),
                      "open": sorted(opened),
                      "missing": sorted(missing),
                      "contradictory": sorted(contradictory),
                  }
                  raise RequireAllGuardError(
                      "external evidence is not fully accepted: "
                      + json.dumps(details, sort_keys=True, separators=(",", ":"))
                  )


          def run_guarded_main(
              main_callable: Callable[[], int | None],
              argv: Iterable[str],
              *,
              config_path: pathlib.Path,
          ) -> int:
              arguments = tuple(argv)
              if "--require-all" not in arguments:
                  result = main_callable()
                  return 0 if result is None else int(result)

              captured = io.StringIO()
              try:
                  with contextlib.redirect_stdout(captured):
                      result = main_callable()
                  code = 0 if result is None else int(result)
              except SystemExit as error:
                  code = 0 if error.code is None else int(error.code)

              text = captured.getvalue()
              sys.stdout.write(text)
              if code != 0:
                  return code
              try:
                  enforce_require_all_report(text, config_path)
              except RequireAllGuardError as error:
                  print(f"require-all fail-closed: {error}", file=sys.stderr)
                  return 2
              return 0
          PY

          cat > scripts/ci/test_external_evidence_require_all_guard_v2.py <<'PY'
          from __future__ import annotations

          import importlib.util
          import io
          import json
          import pathlib
          import tempfile
          import unittest
          from contextlib import redirect_stdout

          HERE = pathlib.Path(__file__).resolve().parent
          SPEC = importlib.util.spec_from_file_location(
              "guard", HERE / "external_evidence_require_all_guard_v2.py"
          )
          assert SPEC and SPEC.loader
          guard = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(guard)

          IDS = [
              "EXT-REVIEW-001",
              "EXT-G1-CAMPAIGN-001",
              "EXT-ANCHOR-HSM-001",
              "EXT-POWERLOSS-001",
              "EXT-AUDIT-001",
              "EXT-SOAK-ACTIVATION-001",
          ]


          class RequireAllGuardTests(unittest.TestCase):
              def setUp(self) -> None:
                  self.temp = tempfile.TemporaryDirectory()
                  self.addCleanup(self.temp.cleanup)
                  self.config = pathlib.Path(self.temp.name) / "blockers.json"
                  self.config.write_text(
                      json.dumps({"external_blockers": [{"id": item} for item in IDS]}),
                      encoding="utf-8",
                  )

              def report(self, accepted=None, opened=None) -> str:
                  return json.dumps(
                      {
                          "accepted": accepted if accepted is not None else {},
                          "open_blockers": opened if opened is not None else [],
                      }
                  )

              def test_accepts_only_complete_positive_set(self) -> None:
                  guard.enforce_require_all_report(
                      self.report({item: {"status": "accepted"} for item in IDS}, []),
                      self.config,
                  )

              def test_rejects_empty_acceptance_even_when_process_succeeds(self) -> None:
                  with self.assertRaises(guard.RequireAllGuardError):
                      guard.enforce_require_all_report(self.report({}, IDS), self.config)

              def test_rejects_missing_one(self) -> None:
                  with self.assertRaises(guard.RequireAllGuardError):
                      guard.enforce_require_all_report(
                          self.report({item: True for item in IDS[:-1]}, []), self.config
                      )

              def test_rejects_accepted_and_open_contradiction(self) -> None:
                  with self.assertRaises(guard.RequireAllGuardError):
                      guard.enforce_require_all_report(
                          self.report({item: True for item in IDS}, [IDS[0]]), self.config
                      )

              def test_rejects_false_values_under_accepted(self) -> None:
                  with self.assertRaises(guard.RequireAllGuardError):
                      guard.enforce_require_all_report(
                          self.report({item: False for item in IDS}, []), self.config
                      )

              def test_rejects_malformed_or_non_json_output(self) -> None:
                  with self.assertRaises(guard.RequireAllGuardError):
                      guard.enforce_require_all_report("not-json", self.config)

              def test_non_require_all_mode_preserves_main_result(self) -> None:
                  self.assertEqual(
                      guard.run_guarded_main(lambda: 7, [], config_path=self.config), 7
                  )

              def test_require_all_converts_false_pass_to_two(self) -> None:
                  def false_pass() -> int:
                      print(self.report({}, IDS))
                      return 0

                  with redirect_stdout(io.StringIO()):
                      self.assertEqual(
                          guard.run_guarded_main(
                              false_pass, ["--require-all"], config_path=self.config
                          ),
                          2,
                      )

              def test_require_all_keeps_semantic_failure(self) -> None:
                  def semantic_failure() -> int:
                      print(self.report({}, IDS))
                      return 9

                  with redirect_stdout(io.StringIO()):
                      self.assertEqual(
                          guard.run_guarded_main(
                              semantic_failure, ["--require-all"], config_path=self.config
                          ),
                          9,
                      )


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Replace only the checker process entry point
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import pathlib

          path = pathlib.Path("scripts/ci/check_external_evidence_v1.py")
          source = path.read_text(encoding="utf-8")
          module = ast.parse(source)
          candidates = []
          for node in module.body:
              if not isinstance(node, ast.If):
                  continue
              test = node.test
              if (
                  isinstance(test, ast.Compare)
                  and isinstance(test.left, ast.Name)
                  and test.left.id == "__name__"
                  and any(isinstance(comp, ast.Constant) and comp.value == "__main__" for comp in test.comparators)
              ):
                  candidates.append(node)
          if len(candidates) != 1:
              raise SystemExit(f"expected one __main__ block, found {len(candidates)}")
          node = candidates[0]
          lines = source.splitlines(keepends=True)
          start = node.lineno - 1
          end = node.end_lineno
          if any(line.strip() for line in lines[end:]):
              raise SystemExit("refuse to replace non-terminal __main__ block")
          replacement = '''if __name__ == "__main__":\n    import pathlib as _pathlib\n    import sys as _sys\n\n    from external_evidence_require_all_guard_v2 import run_guarded_main as _run_guarded_main\n\n    raise SystemExit(\n        _run_guarded_main(\n            main,\n            _sys.argv[1:],\n            config_path=(\n                _pathlib.Path(__file__).resolve().parents[2]\n                / "config"\n                / "blocker-execution-v1.json"\n            ),\n        )\n    )\n'''
          path.write_text("".join(lines[:start]) + replacement, encoding="utf-8")
          PY
          git diff --check

      - name: Run existing and new external-evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_external_evidence_require_all_guard_v2.py
          mapfile -t tests < <(find scripts/ci -maxdepth 1 -type f -name 'test_external_evidence*.py' -print | sort)
          test "${#tests[@]}" -ge 2
          for test_file in "${tests[@]}"; do
            python3 "${test_file}"
          done
          python3 -m compileall -q scripts/ci

      - name: Prove current open external set is now nonzero and normal mode is unchanged
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/ci/check_external_evidence_v1.py --require-all \
            > "${RUNNER_TEMP}/repaired-require-all.stdout" \
            2> "${RUNNER_TEMP}/repaired-require-all.stderr"
          repaired_rc=$?
          set -e
          test "${repaired_rc}" = 2
          grep -Fq 'require-all fail-closed:' "${RUNNER_TEMP}/repaired-require-all.stderr"
          python3 scripts/ci/check_external_evidence_v1.py \
            > "${RUNNER_TEMP}/normal-mode.stdout" \
            2> "${RUNNER_TEMP}/normal-mode.stderr"

      - name: Run repository gates affected by the checker
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check_blocker_execution_v1.py
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_documentation_contracts_v1.py
          python3 scripts/ci/generate_release_status_v1.py --check-deterministic
          git diff --check

      - name: Publish only tested product files to a separate draft branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            scripts/ci/check_external_evidence_v1.py
            scripts/ci/external_evidence_require_all_guard_v2.py
            scripts/ci/test_external_evidence_require_all_guard_v2.py
          )
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" = 3
          test "${changed[*]}" = "${allowed[*]}"
          git config user.name "trnm-evidence-bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -- "${allowed[@]}"
          git commit -m "fix(m17): fail closed when external require-all remains open" \
            -m "Retain the existing external evidence semantic checker, but prevent a zero process status from becoming full acceptance unless every machine-registered EXT blocker is positively enumerated as accepted and none remains open. Adds adversarial false-pass mutants and keeps normal inspection mode unchanged."
          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse 'HEAD^{tree}')"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          encoded="$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['OUTPUT_BRANCH'], safe=''))
          PY
          )"
          old="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded}" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "${old}" ]]; then
            git push "${remote}" "HEAD:refs/heads/${OUTPUT_BRANCH}" \
              --force-with-lease="refs/heads/${OUTPUT_BRANCH}:${old}"
          else
            git push "${remote}" "HEAD:refs/heads/${OUTPUT_BRANCH}"
          fi
          echo "new_sha=${new_sha}" >> "${GITHUB_OUTPUT}"
          echo "new_tree=${new_tree}" >> "${GITHUB_OUTPUT}"

      - name: Create or update bounded draft repair PR
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${OUTPUT_BRANCH}" --json number --jq '.[0].number // empty')"
          cat > "${RUNNER_TEMP}/repair-pr.md" <<EOF
          ## P0 external-evidence false-pass repair

          - parent: \`${SUBJECT_SHA}\` / \`${SUBJECT_TREE}\`
          - tested commit: \`${{ steps.publish.outputs.new_sha }}\`
          - tested tree: \`${{ steps.publish.outputs.new_tree }}\`

          The predecessor returned exit 0 for \`--require-all\` while its own report still
          contained open external blockers. This patch preserves the semantic/authentication
          checker and adds a process-boundary guard that derives the exact EXT IDs from the
          machine blocker register. Full mode now requires every ID to be positively accepted,
          rejects open/missing/contradictory IDs and malformed output, and retains ordinary
          inspection mode.

          Existing external-evidence tests, nine new adversarial guard tests, compileall,
          blocker/repository/documentation gates and deterministic release projection passed.
          Current absent external evidence now exits 2. This fixes evidence integrity; it does
          not fabricate or accept the missing review, campaign, HSM, power, audit or soak data.
          EOF
          if [[ -z "${existing}" ]]; then
            gh pr create --repo "${GITHUB_REPOSITORY}" \
              --base work/plan-v2-full-gap-closure-20260902 \
              --head "${OUTPUT_BRANCH}" \
              --title "M17: make external evidence --require-all genuinely fail closed" \
              --body-file "${RUNNER_TEMP}/repair-pr.md" \
              --draft
          else
            gh pr edit "${existing}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/repair-pr.md"
          fi

      - name: Upload predecessor and repaired behavior evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-external-require-all-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/predecessor.stdout
            ${{ runner.temp }}/predecessor.stderr
            ${{ runner.temp }}/repaired-require-all.stdout
            ${{ runner.temp }}/repaired-require-all.stderr
            ${{ runner.temp }}/normal-mode.stdout
            ${{ runner.temp }}/normal-mode.stderr
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Verify no uncommitted or carrier files remain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
