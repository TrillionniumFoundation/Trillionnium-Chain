name: PoN complete W1 logical oracle research
on:
  pull_request:
    paths:
      - .github/workflows/pon-w1-logical-oracle-research.yml
      - formal/pon-nakamoto-v1/reversible_bits.py
      - formal/pon-nakamoto-v1/w1_oracle_blueprint.py
      - formal/pon-nakamoto-v1/test_w1_oracle_blueprint.py
      - formal/pon-nakamoto-v1/work_oracle.py
      - formal/pon-nakamoto-v1/contract_wire.py
      - formal/pon-nakamoto-v1/quantum_daa.py
      - formal/pon-nakamoto-v1/quantum_daa_native.rs
      - formal/pon-nakamoto-v1/test_quantum_daa.py
      - formal/pon-nakamoto-v1/quantum_stopping.py
      - formal/pon-nakamoto-v1/test_quantum_stopping.py
      - trillionnium/crates/trnm-crypto-primitives/src/pon_work.rs
      - trillionnium/crates/trnm-pon-node/src/consensus.rs
      - config/pon/devnet-v1.json
permissions:
  contents: read
concurrency:
  group: pon-w1-logical-oracle-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  complete-blueprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact candidate without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and reserve observations
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/w1-logical-oracle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$out"
          printf 'OUT=%s\n' "$out" >> "$GITHUB_ENV"
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_HEAD" --output "$out/source-before.json"
          bash scripts/project-preflight.sh --audit > "$out/preflight.log" 2>&1
      - name: Execute actual reversible templates and complete classical differential
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s formal/pon-nakamoto-v1 -p test_w1_oracle_blueprint.py -v 2>&1 | tee "$OUT/gate-controls.log"
          export RUSTC="$(command -v rustc)"
          test -n "$RUSTC"
          "$RUSTC" -Vv > "$OUT/native-rustc-version.txt"
          python3 -B -m unittest discover -s formal/pon-nakamoto-v1 -p test_quantum_daa.py -v 2>&1 | tee "$OUT/native-daa-controls.log"
          python3 -B -m unittest discover -s formal/pon-nakamoto-v1 -p test_quantum_stopping.py -v 2>&1 | tee "$OUT/finite-stopping-controls.log"
          python3 -B formal/pon-nakamoto-v1/w1_oracle_blueprint.py --output "$OUT/logical-circuit-upper-bound.json"
          python3 -B formal/pon-nakamoto-v1/quantum_daa.py --output "$OUT/conditional-daa.json"
          python3 -B formal/pon-nakamoto-v1/quantum_stopping.py --output "$OUT/finite-stopping.json"
      - name: Independently verify final source bytes
        if: always()
        run: python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_HEAD"
      - name: Retain actual outcomes without production qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w1-logical-oracle-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w1-logical-oracle-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
