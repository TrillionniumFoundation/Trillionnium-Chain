          observations = root / 'hia-typed-store-observations'
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def read(path):
              require(path.is_file() and not path.is_symlink(), 'Missing regular receipt: ' + str(path))
              raw = path.read_bytes()
              return json.loads(raw), hashlib.sha256(raw).hexdigest()
          def original_hash(build):
              return hashlib.sha256(json.dumps(build['original_sources'], sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          expected = {'git_head': os.environ['TRNM_EXPECTED_SOURCE_SHA'],
                      'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': int(os.environ['GITHUB_RUN_ATTEMPT'])}
          if stage == 'native':
              native, native_sha = read(root / 'hia-typed-store-native/report.json')
              comparison, comparison_sha = read(root / 'hia-typed-store-native/native-comparison.json')
              original, original_sha = read(root / 'hia-typed-store-original/report.json')
              require(native['status'] == 'NATIVE_PASS_ORIGINAL_NOT_RUN' and native['native'] == 'PASS', 'Native owner did not pass')
              require(native['original_rust'] == 'NOT_RUN', 'Do not rewrite the native-only original-Rust field')
              require(native['native_controls'] == len(native['controls']) == 603 and native['semantic_cases'] == 392,
                      'Complete frozen native controls and semantic corpus required')
              require(all(row['status'] == 'PASS' for row in native['controls']), 'A native control failed')
              require(comparison['status'] == 'PASS' and len(comparison['cases']) == 392, 'Native comparison incomplete')
              build = comparison['build']
              require(build == native['build'] and build['status'] == 'PASS', 'Native build identities differ')
              require(original['status'] == 'PASS' and original['controls'] == 392 and original['failed'] == 0,
                      'Mandatory actual original Rust did not pass')
              require(original['retained_original_tests'] == list(ORIGINAL_TESTS), 'The three original State tests are required')
              require(original['actual_private_original_apply_slot_state_and_root_called'] is True
                      and original['original_production_function_bytes_preserved'] is True, 'Actual retained Node implementation required')
              require(original['native_comparison_sha256'] == comparison_sha
                      and original['native_source_set_sha256'] == build['source_set_sha256']
                      and original['original_sources'] == build['original_sources']
                      and original['exact_corpus'] == comparison['corpus'], 'Native and actual original source/corpus binding differs')
              lineage = dict(expected, source_set_sha256=build['source_set_sha256'],
                  original_source_set_sha256=original_hash(build), executable_sha256=build['executable']['sha256'],
                  native_source_inputs_match_git_head=True)
              binding = {'schema': 'trnm.hia.typed-store.ci-native-binding.v1', 'status': 'PASS',
                  'lineage': lineage, 'source_inputs': build['source_inputs'],
                  'native_controls': 603, 'semantic_cases': 392, 'original_tests': list(ORIGINAL_TESTS),
                  'native_report_sha256': native_sha, 'original_report_sha256': original_sha,
                  'comparison_sha256': comparison_sha, 'corpus': comparison['corpus'],
                  'whole_node_or_commit_authority': False, 'physical_power_loss_qualified': False}
              with (observations / 'native-binding.json').open('x') as stream:
                  json.dump(binding, stream, sort_keys=True, indent=2)
                  stream.write('\n')
          else:
              previous = {'produce': 'native', 'cold': 'produce', 'bounds': 'cold'}[stage]
              prior = root / ('hia-typed-store-prior-' + previous)
