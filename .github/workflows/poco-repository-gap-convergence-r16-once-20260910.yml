name: PoCO repository-gap convergence R16 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-repository-gap-convergence-r16-once-20260910.yml

concurrency:
  group: poco-only-final-convergence
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r16-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"

jobs:
  converge:
    name: Close repository-owned gaps and preserve external fail-closed truth
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned qualification tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep jq
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked

      - name: Capture prior convergence diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : >/tmp/trnm-r16-prior-convergence.log
          for workflow in \
            poco-only-convergence-r15-once-20260910.yml \
            poco-only-convergence-r14-once-20260910.yml \
            poco-only-convergence-r13-once-20260910.yml
          do
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${TARGET_BRANCH}&per_page=1" \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
            if [[ -n "$run_id" ]]; then
              printf 'workflow=%s run_id=%s\n' "$workflow" "$run_id" \
                >>/tmp/trnm-r16-prior-convergence.log
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log \
                >>/tmp/trnm-r16-prior-convergence.log 2>&1 || true
            fi
          done

      - name: Finish pre-product materialization when still present
        id: preproduct
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f tools/temporary_poco_convergence_r13.sh ]]; then
            echo "executed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > tools/temporary_poco_r13_postfix.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import pathlib
          import re

          ROOT = pathlib.Path(__file__).resolve().parents[1]

          def patch_raw_key_boundary() -> None:
              path = ROOT / "trillionnium/crates/trnm-poco-node/tests/raw_key_boundary.rs"
              text = path.read_text(encoding="utf-8")
              begin = text.find('        if relative == "src/recovery_tests.rs" {')
              if begin < 0:
                  raise RuntimeError("recovery raw-key case missing")
              end_marker = "            continue;\n        }\n"
              end = text.find(end_marker, begin)
              if end < 0:
                  raise RuntimeError("recovery raw-key case terminator missing")
              end += len(end_marker)
              replacement = '''        if relative == "src/recovery_tests.rs" {
                      let compact_lib: String = lib.chars().filter(|ch| !ch.is_whitespace()).collect();
                      assert!(
                          compact_lib.contains(
                              "#[cfg(all(test,feature=\\\"recovery-process-test-support\\\",target_os=\\\"linux\\\"))]modrecovery_tests;"
                          ),
                          "recovery raw-key module lost its test/fixture gate"
                      );
                      continue;
                  }
          '''
              path.write_text(text[:begin] + replacement + text[end:], encoding="utf-8")

          def remove_unused_codec_constant() -> None:
              path = ROOT / "trillionnium/crates/trnm-native-execution-v0/src/store.rs"
              text = path.read_text(encoding="utf-8")
              definition = "const AUTH_TREE_SNAPSHOT_CODEC_VERSION_V0: u16 = 1;\n"
              if text.count(definition) != 1:
                  raise RuntimeError("snapshot codec definition drift")
              path.write_text(text.replace(definition, "", 1), encoding="utf-8")

          def main() -> int:
              patch_raw_key_boundary()
              remove_unused_codec_constant()
              pathlib.Path(__file__).unlink()
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python3 - <<'PY'
          from pathlib import Path

          native = Path("tools/temporary_poco_native_convergence_r13.py")
          text = native.read_text(encoding="utf-8")
          write = '    tests_path.write_text(text, encoding="utf-8")\n'
          repair = (
              '    stripped = text.rstrip()\n'
              '    orphan = "#[test]"\n'
              '    if stripped.endswith(orphan):\n'
              '        text = stripped[: -len(orphan)].rstrip() + "\\n"\n'
          )
          if repair not in text:
              if text.count(write) != 1:
                  raise SystemExit("obsolete test cleanup insertion drift")
              text = text.replace(write, repair + write, 1)
          native.write_text(text, encoding="utf-8")

          shell = Path("tools/temporary_poco_convergence_r13.sh")
          script = shell.read_text(encoding="utf-8")
          call = "python3 tools/temporary_poco_native_convergence_r13.py\n"
          postfix = "python3 tools/temporary_poco_r13_postfix.py\n"
          if postfix not in script:
              if script.count(call) != 1:
                  raise SystemExit("native-transform call drift")
              script = script.replace(call, call + postfix, 1)
          anchor = "  .github/workflows/poco-only-convergence-r13-once-20260910.yml \\\n"
          for path in (
              ".github/workflows/poco-only-convergence-r14-once-20260910.yml",
              ".github/workflows/poco-only-convergence-r15-once-20260910.yml",
              ".github/workflows/poco-repository-gap-convergence-r16-once-20260910.yml",
          ):
              line = f"  {path} \\\n"
              if line not in script:
                  if anchor not in script:
                      raise SystemExit("temporary cleanup anchor drift")
                  script = script.replace(anchor, anchor + line, 1)
          shell.write_text(script, encoding="utf-8")
          PY

          python3 -m py_compile \
            tools/temporary_poco_native_convergence_r13.py \
            tools/temporary_poco_r13_postfix.py
          bash -n tools/temporary_poco_convergence_r13.sh
          CARGO_TARGET_DIR=/tmp/trnm-r16-target \
            bash tools/temporary_poco_convergence_r13.sh
          echo "executed=true" >> "$GITHUB_OUTPUT"

      - name: Inventory exact product-tree gaps
        if: steps.preproduct.outputs.executed == 'false'
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export SOURCE_COMMIT SOURCE_TREE
          python3 -m compileall -q scripts tools formal conformance
          python3 scripts/ci/check_native_consensus_only.py \
            | tee /tmp/trnm-r16-native-only.json
          bash scripts/ci/check_canonical_development_plan.sh \
            | tee /tmp/trnm-r16-canonical-plan.log
          bash scripts/ci/check_poco_bft_mainline_truth.sh \
            | tee /tmp/trnm-r16-mainline.log
          python3 scripts/ci/check_repository_truth_v1.py \
            | tee /tmp/trnm-r16-repository-truth.json
          python3 scripts/ci/check_required_protocol_contract_v1.py \
            | tee /tmp/trnm-r16-protocol-contract.json

          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path.cwd()
          source_commit = os.environ["SOURCE_COMMIT"]
          source_tree = os.environ["SOURCE_TREE"]
          external_ids = {
              "EXT-ANCHOR-HSM-001",
              "EXT-AUDIT-001",
              "EXT-G1-CAMPAIGN-001",
              "EXT-POWERLOSS-001",
              "EXT-REVIEW-001",
              "EXT-SOAK-ACTIVATION-001",
          }
          marker_patterns = (
              re.compile(r"G[0-9A-Za-z._-]*-(?:incomplete|open|missing)", re.I),
              re.compile(r"runtime[_ -]?gap", re.I),
              re.compile(r"repository[_ -]?blocker", re.I),
              re.compile(r"implementation_acceptance\s*[=:]\s*[\"']?not-assessed", re.I),
              re.compile(r"semantic_design_acceptance\s*[=:]\s*[\"']?not-assessed", re.I),
          )
          allowed_roots = (
              pathlib.Path("docs/development"),
              pathlib.Path("scripts/ci"),
              pathlib.Path("config"),
          )
          findings = []
          for relative_root in allowed_roots:
              base = root / relative_root
              if not base.exists():
                  continue
              for path in base.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in {".md", ".json", ".toml", ".py", ".sh"}:
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for number, line in enumerate(text.splitlines(), 1):
                      if any(identifier in line for identifier in external_ids):
                          continue
                      if any(pattern.search(line) for pattern in marker_patterns):
                          findings.append({
                              "path": path.relative_to(root).as_posix(),
                              "line": number,
                              "text": line.strip()[:800],
                          })

          commands = []
          for path in sorted((root / "scripts/ci").glob("*technical*convergence*")):
              if not path.is_file():
                  continue
              if path.suffix == ".py":
                  command = ["python3", str(path.relative_to(root))]
              elif path.suffix == ".sh":
                  command = ["bash", str(path.relative_to(root))]
              else:
                  continue
              completed = subprocess.run(command, cwd=root, text=True, capture_output=True)
              commands.append({
                  "command": command,
                  "returncode": completed.returncode,
                  "stdout": completed.stdout[-20000:],
                  "stderr": completed.stderr[-20000:],
              })

          report = {
              "schema": "trnm-poco-repository-gap-inventory-r16-v1",
              "source_commit": source_commit,
              "source_tree": source_tree,
              "external_blockers_excluded_from_repository_closure": sorted(external_ids),
              "marker_findings": findings,
              "technical_convergence_commands": commands,
          }
          pathlib.Path("/tmp/trnm-r16-gap-inventory.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          summary = [
              f"source_commit={source_commit}",
              f"source_tree={source_tree}",
              f"repository_marker_findings={len(findings)}",
              f"technical_convergence_commands={len(commands)}",
          ]
          for row in findings[:100]:
              summary.append(f"{row['path']}:{row['line']}: {row['text']}")
          pathlib.Path("/tmp/trnm-r16-gap-summary.txt").write_text(
              "\n".join(summary) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "repository_marker_findings": len(findings),
              "technical_convergence_failures": sum(row["returncode"] != 0 for row in commands),
          }, sort_keys=True))
          if any(row["returncode"] != 0 for row in commands):
              raise SystemExit(2)
          if findings:
              raise SystemExit(3)
          PY

          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"

      - name: Materialize controller-free product candidate
        if: steps.preproduct.outputs.executed == 'false' && steps.inventory.outcome == 'success'
        id: product
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/poco-only-convergence-r14-once-20260910.yml \
            .github/workflows/poco-only-convergence-r15-once-20260910.yml \
            .github/workflows/poco-repository-gap-convergence-r16-once-20260910.yml
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "ci: publish zero-repository-gap native PoCO tree"
          FINAL_COMMIT="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
          rm -rf /tmp/trnm-r16-final
          git worktree add --detach /tmp/trnm-r16-final "$FINAL_COMMIT"
          echo "commit=$FINAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$FINAL_TREE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$FINAL_COMMIT" >/tmp/trnm-r16-final-commit.txt
          printf '%s\n' "$FINAL_TREE" >/tmp/trnm-r16-final-tree.txt

      - name: Verify fail-closed external evidence contract
        if: steps.preproduct.outputs.executed == 'false' && steps.inventory.outcome == 'success'
        working-directory: /tmp/trnm-r16-final
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_external_evidence_v1.py
          set +e
          python3 scripts/ci/check_external_evidence_v1.py --require-all \
            --source-commit "${{ steps.product.outputs.commit }}" \
            --source-tree "${{ steps.product.outputs.tree }}" \
            --output /tmp/trnm-r16-external-evidence.json \
            >/tmp/trnm-r16-external-evidence.stdout \
            2>/tmp/trnm-r16-external-evidence.stderr
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q "external evidence gate remains open" /tmp/trnm-r16-external-evidence.stderr

      - name: Compile all targets
        if: steps.preproduct.outputs.executed == 'false' && steps.inventory.outcome == 'success'
        working-directory: /tmp/trnm-r16-final
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARGO_TARGET_DIR"
          cargo check --manifest-path trillionnium/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r16-workspace-check.log
          cargo check --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r16-contract-check.log

      - name: Execute complete regression corpus
        if: steps.preproduct.outputs.executed == 'false' && steps.inventory.outcome == 'success'
        working-directory: /tmp/trnm-r16-final
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 7200s \
            cargo test --manifest-path trillionnium/Cargo.toml \
              --workspace --all-targets --locked --offline --no-fail-fast -j 1 -- \
              --test-threads=1 \
            2>&1 | tee /tmp/trnm-r16-workspace-test.log
          cargo test --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r16-contract-test.log

      - name: Execute strict production-boundary Clippy
        if: steps.preproduct.outputs.executed == 'false' && steps.inventory.outcome == 'success'
        working-directory: /tmp/trnm-r16-final
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 -- -D warnings \
            2>&1 | tee /tmp/trnm-r16-contract-clippy.log
          cd trillionnium
          : >/tmp/trnm-r16-boundary-clippy.log
          for package in \
            trnm-state trnm-consensus-types trnm-consensus-crypto \
            trnm-consensus-core trnm-consensus-safety-rules \
            trnm-consensus-safety-store trnm-consensus-signer-journal \
            trnm-native-application trnm-native-application-sqlite \
            trnm-native-execution-v0 trnm-durable-file-adapters-v0 \
            trnm-tx-lifecycle-v0 trnm-state-sync-v0 trnm-migration-v0 \
            trnm-control-plane-v0 trnm-release-bundle-v0 trnm-node-boundary-v0 \
            trnm-poco-node-production-v0 trnm-production-adapter-conformance-v0 \
            trnm-poco-node trnm-poco-node-authority trnm-poco-node-io \
            trnm-poco-node-host trnm-poco-node-cli
          do
            cargo clippy -p "$package" --all-targets --locked --offline -j 1 -- -D warnings \
              2>&1 | tee -a /tmp/trnm-r16-boundary-clippy.log
          done

      - name: Publish exact zero-repository-gap product commit
        if: steps.preproduct.outputs.executed == 'false' && steps.inventory.outcome == 'success'
        working-directory: /tmp/trnm-r16-final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.product.outputs.commit }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ steps.product.outputs.tree }}"
          python3 scripts/ci/check_native_consensus_only.py
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE" push origin \
            "${{ steps.product.outputs.commit }}:refs/heads/$TARGET_BRANCH"

      - name: Upload exact R16 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r16-gap-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/trnm-r16-prior-convergence.log
            /tmp/trnm-r16-gap-inventory.json
            /tmp/trnm-r16-gap-summary.txt
            /tmp/trnm-r16-native-only.json
            /tmp/trnm-r16-canonical-plan.log
            /tmp/trnm-r16-mainline.log
            /tmp/trnm-r16-repository-truth.json
            /tmp/trnm-r16-protocol-contract.json
            /tmp/trnm-r16-final-commit.txt
            /tmp/trnm-r16-final-tree.txt
            /tmp/trnm-r16-external-evidence.json
            /tmp/trnm-r16-external-evidence.stdout
            /tmp/trnm-r16-external-evidence.stderr
            /tmp/trnm-r16-workspace-check.log
            /tmp/trnm-r16-contract-check.log
            /tmp/trnm-r16-workspace-test.log
            /tmp/trnm-r16-contract-test.log
            /tmp/trnm-r16-contract-clippy.log
            /tmp/trnm-r16-boundary-clippy.log
