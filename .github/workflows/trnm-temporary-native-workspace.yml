name: temporary-native-workspace
on:
  push:
    branches: [fix/pon-w1-from-zero-cost-20261005]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: adb9a386e109cdd80942020a4fc479a9b52730bc
          fetch-depth: 1
          persist-credentials: false
      - name: Export only the exact repository snapshot objects
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trnm-exact-source"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = adb9a386e109cdd80942020a4fc479a9b52730bc
          test "$(git rev-list --count HEAD)" = 1
          git rev-parse HEAD > "$out/source-sha.txt"
          git rev-parse HEAD^{tree} > "$out/source-tree.txt"
          git rev-list --objects HEAD | cut -d' ' -f1 | git pack-objects --stdout > "$out/source.pack"
          (cd "$out" && sha256sum source.pack > SHA256SUMS)
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain source objects, not configuration or credentials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-source-adb9a386e109cdd80942020a4fc479a9b52730bc
          path: ${{ runner.temp }}/trnm-exact-source/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
