name: trnm-a18-one-shot-truth-source-fix

on:
  push:
    branches:
      - feature/chain-a18-repository-truth-ci-hardening-v1-20260830

permissions:
  contents: write

concurrency:
  group: trnm-a18-one-shot-truth-source-fix
  cancel-in-progress: false

jobs:
  bind-machine-truth-at-verification-time:
    if: ${{ !contains(github.event.head_commit.message, '[a18-truth-source-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove self-invalidating candidate source claims
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          truth_path = Path("config/consensus-mainline.json")
          truth = json.loads(truth_path.read_text(encoding="utf-8"))
          truth["as_of"] = "2026-08-30"
          truth["active_candidate_source"] = "derived-at-verification-time-from-git-head-and-tree"
          truth["source_binding_policy"] = {
              "mode": "runtime-git-commit-and-tree",
              "generator": "scripts/ci/generate_release_status_v1.py",
              "committed_truth_may_not_claim_its_own_future_commit": True,
              "exact_source_required_for_evidence": True,
          }
          seam = truth["candidate_seams"]["candidate_p2p_socket_core_ingress"]
          seam["source_status"] = (
              "candidate-only-unpromoted; current commit/tree are derived at verification time"
          )
          truth_path.write_text(
              json.dumps(truth, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          checker_path = Path("scripts/ci/check_repository_truth_v1.py")
          checker = checker_path.read_text(encoding="utf-8")
          needle = '''    require(truth.get("production_consensus_activation") is False,\n            "machine truth production_consensus_activation must remain false")\n'''
          insertion = needle + '''    require(truth.get("as_of") == "2026-08-30",\n            "machine truth as_of date is stale")\n    require(truth.get("active_candidate_source") ==\n            "derived-at-verification-time-from-git-head-and-tree",\n            "machine truth must not embed a self-invalidating candidate SHA")\n    source_binding = truth.get("source_binding_policy", {})\n    require(source_binding.get("mode") == "runtime-git-commit-and-tree",\n            "machine truth source-binding mode drift")\n    require(source_binding.get("generator") ==\n            "scripts/ci/generate_release_status_v1.py",\n            "machine truth source-binding generator drift")\n    require(source_binding.get("committed_truth_may_not_claim_its_own_future_commit") is True,\n            "machine truth must forbid self-referential future commit claims")\n    require(source_binding.get("exact_source_required_for_evidence") is True,\n            "external evidence must bind the exact runtime source")\n'''
          if checker.count(needle) != 1:
              raise SystemExit("truth checker insertion anchor drifted")
          checker = checker.replace(needle, insertion, 1)
          checker_path.write_text(checker, encoding="utf-8")
          PY

      - name: Verify the new source-binding contract
        run: |
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/generate_release_status_v1.py \
            --check-deterministic \
            --output "${RUNNER_TEMP}/trnm-release-status-v1.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("trnm-release-status-v1.json")
              .read_text(encoding="utf-8")
          )
          assert len(status["source"]["commit"]) == 40
          assert len(status["source"]["tree"]) == 40
          assert status["consensus"]["production_candidate"] is False
          assert status["consensus"]["production_consensus_activation"] is False
          PY

      - name: Commit verified truth-source migration
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/consensus-mainline.json scripts/ci/check_repository_truth_v1.py
          git commit -m "fix(truth): derive exact source at verification time [a18-truth-source-fix]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
