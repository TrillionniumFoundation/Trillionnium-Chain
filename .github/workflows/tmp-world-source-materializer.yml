name: tmp-world-source-materializer

on:
  push:
    branches:
      - tmp/world-source-materializer-20260830

permissions:
  contents: read

concurrency:
  group: tmp-world-source-materializer-20260830
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.98.0"
  WORLD_HEAD: "5f76aceabe2b1c236c57fbe26c6b70e4bdb31903"

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact World source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TrillionniumFoundation/Trillionnium-World
          ref: ${{ env.WORLD_HEAD }}
          path: world
          fetch-depth: 1
          persist-credentials: false

      - name: Verify reviewed source inputs
        shell: bash
        run: |
          set -euo pipefail
          cd world
          test "$(git rev-parse HEAD)" = "${WORLD_HEAD}"
          test "$(git hash-object trillionnium/crates/trnm-game-server/build.rs)" = "abc8d4228123e13a3dc5e3e154467a7d2b67e2ee"
          test "$(git hash-object trillionnium/crates/trnm-game-server/src/lib.rs)" = "f5b2d91ae359d86fd259dc1b170982b8a0960d13"
          test "$(git hash-object trillionnium/crates/trnm-game-server/src/lib.rs.in)" = "8882f47db55ca5993329594901c828c6faf325a8"
          test "$(git hash-object trillionnium/crates/trnm-game-server/src/cex.rs)" = "4b8c9d6618d8eff167a5048192f6431e0427a6f0"
          test "$(git hash-object trillionnium/crates/trnm-game-server/Cargo.toml)" = "d27f7eb6a06bc3b8ceb13e31edacc72d3f58262f"
          test -z "$(git status --porcelain)"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Repair literal localhost loopback normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("world/trillionnium/crates/trnm-game-server/src/cex.rs")
          source = path.read_text(encoding="utf-8")
          old = (
              '            let host = url.host_str().unwrap_or_default();\n'
              '            let loopback = host.eq_ignore_ascii_case("localhost")\n'
              '                || host\n'
              '                    .parse::<IpAddr>()\n'
              '                    .is_ok_and(|address| address.is_loopback());\n'
          )
          new = (
              '            let host = url.host_str().unwrap_or_default();\n'
              "            let canonical_host = host.trim_start_matches('[').trim_end_matches(']').trim_end_matches('.');\n"
              '            let loopback = canonical_host.eq_ignore_ascii_case("localhost")\n'
              '                || canonical_host\n'
              '                    .parse::<IpAddr>()\n'
              '                    .is_ok_and(|address| address.is_loopback());\n'
          )
          if source.count(old) != 1:
              raise SystemExit("localhost normalization source drifted")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          grep -q 'let canonical_host = host' world/trillionnium/crates/trnm-game-server/src/cex.rs

      - name: Produce and materialize the reviewed generated body
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path world/trillionnium/Cargo.toml --locked -p trnm-game-server --lib
          generated="$(find world/trillionnium/target -type f -path '*/out/trnm_game_server_lib_generated.rs' -print | head -n 1)"
          test -n "${generated}"
          test -s "${generated}"
          cp "${generated}" /tmp/trnm_game_server_lib_generated.rs
          grep -q 'terminal settlement is owned by trnm-settlement-worker' /tmp/trnm_game_server_lib_generated.rs
          ! grep -q 'reconcile_economy(&state.cex' /tmp/trnm_game_server_lib_generated.rs
          ! grep -q 'settle_pending_matches(&settlement_state' /tmp/trnm_game_server_lib_generated.rs
          python3 - <<'PY'
          from pathlib import Path

          crate = Path("world/trillionnium/crates/trnm-game-server")
          lib = crate / "src/lib.rs"
          wrapper = lib.read_text(encoding="utf-8")
          marker = "// The full reviewed server body is generated from src/lib.rs.in by build.rs."
          if wrapper.count(marker) != 1:
              raise SystemExit("reviewed lib.rs wrapper marker drifted")
          header = wrapper.split(marker, 1)[0].rstrip()
          generated = Path("/tmp/trnm_game_server_lib_generated.rs").read_text(encoding="utf-8")
          if "include!(concat!(" in generated or "trnm_game_server_lib_generated.rs" in generated:
              raise SystemExit("generated body retained recursive generated-source include")
          lib.write_text(f"{header}\n\n{generated.lstrip()}", encoding="utf-8")

          manifest = crate / "Cargo.toml"
          cargo = manifest.read_text(encoding="utf-8")
          build_line = 'build = "build.rs"\n'
          if cargo.count(build_line) != 1:
              raise SystemExit("reviewed Cargo.toml build-script declaration drifted")
          manifest.write_text(cargo.replace(build_line, "", 1), encoding="utf-8")

          for obsolete in (crate / "build.rs", crate / "src/lib.rs.in"):
              if not obsolete.is_file():
                  raise SystemExit(f"expected obsolete source missing: {obsolete}")
              obsolete.unlink()
          PY
          test ! -e world/trillionnium/crates/trnm-game-server/build.rs
          test ! -e world/trillionnium/crates/trnm-game-server/src/lib.rs.in
          ! grep -q '^build = "build.rs"$' world/trillionnium/crates/trnm-game-server/Cargo.toml
          ! grep -q 'OUT_DIR.*trnm_game_server_lib_generated' world/trillionnium/crates/trnm-game-server/src/lib.rs
          ! grep -q 'reconcile_economy(&state.cex' world/trillionnium/crates/trnm-game-server/src/lib.rs
          ! grep -q 'settle_pending_matches(&settlement_state' world/trillionnium/crates/trnm-game-server/src/lib.rs

      - name: Format and validate directly compiled source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/world-materialization
          exec > >(tee run/world-materialization/validation.log) 2>&1
          cargo fmt --manifest-path world/trillionnium/Cargo.toml -p trnm-game-server
          cargo check --manifest-path world/trillionnium/Cargo.toml --locked -p trnm-game-server --lib
          cargo test --manifest-path world/trillionnium/Cargo.toml --locked -p trnm-game-server --lib
          cargo clippy --manifest-path world/trillionnium/Cargo.toml --locked -p trnm-game-server --lib -- -D warnings
          (cd world && bash scripts/check-trnm-settlement-transaction-boundary.sh)
          (cd world && bash scripts/check_trnm_settlement_transaction_boundary.sh)
          git -C world diff --check

      - name: Bind materialization evidence
        shell: bash
        run: |
          set -euo pipefail
          out=run/world-materialization
          cp world/trillionnium/crates/trnm-game-server/src/lib.rs "${out}/lib.rs"
          cp world/trillionnium/crates/trnm-game-server/src/cex.rs "${out}/cex.rs"
          cp world/trillionnium/crates/trnm-game-server/Cargo.toml "${out}/Cargo.toml"
          git -C world diff --binary -- \
            trillionnium/crates/trnm-game-server/Cargo.toml \
            trillionnium/crates/trnm-game-server/build.rs \
            trillionnium/crates/trnm-game-server/src/lib.rs \
            trillionnium/crates/trnm-game-server/src/lib.rs.in \
            trillionnium/crates/trnm-game-server/src/cex.rs \
            > "${out}/direct-source.patch"
          printf '%s\n' \
            'trillionnium/crates/trnm-game-server/build.rs' \
            'trillionnium/crates/trnm-game-server/src/lib.rs.in' \
            > "${out}/deleted-files.txt"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          out = Path("run/world-materialization")
          lib = out.joinpath("lib.rs").read_bytes()
          cex = out.joinpath("cex.rs").read_bytes()
          cargo = out.joinpath("Cargo.toml").read_bytes()
          git_blob = hashlib.sha1(f"blob {len(lib)}\0".encode() + lib).hexdigest()
          record = {
              "contract": "trnm_world_direct_source_materialization_v2",
              "world_head": "5f76aceabe2b1c236c57fbe26c6b70e4bdb31903",
              "source_blobs": {
                  "build.rs": "abc8d4228123e13a3dc5e3e154467a7d2b67e2ee",
                  "src/lib.rs": "f5b2d91ae359d86fd259dc1b170982b8a0960d13",
                  "src/lib.rs.in": "8882f47db55ca5993329594901c828c6faf325a8",
                  "src/cex.rs": "4b8c9d6618d8eff167a5048192f6431e0427a6f0",
                  "Cargo.toml": "d27f7eb6a06bc3b8ceb13e31edacc72d3f58262f"
              },
              "outputs": {
                  "lib_rs_bytes": len(lib),
                  "lib_rs_git_blob_sha1": git_blob,
                  "lib_rs_sha256": hashlib.sha256(lib).hexdigest(),
                  "cex_rs_sha256": hashlib.sha256(cex).hexdigest(),
                  "cargo_toml_sha256": hashlib.sha256(cargo).hexdigest()
              },
              "validation": {
                  "cargo_check": "passed",
                  "cargo_test_lib": "passed",
                  "cargo_clippy_deny_warnings": "passed",
                  "settlement_boundary_checks": "passed",
                  "git_diff_check": "passed"
              },
              "release_credit": "none"
          }
          out.joinpath("materialization.json").write_text(
              json.dumps(record, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
          sha256sum "${out}/lib.rs" "${out}/cex.rs" "${out}/Cargo.toml" "${out}/direct-source.patch" "${out}/materialization.json" > "${out}/SHA256SUMS"
          cat "${out}/materialization.json"

      - name: Upload exact materialized source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-direct-source-${{ env.WORLD_HEAD }}
          path: run/world-materialization/**
          if-no-files-found: error
          retention-days: 7
