[package]
name = "trnm-w1-succinct-research"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = ["."]

[dependencies]
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde_json = "1"
risc0-binfmt = "=3.0.5"
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["client", "disable-dev-mode"] }
trnm-w1-guest-relation = { path = "../w1-risc0/relation" }

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", rev = "7fd6900c4f637bd15ee2642dfa77110f8f1ad065" }

[profile.release]
opt-level = 3
lto = "thin"
debug = 0
panic = "abort"

[profile.dev]
debug = 0
