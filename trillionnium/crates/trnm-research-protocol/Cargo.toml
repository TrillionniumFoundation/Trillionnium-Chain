[package]
name = "trnm-research-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"
trnm-crypto-primitives = { version = "=0.1.0", path = "../trnm-crypto-primitives" }
trnm-protocol = { version = "=0.1.0", path = "../trnm-protocol" }

[dev-dependencies]
serde_json = "1"
zeroize = "=1.8.2"
