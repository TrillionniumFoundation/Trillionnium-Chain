          if test -d "$RUNNER_TEMP/hia-prefix-original-prior-0"; then roots+=(--root "prior-0=$RUNNER_TEMP/hia-prefix-original-prior-0"); fi
          if test -d "$RUNNER_TEMP/hia-prefix-original-download-1"; then roots+=(--root "download-1=$RUNNER_TEMP/hia-prefix-original-download-1"); fi
          if test -d "$RUNNER_TEMP/hia-prefix-original-prior-1"; then roots+=(--root "prior-1=$RUNNER_TEMP/hia-prefix-original-prior-1"); fi
          if test -d "$RUNNER_TEMP/hia-prefix-original-download-2"; then roots+=(--root "download-2=$RUNNER_TEMP/hia-prefix-original-download-2"); fi
          if test -d "$RUNNER_TEMP/hia-prefix-original-prior-2"; then roots+=(--root "prior-2=$RUNNER_TEMP/hia-prefix-original-prior-2"); fi
          if test -d "$RUNNER_TEMP/hia-prefix-original-download-3"; then roots+=(--root "download-3=$RUNNER_TEMP/hia-prefix-original-download-3"); fi
          if test -d "$RUNNER_TEMP/hia-prefix-original-prior-3"; then roots+=(--root "prior-3=$RUNNER_TEMP/hia-prefix-original-prior-3"); fi
