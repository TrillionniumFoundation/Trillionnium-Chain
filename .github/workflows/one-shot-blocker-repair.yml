# Registered in the parent commits; this PR synchronization triggers the repair.
name: one-shot blocker repair

on:
  push:
    branches:
      - "audit/docs-closure-20260904"
    paths:
      - ".github/workflows/one-shot-blocker-repair.yml"
  pull_request:
    paths:
      - ".github/workflows/one-shot-blocker-repair.yml"
      - "scripts/ci/one_shot_blocker_repair.py"

permissions:
  contents: write

concurrency:
  group: one-shot-blocker-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0

      - name: Apply assertion-backed repair transaction
        run: python3 scripts/ci/one_shot_blocker_repair.py

      - name: Validate retry-budget concurrency contract
        run: |
          python3 -m py_compile scripts/v2/pr7_alert_delivery.py
          bash scripts/v2/pr7_global_retry_budget_storm_test.sh

      - name: Validate governance audit mapping
        run: |
          cargo test --manifest-path contracts/Cargo.toml --locked \
            -p governance-guard \
            normalized_pause_restore_schedule_carries_reason_and_eta
          cargo test --manifest-path contracts/Cargo.toml --locked -p governance-guard

      - name: Validate critical-lane causal ordering
        run: |
          cargo test --manifest-path trillionnium/Cargo.toml --locked \
            -p trnm-node --features legacy-harness --bin trnm-sim \
            critical_causal_guard
          cargo test --manifest-path trillionnium/Cargo.toml --locked \
            -p trnm-node --features legacy-harness --bin trnm-sim \
            critical_guard

      - name: Validate event replay and legacy freeze
        run: |
          bash scripts/ci/check_legacy_harness_freeze.sh
          cd trillionnium
          MVP_MODE=prod ALLOW_PARTIAL_EVENT_REPLAY=0 ./scripts/check_event_replay_smoke.sh

      - name: Commit verified repairs and remove one-shot machinery
        run: |
          set -euo pipefail
          rm -f scripts/ci/one_shot_blocker_repair.py
          rm -f .github/workflows/one-shot-blocker-repair.yml
          git add -A
          if git diff --cached --quiet; then
            echo "[repair][FAIL] no verified changes to commit" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(blockers): close governance retry and replay failures"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
