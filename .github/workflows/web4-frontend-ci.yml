name: web4-frontend-ci

on:
  pull_request:
    paths:
      - 'web4-frontend/**'
      - '.github/workflows/web4-frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web4-frontend/**'
      - '.github/workflows/web4-frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: web4-frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep locale/time hashing deterministic for frontend snapshots/log assertions.
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: '0'
      CI: 'true'
    defaults:
      run:
        working-directory: web4-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web4-frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run CI checks (enforce e2e)
        env:
          CI_RUN_E2E: '1'
        run: npm run ci:check
