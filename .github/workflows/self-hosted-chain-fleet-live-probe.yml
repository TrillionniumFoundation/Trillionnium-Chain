name: Trillionnium Chain six-machine live availability

on:
  push:
    branches:
      - ops/chain-fleet-live-probe-20260909

permissions: {}

concurrency:
  group: trnm-chain-fleet-live-probe-20260909
  cancel-in-progress: false

jobs:
  desktop:
    name: desktop availability
    runs-on: [self-hosted, linux, x64, chain-fleet, desktop]
    timeout-minutes: 10
    steps:
      - name: Verify desktop runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/ops/chain-fleet-live-probe-20260909
          test "$RUNNER_NAME" = desktop
          printf 'runner=%s os=%s arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          uname -a

  rog:
