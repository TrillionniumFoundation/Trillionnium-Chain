[package]
name = "trnm-poco-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
autobins = false
publish = false

[features]
default = []
recovery-test-support = ["trnm-consensus-app/recovery-test-support"]
recovery-process-test-support = [
  "dep:ed25519-dalek",
  "dep:fs2",
  "recovery-test-support",
]

[package.metadata.trnm]
lane = "poco-bft-g1-host-scaffold"
protocol = "poco-bft-v0"
production_candidate = false
production_consensus_activation = false
incomplete = true
effect_driver = false
bounded_timeout_signing_effect_loop = true
vote_signing_effect_loop = false
production_signature_producer = false

[[bin]]
name = "trnm-poco-node"
path = "src/main.rs"

[[bin]]
name = "trnm-poco-recovery-kill-helper"
path = "src/bin/trnm-poco-recovery-kill-helper.rs"
required-features = ["recovery-process-test-support"]

[[bin]]
name = "trnm-poco-timeout-signing-kill-helper"
path = "src/bin/trnm-poco-timeout-signing-kill-helper.rs"
required-features = ["recovery-process-test-support"]

[[test]]
name = "recovery_process_kill_matrix"
path = "tests/recovery_process_kill_matrix.rs"
required-features = ["recovery-process-test-support"]

[[test]]
name = "timeout_signing_process_kill_matrix"
path = "tests/timeout_signing_process_kill_matrix.rs"
required-features = ["recovery-process-test-support"]

[dependencies]
ed25519-dalek = { version = "2", optional = true }
fs2 = { version = "0.4", optional = true }
sha2 = "0.10"
trnm-consensus-app = { version = "0.1.0", path = "../trnm-consensus-app" }
trnm-consensus-core = { version = "0.1.0", path = "../trnm-consensus-core" }
trnm-consensus-crypto = { version = "0.1.0", path = "../trnm-consensus-crypto" }
trnm-consensus-safety-store = { version = "0.1.0", path = "../trnm-consensus-safety-store" }
trnm-consensus-signer-journal = { version = "0.1.0", path = "../trnm-consensus-signer-journal" }
trnm-consensus-types = { version = "0.1.0", path = "../trnm-consensus-types" }

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
