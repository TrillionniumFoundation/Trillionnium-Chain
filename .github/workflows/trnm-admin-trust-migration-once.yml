name: trnm-admin-trust-migration-once

on:
  push:
    branches:
      - integration/native-poco-a04-a19-a23-qualified-v1-20260901
    paths:
      - .github/workflows/trnm-admin-trust-migration-once.yml

permissions:
  contents: read

concurrency:
  group: trnm-admin-trust-migration-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/integration/native-poco-a04-a19-a23-qualified-v1-20260901' &&
      github.actor == 'Franksudoman'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_PARENT: 180ecf98c02fb67de8a6b1907a860147be4913f8
      SELF_PATH: .github/workflows/trnm-admin-trust-migration-once.yml
      SCRIPT_PATH: scripts/ci/trnm_admin_trust_migration_once.py
      ARTIFACT_ROOT: ${{ runner.temp }}/trnm-admin-trust-migration
    steps:
      - name: Check out exact migration commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify one-shot source boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = "2"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$SELF_PATH"
          python3 -m py_compile "$SCRIPT_PATH"

      - name: Prepare and validate bounded trust migration
        run: |
          set -euo pipefail
          python3 "$SCRIPT_PATH"
          bash -n scripts/check_ci_runner_policy.sh
          bash -n scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh
          bash scripts/check_ci_runner_policy.sh --worktree
          bash scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh --self-test
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(\.github/workflows/[^/]+\.ya?ml|scripts/check_ci_runner_policy\.sh|scripts/ci/check_poco_bft_v0_workflow_trigger_truth\.sh|scripts/ci/trnm_admin_trust_migration_once\.py)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected migration paths:\n%s\n' "$unexpected" >&2
            exit 2
          fi
          test ! -e "$SELF_PATH"
          test ! -e "$SCRIPT_PATH"

      - name: Export exact validated replacement tree
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT/files"
          : > "$ARTIFACT_ROOT/deletes.txt"
          while IFS= read -r -d '' path; do
            if [[ -f "$path" ]]; then
              mkdir -p "$ARTIFACT_ROOT/files/$(dirname "$path")"
              cp -p -- "$path" "$ARTIFACT_ROOT/files/$path"
            else
              printf '%s\n' "$path" >> "$ARTIFACT_ROOT/deletes.txt"
            fi
          done < <(git diff --name-only -z)
          git diff --binary --full-index > "$ARTIFACT_ROOT/migration.patch"
          git rev-parse HEAD > "$ARTIFACT_ROOT/source-commit.txt"
          git write-tree > "$ARTIFACT_ROOT/base-tree.txt"
          find "$ARTIFACT_ROOT/files" -type f -print | LC_ALL=C sort > "$ARTIFACT_ROOT/files.txt"
          test -s "$ARTIFACT_ROOT/migration.patch"
          test -s "$ARTIFACT_ROOT/files.txt"
          test -s "$ARTIFACT_ROOT/deletes.txt"

      - name: Upload exact validated migration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-admin-trust-migration-${{ github.sha }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 7
