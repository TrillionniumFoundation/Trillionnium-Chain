name: trnm-a20-tombstone-gc-verify

on:
  push:
    branches:
      - feature/chain-a20-p2-tx-tombstone-gc-v1-20260830
    paths:
      - .github/workflows/trnm-a20-tombstone-gc-verify.yml

permissions:
  contents: write

concurrency:
  group: trnm-a20-tombstone-gc-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-finalize-tombstone-gc:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-a20-p2-tx-tombstone-gc-v1-20260830' &&
      github.actor == 'Tomasrgbsf'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-a20-p2-tx-tombstone-gc-v1-20260830
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable candidate base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0aaa5f1dbd32bfb3cbea5e26b8613ef2fe1585de"
          git merge-base --is-ancestor 13ecabcbd9ad6f1320d3d5ff1083d1a0b08f47c0 HEAD

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0

      - name: Wire schema, replay checks and machine truth
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trillionnium/crates/trnm-poco-node/src/tx_admission_wal.rs")
          text = source.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one source token: {old[:80]!r}")
              text = text.replace(old, new)

          replace_once("const SCHEMA_VERSION_V0: i64 = 1;", "const SCHEMA_VERSION_V0: i64 = 2;")
          ddl = "\n".join([
              "    UNIQUE(namespace, tx_digest)",
              ");",
              "CREATE TABLE tx_admission_tombstone_v1 (",
              "    namespace BLOB NOT NULL CHECK(length(namespace) = 32),",
              "    signer BLOB NOT NULL CHECK(length(signer) = 32),",
              "    nonce BLOB NOT NULL CHECK(length(nonce) = 8),",
              "    tx_digest BLOB NOT NULL CHECK(length(tx_digest) = 32),",
              "    terminal_state INTEGER NOT NULL CHECK(terminal_state IN (2, 3)),",
              "    terminal_height BLOB NOT NULL CHECK(length(terminal_height) = 8),",
              "    receipt_commitment BLOB NOT NULL CHECK(length(receipt_commitment) = 32),",
              "    tombstone_digest BLOB NOT NULL CHECK(length(tombstone_digest) = 32),",
              "    PRIMARY KEY(namespace, signer, nonce),",
              "    UNIQUE(namespace, tx_digest),",
              "    UNIQUE(namespace, tombstone_digest)",
              ");",
              '"#;',
          ])
          replace_once("    UNIQUE(namespace, tx_digest)\n);\n\"#;", ddl)
          replace_once(
              'execute_batch("PRAGMA user_version = 1;")',
              'execute_batch("PRAGMA user_version = 2;")',
          )
          replace_once(
              "        validate_pending_rows_v0(&connection, namespace)?;\n        validate_receipt_rows_v0(&connection, namespace)?;",
              "        validate_pending_rows_v0(&connection, namespace)?;\n        validate_receipt_rows_v0(&connection, namespace)?;\n        validate_tombstone_rows_v1(&connection, namespace)?;",
          )

          count_sql = "SELECT COUNT(*) FROM pending_nonce WHERE namespace = ?1"
          if text.count(count_sql) != 3:
              raise SystemExit(f"expected three bounded inventory queries, got {text.count(count_sql)}")
          text = text.replace(
              count_sql,
              "SELECT (SELECT COUNT(*) FROM pending_nonce WHERE namespace = ?1) + "
              "(SELECT COUNT(*) FROM tx_admission_tombstone_v1 WHERE namespace = ?1)",
          )

          reserve_start = text.index("    fn reserve_record<E: ?Sized>(")
          insertion_marker = "        if let Some((existing, state)) = read_row_v0("
          insertion = text.index(insertion_marker, reserve_start)
          guard = "\n".join([
              "        if tombstone_exists_by_nonce_or_digest_v1(",
              "            &transaction,",
              "            self.namespace,",
              "            expected.signer,",
              "            expected.nonce,",
              "            expected.digest,",
              "        )? {",
              "            return Err(TxAdmissionWalErrorV0::Replay);",
              "        }",
              "",
          ])
          text = text[:insertion] + guard + text[insertion:]

          include_marker = "#[cfg(test)]\nmod tests {"
          if text.count(include_marker) != 1:
              raise SystemExit("expected one tx-admission test module")
          text = text.replace(
              include_marker,
              'include!("tx_admission_wal_tombstone_gc_v1.inc");\n\n#[cfg(test)]\nmod tests {',
          )
          source.write_text(text, encoding="utf-8")

          cargo = Path("trillionnium/crates/trnm-poco-node/Cargo.toml")
          cargo_text = cargo.read_text(encoding="utf-8")
          old = "tx_admission_tombstone_gc = false"
          new = "\n".join([
              "tx_admission_tombstone_gc = true",
              "tx_admission_tombstone_compaction = true",
              "tx_admission_tombstone_authenticated_purge = true",
              "tx_admission_tombstone_gc_production = false",
              "tx_admission_replay_floor_native_integration = false",
          ])
          if cargo_text.count(old) != 1:
              raise SystemExit("tx admission tombstone metadata drift")
          cargo.write_text(cargo_text.replace(old, new), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trnm-a20-tombstone-gc-verify.yml
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git add -A
          git diff --cached --check
          git commit -m "feat(tx): finalize authenticated tombstone GC"

      - name: Compile complete active workspace
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked

      - name: Enforce feature-specific zero-warning boundary
        run: |
          set -euo pipefail
          cargo clippy --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal --lib --locked -- -D warnings

      - name: Run new and retained transaction admission regressions
        run: |
          set -euo pipefail
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal --lib \
            tx_admission_wal::tombstone_gc_tests_v1 -- --nocapture
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal --lib \
            tx_admission_wal::tests -- --nocapture

      - name: Preserve fail-closed plan and metadata
        run: |
          set -euo pipefail
          bash scripts/ci/check_canonical_development_plan.sh
          bash scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          python3 - <<'PY'
          import pathlib, tomllib
          cargo = tomllib.loads(pathlib.Path(
              "trillionnium/crates/trnm-poco-node/Cargo.toml"
          ).read_text(encoding="utf-8"))
          metadata = cargo["package"]["metadata"]["trnm"]
          assert metadata["tx_admission_tombstone_gc"] is True
          assert metadata["tx_admission_tombstone_compaction"] is True
          assert metadata["tx_admission_tombstone_authenticated_purge"] is True
          assert metadata["tx_admission_tombstone_gc_production"] is False
          assert metadata["tx_admission_replay_floor_native_integration"] is False
          assert metadata["tx_admission_boundary_production_activation"] is False
          assert metadata["tx_admission_boundary_signing"] is False
          assert metadata["tx_admission_boundary_broadcast"] is False
          assert metadata["production_candidate"] is False
          assert metadata["production_consensus_activation"] is False
          PY
          test ! -e .github/workflows/trnm-a20-tombstone-gc-verify.yml
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish exact tested candidate
        run: |
          set -euo pipefail
          git push origin "HEAD:feature/chain-a20-p2-tx-tombstone-gc-v1-20260830"
