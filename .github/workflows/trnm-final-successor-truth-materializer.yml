name: TRNM final successor truth materializer

on:
  push:
    branches:
      - fix/chain-plan-v2-repository-closure-20260911
    paths:
      - scripts/ci/materialize_final_successor_truth_v1.py
      - .github/workflows/trnm-final-successor-truth-materializer.yml

permissions:
  contents: write

concurrency:
  group: trnm-final-successor-truth-materializer-hosted
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/chain-plan-v2-repository-closure-20260911
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository validation prerequisites
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Materialize and commit hash-bound PR121 truth
        run: |
          set -euo pipefail
          python3 scripts/ci/materialize_final_successor_truth_v1.py
          git add README.md RELEASE_READINESS.md config/blocker-execution-v1.json docs/development/TRNM_AI_NATIVE_BLOCKCHAIN_DEVELOPMENT_PLAN.md docs/development/CURRENT_SNAPSHOT_V1.json docs/development/release-train-v1.toml docs/development/plan-manifest-v1.toml
          git diff --cached --check
          git config user.name "Trillionnium convergence bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(truth): bind final convergence successor to PR121"

      - name: Validate committed canonical truth
        run: |
          set -euo pipefail
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_plan_manifest_pins_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/generate_release_status_v1.py --check-deterministic
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Remove one-shot materializer and publish both commits
        run: |
          set -euo pipefail
          rm scripts/ci/materialize_final_successor_truth_v1.py
          rm .github/workflows/trnm-final-successor-truth-materializer.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(ci): remove final successor truth materializer"
          git push origin HEAD:fix/chain-plan-v2-repository-closure-20260911
