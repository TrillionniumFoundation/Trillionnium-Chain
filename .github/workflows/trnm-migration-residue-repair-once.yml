name: trnm-migration-residue-repair-once

on:
  push:
    branches:
      - integration/native-poco-a04-a19-a23-qualified-v1-20260901
    paths:
      - .github/workflows/trnm-migration-residue-repair-once.yml

permissions:
  contents: write

concurrency:
  group: trnm-migration-residue-repair-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/integration/native-poco-a04-a19-a23-qualified-v1-20260901' &&
      github.actor == 'Franksudoman' &&
      github.triggering_actor == 'Franksudoman'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_PARENT: 30b8c98028204e0bc64d1baecd55f985a51e3207
      TARGET_BRANCH: integration/native-poco-a04-a19-a23-qualified-v1-20260901
      SELF_PATH: .github/workflows/trnm-migration-residue-repair-once.yml
      SCRIPT_PATH: scripts/ci/trnm_migration_residue_repair_once.py
      STAGING_ROOT: .trnm-migration-residue-repair-v1
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-shot source boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" = "2"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$SELF_PATH"
          python3 -m py_compile "$SCRIPT_PATH"

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal

      - name: Transform only known migration residue
        run: |
          set -euo pipefail
          python3 "$SCRIPT_PATH"
          cargo +1.95.0 generate-lockfile \
            --manifest-path trillionnium/crates/trnm-node/Cargo.toml
          git diff --check
          bash -n trillionnium/scripts/consensus/run_persistent_scale_gate.sh
          bash scripts/ci/check_legacy_harness_freeze.sh

      - name: Validate standalone archive manifests and locks
        run: |
          set -euo pipefail
          cargo +1.95.0 metadata \
            --manifest-path trillionnium/crates/trnm-consensus-app/Cargo.toml \
            --locked --format-version 1 --no-deps \
            > "$RUNNER_TEMP/consensus-app-metadata.json"
          cargo +1.95.0 metadata \
            --manifest-path trillionnium/crates/trnm-node/Cargo.toml \
            --locked --format-version 1 --no-deps \
            > "$RUNNER_TEMP/node-metadata.json"
          cargo +1.95.0 check \
            --manifest-path trillionnium/crates/trnm-consensus-app/Cargo.toml \
            --locked --all-targets
          cargo +1.95.0 check \
            --manifest-path trillionnium/crates/trnm-node/Cargo.toml \
            --locked --features legacy-harness --bins

      - name: Validate repository policy after temporary files self-delete
        run: |
          set -euo pipefail
          bash scripts/check_ci_runner_policy.sh --worktree
          bash scripts/check_privileged_cargo_offline_policy.sh
          WORKFLOW_SCRIPT_REF_STRICT=1 \
            WORKFLOW_SCRIPT_REF_SUMMARY_PATH="$RUNNER_TEMP/workflow-script-refs.json" \
            bash scripts/validate_workflow_script_refs.sh
          python3 - <<'PY'
          import pathlib
          import tomllib
          for path in (
              pathlib.Path('deny.toml'),
              pathlib.Path('trillionnium/crates/trnm-node/Cargo.toml'),
              pathlib.Path('trillionnium/crates/trnm-consensus-app/Cargo.toml'),
          ):
              with path.open('rb') as handle:
                  tomllib.load(handle)
          PY

      - name: Materialize validated blobs under ordinary staging paths
        run: |
          set -euo pipefail
          temp_root="$RUNNER_TEMP/trnm-migration-residue-repair"
          rm -rf "$temp_root" "$STAGING_ROOT"
          mkdir -p "$temp_root/files"
          : > "$temp_root/deletes.txt"
          : > "$temp_root/files.txt"
          while IFS= read -r -d '' path; do
            if [[ -f "$path" ]]; then
              mkdir -p "$temp_root/files/$(dirname "$path")"
              cp -p -- "$path" "$temp_root/files/$path"
              printf '%s\n' "$path" >> "$temp_root/files.txt"
            else
              printf '%s\n' "$path" >> "$temp_root/deletes.txt"
            fi
          done < <(
            { git diff --name-only -z; git ls-files --others --exclude-standard -z; } \
              | LC_ALL=C sort -zu
          )
          LC_ALL=C sort -o "$temp_root/files.txt" "$temp_root/files.txt"
          LC_ALL=C sort -o "$temp_root/deletes.txt" "$temp_root/deletes.txt"
          test -s "$temp_root/files.txt"
          test -s "$temp_root/deletes.txt"

          git restore --worktree --staged -- .
          git clean -fdx
          cp -a "$temp_root" "$STAGING_ROOT"
          git add "$STAGING_ROOT"
          test -z "$(git diff --cached --name-only | grep -Ev '^\.trnm-migration-residue-repair-v1/' || true)"
          git diff --cached --check

      - name: Publish validated blobs without modifying workflow paths
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "ci: stage validated migration-residue repair blobs"
          git push origin "HEAD:${TARGET_BRANCH}"
