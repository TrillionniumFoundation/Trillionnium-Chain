name: trnm-codeql-contract-bootstrap

on:
  push:
    branches:
      - security/codeql-default-setup-contract-v1-20260909

permissions:
  contents: write

jobs:
  materialize-exact-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Stage exact closure without a workflow-token mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BOOTSTRAP_PARENT_SHA: fd232e4d7914a46f2d2dfb62c64d217007fb8720
          EXPECTED_FINAL_TREE: e4c59973db76489aa6f6651238167516bd93e766
          EXPECTED_WORKFLOW_BLOB: f8369714c2a27afb085a46671d41d1d2f53ca7d4
          PAYLOAD_PATH: .trnm-bootstrap/codeql-contract-payload.tar.gz
          PAYLOAD_SHA256: 25bd24221eeff3af69b3daa92ceabb69b8c04650a2766d693f6429bc87e3b1fb
          BOOTSTRAP_WORKFLOW: .github/workflows/trnm-codeql-contract-bootstrap.yml
          REQUIRED_BASELINE: .github/workflows/trnm-required-baseline.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_BOOTSTRAP_PARENT_SHA}"
          printf '%s  %s\n' "${PAYLOAD_SHA256}" "${PAYLOAD_PATH}" | sha256sum -c -
          tar -xzf "${PAYLOAD_PATH}"

          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          path = pathlib.Path(os.environ["REQUIRED_BASELINE"])
          raw = path.read_bytes()
          payload = json.dumps(
              {"content": base64.b64encode(raw).decode("ascii"), "encoding": "base64"}
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "trnm-codeql-contract-bootstrap-v2",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          actual = result.get("sha")
          expected = os.environ["EXPECTED_WORKFLOW_BLOB"]
          if actual != expected:
              raise SystemExit(f"workflow blob mismatch: expected {expected}, got {actual}")
          print(f"published desired required-baseline blob {actual}")
          PY

          rm -f "${PAYLOAD_PATH}" "${BOOTSTRAP_WORKFLOW}"
          rmdir .trnm-bootstrap
          git add --all
          test "$(git write-tree)" = "${EXPECTED_FINAL_TREE}"

          git checkout HEAD -- "${BOOTSTRAP_WORKFLOW}" "${REQUIRED_BASELINE}"
          git add --all
          git diff --cached --quiet -- "${BOOTSTRAP_WORKFLOW}" "${REQUIRED_BASELINE}"
          test ! -e "${PAYLOAD_PATH}"
          test "$(git diff --cached --name-only | wc -l)" -eq 8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security(m17): stage CodeQL setup without workflow mutation" \
            -m "Primary-Module: M17" \
            -m "Production-Authority: false"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
