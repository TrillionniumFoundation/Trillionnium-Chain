[package]
name = "trnm-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
trnm-pouw = { path = "../trnm-pouw" }
trnm-state = { path = "../trnm-state" }
trnm-types = { path = "../trnm-types" }
trnm-executor = { path = "../trnm-executor" }
trnm-mempool = { path = "../trnm-mempool" }

[dev-dependencies]
trnm-state = { path = "../trnm-state", features = ["test-utils"] }
