name: apply-plan-v2-closure-tree

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/zz-apply-plan-v2-closure-tree.yml

permissions:
  contents: write

concurrency:
  group: apply-plan-v2-closure-tree-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/plan-v2-full-gap-closure-20260902' &&
      github.actor == 'Franksudoman'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_TREE: dafb720cb765963d9f2643d6a4dfd60135f27ce5
      TARGET_BRANCH: work/plan-v2-full-gap-closure-20260902
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate immutable target tree and production dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          tree_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}/git/trees/${TARGET_TREE}?recursive=1")"
          test "$(jq -r '.sha' <<<"${tree_json}")" = "${TARGET_TREE}"
          test "$(jq -r '[.tree[] | select(.path == ".github/workflows/zz-apply-plan-v2-closure-tree.yml")] | length' <<<"${tree_json}")" = "0"

          node_blob="$(jq -er '.tree[] | select(.path == "trillionnium/crates/trnm-poco-node/Cargo.toml" and .type == "blob") | .sha' <<<"${tree_json}")"
          curl --fail --silent --show-error "${auth[@]}" "${api}/git/blobs/${node_blob}" \
            | jq -r '.content' \
            | tr -d '\n' \
            | base64 --decode > /tmp/trnm-poco-node.Cargo.toml

          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          manifest = tomllib.loads(Path('/tmp/trnm-poco-node.Cargo.toml').read_text())
          candidate = {
              'trnm-poco-cross-plane-readback-v1',
              'trnm-poco-agent-market-v1',
              'trnm-poco-consumption-settlement-v1',
              'trnm-poco-da-v1',
              'trnm-poco-global-execution-v1',
              'trnm-poco-mvcc-fee-v1',
              'trnm-poco-order-application-v1',
              'trnm-poco-order-finality-verifier-v1',
              'trnm-poco-order-state-v1',
              'trnm-poco-order-types-v1',
              'trnm-poco-verify-challenge-v1',
          }
          deps = manifest.get('dependencies', {})
          features = manifest.get('features', {})
          assert set(features.get('default', [])) & {f'dep:{name}' for name in candidate} == set()
          assert set(features.get('ai-v1-candidate', [])) == {f'dep:{name}' for name in candidate}
          for name in candidate:
              spec = deps[name]
              assert isinstance(spec, dict) and spec.get('optional') is True, name
          PY

      - name: Create exact-tree successor and advance branch by compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          encoded_branch="heads/${TARGET_BRANCH}"
          current="$(curl --fail --silent --show-error "${auth[@]}" "${api}/git/ref/${encoded_branch}" | jq -er '.object.sha')"
          test "${current}" = "${GITHUB_SHA}"

          payload="$(jq -n \
            --arg message 'build(ci): close production dependency and runner-policy gaps' \
            --arg tree "${TARGET_TREE}" \
            --arg parent "${GITHUB_SHA}" \
            '{message:$message, tree:$tree, parents:[$parent]}')"
          created="$(curl --fail --silent --show-error -X POST "${auth[@]}" \
            "${api}/git/commits" -d "${payload}")"
          successor="$(jq -er '.sha' <<<"${created}")"
          test "$(jq -er '.tree.sha' <<<"${created}")" = "${TARGET_TREE}"

          ref_payload="$(jq -n --arg sha "${successor}" '{sha:$sha, force:false}')"
          updated="$(curl --fail --silent --show-error -X PATCH "${auth[@]}" \
            "${api}/git/refs/${encoded_branch}" -d "${ref_payload}")"
          test "$(jq -er '.object.sha' <<<"${updated}")" = "${successor}"
          echo "Applied target tree ${TARGET_TREE} as ${successor}."
