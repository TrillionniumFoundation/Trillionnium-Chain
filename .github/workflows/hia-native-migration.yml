          rustup which --toolchain 1.95.0 rustc >"$OWNER_ROOT/observations/rustc-path.txt"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          tools = Path((Path(os.environ['OWNER_ROOT']) / 'observations/rustc-path.txt').read_text().strip()).resolve(strict=True).parent
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(tools) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('OWNER_RUST_BIN=' + str(tools) + '\n')
          PY
      - name: Fetch only the unchanged locked Cargo dependency graph
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path trillionnium/Cargo.toml >"$OWNER_ROOT/observations/cargo-fetch.stdout.raw" 2>"$OWNER_ROOT/observations/cargo-fetch.stderr.raw"
      - name: Prepare the exact original public PQ provider
        if: matrix.component == 'pq-auth' || matrix.component == 'pq-candidate'
        run: |
          set -euo pipefail
          touch "$OWNER_ROOT/provider.env"
          GITHUB_ENV="$OWNER_ROOT/provider.env" \
          TRNM_CI_RECEIPT_DIR="$OWNER_ROOT/provider-receipts" \
          bash scripts/ci/prepare_pq_provider.sh >"$OWNER_ROOT/observations/provider.stdout.raw" 2>"$OWNER_ROOT/observations/provider.stderr.raw"
      - name: Bootstrap and self-reproduce the pinned native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap" >"$OWNER_ROOT/observations/bootstrap.stdout.raw" 2>"$OWNER_ROOT/observations/bootstrap.stderr.raw"
          python3 -B - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS' or value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54' or not value.get('compiler'):
              raise SystemExit('Pinned native HIA compiler did not self-reproduce')
          with open(sys.argv[2], 'a') as stream:
              stream.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              stream.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Observe Settlement runner CPU before execution
        if: matrix.component == 'settlement-engine'
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
          mkdir -m 700 -- "$RUNNER_TEMP/settlement-runner-cpu"
          timeout 2s python3 -B -m hia.tools.settlement_runner_cpu \
            --phase before --output-dir "$RUNNER_TEMP/settlement-runner-cpu" \
            --head "$TRNM_EXPECTED_SOURCE_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Execute the complete component and its independent reader
        id: owner_execute
        run: |
          set -euo pipefail
          python3 -B hia/tools/qualify_additional_owner_ci.py run --component '${{ matrix.component }}' --root "$OWNER_ROOT" --rust-bin "$OWNER_RUST_BIN" >"$OWNER_ROOT/observations/driver.stdout.raw" 2>"$OWNER_ROOT/observations/driver.stderr.raw"
      - name: Observe Settlement runner CPU after execution
        if: always() && matrix.component == 'settlement-engine'
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
          test -d "$RUNNER_TEMP/settlement-runner-cpu"
          timeout 2s python3 -B -m hia.tools.settlement_runner_cpu \
            --phase after --output-dir "$RUNNER_TEMP/settlement-runner-cpu" \
            --head "$TRNM_EXPECTED_SOURCE_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Recheck every committed source byte after success or failure
        id: owner_source_after
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OWNER_ROOT/observations"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$OWNER_ROOT/observations/source-after.json" >"$OWNER_ROOT/observations/source-after.stdout.raw" 2>"$OWNER_ROOT/observations/source-after.stderr.raw"
      - name: Bind actual execution and source closure to this head and run
        id: owner_bind
        run: |
          set -euo pipefail
          python3 -B hia/tools/qualify_additional_owner_ci.py bind --component '${{ matrix.component }}' --root "$OWNER_ROOT" --rust-bin "$OWNER_RUST_BIN" >"$OWNER_ROOT/observations/binding.stdout.raw" 2>"$OWNER_ROOT/observations/binding.stderr.raw"
      - name: Collect compact Settlement CI evidence without replacing the full archive
        id: settlement_companion
        if: always() && matrix.component == 'settlement-engine'
        continue-on-error: true
        env:
          SETTLEMENT_EXECUTION_OUTCOME: ${{ steps.owner_execute.outcome }}
          SETTLEMENT_SOURCE_AFTER_OUTCOME: ${{ steps.owner_source_after.outcome }}
          SETTLEMENT_BINDING_OUTCOME: ${{ steps.owner_bind.outcome }}
          SETTLEMENT_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -m 700 -- "$RUNNER_TEMP/settlement-compact"
          python3 -B -m hia.tools.settlement_companion \
            --root "${OWNER_ROOT:-$RUNNER_TEMP/settlement-unavailable}" \
            --output-dir "$RUNNER_TEMP/settlement-compact" \
            --head "$TRNM_EXPECTED_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --execution-outcome "$SETTLEMENT_EXECUTION_OUTCOME" --source-after-outcome "$SETTLEMENT_SOURCE_AFTER_OUTCOME" \
            --binding-outcome "$SETTLEMENT_BINDING_OUTCOME" --job-status "$SETTLEMENT_JOB_STATUS"
      - name: Upload the allowlisted Settlement companion separately
        if: always() && matrix.component == 'settlement-engine' && steps.settlement_companion.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-settlement-compact-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/settlement-compact/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain and reread complete regular observations even on failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OWNER_ROOT/observations" "$OWNER_ARTIFACT"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          value = {'component': '${{ matrix.component }}', 'head': os.environ['TRNM_EXPECTED_SOURCE_SHA'],
                   'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'whole_chain_native': False, 'retirement_accepted': False, 'production_activation': False,
                   'runtime_qualification_inferred_from_packaging': False}
          (Path(os.environ['OWNER_ARTIFACT']) / 'metadata.json').write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          PY
          python3 -B hia/tools/archive_runtime_observations.py --root "component=$OWNER_ROOT" --optional-root "bootstrap=$RUNNER_TEMP/hia-bootstrap" --metadata "$OWNER_ARTIFACT/metadata.json" --output "$OWNER_ARTIFACT" >"$OWNER_ARTIFACT/package.stdout.raw" 2>"$OWNER_ARTIFACT/package.stderr.raw"
      - name: Upload complete current-source observations and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-${{ matrix.component }}-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OWNER_ARTIFACT }}/
            ${{ env.OWNER_ROOT }}/observations/
          if-no-files-found: error
          retention-days: 30
      - name: Collect separate Settlement image identity after the full upload
        id: settlement_image_identity
        if: always() && matrix.component == 'settlement-engine'
        continue-on-error: true
        env:
          SETTLEMENT_SOURCE_AFTER_OUTCOME: ${{ steps.owner_source_after.outcome }}
        run: |
          set -euo pipefail
          mkdir -m 700 -- "$RUNNER_TEMP/settlement-image-identity"
          python3 -B -m hia.tools.settlement_image_identity \
            --root "${OWNER_ROOT:-$RUNNER_TEMP/settlement-unavailable}" \
            --output-dir "$RUNNER_TEMP/settlement-image-identity" \
            --head "$TRNM_EXPECTED_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-after-outcome "$SETTLEMENT_SOURCE_AFTER_OUTCOME"
      - name: Upload the separate Settlement image identity diagnostic
        if: always() && matrix.component == 'settlement-engine' && steps.settlement_image_identity.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-settlement-image-identity-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/settlement-image-identity/image-identity.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload separate optional Settlement runner CPU observations
        if: always() && matrix.component == 'settlement-engine'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-settlement-runner-cpu-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/settlement-runner-cpu/before.json
            ${{ runner.temp }}/settlement-runner-cpu/after.json
          if-no-files-found: ignore
          retention-days: 30
