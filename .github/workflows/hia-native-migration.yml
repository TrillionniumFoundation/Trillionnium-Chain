          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-typed-store-observations/source-after.json" 2>&1 | tee "$RUNNER_TEMP/hia-typed-store-observations/source-after.log"
      - name: Package all actual reports snapshots logs and build evidence without traversing FIFOs
        if: always()
