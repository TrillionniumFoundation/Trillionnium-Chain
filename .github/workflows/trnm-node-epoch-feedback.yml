name: trnm-node-epoch-feedback

# Targeted developer feedback, not a replacement for required-baseline or
# production acceptance. Each task gets a clean checkout and independent result.
on:
  pull_request:
    paths:
      - '.github/workflows/trnm-node-epoch-feedback.yml'
      - 'trillionnium/**'
      - 'scripts/ci/run_native_candidate_shards_v1.py'
      - 'scripts/ci/test_native_candidate_shards_v1.py'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit for the prospective merge
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trnm-node-epoch-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CI: true
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: 1
  TRNM_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  TRNM_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}

jobs:
  feedback:
    name: node-feedback / ${{ matrix.source }} / ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [head, prospective-merge]
        task: [v8, workspace-check, node-clippy, signer-tests]
    env:
      TRNM_FEEDBACK_SOURCE: ${{ matrix.source }}
      TRNM_FEEDBACK_TASK: ${{ matrix.task }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact candidate and ordered prospective merge
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRNM_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRNM_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TRNM_BASE_SHA" != "$TRNM_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$TRNM_HEAD_SHA"
          root="$RUNNER_TEMP/trnm-node-feedback"
          mkdir -p "$root"
          printf '%s\n' "$TRNM_HEAD_SHA" > "$root/source-head"
          printf '%s\n' "$TRNM_BASE_SHA" > "$root/source-base"
          if test "$TRNM_FEEDBACK_SOURCE" = prospective-merge; then
            # A conflict fails this cell. No merge-base, ours or theirs fallback.
            tree=$(git merge-tree --write-tree "$TRNM_BASE_SHA" "$TRNM_HEAD_SHA")
            [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
            stamp=$(git show -s --format=%ct "$TRNM_HEAD_SHA")
            export GIT_AUTHOR_NAME='TRNM integration verifier'
            export GIT_AUTHOR_EMAIL='integration-verifier@invalid.example'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE="@$stamp +0000"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            merge=$(printf 'TRNM source-bound prospective merge\n' | git commit-tree "$tree" -p "$TRNM_BASE_SHA" -p "$TRNM_HEAD_SHA")
            test "$(git show -s --format=%P "$merge")" = "$TRNM_BASE_SHA $TRNM_HEAD_SHA"
            git checkout --detach "$merge"
            test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
          else
            test "$TRNM_FEEDBACK_SOURCE" = head
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD > "$root/HEAD"
          git rev-parse 'HEAD^{tree}' > "$root/TREE"
          git show -s --format=%P HEAD > "$root/PARENTS"
          printf 'TRNM_EXPECTED_SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cat "$root/HEAD" "$root/TREE" "$root/PARENTS"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
      - name: Run independent bounded task
        id: task
        shell: bash
        working-directory: trillionnium
        run: |
          set -euo pipefail
          unset RUST_MIN_STACK
          root="$RUNNER_TEMP/trnm-node-feedback"
          test "$(git rev-parse HEAD)" = "$TRNM_EXPECTED_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(cat "$root/TREE")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          case "$TRNM_FEEDBACK_TASK" in
            workspace-check)
              timeout --signal=TERM --kill-after=10s 1200s cargo check --workspace --all-targets --locked 2>&1 | tee "$root/workspace-check.log"
              ;;
            node-clippy)
              timeout --signal=TERM --kill-after=10s 1200s cargo clippy -p trnm-poco-node --features epoch-runtime-test-fixtures --all-targets --locked -- -D warnings 2>&1 | tee "$root/node-clippy.log"
              ;;
            signer-tests)
              timeout --signal=TERM --kill-after=10s 1200s cargo test -p trnm-consensus-signer-journal --features candidate-handoff-signature-recovery --all-targets --locked 2>&1 | tee "$root/signer-tests.log"
              timeout --signal=TERM --kill-after=10s 300s cargo test -p trnm-consensus-signer-journal --features candidate-handoff-signature-recovery --doc --locked 2>&1 | tee "$root/signer-doc.log"
              timeout --signal=TERM --kill-after=10s 300s cargo clippy -p trnm-consensus-signer-journal --features candidate-handoff-signature-recovery --all-targets --locked -- -D warnings 2>&1 | tee "$root/signer-clippy.log"
              ;;
            v8)
              timeout --signal=TERM --kill-after=10s 1200s cargo test -p trnm-poco-node --features epoch-runtime-test-fixtures --lib --locked --no-run --message-format=json > "$root/compile.jsonl" 2> "$root/compile.stderr"
              python3 - "$root" <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location('shards', '../scripts/ci/run_native_candidate_shards_v1.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          executable = module.find_executable((root / 'compile.jsonl').read_text().splitlines(), Path.cwd(), 'node-epoch')
          (root / 'executable').write_text(str(executable) + '\n')
          (root / 'executable.sha256').write_text(module.binary_digest(executable) + '\n')
          PY
              executable=$(cat "$root/executable")
              testcase='epoch_runtime_candidate_v1::tests::actual_epoch_handoff_joint_attachment_and_exact_retry_v8'
              "$executable" --list > "$root/inventory.log"
              "$executable" "$testcase" --exact --list > "$root/selected.log"
              grep -Fx "$testcase: test" "$root/selected.log"
              printf '%q ' "$executable" "$testcase" --exact --nocapture --test-threads=2 > "$root/test.command"
              printf '\n' >> "$root/test.command"
              set +e
              timeout --signal=TERM --kill-after=10s 300s "$executable" "$testcase" --exact --nocapture --test-threads=2 > "$root/v8.log" 2>&1
              rc=$?
              set -e
              printf '%s\n' "$rc" > "$root/v8.exit-code"
              cat "$root/v8.log"
              test "$rc" -eq 0
              python3 - "$root" <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location('shards', '../scripts/ci/run_native_candidate_shards_v1.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          inventory = module.parse_test_inventory((root / 'inventory.log').read_text())
          selected = module.parse_test_inventory((root / 'selected.log').read_text())
          expected = 'epoch_runtime_candidate_v1::tests::actual_epoch_handoff_joint_attachment_and_exact_retry_v8'
          if selected != [expected] or expected not in inventory:
              raise SystemExit('V8 exact inventory mismatch')
          counts = module.parse_test_summary(module.final_test_result((root / 'v8.log').read_text()))
          module.validate_summary(counts, planned=1, ignored=0, total=len(inventory))
          executable = Path((root / 'executable').read_text().strip())
          if module.binary_digest(executable) != (root / 'executable.sha256').read_text().strip():
              raise SystemExit('V8 executable changed during execution')
          PY
              ;;
            *) exit 2 ;;
          esac
      - name: Revalidate source even after task failure
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/trnm-node-feedback"
          test "$(git rev-parse HEAD)" = "$(cat "$root/HEAD")"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(cat "$root/TREE")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Retain original task evidence including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-feedback-${{ matrix.source }}-${{ matrix.task }}-${{ env.TRNM_HEAD_SHA }}
          path: ${{ runner.temp }}/trnm-node-feedback
          if-no-files-found: error
          retention-days: 7
