name: PoCO repository metadata cleanup R6 admin (temporary)

on:
  push:
    branches:
      - ops-poco-metadata-cleanup-20260910-r3
    paths:
      - .github/workflows/poco-repository-metadata-cleanup-r6-admin-once-20260910.yml

concurrency:
  group: poco-repository-metadata-cleanup-admin
  cancel-in-progress: true

permissions:
  contents: write

env:
  OPS_BRANCH: ops-poco-metadata-cleanup-20260910-r3
  PRODUCT_BRANCH: chore/poco-only-purge-20260909
  EVIDENCE_BRANCH: evidence-poco-metadata-cleanup-20260910
  SUCCESS_BRANCH: evidence-poco-metadata-success-20260910

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact operations branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPS_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply branch and topic cleanup without exposing credentials
        env:
          FALLBACK_TOKEN: ${{ github.token }}
          TOKEN_GH_ADMIN: ${{ secrets.GH_ADMIN_TOKEN }}
          TOKEN_GITHUB_ADMIN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
          TOKEN_REPO_ADMIN: ${{ secrets.REPO_ADMIN_TOKEN }}
          TOKEN_REPOSITORY_ADMIN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
          TOKEN_TRNM_GITHUB_ADMIN: ${{ secrets.TRNM_GITHUB_ADMIN_TOKEN }}
          TOKEN_TRNM_REPO_ADMIN: ${{ secrets.TRNM_REPO_ADMIN_TOKEN }}
          TOKEN_ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
          TOKEN_GH_PAT: ${{ secrets.GH_PAT }}
          TOKEN_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          TOKEN_REPO_PAT: ${{ secrets.REPO_PAT }}
          TOKEN_ORG_ADMIN: ${{ secrets.ORG_ADMIN_TOKEN }}
          TOKEN_TRILLIONNIUM_ADMIN: ${{ secrets.TRILLIONNIUM_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$OPS_BRANCH"
          git fetch --no-tags origin \
            "$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
            "$EVIDENCE_BRANCH:refs/remotes/origin/$EVIDENCE_BRANCH"
          PRODUCT_SHA="$(git rev-parse "origin/$PRODUCT_BRANCH")"
          PRODUCT_TREE="$(git rev-parse "${PRODUCT_SHA}^{tree}")"

          NOOP_BEFORE=false
          if git ls-remote --exit-code --heads origin refs/heads/noop >/dev/null 2>&1; then
            NOOP_BEFORE=true
            git push origin --delete noop
          fi
          NOOP_ABSENT=true
          if git ls-remote --exit-code --heads origin refs/heads/noop >/dev/null 2>&1; then
            NOOP_ABSENT=false
          fi

          ADMIN_TOKEN=""
          CREDENTIAL_SOURCE="github_token"
          for variable in \
            TOKEN_GH_ADMIN TOKEN_GITHUB_ADMIN TOKEN_REPO_ADMIN \
            TOKEN_REPOSITORY_ADMIN TOKEN_TRNM_GITHUB_ADMIN TOKEN_TRNM_REPO_ADMIN \
            TOKEN_ADMIN_PAT TOKEN_GH_PAT TOKEN_GITHUB_PAT TOKEN_REPO_PAT \
            TOKEN_ORG_ADMIN TOKEN_TRILLIONNIUM_ADMIN
          do
            candidate="${!variable:-}"
            if test -n "$candidate"; then
              ADMIN_TOKEN="$candidate"
              CREDENTIAL_SOURCE="$variable"
              break
            fi
          done
          if test -z "$ADMIN_TOKEN"; then
            ADMIN_TOKEN="$FALLBACK_TOKEN"
          fi

          request_body='{"names":["blockchain","poco","rust","trillionnium"]}'
          TOPICS_WRITE_HTTP="$(
            curl --silent --show-error \
              --output /tmp/topics-write.json \
              --write-out '%{http_code}' \
              --request PUT \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer ${ADMIN_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/topics" \
              --data "$request_body" \
              2>/tmp/topics-write.stderr || true
          )"
          TOPICS_READ_HTTP="$(
            curl --silent --show-error \
              --output /tmp/topics-readback.json \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer ${ADMIN_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/topics" \
              2>/tmp/topics-readback.stderr || true
          )"

          TOPICS_OK=false
          if test "$TOPICS_WRITE_HTTP" = 200 && test "$TOPICS_READ_HTTP" = 200; then
            if jq -e '.names | sort == ["blockchain","poco","rust","trillionnium"]' \
              /tmp/topics-readback.json >/dev/null; then
              TOPICS_OK=true
            fi
          fi

          export PRODUCT_SHA PRODUCT_TREE NOOP_BEFORE NOOP_ABSENT
          export TOPICS_WRITE_HTTP TOPICS_READ_HTTP TOPICS_OK CREDENTIAL_SOURCE
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def text(path: str) -> str:
              value = Path(path)
              return value.read_text(errors='replace') if value.exists() else ''

          result = {
              'schema': 'trnm.poco.repository-metadata-cleanup.v2',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'operations_branch': os.environ['OPS_BRANCH'],
              'product_branch': os.environ['PRODUCT_BRANCH'],
              'product_commit': os.environ['PRODUCT_SHA'],
              'product_tree': os.environ['PRODUCT_TREE'],
              'credential_source': os.environ['CREDENTIAL_SOURCE'],
              'credential_value_recorded': False,
              'noop_branch_present_before': os.environ['NOOP_BEFORE'] == 'true',
              'noop_branch_absent_after': os.environ['NOOP_ABSENT'] == 'true',
              'topics_write_http': os.environ['TOPICS_WRITE_HTTP'],
              'topics_read_http': os.environ['TOPICS_READ_HTTP'],
              'topics_exact_poco_only': os.environ['TOPICS_OK'] == 'true',
              'topics_write_response': text('/tmp/topics-write.json'),
              'topics_write_error': text('/tmp/topics-write.stderr'),
              'topics_readback': text('/tmp/topics-readback.json'),
              'topics_read_error': text('/tmp/topics-readback.stderr'),
          }
          result['success'] = (
              result['noop_branch_absent_after']
              and result['topics_exact_poco_only']
          )
          Path('/tmp/poco-metadata-cleanup-result-v2.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n'
          )
          PY

      - name: Publish exact result to evidence branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/poco-metadata-evidence-v2
          git worktree add -B "$EVIDENCE_BRANCH" \
            /tmp/poco-metadata-evidence-v2 "origin/$EVIDENCE_BRANCH"
          mkdir -p /tmp/poco-metadata-evidence-v2/evidence/repository
          cp /tmp/poco-metadata-cleanup-result-v2.json \
            /tmp/poco-metadata-evidence-v2/evidence/repository/poco-metadata-cleanup-v2.json
          git -C /tmp/poco-metadata-evidence-v2 add \
            evidence/repository/poco-metadata-cleanup-v2.json
          git -C /tmp/poco-metadata-evidence-v2 config user.name "Qian QI"
          git -C /tmp/poco-metadata-evidence-v2 config user.email \
            "102159240+ProfHepta@users.noreply.github.com"
          if ! git -C /tmp/poco-metadata-evidence-v2 diff --cached --quiet; then
            git -C /tmp/poco-metadata-evidence-v2 commit \
              -m "evidence: record final PoCO repository metadata cleanup"
            git -C /tmp/poco-metadata-evidence-v2 push origin "$EVIDENCE_BRANCH"
          fi

      - name: Require success, publish success ref, and remove operations branch
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.success == true' /tmp/poco-metadata-cleanup-result-v2.json >/dev/null
          PRODUCT_SHA="$(jq -r '.product_commit' /tmp/poco-metadata-cleanup-result-v2.json)"
          git push origin "$PRODUCT_SHA:refs/heads/$SUCCESS_BRANCH"
          git ls-remote --exit-code --heads origin "refs/heads/$SUCCESS_BRANCH"
          git push origin --delete "$OPS_BRANCH"

      - name: Upload exact failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-metadata-r6-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/poco-metadata-cleanup-result-v2.json
            /tmp/topics-write.json
            /tmp/topics-write.stderr
            /tmp/topics-readback.json
            /tmp/topics-readback.stderr
