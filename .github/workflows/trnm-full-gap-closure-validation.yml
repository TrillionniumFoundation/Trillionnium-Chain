name: trnm-full-gap-closure-validation

on:
  push:
    branches:
      - work/full-gap-closure-20260831
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-full-gap-closure-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finality-and-repository-contracts:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/full-gap-closure-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact closure head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          test "$(git hash-object trillionnium/crates/trnm-finality-verifier/src/lib.rs)" = \
            "7f8a822d00937be0d8d3d295f123dd1cd67daaf2"
          test "$(git hash-object trillionnium/crates/trnm-node/src/live/merkle.rs)" = \
            "8d9943230a356adda53b143ea5de409df799be74"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting and active workspace compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked

      - name: Lint and test receipt finality verification
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path trillionnium/Cargo.toml \
            -p trnm-finality-verifier --all-targets --locked -- -D warnings
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-finality-types \
            -p trnm-finality-verifier \
            -p trnm-poco-order-finality-verifier-v1 \
            --all-targets --locked

      - name: Test the legacy duplicate-last producer contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path trillionnium/crates/trnm-node/Cargo.toml \
            --lib live::merkle --locked

      - name: Revalidate machine truth and blocker contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          bash scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          bash scripts/ci/check_canonical_development_plan.sh
          bash scripts/project-preflight.sh --audit
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
