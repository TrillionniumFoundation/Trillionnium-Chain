  native-node-pool-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LC_ALL: C
      TRNM_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha ||
        github.sha }}
    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Checkout the exact current chain source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout the pinned HIA compiler source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: hia-toolchain
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            hepta
            tools
            examples
            docs
            tests
            formal
      - name: Bind every current source byte and migration scope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-node-pool-smoke-observations"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-node-pool-smoke-observations/source-before.json" 2>&1 | tee "$RUNNER_TEMP/hia-node-pool-smoke-observations/source-before.log"
          bash scripts/project-preflight.sh --audit
          python3 -B hia/tools/check_migration.py
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA native compiler identity differs')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Reject incomplete source and corpus admission
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.mempool_node.test_integrity --scope source --report "$RUNNER_TEMP/hia-node-pool-smoke-observations/source-controls.json" 2>&1 | tee "$RUNNER_TEMP/hia-node-pool-smoke-observations/source-controls.log"
          strace -V 2>&1 | tee "$RUNNER_TEMP/hia-node-pool-smoke-observations/strace-version.log"
      - name: Reject native pipe write deadline violations
        run: |
          set -euo pipefail
          deadline_observations="$RUNNER_TEMP/hia-node-pool-smoke-observations/io-deadline-controls"
          mkdir -p "$deadline_observations"
          deadline_status=0
          python3 -B -m unittest hia.platform.mempool_node.test_io_deadline -v > "$deadline_observations/stdout.raw" 2> "$deadline_observations/stderr.raw" || deadline_status=$?
          printf '%s\n' "$deadline_status" > "$deadline_observations/exit-code.txt"
          cat -- "$deadline_observations/stdout.raw"
          cat -- "$deadline_observations/stderr.raw" >&2
          exit "$deadline_status"
      - name: Build and run the complete smoke native partition
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.mempool_node.qualify --group smoke --output "$RUNNER_TEMP/hia-node-pool-smoke-native" 2>&1 | tee "$RUNNER_TEMP/hia-node-pool-smoke-observations/native.log"
      - name: Reject source, flat-image, emitter and whole-ELF mutations
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.mempool_node.test_integrity --scope build --build "$RUNNER_TEMP/hia-node-pool-smoke-native/build" --report "$RUNNER_TEMP/hia-node-pool-smoke-observations/build-controls.json" 2>&1 | tee "$RUNNER_TEMP/hia-node-pool-smoke-observations/build-controls.log"
      - name: Require all seven transport reader groups with no skips
        run: |
          set -euo pipefail
          python3 -B -m hia.tools.test_node_pool_ci --scope transport --kind smoke --smoke "$RUNNER_TEMP/hia-node-pool-smoke-native" --output "$RUNNER_TEMP/hia-node-pool-smoke-observations/ci-controls" 2>&1 | tee "$RUNNER_TEMP/hia-node-pool-smoke-observations/ci-controls.log"
      - name: Verify all source bytes after success or failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-node-pool-smoke-observations"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-node-pool-smoke-observations/source-after.json" 2>&1 | tee "$RUNNER_TEMP/hia-node-pool-smoke-observations/source-after.log"
      - name: Bind complete actual observations to this source and run
        run: |
          set -euo pipefail
          python3 -B -m hia.tools.qualify_node_pool_ci bind --kind smoke --observations "$RUNNER_TEMP/hia-node-pool-smoke-observations" --smoke "$RUNNER_TEMP/hia-node-pool-smoke-native" --report "$RUNNER_TEMP/hia-node-pool-smoke-observations/binding-receipt.json" 2>&1 | tee "$RUNNER_TEMP/hia-node-pool-smoke-observations/binding.log"
      - name: Preserve full regular evidence and special-file metadata
        if: always()
        env:
          STAGE_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-node-pool-smoke-observations" "$RUNNER_TEMP/hia-node-pool-smoke-artifact"
          roots=(--root "observations=$RUNNER_TEMP/hia-node-pool-smoke-observations")
          if test -d "$RUNNER_TEMP/hia-node-pool-smoke-native"; then roots+=(--root "native=$RUNNER_TEMP/hia-node-pool-smoke-native"); fi
          if test -d "$RUNNER_TEMP/hia-bootstrap"; then roots+=(--root "bootstrap=$RUNNER_TEMP/hia-bootstrap"); fi
          python3 -B -m hia.tools.qualify_node_pool_ci pack --kind smoke "${roots[@]}" --observations "$RUNNER_TEMP/hia-node-pool-smoke-observations" --output "$RUNNER_TEMP/hia-node-pool-smoke-artifact/artifact" --stage-status "$STAGE_STATUS" 2>&1 | tee "$RUNNER_TEMP/hia-node-pool-smoke-package.log"
      - name: Keep packaging diagnostics beside the sealed container
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-node-pool-smoke-artifact"
          if test -f "$RUNNER_TEMP/hia-node-pool-smoke-package.log"; then cp -- "$RUNNER_TEMP/hia-node-pool-smoke-package.log" "$RUNNER_TEMP/hia-node-pool-smoke-artifact/package.log"; fi
      - name: Upload complete success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-node-pool-smoke-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt
            }}
          path: ${{ runner.temp }}/hia-node-pool-smoke-artifact/
          if-no-files-found: error
          retention-days: 30
