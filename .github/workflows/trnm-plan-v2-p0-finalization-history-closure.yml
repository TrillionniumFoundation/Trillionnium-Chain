                  .query_row("PRAGMA journal_mode = WAL", [], |row| row.get::<_, String>(0))
                  .map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "finalization_history.journal_mode",
                      )
