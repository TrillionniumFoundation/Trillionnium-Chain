        let second = OperationBindingV0::derive(
            identity(),
            first.height + 1,
            0,
            digest(30),
            first.block_id,
            digest(31),
        );
        let receipt = coordinator
            .apply(AuthorityCommandV0::Begin {
                binding: second,
                ingress_digest: digest(32),
            })
            .unwrap();
        assert_eq!(receipt.binding, second);
        assert_eq!(receipt.durable_sequence, 8);
    }

