[package]
name = "trnm-sqlite-io-boundary"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[package.metadata.trnm]
module = "M15"
role = "experimental-owned-native-sqlite-io-boundary"
production_activation = false
consensus_authority = false

[dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "=1.2.59"
sha2 = "=0.10.9"
