name: native-consensus-ci-repair

on:
  push:
    branches:
      - chore/chain-native-consensus-only
    paths:
      - '.github/workflows/native-consensus-ci-repair.yml'
      - 'contracts/governance-guard/src/lib.rs'

permissions:
  contents: write

jobs:
  repair-stale-governance-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Align stale normalized audit expectation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('contracts/governance-guard/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        let normalized = gov.normalized_audit_log();
                  let pid_s = pid.to_string();
                  let event = normalized
                      .iter()
                      .find(|event| {
                          event.event_type == "governance.pause_restore_scheduled"
                              && event.object_id.as_deref() == Some(pid_s.as_str())
                      })
                      .unwrap();

                  assert_eq!(event.actor.as_deref(), Some("guardian"));
                  assert_eq!(event.related_id.as_deref(), Some("emergency_pause"));
                  assert_eq!(event.reason.as_deref(), Some("recover-schedule-note"));
                  assert_eq!(event.note.as_deref(), Some("eta=7140"));
          '''
          new = '''        let normalized = gov.normalized_audit_log();
                  let pid_s = pid.to_string();
                  let event = normalized
                      .iter()
                      .find(|event| {
                          event.event_type == "governance.pause_restore_scheduled"
                              && event.object_id.as_deref() == Some("emergency_pause")
                              && event.related_id.as_deref() == Some(pid_s.as_str())
                      })
                      .unwrap();

                  assert_eq!(event.actor.as_deref(), Some("guardian"));
                  assert_eq!(event.reason.as_deref(), Some("pause_restore_schedule"));
                  assert_eq!(
                      event.note.as_deref(),
                      Some("eta=7140, reason_hash=recover-schedule-note")
                  );
          '''
          if old not in text:
              raise SystemExit('stale governance test block was not found exactly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify focused contract test
        run: |
          set -euo pipefail
          cargo test --manifest-path contracts/Cargo.toml -p governance-guard --lib normalized_pause_restore_schedule_carries_reason_and_eta

      - name: Commit repair
        run: |
          set -euo pipefail
          git add contracts/governance-guard/src/lib.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(contracts): align pause restore audit test with canonical schema'
          git push origin HEAD:chore/chain-native-consensus-only
