[workspace]

[package]
name = "trnm-w1-v2-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "w1-verify-v2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
hex = "0.4"
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std", "disable-dev-mode"] }
serde_json = "1"
sha2 = "0.10"
trnm-w1-hardened-verifier = { path = "../w1_hardened_verifier" }
trnm-w1-zk-relation = { path = "../w1_zkvm/relation" }

[profile.release]
debug = 1
incremental = false
