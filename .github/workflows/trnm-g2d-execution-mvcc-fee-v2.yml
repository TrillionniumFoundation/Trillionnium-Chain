name: TRNM G2D replay v2 gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/trnm-g2d-execution-mvcc-fee-v2.yml"
      - "conformance/execution/**"
      - "docs/development/packages/TRNM_G2D_*"
      - "docs/evidence/g2b/G2B_AGENT_HANDOFF_V2.json"
      - "docs/evidence/g2d/**"
      - "docs/protocol/poco-ai-native-v1/execution/**"
      - "scripts/ci/check_g2d_source_binding_v2.sh"
      - "scripts/ci/check_mvcc_serial_equivalence_model_v1.sh"
      - "tools/mvcc-serial-model/**"
      - "trillionnium/crates/trnm-poco-mvcc-fee-v1/**"

permissions:
  contents: read

concurrency:
  group: trnm-g2d-replay-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  TRNM_CARGO_OFFLINE_POLICY: required

jobs:
  g2d-replay:
    name: Exact A12 binding, bounded parallel equivalence and fee conservation
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      ((github.actor == 'ProfAlexQI' && github.triggering_actor == 'ProfAlexQI') ||
       (github.actor == 'Tomasrgbsf' && github.triggering_actor == 'Tomasrgbsf') ||
       (github.actor == 'github-actions[bot]' &&
        github.triggering_actor == 'github-actions[bot]' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.author_association == 'MEMBER'))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trillionnium-chain
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source binding
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_g2d_source_binding_v2.sh
      - name: Verify Rust toolchain
        working-directory: trillionnium-chain
        run: ./scripts/ci/check_preprovisioned_rust_toolchain.sh --toolchain 1.95.0 --component clippy --component rustfmt
      - name: Verify Cargo offline cache
        id: cargo_offline_ready
        working-directory: trillionnium-chain
        run: ./scripts/ci/check_cargo_offline_ready.sh --toolchain 1.95.0 --state "$RUNNER_TEMP/trnm-g2d-v2-${GITHUB_JOB}" trillionnium/Cargo.toml:trillionnium/Cargo.lock
      - name: Verify G2D candidate
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_mvcc_serial_equivalence_model_v1.sh
      - name: Verify canonical truth boundaries
        working-directory: trillionnium-chain
        run: |
          bash ./scripts/ci/check_canonical_development_plan.sh
          bash ./scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          bash ./scripts/project-preflight.sh --audit
      - name: Verify offline inputs unchanged
        if: always() && steps.cargo_offline_ready.outcome == 'success'
        working-directory: trillionnium-chain
        run: ./scripts/ci/check_cargo_offline_unchanged.sh --state "$RUNNER_TEMP/trnm-g2d-v2-${GITHUB_JOB}"
