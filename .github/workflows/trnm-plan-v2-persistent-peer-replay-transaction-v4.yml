name: Trillionnium Plan v2 Persistent Replay Transaction v4

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/trnm-plan-v2-persistent-peer-replay-transaction-v4.yml
      - scripts/ci/trnm_plan_v2_persistent_peer_replay_once_v4.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trnm-plan-v2-persistent-peer-replay-once
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      ((github.actor == 'ProfAlexQI' || github.actor == 'Franksudoman' ||
      github.actor == 'ProfHepta') && github.triggering_actor == github.actor &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 240
    env:
      TARGET_BRANCH: work/plan-v2-full-gap-closure-20260902
      CARGO_NET_OFFLINE: "true"
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CI: "true"
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact qualification trigger with push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify runner-provisioned Rust toolchain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 \
            --component rustfmt \
            --component clippy

      - name: Qualify and atomically publish persistent replay closure
        run: |
          set -euo pipefail
          python3 -B scripts/ci/trnm_plan_v2_persistent_peer_replay_once_v4.py
