name: PoCO-only convergence R15 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-only-convergence-r15-once-20260910.yml

concurrency:
  group: poco-only-final-convergence
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r15-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"

jobs:
  converge:
    name: Deterministically publish or requalify native PoCO tree
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned qualification tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked

      - name: Deterministically repair and execute pre-product pipeline
        id: preproduct
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f tools/temporary_poco_convergence_r13.sh ]]; then
            echo "executed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > tools/temporary_poco_r13_postfix.py <<'PY'
          #!/usr/bin/env python3
          """One-shot post-transform corrections; removed before product commit."""
          from __future__ import annotations

          import pathlib
          import re

          ROOT = pathlib.Path(__file__).resolve().parents[1]


          def harden_raw_key_gate() -> None:
              path = ROOT / "trillionnium/crates/trnm-poco-node/tests/raw_key_boundary.rs"
              text = path.read_text(encoding="utf-8")
              pattern = re.compile(
                  r'''        if relative == "src/recovery_tests\.rs" \{\n.*?            continue;\n        \}\n''',
                  re.DOTALL,
              )
              replacement = '''        if relative == "src/recovery_tests.rs" {
                      let compact_lib: String = lib.chars().filter(|ch| !ch.is_whitespace()).collect();
                      assert!(
                          compact_lib.contains(
                              "#[cfg(all(test,feature=\\\"recovery-process-test-support\\\",target_os=\\\"linux\\\"))]modrecovery_tests;"
                          ),
                          "recovery raw-key module lost its test/fixture gate"
                      );
                      continue;
                  }
          '''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise RuntimeError("raw-key recovery assertion block drift")
              path.write_text(text, encoding="utf-8")


          def remove_unused_snapshot_codec_constant() -> None:
              path = ROOT / "trillionnium/crates/trnm-native-execution-v0/src/store.rs"
              text = path.read_text(encoding="utf-8")
              definition = "const AUTH_TREE_SNAPSHOT_CODEC_VERSION_V0: u16 = 1;\n"
              if text.count(definition) != 1:
                  raise RuntimeError("snapshot codec constant definition drift")
              path.write_text(text.replace(definition, "", 1), encoding="utf-8")


          def main() -> int:
              harden_raw_key_gate()
              remove_unused_snapshot_codec_constant()
              pathlib.Path(__file__).unlink()
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python3 - <<'PY'
          from pathlib import Path

          native = Path("tools/temporary_poco_native_convergence_r13.py")
          text = native.read_text(encoding="utf-8")
          write = '    tests_path.write_text(text, encoding="utf-8")\n'
          repair = (
              '    stripped = text.rstrip()\n'
              '    orphan = "#[test]"\n'
              '    if stripped.endswith(orphan):\n'
              '        text = stripped[: -len(orphan)].rstrip() + "\\n"\n'
          )
          if repair not in text:
              if text.count(write) != 1:
                  raise SystemExit("obsolete differential test write point drift")
              text = text.replace(write, repair + write, 1)
          native.write_text(text, encoding="utf-8")

          shell = Path("tools/temporary_poco_convergence_r13.sh")
          script = shell.read_text(encoding="utf-8")
          native_call = "python3 tools/temporary_poco_native_convergence_r13.py\n"
          postfix_call = "python3 tools/temporary_poco_r13_postfix.py\n"
          if postfix_call not in script:
              if script.count(native_call) != 1:
                  raise SystemExit("native-transform invocation drift")
              script = script.replace(native_call, native_call + postfix_call, 1)

          for workflow in (
              ".github/workflows/poco-only-convergence-r14-once-20260910.yml",
              ".github/workflows/poco-only-convergence-r15-once-20260910.yml",
          ):
              cleanup_line = f"  {workflow} \\\n"
              if cleanup_line in script:
                  continue
              anchor = "  .github/workflows/poco-only-convergence-r13-once-20260910.yml \\\n"
              if anchor not in script:
                  raise SystemExit("temporary workflow cleanup anchor drift")
              script = script.replace(anchor, anchor + cleanup_line, 1)
          shell.write_text(script, encoding="utf-8")
          PY

          python3 -m py_compile \
            tools/temporary_poco_native_convergence_r13.py \
            tools/temporary_poco_r13_postfix.py
          bash -n tools/temporary_poco_convergence_r13.sh
          CARGO_TARGET_DIR=/tmp/trnm-r15-target \
            bash tools/temporary_poco_convergence_r13.sh
          echo "executed=true" >> "$GITHUB_OUTPUT"

      - name: Materialize immutable audit-only candidate from product tree
        if: steps.preproduct.outputs.executed == 'false'
        id: product
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/poco-only-convergence-r14-once-20260910.yml \
            .github/workflows/poco-only-convergence-r15-once-20260910.yml
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "ci: remove completed native PoCO convergence controllers"
          FINAL_COMMIT="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
          rm -rf /tmp/trnm-r15-final
          git worktree add --detach /tmp/trnm-r15-final "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r15-final rev-parse HEAD)" = "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r15-final rev-parse 'HEAD^{tree}')" = "$FINAL_TREE"
          test -z "$(git -C /tmp/trnm-r15-final status --porcelain --untracked-files=all)"
          echo "commit=$FINAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$FINAL_TREE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$FINAL_COMMIT" >/tmp/trnm-r15-final-commit.txt
          printf '%s\n' "$FINAL_TREE" >/tmp/trnm-r15-final-tree.txt

      - name: Verify exact repository truth and fail-closed external boundary
        if: steps.preproduct.outputs.executed == 'false'
        working-directory: /tmp/trnm-r15-final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.product.outputs.commit }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ steps.product.outputs.tree }}"
          python3 -m compileall -q scripts tools formal conformance
          python3 scripts/ci/check_native_consensus_only.py | tee /tmp/trnm-r15-native-only.json
          bash scripts/ci/check_canonical_development_plan.sh
          bash scripts/ci/check_poco_bft_mainline_truth.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          python3 scripts/ci/test_external_evidence_v1.py
          set +e
          python3 scripts/ci/check_external_evidence_v1.py --require-all \
            --source-commit "${{ steps.product.outputs.commit }}" \
            --source-tree "${{ steps.product.outputs.tree }}" \
            --output /tmp/trnm-r15-external-evidence.json \
            >/tmp/trnm-r15-external-evidence.stdout \
            2>/tmp/trnm-r15-external-evidence.stderr
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q "external evidence gate remains open" /tmp/trnm-r15-external-evidence.stderr
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Compile every workspace and contract target
        if: steps.preproduct.outputs.executed == 'false'
        working-directory: /tmp/trnm-r15-final
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARGO_TARGET_DIR"
          cargo check --manifest-path trillionnium/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r15-workspace-check.log
          cargo check --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r15-contract-check.log

      - name: Execute complete workspace and contract corpus
        if: steps.preproduct.outputs.executed == 'false'
        working-directory: /tmp/trnm-r15-final
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 7200s \
            cargo test --manifest-path trillionnium/Cargo.toml \
              --workspace --all-targets --locked --offline --no-fail-fast -j 1 -- \
              --test-threads=1 \
            2>&1 | tee /tmp/trnm-r15-workspace-test.log
          cargo test --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r15-contract-test.log
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute strict production-boundary Clippy
        if: steps.preproduct.outputs.executed == 'false'
        working-directory: /tmp/trnm-r15-final
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 -- -D warnings \
            2>&1 | tee /tmp/trnm-r15-contract-clippy.log
          cd trillionnium
          : >/tmp/trnm-r15-boundary-clippy.log
          for package in \
            trnm-state trnm-consensus-types trnm-consensus-crypto \
            trnm-consensus-core trnm-consensus-safety-rules \
            trnm-consensus-safety-store trnm-consensus-signer-journal \
            trnm-native-application trnm-native-application-sqlite \
            trnm-native-execution-v0 trnm-durable-file-adapters-v0 \
            trnm-tx-lifecycle-v0 trnm-state-sync-v0 trnm-migration-v0 \
            trnm-control-plane-v0 trnm-release-bundle-v0 trnm-node-boundary-v0 \
            trnm-poco-node-production-v0 trnm-production-adapter-conformance-v0 \
            trnm-poco-node trnm-poco-node-authority trnm-poco-node-io \
            trnm-poco-node-host trnm-poco-node-cli
          do
            echo "strict-clippy package=${package}" | tee -a /tmp/trnm-r15-boundary-clippy.log
            cargo clippy -p "$package" --all-targets --locked --offline -j 1 -- -D warnings \
              2>&1 | tee -a /tmp/trnm-r15-boundary-clippy.log
          done
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish only the exact requalified product commit
        if: steps.preproduct.outputs.executed == 'false'
        working-directory: /tmp/trnm-r15-final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.product.outputs.commit }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ steps.product.outputs.tree }}"
          python3 scripts/ci/check_native_consensus_only.py | tee /tmp/trnm-r15-native-only-final.json
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE" push origin \
            "${{ steps.product.outputs.commit }}:refs/heads/$TARGET_BRANCH"

      - name: Upload exact failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r15-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/trnm-r13-final-commit.txt
            /tmp/trnm-r13-final-tree.txt
            /tmp/trnm-r13-vector-calibration.log
            /tmp/trnm-r13-native-only.json
            /tmp/trnm-r13-native-only-final.json
            /tmp/trnm-r13-external-evidence.json
            /tmp/trnm-r13-external-evidence.stdout
            /tmp/trnm-r13-external-evidence.stderr
            /tmp/trnm-r13-workspace-check.log
            /tmp/trnm-r13-contract-check.log
            /tmp/trnm-r13-native-execution-test.log
            /tmp/trnm-r13-raw-key-test.log
            /tmp/trnm-r13-workspace-test.log
            /tmp/trnm-r13-contract-test.log
            /tmp/trnm-r13-contract-clippy.log
            /tmp/trnm-r13-boundary-clippy.log
            /tmp/trnm-r15-final-commit.txt
            /tmp/trnm-r15-final-tree.txt
            /tmp/trnm-r15-native-only.json
            /tmp/trnm-r15-native-only-final.json
            /tmp/trnm-r15-external-evidence.json
            /tmp/trnm-r15-external-evidence.stdout
            /tmp/trnm-r15-external-evidence.stderr
            /tmp/trnm-r15-workspace-check.log
            /tmp/trnm-r15-contract-check.log
            /tmp/trnm-r15-workspace-test.log
            /tmp/trnm-r15-contract-test.log
            /tmp/trnm-r15-contract-clippy.log
            /tmp/trnm-r15-boundary-clippy.log
