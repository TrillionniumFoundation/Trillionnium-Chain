name: TRNM one-shot CodeQL evidence stability repair

on:
  push:
    branches:
      - automation/apply-codeql-evidence-stability-20260909

permissions:
  contents: write

concurrency:
  group: trnm-one-shot-codeql-evidence-stability-v1
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_BASE_SHA: 7ab9ce97a5bbc5cb4c7edca7d9d39dc016638d3b
      PATCH_PATH: .trnm/one-shot/codeql-evidence-stability.patch
      WORKFLOW_PATH: .github/workflows/trnm-one-shot-codeql-evidence-stability.yml
      TARGET_BRANCH: security/codeql-default-setup-v1-20260909
    steps:
      - name: Check out bounded staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact one-shot input surface
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/automation/apply-codeql-evidence-stability-20260909"
          test "$(git rev-parse origin/${TARGET_BRANCH})" = "d12a5ab584d86429c2963c75c6a5ac28f7165792"
          git merge-base --is-ancestor "${EXPECTED_BASE_SHA}" HEAD
          actual="$(git diff --name-only "${EXPECTED_BASE_SHA}"..HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n%s\n' "${WORKFLOW_PATH}" "${PATCH_PATH}" | LC_ALL=C sort)"
          test "${actual}" = "${expected}"
          git diff --quiet
          git diff --cached --quiet
          git apply --check "${PATCH_PATH}"

      - name: Apply repair and remove one-shot carriers
        shell: bash
        run: |
          set -euo pipefail
          git apply "${PATCH_PATH}"
          git rm "${PATCH_PATH}" "${WORKFLOW_PATH}"
          git diff --check
          grep -Fq 'required_check_inventory_snapshot' scripts/admin/apply_codeql_default_setup_v1.py
          grep -Fq 'acknowledge-settings-verification-freeze' scripts/admin/apply_codeql_default_setup_v1.py
          grep -Fq 'live default setup changed during evidence verification' scripts/admin/apply_codeql_default_setup_v1.py
          grep -Fq 'check inventory changed' scripts/ci/test_codeql_default_setup_v1.py

      - name: Run adversarial regression corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/admin/apply_codeql_default_setup_v1.py \
            scripts/ci/test_codeql_default_setup_v1.py
          python3 scripts/ci/test_codeql_default_setup_v1.py
          python3 scripts/admin/apply_codeql_default_setup_v1.py > /tmp/codeql-dry-run.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/codeql-dry-run.json', encoding='utf-8'))
          assert report['result'] == 'DRY_RUN_VALID'
          assert report['production_candidate'] is False
          assert report['release_ready'] is False
          PY

      - name: Publish bounded repair commit to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/admin/apply_codeql_default_setup_v1.py \
            scripts/ci/test_codeql_default_setup_v1.py \
            docs/runbooks/TRNM_CODEQL_DEFAULT_SETUP_V1.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'security(m17): stabilize CodeQL evidence read window' \
            -m 'Require an explicit settings-verification freeze and ticket, verify unchanged live setup generation, and compare complete required-check inventory snapshots before accepting evidence. The one-shot carriers delete themselves.' \
            -m 'Primary-Module: M17' \
            -m 'Production-Authority: false'
          git push origin "HEAD:${TARGET_BRANCH}"
