[package]
name = "trnm-poco-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
autobins = false
autotests = false
publish = false

[features]
default = []
node-event-wal = ["dep:libc"]
# Candidate-only node-owned transaction admission WAL.  This feature composes
# the durable nonce boundary but does not activate CheckTx, execution, or
# broadcast in the default node.
tx-admission-wal = [
  "dep:libc",
  "dep:trnm-mempool",
  "dep:trnm-application-tx-builder-v0",
]
# Raw consensus signing keys are available only to explicitly named fixture and
# process-test builds.  The default node/library build has no direct
# `ed25519-dalek` dependency edge and therefore cannot load or expose a
# `SigningKey`.
fixture-raw-key = ["dep:ed25519-dalek"]
lab-validator-runtime = ["dep:libc"]
lab-validator-runtime-test-support = [
  "lab-validator-runtime",
  "fixture-raw-key",
  "dep:serde_json",
  "dep:trnm-finality-types",
  "dep:trnm-protocol",
  "trnm-native-application-sqlite/test-support",
]
recovery-process-test-support = [
  "fixture-raw-key",
]
 # This is a composition-only seam for the bounded timeout host. It brings
 # the cross-process watermark and Unix signer clients into an explicitly
 # named feature; the default node build remains free of those runtime edges.
external-signer-runtime = [
  "dep:trnm-consensus-external-watermark",
  "dep:trnm-consensus-unix-remote-signer",
]
# Explicitly compiles only the proposal-purpose signer client composition.
# It is separate from the bounded timeout host and carries no Core/runtime
# activation or production credential path.
external-proposal-signer = [
  "dep:trnm-consensus-unix-remote-signer",
  "trnm-consensus-unix-remote-signer/proposal-purpose-client",
]
# Explicit composition-only SafetyRules semantic sidecar.  This feature does
# not wire the sidecar into Core or open any activation gate; it exists so a
# node owner can bind a pure SafetyRules transition to an independently
# administered semantic watermark in focused tests.
safety-rules-sidecar = ["dep:libc", "dep:trnm-consensus-safety-rules"]
g2-process-test-support = [
  "fixture-raw-key",
  "dep:tempfile",
]
# Candidate-only real-process vertical slice. The feature is intentionally
# explicit: it enables the bounded stdin host and deterministic fixture
# material, while all production/activation flags remain false.
g1-process-test-support = [
  "tx-admission-wal",
  "fixture-raw-key",
  "dep:hex",
  "dep:serde",
  "dep:serde_json",
  "dep:trnm-finality-types",
  "dep:trnm-protocol",
  "dep:trnm-consensus-safety-rules",
  "dep:trnm-consensus-peer-lease",
]

# The former App-aware recovery modules remain as non-buildable archive source.
# Keeping their cfg names known avoids warnings without restoring a feature or
# dependency edge into the active workspace.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
  'cfg(feature, values("legacy-consensus-app", "recovery-test-support"))',
] }

