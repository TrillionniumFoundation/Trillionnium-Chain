name: TRNM exact-source Rust CodeQL triage ded43a

on:
  push:
    branches:
      - evidence/codeql-triage-ded43a-20260909

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: trnm-codeql-triage-ded43a
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      SUBJECT_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
      SUBJECT_TREE: c0791ffb57e05fde43f87bfed1a3b4656c09efc0
      SOURCE_BRANCH: evidence/codeql-rust-exact-source-ded43a-v3-20260909
      SOURCE_WORKFLOW: TRNM exact-source Rust CodeQL evidence ded43a v3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${SUBJECT_TREE}"
          git diff --quiet
          git diff --cached --quiet

      - name: Wait for immutable CodeQL evidence artifact
        id: source
        shell: bash
        run: |
          set -euo pipefail
          deadline="$((SECONDS + 3600))"
          run_id=""
          while (( SECONDS < deadline )); do
            run_json="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs" \
                -f branch="${SOURCE_BRANCH}" \
                -f per_page=100 \
                --jq '.workflow_runs | map(select(.name == env.SOURCE_WORKFLOW)) | sort_by(.created_at,.id) | reverse | .[0] // {}'
            )"
            status="$(jq -r '.status // "missing"' <<<"${run_json}")"
            conclusion="$(jq -r '.conclusion // ""' <<<"${run_json}")"
            run_id="$(jq -r '.id // ""' <<<"${run_json}")"
            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" != "success" ]]; then
                echo "source CodeQL workflow ${run_id} ended ${conclusion}" >&2
                exit 20
              fi
              break
            fi
            sleep 60
          done
          test -n "${run_id}"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
          test "${status}" = completed
          test "${conclusion}" = success
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download exact-source CodeQL artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/codeql-source"
          gh run download "${{ steps.source.outputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/codeql-source"
          find "${RUNNER_TEMP}/codeql-source" -type f -print

      - name: Verify and classify every finding
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/codeql-triage"
          mkdir -p "${out}"
          export TRIAGE_OUT="${out}"
          export CODEQL_SOURCE_ROOT="${RUNNER_TEMP}/codeql-source"
          export SOURCE_RUN_ID="${{ steps.source.outputs.run_id }}"
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          import pathlib
          import re

          repository_root = pathlib.Path.cwd().resolve()
          artifact_root = pathlib.Path(os.environ["CODEQL_SOURCE_ROOT"])
          out = pathlib.Path(os.environ["TRIAGE_OUT"])
          reports = list(artifact_root.rglob("report.json"))
          findings_files = list(artifact_root.rglob("findings.json"))
          sums_files = list(artifact_root.rglob("SHA256SUMS"))
          if len(reports) != 1 or len(findings_files) != 1 or len(sums_files) != 1:
              raise SystemExit(
                  f"expected exactly one report/findings/SHA256SUMS; got {len(reports)}/{len(findings_files)}/{len(sums_files)}"
              )
          report = json.loads(reports[0].read_text(encoding="utf-8"))
          findings = json.loads(findings_files[0].read_text(encoding="utf-8"))
          if report.get("exact_source_sha") != os.environ["SUBJECT_SHA"]:
              raise SystemExit("CodeQL report source SHA mismatch")
          if report.get("exact_source_tree") != os.environ["SUBJECT_TREE"]:
              raise SystemExit("CodeQL report source tree mismatch")
          if report.get("workflow_run_id") != os.environ["SOURCE_RUN_ID"]:
              raise SystemExit("CodeQL report workflow-run mismatch")
          if report.get("result_count") != len(findings):
              raise SystemExit("CodeQL report/findings count mismatch")

          # Verify the producer's own SHA-256 inventory before consuming any finding.
          checksum_root = sums_files[0].parent.parent
          for raw_line in sums_files[0].read_text(encoding="utf-8").splitlines():
              if not raw_line.strip():
                  continue
              digest, rel = raw_line.split(None, 1)
              rel = rel.strip()
              if rel.startswith("*"):
                  rel = rel[1:]
              path = checksum_root / rel
              if not path.is_file():
                  raise SystemExit(f"inventoried CodeQL artifact missing: {rel}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"CodeQL artifact digest mismatch: {rel}")

          test_parts = {"tests", "test", "testing", "fuzz", "benches", "bench", "examples", "fixtures", "fixture", "vectors"}
          test_file_patterns = (
              re.compile(r"(^|_)tests?\.rs$"),
              re.compile(r"(^|_)fixture(s)?\.rs$"),
              re.compile(r"(^|_)vectors?\.rs$"),
          )

          def normalize_uri(uri):
              if not uri:
                  return None
              value = uri.replace("\\", "/")
              if value.startswith("file://"):
                  value = value[7:]
              markers = ("/Trillionnium-Chain/", "/trillionnium-chain/")
              for marker in markers:
                  if marker in value:
                      value = value.split(marker, 1)[1]
              value = value.lstrip("/")
              for prefix in ("trillionnium/", "contracts/", "scripts/", "formal/", "tools/", "web4-frontend/", "proto/", "docs/", "config/"):
                  pos = value.find(prefix)
                  if pos >= 0:
                      return value[pos:]
              return value

          def path_is_test(path):
              if not path:
                  return False
              parts = set(pathlib.PurePosixPath(path).parts)
              name = pathlib.PurePosixPath(path).name
              return bool(parts & test_parts) or any(pattern.search(name) for pattern in test_file_patterns)

          def line_is_cfg_test(path, line_number):
              if not path or not line_number:
                  return False
              source = repository_root / path
              if not source.is_file() or source.suffix != ".rs":
                  return False
              lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
              target = min(max(int(line_number), 1), len(lines)) - 1
              # Conservative lexical block tracker. It only grants test scope when a
              # #[cfg(test)] attribute is attached to a block that lexically encloses
              # the result line. Uncertain cases remain production/review-required.
              stack = []
              pending_test = False
              depth = 0
              in_block_comment = False
              for index, raw in enumerate(lines[: target + 1]):
                  stripped = raw.strip()
                  if stripped.startswith("#[cfg(test") or stripped.startswith("#[cfg(any(test"):
                      pending_test = True
                  cleaned = []
                  i = 0
                  in_string = False
                  quote = ""
                  while i < len(raw):
                      if in_block_comment:
                          end = raw.find("*/", i)
                          if end < 0:
                              i = len(raw)
                              continue
                          in_block_comment = False
                          i = end + 2
                          continue
                      if not in_string and raw.startswith("/*", i):
                          in_block_comment = True
                          i += 2
                          continue
                      if not in_string and raw.startswith("//", i):
                          break
                      ch = raw[i]
                      if in_string:
                          if ch == "\\":
                              i += 2
                              continue
                          if ch == quote:
                              in_string = False
                          i += 1
                          continue
                      if ch in ('"', "'"):
                          in_string = True
                          quote = ch
                          i += 1
                          continue
                      cleaned.append(ch)
                      i += 1
                  code = "".join(cleaned)
                  for ch in code:
                      if ch == "{":
                          depth += 1
                          stack.append((depth, pending_test))
                          pending_test = False
                      elif ch == "}":
                          while stack and stack[-1][0] >= depth:
                              stack.pop()
                          depth = max(0, depth - 1)
                  if stripped and not stripped.startswith("#") and "{" not in code and pending_test:
                      # Attribute may precede a signature whose brace is on a later line.
                      pass
              return any(is_test for _, is_test in stack)

          normalized = []
          category_counts = collections.Counter()
          rule_counts = collections.Counter()
          production_required = []
          unresolved_location = []
          for index, finding in enumerate(findings):
              locations = finding.get("locations") or []
              location_records = []
              categories = []
              for loc in locations:
                  path = normalize_uri(loc.get("uri"))
                  line = loc.get("start_line")
                  test_scope = path_is_test(path) or line_is_cfg_test(path, line)
                  location_records.append({**loc, "normalized_path": path, "test_scope": test_scope})
                  categories.append("test" if test_scope else "production")
              if not locations:
                  category = "unresolved-location"
              elif categories and all(value == "test" for value in categories):
                  category = "test-only"
              elif any(value == "production" for value in categories):
                  category = "production-review-required"
              else:
                  category = "unresolved-location"
              record = {
                  **finding,
                  "index": index,
                  "triage_category": category,
                  "locations": location_records,
              }
              normalized.append(record)
              category_counts[category] += 1
              rule_counts[finding.get("rule_id") or "<missing>"] += 1
              if category == "production-review-required":
                  production_required.append(record)
              elif category == "unresolved-location":
                  unresolved_location.append(record)

          triage = {
              "schema": "trnm-rust-codeql-triage-v1",
              "source_sha": os.environ["SUBJECT_SHA"],
              "source_tree": os.environ["SUBJECT_TREE"],
              "source_workflow_run": os.environ["SOURCE_RUN_ID"],
              "complete_result_count": len(normalized),
              "category_counts": dict(sorted(category_counts.items())),
              "rule_counts": dict(sorted(rule_counts.items())),
              "production_review_required_count": len(production_required),
              "unresolved_location_count": len(unresolved_location),
              "findings": normalized,
              "automatic_dismissal_performed": False,
              "independent_specialist_acceptance": False,
              "production_candidate": False,
              "release_ready": False,
          }
          (out / "triage.json").write_text(json.dumps(triage, indent=2, sort_keys=True) + "\n")
          (out / "production-review-required.json").write_text(
              json.dumps(production_required, indent=2, sort_keys=True) + "\n"
          )
          (out / "unresolved-location.json").write_text(
              json.dumps(unresolved_location, indent=2, sort_keys=True) + "\n"
          )

          lines = [
              "<!-- trnm-codeql-triage-ded43a -->",
              "## Complete exact-source Rust CodeQL triage",
              "",
              f"- source: `{os.environ['SUBJECT_SHA']}`",
              f"- tree: `{os.environ['SUBJECT_TREE']}`",
              f"- producer workflow run: `{os.environ['SOURCE_RUN_ID']}`",
              f"- complete findings: **{len(normalized)}**",
              f"- test-only: **{category_counts.get('test-only', 0)}**",
              f"- production review required: **{len(production_required)}**",
              f"- unresolved location: **{len(unresolved_location)}**",
              "",
              "Top rules:",
          ]
          lines.extend(f"- `{rule}`: {count}" for rule, count in rule_counts.most_common(15))
          if production_required:
              lines += ["", "Production-path findings requiring specialist disposition:"]
              for item in production_required[:80]:
                  loc = (item.get("locations") or [{}])[0]
                  path = loc.get("normalized_path") or "<missing>"
                  line = loc.get("start_line") or "?"
                  lines.append(f"- `{item.get('rule_id')}` — `{path}:{line}`")
              if len(production_required) > 80:
                  lines.append(f"- … {len(production_required) - 80} additional findings retained in the artifact")
          if unresolved_location:
              lines += ["", f"Unresolved-location findings: **{len(unresolved_location)}**; retained and blocking."]
          lines += [
              "",
              "No finding was dismissed or suppressed. Test-only classification is path/lexical-scope evidence, not independent security acceptance.",
              "The complete normalized inventory and source locations are retained in the artifact.",
          ]
          (out / "summary.md").write_text("\n".join(lines) + "\n")
          with (out / "gate.env").open("w") as handle:
              handle.write(f"PRODUCTION_REQUIRED={len(production_required)}\n")
              handle.write(f"UNRESOLVED_LOCATION={len(unresolved_location)}\n")
          PY
          (
            cd "${out}"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          source "${out}/gate.env"
          echo "production_required=${PRODUCTION_REQUIRED}" >> "${GITHUB_OUTPUT}"
          echo "unresolved_location=${UNRESOLVED_LOCATION}" >> "${GITHUB_OUTPUT}"

      - name: Upload complete triage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-codeql-triage-ded43a-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-triage/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish triage summary
        if: always() && steps.classify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/codeql-triage/summary.md"
          for issue in 88 101; do
            jq -n --rawfile body "${body}" '{body:$body}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" --input -
          done

      - name: Fail closed on production or unresolved findings
        if: always() && steps.classify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.classify.outputs.production_required }}" = "0"
          test "${{ steps.classify.outputs.unresolved_location }}" = "0"

      - name: Verify no candidate-source mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${SUBJECT_TREE}"
          git diff --quiet
          git diff --cached --quiet
