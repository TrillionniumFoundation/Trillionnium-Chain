name: PoN boundary source readback 20261008
on:
  push:
    branches: [fix/pon-architecture-boundaries-20261008]
    paths: [.github/workflows/pon-boundary-source-readback-20261008.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8275093f2c8672234b94494c32fdc8652ced83e8
          fetch-depth: 1
          persist-credentials: false
      - name: Preflight and exact tracked source only
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/project-preflight.sh --audit
          mkdir -p "$RUNNER_TEMP/pon-boundary-readback"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pon-boundary-readback/identity.txt"
          git ls-tree -r -l HEAD > "$RUNNER_TEMP/pon-boundary-readback/tree.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/pon-boundary-readback/source.tar.gz" HEAD trillionnium formal scripts config docs .github AGENTS.md PROJECT_ID PROJECT_BOUNDARY.json rust-toolchain.toml
          sha256sum "$RUNNER_TEMP/pon-boundary-readback/source.tar.gz" > "$RUNNER_TEMP/pon-boundary-readback/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pon-boundary-source-8275093f
          path: ${{ runner.temp }}/pon-boundary-readback
          retention-days: 7
          if-no-files-found: error
