name: PoN recent batch exact-source acceptance
on:
  pull_request:
    paths:
      - trillionnium/crates/trnm-pon-node/src/store.rs
      - trillionnium/crates/trnm-pon-node/src/ingress.rs
      - trillionnium/crates/trnm-pon-node/src/host_kernel_parent.rs
      - trillionnium/crates/trnm-pon-node/src/main.rs
      - trillionnium/crates/trnm-pon-node/src/operator_continuous_controller.rs
      - trillionnium/crates/trnm-pon-node/src/operator_continuous_controller/**
      - trillionnium/crates/trnm-pon-node/src/store/operator_continuous_owner.rs
      - trillionnium/crates/trnm-pon-node/src/store/operator_continuous_owner/**
      - scripts/ci/history_native_process_guard.py
      - scripts/ci/history_effect_v6_process_guard.py
      - scripts/ci/test_history_effect_v6_guard.py
      - trillionnium/crates/trnm-pon-node/src/store/history_effect_v6.rs
      - trillionnium/crates/trnm-pon-node/src/store/history_effect_v6/**
      - trillionnium/crates/trnm-pon-node/src/store/history_page.rs
      - trillionnium/crates/trnm-pon-node/src/native_account_query_tests.rs
      - trillionnium/crates/trnm-pon-node/src/native_authenticated_tests.rs
      - trillionnium/crates/trnm-pon-node/src/store/native_authenticated.rs
      - trillionnium/crates/trnm-pon-node/src/store/native_authenticated/history_arithmetic.rs
      - trillionnium/crates/trnm-pon-node/src/store/native_authenticated/history_arithmetic/tests.rs
      - trillionnium/crates/trnm-pon-node/src/store/native_authenticated/arithmetic_cache.rs
      - trillionnium/crates/trnm-pon-node/src/store/native_authenticated/arithmetic_cache/root_arithmetic.rs
      - trillionnium/crates/trnm-pon-node/src/store/native_authenticated/arithmetic_cache/root_arithmetic/tests.rs
      - trillionnium/crates/trnm-pon-node/src/account_archive_execution/state_witness.rs
      - trillionnium/crates/trnm-pon-node/tests/public_v3_multiprocess.rs
      - trillionnium/crates/trnm-pon-node/src/store/native_fixed_blob_tests.rs
      - trillionnium/crates/trnm-pon-node/tests/authenticated_storage_cli.rs
      - trillionnium/crates/trnm-pon-node/examples/continuous_pipeline.rs
      - trillionnium/crates/trnm-pon-node/tests/public_v3_service_campaign.rs
      - formal/pon-nakamoto-v1/work_query_bound.py
      - formal/pon-nakamoto-v1/test_work_query_bound.py
      - scripts/ci/read_native_cache_observation.py
      - scripts/ci/test_read_native_cache_observation.py
      - .github/workflows/pon-recent-batch-acceptance.yml
permissions:
  contents: read
jobs:
  recent:
    name: recent batch (${{ matrix.runner }}, ${{ matrix.source }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        source: [head, prospective-merge]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
      EXPECTED_MERGE: ${{ github.sha }}
      SOURCE_KIND: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.source == 'head' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source, ordered actual main merge and full repository boundary
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/recent-exact"
          mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "TRNM_RETAINED_DELTA_COST_PATH=$out/retained-delta-cost.jsonl" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target-recent-exact" >> "$GITHUB_ENV"
          args=(--kind "$SOURCE_KIND" --expected-head "$EXPECTED_HEAD")
          if test "$SOURCE_KIND" = prospective-merge; then
            args+=(--expected-base "$EXPECTED_BASE" --expected-merge "$EXPECTED_MERGE")
          fi
          python3 scripts/ci/verify_ci_source.py "${args[@]}" --output "$out/source.json"
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/store.rs)" = 065f56331c0309685634b6caf01fe09d2bf6988b
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/store/history_page.rs)" = c8569bd62a9c374b03a8ffc0ad02c64b0365eee4
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/native_authenticated_tests.rs)" = 9020f1c5cedde41c03e6cd414f7f3c134b9fa7a4
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/store/native_authenticated.rs)" = b22fb87ded214674d81f134865c5dfa874d86b07
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/store/native_fixed_blob_tests.rs)" = cfa8dc696e160361da53fc14091d48a3b891cb90
          test "$(git hash-object trillionnium/crates/trnm-pon-node/tests/authenticated_storage_cli.rs)" = 7301aeb3033913f080b23767bfca52a2bf76d45b
          test "$(git hash-object formal/pon-nakamoto-v1/work_query_bound.py)" = 2d568879899da290c7bec8add6eb2746554897d6
          test "$(git hash-object formal/pon-nakamoto-v1/test_work_query_bound.py)" = 2161dd7d25b605b9e67f05bee5aa20038cf4469d
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/native_account_query_tests.rs)" = c8567475a36cf449d9fd2b33363a545fbd4704ab
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/store/native_authenticated/arithmetic_cache.rs)" = f58fc4522c6f21bd9591a454cd21f5e9010f7cce
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/store/native_authenticated/arithmetic_cache/root_arithmetic.rs)" = 0ee21dfd707456783d10876adf791bbf48ccd7ed
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/store/native_authenticated/arithmetic_cache/root_arithmetic/tests.rs)" = 04e70ffd8f227b622d1e1f13ce7398f8d4146b01
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/account_archive_execution/state_witness.rs)" = 0b27b9fce9d77fed63f351c8a8e33b02a856ace1
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/store/native_authenticated/history_arithmetic.rs)" = 4ab2d3dcc08314da77066ca1941faedd15f938c9
          test "$(git hash-object trillionnium/crates/trnm-pon-node/src/store/native_authenticated/history_arithmetic/tests.rs)" = 13ecdb3e45ef78e5abcc34f4bf30af0312dd2f11
          test "$(git hash-object trillionnium/crates/trnm-pon-node/tests/public_v3_multiprocess.rs)" = 4e098e7a078dc269780c213eab7c84cab7f08482
          bash scripts/project-preflight.sh --audit
      - name: Execute conditional query accounting and anytime-bound counterexamples
        shell: bash
        run: |
          set -euo pipefail
          python3 formal/pon-nakamoto-v1/test_work_query_bound.py -v 2>&1 | tee "$OUT/query-bound.log"
          grep -E '^Ran 14 tests in ' "$OUT/query-bound.log"
          grep -x 'OK' "$OUT/query-bound.log"
      - name: Reject incomplete, ambiguous or incorrectly bound cache observations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p test_read_native_cache_observation.py -v 2>&1 | tee "$OUT/cache-receipt-tests.log"
          grep -E '^Ran 34 tests in ' "$OUT/cache-receipt-tests.log"
          grep -x 'OK' "$OUT/cache-receipt-tests.log"
      - name: Require explicit graph-resource reader and privileged directory-race controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p test_history_graph_resource_native_v1.py -v 2>&1 | tee "$OUT/graph-physical-reader.log"
          grep -E '^Ran 8 tests in ' "$OUT/graph-physical-reader.log"
          grep -x OK "$OUT/graph-physical-reader.log"
          python3 -m unittest discover -s scripts/ci -p test_native_history_verifier.py -v 2>&1 | tee "$OUT/graph-history-reader.log"
          grep -E '^Ran 5 tests in ' "$OUT/graph-history-reader.log"
          grep -x OK "$OUT/graph-history-reader.log"
      - name: Install original pinned native compiler and lint tools
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check committed formatting without rewriting source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path trillionnium/Cargo.toml --all -- --check 2>&1 | tee "$OUT/format.log"
      - name: Require fresh kernel reads and all original host boundary controls
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib host_kernel_parent::kernel_parent:: -- --show-output --test-threads=1 2>&1 | tee "$OUT/host-kernel-current-reads.log"
          grep -E '^test result: ok\. 19 passed; 0 failed; 1 ignored;' "$OUT/host-kernel-current-reads.log"
          for selector in \
            host_kernel_parent::kernel_parent::fresh_read_tests::exact_limit_requires_real_eof_and_overlimit_read_stays_bounded \
            host_kernel_parent::kernel_parent::fresh_read_tests::short_reads_and_interruption_preserve_unbounded_original_text \
            host_kernel_parent::kernel_parent::fresh_read_tests::invalid_utf8_and_io_errors_never_become_a_successful_prefix \
            host_kernel_parent::kernel_parent::fresh_read_tests::bounded_stack_text_preserves_original_read_frontier_and_errors \
            host_kernel_parent::kernel_parent::fresh_read_tests::stack_quota_reads_preserve_fresh_paths_and_read_before_parse_errors \
            host_kernel_parent::kernel_parent::fresh_read_tests::allocation_free_limit_tokens_keep_original_grammar \
            host_kernel_parent::kernel_parent::fresh_read_tests::every_call_reopens_replaced_removed_and_permission_changed_paths \
            host_kernel_parent::kernel_parent::fresh_read_tests::actual_native_thread_and_boot_reads_match_original_current_paths \
            host_kernel_parent::kernel_parent::tests::kernel_resource_counters_require_complete_bounded_real_format \
            host_kernel_parent::kernel_parent::tests::read_kernel_membership_from_current_os_thread_not_process_leader \
            host_kernel_parent::kernel_parent::tests::real_linux_cgroup_v2_cpu_stat_is_parsed_without_claiming_a_quota \
            host_kernel_parent::kernel_parent::tests::two_aggregate_samples_never_accept_cpu_counter_rewind_or_mem_task_delta \
            host_kernel_parent::kernel_parent::tests::shipped_systemd_slice_is_the_one_fixed_finite_kernel_parent \
            host_kernel_parent::kernel_parent::tests::fixed_parent_constant_is_exactly_the_canonical_directory_and_name \
            host_kernel_parent::kernel_parent::tests::no_public_nonloopback_without_root_owned_kernel_parent \
            host_kernel_parent::kernel_parent::tests::finite_cpu_memory_process_limits_and_burst_required \
            host_kernel_parent::kernel_parent::tests::canonical_systemd_slice_name_maps_to_the_actual_root_cgroup \
            host_kernel_parent::kernel_parent::tests::exactly_one_fixed_system_parent_name_is_eligible \
            host_kernel_parent::kernel_parent::tests::fake_root_or_wrong_parent_never_counts_as_root_kernel_budget; do
            test "$(grep -Fxc "test $selector ... ok" "$OUT/host-kernel-current-reads.log")" = 1
          done
          test "$(grep -Fxc "test host_kernel_parent::kernel_parent::fresh_read_tests::actual_kernel_quota_read_cost_preserves_all_fresh_reads ... ignored, explicit real-kernel file-read cost observation; not fixed-parent qualification" "$OUT/host-kernel-current-reads.log")" = 1
          test "$(grep -c '^test host_kernel_parent::kernel_parent::' "$OUT/host-kernel-current-reads.log")" = 20
      - name: Require bounded ordinary record copies and complete history controls
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib store::fixed_blob_read_tests:: -- --show-output --test-threads=1 2>&1 | tee "$OUT/fixed-read-suite.log"
          grep -E '^test result: ok\. 4 passed; 0 failed; 0 ignored;' "$OUT/fixed-read-suite.log"
          cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib store::history_page:: -- --show-output --test-threads=1 2>&1 | tee "$OUT/history-read-suite.log"
          grep -E '^test result: ok\. 4 passed; 0 failed; 2 ignored;' "$OUT/history-read-suite.log"
          for selector in store::fixed_blob_read_tests::fixed_blob_copy_preserves_null_types_and_exact_boundaries store::fixed_blob_read_tests::fixed_header_projection_bounds_all_six_fields_without_type_coercion store::fixed_blob_read_tests::fixed_record_rereads_original_errors_and_restores_both_native_backends store::fixed_blob_read_tests::fixed_context_and_active_tip_reject_oversize_prefix_aliases store::history_page::bounded_record_tests::history_record_copy_bounds_keep_original_conversion_and_shape_order; do
            log_file="$OUT/${selector//:/__}.log"
            printf '%s\t%s\n' "${log_file##*/}" "$selector" >> "$OUT/log-paths.tsv"
            cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib "$selector" -- --exact --show-output --test-threads=1 2>&1 | tee "$log_file"
            python3 scripts/ci/check_required_native_test.py "$log_file" --test "$selector"
          done
      - name: Require authorized durable History, real cancellation and actual process crash recovery
        shell: bash
        run: |
          set -euo pipefail
          for test in signed_history_single_successor_runs_two_children_and_cold_reopen_preserves_once_only_settlement signed_history_actual_child_cancellation_joins_settles_reopens_and_needs_new_signed_claim signed_history_actual_child_panic_joins_and_retains_known_original_cpu_receipt signed_history_internal_activation_cancel_retains_admission_and_requires_fresh_view_for_retry signed_history_refuses_unselected_or_malformed_input_without_free_decode_or_generic_fallback signed_history_rejects_unsigned_view_unbounded_workers_and_signed_packet_outside_budget_nonce_window signed_history_actual_sigkill_known_prefix_settles_once_and_new_process_resumes_exact_successor; do
            selector="store::operator_continuous_owner::history_import::tests::$test"
            TRNM_HISTORY_NATIVE_ARTIFACT_DIR="$OUT/history-native-process/$test" cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib "$selector" -- --exact --show-output --test-threads=1 2>&1 | tee "$OUT/$test.log"
            python3 scripts/ci/check_required_native_test.py "$OUT/$test.log" --test "$selector"
          done
      - name: Require stopped owned-process observation without fabricating missing descendants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_history_effect_v6_guard.py -v 2>&1 | tee "$OUT/history-v6-observer.log"
          grep -E '^Ran 4 tests in ' "$OUT/history-v6-observer.log"
          grep -x 'OK' "$OUT/history-v6-observer.log"
      - name: Require V6 prepaid effects, actual unknown-window crash recovery and validation facts
        shell: bash
        run: |
          set -euo pipefail
          for test in v6_actual_two_worker_cancel_retry_close_and_cold_reopen_keep_predebits v6_late_journal_lock_failure_keeps_actual_native_and_original_cpu v6_unmarked_existing_bad_product_is_not_validated_by_sql_syntax v6_unsigned_worker_host_and_delegated_nonce_refuse_without_new_authority v6_actual_sigkill_during_registered_worker_recovers_with_fresh_claims v6_actual_sigkill_after_activation_commit_recovers_and_advances_again; do
            selector="store::history_effect_v6::tests::$test"
            TRNM_HISTORY_V6_ARTIFACT_DIR="$OUT/history-v6-process/$test" cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib "$selector" -- --exact --show-output --test-threads=1 2>&1 | tee "$OUT/$test.log"
            python3 scripts/ci/check_required_native_test.py "$OUT/$test.log" --test "$selector"
          done
      - name: Execute complete original error-boundary suite and all new controls
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib store::error_boundary_tests:: -- --show-output --test-threads=1 2>&1 | tee "$OUT/error-boundary.log"
          grep -E '^test result: ok\. 13 passed; 0 failed; 0 ignored;' "$OUT/error-boundary.log"
          for test in recent_batch_exact_window_and_complete_call_observation recent_batch_retained_corruption_and_read_boundary_match_original recent_batch_branch_reopen_and_callback_errors_preserve_context; do
            selector="store::error_boundary_tests::$test"
            cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib "$selector" -- --exact --show-output --test-threads=1 2>&1 | tee "$OUT/$test.log"
            python3 scripts/ci/check_required_native_test.py "$OUT/$test.log" --test "$selector"
          done
      - name: Execute all original authenticated owner controls and five snapshot regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib store::native_authenticated_tests:: -- --show-output --test-threads=1 2>&1 | tee "$OUT/native-snapshots.log"
          test "$(grep -Ec '^test result: ok\. 22 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$OUT/native-snapshots.log")" = 1
          for selector in \
            store::native_authenticated_tests::native_authenticated_signed_growth_branches_reopen_and_compact_queries \
            store::native_authenticated_tests::native_authenticated_namespaces_missing_nodes_and_corrupt_records_fail_closed \
            store::native_authenticated_tests::native_arithmetic_warm_cache_still_reads_external_tampering_and_matches_cold_errors \
            store::native_authenticated_tests::native_reorg_final_root_reads_current_sql_after_last_step \
            store::native_authenticated_tests::native_reorg_final_root_keeps_pq2_pq3_profile_validation \
            store::native_authenticated_tests::native_commit_admission_suppression_rolls_back_all_rows_in_both_backends \
            store::native_authenticated_tests::native_commit_final_event_triggers_cannot_publish_bad_state_or_rewind_pointer \
            store::native_authenticated_tests::native_authenticated_final_write_checks_parent_and_required_nodes \
            store::native_authenticated_tests::native_authenticated_cancellation_rolls_back_all_persistent_components \
            store::native_authenticated_tests::native_authenticated_abort_child_before_commit \
            store::native_authenticated_tests::native_authenticated_process_exit_before_commit_cold_recovers_without_destructors \
            store::native_authenticated_tests::native_authenticated_signed_qualified_output_is_in_final_commitment \
            store::native_authenticated_tests::native_successor_material_avoids_cold_readback_but_checks_all_actual_state \
            store::native_authenticated_tests::native_inactive_page_parents_use_checked_material_without_early_activation \
            store::native_authenticated_tests::native_inactive_parent_material_keeps_fresh_sql_state_and_cancellation_checks \
            store::native_authenticated_tests::controlled_parent_reconstruction_preserves_cancellation_and_complete_retry \
            store::native_authenticated_tests::controlled_final_readback_cancels_inside_transaction_without_corruption_or_partial_rows \
            store::native_authenticated_tests::native_dense_snapshots_retain_64_and_reconstruct_pruned_history \
            store::native_authenticated_tests::native_dense_snapshot_insert_corruption_and_delta_omission_roll_back \
            store::native_authenticated_tests::native_dense_snapshot_pruning_suppression_preserves_atomic_limit \
            store::native_authenticated_tests::native_dense_snapshot_cannot_hide_old_delta_damage_from_admission \
            store::native_authenticated_tests::native_dense_snapshot_readback_cost_keeps_full_state_and_unaccelerated_reference; do
            test "$(grep -Fxc "test $selector ... ok" "$OUT/native-snapshots.log")" = 1
          done
          test "$(grep -c '^test store::native_authenticated_tests::' "$OUT/native-snapshots.log")" = 22
          for test in native_dense_snapshots_retain_64_and_reconstruct_pruned_history native_dense_snapshot_insert_corruption_and_delta_omission_roll_back native_dense_snapshot_pruning_suppression_preserves_atomic_limit native_dense_snapshot_cannot_hide_old_delta_damage_from_admission native_dense_snapshot_readback_cost_keeps_full_state_and_unaccelerated_reference native_inactive_page_parents_use_checked_material_without_early_activation native_inactive_parent_material_keeps_fresh_sql_state_and_cancellation_checks; do
            selector="store::native_authenticated_tests::$test"
            cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib "$selector" -- --exact --show-output --test-threads=1 2>&1 | tee "$OUT/$test.log"
            python3 scripts/ci/check_required_native_test.py "$OUT/$test.log" --test "$selector"
          done
      - name: Retain authenticated record, ancestry and cold recovery coverage
        shell: bash
        run: |
          set -euo pipefail
          for suite in store::native_authenticated:: store::native_ancestry_commit_tests::; do
            name="${suite//:/_}"
            options=()
            if test "$suite" = store::native_authenticated::; then
              options+=(--include-ignored)
            fi
            cargo +1.95.0 test --release --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib "$suite" -- "${options[@]}" --show-output --test-threads=1 2>&1 | tee "$OUT/$name.log"
            grep -E '^test result: ok\. [1-9][0-9]* passed; 0 failed;' "$OUT/$name.log"
            if test "$suite" = store::native_authenticated::; then
              test "$(grep -Ec '^test result: ok\. 60 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$OUT/$name.log")" = 1
              for selector in \
                store::native_authenticated::arithmetic_cache::root_arithmetic::tests::complete_commitment_keeps_account_error_order_with_root_material \
                store::native_authenticated::arithmetic_cache::root_arithmetic::tests::opaque_tree_preserves_original_canonical_and_limit_errors \
                store::native_authenticated::arithmetic_cache::root_arithmetic::tests::opaque_tree_recomputes_actual_additions_removals_values_and_namespace \
                store::native_authenticated::arithmetic_cache::root_arithmetic::tests::opaque_tree_retention_caps_payload_charge_and_preserves_cold_borrow_behavior \
                store::native_authenticated::arithmetic_cache::tests::arithmetic_cache_binds_exact_complete_bytes_context_and_has_fixed_retention \
                store::native_authenticated::arithmetic_cache::tests::arithmetic_cache_preserves_exact_numeric_encoding_and_invalid_input_errors \
                store::native_authenticated::arithmetic_cache::tests::complete_hits_keep_a_hot_non_genesis_slot_within_three_entries \
                store::native_authenticated::arithmetic_cache::tests::exact_hit_under_shared_borrow_keeps_original_arithmetic_without_retention_change \
                store::native_authenticated::arithmetic_cache::tests::full_root_reuse_compares_actual_bytes_and_keeps_original_error_order \
                store::native_authenticated::arithmetic_cache::tests::initial_root_survives_unactivated_branch_roots_without_whole_tree_churn \
                store::native_authenticated::arithmetic_cache::tests::pq_account_roots_keep_original_validation_on_cold_and_warm_cache \
                store::native_authenticated::arithmetic_cache::tests::root_hits_keep_a_hot_non_genesis_slot_within_three_complete_entries \
                store::native_authenticated::arithmetic_cache::tests::separate_root_arithmetic_entry_survives_complete_eviction_and_is_bounded \
