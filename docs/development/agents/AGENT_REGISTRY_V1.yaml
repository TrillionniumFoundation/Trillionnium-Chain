  scope: docs/CI/release metadata
  depends_on: [A00]
  recommended_trigger: daily and on candidate branch updates
  owned_surfaces:
  - docs/development/CURRENT_SNAPSHOT_V1.json
  - docs/schemas/current-snapshot-v1.schema.json
  - scripts/ci/generate_current_snapshot_v1.*
  - scripts/ci/check_current_snapshot_v1.*
  - docs/development/plan-manifest-v1.toml through a separate truth-only PR
  - SBOM/provenance schemas and indexes
  forbidden_surfaces:
  - consensus or state-transition semantics
  - truth promotion without accepted evidence
  - mixing source implementation and truth updates in one PR
  prompt_document: docs/development/agents/AGENT_PROMPT_PACK_V1.md
  prompt_anchor: A01
