name: full-gap-closure-finality-hardening

on:
  push:
    branches:
      - work/full-gap-closure-20260831
    paths:
      - .github/workflows/full-gap-closure-finality-hardening.yml

permissions:
  contents: write

concurrency:
  group: full-gap-closure-finality-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/full-gap-closure-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact closure branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/full-gap-closure-20260831
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-shot lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "68a35c3ed0c725347a5ac440be695762c8e36a33"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = ".github/workflows/full-gap-closure-finality-hardening.yml"

      - name: Apply reviewed strict-proof patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/finality-hardening.diff.gz.b64" <<'PATCH'
          
          PATCH
          base64 --decode "${RUNNER_TEMP}/finality-hardening.diff.gz.b64" \
            | gzip --decompress > "${RUNNER_TEMP}/finality-hardening.diff"
          test "$(sha256sum "${RUNNER_TEMP}/finality-hardening.diff" | cut -d' ' -f1)" = "1b54125434d330f34165dd3c15621db58efeae9d42a5ea93aa8caa34b01f7968"
          git apply --check "${RUNNER_TEMP}/finality-hardening.diff"
          git apply "${RUNNER_TEMP}/finality-hardening.diff"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0

      - name: Format, compile and lint strict proof paths
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 \
            trillionnium/crates/trnm-finality-verifier/src/lib.rs \
            trillionnium/crates/trnm-node/src/live/merkle.rs
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml \
            -p trnm-finality-verifier --all-targets --locked -- -D warnings

      - name: Run finality and legacy producer regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-finality-types -p trnm-finality-verifier --all-targets --locked
          cargo test --manifest-path trillionnium/crates/trnm-node/Cargo.toml \
            --lib live::merkle --locked

      - name: Revalidate repository truth and exact diff
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          bash scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          git diff --check
          test "$(git diff --name-only | sort)" = $'trillionnium/crates/trnm-finality-verifier/src/lib.rs\ntrillionnium/crates/trnm-node/src/live/merkle.rs'

      - name: Publish exact tested source-only commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/full-gap-closure-bootstrap.yml
          git rm .github/workflows/full-gap-closure-finality-hardening.yml
          git add trillionnium/crates/trnm-finality-verifier/src/lib.rs \
            trillionnium/crates/trnm-node/src/live/merkle.rs
          git diff --cached --check
          git commit -m "fix(finality): bind proof domain index and canonical path"
          git push origin "HEAD:work/full-gap-closure-20260831"
