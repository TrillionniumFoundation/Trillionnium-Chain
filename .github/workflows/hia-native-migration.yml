              binding = {'schema': 'trnm.hia.typed-store.ci-native-binding.v1', 'status': 'PASS',
                  'lineage': lineage, 'source_inputs': build['source_inputs'],
                  'native_controls': 603, 'semantic_cases': 392, 'original_tests': list(ORIGINAL_TESTS),
                  'native_report_sha256': native_sha, 'original_report_sha256': original_sha,
                  'comparison_sha256': comparison_sha, 'corpus': comparison['corpus'],
                  'whole_node_or_commit_authority': False, 'physical_power_loss_qualified': False}
              with (observations / 'native-binding.json').open('x') as stream:
                  json.dump(binding, stream, sort_keys=True, indent=2)
                  stream.write('\n')
          else:
              previous = {'produce': 'native', 'cold': 'produce', 'bounds': 'cold'}[stage]
              prior = root / ('hia-typed-store-prior-' + previous)
              binding, binding_sha = read(prior / 'native-binding.json')
              require(binding['schema'] == 'trnm.hia.typed-store.ci-native-binding.v1'
                      and binding['status'] == 'PASS', 'Actual native/original dependency binding required')
              require(all(binding['lineage'][key] == value for key, value in expected.items()), 'Native binding belongs to another source/run/attempt')
              report, report_sha = read(root / ('hia-typed-store-' + stage) / 'report.json')
              require(report['schema'] == 'trnm.hia.typed-staging-capacity-stage.v1'
                      and report['status'] == 'PASS' and report['stage'] == stage, 'Physical capacity stage did not pass')
              require(report['lineage'] == binding['lineage'] and report['lineage']['native_source_inputs_match_git_head'] is True,
                      'Capacity differs from exact committed native/original source or executable')
              require(report['build']['source_inputs'] == binding['source_inputs']
                      and original_hash(report['build']) == binding['lineage']['original_source_set_sha256'], 'Complete source maps differ')
              checked = {'stage_report_sha256': report_sha, 'native_binding_sha256': binding_sha}
              if previous != 'native':
                  parent, parent_sha = read(prior / 'report.json')
                  require(parent['status'] == 'PASS' and parent['stage'] == previous
                          and parent['lineage'] == report['lineage']
                          and report['prior_receipt_sha256'] == parent_sha, 'Direct prior receipt link differs')
                  checked['prior_receipt_sha256'] = parent_sha
              if stage == 'bounds':
                  producer, producer_sha = read(prior / 'ancestry/produce-report.json')
                  require(producer['status'] == 'PASS' and producer['stage'] == 'produce'
                          and producer['lineage'] == report['lineage']
                          and parent['prior_receipt_sha256'] == producer_sha, 'Produce-to-cold ancestral receipt link differs')
                  require(producer['independent_root_hex'] == parent['independent_root_hex'] == report['independent_root_hex'],
                          'Complete State root ancestry differs')
                  checked['produce_receipt_sha256'] = producer_sha
              with (observations / 'lineage-check.json').open('x') as stream:
                  json.dump({'status': 'PASS', 'lineage': report['lineage'], **checked}, stream, sort_keys=True, indent=2)
                  stream.write('\n')
