name: fix-node-boundary-test

on:
  push:
    branches: [work/plan-v2-repository-blockers-closure-20260902]
    paths: [.github/workflows/zz-fix-node-boundary-test.yml]

permissions:
  contents: write

concurrency:
  group: fix-node-boundary-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/plan-v2-repository-blockers-closure-20260902' &&
      github.actor == 'Franksudoman'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Correct retained unsafe-transition test and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('trillionnium/crates/trnm-node-boundary-v0/src/lib.rs')
          text = path.read_text()
          old = '''                expected_stage: AuthorityStageV0::ApplicationSealed,
                next_stage: AuthorityStageV0::SafetyPersisted,
                facts_digest: digest(22),
            })
            .unwrap_err();'''
          new = '''                expected_stage: AuthorityStageV0::ApplicationSealed,
                next_stage: AuthorityStageV0::SignIntentPersisted,
                facts_digest: digest(22),
            })
            .unwrap_err();'''
          if text.count(old) != 1:
              raise SystemExit('expected exact transition-test source once')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/zz-fix-node-boundary-test.yml
          git config user.name 'trnm-closure-bot'
          git config user.email 'trnm-closure-bot@users.noreply.github.com'
          git add trillionnium/crates/trnm-node-boundary-v0/src/lib.rs .github/workflows/zz-fix-node-boundary-test.yml
          git commit -m 'test(node): retain an actually invalid stage-skip mutant'
          git push origin "HEAD:${GITHUB_REF_NAME}"
