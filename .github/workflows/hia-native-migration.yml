            ${{ runner.temp }}/hia-native-host-checkpoint/build/
            ${{ runner.temp }}/hia-native-host-checkpoint/adapter-negatives/
            ${{ runner.temp }}/hia-native-host-checkpoint/actual-production-fixed-parent/
