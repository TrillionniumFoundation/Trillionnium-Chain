[package]
name = "trnm-consensus-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "trnm-cometbft-app"
path = "src/bin/trnm-cometbft-app.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tendermint-abci = "0.40.4"
tendermint-proto = "0.40.4"
trnm-finality-types = { path = "../trnm-finality-types" }
trnm-node = { path = "../trnm-node" }

[dev-dependencies]
ed25519-dalek = "2"
