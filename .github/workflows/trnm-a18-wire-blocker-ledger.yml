name: trnm-a18-one-shot-wire-blocker-ledger

on:
  push:
    branches:
      - feature/chain-a18-repository-truth-ci-hardening-v1-20260830

permissions:
  contents: write

concurrency:
  group: trnm-a18-one-shot-wire-blocker-ledger
  cancel-in-progress: false

jobs:
  wire-and-remove-self:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Wire ledger validation into repository truth
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          policy_path = Path("config/repository-policy-v1.json")
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          for required in (
              "config/blocker-execution-v1.json",
              "scripts/ci/check_blocker_execution_v1.py",
          ):
              if required not in policy["required_paths"]:
                  policy["required_paths"].append(required)
          policy["required_paths"] = sorted(policy["required_paths"])
          policy_path.write_text(json.dumps(policy, indent=2) + "\n", encoding="utf-8")

          workflow_path = Path(".github/workflows/trnm-required-baseline.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_run = """      - name: Validate repository and consensus truth\n        run: python3 scripts/ci/check_repository_truth_v1.py\n"""
          new_run = """      - name: Validate repository, consensus and blocker truth\n        run: |\n          python3 scripts/ci/check_repository_truth_v1.py\n          python3 scripts/ci/check_blocker_execution_v1.py\n"""
          if workflow.count(old_run) != 1:
              raise SystemExit("repository truth workflow anchor drifted")
          workflow = workflow.replace(old_run, new_run, 1)
          old_compile = """            scripts/ci/check_repository_truth_v1.py \\\n            scripts/ci/generate_release_status_v1.py \\\n            scripts/ci/check_external_evidence_v1.py\n"""
          new_compile = """            scripts/ci/check_repository_truth_v1.py \\\n            scripts/ci/check_blocker_execution_v1.py \\\n            scripts/ci/generate_release_status_v1.py \\\n            scripts/ci/check_external_evidence_v1.py\n"""
          if workflow.count(old_compile) != 1:
              raise SystemExit("Python compile workflow anchor drifted")
          workflow = workflow.replace(old_compile, new_compile, 1)
          workflow_path.write_text(workflow, encoding="utf-8")
          PY
      - name: Verify exact ledger wiring
        run: |
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          python3 -m py_compile scripts/ci/check_blocker_execution_v1.py
          git diff --check
      - name: Commit wiring and remove this one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/trnm-a18-wire-blocker-ledger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/repository-policy-v1.json \
            .github/workflows/trnm-required-baseline.yml \
            config/blocker-execution-v1.json \
            scripts/ci/check_blocker_execution_v1.py
          git commit -m "ci(plan): require executable blocker ledger [a18-ledger-wired]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
