    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Checkout the exact current chain source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout the pinned HIA compiler source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: hia-toolchain
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            hepta
            tools
            examples
            docs
            tests
            formal
      - name: Bind every current source byte and migration scope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-peer-lease-store/observations"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-peer-lease-store/observations/source-before.json" 2>&1 | tee "$RUNNER_TEMP/hia-peer-lease-store/observations/source-before.log"
          bash scripts/project-preflight.sh --audit
          python3 -B hia/tools/check_migration.py
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA native compiler identity differs')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Install the explicitly selected original Rust compiler
        run: |
          set -euo pipefail
          toolchain=1.95.0-x86_64-unknown-linux-gnu
          rustup toolchain install "$toolchain" --profile minimal
          rustc_bin="$(rustup which --toolchain "$toolchain" rustc)"
          cargo_bin="$(rustup which --toolchain "$toolchain" cargo)"
          test -x "$rustc_bin"
          test -x "$cargo_bin"
          rustc_dir="$(dirname "$rustc_bin")"
          test "$rustc_dir" = "$(dirname "$cargo_bin")"
          printf '%s\n' "$rustc_dir" >> "$GITHUB_PATH"
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$toolchain"
          export PATH="$rustc_dir:$PATH"
          test "$(command -v rustc)" = "$rustc_bin"
          test "$(command -v cargo)" = "$cargo_bin"
          rustc -Vv
          cargo -Vv
      - name: Prepare locked original inputs and require actual tracing
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path trillionnium/Cargo.toml --target x86_64-unknown-linux-gnu
          strace -V
          printf 'CARGO_TARGET_DIR=%s/hia-peer-lease-store-cargo-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run every original and native private journal method
        run: |
          set -euo pipefail
          unset HIA_PEER_STORE_ORIGINAL_BASELINE HIA_PEER_STORE_ORIGINAL_ARCHIVE HIA_PEER_STORE_SOURCE_ARCHIVE
          python3 -B -m hia.platform.peer_lease_store.qualify --output "$RUNNER_TEMP/hia-peer-lease-store/full" 2>&1 | tee "$RUNNER_TEMP/hia-peer-lease-store/observations/full.log"
      - name: Reject partial rosters and actual injected test failure
        run: |
          set -euo pipefail
          unset HIA_PEER_STORE_ORIGINAL_BASELINE HIA_PEER_STORE_ORIGINAL_ARCHIVE HIA_PEER_STORE_SOURCE_ARCHIVE
          set +e
          python3 -B -m hia.platform.peer_lease_store.qualify --output "$RUNNER_TEMP/hia-peer-lease-store/partial" --only test_01_public_lifecycle_and_exact_disk_bytes 2>&1 | tee "$RUNNER_TEMP/hia-peer-lease-store/observations/partial.log"
          partial_code=${PIPESTATUS[0]}
          set -e
          test "$partial_code" -eq 1
          set +e
          python3 -B -m hia.platform.peer_lease_store.qualify --output "$RUNNER_TEMP/hia-peer-lease-store/failure" --only test_01_public_lifecycle_and_exact_disk_bytes --inject-failure 2>&1 | tee "$RUNNER_TEMP/hia-peer-lease-store/observations/failure.log"
          failure_code=${PIPESTATUS[0]}
          set -e
          test "$failure_code" -eq 1
      - name: Independently read all actual source raw bytes and complete rosters
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/hia-peer-lease-store/full" "$RUNNER_TEMP/hia-peer-lease-store/partial" "$RUNNER_TEMP/hia-peer-lease-store/failure" <<'PY'
          from pathlib import Path
          import hashlib,json,os,sys,unittest
          sys.path.insert(0,os.environ["HIA_TOOLCHAIN_ROOT"])
          from hia.platform.peer_lease_store.build import ROOT,identity,source_capture
          from hia.platform.peer_lease_store.qualify import StoreTests
          directories=[Path(p) for p in sys.argv[1:]]
          expected=['__main__.StoreTests.'+x for x in unittest.defaultTestLoader.getTestCaseNames(StoreTests)]
          current={name:identity(raw) for name,raw in source_capture()[0].items()}
          for directory,(name,status,count) in zip(directories,[('full','PASS',18),('partial','INCOMPLETE',1),('failure','FAIL',1)],strict=True):
              report=json.loads((directory/'report.json').read_bytes())
              if report['status']!=status or report['expected_tests']!=expected or len(expected)!=18:
                  raise SystemExit('Actual complete peer-store roster/status differs')
              if len(report['started_tests'])!=count or len(report['completed_tests'])!=count or not report['finalized']:
                  raise SystemExit('Actual peer-store execution missing')
              if report['source_inputs']!=current or report['source_after']!=current or report['source_unchanged'] is not True:
                  raise SystemExit('Complete current peer-store source differs')
              if report['complete_successful_roster'] is not (name=='full'):
                  raise SystemExit('Incomplete peer-store run accepted')
              if name=='full' and (report['started_tests']!=expected or any(x['status']!='PASS' for x in report['completed_tests']) or report['failures']):
                  raise SystemExit('Actual peer-store methods did not all pass')
              retained=report['original_retained']
              if retained['status']!='PASS' or retained['observation_host_is_current_test_host'] is not True or retained['reused_exact_observation'] is not False:
                  raise SystemExit('Fresh same-host original suite required')
              for relative,row in report['files'].items():
                  path=Path(relative)
                  if path.is_absolute() or '..' in path.parts or path.as_posix()!=relative:
                      raise SystemExit('Escaping actual evidence path')
                  path=directory/path
                  if path.is_symlink() or not path.is_file() or identity(path.read_bytes())!=row:
                      raise SystemExit('Actual execution evidence bytes differ')
              for key in ('unix_daemon_implemented','core_authentication_implemented','payload_stores_implemented','whole_package_retired','production_activation'):
                  if report[key] is not False:
                      raise SystemExit('Unqualified peer-store authority')
          print(json.dumps({'status':'PASS','full_tests':18,'partial_exit':1,'injected_failure_exit':1,'complete_source_and_raw_bytes_checked':True}))
          PY
      - name: Verify complete source after success or failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-peer-lease-store/observations"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-peer-lease-store/observations/source-after.json"
      - name: Archive every actual regular byte and special-object metadata
        if: always()
        env:
          PEER_STAGE_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-peer-lease-store" "$RUNNER_TEMP/hia-peer-lease-store-upload"
          python3 -B - <<'PYMETA'
          import json, os
          from pathlib import Path
          metadata = {'component': 'peer-lease-store', 'head': os.environ['TRNM_EXPECTED_SOURCE_SHA'],
                      'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'stage_status': os.environ['PEER_STAGE_STATUS']}
          (Path(os.environ['RUNNER_TEMP']) / 'hia-peer-lease-store-upload/metadata.json').write_text(json.dumps(metadata, sort_keys=True) + '\n')
          PYMETA
          python3 -B hia/tools/archive_runtime_observations.py --root "observations=$RUNNER_TEMP/hia-peer-lease-store" --optional-root "bootstrap=$RUNNER_TEMP/hia-bootstrap" --metadata "$RUNNER_TEMP/hia-peer-lease-store-upload/metadata.json" --output "$RUNNER_TEMP/hia-peer-lease-store-upload" >"$RUNNER_TEMP/hia-peer-lease-store-upload/package.stdout.raw" 2>"$RUNNER_TEMP/hia-peer-lease-store-upload/package.stderr.raw"
      - name: Upload complete peer-store success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-peer-lease-store-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt
            }}
          path: ${{ runner.temp }}/hia-peer-lease-store-upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  native-checkpoint-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: ''
      LC_ALL: C
      TRNM_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Initialize runner-owned checkpoint observation paths
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          printf 'CS_OBSERVATIONS=%s/checkpoint-store-observations\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CS_QUALIFICATION=%s/checkpoint-store-qualification\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CS_ARTIFACT=%s/checkpoint-store-artifact\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout the exact current chain source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout the pinned HIA compiler source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: hia-toolchain
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            hepta
            tools
            examples
            docs
            tests
            formal
      - name: Bind the current source and migration scope
        run: |
          set -euo pipefail
          mkdir -p "$CS_OBSERVATIONS"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$CS_OBSERVATIONS/source-before.json" >"$CS_OBSERVATIONS/source-before.stdout.raw" 2>"$CS_OBSERVATIONS/source-before.stderr.raw"
          bash scripts/project-preflight.sh --audit >"$CS_OBSERVATIONS/preflight.stdout.raw" 2>"$CS_OBSERVATIONS/preflight.stderr.raw"
          python3 -B hia/tools/check_migration.py >"$CS_OBSERVATIONS/migration.stdout.raw" 2>"$CS_OBSERVATIONS/migration.stderr.raw"
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Install the original Rust compiler, formatter and Clippy
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy >"$CS_OBSERVATIONS/rust-install.stdout.raw" 2>"$CS_OBSERVATIONS/rust-install.stderr.raw"
          rustup which --toolchain 1.95.0 rustc >"$CS_OBSERVATIONS/rustc-path.txt"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          tools = Path((Path(os.environ['CS_OBSERVATIONS']) / 'rustc-path.txt').read_text().strip()).resolve().parent
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(tools) + '\n')
          PY
      - name: Fetch the exact locked Cargo inputs before the offline original build
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path trillionnium/Cargo.toml >"$CS_OBSERVATIONS/cargo-fetch.stdout.raw" 2>"$CS_OBSERVATIONS/cargo-fetch.stderr.raw"
          # Original() independently forces offline mode, clears wrappers/flags/
          # inherited target directories, checks the actual 1.95.0 x86_64 host,
          # and builds a fresh private target. No cached .rlib is an oracle input.
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap" >"$CS_OBSERVATIONS/bootstrap.stdout.raw" 2>"$CS_OBSERVATIONS/bootstrap.stderr.raw"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA native compiler identity differs')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Execute all original tests, native methods, Unix recovery and crash boundaries
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess, sys, time
          from pathlib import Path
          out = Path(os.environ['CS_OBSERVATIONS'])
          argv = [sys.executable, '-B', '-m', 'hia.platform.checkpoint_store.qualify',
                  '--output', os.environ['CS_QUALIFICATION']]
          start = time.monotonic_ns()
          with (out / 'qualification.stdout.raw').open('xb') as stdout, (out / 'qualification.stderr.raw').open('xb') as stderr:
              process = subprocess.run(argv, stdout=stdout, stderr=stderr)
          def identity(path):
              raw = path.read_bytes()
              return {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
          receipt = {'argv': argv, 'cwd': str(Path.cwd()), 'exit_code': process.returncode,
                     'elapsed_ns': time.monotonic_ns() - start,
                     'stdout': identity(out / 'qualification.stdout.raw'),
                     'stderr': identity(out / 'qualification.stderr.raw')}
          (out / 'qualification-process.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          raise SystemExit(process.returncode)
          PY
          # This one entry runs 29 compiler/emit stages; 77 original tests with
          # zero filtered/ignored; adapter rustfmt --edition 2021; cargo fmt;
          # --locked --offline --all-features --all-targets Clippy -D warnings;
          # 792 observations and all 31 negative controls. It never skips a denied
          # Unix socket, ptrace, fsync, test binary, compiler or original oracle.
      - name: Verify every current source byte after success or failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$CS_OBSERVATIONS"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$CS_OBSERVATIONS/source-after.json" >"$CS_OBSERVATIONS/source-after.stdout.raw" 2>"$CS_OBSERVATIONS/source-after.stderr.raw"
      - name: Independently read back the complete qualification and bind this CI head
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.checkpoint_store.qualify --verify "$CS_QUALIFICATION" >"$CS_OBSERVATIONS/readback.stdout.raw" 2>"$CS_OBSERVATIONS/readback.stderr.raw"
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from hia.platform.checkpoint_store.build import decode, exact, identity, need
          out, qualified = Path(os.environ['CS_OBSERVATIONS']), Path(os.environ['CS_QUALIFICATION'])
          head = subprocess.check_output(['git', '--no-replace-objects', 'rev-parse', 'HEAD']).decode().strip()
          tree = subprocess.check_output(['git', '--no-replace-objects', 'rev-parse', 'HEAD^{tree}']).decode().strip()
          need(head == os.environ['TRNM_EXPECTED_SOURCE_SHA'], 'Current head differs')
          for name in ('source-before.json', 'source-after.json'):
              row = decode((out / name).read_bytes())
              need(row['kind'] == 'head' and row['tested_commit'] == row['candidate'] == head
                   and row['tested_tree'] == tree and row['tracked_worktree_verified'] is True,
                   'Exact before/after source binding is incomplete')
          native = decode((qualified / 'native/build.json').read_bytes())
          for name, expected in native['source_inputs'].items():
              committed = subprocess.check_output(['git', '--no-replace-objects', 'cat-file', 'blob', 'HEAD:' + name])
              need(exact(identity(committed), expected), 'Qualified source is not this committed input: ' + name)
          outer = decode((out / 'qualification-process.json').read_bytes())
          need(type(outer['exit_code']) is int and outer['exit_code'] == 0, 'Actual qualification process failed')
          for stream in ('stdout', 'stderr'):
              need(exact(outer[stream], identity((out / ('qualification.' + stream + '.raw')).read_bytes())), 'Outer raw stream changed')
          report = decode((qualified / 'qualification.json').read_bytes())
          binding = {'schema': 'trnm.hia.checkpoint-store-ci-binding.v1', 'status': 'PASS',
                     'head': head, 'tree': tree, 'run_id': os.environ['GITHUB_RUN_ID'],
                     'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'qualification': identity((qualified / 'qualification.json').read_bytes()),
                     'source_set_sha256': native['source_set_sha256'],
                     'scope': {'whole_node_replacement': False, 'production_activation': False, 'power_failure_claimed': False}}
          need(report['source_set_sha256'] == native['source_set_sha256'] and report['status'] == 'PASS', 'Qualification source binding differs')
          (out / 'binding.json').write_text(json.dumps(binding, sort_keys=True, indent=2) + '\n')
          PY
      - name: Preserve all regular bytes and lstat metadata on success or failure
        if: always()
        env:
          CS_STAGE_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$CS_OBSERVATIONS" "$CS_ARTIFACT"
          python3 -B - <<'PYMETA'
          import json, os
          from pathlib import Path
          metadata = {'component': 'checkpoint-store', 'head': os.environ['TRNM_EXPECTED_SOURCE_SHA'],
                      'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'stage_status': os.environ['CS_STAGE_STATUS']}
          (Path(os.environ['CS_ARTIFACT']) / 'metadata.json').write_text(json.dumps(metadata, sort_keys=True) + '\n')
          PYMETA
          python3 -B hia/tools/archive_runtime_observations.py --root "observations=$CS_OBSERVATIONS" --optional-root "qualification=$CS_QUALIFICATION" --optional-root "bootstrap=$RUNNER_TEMP/hia-bootstrap" --metadata "$CS_ARTIFACT/metadata.json" --output "$CS_ARTIFACT" >"$CS_ARTIFACT/package.stdout.raw" 2>"$CS_ARTIFACT/package.stderr.raw"
      - name: Upload complete observations and packaging diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-checkpoint-store-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checkpoint-store-artifact/
            ${{ runner.temp }}/checkpoint-store-observations/
          if-no-files-found: error
          retention-days: 30

  native-additional-owners:
    name: native-${{ matrix.component }}
