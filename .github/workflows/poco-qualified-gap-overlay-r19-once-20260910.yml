name: PoCO qualified gap overlay R19 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-qualified-gap-overlay-r19-once-20260910.yml

concurrency:
  group: poco-only-final-convergence
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pull-requests: read

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r19-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"

jobs:
  converge:
    name: Reduce real repository gaps, qualify exact tree and launch evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned qualification tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep jq
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked
          python3 -m py_compile \
            tools/temporary_poco_gap_overlay_r19.py \
            tools/temporary_poco_productize_r19.py
          cp tools/temporary_poco_gap_overlay_r19.py /tmp/trnm-r19-overlay.py

      - name: Finish native-only product materialization and re-check out published head
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temporary_poco_productize_r19.py
          if [[ -f tools/temporary_poco_convergence_r13.sh ]]; then
            python3 -m py_compile \
              tools/temporary_poco_native_convergence_r13.py \
              tools/temporary_poco_r13_postfix.py
            bash -n tools/temporary_poco_convergence_r13.sh
            CARGO_TARGET_DIR=/tmp/trnm-r19-target \
              bash tools/temporary_poco_convergence_r13.sh
          fi
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Materialize immutable controller-free candidate
        id: product
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/poco-only-convergence-r14-once-20260910.yml \
            .github/workflows/poco-only-convergence-r15-once-20260910.yml \
            .github/workflows/poco-repository-gap-convergence-r16-once-20260910.yml \
            .github/workflows/poco-exact-gap-convergence-r17-once-20260910.yml \
            .github/workflows/poco-qualified-external-orchestration-r18-once-20260910.yml \
            .github/workflows/poco-qualified-gap-overlay-r19-once-20260910.yml \
            tools/temporary_poco_gap_overlay_r19.py \
            tools/temporary_poco_productize_r19.py \
            tools/temporary_poco_r13_postfix.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git add -A
          git diff --cached --check
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git config user.name "Qian QI"
            git config user.email "102159240+ProfHepta@users.noreply.github.com"
            git commit -m "ci: remove completed PoCO convergence controllers"
          fi
          FINAL_COMMIT="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
          rm -rf /tmp/trnm-r19-final
          git worktree add --detach /tmp/trnm-r19-final "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r19-final rev-parse HEAD)" = "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r19-final rev-parse 'HEAD^{tree}')" = "$FINAL_TREE"
          test -z "$(git -C /tmp/trnm-r19-final status --porcelain --untracked-files=all)"

      - name: Search and apply only evidence-bound improving closure overlays
        id: overlay
        working-directory: /tmp/trnm-r19-final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          : >/tmp/trnm-r19-overlay-rounds.log
          applied=0
          for round in 1 2 3
          do
            echo "overlay_round=$round head=$(git rev-parse HEAD)" \
              | tee -a /tmp/trnm-r19-overlay-rounds.log
            set +e
            python3 /tmp/trnm-r19-overlay.py /tmp/trnm-r19-final \
              >>/tmp/trnm-r19-overlay-rounds.log 2>&1
            rc=$?
            set -e
            if [[ "$rc" -eq 4 ]]; then
              echo "overlay_round=$round no_admissible_improvement=true" \
                | tee -a /tmp/trnm-r19-overlay-rounds.log
              break
            fi
            test "$rc" -eq 0
            if git diff --cached --quiet && git diff --quiet; then
              echo "overlay_round=$round baseline_zero_or_noop=true" \
                | tee -a /tmp/trnm-r19-overlay-rounds.log
              break
            fi

            cargo fmt --manifest-path trillionnium/Cargo.toml --all
            helper_commit="$(git log --all -1 --format=%H -- tools/temporary_poco_convergence_r5.py || true)"
            if [[ -n "$helper_commit" ]]; then
              git show "$helper_commit:tools/temporary_poco_convergence_r5.py" \
                > tools/.temporary_r19_refresh.py
              python3 tools/.temporary_r19_refresh.py refresh-pins
              rm tools/.temporary_r19_refresh.py
            fi
            cargo fmt --manifest-path trillionnium/Cargo.toml --all
            git add -A
            git diff --cached --check
            test -n "$(git diff --cached --name-only)"
            git commit -m "fix(poco): integrate admissible repository gap closure round ${round}"
            python3 scripts/ci/check_native_consensus_only.py
            cargo check --manifest-path trillionnium/Cargo.toml \
              --workspace --all-targets --locked --offline -j 1
            applied=$((applied + 1))
          done
          echo "applied_rounds=$applied" >> "$GITHUB_OUTPUT"

      - name: Build final three-way gap classification
        id: gaps
        working-directory: /tmp/trnm-r19-final
        shell: bash
        run: |
          set -euo pipefail
          export FINAL_COMMIT="$(git rev-parse HEAD)"
          export FINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          python3 - <<'PY'
          from __future__ import annotations
          import importlib.util
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location("overlay", "/tmp/trnm-r19-overlay.py")
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          score, rows = module.classify_gaps(root)

          commands = []
          reports = []
          patterns = (
              "*technical*convergence*.py",
              "*technical*convergence*.sh",
              "*documentation*integrity*.py",
              "*documentation*integrity*.sh",
              "*module*coverage*.py",
              "*module*coverage*.sh",
          )
          seen = set()
          for pattern in patterns:
              for path in sorted((root / "scripts/ci").glob(pattern)):
                  if path in seen or not path.is_file():
                      continue
                  seen.add(path)
                  command = (["python3", str(path.relative_to(root))]
                             if path.suffix == ".py"
                             else ["bash", str(path.relative_to(root))])
                  completed = subprocess.run(command, cwd=root, text=True, capture_output=True)
                  commands.append({
                      "path": path.relative_to(root).as_posix(),
                      "returncode": completed.returncode,
                      "stdout": completed.stdout,
                      "stderr": completed.stderr,
                  })
                  reports.append(completed.stdout)

          joined = "\n".join(reports)
          source_regressions_present = (
              '"source_regression_case_count":' in joined
              and '"source_regression_case_count": 0' not in joined
          )
          independent_vectors_absent = '"independent_golden_vector_count": 0' in joined
          catalog_incomplete = '"operation_catalog_complete": false' in joined
          catalog_repository_gap = catalog_incomplete and not (
              source_regressions_present and independent_vectors_absent
          )
          failed_commands = [row["path"] for row in commands if row["returncode"] != 0]
          repository_gap_count = score.total + int(catalog_repository_gap) + len(failed_commands)
          external_rows = [row for row in rows if row["classification"] == "external"]
          if catalog_incomplete and not catalog_repository_gap:
              external_rows.append({
                  "path": "convergence-reports",
                  "line": 0,
                  "markers": ["operation-catalog-independent-acceptance-open"],
                  "classification": "external",
                  "basis": ["source regression cases present", "independent golden vectors absent"],
                  "text": "implementation sources exist; independent golden acceptance remains external",
              })
          report = {
              "schema": "trnm-poco-final-gap-classification-r19-v1",
              "source_commit": os.environ["FINAL_COMMIT"],
              "source_tree": os.environ["FINAL_TREE"],
              "repository_gap_count": repository_gap_count,
              "repository_marker_score": score.as_dict(),
              "catalog_repository_gap": catalog_repository_gap,
              "failed_convergence_commands": failed_commands,
              "markers": rows,
              "external_rows": external_rows,
              "external_blocker_ids": [
                  "EXT-ANCHOR-HSM-001",
                  "EXT-AUDIT-001",
                  "EXT-G1-CAMPAIGN-001",
                  "EXT-POWERLOSS-001",
                  "EXT-REVIEW-001",
                  "EXT-SOAK-ACTIVATION-001",
              ],
              "commands": commands,
          }
          pathlib.Path("/tmp/trnm-r19-gap-classification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          summary = [
              f"source_commit={report['source_commit']}",
              f"source_tree={report['source_tree']}",
              f"repository_gap_count={repository_gap_count}",
              f"repository_marker_total={score.total}",
              f"catalog_repository_gap={str(catalog_repository_gap).lower()}",
              f"failed_convergence_command_count={len(failed_commands)}",
              f"external_blocker_count=6",
          ]
          for row in rows:
              summary.append(
                  f"{row['classification'].upper()} {row['path']}:{row['line']} {row['text']}"
              )
          pathlib.Path("/tmp/trnm-r19-gap-summary.txt").write_text(
              "\n".join(summary) + "\n", encoding="utf-8"
          )
          pathlib.Path("/tmp/trnm-r19-repository-gap-count.txt").write_text(
              str(repository_gap_count) + "\n", encoding="ascii"
          )
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"repository_gap_count={repository_gap_count}\n")
              output.write("external_blocker_count=6\n")
          print(json.dumps({
              "repository_gap_count": repository_gap_count,
              "external_blocker_count": 6,
          }, sort_keys=True))
          PY
          test "$(cat /tmp/trnm-r19-repository-gap-count.txt)" = "0"

      - name: Run exact repository and protocol truth gates
        working-directory: /tmp/trnm-r19-final
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tools formal conformance
          python3 scripts/ci/check_native_consensus_only.py \
            | tee /tmp/trnm-r19-native-only.json
          bash scripts/ci/check_canonical_development_plan.sh \
            | tee /tmp/trnm-r19-canonical-plan.log
          bash scripts/ci/check_poco_bft_mainline_truth.sh \
            | tee /tmp/trnm-r19-mainline.log
          python3 scripts/ci/check_repository_truth_v1.py \
            | tee /tmp/trnm-r19-repository-truth.json
          python3 scripts/ci/check_required_protocol_contract_v1.py \
            | tee /tmp/trnm-r19-protocol-contract.json
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Compile every workspace and contract target
        working-directory: /tmp/trnm-r19-final
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARGO_TARGET_DIR"
          cargo check --manifest-path trillionnium/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r19-workspace-check.log
          cargo check --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r19-contract-check.log

      - name: Execute complete workspace and contract regression corpus
        working-directory: /tmp/trnm-r19-final
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 7200s \
            cargo test --manifest-path trillionnium/Cargo.toml \
              --workspace --all-targets --locked --offline --no-fail-fast -j 1 -- \
              --test-threads=1 \
            2>&1 | tee /tmp/trnm-r19-workspace-test.log
          cargo test --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r19-contract-test.log
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute strict production-boundary Clippy
        working-directory: /tmp/trnm-r19-final
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 -- -D warnings \
            2>&1 | tee /tmp/trnm-r19-contract-clippy.log
          cd trillionnium
          : >/tmp/trnm-r19-boundary-clippy.log
          for package in \
            trnm-state trnm-consensus-types trnm-consensus-crypto \
            trnm-consensus-core trnm-consensus-safety-rules \
            trnm-consensus-safety-store trnm-consensus-signer-journal \
            trnm-native-application trnm-native-application-sqlite \
            trnm-native-execution-v0 trnm-durable-file-adapters-v0 \
            trnm-tx-lifecycle-v0 trnm-state-sync-v0 trnm-migration-v0 \
            trnm-control-plane-v0 trnm-release-bundle-v0 trnm-node-boundary-v0 \
            trnm-poco-node-production-v0 trnm-production-adapter-conformance-v0 \
            trnm-poco-node trnm-poco-node-authority trnm-poco-node-io \
            trnm-poco-node-host trnm-poco-node-cli
          do
            echo "strict-clippy package=${package}" | tee -a /tmp/trnm-r19-boundary-clippy.log
            cargo clippy -p "$package" --all-targets --locked --offline -j 1 -- -D warnings \
              2>&1 | tee -a /tmp/trnm-r19-boundary-clippy.log
          done
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish exact repository-qualified commit
        id: publish
        working-directory: /tmp/trnm-r19-final
        shell: bash
        run: |
          set -euo pipefail
          FINAL_COMMIT="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$(cat /tmp/trnm-r19-repository-gap-count.txt)" = "0"
          python3 scripts/ci/check_native_consensus_only.py
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE" push origin \
            "$FINAL_COMMIT:refs/heads/$TARGET_BRANCH"
          echo "commit=$FINAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$FINAL_TREE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$FINAL_COMMIT" >/tmp/trnm-r19-final-commit.txt
          printf '%s\n' "$FINAL_TREE" >/tmp/trnm-r19-final-tree.txt

      - name: Dispatch every compatible authentic external evidence workflow
        id: dispatch
        working-directory: /tmp/trnm-r19-final
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="${{ steps.publish.outputs.commit }}"
          export SOURCE_TREE="${{ steps.publish.outputs.tree }}"
          export REPOSITORY="$GITHUB_REPOSITORY"
          export BRANCH="$TARGET_BRANCH"
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import pathlib
          import re
          import subprocess
          import urllib.parse

          root = pathlib.Path.cwd()
          keywords = (
              "external", "evidence", "hsm", "audit", "power", "soak",
              "campaign", "multihost", "multi-host", "long-fuzz", "review",
          )
          values = {
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_sha": os.environ["SOURCE_COMMIT"],
              "commit": os.environ["SOURCE_COMMIT"],
              "head_sha": os.environ["SOURCE_COMMIT"],
              "source_tree": os.environ["SOURCE_TREE"],
              "tree": os.environ["SOURCE_TREE"],
              "tree_sha": os.environ["SOURCE_TREE"],
              "branch": os.environ["BRANCH"],
              "ref": os.environ["BRANCH"],
              "target_branch": os.environ["BRANCH"],
          }
          dispatched = []
          skipped = []
          for path in sorted((root / ".github/workflows").glob("*.y*ml")):
              relative = path.relative_to(root).as_posix()
              text = path.read_text(encoding="utf-8")
              lowered = (relative + "\n" + text[:4000]).casefold()
              if "workflow_dispatch" not in text or not any(word in lowered for word in keywords):
                  continue
              required = []
              for match in re.finditer(r"(?m)^\s{6}([A-Za-z0-9_-]+):\s*$", text):
                  name = match.group(1)
                  tail = text[match.end():match.end() + 700]
                  if re.search(r"(?m)^\s{8}required:\s*true\s*$", tail):
                      required.append(name)
              unknown = [name for name in required if name not in values]
              if unknown:
                  skipped.append({"workflow": relative, "reason": "unknown-required-input", "inputs": unknown})
                  continue
              payload = {"ref": os.environ["BRANCH"]}
              inputs = {name: values[name] for name in required}
              if inputs:
                  payload["inputs"] = inputs
              endpoint = (
                  f"repos/{os.environ['REPOSITORY']}/actions/workflows/"
                  f"{urllib.parse.quote(path.name, safe='')}/dispatches"
              )
              completed = subprocess.run(
                  ["gh", "api", "--method", "POST", endpoint, "--input", "-"],
                  cwd=root,
                  input=json.dumps(payload),
                  text=True,
                  capture_output=True,
              )
              if completed.returncode == 0:
                  dispatched.append({"workflow": relative, "inputs": inputs})
              else:
                  skipped.append({"workflow": relative, "reason": "dispatch-failed", "stderr": completed.stderr[-2000:]})
          report = {
              "schema": "trnm-poco-external-dispatch-r19-v1",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_tree": os.environ["SOURCE_TREE"],
              "dispatched": dispatched,
              "skipped": skipped,
          }
          pathlib.Path("/tmp/trnm-r19-external-dispatch.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"dispatched_count={len(dispatched)}\n")
          print(json.dumps({"dispatched_count": len(dispatched), "skipped_count": len(skipped)}, sort_keys=True))
          PY

      - name: Enforce authenticated external-evidence truth
        working-directory: /tmp/trnm-r19-final
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_external_evidence_v1.py
          set +e
          python3 scripts/ci/check_external_evidence_v1.py --require-all \
            --source-commit "${{ steps.publish.outputs.commit }}" \
            --source-tree "${{ steps.publish.outputs.tree }}" \
            --output /tmp/trnm-r19-external-evidence.json \
            >/tmp/trnm-r19-external-evidence.stdout \
            2>/tmp/trnm-r19-external-evidence.stderr
          rc=$?
          set -e
          printf 'external_evidence_exit=%s\n' "$rc" \
            | tee /tmp/trnm-r19-external-evidence-status.txt
          if [[ "$rc" -eq 0 ]]; then
            exit 0
          fi
          test "$rc" -eq 2
          grep -q "external evidence gate remains open" /tmp/trnm-r19-external-evidence.stderr
          exit 2

      - name: Upload exact R19 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r19-qualified-gap-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/trnm-r19-overlay-rounds.log
            /tmp/trnm-r19-overlay-search.json
            /tmp/trnm-r19-overlay-summary.txt
            /tmp/trnm-r19-gap-classification.json
            /tmp/trnm-r19-gap-summary.txt
            /tmp/trnm-r19-repository-gap-count.txt
            /tmp/trnm-r19-native-only.json
            /tmp/trnm-r19-canonical-plan.log
            /tmp/trnm-r19-mainline.log
            /tmp/trnm-r19-repository-truth.json
            /tmp/trnm-r19-protocol-contract.json
            /tmp/trnm-r19-workspace-check.log
            /tmp/trnm-r19-contract-check.log
            /tmp/trnm-r19-workspace-test.log
            /tmp/trnm-r19-contract-test.log
            /tmp/trnm-r19-contract-clippy.log
            /tmp/trnm-r19-boundary-clippy.log
            /tmp/trnm-r19-final-commit.txt
            /tmp/trnm-r19-final-tree.txt
            /tmp/trnm-r19-external-dispatch.json
            /tmp/trnm-r19-external-evidence.json
            /tmp/trnm-r19-external-evidence.stdout
            /tmp/trnm-r19-external-evidence.stderr
            /tmp/trnm-r19-external-evidence-status.txt
