[package]
name = "trnm-pouw"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
ark-bn254 = "0.4"
ark-crypto-primitives = { version = "0.4", features = ["snark"] }
ark-ec = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
once_cell = "1"
rand = "0.8"
trnm-state = { path = "../trnm-state" }
trnm-types = { path = "../trnm-types" }

[dev-dependencies]
serde_json = "1"
trnm-state = { path = "../trnm-state", features = ["test-utils"] }
