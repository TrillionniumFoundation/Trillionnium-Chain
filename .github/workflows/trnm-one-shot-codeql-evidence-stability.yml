name: TRNM one-shot CodeQL evidence stability repair

on:
  push:
    branches:
      - automation/apply-codeql-evidence-stability-20260909

permissions:
  contents: write

concurrency:
  group: trnm-one-shot-codeql-evidence-stability-v3
  cancel-in-progress: false

jobs:
  apply-reviewed-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_TARGET_SHA: d12a5ab584d86429c2963c75c6a5ac28f7165792
      PATCH_PATH: .trnm/one-shot/codeql-evidence-stability.patch
      WORKFLOW_PATH: .github/workflows/trnm-one-shot-codeql-evidence-stability.yml
      TARGET_BRANCH: security/codeql-default-setup-v1-20260909
    steps:
      - name: Check out isolated execution branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify target and closed input surface
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/automation/apply-codeql-evidence-stability-20260909"
          test "$(git rev-parse origin/${TARGET_BRANCH})" = "${EXPECTED_TARGET_SHA}"
          actual="$(git diff --name-only "${EXPECTED_TARGET_SHA}"..HEAD | LC_ALL=C sort)"
          test "${actual}" = "${WORKFLOW_PATH}"
          git diff --quiet
          git diff --cached --quiet
          test -f "${PATCH_PATH}"

      - name: Apply deterministic guarded source transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def insert_after(path: Path, anchor: str, addition: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(anchor) != 1:
                  raise SystemExit(f"{label}: anchor count={text.count(anchor)}")
              path.write_text(text.replace(anchor, anchor + addition, 1), encoding="utf-8")

          admin = Path("scripts/admin/apply_codeql_default_setup_v1.py")
          tests = Path("scripts/ci/test_codeql_default_setup_v1.py")
          runbook = Path("docs/runbooks/TRNM_CODEQL_DEFAULT_SETUP_V1.md")

          insert_after(
              admin,
              '    parser.add_argument("--acknowledge-change-freeze", action="store_true")\n',
              '    parser.add_argument(\n'
              '        "--acknowledge-settings-verification-freeze", action="store_true"\n'
              '    )\n',
              "parse-arg",
          )

          text = admin.read_text(encoding="utf-8")
          validation_start = text.index("    if args.verify_evidence:\n", text.index("def main("))
          validation_end = text.index("\n\n    report: dict[str, Any]", validation_start)
          old_validation = text[validation_start:validation_end]
          expected_tail = '        require(args.validation_run_id is not None, "--validation-run-id required")'
          if not old_validation.rstrip().endswith(expected_tail):
              raise SystemExit("validation-block shape drift")
          new_validation = old_validation + '''
              require(
                  args.acknowledge_settings_verification_freeze,
                  "--acknowledge-settings-verification-freeze is required with "
                  "--verify-evidence",
              )
              verification_ticket = os.environ.get(
                  "TRNM_CODEQL_SETTINGS_VERIFICATION_TICKET", ""
              )
              require(
                  verification_ticket.strip() != "",
                  "TRNM_CODEQL_SETTINGS_VERIFICATION_TICKET is required",
              )
          else:
              verification_ticket = ""
          '''
          text = text[:validation_start] + new_validation + text[validation_end:]
          admin.write_text(text, encoding="utf-8")

          insert_after(
              admin,
              '        "branch_observations": [],\n',
              '        "settings_verification_ticket": None,\n'
              '        "settings_verification_freeze_acknowledged": False,\n',
              "report-fields",
          )

          text = admin.read_text(encoding="utf-8")
          evidence_start = text.index(
              '    if args.verify_evidence:\n        assert report["live_after"] is not None\n',
              text.index('    api = GitHubApi('),
          )
          evidence_end = text.index("\n    if args.apply:\n", evidence_start)
          new_evidence = '''    if args.verify_evidence:
              assert report["live_after"] is not None
              initial_live = report["live_after"]
              report["live_before"] = initial_live
              report["settings_verification_ticket"] = verification_ticket
              report["settings_verification_freeze_acknowledged"] = True
              first_evidence = verify_exact_source_checks(
                  api,
                  repository,
                  args.evidence_sha,
                  config["required_check_names"],
                  live_updated_at=initial_live["updated_at"],
                  validation_run_id=args.validation_run_id,
                  trusted_producers=config["trusted_check_producers"],
                  analysis_workflow_path=config["analysis_workflow_path"],
              )
              final_live = verify_live_setup(api, repository, config)
              require(
                  final_live == initial_live,
                  "live default setup changed during evidence verification",
              )
              final_evidence = verify_exact_source_checks(
                  api,
                  repository,
                  args.evidence_sha,
                  config["required_check_names"],
                  live_updated_at=final_live["updated_at"],
                  validation_run_id=args.validation_run_id,
                  trusted_producers=config["trusted_check_producers"],
                  analysis_workflow_path=config["analysis_workflow_path"],
              )
              require(
                  final_evidence == first_evidence,
                  "required CodeQL evidence changed during verification",
              )
              report["evidence"] = final_evidence
              report["live_after"] = final_live
          '''
          text = text[:evidence_start] + new_evidence + text[evidence_end:]
          admin.write_text(text, encoding="utf-8")

          test_block = '''    def evidence_argv(self) -> list[str]:
              return [
                  "--verify-live",
                  "--verify-evidence",
                  "--acknowledge-settings-verification-freeze",
                  "--evidence-sha",
                  self.evidence_sha,
                  "--validation-run-id",
                  str(self.validation_run_id),
              ]

              def evidence_env(self) -> dict[str, str]:
                  return {
                      "GH_TOKEN": "token",
                      "TRNM_CODEQL_SETTINGS_VERIFICATION_TICKET": "issue-88/read-window",
                  }

              def test_cli_evidence_requires_settings_freeze_and_ticket(self) -> None:
                  argv = [
                      "--verify-live", "--verify-evidence", "--evidence-sha",
                      self.evidence_sha, "--validation-run-id", str(self.validation_run_id),
                  ]
                  with mock.patch.object(MODULE, "GitHubApi", FakeApi), mock.patch.dict(
                      os.environ, {"GH_TOKEN": "token"}, clear=True
                  ), self.assertRaisesRegex(
                      MODULE.CodeqlSetupError, "acknowledge-settings-verification-freeze"
                  ):
                      MODULE.main(argv)
                  argv.insert(2, "--acknowledge-settings-verification-freeze")
                  with mock.patch.object(MODULE, "GitHubApi", FakeApi), mock.patch.dict(
                      os.environ, {"GH_TOKEN": "token"}, clear=True
                  ), self.assertRaisesRegex(
                      MODULE.CodeqlSetupError, "TRNM_CODEQL_SETTINGS_VERIFICATION_TICKET"
                  ):
                      MODULE.main(argv)

              def test_cli_evidence_accepts_stable_double_verification(self) -> None:
                  live = {"normalized": {"stable": True}, "updated_at": self.live_updated_at}
                  evidence = {"evidence_sha": self.evidence_sha, "required": {"stable": True}}
                  stdout = io.StringIO()
                  with mock.patch.object(MODULE, "GitHubApi", FakeApi), mock.patch.object(
                      MODULE, "verify_live_setup", side_effect=[live, live]
                  ), mock.patch.object(
                      MODULE, "verify_exact_source_checks", side_effect=[evidence, evidence]
                  ), mock.patch.dict(
                      os.environ, self.evidence_env(), clear=True
                  ), contextlib.redirect_stdout(stdout):
                      self.assertEqual(MODULE.main(self.evidence_argv()), 0)
                  report = json.loads(stdout.getvalue())
                  self.assertEqual(report["result"], "VERIFIED")
                  self.assertEqual(report["live_before"], report["live_after"])
                  self.assertEqual(report["evidence"], evidence)

              def test_cli_evidence_rejects_live_generation_drift(self) -> None:
                  initial = {"normalized": {"stable": True}, "updated_at": self.live_updated_at}
                  changed = {"normalized": {"stable": True}, "updated_at": "2026-09-09T00:10:00Z"}
                  evidence = {"evidence_sha": self.evidence_sha, "required": {"stable": True}}
                  with mock.patch.object(MODULE, "GitHubApi", FakeApi), mock.patch.object(
                      MODULE, "verify_live_setup", side_effect=[initial, changed]
                  ), mock.patch.object(
                      MODULE, "verify_exact_source_checks", return_value=evidence
                  ), mock.patch.dict(os.environ, self.evidence_env(), clear=True), self.assertRaisesRegex(
                      MODULE.CodeqlSetupError, "changed during evidence verification"
                  ):
                      MODULE.main(self.evidence_argv())

              def test_cli_evidence_rejects_check_generation_drift(self) -> None:
                  live = {"normalized": {"stable": True}, "updated_at": self.live_updated_at}
                  first = {"evidence_sha": self.evidence_sha, "required": {"stable": True}}
                  changed = {"evidence_sha": self.evidence_sha, "required": {"stable": False}}
                  with mock.patch.object(MODULE, "GitHubApi", FakeApi), mock.patch.object(
                      MODULE, "verify_live_setup", side_effect=[live, live]
                  ), mock.patch.object(
                      MODULE, "verify_exact_source_checks", side_effect=[first, changed]
                  ), mock.patch.dict(os.environ, self.evidence_env(), clear=True), self.assertRaisesRegex(
                      MODULE.CodeqlSetupError, "evidence changed during verification"
                  ):
                      MODULE.main(self.evidence_argv())

          '''
          insert_after(
              tests,
              "    def test_cli_forbids_unbound_or_same_invocation_evidence(self) -> None:\n",
              "",
              "test-anchor-present",
          )
          text = tests.read_text(encoding="utf-8")
          anchor = "    def test_apply_requires_mutation_freeze_and_ticket(self) -> None:\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"test-insertion-anchor count={text.count(anchor)}")
          tests.write_text(text.replace(anchor, test_block + anchor, 1), encoding="utf-8")

          text = runbook.read_text(encoding="utf-8")
          anchor = '```bash\nGH_TOKEN="${SECURITY_EVENTS_READ_TOKEN}" \\\n'
          if text.count(anchor) != 1:
              raise SystemExit(f"runbook-env-anchor count={text.count(anchor)}")
          text = text.replace(
              anchor,
              '```bash\nexport TRNM_CODEQL_SETTINGS_VERIFICATION_TICKET="issue-88/read-window-id"\n' +
              'GH_TOKEN="${SECURITY_EVENTS_READ_TOKEN}" \\\n',
              1,
          )
          anchor = '  --verify-evidence \\\n  --evidence-sha "${EXACT_SOURCE_SHA}" \\\n'
          if text.count(anchor) != 1:
              raise SystemExit(f"runbook-arg-anchor count={text.count(anchor)}")
          text = text.replace(
              anchor,
              '  --verify-evidence \\\n  --acknowledge-settings-verification-freeze \\\n' +
              '  --evidence-sha "${EXACT_SOURCE_SHA}" \\\n',
              1,
          )
          marker = "Retain the live configuration response, PATCH response"
          if text.count(marker) != 1:
              raise SystemExit(f"runbook-marker count={text.count(marker)}")
          addition = (
              "Evidence acceptance requires an independently enforced settings-change freeze "
              "and a non-empty verification ticket. The verifier performs the complete live "
              "configuration and exact-source check/suite/workflow verification twice and rejects "
              "any generation, result or inventory drift across the read window.\n\n"
          )
          runbook.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")
          PY
          git rm "${PATCH_PATH}" "${WORKFLOW_PATH}"
          git diff --check

      - name: Run adversarial regression corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/admin/apply_codeql_default_setup_v1.py scripts/ci/test_codeql_default_setup_v1.py
          python3 scripts/ci/test_codeql_default_setup_v1.py
          python3 scripts/admin/apply_codeql_default_setup_v1.py > /tmp/codeql-dry-run.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/codeql-dry-run.json', encoding='utf-8'))
          assert report['result'] == 'DRY_RUN_VALID'
          assert report['production_candidate'] is False
          assert report['release_ready'] is False
          PY

      - name: Publish bounded repair commit to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/admin/apply_codeql_default_setup_v1.py scripts/ci/test_codeql_default_setup_v1.py docs/runbooks/TRNM_CODEQL_DEFAULT_SETUP_V1.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'security(m17): stabilize CodeQL evidence read window' \
            -m 'Require an explicit settings-verification freeze and ticket, then repeat the complete live configuration and exact-source check/suite/workflow verification. Any drift fails closed; one-shot carriers delete themselves.' \
            -m 'Primary-Module: M17' \
            -m 'Production-Authority: false'
          git push origin "HEAD:${TARGET_BRANCH}"
