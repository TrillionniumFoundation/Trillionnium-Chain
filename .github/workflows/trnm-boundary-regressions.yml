name: trnm-boundary-regressions

on:
  pull_request:
  push:
    branches:
      - main
      - work/plan-v2-full-gap-closure-20260902
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-boundary-regressions-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: UTC
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  TRNM_CARGO_OFFLINE_POLICY: "not-applicable"

jobs:
  boundary-regressions:
    name: boundary-regressions-${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [head, prospective-merge]
    env:
      TRNM_EXPECTED_SOURCE_SHA: ${{ matrix.source == 'head' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
    defaults:
      run:
        working-directory: trillionnium-chain
        shell: bash
    steps:
      - name: Checkout the explicitly named source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          path: trillionnium-chain
          persist-credentials: false
      - name: Verify source and project boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRNM_EXPECTED_SOURCE_SHA}"
          git rev-parse HEAD HEAD^{tree}
          bash scripts/project-preflight.sh --audit
      - name: Run documentation false-pass mutants and actual coverage gate
        run: |
          set -euo pipefail
          python3 scripts/ci/test_module_coverage_guard_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
      - name: Install repository-pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: trillionnium-chain/.node-version
          cache: npm
          cache-dependency-path: trillionnium-chain/web4-frontend/package-lock.json
      - name: Install pinned npm and locked frontend dependencies
        working-directory: trillionnium-chain/web4-frontend
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0
          npm ci
      - name: Validate frontend contracts and consumer regression
        working-directory: trillionnium-chain/web4-frontend
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:unit
          npm run test:contract
      - name: Require source and lockfiles unchanged
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
