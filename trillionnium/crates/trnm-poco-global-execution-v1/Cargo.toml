[package]
name = "trnm-poco-global-execution-v1"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Trillionnium Contributors"]
publish = false

[package.metadata.trnm]
lane = "poco-ai-native-v1-global-execution-checkpoint-candidate"
protocol = "poco-ai-native-v1"
classification = "candidate-non-normative"
certified_da_complete_retrieval_before_preview = true
agent_market_pre_vote_preview = true
verify_challenge_pre_vote_preview = true
mvcc_fee_pre_vote_preview = true
consumption_settlement_pre_vote_preview = true
candidate_composite_root = true
normative_application_jmt_root = false
normative_agent_transaction_wire = false
whole_node_validation_sequence_cas = true
whole_node_finalization_cas = true
terminal_facts_single_transaction = true
terminal_checkpoint_history_audit = true
order_binding_owner_seam = true
inert_order_binding_create_material = true
order_binding_positive_carrier_issuer = false
normal_build_finalization_owner_issuer = true
source_plane_finalization_apply = true
order_state_membership_binding = true
anti_whole_store_rollback_authority = false
multi_level_speculative_overlay = false
node_process_integration = false
g2_global_complete = false
protocol_implementation_complete = false
normative_freeze = false
production_candidate = false
activation = false

[features]
default = []

[dependencies]
borsh = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
trnm-poco-agent-market-v1 = { path = "../trnm-poco-agent-market-v1" }
trnm-poco-consumption-settlement-v1 = { path = "../trnm-poco-consumption-settlement-v1" }
trnm-poco-da-v1 = { path = "../trnm-poco-da-v1" }
trnm-poco-mvcc-fee-v1 = { path = "../trnm-poco-mvcc-fee-v1" }
trnm-poco-order-application-v1 = { path = "../trnm-poco-order-application-v1" }
trnm-poco-order-finality-verifier-v1 = { path = "../trnm-poco-order-finality-verifier-v1" }
trnm-poco-order-types-v1 = { path = "../trnm-poco-order-types-v1" }
trnm-poco-verify-challenge-v1 = { path = "../trnm-poco-verify-challenge-v1" }

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
trnm-poco-order-finality-verifier-v1 = { path = "../trnm-poco-order-finality-verifier-v1", features = ["test-support"] }
