name: trnm-a18-registry-sync

on:
  push:
    branches:
      - feature/chain-a18-repository-truth-ci-hardening-v1-20260830
    paths:
      - .github/workflows/trnm-a18-registry-sync.yml

permissions:
  contents: write

concurrency:
  group: trnm-a18-registry-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-generated-registry:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-a18-repository-truth-ci-hardening-v1-20260830' &&
      github.actor == 'Tomasrgbsf'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-a18-repository-truth-ci-hardening-v1-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Generate the canonical decoder registry
        run: |
          set -euo pipefail
          target=docs/protocol/poco-bft-v0/schema/decoder-error-registry-v0.json
          python3 scripts/ci/check_poco_bft_v0_registry.py --emit > "${target}.tmp"
          mv "${target}.tmp" "${target}"
          bash scripts/ci/check_poco_bft_v0_registry.sh
          git diff --check
      - name: Commit generated artifact and remove one-shot writer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/protocol/poco-bft-v0/schema/decoder-error-registry-v0.json
          git rm .github/workflows/trnm-a18-registry-sync.yml
          git diff --cached --check
          git commit -m "fix(protocol): synchronize generated decoder registry"
          git push origin "HEAD:${GITHUB_REF_NAME}"
