name: TRNM one-shot CodeQL evidence stability repair

on:
  push:
    branches:
      - automation/apply-codeql-evidence-stability-20260909

permissions:
  contents: write

concurrency:
  group: trnm-one-shot-codeql-evidence-stability-v2
  cancel-in-progress: false

jobs:
  apply-reviewed-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_TARGET_SHA: d12a5ab584d86429c2963c75c6a5ac28f7165792
      PATCH_PATH: .trnm/one-shot/codeql-evidence-stability.patch
      WORKFLOW_PATH: .github/workflows/trnm-one-shot-codeql-evidence-stability.yml
      TARGET_BRANCH: security/codeql-default-setup-v1-20260909
    steps:
      - name: Check out isolated execution branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify target and closed input surface
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/automation/apply-codeql-evidence-stability-20260909"
          test "$(git rev-parse origin/${TARGET_BRANCH})" = "${EXPECTED_TARGET_SHA}"
          actual="$(git diff --name-only "${EXPECTED_TARGET_SHA}"..HEAD | LC_ALL=C sort)"
          test "${actual}" = "${WORKFLOW_PATH}"
          git diff --quiet
          git diff --cached --quiet
          test -f "${PATCH_PATH}"

      - name: Apply deterministic guarded source transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one guarded match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          admin = Path("scripts/admin/apply_codeql_default_setup_v1.py")
          tests = Path("scripts/ci/test_codeql_default_setup_v1.py")
          runbook = Path("docs/runbooks/TRNM_CODEQL_DEFAULT_SETUP_V1.md")

          inventory_function = r'''
          def required_check_inventory_snapshot(
              api: GitHubApi,
              repository: str,
              evidence_sha: str,
              required_names: list[str],
          ) -> dict[str, Any]:
              """Capture the complete authority-bearing check inventory generation."""

              require(set(required_names) == REQUIRED_CHECK_NAMES, "required check set drift")
              all_runs, _count = _list_check_runs(api, repository, evidence_sha)
              snapshot: list[dict[str, Any]] = []
              for run in all_runs:
                  name = run.get("name")
                  if name not in REQUIRED_CHECK_NAMES:
                      continue
                  app = run.get("app")
                  require(isinstance(app, dict), f"check {name} app identity missing")
                  owner = app.get("owner")
                  require(isinstance(owner, dict), f"check {name} app owner missing")
                  snapshot.append(
                      {
                          "id": run["id"],
                          "name": name,
                          "head_sha": run.get("head_sha"),
                          "status": run.get("status"),
                          "conclusion": run.get("conclusion"),
                          "started_at": run.get("started_at"),
                          "completed_at": run.get("completed_at"),
                          "details_url": run.get("details_url"),
                          "external_id": run.get("external_id"),
                          "check_suite_id": _suite_id(run, str(name)),
                          "app": {
                              "id": app.get("id"),
                              "slug": app.get("slug"),
                              "owner": owner.get("login"),
                          },
                      }
                  )
              snapshot.sort(key=lambda item: (str(item["name"]), int(item["id"])))
              return {
                  "evidence_sha": evidence_sha,
                  "required_run_count": len(snapshot),
                  "required_runs": snapshot,
              }


          '''.lstrip()
          replace_once(admin, "def latest_check_runs(\n", inventory_function + "def latest_check_runs(\n")

          replace_once(
              admin,
              '    parser.add_argument("--acknowledge-change-freeze", action="store_true")\n',
              '    parser.add_argument("--acknowledge-change-freeze", action="store_true")\n'
              '    parser.add_argument(\n'
              '        "--acknowledge-settings-verification-freeze", action="store_true"\n'
              '    )\n',
          )

          old_validation = '''    if args.verify_evidence:
              require(
                  args.verify_live,
                  "--verify-evidence requires --verify-live in the same invocation",
              )
              require(args.evidence_sha is not None, "--evidence-sha required")
              require(args.validation_run_id is not None, "--validation-run-id required")
          '''
          new_validation = old_validation + '''        require(
                  args.acknowledge_settings_verification_freeze,
                  "--acknowledge-settings-verification-freeze is required with "
                  "--verify-evidence",
              )
              verification_ticket = os.environ.get(
                  "TRNM_CODEQL_SETTINGS_VERIFICATION_TICKET", ""
              )
              require(
                  verification_ticket.strip() != "",
                  "TRNM_CODEQL_SETTINGS_VERIFICATION_TICKET is required",
              )
          else:
              verification_ticket = ""
          '''
          replace_once(admin, old_validation, new_validation)

          replace_once(
              admin,
              '        "evidence": None,\n        "changed": False,\n',
              '        "evidence": None,\n'
              '        "evidence_inventory_before": None,\n'
              '        "evidence_inventory_after": None,\n'
              '        "changed": False,\n',
          )
          replace_once(
              admin,
              '        "branch_observations": [],\n        "production_candidate": False,\n',
              '        "branch_observations": [],\n'
              '        "settings_verification_ticket": None,\n'
              '        "settings_verification_freeze_acknowledged": False,\n'
              '        "production_candidate": False,\n',
          )

          old_evidence = '''    if args.verify_evidence:
              assert report["live_after"] is not None
              report["evidence"] = verify_exact_source_checks(
                  api,
                  repository,
                  args.evidence_sha,
                  config["required_check_names"],
                  live_updated_at=report["live_after"]["updated_at"],
                  validation_run_id=args.validation_run_id,
                  trusted_producers=config["trusted_check_producers"],
                  analysis_workflow_path=config["analysis_workflow_path"],
              )
          '''
          new_evidence = '''    if args.verify_evidence:
              assert report["live_after"] is not None
              initial_live = report["live_after"]
              report["live_before"] = initial_live
              report["settings_verification_ticket"] = verification_ticket
              report["settings_verification_freeze_acknowledged"] = True
              report["evidence_inventory_before"] = required_check_inventory_snapshot(
                  api,
                  repository,
                  args.evidence_sha,
                  config["required_check_names"],
              )
              report["evidence"] = verify_exact_source_checks(
                  api,
                  repository,
                  args.evidence_sha,
                  config["required_check_names"],
                  live_updated_at=initial_live["updated_at"],
                  validation_run_id=args.validation_run_id,
                  trusted_producers=config["trusted_check_producers"],
                  analysis_workflow_path=config["analysis_workflow_path"],
              )
              final_live = verify_live_setup(api, repository, config)
              require(
                  final_live == initial_live,
                  "live default setup changed during evidence verification",
              )
              report["evidence_inventory_after"] = required_check_inventory_snapshot(
                  api,
                  repository,
                  args.evidence_sha,
                  config["required_check_names"],
              )
              require(
                  report["evidence_inventory_after"]
                  == report["evidence_inventory_before"],
                  "required CodeQL check inventory changed during evidence verification",
              )
              report["live_after"] = final_live
          '''
          replace_once(admin, old_evidence, new_evidence)

          test_block = r'''
              def evidence_argv(self) -> list[str]:
                  return [
                      "--verify-live",
                      "--verify-evidence",
                      "--acknowledge-settings-verification-freeze",
                      "--evidence-sha",
                      self.evidence_sha,
                      "--validation-run-id",
                      str(self.validation_run_id),
                  ]

              def evidence_env(self) -> dict[str, str]:
                  return {
                      "GH_TOKEN": "token",
                      "TRNM_CODEQL_SETTINGS_VERIFICATION_TICKET": "issue-88/read-window",
                  }

              def configure_main_evidence(
                  self,
                  *,
                  first_live: dict[str, object] | None = None,
                  final_live: dict[str, object] | None = None,
                  final_checks: list[dict[str, object]] | None = None,
              ) -> None:
                  checks = self.successful_checks()
                  final_checks = checks if final_checks is None else final_checks
                  first_live = self.live_shape() if first_live is None else first_live
                  final_live = first_live if final_live is None else final_live
                  FakeApi.responses = {
                      ("GET", self.setup_path()): [
                          self.response(200, first_live),
                          self.response(200, final_live),
                      ],
                      ("GET", self.checks_path()): [
                          self.response(200, {"total_count": len(checks), "check_runs": checks}),
                          self.response(200, {"total_count": len(checks), "check_runs": checks}),
                          self.response(200, {"total_count": len(final_checks), "check_runs": final_checks}),
                      ],
                      ("GET", self.suite_path(self.analysis_suite_id)): [
                          self.response(200, self.suite(self.analysis_suite_id, "analysis"))
                      ],
                      ("GET", self.suite_path(self.aggregate_suite_id)): [
                          self.response(200, self.suite(self.aggregate_suite_id, "aggregate"))
                      ],
                      ("GET", self.validation_path()): [
                          self.response(200, self.validation_run())
                      ],
                  }

              def test_cli_evidence_requires_settings_freeze_and_ticket(self) -> None:
                  argv = [
                      "--verify-live", "--verify-evidence", "--evidence-sha",
                      self.evidence_sha, "--validation-run-id", str(self.validation_run_id),
                  ]
                  with mock.patch.object(MODULE, "GitHubApi", FakeApi), mock.patch.dict(
                      os.environ, {"GH_TOKEN": "token"}, clear=True
                  ), self.assertRaisesRegex(MODULE.CodeqlSetupError, "acknowledge-settings-verification-freeze"):
                      MODULE.main(argv)
                  argv.insert(2, "--acknowledge-settings-verification-freeze")
                  with mock.patch.object(MODULE, "GitHubApi", FakeApi), mock.patch.dict(
                      os.environ, {"GH_TOKEN": "token"}, clear=True
                  ), self.assertRaisesRegex(MODULE.CodeqlSetupError, "TRNM_CODEQL_SETTINGS_VERIFICATION_TICKET"):
                      MODULE.main(argv)

              def test_cli_evidence_accepts_stable_configuration_and_inventory(self) -> None:
                  self.configure_main_evidence()
                  stdout = io.StringIO()
                  with mock.patch.object(MODULE, "GitHubApi", FakeApi), mock.patch.dict(
                      os.environ, self.evidence_env(), clear=True
                  ), contextlib.redirect_stdout(stdout):
                      self.assertEqual(MODULE.main(self.evidence_argv()), 0)
                  report = json.loads(stdout.getvalue())
                  self.assertEqual(report["result"], "VERIFIED")
                  self.assertEqual(report["live_before"], report["live_after"])
                  self.assertEqual(report["evidence_inventory_before"], report["evidence_inventory_after"])
                  self.assertTrue(report["settings_verification_freeze_acknowledged"])

              def test_cli_evidence_rejects_live_configuration_generation_drift(self) -> None:
                  first = self.live_shape()
                  final = dict(first)
                  final["updated_at"] = "2026-09-09T00:10:00Z"
                  self.configure_main_evidence(first_live=first, final_live=final)
                  stdout = io.StringIO()
                  with mock.patch.object(MODULE, "GitHubApi", FakeApi), mock.patch.dict(
                      os.environ, self.evidence_env(), clear=True
                  ), contextlib.redirect_stdout(stdout), self.assertRaisesRegex(
                      MODULE.CodeqlSetupError, "changed during evidence verification"
                  ):
                      MODULE.main(self.evidence_argv())
                  self.assertEqual(stdout.getvalue(), "")

              def test_cli_evidence_rejects_check_inventory_generation_drift(self) -> None:
                  final_checks = self.successful_checks()
                  final_checks.append(self.check(
                      "CodeQL", check_id=901, started_at="2026-09-09T00:04:00Z",
                      completed_at="2026-09-09T00:05:00Z", conclusion="failure",
                  ))
                  self.configure_main_evidence(final_checks=final_checks)
                  stdout = io.StringIO()
                  with mock.patch.object(MODULE, "GitHubApi", FakeApi), mock.patch.dict(
                      os.environ, self.evidence_env(), clear=True
                  ), contextlib.redirect_stdout(stdout), self.assertRaisesRegex(
                      MODULE.CodeqlSetupError, "check inventory changed"
                  ):
                      MODULE.main(self.evidence_argv())
                  self.assertEqual(stdout.getvalue(), "")

          '''.lstrip("\n")
          replace_once(
              tests,
              "    def test_apply_requires_mutation_freeze_and_ticket(self) -> None:\n",
              test_block + "    def test_apply_requires_mutation_freeze_and_ticket(self) -> None:\n",
          )

          replace_once(
              runbook,
              '```bash\nGH_TOKEN="${SECURITY_EVENTS_READ_TOKEN}" \\\n',
              '```bash\nexport TRNM_CODEQL_SETTINGS_VERIFICATION_TICKET="issue-88/read-window-id"\n'
              'GH_TOKEN="${SECURITY_EVENTS_READ_TOKEN}" \\\n',
          )
          replace_once(
              runbook,
              '  --verify-evidence \\\n  --evidence-sha "${EXACT_SOURCE_SHA}" \\\n',
              '  --verify-evidence \\\n'
              '  --acknowledge-settings-verification-freeze \\\n'
              '  --evidence-sha "${EXACT_SOURCE_SHA}" \\\n',
          )
          marker = "Retain the live configuration response, PATCH response"
          addition = (
              "Evidence acceptance also requires an independently enforced settings-change "
              "freeze and a non-empty verification ticket. The verifier snapshots the complete "
              "required-check inventory, reads the canonical live setup, verifies the checks, "
              "then reads both authorities again. It rejects any settings generation or required "
              "check inventory change during the read window.\n\n"
          )
          replace_once(runbook, marker, addition + marker)
          PY
          git rm "${PATCH_PATH}" "${WORKFLOW_PATH}"
          git diff --check

      - name: Run adversarial regression corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/admin/apply_codeql_default_setup_v1.py scripts/ci/test_codeql_default_setup_v1.py
          python3 scripts/ci/test_codeql_default_setup_v1.py
          python3 scripts/admin/apply_codeql_default_setup_v1.py > /tmp/codeql-dry-run.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/codeql-dry-run.json', encoding='utf-8'))
          assert report['result'] == 'DRY_RUN_VALID'
          assert report['production_candidate'] is False
          assert report['release_ready'] is False
          PY

      - name: Publish bounded repair commit to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/admin/apply_codeql_default_setup_v1.py scripts/ci/test_codeql_default_setup_v1.py docs/runbooks/TRNM_CODEQL_DEFAULT_SETUP_V1.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'security(m17): stabilize CodeQL evidence read window' \
            -m 'Require an explicit settings-verification freeze and ticket, verify unchanged live setup generation, and compare complete required-check inventory snapshots before accepting evidence. The one-shot carriers delete themselves.' \
            -m 'Primary-Module: M17' \
            -m 'Production-Authority: false'
          git push origin "HEAD:${TARGET_BRANCH}"
