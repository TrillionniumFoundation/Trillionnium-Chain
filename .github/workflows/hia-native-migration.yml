        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout the pinned HIA compiler source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: hia-toolchain
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            hepta
            tools
            examples
            docs
            tests
            formal
      - name: Bind exact source and finite Work Host scope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-work-owner-observations"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-work-owner-observations/source-before.json" 2>&1 | tee "$RUNNER_TEMP/hia-work-owner-observations/source-before.log"
          bash scripts/project-preflight.sh --audit
          python3 -B hia/tools/check_migration.py
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA compiler identity differs from the pinned native compiler')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Install the exact original compiler and standard library source
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rust-src
      - name: Refuse altered Work Host sources and incomplete CI evidence
        run: |
          set -euo pipefail
          python3 -B -m hia.tools.qualify_work_owner_ci controls 2>&1 | tee "$RUNNER_TEMP/hia-work-owner-observations/integrity.log"
      - name: Execute complete same-worker Host resource W1 and real fault traces
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.work_owner.qualify --output "$RUNNER_TEMP/hia-work-owner-native" --require-trace 2>&1 | tee "$RUNNER_TEMP/hia-work-owner-observations/native.log"
      - name: Require all original same-worker histories and retained Host tests
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.work_owner.rust_oracle --repository "$PWD" --bundle "$RUNNER_TEMP/hia-work-owner-native" --output "$RUNNER_TEMP/hia-work-owner-original" --target-dir "$RUNNER_TEMP/hia-work-owner-cargo-target" 2>&1 | tee "$RUNNER_TEMP/hia-work-owner-observations/original.log"
      - name: Verify all committed source bytes after success or failure
        if: always()
        run: |
          set -euo pipefail
