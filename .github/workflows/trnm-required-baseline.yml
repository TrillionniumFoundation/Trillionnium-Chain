# Separate annotated diagnostic tag; never required pull-request qualification.
name: trnm-required-baseline
run-name: H5DF owned capability fork errno (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-owned-capability-fork-errno-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owned_observation_capability:
    name: Owned observation capability (diagnostic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check scoped inherited perf capability on an owned fixture
        shell: bash
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          python3 -B - <<'TRNM_CAPABILITY_HELPERS'
          import base64,hashlib,json,os,stat,zlib
          from pathlib import Path
          directory=Path(os.environ["RUNNER_TEMP"])/'owned-capability-inputs'
          directory.mkdir(mode=0o700)
          if directory.is_symlink() or stat.S_IMODE(directory.stat().st_mode)!=0o700 or directory.stat().st_uid!=os.geteuid(): raise ValueError("private owned helper directory")
          entries=[{'name': 'owned_capability.c', 'bytes': 35713, 'sha256': 'fb1b7895692e3b5f0f5563fadec4d6ccc785c20b74a5ecd67cae76855efa07a8', 'gzip_bytes': 10363, 'gzip_sha256': '5a407d057a373a54e98492c6c7a0e9d8e3f6a4f0bdeb524edec2ea21d6cd010a', 'gzip_base64': ''}, {'name': 'run_owned_capability.py', 'bytes': 14772, 'sha256': '059abab1a40c6a774a316d68996539a38857cbbbb1ef69c1176335248e8bb817', 'gzip_bytes': 5057, 'gzip_sha256': '347f2271548e445ff74041aff55d61e9688a562f17f45cfed1a195e36b0bef75', 'gzip_base64': ''}]
          proofs=[]
          for item in entries:
              packed=base64.b64decode(item["gzip_base64"],validate=True)
              if len(packed)!=item["gzip_bytes"] or hashlib.sha256(packed).hexdigest()!=item["gzip_sha256"]: raise ValueError("gzip pin")
              decoder=zlib.decompressobj(31)
              raw=decoder.decompress(packed,item["bytes"]+1)
              if (not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or len(raw)!=item["bytes"]
                  or hashlib.sha256(raw).hexdigest()!=item["sha256"]): raise ValueError("bounded exact helper bytes")
              if Path(item["name"]).name!=item["name"]: raise ValueError("literal helper basename")
              path=directory/item["name"]
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,"wb") as f: f.write(raw);f.flush()
              if path.read_bytes()!=raw: raise ValueError("helper readback")
              proofs.append({"path":str(path),"bytes":len(raw),"sha256":item["sha256"],"gzip_bytes":item["gzip_bytes"],"gzip_sha256":item["gzip_sha256"]})
          with (directory/"decoded-source-pins.json").open("x") as f:
              json.dump({"schema":"trnm-diagnostic-embedded-source-pins-v1","files":proofs,"qualification":False},f,indent=2);f.write("\n")
          TRNM_CAPABILITY_HELPERS
          python3 -B "$RUNNER_TEMP/owned-capability-inputs/run_owned_capability.py"
      - name: Preserve capability evidence or HOLD without qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-observation-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r1-owned-capability/
            ${{ runner.temp }}/owned-capability-inputs/
          if-no-files-found: error
          retention-days: 30
