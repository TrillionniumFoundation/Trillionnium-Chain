name: ops-publish-public-transaction-sequence

on:
  push:
    branches:
      - ops/publish-public-transaction-sequence-20260909

permissions:
  contents: write

concurrency:
  group: ops-publish-public-transaction-sequence-v0
  cancel-in-progress: false

jobs:
  publish:
    name: validate-and-publish-sequence-semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out immutable control payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false

      - name: Check out exact child target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Trillionnium-Chain
          ref: security/public-transaction-sequence-semantics-v0-20260909
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Apply source-bound patch
        shell: bash
        env:
          EXPECTED_BASE: d858d6dcd45d5a7dd94b255bca5df5860f3a0a5c
          EXPECTED_TREE: f7b239de6bd3ec1bd782c429e7a141776314a078
          PATCH_SHA256: b6f4db24a66812317f693ee0f1b377b43ba1f4c3e0d222c93f32b79222e32d26
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$EXPECTED_BASE"
          patch_file="$RUNNER_TEMP/public-transaction-sequence.diff"
          base64 --decode control/ops-payload/public-transaction-sequence/public-transaction-sequence.diff.gz.b64 \
            | gzip --decompress > "$patch_file"
          echo "$PATCH_SHA256  $patch_file" | sha256sum --check --strict
          git -C target apply --check "$patch_file"
          git -C target apply --index "$patch_file"
          git -C target diff --cached --check
          test "$(git -C target write-tree)" = "$EXPECTED_TREE"

      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_baseline_closure_v1.py
          python3 scripts/ci/check_plan_manifest_pins_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py

      - name: Install exact Rust formatter and compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Validate Rust formatting and focused packages
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          cd target/trillionnium
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 test --locked -p trnm-application-tx-builder-v0
          cargo +1.95.0 clippy --locked -p trnm-application-tx-builder-v0 --all-targets -- -D warnings
          cargo +1.95.0 test --locked -p trnm-poco-node --test g1_process_host_e2e

      - name: Commit and fast-forward child only
        shell: bash
        env:
          EXPECTED_BASE: d858d6dcd45d5a7dd94b255bca5df5860f3a0a5c
          EXPECTED_TREE: f7b239de6bd3ec1bd782c429e7a141776314a078
          TARGET_BRANCH: security/public-transaction-sequence-semantics-v0-20260909
        run: |
          set -euo pipefail
          git -C target config user.name "OpenAI GPT-5.6 Pro"
          git -C target config user.email "noreply@openai.com"
          git -C target commit -m "security(m14): distinguish transaction sequence from crypto nonce" \
            -m "Rename the builder-facing replay-order input and regression surface to transaction_sequence while preserving the frozen protocol wire field named nonce. This removes an unsafe semantic ambiguity without randomizing or weakening deterministic retry binding." \
            -m "Primary-Module: M14" \
            -m "Production-Authority: false"
          test "$(git -C target rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git -C target fetch origin "$TARGET_BRANCH"
          test "$(git -C target rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"
          git -C target push origin "HEAD:refs/heads/$TARGET_BRANCH"
