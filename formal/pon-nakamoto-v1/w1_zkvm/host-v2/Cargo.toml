[package]
name = "trnm-w1-zk-host-v2"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["client", "disable-dev-mode"] }
trnm-w1-zk-methods = { package = "trnm-w1-zk-methods-v2", path = "../methods-v2" }
trnm-w1-zk-relation = { path = "../relation" }

[features]
default = ["statement-v2"]
statement-v2 = []
retained-v2-guest = ["statement-v2", "trnm-w1-zk-methods/retained-v2-guest"]

[[bin]]
name = "w1-staged-prover-v2"
path = "../host/src/bin/w1-staged-prover.rs"
required-features = ["statement-v2"]
