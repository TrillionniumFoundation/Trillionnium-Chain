name: repair-native-poco-gate

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/poco-only-purge-20260909
          fetch-depth: 0
          persist-credentials: true
      - name: Restore workflow truth guard and self-clean
        env:
          PLAN_BASE_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PLAN_BASE_SHA"
          git show "$PLAN_BASE_SHA:scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh" > scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh
          python3 - <<'PY'
          from pathlib import Path

          script = Path("scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh")
          text = script.read_text(encoding="utf-8")
          old_workspace = '''workspace_text = workspace_manifest.read_text(encoding="utf-8")
          legacy_marker = '\"crates/trnm-consensus-app\"'
          if legacy_marker not in workspace_text:
              raise SystemExit(f"{path}: expected excluded migration package marker {legacy_marker!r}")
          '''
          new_workspace = '''workspace_text = workspace_manifest.read_text(encoding="utf-8")
          retired_markers = ('\"crates/trnm-consensus-app\"', '\"crates/trnm-node\"')
          present = [marker for marker in retired_markers if marker in workspace_text]
          if present:
              raise SystemExit(f"{path}: retired consensus package remains in active workspace: {present!r}")
          '''
          if old_workspace not in text:
              raise SystemExit("legacy workspace assertion fixture not found")
          text = text.replace(old_workspace, new_workspace, 1)
          script.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/trnm-poco-bft-v0.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          indices = [i for i, line in enumerate(lines) if line.strip() == "- name: Verify workflow trigger and safety truth"]
          if len(indices) != 1:
              raise SystemExit(f"expected one trigger-truth step, found {len(indices)}")
          i = indices[0]
          next_step = next((j for j in range(i + 1, len(lines)) if lines[j].lstrip().startswith("- name:")), len(lines))
          if not any(line.strip().startswith("run:") for line in lines[i:next_step]):
              wd = next((j for j in range(i + 1, next_step) if lines[j].strip() == "working-directory: trillionnium-chain"), None)
              if wd is None:
                  raise SystemExit("trigger-truth step has no expected working-directory")
              lines.insert(wd + 1, "        run: bash ./scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh --self-test")
          lines = [line for line in lines if "TRNM_CONSENSUS_DELIVERY_DUAL_TRACK_DECISION_2026-08-11.md" not in line]
          workflow.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          chmod +x scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh
          bash scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh --self-test
          rm .github/workflows/repair-native-poco-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/trnm-poco-bft-v0.yml \
                  scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh \
                  .github/workflows/repair-native-poco-gate.yml
          git diff --cached --check
          git commit -m "ci(poco): restore workflow trigger truth guard after native purge"
          git push origin HEAD:chore/poco-only-purge-20260909
