name: PoCO-only convergence R12 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-only-convergence-r12-once-20260910.yml
      - tools/temporary_poco_convergence_r12.sh
      - tools/temporary_poco_semantic_preservation.py

concurrency:
  group: poco-only-final-convergence
  cancel-in-progress: true

permissions:
  contents: write

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r12-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"
  PRODUCTION_PORTS_COMMIT: 2ae1915c39774938dc7c8a0799a1224bb5024f2c
  REMOTE_SIGNER_FIX_COMMIT: 2f01213918e8da288ce5f598447318c9113edaa2

jobs:
  converge:
    name: Qualify and publish semantic-preserving native PoCO tree
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact convergence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned qualification tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          rustc --version
          cargo --version
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked

      - name: Materialize, qualify and publish exact native-only tree
        shell: bash
        run: bash tools/temporary_poco_convergence_r12.sh

      - name: Upload exact failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r12-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/trnm-r12-final-commit.txt
            /tmp/trnm-r12-final-tree.txt
            /tmp/trnm-r12-native-only.json
            /tmp/trnm-r12-native-only-final.json
            /tmp/trnm-r12-external-evidence.json
            /tmp/trnm-r12-external-evidence.stdout
            /tmp/trnm-r12-external-evidence.stderr
            /tmp/trnm-r12-workspace-check.log
            /tmp/trnm-r12-contract-check.log
            /tmp/trnm-r12-native-execution-test.log
            /tmp/trnm-r12-raw-key-test.log
            /tmp/trnm-r12-workspace-test.log
            /tmp/trnm-r12-contract-test.log
            /tmp/trnm-r12-contract-clippy.log
            /tmp/trnm-r12-boundary-clippy.log
