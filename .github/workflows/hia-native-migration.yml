  native-components-crypto-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Checkout exact chain candidate and archive history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the pinned HIA compiler source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: hia-toolchain
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            hepta
            tools
            examples
            docs
            tests
            formal
      - name: Bind exact source and finite migration scope
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-observations/source.json"
          bash scripts/project-preflight.sh --audit
          python3 hia/tools/check_migration.py
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA compiler identity differs from the pinned native compiler')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Compile the original Rust reference policies
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 -O hia/tests/rust_reference.rs -o "$RUNNER_TEMP/trnm-hia-rust-reference"
          rustc --edition=2021 --test hia/tests/rust_reference.rs -o "$RUNNER_TEMP/trnm-rust-original-tests"
          "$RUNNER_TEMP/trnm-rust-original-tests"
          cargo build --locked --manifest-path trillionnium/Cargo.toml -p trnm-protocol -p trnm-checkpoint-types -p trnm-crypto-primitives -p trnm-mvcc-fee -p trnm-types --target-dir "$RUNNER_TEMP/original-rust-values" --message-format=json | tee "$RUNNER_TEMP/original-rust-build.jsonl"
          python3 - "$RUNNER_TEMP/original-rust-build.jsonl" "$RUNNER_TEMP" <<'PYCODE'
          import json, os, pathlib, subprocess, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith('{')]
          serde = [row for row in events if row.get('reason') == 'compiler-artifact' and row['target']['name'] == 'serde_json']
          if len(serde) != 1:
              raise SystemExit('one actual locked serde_json artifact required')
          if not serde[0]['package_id'].endswith('serde_json@1.0.149'):
              raise SystemExit('unexpected serde_json package_id: ' + serde[0]['package_id'])
          if set(serde[0]['features']) != {'default', 'std'}:
              raise SystemExit('unexpected serde_json features: ' + repr(serde[0]['features']))
          rlibs = [name for name in serde[0]['filenames'] if name.endswith('.rlib')]
          if len(rlibs) != 1:
              raise SystemExit('one original serde_json rlib required')
          sha2 = [row for row in events if row.get('reason') == 'compiler-artifact'
                  and row['target']['name'] == 'sha2' and row['package_id'].endswith('sha2@0.10.9')]
          if len(sha2) != 1:
              raise SystemExit('one locked sha2 0.10.9 artifact required for the original control-plane crate')
          sha2_rlibs = [name for name in sha2[0]['filenames'] if name.endswith('.rlib')]
          if len(sha2_rlibs) != 1:
              raise SystemExit('one original sha2 rlib required')
          types = [row for row in events if row.get('reason') == 'compiler-artifact'
                   and row['target']['name'] == 'trnm_types']
          if len(types) != 1 or types[0]['features'] != []:
              raise SystemExit('one unchanged original trnm-types dependency profile required')
          types_rlibs = [name for name in types[0]['filenames'] if name.endswith('.rlib')]
          if len(types_rlibs) != 1:
              raise SystemExit('one original trnm-types rlib required')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('HIA_CONTROL_PLANE_SHA2=' + sha2_rlibs[0] + '\n')
              out.write('TRNM_HIA_RUST_TYPES_RLIB=' + types_rlibs[0] + '\n')
          target = pathlib.Path(sys.argv[2]) / 'original-rust-values/debug'
          subprocess.run(['rustc', '--edition=2021', '-O', 'hia/tests/rust_state_reference.rs', '--extern', 'trnm_mvcc_fee=' + str(target / 'libtrnm_mvcc_fee.rlib'), '--extern', 'serde_json=' + rlibs[0], '-L', 'dependency=' + str(target / 'deps'), '-o', str(pathlib.Path(sys.argv[2]) / 'trnm-rust-state')], check=True)
          PYCODE
          rustc --edition=2021 -O hia/tests/rust_protocol_reference.rs --extern trnm_protocol="$RUNNER_TEMP/original-rust-values/debug/libtrnm_protocol.rlib" -L dependency="$RUNNER_TEMP/original-rust-values/debug/deps" -o "$RUNNER_TEMP/trnm-rust-protocol"
          rustc --edition=2021 -O hia/tests/rust_checkpoint_reference.rs --extern trnm_checkpoint_types="$RUNNER_TEMP/original-rust-values/debug/libtrnm_checkpoint_types.rlib" -L dependency="$RUNNER_TEMP/original-rust-values/debug/deps" -o "$RUNNER_TEMP/trnm-rust-checkpoint"
          rustc --edition=2021 -O hia/tests/rust_crypto_reference.rs --extern trnm_crypto_primitives="$RUNNER_TEMP/original-rust-values/debug/libtrnm_crypto_primitives.rlib" -L dependency="$RUNNER_TEMP/original-rust-values/debug/deps" -o "$RUNNER_TEMP/trnm-rust-crypto"
          printf 'TRNM_HIA_RUST_REFERENCE=%s/trnm-hia-rust-reference\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_PROTOCOL_REFERENCE=%s/trnm-rust-protocol\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_CHECKPOINT_REFERENCE=%s/trnm-rust-checkpoint\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_CRYPTO_REFERENCE=%s/trnm-rust-crypto\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_STATE_REFERENCE=%s/trnm-rust-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Execute every assigned cryptographic and types method
        env:
          TRNM_HIA_TRANSFER_REPORT_DIR: ${{ runner.temp }}/hia-transfer-original
          TRNM_HIA_TRANSCRIPT_REPORT_DIR: ${{ runner.temp }}/hia-transcript-original
          TRNM_HIA_KECCAK_EVIDENCE_DIR: ${{ runner.temp }}/hia-keccak-native
          TRNM_HIA_MLDSA_POLY_EVIDENCE_DIR: ${{ runner.temp }}/hia-mldsa-poly-native
        run: |
          set -euo pipefail
          python3 -B hia/tools/qualify.py --require-rust-oracle --shard crypto-types --output "$RUNNER_TEMP/hia-observations/qualification.json" 2>&1 | tee "$RUNNER_TEMP/hia-observations/qualification.log"
      - name: Verify candidate sources remained unchanged
        if: always()
        run: python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-observations/source-after.json"
      - name: Retain success and failure observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-components-crypto-types-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-observations/
            ${{ runner.temp }}/hia-bootstrap/bootstrap.json
            ${{ runner.temp }}/original-rust-build.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: Retain complete original and HIA Transfer observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-transfer-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-transfer-original/
          if-no-files-found: error
          retention-days: 30
      - name: Retain complete original and HIA Transcript observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-transcript-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-transcript-original/
          if-no-files-found: error
          retention-days: 30
      - name: Retain complete native PQ arithmetic observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-pq-arithmetic-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-keccak-native/
            ${{ runner.temp }}/hia-mldsa-poly-native/
          if-no-files-found: error
          retention-days: 30
