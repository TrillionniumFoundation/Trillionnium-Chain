name: PoCO-only convergence R16 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-only-convergence-r16-once-20260910.yml
      - tools/temporary_poco_r16_driver.py

concurrency:
  group: poco-only-final-convergence
  cancel-in-progress: true

permissions:
  contents: write

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r16-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"
  PRODUCTION_PORTS_COMMIT: 2ae1915c39774938dc7c8a0799a1224bb5024f2c
  REMOTE_SIGNER_FIX_COMMIT: 2f01213918e8da288ce5f598447318c9113edaa2

jobs:
  converge:
    name: Deterministically qualify and publish the native PoCO tree
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact convergence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned qualification tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          rustc --version
          cargo --version
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked
          python3 -m py_compile tools/temporary_poco_r16_driver.py

      - name: Prepare deterministic convergence mode
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          MODE="$(python3 tools/temporary_poco_r16_driver.py prepare)"
          test "$MODE" = transform -o "$MODE" = validate
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [[ "$MODE" = transform ]]; then
            bash -n tools/temporary_poco_convergence_r13.sh
            python3 -m py_compile tools/temporary_poco_native_convergence_r13.py
          fi

      - name: Materialize and qualify transformed tree
        if: steps.prepare.outputs.mode == 'transform'
        shell: bash
        run: bash tools/temporary_poco_convergence_r13.sh

      - name: Remove one-shot machinery from an already published product tree
        if: steps.prepare.outputs.mode == 'validate'
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            tools/temporary_poco_r13_postfix.py \
            tools/temporary_poco_r14_postfix.py \
            tools/temporary_poco_r15_postfix.py \
            tools/temporary_poco_r16_driver.py \
            .github/workflows/poco-only-convergence-r14-once-20260910.yml \
            .github/workflows/poco-only-convergence-r15-once-20260910.yml \
            .github/workflows/poco-only-convergence-r16-once-20260910.yml
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git add -A
          git diff --cached --check
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore(poco): remove final one-shot convergence machinery"
          fi
          FINAL_COMMIT="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$FINAL_COMMIT" >/tmp/trnm-r16-final-commit.txt
          printf '%s\n' "$FINAL_TREE" >/tmp/trnm-r16-final-tree.txt
          echo "commit=$FINAL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$FINAL_TREE" >> "$GITHUB_OUTPUT"
          rm -rf /tmp/trnm-r16-final
          git worktree add --detach /tmp/trnm-r16-final "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r16-final rev-parse HEAD)" = "$FINAL_COMMIT"
          test "$(git -C /tmp/trnm-r16-final rev-parse 'HEAD^{tree}')" = "$FINAL_TREE"
          test -z "$(git -C /tmp/trnm-r16-final status --porcelain --untracked-files=all)"

      - name: Verify exact-source repository truth
        if: steps.prepare.outputs.mode == 'validate'
        working-directory: /tmp/trnm-r16-final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.cleanup.outputs.commit }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ steps.cleanup.outputs.tree }}"
          python3 -m compileall -q scripts tools formal conformance
          python3 scripts/ci/check_native_consensus_only.py | tee /tmp/trnm-r16-native-only.json
          bash scripts/ci/check_canonical_development_plan.sh
          bash scripts/ci/check_poco_bft_mainline_truth.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          python3 scripts/ci/test_external_evidence_v1.py
          set +e
          python3 scripts/ci/check_external_evidence_v1.py --require-all \
            --source-commit "$(git rev-parse HEAD)" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --output /tmp/trnm-r16-external-evidence.json \
            >/tmp/trnm-r16-external-evidence.stdout \
            2>/tmp/trnm-r16-external-evidence.stderr
          EXTERNAL_RC=$?
          set -e
          if [[ "$EXTERNAL_RC" -eq 2 ]]; then
            grep -q "external evidence gate remains open" /tmp/trnm-r16-external-evidence.stderr
          else
            test "$EXTERNAL_RC" -eq 0
          fi
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Compile every native and contract target
        if: steps.prepare.outputs.mode == 'validate'
        working-directory: /tmp/trnm-r16-final
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARGO_TARGET_DIR"
          cargo check --manifest-path trillionnium/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r16-workspace-check.log
          cargo check --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r16-contract-check.log

      - name: Execute targeted and complete regression corpus
        if: steps.prepare.outputs.mode == 'validate'
        working-directory: /tmp/trnm-r16-final
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-execution-v0 --lib --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r16-native-execution-test.log
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --test raw_key_boundary --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r16-raw-key-test.log
          timeout --signal=TERM --kill-after=30s 7200s \
            cargo test --manifest-path trillionnium/Cargo.toml \
              --workspace --all-targets --locked --offline --no-fail-fast -j 1 -- \
              --test-threads=1 \
            2>&1 | tee /tmp/trnm-r16-workspace-test.log
          cargo test --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 \
            2>&1 | tee /tmp/trnm-r16-contract-test.log
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute strict production-boundary Clippy
        if: steps.prepare.outputs.mode == 'validate'
        working-directory: /tmp/trnm-r16-final
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -j 1 -- -D warnings \
            2>&1 | tee /tmp/trnm-r16-contract-clippy.log
          cd trillionnium
          : >/tmp/trnm-r16-boundary-clippy.log
          for package in \
            trnm-state trnm-consensus-types trnm-consensus-crypto \
            trnm-consensus-core trnm-consensus-safety-rules \
            trnm-consensus-safety-store trnm-consensus-signer-journal \
            trnm-native-application trnm-native-application-sqlite \
            trnm-native-execution-v0 trnm-durable-file-adapters-v0 \
            trnm-tx-lifecycle-v0 trnm-state-sync-v0 trnm-migration-v0 \
            trnm-control-plane-v0 trnm-release-bundle-v0 trnm-node-boundary-v0 \
            trnm-poco-node-production-v0 trnm-production-adapter-conformance-v0 \
            trnm-poco-node trnm-poco-node-authority trnm-poco-node-io \
            trnm-poco-node-host trnm-poco-node-cli
          do
            echo "strict-clippy package=${package}" | tee -a /tmp/trnm-r16-boundary-clippy.log
            cargo clippy -p "$package" --all-targets --locked --offline -j 1 -- -D warnings \
              2>&1 | tee -a /tmp/trnm-r16-boundary-clippy.log
          done
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish the requalified immutable product tree
        if: steps.prepare.outputs.mode == 'validate'
        working-directory: /tmp/trnm-r16-final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.cleanup.outputs.commit }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ steps.cleanup.outputs.tree }}"
          python3 scripts/ci/check_native_consensus_only.py | tee /tmp/trnm-r16-native-only-final.json
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          test -z "$(git status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE" push origin \
            "${{ steps.cleanup.outputs.commit }}:refs/heads/$TARGET_BRANCH"

      - name: Upload exact failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r16-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/trnm-r13-final-commit.txt
            /tmp/trnm-r13-final-tree.txt
            /tmp/trnm-r13-vector-calibration.log
            /tmp/trnm-r13-native-only.json
            /tmp/trnm-r13-native-only-final.json
            /tmp/trnm-r13-external-evidence.json
            /tmp/trnm-r13-external-evidence.stdout
            /tmp/trnm-r13-external-evidence.stderr
            /tmp/trnm-r13-workspace-check.log
            /tmp/trnm-r13-contract-check.log
            /tmp/trnm-r13-native-execution-test.log
            /tmp/trnm-r13-raw-key-test.log
            /tmp/trnm-r13-workspace-test.log
            /tmp/trnm-r13-contract-test.log
            /tmp/trnm-r13-contract-clippy.log
            /tmp/trnm-r13-boundary-clippy.log
            /tmp/trnm-r16-final-commit.txt
            /tmp/trnm-r16-final-tree.txt
            /tmp/trnm-r16-native-only.json
            /tmp/trnm-r16-native-only-final.json
            /tmp/trnm-r16-external-evidence.json
            /tmp/trnm-r16-external-evidence.stdout
            /tmp/trnm-r16-external-evidence.stderr
            /tmp/trnm-r16-workspace-check.log
            /tmp/trnm-r16-contract-check.log
            /tmp/trnm-r16-native-execution-test.log
            /tmp/trnm-r16-raw-key-test.log
            /tmp/trnm-r16-workspace-test.log
            /tmp/trnm-r16-contract-test.log
            /tmp/trnm-r16-contract-clippy.log
            /tmp/trnm-r16-boundary-clippy.log
