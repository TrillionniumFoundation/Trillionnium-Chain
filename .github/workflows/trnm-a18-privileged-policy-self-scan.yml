name: trnm-a18-privileged-policy-self-scan

on:
  push:
    branches:
      - feature/chain-a18-repository-truth-ci-hardening-v1-20260830
    paths:
      - .github/workflows/trnm-a18-privileged-policy-self-scan.yml

permissions:
  contents: write

concurrency:
  group: trnm-a18-privileged-policy-self-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-privileged-policy-self-scan:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-a18-repository-truth-ci-hardening-v1-20260830' &&
      github.actor == 'Tomasrgbsf'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-a18-repository-truth-ci-hardening-v1-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Repair the renamed privileged policy self-exemption
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_privileged_cargo_offline_policy.sh")
          text = path.read_text(encoding="utf-8")
          old = (
              "    scripts/check_cargo_offline_policy.sh|"
              "scripts/check_cargo_offline_policy_test.sh)"
          )
          new = (
              "    scripts/check_cargo_offline_policy.sh|"
              "scripts/check_privileged_cargo_offline_policy.sh|"
              "scripts/check_cargo_offline_policy_test.sh)"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected privileged policy self-exemption count")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git rm .github/workflows/trnm-a18-privileged-policy-self-scan.yml
          bash scripts/check_cargo_offline_policy.sh --worktree
          bash scripts/check_ci_runner_policy.sh --worktree
          git diff --check
      - name: Commit the static policy repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_privileged_cargo_offline_policy.sh
          git diff --cached --check
          git commit -m "fix(ci): exempt renamed privileged policy from self-scan"
          git push origin "HEAD:${GITHUB_REF_NAME}"
