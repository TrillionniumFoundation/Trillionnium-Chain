name: Pure PoN focused native integration
on:
  pull_request:
    paths:
      - .github/workflows/pon-pure-focused-integration.yml
      - trillionnium/**
      - tests/fuzz/**
      - scripts/ci/capture_pure_pon_campaign.py
      - scripts/ci/check_pure_pon_cost_campaign.py
      - scripts/ci/test_check_pure_pon_cost_campaign.py
      - scripts/ci/check_pure_pon_ingress_campaign.py
      - scripts/ci/test_check_pure_pon_ingress_campaign.py
      - scripts/ci/capture_pure_pon_rejection_tail.py
      - scripts/ci/check_pure_pon_rejection_tail.py
      - scripts/ci/test_check_pure_pon_rejection_tail.py
      - scripts/refresh_distributed_source_inventory.py
permissions:
  contents: read
concurrency:
  # An exact candidate's focused evidence does not replace or cancel the
  # repository's longer required head/prospective-merge acceptance lanes.
  group: pon-pure-focused-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  native-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "1"
      RUSTUP_TOOLCHAIN: "1.95.0"
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the exact candidate without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin source and isolate build and observation directories
        run: |
          set -euo pipefail
          echo "CARGO_HOME=$RUNNER_TEMP/pure-pon-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/pure-pon-target" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/pure-pon-observations" >> "$GITHUB_ENV"
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/pure-pon-observations/source.json"
          bash scripts/project-preflight.sh --audit
      - name: Install the exact native compiler and checks
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Verify actual source contracts and negative controls
        run: |
          set -euo pipefail
          python3 scripts/ci/check_repository.py 2>&1 | tee "$OUT/repository.log"
          python3 scripts/refresh_distributed_source_inventory.py --check 2>&1 | tee "$OUT/inventory.log"
          python3 scripts/ci/test_ci_source_integrity.py 2>&1 | tee "$OUT/source-negatives.log"
          python3 scripts/ci/test_check_pure_pon_cost_campaign.py 2>&1 | tee "$OUT/cost-reader-negatives.log"
          python3 scripts/ci/test_check_pure_pon_ingress_campaign.py 2>&1 | tee "$OUT/ingress-reader-negatives.log"
          python3 scripts/ci/test_check_pure_pon_rejection_tail.py 2>&1 | tee "$OUT/rejection-tail-reader-negatives.log"
      - name: Verify locked graph and formatting
        run: |
          set -euo pipefail
          cargo +1.95.0 metadata --locked --format-version 1 --manifest-path trillionnium/Cargo.toml > "$OUT/cargo-graph.json"
          cargo +1.95.0 fmt --manifest-path trillionnium/Cargo.toml --all -- --check 2>&1 | tee "$OUT/fmt.log"
      - name: Run retained crypto and wire tests including real PQ vectors
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-crypto-primitives -p trnm-protocol --all-targets --all-features -- --test-threads=1 2>&1 | tee "$OUT/crypto-wire-tests.log"
      - name: Run actual public resource, bootstrap, replay and CLI controls
        run: |
          set -euo pipefail
          for selector in 'ingress::public_v3::' 'public_task_bootstrap::' 'pq_authority::'; do
            cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib "$selector" -- --show-output --test-threads=1 2>&1 | tee "$OUT/native-${selector//:/_}.log"
          done
          cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --test pure_pon_cli -- --show-output --test-threads=1 2>&1 | tee "$OUT/pure-cli.log"
      - name: Require the real-wall mining counterexample and future-median control
        run: |
          set -euo pipefail
          cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --test mining_timestamp_liveness -- --show-output --test-threads=1 2>&1 | tee "$OUT/mining-timestamp-liveness.log"
          grep -E '^test result: ok\. 2 passed; 0 failed; 0 ignored;' "$OUT/mining-timestamp-liveness.log"
          for selector in valid_future_tip_does_not_suppress_real_wall_clock_successor future_median_still_waits_without_advancing_the_mining_clock; do
            test "$(grep -Fxc "test $selector ... ok" "$OUT/mining-timestamp-liveness.log")" = 1
          done
      - name: Require strict Clippy on all modified native owners and targets
        run: |
          set -euo pipefail
          cargo +1.95.0 clippy --locked --manifest-path trillionnium/Cargo.toml -p trnm-crypto-primitives -p trnm-protocol -p trnm-pon-node --all-targets --all-features -- -D warnings 2>&1 | tee "$OUT/clippy.log"
      - name: Build all three actual campaigns before timing any
        id: campaign_build
        run: |
          set -euo pipefail
          cargo +1.95.0 build --locked --profile test --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --example pon_pure_cost_campaign --example pon_pure_ingress_campaign 2>&1 | tee "$OUT/campaign-build.log"
          cargo +1.95.0 build --locked --profile test --manifest-path trillionnium/Cargo.toml -p trnm-crypto-primitives --example pon_pure_rejection_tail_campaign 2>&1 | tee "$OUT/rejection-tail-build.log"
      - name: Retain endpoint mutations and paired finite rejection tails
        run: |
          set -euo pipefail
          python3 scripts/ci/capture_pure_pon_rejection_tail.py --binary "$CARGO_TARGET_DIR/debug/examples/pon_pure_rejection_tail_campaign" --output "$OUT/rejection-tail" --concurrency-note "Sequential measurements in this GitHub job; hosted-machine scheduling and external contention are not controlled."
          python3 scripts/ci/check_pure_pon_rejection_tail.py "$OUT/rejection-tail/stdout.jsonl.gz" --output "$OUT/rejection-tail/consistency.json"
      - name: Retain all fixed producer cohorts and failed searches
        if: ${{ !cancelled() && steps.campaign_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/capture_pure_pon_campaign.py --binary "$CARGO_TARGET_DIR/debug/examples/pon_pure_cost_campaign" --output "$OUT/cost" --timeout 960 -- --searches 256 --attempts 8 --rounds 2 --seed 1 --seconds 900
          python3 scripts/ci/check_pure_pon_cost_campaign.py "$OUT/cost/stdout.jsonl.gz" --output "$OUT/cost/consistency.json"
      - name: Retain real unique-trace attack, honest service and cold reopens
        if: ${{ !cancelled() && steps.campaign_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/ci/capture_pure_pon_campaign.py --binary "$CARGO_TARGET_DIR/debug/examples/pon_pure_ingress_campaign" --output "$OUT/ingress" --timeout 180 -- --baseline-seconds 15 --attack-seconds 45 --receivers 2 --attack-workers 4 --max-groups 8192
          python3 scripts/ci/check_pure_pon_ingress_campaign.py "$OUT/ingress/stdout.jsonl.gz" --output "$OUT/ingress/consistency.json"
      - name: Verify final source bytes independently of command success
        if: always()
        run: python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_HEAD"
      - name: Preserve actual success, rejection, timeout and tool failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pure-pon-focused-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pure-pon-observations/
          if-no-files-found: error
          retention-days: 30
