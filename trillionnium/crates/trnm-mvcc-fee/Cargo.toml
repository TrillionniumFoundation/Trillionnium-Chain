[package]
name = "trnm-mvcc-fee"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Trillionnium Contributors"]
publish = false

[package.metadata.trnm]
module = "M06"
role = "portable-component"
profile = "portable-local-v2"
production_activation = false
consensus_authority = false

[features]
default = []

[dependencies]
borsh = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
