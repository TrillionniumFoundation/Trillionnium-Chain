name: trnm-rustfmt-export-temporary

on:
  push:
    branches:
      - fix/chain-p0-runtime-closure-20260916

permissions:
  contents: write

jobs:
  rustfmt-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact rustfmt
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0
      - name: Apply exact workspace formatting once
        run: |
          set -euo pipefail
          (cd trillionnium && cargo fmt --all)
          git diff --check
          if git diff --quiet -- '*.rs'; then
            echo 'rustfmt_changed=false'
            exit 0
          fi
          git config user.name 'trnm-rustfmt-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style(chain): apply exact rustfmt 1.95 output'
          git push origin "HEAD:${GITHUB_REF_NAME}"
