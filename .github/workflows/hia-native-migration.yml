  native-node-commitment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LC_ALL: C
      TRNM_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha
        }}
    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Checkout the exact current chain source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout the pinned HIA compiler source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: hia-toolchain
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            hepta
            tools
            examples
            docs
            tests
            formal
      - name: Bind every current source byte and migration scope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-node-commitment/observations"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-node-commitment/observations/source-before.json" 2>&1 | tee "$RUNNER_TEMP/hia-node-commitment/observations/source-before.log"
          bash scripts/project-preflight.sh --audit
          python3 -B hia/tools/check_migration.py
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA native compiler identity differs')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Download the exact current Node build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: hia-node-pool-node-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt
            }}
          path: ${{ runner.temp }}/hia-node-commitment-download
      - name: Admit every predecessor regular byte and exact lineage
        run: |
          set -euo pipefail
          python3 -B -m hia.tools.qualify_node_pool_ci unpack --kind node --artifact "$RUNNER_TEMP/hia-node-commitment-download/artifact" --output "$RUNNER_TEMP/hia-node-commitment/prior-node" --report "$RUNNER_TEMP/hia-node-commitment/observations/transfer.json" 2>&1 | tee "$RUNNER_TEMP/hia-node-commitment/observations/transfer.log"
      - name: Install the explicitly selected original Rust compiler
        run: |
          set -euo pipefail
          toolchain=1.95.0-x86_64-unknown-linux-gnu
