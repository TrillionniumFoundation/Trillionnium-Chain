[package]
name = "trnm-w1-independent-native-cost"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Retain one implementation without pulling the host's prover/methods graph.
[workspace]
resolver = "2"

[[bin]]
name = "w1-native-cost"
path = "../w1_zkvm/host/src/bin/w1-native-cost.rs"

# Run the original relation's unit tests without a guest toolchain or prover.
[[test]]
name = "complete-relation"
path = "../w1_zkvm/relation/src/lib.rs"

[dependencies]
anyhow = "=1.0.103"
hex = "=0.4.3"
serde_json = "=1.0.149"
sha2 = "=0.10.9"
trnm-w1-zk-relation = { path = "../w1_zkvm/relation" }

[dev-dependencies]
trnm-crypto-primitives = { path = "../../../trillionnium/crates/trnm-crypto-primitives" }
trnm-protocol = { path = "../../../trillionnium/crates/trnm-protocol" }

[profile.release]
debug = 1
incremental = false
