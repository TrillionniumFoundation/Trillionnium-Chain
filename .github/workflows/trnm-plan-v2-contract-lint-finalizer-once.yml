name: Trillionnium Plan v2 Contract Lint Finalizer Once

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/trnm-plan-v2-contract-lint-finalizer-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trnm-plan-v2-contract-lint-finalizer-once
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      ((github.actor == 'ProfAlexQI' || github.actor == 'Franksudoman' ||
      github.actor == 'ProfHepta') && github.triggering_actor == github.actor &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 240
    env:
      TARGET_BRANCH: work/plan-v2-full-gap-closure-20260902
      SELF: .github/workflows/trnm-plan-v2-contract-lint-finalizer-once.yml
    steps:
      - name: Check out exact source with publish lease credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded repairs, qualify exact source, and lease-publish
        shell: bash
        run: |
          set -euo pipefail
          start="$(git rev-parse HEAD)"
          test "$start" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          cargo +1.95.0 --version
          rustc +1.95.0 --version

          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(
                      f"{path}: expected {expected} occurrences, found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          governance = Path("contracts/governance-guard/src/lib.rs")
          governance_text = governance.read_text(encoding="utf-8")
          marker = "    #[allow(clippy::too_many_arguments)]\n    pub fn propose(\n"
          if marker not in governance_text:
              replace_exact(
                  str(governance),
                  "    pub fn propose(\n",
                  "    // Public governance ABI: every argument is independently validated and audited.\n"
                  "    #[allow(clippy::too_many_arguments)]\n"
                  "    pub fn propose(\n",
                  1,
              )

          replace_exact(
              "contracts/settlement-vault/src/lib.rs",
              'assert!(vault.balances.get("ghost").is_none());',
              'assert!(!vault.balances.contains_key("ghost"));',
              1,
          )
          replace_exact(
              "contracts/settlement-vault/src/lib.rs",
              "&event.event_type[..],",
              "event.event_type,",
              1,
          )
          replace_exact(
              "contracts/settlement-vault/src/lib.rs",
              'assert!(vault.balances.get("alice").is_none());',
              'assert!(!vault.balances.contains_key("alice"));',
              2,
          )
          replace_exact(
              "contracts/bridge-relay/src/lib.rs",
              "&vec![replay_sig],",
              "&[replay_sig],",
              1,
          )
          PY

          rm -- "$SELF"
          cargo +1.95.0 fmt --manifest-path contracts/Cargo.toml --all

          python3 - <<'PY'
          import json
          import subprocess

          allowed = {
              ".github/workflows/trnm-plan-v2-contract-lint-finalizer-once.yml",
              "contracts/governance-guard/src/lib.rs",
              "contracts/settlement-vault/src/lib.rs",
              "contracts/bridge-relay/src/lib.rs",
          }
          output = subprocess.run(
              ["git", "status", "--short", "--untracked-files=all"],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          ).stdout
          changed = {line[3:] for line in output.splitlines() if line}
          if changed != allowed:
              raise RuntimeError(
                  f"unexpected repair set: expected={sorted(allowed)} actual={sorted(changed)}"
              )
          truth = json.loads(
              open("config/consensus-mainline.json", encoding="utf-8").read()
          )
          flags = (
              "all_gaps_closed",
              "production_candidate",
              "production_consensus_activation",
              "public_testnet_ready",
              "release_ready",
          )
          promoted = [name for name in flags if truth.get(name) is True]
          if promoted:
              raise RuntimeError(f"external truth was promoted: {promoted}")
          PY

          git diff --check
          git add --all -- \
            "$SELF" \
            contracts/governance-guard/src/lib.rs \
            contracts/settlement-vault/src/lib.rs \
            contracts/bridge-relay/src/lib.rs
          git diff --cached --check
          git config user.name trillionnium-plan-v2-bot
          git config user.email trillionnium-plan-v2-bot@users.noreply.github.com
          git commit -m "fix(plan-v2): close contract lint and workflow policy blockers"
          candidate="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=all)"

          bash scripts/check_ci_runner_policy.sh --head
          bash scripts/check_cargo_offline_policy.sh --head
          python3 scripts/ci/test_module_coverage_guard_v1.py
          bash scripts/check_cargo_offline_policy_test.sh
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_plan_manifest_pins_v1.py
          python3 scripts/ci/check_documentation_reference_closure_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_baseline_closure_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          python3 scripts/ci/check_build_closures_v1.py --verify-cargo-tree
          bash scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          bash scripts/project-preflight.sh --audit

          cargo +1.95.0 fmt --manifest-path contracts/Cargo.toml --all -- --check
          cargo +1.95.0 check --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline
          cargo +1.95.0 test --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline
          cargo +1.95.0 clippy --manifest-path contracts/Cargo.toml \
            --workspace --all-targets --locked --offline -- -D warnings
          cargo +1.95.0 check --manifest-path trillionnium/Cargo.toml \
            --workspace --all-targets --locked --offline

          test "$candidate" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch origin "refs/heads/${TARGET_BRANCH}"
          remote="$(git rev-parse FETCH_HEAD)"
          test "$remote" = "$start"
          git push \
            "--force-with-lease=refs/heads/${TARGET_BRANCH}:${start}" \
            origin "${candidate}:refs/heads/${TARGET_BRANCH}"
          printf 'qualified_candidate=%s\n' "$candidate"
