name: tmp-world-stage-direct-source-v2

on:
  push:
    branches:
      - tmp/world-source-materializer-20260830

permissions:
  contents: write

concurrency:
  group: tmp-world-stage-direct-source-v2
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout transport repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: tmp/world-source-materializer-20260830
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout immutable World candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TrillionniumFoundation/Trillionnium-World
          ref: 2b3a71c34fcbe9b8dac51826d70e65c4553cbba7
          path: world
          fetch-depth: 1
          persist-credentials: false

      - name: Stage validated ordinary World source
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "0"
          RUST_BACKTRACE: "1"
        run: bash scripts/tmp-world-stage-direct-source-v2.sh
