name: full-gap-closure-finality-hardening-fix-v2

on:
  push:
    branches:
      - work/full-gap-closure-20260831
    paths:
      - .github/workflows/full-gap-closure-finality-hardening-fix-v2.yml

permissions:
  contents: write

concurrency:
  group: full-gap-closure-finality-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-one-shot-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/full-gap-closure-20260831
          fetch-depth: 0
          persist-credentials: true
      - name: Repair digest and use line-stable ancestry checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "08f27f955e42649311159312df2c6f978b72310c"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/full-gap-closure-finality-hardening.yml')
          text = path.read_text()
          replacements = {
              '1b54125434d330f34165dd3c15621db58efeae9d42a5ea93aa8caa34b01f7968':
                  'ea95160926c77fe8d0342f60e03bf6ce88903543e37e05e92b76bc5067b72fc6',
              'test "$(git rev-parse HEAD^)" = "68a35c3ed0c725347a5ac440be695762c8e36a33"':
                  'git merge-base --is-ancestor 68a35c3ed0c725347a5ac440be695762c8e36a33 HEAD',
              'test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = ".github/workflows/full-gap-closure-finality-hardening.yml"':
                  'test "$(git rev-parse 68a35c3ed0c725347a5ac440be695762c8e36a33^{tree})" = "baa3f76d77ee094e0ea3f353c54eed27d9e96c2e"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected occurrence count for {old!r}: {text.count(old)}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/full-gap-closure-finality-hardening-fix.yml
          git rm .github/workflows/full-gap-closure-finality-hardening-fix-v2.yml
          git add .github/workflows/full-gap-closure-finality-hardening.yml
          git diff --cached --check
          git commit -m "fix(ci): bind finality patch without indentation coupling"
          git push origin "HEAD:work/full-gap-closure-20260831"
