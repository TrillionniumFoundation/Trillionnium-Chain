name: trnm-poco-convergence-contract

on:
  pull_request:
    paths:
      - 'docs/protocol/poco-convergence-v1/**'
      - 'formal/poco-convergence-v1/**'
      - 'config/poco-convergence-v1.json'
      - '.github/workflows/trnm-poco-convergence-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-poco-convergence-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abstract-contract:
    name: poco-convergence-abstract-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      TRNM_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and execute abstract tests and retained mutants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRNM_EXPECTED_SOURCE_SHA}"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          python3 --version
          python3 formal/poco-convergence-v1/check.py
      - name: State evidence boundary
        shell: bash
        run: echo 'Abstract contract only; not Rust, cryptographic, distributed, physical, migration or production acceptance.'
