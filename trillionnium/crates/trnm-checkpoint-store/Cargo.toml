[package]
name = "trnm-checkpoint-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "trnm-external-node-checkpoint-v2"
path = "src/main.rs"

[package.metadata.trnm]
append_only_hash_chain = true
cross_process_cas = true
strict_scope_expected_target_cas = true
private_key_handling = false
consensus_runtime = false
core_admission = false
authority_rules = false
host_attestation = false
validator_runtime = false
production_signature_producer = false
external_node_checkpoint_operational_integration = false
external_node_checkpoint_production_activation = false
production_candidate = false
module = "M03"
role = "portable-component"
profile = "portable-local-v2"
production_activation = false
consensus_authority = false

[dependencies]
fs2 = "0.4"
libc = "0.2"
sha2 = "0.10"
trnm-checkpoint-types = { version = "0.1.0", path = "../trnm-checkpoint-types" }

[dev-dependencies]
tempfile = "3"
trnm-checkpoint-types = { version = "0.1.0", path = "../trnm-checkpoint-types" }
