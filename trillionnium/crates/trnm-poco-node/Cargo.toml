[package]
name = "trnm-poco-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
autobins = false
autotests = false
publish = false

[features]
default = []
# Raw consensus signing keys are available only to explicitly named fixture and
# process-test builds.  The default node/library build has no direct
# `ed25519-dalek` dependency edge and therefore cannot load or expose a
# `SigningKey`.
fixture-raw-key = ["dep:ed25519-dalek"]
lab-validator-runtime = []
lab-validator-runtime-test-support = [
  "lab-validator-runtime",
  "fixture-raw-key",
  "dep:serde_json",
  "dep:trnm-finality-types",
  "dep:trnm-protocol",
  "trnm-native-application-sqlite/test-support",
]
recovery-process-test-support = [
  "fixture-raw-key",
  "dep:fs2",
]
g2-process-test-support = [
  "fixture-raw-key",
  "dep:tempfile",
]

# The former App-aware recovery modules remain as non-buildable archive source.
# Keeping their cfg names known avoids warnings without restoring a feature or
# dependency edge into the active workspace.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
  'cfg(feature, values("legacy-consensus-app", "recovery-test-support"))',
] }

