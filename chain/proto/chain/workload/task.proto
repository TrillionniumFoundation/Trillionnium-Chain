syntax = "proto3";
package chain.workload;

option go_package = "chain/x/workload/types";

message Task {
  uint64 id = 1;
  string ipfsHash = 2;
  uint64 bounty = 3;
  // Task status (canonical semantics):
  // 0 OPEN
  // 1 ASSIGNED
  // 2 COMMITTED
  // 3 REVEALED (legacy alias: RESULT_SUBMITTED)
  // 4 CHALLENGED
  // 5 COMPLETED
  // 6 SLASHED
  uint64 status = 4;
  string worker = 5;
  string resultHash = 6;
  string creator = 7;
  uint64 challengeDeadlineHeight = 8;
  string challenger = 9;
  uint64 challengeId = 10;
  string commitHash = 11;
  uint64 commitHeight = 12;
  uint64 revealDeadlineHeight = 13;
  string resultUri = 14;
}
