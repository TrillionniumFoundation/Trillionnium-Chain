name: tmp-materialize-final-repository-fix

on:
  push:
    branches:
      - tmp/fix-stale-required-baseline-20260911

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: fix/chain-plan-v2-repository-closure-20260911
      EXPECTED_TARGET_SHA: 06cd0e2d41e155cfa9b90ee83358be0cab79f59d
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and commit the reviewed bounded repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path

          baseline = Path('.github/workflows/trnm-required-baseline.yml')
          legacy = 'scripts/ci/test_legacy_node_cargo_boundary.py'
          text = baseline.read_text(encoding='utf-8')
          if text.count(legacy) != 2:
              raise SystemExit(f'expected exactly two stale baseline references, found {text.count(legacy)}')
          baseline.write_text(
              ''.join(line for line in text.splitlines(keepends=True) if legacy not in line),
              encoding='utf-8',
          )

          poco = Path('.github/workflows/trnm-poco-bft-v0.yml')
          stale_trigger = '      - ".github/workflows/rust-l1-testnet-preflight.yml"\n'
          text = poco.read_text(encoding='utf-8')
          if text.count(stale_trigger) != 2:
              raise SystemExit(f'expected exactly two stale PoCO trigger rows, found {text.count(stale_trigger)}')
          poco.write_text(text.replace(stale_trigger, ''), encoding='utf-8')

          request_path = Path('docs/evidence/repository/EXACT_HEAD_RERUN_REQUEST_V2.json')
          request = json.loads(request_path.read_text(encoding='utf-8'))
          expected = [
              'trnm-required-baseline.yml',
              'trnm-node-commit-exec-focused.yml',
              'trnm-native-poco-runtime-fault-matrix-v1.yml',
              'trnm-documentation-truth.yml',
              'trnm-merge-gates.yml',
          ]
          if request.get('requested_workflows') != expected:
              raise SystemExit(f'unexpected exact-head request inventory: {request.get("requested_workflows")!r}')
          request['requested_workflows'] = [
              'trnm-required-baseline.yml',
              'trnm-node-commit-exec-focused.yml',
              'trnm-native-poco-runtime-fault-matrix-v1.yml',
              'trnm-documentation-truth.yml',
              'trnm-gate-quick-check.yml',
              'trnm-poco-bft-v0.yml',
          ]
          request_path.write_text(json.dumps(request, indent=2) + '\n', encoding='utf-8')

          generator = Path('scripts/ci/generate_release_status_v1.py')
          stale_role = '            "poco_consensus_role": truth["poco_consensus"]["role"],\n'
          text = generator.read_text(encoding='utf-8')
          if text.count(stale_role) != 1:
              raise SystemExit(f'expected one stale release role lookup, found {text.count(stale_role)}')
          generator.write_text(text.replace(stale_role, ''), encoding='utf-8')
          PY

          rm -- \
            .github/workflows/rust-l1-nightly-health.yml \
            .github/workflows/rust-l1-testnet-preflight.yml \
            .github/workflows/trnm-live-devnet-package.yml \
            .github/workflows/trnm-merge-gates.yml

          python3 - <<'PY'
          import subprocess

          expected = {
              'D\t.github/workflows/rust-l1-nightly-health.yml',
              'D\t.github/workflows/rust-l1-testnet-preflight.yml',
              'D\t.github/workflows/trnm-live-devnet-package.yml',
              'D\t.github/workflows/trnm-merge-gates.yml',
              'M\t.github/workflows/trnm-poco-bft-v0.yml',
              'M\t.github/workflows/trnm-required-baseline.yml',
              'M\tdocs/evidence/repository/EXACT_HEAD_RERUN_REQUEST_V2.json',
              'M\tscripts/ci/generate_release_status_v1.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-status'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected bounded diff: expected={sorted(expected)!r} actual={sorted(actual)!r}')
          PY
          ! grep -R -n --fixed-strings 'test_legacy_node_cargo_boundary.py' .github/workflows scripts trillionnium/scripts
          ! grep -R -n --fixed-strings '.github/workflows/rust-l1-testnet-preflight.yml' .github/workflows
          git diff --check
          git config user.name 'OpenAI GPT-5.6 Sol Pro'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'ci(plan-v2): remove retired workflows and repair final truth gates'
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "MATERIALIZED_COMMIT=$(git rev-parse HEAD)"
          echo "MATERIALIZED_TREE=$(git rev-parse 'HEAD^{tree}')"

      - name: Revalidate the immutable committed object
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          export TRNM_EXPECTED_SOURCE_SHA="$(git rev-parse HEAD)"
          python3 scripts/ci/check_repository_truth_v1.py
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_plan_manifest_pins_v1.py
          python3 scripts/ci/check_technical_convergence_v1.py
          python3 scripts/ci/test_technical_convergence_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_required_baseline_closure_v1.py
          python3 scripts/ci/check_node_decomposition_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          python3 scripts/ci/check_build_closures_v1.py
          python3 scripts/ci/check_documentation_reference_closure_v1.py
          bash scripts/check_cargo_offline_policy.sh
          python3 scripts/ci/generate_release_status_v1.py --check-deterministic \
            --output "${RUNNER_TEMP}/trnm-release-status-v1.json"
          python3 -m json.tool "${RUNNER_TEMP}/trnm-release-status-v1.json" >/dev/null
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload immutable Git objects without moving the source branch
        shell: bash
        run: |
          set -euo pipefail
          echo "MATERIALIZED_COMMIT=$(git rev-parse HEAD)"
          echo "MATERIALIZED_TREE=$(git rev-parse 'HEAD^{tree}')"
          git ls-tree HEAD -- \
            .github/workflows/trnm-required-baseline.yml \
            .github/workflows/trnm-poco-bft-v0.yml \
            docs/evidence/repository/EXACT_HEAD_RERUN_REQUEST_V2.json \
            scripts/ci/generate_release_status_v1.py
          set +e
          push_output=$(git push origin "HEAD:refs/heads/${TARGET_BRANCH}" 2>&1)
          push_rc=$?
          set -e
          printf '%s\n' "$push_output"
          if [[ "$push_rc" -eq 0 ]]; then
            echo 'target_branch_updated_directly=true'
            exit 0
          fi
          printf '%s\n' "$push_output" | grep -E -q 'workflow|refusing to allow a GitHub App'
          echo 'target_branch_updated_directly=false; immutable objects uploaded for Git Data admission'
