          bash scripts/project-preflight.sh --audit
          python3 hia/tools/check_migration.py
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA compiler identity differs from the pinned native compiler')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Refuse incomplete or altered typed Store source and corpus bundles
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.typed_store.test_integrity --repository "$PWD" --output "$RUNNER_TEMP/hia-typed-store-observations/integrity.json" 2>&1 | tee "$RUNNER_TEMP/hia-typed-store-observations/integrity.log"
      - name: Execute all native typed Store controls and capture the exact corpus
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.typed_store.qualify --output "$RUNNER_TEMP/hia-typed-store-native" 2>&1 | tee "$RUNNER_TEMP/hia-typed-store-observations/native.log"
      - name: Require actual original Node Rust for every semantic case and all three State tests
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.typed_store.rust_oracle --repository "$GITHUB_WORKSPACE/chain" --bundle "$RUNNER_TEMP/hia-typed-store-native" --output "$RUNNER_TEMP/hia-typed-store-original" --target-dir "$RUNNER_TEMP/hia-typed-store-cargo-target" 2>&1 | tee "$RUNNER_TEMP/hia-typed-store-observations/original-rust.log"
      - name: Bind actual outcomes to the exact native original and capacity lineage
        run: |
          set -euo pipefail
          python3 -B - "$TRNM_TYPED_STAGE" <<'PY_TYPED_BINDING'
          import hashlib, json, os, sys
          from pathlib import Path
          from hia.platform.typed_store.rust_oracle import ORIGINAL_TESTS

          stage = sys.argv[1]
          root = Path(os.environ['RUNNER_TEMP'])
          observations = root / 'hia-typed-store-observations'
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def read(path):
              require(path.is_file() and not path.is_symlink(), 'Missing regular receipt: ' + str(path))
              raw = path.read_bytes()
              return json.loads(raw), hashlib.sha256(raw).hexdigest()
          def original_hash(build):
              return hashlib.sha256(json.dumps(build['original_sources'], sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          expected = {'git_head': os.environ['TRNM_EXPECTED_SOURCE_SHA'],
                      'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': int(os.environ['GITHUB_RUN_ATTEMPT'])}
          if stage == 'native':
              native, native_sha = read(root / 'hia-typed-store-native/report.json')
              comparison, comparison_sha = read(root / 'hia-typed-store-native/native-comparison.json')
              original, original_sha = read(root / 'hia-typed-store-original/report.json')
              require(native['status'] == 'NATIVE_PASS_ORIGINAL_NOT_RUN' and native['native'] == 'PASS', 'Native owner did not pass')
              require(native['original_rust'] == 'NOT_RUN', 'Do not rewrite the native-only original-Rust field')
              require(native['native_controls'] == len(native['controls']) == 603 and native['semantic_cases'] == 392,
                      'Complete frozen native controls and semantic corpus required')
              require(all(row['status'] == 'PASS' for row in native['controls']), 'A native control failed')
              require(comparison['status'] == 'PASS' and len(comparison['cases']) == 392, 'Native comparison incomplete')
              build = comparison['build']
              require(build == native['build'] and build['status'] == 'PASS', 'Native build identities differ')
              require(original['status'] == 'PASS' and original['controls'] == 392 and original['failed'] == 0,
                      'Mandatory actual original Rust did not pass')
              require(original['retained_original_tests'] == list(ORIGINAL_TESTS), 'The three original State tests are required')
              require(original['actual_private_original_apply_slot_state_and_root_called'] is True
                      and original['original_production_function_bytes_preserved'] is True, 'Actual retained Node implementation required')
              require(original['native_comparison_sha256'] == comparison_sha
                      and original['native_source_set_sha256'] == build['source_set_sha256']
                      and original['original_sources'] == build['original_sources']
                      and original['exact_corpus'] == comparison['corpus'], 'Native and actual original source/corpus binding differs')
              lineage = dict(expected, source_set_sha256=build['source_set_sha256'],
                  original_source_set_sha256=original_hash(build), executable_sha256=build['executable']['sha256'],
                  native_source_inputs_match_git_head=True)
              binding = {'schema': 'trnm.hia.typed-store.ci-native-binding.v1', 'status': 'PASS',
                  'lineage': lineage, 'source_inputs': build['source_inputs'],
                  'native_controls': 603, 'semantic_cases': 392, 'original_tests': list(ORIGINAL_TESTS),
                  'native_report_sha256': native_sha, 'original_report_sha256': original_sha,
                  'comparison_sha256': comparison_sha, 'corpus': comparison['corpus'],
                  'whole_node_or_commit_authority': False, 'physical_power_loss_qualified': False}
              with (observations / 'native-binding.json').open('x') as stream:
                  json.dump(binding, stream, sort_keys=True, indent=2)
                  stream.write('\n')
          else:
              previous = {'produce': 'native', 'cold': 'produce', 'bounds': 'cold'}[stage]
              prior = root / ('hia-typed-store-prior-' + previous)
              binding, binding_sha = read(prior / 'native-binding.json')
              require(binding['schema'] == 'trnm.hia.typed-store.ci-native-binding.v1'
                      and binding['status'] == 'PASS', 'Actual native/original dependency binding required')
              require(all(binding['lineage'][key] == value for key, value in expected.items()), 'Native binding belongs to another source/run/attempt')
              report, report_sha = read(root / ('hia-typed-store-' + stage) / 'report.json')
              require(report['schema'] == 'trnm.hia.typed-staging-capacity-stage.v1'
                      and report['status'] == 'PASS' and report['stage'] == stage, 'Physical capacity stage did not pass')
              require(report['lineage'] == binding['lineage'] and report['lineage']['native_source_inputs_match_git_head'] is True,
                      'Capacity differs from exact committed native/original source or executable')
              require(report['build']['source_inputs'] == binding['source_inputs']
                      and original_hash(report['build']) == binding['lineage']['original_source_set_sha256'], 'Complete source maps differ')
              checked = {'stage_report_sha256': report_sha, 'native_binding_sha256': binding_sha}
              if previous != 'native':
                  parent, parent_sha = read(prior / 'report.json')
                  require(parent['status'] == 'PASS' and parent['stage'] == previous
                          and parent['lineage'] == report['lineage']
                          and report['prior_receipt_sha256'] == parent_sha, 'Direct prior receipt link differs')
                  checked['prior_receipt_sha256'] = parent_sha
