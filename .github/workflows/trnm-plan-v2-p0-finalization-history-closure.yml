name: TRNM Plan v2 P0 Finalization History Closure

on:
  push:
    branches:
      - integration/native-poco-a04-a19-a23-qualified-v1-20260901
    paths:
      - .github/workflows/trnm-plan-v2-p0-finalization-history-closure.yml

permissions:
  contents: write

concurrency:
  group: trnm-plan-v2-p0-finalization-history-closure
  cancel-in-progress: false

jobs:
  close-p0:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/native-poco-a04-a19-a23-qualified-v1-20260901
          fetch-depth: 0
          path: trillionnium-chain

      - name: Verify exact carrier and repository boundary
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3c46293e78a125dec9504e51c355a20216341338"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/trnm-plan-v2-p0-finalization-history-closure.yml"
          bash scripts/project-preflight.sh --audit

      - name: Apply descriptor-bound namespace and closed-world schema repair
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          crate = root / "trillionnium/crates/trnm-native-application-sqlite"
          namespace_path = crate / "src/pinned_sqlite_namespace.rs"
          namespace_path.write_text(r'''use std::{
              fs::{self, File, Metadata, OpenOptions},
              path::{Path, PathBuf},
              sync::Arc,
          };

          #[cfg(unix)]
          use std::os::unix::fs::MetadataExt;
          #[cfg(any(
              target_os = "linux",
              target_os = "android",
              target_os = "macos",
              target_os = "ios",
              target_os = "freebsd",
              target_os = "dragonfly",
              target_os = "openbsd",
              target_os = "netbsd"
          ))]
          use std::os::unix::fs::OpenOptionsExt;

          use rusqlite::Connection;

          use crate::error::{error, ValidationStoreErrorCodeV0, ValidationStoreResultV0};

          const SIDECAR_SUFFIXES_V0: [&str; 3] = ["-wal", "-shm", "-journal"];

          #[cfg(any(target_os = "linux", target_os = "android"))]
          const O_NOFOLLOW_V0: i32 = 0o00400000;
          #[cfg(any(
              target_os = "macos",
              target_os = "ios",
              target_os = "freebsd",
              target_os = "dragonfly",
              target_os = "openbsd",
              target_os = "netbsd"
          ))]
          const O_NOFOLLOW_V0: i32 = 0x00000100;

          #[cfg(unix)]
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          struct FileIdentityV0 {
              device: u64,
              inode: u64,
          }

          #[cfg(not(unix))]
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          struct FileIdentityV0;

          #[derive(Debug)]
          struct SidecarAnchorV0 {
              path: PathBuf,
              identity: FileIdentityV0,
              file: File,
          }

          #[derive(Debug, Clone)]
          pub(super) struct PinnedSqliteNamespaceV0 {
              path: PathBuf,
              parent_path: PathBuf,
              parent_anchor: Arc<File>,
              database_anchor: Arc<File>,
              parent_identity: FileIdentityV0,
              database_identity: FileIdentityV0,
          }

          #[derive(Debug)]
          pub(super) struct PinnedSqliteOperationV0 {
              namespace: PinnedSqliteNamespaceV0,
              database_anchor: File,
              sidecars: Vec<SidecarAnchorV0>,
          }

          pub(super) fn canonical_database_path_v0(
              path: &Path,
          ) -> ValidationStoreResultV0<PathBuf> {
              if path.as_os_str().is_empty() || !path.is_absolute() {
                  return Err(error(
                      ValidationStoreErrorCodeV0::InvalidBinding,
                      "sqlite_namespace.path",
                  ));
              }
              let parent = path.parent().ok_or_else(|| {
                  error(
                      ValidationStoreErrorCodeV0::InvalidBinding,
                      "sqlite_namespace.parent",
                  )
              })?;
              let file_name = path.file_name().ok_or_else(|| {
                  error(
                      ValidationStoreErrorCodeV0::InvalidBinding,
                      "sqlite_namespace.file_name",
                  )
              })?;
              fs::create_dir_all(parent).map_err(|_| {
                  error(
                      ValidationStoreErrorCodeV0::Storage,
                      "sqlite_namespace.create_parent",
                  )
              })?;
              let canonical_parent = fs::canonicalize(parent).map_err(|_| {
                  error(
                      ValidationStoreErrorCodeV0::Storage,
                      "sqlite_namespace.canonical_parent",
                  )
              })?;
              let metadata = fs::metadata(&canonical_parent).map_err(|_| {
                  error(
                      ValidationStoreErrorCodeV0::Storage,
                      "sqlite_namespace.parent_metadata",
                  )
              })?;
              if !metadata.is_dir() {
                  return Err(error(
                      ValidationStoreErrorCodeV0::InvalidBinding,
                      "sqlite_namespace.parent_type",
                  ));
              }
              Ok(canonical_parent.join(file_name))
          }

          impl PinnedSqliteNamespaceV0 {
              pub(super) fn pin_existing(path: &Path) -> ValidationStoreResultV0<Self> {
                  let path = canonical_database_path_v0(path)?;
                  let parent_path = path.parent().ok_or_else(|| {
                      error(
                          ValidationStoreErrorCodeV0::InvalidBinding,
                          "sqlite_namespace.parent",
                      )
                  })?;
                  let parent_anchor = File::open(parent_path).map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "sqlite_namespace.parent_open",
                      )
                  })?;
                  let parent_metadata = parent_anchor.metadata().map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "sqlite_namespace.parent_fstat",
                      )
                  })?;
                  if !parent_metadata.is_dir() {
                      return Err(error(
                          ValidationStoreErrorCodeV0::InvalidBinding,
                          "sqlite_namespace.parent_type",
                      ));
                  }
                  let parent_identity = identity_v0(&parent_metadata)?;
                  let database_anchor = open_nofollow_regular_v0(&path)?;
                  let database_metadata = database_anchor.metadata().map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "sqlite_namespace.database_fstat",
                      )
                  })?;
                  verify_regular_single_link_v0(&database_metadata, "sqlite_namespace.database")?;
                  let database_identity = identity_v0(&database_metadata)?;
                  let namespace = Self {
                      path,
                      parent_path: parent_path.to_path_buf(),
                      parent_anchor: Arc::new(parent_anchor),
                      database_anchor: Arc::new(database_anchor),
                      parent_identity,
                      database_identity,
                  };
                  namespace.verify_static_namespace()?;
                  Ok(namespace)
              }

              pub(super) fn path(&self) -> &Path {
                  &self.path
              }

              pub(super) fn begin_operation(
                  &self,
              ) -> ValidationStoreResultV0<PinnedSqliteOperationV0> {
                  self.verify_static_namespace()?;
                  let database_anchor = open_nofollow_regular_v0(&self.path)?;
                  let metadata = database_anchor.metadata().map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "sqlite_namespace.operation_database_fstat",
                      )
                  })?;
                  verify_regular_single_link_v0(
                      &metadata,
                      "sqlite_namespace.operation_database",
                  )?;
                  if identity_v0(&metadata)? != self.database_identity {
                      return Err(error(
                          ValidationStoreErrorCodeV0::ReplacedStore,
                          "sqlite_namespace.operation_database_identity",
                      ));
                  }
                  Ok(PinnedSqliteOperationV0 {
                      namespace: self.clone(),
                      database_anchor,
                      sidecars: capture_sidecars_v0(&self.path)?,
                  })
              }

              fn verify_static_namespace(&self) -> ValidationStoreResultV0<()> {
                  let canonical_parent = fs::canonicalize(&self.parent_path).map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::ReplacedStore,
                          "sqlite_namespace.parent_missing",
                      )
                  })?;
                  if canonical_parent != self.parent_path {
                      return Err(error(
                          ValidationStoreErrorCodeV0::ReplacedStore,
                          "sqlite_namespace.parent_alias",
                      ));
                  }
                  let path_parent_metadata = fs::metadata(&self.parent_path).map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::ReplacedStore,
                          "sqlite_namespace.parent_metadata",
                      )
                  })?;
                  let anchor_parent_metadata = self.parent_anchor.metadata().map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "sqlite_namespace.parent_anchor",
                      )
                  })?;
                  if !path_parent_metadata.is_dir()
                      || identity_v0(&path_parent_metadata)? != self.parent_identity
                      || identity_v0(&anchor_parent_metadata)? != self.parent_identity
                  {
                      return Err(error(
                          ValidationStoreErrorCodeV0::ReplacedStore,
                          "sqlite_namespace.parent_identity",
                      ));
                  }

                  let path_database_metadata = fs::symlink_metadata(&self.path).map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::ReplacedStore,
                          "sqlite_namespace.database_missing",
                      )
                  })?;
                  verify_regular_single_link_v0(
                      &path_database_metadata,
                      "sqlite_namespace.database_path",
                  )?;
                  let anchor_database_metadata = self.database_anchor.metadata().map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "sqlite_namespace.database_anchor",
                      )
                  })?;
                  if identity_v0(&path_database_metadata)? != self.database_identity
                      || identity_v0(&anchor_database_metadata)? != self.database_identity
                  {
                      return Err(error(
                          ValidationStoreErrorCodeV0::ReplacedStore,
                          "sqlite_namespace.database_identity",
                      ));
                  }
                  Ok(())
              }
          }

          impl PinnedSqliteOperationV0 {
              pub(super) fn verify_connection(
                  &mut self,
                  connection: &Connection,
              ) -> ValidationStoreResultV0<()> {
                  self.namespace.verify_static_namespace()?;
                  let operation_metadata = self.database_anchor.metadata().map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "sqlite_namespace.operation_anchor",
                      )
                  })?;
                  if identity_v0(&operation_metadata)? != self.namespace.database_identity {
                      return Err(error(
                          ValidationStoreErrorCodeV0::ReplacedStore,
                          "sqlite_namespace.operation_anchor_identity",
                      ));
                  }
                  verify_connection_path_v0(connection, self.namespace.path())?;
                  let current = capture_sidecars_v0(self.namespace.path())?;
                  for anchor in current {
                      if let Some(existing) = self
                          .sidecars
                          .iter()
                          .find(|existing| existing.path == anchor.path)
                      {
                          if existing.identity != anchor.identity {
                              return Err(error(
                                  ValidationStoreErrorCodeV0::ReplacedStore,
                                  "sqlite_namespace.sidecar_replaced",
                              ));
                          }
                      } else {
                          self.sidecars.push(anchor);
                      }
                  }
                  Ok(())
              }

              pub(super) fn finish(self) -> ValidationStoreResultV0<()> {
                  self.namespace.verify_static_namespace()?;
                  let current = capture_sidecars_v0(self.namespace.path())?;
                  for anchor in &current {
                      let Some(existing) = self
                          .sidecars
                          .iter()
                          .find(|existing| existing.path == anchor.path)
                      else {
                          return Err(error(
                              ValidationStoreErrorCodeV0::ReplacedStore,
                              "sqlite_namespace.late_sidecar",
                          ));
                      };
                      if existing.identity != anchor.identity {
                          return Err(error(
                              ValidationStoreErrorCodeV0::ReplacedStore,
                              "sqlite_namespace.sidecar_identity",
                          ));
                      }
                  }
                  for anchor in &self.sidecars {
                      if let Ok(metadata) = anchor.file.metadata() {
                          if identity_v0(&metadata)? != anchor.identity {
                              return Err(error(
                                  ValidationStoreErrorCodeV0::ReplacedStore,
                                  "sqlite_namespace.sidecar_anchor_identity",
                              ));
                          }
                      }
                  }
                  Ok(())
              }
          }

          fn verify_connection_path_v0(
              connection: &Connection,
              expected: &Path,
          ) -> ValidationStoreResultV0<()> {
              let mut statement = connection.prepare("PRAGMA database_list").map_err(|_| {
                  error(
                      ValidationStoreErrorCodeV0::Storage,
                      "sqlite_namespace.database_list_prepare",
                  )
              })?;
              let mut rows = statement.query([]).map_err(|_| {
                  error(
                      ValidationStoreErrorCodeV0::Storage,
                      "sqlite_namespace.database_list_query",
                  )
              })?;
              let mut main_path = None;
              while let Some(row) = rows.next().map_err(|_| {
                  error(
                      ValidationStoreErrorCodeV0::Storage,
                      "sqlite_namespace.database_list_row",
                  )
              })? {
                  let name = row.get::<_, String>(1).map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "sqlite_namespace.database_list_name",
                      )
                  })?;
                  if name == "main" {
                      main_path = Some(row.get::<_, String>(2).map_err(|_| {
                          error(
                              ValidationStoreErrorCodeV0::Storage,
                              "sqlite_namespace.database_list_path",
                          )
                      })?);
                  }
              }
              let main_path = main_path.ok_or_else(|| {
                  error(
                      ValidationStoreErrorCodeV0::ReplacedStore,
                      "sqlite_namespace.main_database_missing",
                  )
              })?;
              if main_path.is_empty() {
                  return Err(error(
                      ValidationStoreErrorCodeV0::ReplacedStore,
                      "sqlite_namespace.main_database_memory",
                  ));
              }
              let canonical = fs::canonicalize(main_path).map_err(|_| {
                  error(
                      ValidationStoreErrorCodeV0::ReplacedStore,
                      "sqlite_namespace.main_database_path",
                  )
              })?;
              if canonical != expected {
                  return Err(error(
                      ValidationStoreErrorCodeV0::ReplacedStore,
                      "sqlite_namespace.connection_path",
                  ));
              }
              Ok(())
          }

          fn capture_sidecars_v0(path: &Path) -> ValidationStoreResultV0<Vec<SidecarAnchorV0>> {
              let mut anchors = Vec::new();
              for sidecar in sidecar_paths_v0(path) {
                  let metadata = match fs::symlink_metadata(&sidecar) {
                      Ok(metadata) => metadata,
                      Err(error_value) if error_value.kind() == std::io::ErrorKind::NotFound => {
                          continue;
                      }
                      Err(_) => {
                          return Err(error(
                              ValidationStoreErrorCodeV0::Storage,
                              "sqlite_namespace.sidecar_metadata",
                          ))
                      }
                  };
                  verify_regular_single_link_v0(&metadata, "sqlite_namespace.sidecar_path")?;
                  let file = open_nofollow_regular_v0(&sidecar)?;
                  let file_metadata = file.metadata().map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "sqlite_namespace.sidecar_fstat",
                      )
                  })?;
                  verify_regular_single_link_v0(
                      &file_metadata,
                      "sqlite_namespace.sidecar_file",
                  )?;
                  let identity = identity_v0(&metadata)?;
                  if identity_v0(&file_metadata)? != identity {
                      return Err(error(
                          ValidationStoreErrorCodeV0::ReplacedStore,
                          "sqlite_namespace.sidecar_open_race",
                      ));
                  }
                  anchors.push(SidecarAnchorV0 {
                      path: sidecar,
                      identity,
                      file,
                  });
              }
              Ok(anchors)
          }

          fn sidecar_paths_v0(path: &Path) -> Vec<PathBuf> {
              SIDECAR_SUFFIXES_V0
                  .iter()
                  .map(|suffix| {
                      let mut value = path.as_os_str().to_os_string();
                      value.push(suffix);
                      PathBuf::from(value)
                  })
                  .collect()
          }

          fn open_nofollow_regular_v0(path: &Path) -> ValidationStoreResultV0<File> {
              #[cfg(any(
                  target_os = "linux",
                  target_os = "android",
                  target_os = "macos",
                  target_os = "ios",
                  target_os = "freebsd",
                  target_os = "dragonfly",
                  target_os = "openbsd",
                  target_os = "netbsd"
              ))]
              {
                  return OpenOptions::new()
                      .read(true)
                      .write(true)
                      .custom_flags(O_NOFOLLOW_V0)
                      .open(path)
                      .map_err(|_| {
                          error(
                              ValidationStoreErrorCodeV0::ReplacedStore,
                              "sqlite_namespace.nofollow_open",
                          )
                      });
              }
              #[cfg(not(any(
                  target_os = "linux",
                  target_os = "android",
                  target_os = "macos",
                  target_os = "ios",
                  target_os = "freebsd",
                  target_os = "dragonfly",
                  target_os = "openbsd",
                  target_os = "netbsd"
              ))]
              {
                  let _ = path;
                  Err(error(
                      ValidationStoreErrorCodeV0::InvalidBinding,
                      "sqlite_namespace.unsupported_platform",
                  ))
              }
          }

          fn verify_regular_single_link_v0(
              metadata: &Metadata,
              context: &'static str,
          ) -> ValidationStoreResultV0<()> {
              if metadata.file_type().is_symlink() || !metadata.file_type().is_file() {
                  return Err(error(ValidationStoreErrorCodeV0::ReplacedStore, context));
              }
              #[cfg(unix)]
              if metadata.nlink() != 1 {
                  return Err(error(ValidationStoreErrorCodeV0::ReplacedStore, context));
              }
              #[cfg(not(unix))]
              {
                  let _ = metadata;
                  return Err(error(
                      ValidationStoreErrorCodeV0::InvalidBinding,
                      "sqlite_namespace.unsupported_platform",
                  ));
              }
              Ok(())
          }

          #[cfg(unix)]
          fn identity_v0(metadata: &Metadata) -> ValidationStoreResultV0<FileIdentityV0> {
              Ok(FileIdentityV0 {
                  device: metadata.dev(),
                  inode: metadata.ino(),
              })
          }

          #[cfg(not(unix))]
          fn identity_v0(_metadata: &Metadata) -> ValidationStoreResultV0<FileIdentityV0> {
              Err(error(
                  ValidationStoreErrorCodeV0::InvalidBinding,
                  "sqlite_namespace.unsupported_platform",
              ))
          }
          ''', encoding="utf-8")

          lib_path = crate / "src/lib.rs"
          lib = lib_path.read_text(encoding="utf-8")
          old = "mod finalization_history;\nmod store;"
          new = "mod finalization_history;\nmod pinned_sqlite_namespace;\nmod store;"
          if old not in lib:
              raise SystemExit("lib module insertion anchor missing")
          lib_path.write_text(lib.replace(old, new, 1), encoding="utf-8")

          history_path = crate / "src/finalization_history.rs"
          history = history_path.read_text(encoding="utf-8")
          import_anchor = "use crate::error::{error, ValidationStoreErrorCodeV0, ValidationStoreResultV0};\n"
          import_replacement = import_anchor + "use crate::pinned_sqlite_namespace::{\n    canonical_database_path_v0, PinnedSqliteNamespaceV0,\n};\n"
          if import_anchor not in history:
              raise SystemExit("history import anchor missing")
          history = history.replace(import_anchor, import_replacement, 1)

          impl_start = history.index("#[derive(Debug, Clone)]\npub struct SqliteNativeFinalizationHistoryV0")
          impl_end = history.index("#[derive(Debug, Clone)]\nstruct StoredFinalizationRowV0")
          new_impl = r'''#[derive(Debug, Clone)]
          pub struct SqliteNativeFinalizationHistoryV0 {
              namespace: PinnedSqliteNamespaceV0,
              scope: FinalizationHistoryScopeV0,
              initial_head: ApplicationHeadV0,
          }

          impl SqliteNativeFinalizationHistoryV0 {
              pub fn open(
                  path: impl AsRef<Path>,
                  scope: FinalizationHistoryScopeV0,
                  initial_head: ApplicationHeadV0,
              ) -> ValidationStoreResultV0<Self> {
                  let path = path.as_ref();
                  if path.as_os_str().is_empty() || !path.is_absolute() {
                      return Err(error(
                          ValidationStoreErrorCodeV0::InvalidBinding,
                          "finalization_history.path",
                      ));
                  }
                  let canonical_path = canonical_database_path_v0(path)?;
                  reject_unsafe_existing_path_v0(&canonical_path)?;
                  let connection = open_connection_v0(&canonical_path, true)?;
                  initialize_or_validate_schema_v0(&connection, scope, &initial_head)?;
                  validate_connection_contract_v0(&connection)?;
                  let _ = audit_connection_v0(&connection, scope, &initial_head)?;
                  drop(connection);
                  reject_unsafe_existing_path_v0(&canonical_path)?;
                  let namespace = PinnedSqliteNamespaceV0::pin_existing(&canonical_path)?;
                  let store = Self {
                      namespace,
                      scope,
                      initial_head,
                  };
                  let _ = store.audit()?;
                  Ok(store)
              }

              pub fn path(&self) -> &Path {
                  self.namespace.path()
              }

              pub const fn scope(&self) -> FinalizationHistoryScopeV0 {
                  self.scope
              }

              pub const fn initial_head(&self) -> &ApplicationHeadV0 {
                  &self.initial_head
              }

              fn with_connection<T>(
                  &self,
                  action: impl FnOnce(&mut Connection) -> ValidationStoreResultV0<T>,
              ) -> ValidationStoreResultV0<T> {
                  let mut operation = self.namespace.begin_operation()?;
                  let mut connection = open_connection_v0(self.namespace.path(), false)?;
                  let opening_check = validate_connection_contract_v0(&connection)
                      .and_then(|_| operation.verify_connection(&connection));
                  if let Err(opening_error) = opening_check {
                      drop(connection);
                      let _ = operation.finish();
                      return Err(opening_error);
                  }

                  let action_result = action(&mut connection);
                  let before_close_result = validate_connection_contract_v0(&connection)
                      .and_then(|_| operation.verify_connection(&connection));
                  drop(connection);
                  let after_close_result = operation.finish();
                  before_close_result?;
                  after_close_result?;
                  action_result
              }

              pub fn audit(&self) -> ValidationStoreResultV0<ConfirmedFinalizationHistoryAuditV0> {
                  self.with_connection(|connection| {
                      audit_connection_v0(connection, self.scope, &self.initial_head)
                  })
              }

              pub fn read_sequence(
                  &self,
                  sequence: u64,
              ) -> ValidationStoreResultV0<Option<ConfirmedFinalizationHistoryRecordV0>> {
                  if sequence == 0 {
                      return Err(error(
                          ValidationStoreErrorCodeV0::ZeroValue,
                          "finalization_history.read_sequence",
                      ));
                  }
                  self.with_connection(|connection| {
                      let audit =
                          audit_connection_v0(connection, self.scope, &self.initial_head)?;
                      if sequence > audit.entry_count {
                          return Ok(None);
                      }
                      let row = load_row_by_sequence_v0(connection, sequence)?.ok_or_else(|| {
                          error(
                              ValidationStoreErrorCodeV0::CorruptStore,
                              "finalization_history.missing_sequence",
                          )
                      })?;
                      Ok(Some(confirm_row_v0(self.scope, &row)?))
                  })
              }

              pub fn append(
                  &self,
                  readback: NativeFinalizationApplyReadbackV0,
              ) -> ValidationStoreResultV0<FinalizationHistoryAppendOutcomeV0> {
                  enum AppendStageV0 {
                      ExactReplay(ConfirmedFinalizationHistoryRecordV0),
                      Committed {
                          readback: NativeFinalizationApplyReadbackV0,
                          sequence: u64,
                          record: Vec<u8>,
                          record_digest: [u8; 32],
                          previous_chain_digest: [u8; 32],
                          chain_digest: [u8; 32],
                      },
                  }

                  let stage = self.with_connection(|connection| {
                      let before =
                          audit_connection_v0(connection, self.scope, &self.initial_head)?;
                      let sequence = readback.durable_sequence();
                      let record = encode_readback_v0(&readback);
                      let record_digest = digest_v0(
                          RECORD_DIGEST_DOMAIN_V0,
                          &[self.scope.as_bytes().as_slice(), record.as_slice()],
                      );

                      if sequence <= before.entry_count {
                          let existing = load_row_by_sequence_v0(connection, sequence)?.ok_or_else(
                              || {
                                  error(
                                      ValidationStoreErrorCodeV0::CorruptStore,
                                      "finalization_history.replay_missing",
                                  )
                              },
                          )?;
                          if existing.record == record && existing.record_digest == record_digest {
                              return Ok(AppendStageV0::ExactReplay(confirm_row_v0(
                                  self.scope,
                                  &existing,
                              )?));
                          }
                          return Err(error(
                              ValidationStoreErrorCodeV0::BindingMismatch,
                              "finalization_history.replay_conflict",
                          ));
                      }

                      let expected_sequence = before.entry_count.checked_add(1).ok_or_else(|| {
                          error(
