name: PoCO full qualification R26 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-full-qualification-r26-once-20260910.yml

concurrency:
  group: poco-full-qualification-r26
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r26-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"

jobs:
  qualify:
    name: Close repository gaps and qualify one immutable native PoCO tree
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact controller event source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned tools and harden one-shot controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep jq
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/temporary_poco_full_qualifier_r26.py")
          text = path.read_text(encoding="utf-8")

          anchor = '    tools = ROOT / "tools"\n'
          insertion = '''    workflows = ROOT / ".github/workflows"
              if workflows.is_dir():
                  for pattern in (
                      "poco-only-convergence-r*-once-*.yml",
                      "poco-*-diagnostic-once-*.yml",
                      "poco-r7-source-identity-diagnostic*-once-*.yml",
                      "poco-native-vector-refresh-diagnostic-once-*.yml",
                      "apply-poco-only-purge-temporary.yml",
                      "poco-only-full-tree-audit.yml",
                      "poco-purge-source-snapshot.yml",
                  ):
                      for candidate in workflows.glob(pattern):
                          candidate.unlink()
          '''
          if insertion not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("R26 temporary-workflow cleanup anchor drift")
              text = text.replace(anchor, insertion + anchor, 1)

          old_exclusion = '        if any(term in lowered for term in DISPATCH_EXCLUDE):\n'
          new_exclusion = '        if any(term in relative.casefold() for term in DISPATCH_EXCLUDE):\n'
          if old_exclusion in text:
              text = text.replace(old_exclusion, new_exclusion, 1)
          elif new_exclusion not in text:
              raise SystemExit("R26 dispatch exclusion anchor drift")

          path.write_text(text, encoding="utf-8")
          PY

          python3 -m py_compile tools/temporary_poco_full_qualifier_r26.py
          cp tools/temporary_poco_full_qualifier_r26.py /tmp/trnm-r26-qualifier.py
          python3 -m py_compile /tmp/trnm-r26-qualifier.py

      - name: Execute immutable repository qualification and external orchestration
        id: qualify
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 /tmp/trnm-r26-qualifier.py

      - name: Publish exact R26 readback to PR 117
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '### PoCO R26 immutable full qualification readback'
            echo
            echo "- workflow run: \`$GITHUB_RUN_ID\`"
            echo "- controller event source: \`$GITHUB_SHA\`"
            echo "- qualifier outcome: \`${{ steps.qualify.outcome }}\`"
            if [[ -f /tmp/trnm-r26-final-commit.txt ]]; then
              echo "- immutable candidate commit: \`$(cat /tmp/trnm-r26-final-commit.txt)\`"
            fi
            if [[ -f /tmp/trnm-r26-final-tree.txt ]]; then
              echo "- immutable candidate tree: \`$(cat /tmp/trnm-r26-final-tree.txt)\`"
            fi
            if [[ -f /tmp/trnm-r26-gap-summary.txt ]]; then
              echo
              echo '#### Gap classification'
              echo '```text'
              sed -n '1,160p' /tmp/trnm-r26-gap-summary.txt
              echo '```'
            fi
            if [[ -f /tmp/trnm-r26-review.json ]]; then
              echo
              echo '#### Independent review'
              echo '```json'
              jq '{source_commit,exact_head_approval_count:(.exact_head_approvals|length),request_returncode}' \
                /tmp/trnm-r26-review.json
              echo '```'
            fi
            if [[ -f /tmp/trnm-r26-dispatch.json ]]; then
              echo
              echo '#### External evidence dispatch'
              echo '```json'
              jq '{dispatched_count:([.[]|select(.dispatched==true)]|length),skipped_count:([.[]|select(.dispatched!=true)]|length),workflows:[.[]|{workflow,dispatched,reason,external_ids}]}' \
                /tmp/trnm-r26-dispatch.json
              echo '```'
            fi
            if [[ -f /tmp/trnm-r26-external-status.txt ]]; then
              echo
              echo '#### External require-all gate'
              echo '```text'
              cat /tmp/trnm-r26-external-status.txt
              echo '```'
            fi
            echo
            echo 'No approval, signature, HSM result, audit result, power-loss result, multihost result, campaign result, fuzz result, or soak result was synthesized.'
          } >/tmp/trnm-r26-pr-comment-workflow.md
          gh pr comment 117 --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/trnm-r26-pr-comment-workflow.md || true

      - name: Upload exact R26 qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r26-full-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          include-hidden-files: true
          path: |
            /tmp/trnm-r26-refresh-pins.log
            /tmp/trnm-r26-overlay-rounds.log
            /tmp/trnm-r22-overlay-search.json
            /tmp/trnm-r22-overlay-summary.txt
            /tmp/trnm-r26-overlay-applied-count.txt
            /tmp/trnm-r26-final-commit.txt
            /tmp/trnm-r26-final-tree.txt
            /tmp/trnm-r26-gap-inventory.json
            /tmp/trnm-r26-gap-summary.txt
            /tmp/trnm-r26-native-only.json
            /tmp/trnm-r26-canonical-plan.log
            /tmp/trnm-r26-mainline.log
            /tmp/trnm-r26-repository-truth.json
            /tmp/trnm-r26-protocol-contract.json
            /tmp/trnm-r26-workspace-check.log
            /tmp/trnm-r26-contract-check.log
            /tmp/trnm-r26-native-execution-test.log
            /tmp/trnm-r26-raw-key-test.log
            /tmp/trnm-r26-workspace-test.log
            /tmp/trnm-r26-contract-test.log
            /tmp/trnm-r26-contract-clippy.log
            /tmp/trnm-r26-boundary-clippy.log
            /tmp/trnm-r26-review.json
            /tmp/trnm-r26-dispatch.json
            /tmp/trnm-r26-external-runs.json
            /tmp/trnm-r26-external-artifacts
            /tmp/trnm-r26-external-evidence.json
            /tmp/trnm-r26-external-evidence.log
            /tmp/trnm-r26-external-status.txt
            /tmp/trnm-r26-pr-comment.md
            /tmp/trnm-r26-pr-comment-workflow.md

      - name: Preserve authentic R26 conclusion
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.qualify.outcome }}" != "success" ]]; then
            exit 1
          fi
