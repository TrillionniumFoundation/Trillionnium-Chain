[package]
name = "trnm-w1-batch-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
bincode = "1.3"
hex = "0.4"
risc0-zkp = { version = "=3.0.5", default-features = false }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["client", "disable-dev-mode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
trnm-w1-batch-methods = { path = "../methods" }
trnm-w1-batch-statement = { path = "../statement" }
