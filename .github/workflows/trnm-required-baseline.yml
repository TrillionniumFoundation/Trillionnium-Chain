# Separate annotated diagnostic tag; never required pull-request qualification.
name: trnm-required-baseline
run-name: H5DF Witness D2 phases (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-pq-witness-d2-phases-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pq-witness-phase-diagnostic:
    name: PQ Witness endpoint phase diagnostic (not qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONOPTIMIZE: "0"
      TRNM_EXPECTED_SOURCE_SHA: "cfa3be3b34c817c269a8e2fdc971f442de63ccc6"
    steps:
      - name: Checkout exact diagnostic subject D2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "cfa3be3b34c817c269a8e2fdc971f442de63ccc6"
          fetch-depth: 0
          persist-credentials: false
      - name: Bind actual tag control and runner-local subject checkout
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
          GIT_OPTIONAL_LOCKS: "0"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'TRNM_CONTROL_SUBJECT'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess

          REPO = "TrillionniumFoundation/Trillionnium-Chain"
          WORKFLOW = ".github/workflows/trnm-required-baseline.yml"
          BASE = "5df7ae6f482157c5f7fdcbcd52222117a965053f"
          PARENT = "e3a7de44e1c861a4ee60d622c49e4aa60d56392d"
          PARENT_TREE = "adcd6d3f4ec496de17803c2e4995fb3ac8249eaf"
          D = "cfa3be3b34c817c269a8e2fdc971f442de63ccc6"
          TREE = "d6754d6d6f2d96cf8869a34e66dd7f88a22ef94d"
          TAG = "refs/tags/diagnostic/h5df-pq-witness-phases-d2-20261114-v1"
          BRANCH = "fix/chain-pq-witness-d2-phase-diagnostic-20261114"
          PATCH_SHA256 = "2a5bbaba04e6433dd6b9b688939f4f2db4d73efd6cdc69ab26b96564af725cb4"
          ORIGINAL_DIAGNOSTIC_PATCH_SHA256 = "df00841d5d4d8b09f7c798d0e40ac235b8f32d4ecc3cd84d688db2660974c157"

          def require(ok, message):
              if not ok:
                  raise ValueError(message)

          def pin(path):
              raw = path.read_bytes()
              return {"path": str(path), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}

          context = {name: os.environ.get(name) for name in (
              "GITHUB_ACTIONS", "GITHUB_EVENT_NAME", "GITHUB_REPOSITORY", "GITHUB_REF", "GITHUB_SHA",
              "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB")}
          require(context["GITHUB_ACTIONS"] == "true" and context["GITHUB_EVENT_NAME"] == "workflow_dispatch", "real dispatch context")
          require(context["GITHUB_REPOSITORY"] == REPO and context["GITHUB_REF"] == TAG, "exact repository and tag")
          require(context["GITHUB_WORKFLOW_REF"] == REPO + "/" + WORKFLOW + "@" + TAG, "registered workflow at tag")
          require(context["GITHUB_JOB"] == "pq-witness-phase-diagnostic", "diagnostic job")
          require(re.fullmatch("[0-9a-f]{40}", context["GITHUB_SHA"] or "") and context["GITHUB_SHA"] != D, "actual control commit")
          require(all(re.fullmatch("[1-9][0-9]*", context[k] or "") for k in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")), "actual run context")
          source = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          require(not temporary.is_relative_to(source), "runner temporary root outside full checkout")
          root = temporary / "h5df-pq-witness-d2-phase-diagnostic-v1"
          root.mkdir(mode=0o700)
          require(stat.S_IMODE(root.stat().st_mode) == 0o700 and root.stat().st_uid == os.geteuid(), "private owned output")
          out = root / "control"
          out.mkdir(mode=0o700)
          steps = []
          def command(label, argv, expected=0):
              began = dt.datetime.now(dt.timezone.utc).isoformat()
              p = subprocess.run(argv, cwd=source, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60, check=False)
              require(len(p.stdout) <= 16 * 1024 * 1024 and len(p.stderr) <= 65536, "bounded metadata")
              row = {"label": label, "argv": argv, "cwd": str(source), "started_at": began,
                     "finished_at": dt.datetime.now(dt.timezone.utc).isoformat(), "exit_code": p.returncode}
              for stream, data in (("stdout", p.stdout), ("stderr", p.stderr)):
                  path = out / (label + "." + stream)
                  with path.open("xb") as f:
                      f.write(data)
                  row[stream] = pin(path)
              steps.append(row)
              with (out / (label + ".step.json")).open("x") as f:
                  json.dump(row, f, indent=2); f.write("\n")
              require(p.returncode == expected, label)
              return p.stdout

          record = {"schema": "trnm-pq-witness-diagnostic-control-subject-v1", "status": "HOLD",
                    "actual_github": context, "base": BASE, "diagnostic_parent": PARENT, "diagnostic_parent_tree": PARENT_TREE, "subject": D, "subject_tree": TREE,
                    "namespace_correction_patch_sha256": PATCH_SHA256, "original_diagnostic_patch_sha256": ORIGINAL_DIAGNOSTIC_PATCH_SHA256, "local_branch": BRANCH,
                    "qualification": False, "production_activation": False, "remote_ref_mutations": False}
          try:
              require(Path(command("root", ["git", "rev-parse", "--show-toplevel"]).decode().strip()).resolve() == source, "full checkout root")
              require(command("control-parents", ["git", "rev-list", "--parents", "-n", "1", context["GITHUB_SHA"]]).decode().split() == [context["GITHUB_SHA"], D], "single-parent control")
              record["actual_control_tree"] = command("control-tree", ["git", "rev-parse", context["GITHUB_SHA"] + "^{tree}"]).decode().strip()
              require(command("control-diff", ["git", "diff", "--name-only", D, context["GITHUB_SHA"]]).decode().splitlines() == [WORKFLOW], "control changes only workflow")
              require(command("subject-parents", ["git", "rev-list", "--parents", "-n", "1", D]).decode().split() == [D, PARENT], "single-parent D2 diagnostic source")
              require(command("original-diagnostic-parents", ["git", "rev-list", "--parents", "-n", "1", PARENT]).decode().split() == [PARENT, BASE], "D sole parent H5DF")
              require(command("original-diagnostic-tree", ["git", "rev-parse", PARENT + "^{tree}"]).decode().strip() == PARENT_TREE, "fixed original D tree")
              require(command("namespace-paths", ["git", "diff", "--name-only", PARENT, D]).decode().splitlines() == [
                  "trillionnium/crates/trnm-pon-node/src/pq_rollback_witness.rs",
                  "trillionnium/crates/trnm-pon-node/src/pq_tls_cli.rs"], "only two namespace correction paths")
              require(command("subject-tree", ["git", "rev-parse", D + "^{tree}"]).decode().strip() == TREE, "actual diagnostic tree")
              require(command("subject-head-before", ["git", "rev-parse", "HEAD"]).decode().strip() == D, "explicit D2 checkout")
              require(not command("subject-clean-before", ["git", "status", "--porcelain=v1", "--untracked-files=all"]), "clean subject checkout")
              flags = command("subject-index-before", ["git", "ls-files", "-v", "-z"]).split(b"\0")
              require(all(row.startswith(b"H ") for row in flags if row), "ordinary tracked index")
              boundary = json.loads((source / "PROJECT_BOUNDARY.json").read_bytes())
              require(BRANCH not in boundary["branch"]["protected"] and re.fullmatch(boundary["branch"]["development_regex"], BRANCH), "original development branch policy")
              command("local-branch-absent", ["git", "show-ref", "--verify", "--quiet", "refs/heads/" + BRANCH], expected=1)
              # Only this fresh runner's local development ref is created. There is no push.
              command("local-development-checkout", ["git", "switch", "--create", BRANCH, D])
              require(command("subject-head", ["git", "rev-parse", "HEAD"]).decode().strip() == D, "subject checkout")
              require(command("subject-tree-after", ["git", "rev-parse", "HEAD^{tree}"]).decode().strip() == TREE, "subject tree after switch")
              require(command("local-branch", ["git", "branch", "--show-current"]).decode().strip() == BRANCH, "local development branch")
              require(not command("subject-clean", ["git", "status", "--porcelain=v1", "--untracked-files=all"]), "clean subject")
              flags = command("subject-index", ["git", "ls-files", "-v", "-z"]).split(b"\0")
              require(all(row.startswith(b"H ") for row in flags if row), "ordinary subject index")
              record["status"] = "subject_checked_out"
          finally:
              record["steps"] = steps
              record["finished_at"] = dt.datetime.now(dt.timezone.utc).isoformat()
              with (root / "control-subject.json").open("x") as f:
                  json.dump(record, f, indent=2); f.write("\n")
          TRNM_CONTROL_SUBJECT
      - name: Verify diagnostic source before setup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/ci-observations/source.json" > "$RUNNER_TEMP/h5df-pq-witness-d2-phase-diagnostic-v1/source-before-setup.stdout" 2> "$RUNNER_TEMP/h5df-pq-witness-d2-phase-diagnostic-v1/source-before-setup.stderr"
      - name: Run original default project preflight before any builds
        shell: bash
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/h5df-pq-witness-d2-phase-diagnostic-v1"
          set +e
          bash scripts/project-preflight.sh > "$task_root/default-preflight-before-setup.stdout" 2> "$task_root/default-preflight-before-setup.stderr"
          preflight_exit=$?
          set -e
          printf '%s\n' "$preflight_exit" > "$task_root/default-preflight-before-setup.exit"
          exit "$preflight_exit"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'TRNM_CI_RECEIPT_DIR=%s/ci-observations\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned compiler and tools in isolated hosted runner
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Install pinned dependency auditor
        run: bash scripts/ci/install_ci_tools.sh supply-chain
      - name: Install isolated signed-state oracle Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/pon-state-env"
          "$RUNNER_TEMP/pon-state-env/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r formal/pon-nakamoto-v1/requirements.txt
          echo "$RUNNER_TEMP/pon-state-env/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned OpenSSL 3.5.9 PQ provider
        shell: bash
        run: bash scripts/ci/prepare_pq_provider.sh
      - name: Restore exact external runner and closed-results collector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'TRNM_WITNESS_HELPERS'
          import base64,hashlib,json,os,stat,zlib
          from pathlib import Path
          directory=Path(os.environ["RUNNER_TEMP"])/'h5df-pq-witness-d2-phase-diagnostic-v1/helpers'
          directory.mkdir(mode=0o700)
          if directory.is_symlink() or stat.S_IMODE(directory.stat().st_mode)!=0o700 or directory.stat().st_uid!=os.geteuid(): raise ValueError("private owned helper directory")
          entries=[{'name': 'run_endpoint_phase_diagnostic_v2.py', 'bytes': 12495, 'sha256': 'bfe19c0a758893e5b77c539b31124c19dfc3811efa34f8fdec7f20f76bb967ff', 'gzip_bytes': 4587, 'gzip_sha256': '360a6d97ad7bbc18ed5bbef9e1ca2c4239737542d0c2dd92b8c411f34d2d877c', 'gzip_base64': ''}, {'name': 'collect_closed_phase_records.py', 'bytes': 10179, 'sha256': 'f006ec719faf662283d29017580c95b7aca974cbd3f2b0fb854eb065ad347e35', 'gzip_bytes': 3320, 'gzip_sha256': '7bd1bfe474ab6af98c9adab1ee77090f1a94ff1a11e535dbbd5b874bed49a74b', 'gzip_base64': ''}]
          proofs=[]
          for item in entries:
              packed=base64.b64decode(item["gzip_base64"],validate=True)
              if len(packed)!=item["gzip_bytes"] or hashlib.sha256(packed).hexdigest()!=item["gzip_sha256"]: raise ValueError("gzip pin")
              decoder=zlib.decompressobj(31)
              raw=decoder.decompress(packed,item["bytes"]+1)
              if (not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or len(raw)!=item["bytes"]
                  or hashlib.sha256(raw).hexdigest()!=item["sha256"]): raise ValueError("bounded exact helper bytes")
              if Path(item["name"]).name!=item["name"]: raise ValueError("literal helper basename")
              path=directory/item["name"]
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,"wb") as f: f.write(raw);f.flush()
              if path.read_bytes()!=raw: raise ValueError("helper readback")
              proofs.append({"path":str(path),"bytes":len(raw),"sha256":item["sha256"],"gzip_bytes":item["gzip_bytes"],"gzip_sha256":item["gzip_sha256"]})
          with (directory/"decoded-source-pins.json").open("x") as f:
              json.dump({"schema":"trnm-diagnostic-embedded-source-pins-v1","files":proofs,"qualification":False},f,indent=2);f.write("\n")
          TRNM_WITNESS_HELPERS
      - name: Run unchanged endpoint selector with original debug workspace feature graph
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/h5df-pq-witness-d2-phase-diagnostic-v1/helpers/run_endpoint_phase_diagnostic_v2.py" --source "$GITHUB_WORKSPACE" --diagnostic-head "cfa3be3b34c817c269a8e2fdc971f442de63ccc6" --diagnostic-tree "d6754d6d6f2d96cf8869a34e66dd7f88a22ef94d" --output "$RUNNER_TEMP/h5df-pq-witness-d2-phase-diagnostic-v1/run"
      - name: Verify diagnostic source after execution or setup failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/h5df-pq-witness-d2-phase-diagnostic-v1"
          if [[ ! -d "$task_root" ]]; then
            echo "HOLD: control-subject setup did not produce a private evidence root"
            exit 1
          fi
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$task_root/source-after-workflow.json" > "$task_root/source-after-workflow.stdout" 2> "$task_root/source-after-workflow.stderr"
      - name: Collect only actual closed phase records without changing native status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/h5df-pq-witness-d2-phase-diagnostic-v1"
          if [[ ! -f "$task_root/run/run-receipt.json" || ! -f "$task_root/helpers/collect_closed_phase_records.py" ]]; then
            echo "HOLD: no closed native run receipt; no phase facts or qualification"
            if [[ -d "$task_root" ]]; then
              printf '%s\n' '{"status":"HOLD","reason":"closed_run_receipt_or_collector_missing","qualification":false}' > "$task_root/collection-incomplete.json"
            fi
            exit 1
          fi
          python3 -B "$task_root/helpers/collect_closed_phase_records.py" --run-output "$task_root/run" --output "$task_root/closed-phase-facts.json" > "$task_root/collector.stdout" 2> "$task_root/collector.stderr"
      - name: Preserve original failures and diagnostic observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h5df-witness-d2-phase-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/h5df-pq-witness-d2-phase-diagnostic-v1/
            ${{ runner.temp }}/ci-observations/
          if-no-files-found: error
          retention-days: 30
