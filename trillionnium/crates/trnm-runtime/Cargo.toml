[package]
name = "trnm-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "1"
trnm-protocol = { path = "../trnm-protocol" }

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
trnm-pouw = { path = "../trnm-pouw" }
trnm-state = { path = "../trnm-state" }
trnm-types = { path = "../trnm-types" }
