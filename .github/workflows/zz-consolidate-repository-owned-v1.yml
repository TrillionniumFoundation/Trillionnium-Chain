name: consolidate-repository-owned-v1

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/zz-consolidate-repository-owned-v1.yml

permissions:
  contents: write

concurrency:
  group: consolidate-repository-owned-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: work/plan-v2-full-gap-closure-20260902
  NODE_SPLIT_BRANCH: work/node-split-v1-20260902
  CORE_SOURCE_SHA: 1a181ba453f86055082859e12e3d0be9fc7b18f5
  CORE_SOURCE_TREE: cae204e1638ba4bba92a9a852f0552adb41ca494
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  consolidate:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/plan-v2-full-gap-closure-20260902' &&
      github.actor == 'Franksudoman' &&
      github.triggering_actor == github.actor &&
      !contains(github.event.head_commit.message, '[repository-owned-consolidated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out exact successor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin \
            "+refs/heads/${NODE_SPLIT_BRANCH}:refs/remotes/origin/${NODE_SPLIT_BRANCH}" \
            "${CORE_SOURCE_SHA}"
          node_split_sha="$(git rev-parse "refs/remotes/origin/${NODE_SPLIT_BRANCH}")"
          git show -s --format=%s "${node_split_sha}" \
            | grep -q '^\[node-split-lock\] ci(node): materialize lock and retire staging carrier$'
          test "$(git show -s --format=%T "${CORE_SOURCE_SHA}")" = "${CORE_SOURCE_TREE}"
          test "$(git ls-tree -r --name-only "${node_split_sha}" -- .github/workflows/zz-stage-node-split-lock.yml | wc -l)" -eq 0
          printf 'node_split_sha=%s\n' "${node_split_sha}" >> "${GITHUB_ENV}"

      - name: Reconstruct validated node decomposition
        shell: bash
        run: |
          set -euo pipefail
          node_paths=(
            .github/CODEOWNERS
            .github/workflows/trnm-required-baseline.yml
            config/build-closures-v1.toml
            config/module-coverage-v1.toml
            config/node-decomposition-v1.toml
            docs/modules/TRNM_MODULE_TECHNICAL_REFERENCE_V1.md
            scripts/ci/check_build_closures_v1.py
            scripts/ci/check_node_decomposition_v1.py
            trillionnium/Cargo.toml
            trillionnium/Cargo.lock
            trillionnium/crates/trnm-poco-node-authority
            trillionnium/crates/trnm-poco-node-io
            trillionnium/crates/trnm-poco-node-host
            trillionnium/crates/trnm-poco-node-cli
          )
          git checkout "${node_split_sha}" -- "${node_paths[@]}"
          if git cat-file -e "${node_split_sha}:.github/workflows/trnm-node-decomposition-v1.yml" 2>/dev/null; then
            git checkout "${node_split_sha}" -- .github/workflows/trnm-node-decomposition-v1.yml
          fi

      - name: Import fixed repository blocker cores
        shell: bash
        run: |
          set -euo pipefail
          core_paths=(
            config/repository-blocker-cores-v0.toml
            scripts/check_repository_blocker_registry_v0.py
            trillionnium/crates/trnm-control-plane-v0
            trillionnium/crates/trnm-durable-file-adapters-v0
            trillionnium/crates/trnm-migration-v0
            trillionnium/crates/trnm-node-boundary-v0
            trillionnium/crates/trnm-poco-node-production-v0
            trillionnium/crates/trnm-production-adapter-conformance-v0
            trillionnium/crates/trnm-release-bundle-v0
            trillionnium/crates/trnm-state-sync-v0
            trillionnium/crates/trnm-tx-lifecycle-v0
          )
          git checkout "${CORE_SOURCE_SHA}" -- "${core_paths[@]}"
          git show "${CORE_SOURCE_SHA}:docs/development/TRNM_DURABLE_FILE_ADAPTERS_V0.md" \
            > docs/modules/TRNM_DURABLE_FILE_ADAPTERS_V0.md
          git show "${CORE_SOURCE_SHA}:docs/development/TRNM_PRODUCTION_ADAPTER_CONFORMANCE_V0.md" \
            > docs/modules/TRNM_PRODUCTION_ADAPTER_CONFORMANCE_V0.md
          git show "${CORE_SOURCE_SHA}:docs/development/TRNM_REPOSITORY_BLOCKER_CORES_V0.md" \
            > docs/modules/TRNM_REPOSITORY_BLOCKER_CORES_V0.md
          sed -i 's#docs/development/TRNM_DURABLE_FILE_ADAPTERS_V0.md#docs/modules/TRNM_DURABLE_FILE_ADAPTERS_V0.md#g' \
            config/repository-blocker-cores-v0.toml scripts/check_repository_blocker_registry_v0.py
          sed -i 's#docs/development/TRNM_PRODUCTION_ADAPTER_CONFORMANCE_V0.md#docs/modules/TRNM_PRODUCTION_ADAPTER_CONFORMANCE_V0.md#g' \
            config/repository-blocker-cores-v0.toml scripts/check_repository_blocker_registry_v0.py
          sed -i 's#docs/development/TRNM_REPOSITORY_BLOCKER_CORES_V0.md#docs/modules/TRNM_REPOSITORY_BLOCKER_CORES_V0.md#g' \
            config/repository-blocker-cores-v0.toml scripts/check_repository_blocker_registry_v0.py

      - name: Register all workspace and module ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workspace = Path('trillionnium/Cargo.toml')
          text = workspace.read_text()
          members = [
              'crates/trnm-control-plane-v0',
              'crates/trnm-durable-file-adapters-v0',
              'crates/trnm-migration-v0',
              'crates/trnm-node-boundary-v0',
              'crates/trnm-poco-node-production-v0',
              'crates/trnm-production-adapter-conformance-v0',
              'crates/trnm-release-bundle-v0',
              'crates/trnm-state-sync-v0',
              'crates/trnm-tx-lifecycle-v0',
          ]
          marker = ']\nresolver = "2"'
          if marker not in text:
              raise SystemExit('workspace member-list terminator drift')
          for member in members:
              row = f'  "{member}",\n'
              if row not in text:
                  text = text.replace(marker, row + marker, 1)
          workspace.write_text(text)

          coverage = Path('config/module-coverage-v1.toml')
          text = coverage.read_text()
          additions = {
              'M03': ['trnm-durable-file-adapters-v0'],
              'M05': ['trnm-tx-lifecycle-v0'],
              'M13': ['trnm-migration-v0', 'trnm-state-sync-v0'],
              'M15': ['trnm-node-boundary-v0', 'trnm-poco-node-production-v0', 'trnm-release-bundle-v0'],
              'M16': ['trnm-control-plane-v0'],
              'M17': ['trnm-production-adapter-conformance-v0'],
          }
          for module, crates in additions.items():
              pattern = rf'(\[\[module_coverage\]\]\nid = "{module}"\n.*?primary_crates = \[)(.*?)(\]\n)'
              match = re.search(pattern, text, flags=re.S)
              if not match:
                  raise SystemExit(f'module coverage section drift: {module}')
              current = re.findall(r'"([^"]+)"', match.group(2))
              for crate in crates:
                  if crate not in current:
                      current.append(crate)
              replacement = match.group(1) + ', '.join(f'"{x}"' for x in current) + match.group(3)
              text = text[:match.start()] + replacement + text[match.end():]
          coverage.write_text(text)

          reference = Path('docs/modules/TRNM_MODULE_TECHNICAL_REFERENCE_V1.md')
          current = reference.read_text()
          appendix = '''\n\n---\n\n## Repository blocker core implementation map v0\n\nThese fail-closed repository-owned cores do not confer production, release, testnet, or activation authority.\n\n| Crate | Primary module | Boundary |\n|---|---|---|\n| `trnm-durable-file-adapters-v0` | M03 | locked authority and snapshot CAS adapters |\n| `trnm-tx-lifecycle-v0` | M05 | bounded transaction lifecycle core |\n| `trnm-migration-v0` | M13 | source-bound migration verification core |\n| `trnm-state-sync-v0` | M13 | authenticated state-sync core |\n| `trnm-node-boundary-v0` | M15 | node composition boundary |\n| `trnm-poco-node-production-v0` | M15 | production-shaped fail-closed node surface |\n| `trnm-release-bundle-v0` | M15 | reproducible release-bundle core |\n| `trnm-control-plane-v0` | M16 | observer-first non-authoritative control plane |\n| `trnm-production-adapter-conformance-v0` | M17 | adapter conformance test authority only |\n'''
          if '## Repository blocker core implementation map v0' not in current:
              reference.write_text(current.rstrip() + appendix + '\n')
          PY

      - name: Install pinned Rust and materialize exact lock graph
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 - <<'PY'
          import tomllib
          with open('rust-toolchain.toml','rb') as handle:
              print(tomllib.load(handle)['toolchain']['channel'])
          PY
          )"
          rustup toolchain install "${expected}" --profile minimal --component rustfmt --component clippy
          rustup default "${expected}"
          cp trillionnium/Cargo.lock "${RUNNER_TEMP}/Cargo.lock.before"
          cargo check --manifest-path trillionnium/Cargo.toml --workspace
          python3 - <<'PY'
          from pathlib import Path
          import os, tomllib
          before = tomllib.loads(Path(os.environ['RUNNER_TEMP'], 'Cargo.lock.before').read_text())
          after = tomllib.loads(Path('trillionnium/Cargo.lock').read_text())
          def rows(value):
              return {(r['name'], r['version'], r.get('source')): r for r in value['package']}
          old, new = rows(before), rows(after)
          if set(old) - set(new):
              raise SystemExit(f'lock rows removed: {sorted(set(old)-set(new))}')
          for key, row in old.items():
              if new[key] != row:
                  raise SystemExit(f'existing lock row changed: {key}')
          expected = {
              'trnm-control-plane-v0',
              'trnm-durable-file-adapters-v0',
              'trnm-migration-v0',
              'trnm-node-boundary-v0',
              'trnm-poco-node-production-v0',
              'trnm-production-adapter-conformance-v0',
              'trnm-release-bundle-v0',
              'trnm-state-sync-v0',
              'trnm-tx-lifecycle-v0',
          }
          additions = {key[0] for key in set(new)-set(old)}
          if additions != expected:
              raise SystemExit(f'unexpected lock additions: {sorted(additions)}')
          PY
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked

      - name: Format and validate complete repository-owned tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          python3 scripts/ci/check_node_decomposition_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_build_closures_v1.py --verify-cargo-tree
          python3 scripts/check_repository_blocker_registry_v0.py
          packages=(
            trnm-poco-node-authority
            trnm-poco-node-io
            trnm-poco-node-host
            trnm-poco-node-cli
            trnm-control-plane-v0
            trnm-durable-file-adapters-v0
            trnm-migration-v0
            trnm-node-boundary-v0
            trnm-poco-node-production-v0
            trnm-production-adapter-conformance-v0
            trnm-release-bundle-v0
            trnm-state-sync-v0
            trnm-tx-lifecycle-v0
          )
          for package in "${packages[@]}"; do
            cargo test --manifest-path trillionnium/Cargo.toml \
              -p "${package}" --all-targets --locked --offline
            cargo clippy --manifest-path trillionnium/Cargo.toml \
              -p "${package}" --all-targets --locked --offline -- -D warnings
          done
          cargo check --manifest-path trillionnium/Cargo.toml \
            --workspace --all-targets --locked --offline
          status="$(cargo run --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node-cli --bin trnm-poco-node-cli \
            --locked --offline -- status)"
          printf '%s\n' "${status}" | grep -q '"production_candidate":false'
          printf '%s\n' "${status}" | grep -q '"authority_gate_open":false'
          printf '%s\n' "${status}" | grep -q '"production_activation":false'
          printf '%s\n' "${status}" | grep -q '"start_permitted":false'
          test "$(find docs/development -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 1

      - name: Write source-bound repository qualification report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/repository
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          report = {
              'schema': 'trnm-repository-owned-consolidation-report-v1',
              'integration_parent': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'node_split_source_commit': os.environ['node_split_sha'],
              'repository_core_source_commit': os.environ['CORE_SOURCE_SHA'],
              'repository_core_source_tree': os.environ['CORE_SOURCE_TREE'],
              'node_decomposition_crate_count': 4,
              'repository_core_crate_count': 9,
              'cargo_tree_verified': True,
              'tests_and_clippy': 'passed-before-commit',
              'external_evidence': False,
              'production_candidate': False,
              'production_consensus_activation': False,
              'public_testnet_ready': False,
              'release_ready': False,
              'result': 'PASS',
          }
          Path('docs/evidence/repository/REPOSITORY_OWNED_CONSOLIDATION_V1.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Retire all known carriers and commit exact tree
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/zz-apply-plan-v2-closure-tree.yml \
            .github/workflows/zz-integrate-node-split-v1.yml \
            .github/workflows/zz-integrate-repository-cores-v0.yml \
            .github/workflows/zz-clean-temporary-carriers.yml \
            .github/workflows/zz-consolidate-repository-owned-v1.yml
          do
            if [[ -e "${path}" ]]; then git rm "${path}"; fi
          done
          if find .github/workflows -maxdepth 1 -type f -name 'zz-*' -print -quit | grep -q .; then
            echo 'unknown temporary workflow remains' >&2
            find .github/workflows -maxdepth 1 -type f -name 'zz-*' -print >&2
            exit 2
          fi
          git config user.name 'Franksudoman'
          git config user.email 'sunfocapital@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m '[repository-owned-consolidated] feat(plan): consolidate repository-owned blockers'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
