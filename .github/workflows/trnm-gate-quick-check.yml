name: trnm-gate-quick-check

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'trillionnium-rust/scripts/**'
      - '.github/workflows/trnm-gate-quick-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'trillionnium-rust/scripts/**'
      - '.github/workflows/trnm-gate-quick-check.yml'
  workflow_dispatch:

jobs:
  shell-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Quick shell gate (bash -n + shellcheck)
        run: |
          QUICK_GATE_SUMMARY_PATH=run/quick-gate/summary.json \
          ./scripts/quick_gate_shell.sh scripts trillionnium-rust/scripts

      - name: Validate workflow script refs (exist + executable)
        run: |
          WORKFLOW_SCRIPT_REF_STRICT=0 \
          WORKFLOW_SCRIPT_REF_SUMMARY_PATH=run/quick-gate/workflow-script-refs-summary.json \
          ./scripts/validate_workflow_script_refs.sh

      - name: Quick gate summary path guard regression
        run: |
          ./scripts/v2/quick_gate_summary_path_guard_test.sh

      - name: PR5 reconcile skip-when-missing-log regression
        run: |
          ./scripts/v2/pr5_treasury_reconcile_skip_when_missing_log_test.sh

      - name: Quick gate summary JSON escape regression
        run: |
          ./scripts/v2/quick_gate_summary_json_escape_test.sh

      - name: PR6 missing event log guard regression
        run: |
          ./scripts/v2/pr6_alert_rules_gate_missing_event_log_test.sh

      - name: PR7 TOP_N input guard regression
        run: |
          ./scripts/v2/pr7_topn_summary_gate_invalid_topn_test.sh

      - name: RPC node events resource guard regression
        run: |
          ./scripts/v2/rpc_node_events_resource_guard_test.sh

      - name: Governance value schema reject regression
        run: |
          ./scripts/v2/governance_value_schema_reject_test.sh

      - name: Upload quick gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-gate-summary
          path: run/quick-gate/*.json
          if-no-files-found: warn
