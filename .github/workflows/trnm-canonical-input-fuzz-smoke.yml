name: TRNM Canonical Input Fuzz Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/trnm-canonical-input-fuzz-smoke.yml"
      - "rust-toolchain.toml"
      - "scripts/ci/check_canonical_fuzz_smoke.sh"
      - "scripts/ci/install_cargo_fuzz.sh"
      - "trillionnium/Cargo.lock"
      - "trillionnium/Cargo.toml"
      - "trillionnium/crates/trnm-finality-types/**"
      - "trillionnium/crates/trnm-protocol/**"
      - "trillionnium/fuzz/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/trnm-canonical-input-fuzz-smoke.yml"
      - "rust-toolchain.toml"
      - "scripts/ci/check_canonical_fuzz_smoke.sh"
      - "scripts/ci/install_cargo_fuzz.sh"
      - "trillionnium/Cargo.lock"
      - "trillionnium/Cargo.toml"
      - "trillionnium/crates/trnm-finality-types/**"
      - "trillionnium/crates/trnm-protocol/**"
      - "trillionnium/fuzz/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-native-workflow-references:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Normalize native-consensus workflow references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/trnm-live-devnet-package.yml'): [
                  ('name: TRNM Legacy Harness Reproducibility', 'name: TRNM Native Consensus Reproducibility'),
                  ('  legacy-harness-reproducibility:', '  native-consensus-reproducibility:'),
                  ('      - name: Unit and legacy-harness gates', '      - name: Unit and native-consensus gates'),
                  ('          python3 trillionnium/scripts/release/test_trnm_chain_devnet_v1.py', '          python3 ./trillionnium/scripts/release/test_trnm_chain_devnet_v1.py'),
                  ('            trillionnium/scripts/release/build_trnm_chain_devnet_v1.sh', '            ./trillionnium/scripts/release/build_trnm_chain_devnet_v1.sh'),
                  ('          trillionnium/scripts/release/verify_trnm_chain_devnet_v1.sh', '          ./trillionnium/scripts/release/verify_trnm_chain_devnet_v1.sh'),
              ],
              Path('.github/workflows/trnm-merge-gates.yml'): [
                  ("      - 'config/legacy-harness-freeze.sha256'\n", ''),
                  ('      - name: Enforce frozen legacy binary surfaces', '      - name: Enforce native consensus as the sole authority'),
                  ('        run: bash scripts/ci/check_legacy_harness_freeze.sh', '        run: ./scripts/ci/check_self_consensus_only.sh'),
                  ('cargo run -q -p trnm-node --features legacy-harness --bin trnm-sim', 'cargo run -q -p trnm-node --features self-consensus --bin trnm-sim'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected text missing in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/native-consensus-workflow-path-repair.yml').unlink(missing_ok=True)
          PY
          git diff --check
          ./scripts/ci/check_self_consensus_only.sh
      - name: Commit workflow cleanup
        run: |
          set -euo pipefail
          git add .github/workflows/trnm-live-devnet-package.yml \
                  .github/workflows/trnm-merge-gates.yml \
                  .github/workflows/native-consensus-workflow-path-repair.yml
          if git diff --cached --quiet; then
            echo 'workflow references already normalized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(chain): normalize native consensus workflow references'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  bounded-smoke:
    name: Bounded public-input fuzz smoke (not a campaign)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly-2026-07-27
      - name: Install checksum- and lock-pinned cargo-fuzz runner
        run: |
          ./scripts/ci/install_cargo_fuzz.sh "$RUNNER_TEMP/trnm-cargo-fuzz"
          printf '%s\n' "$RUNNER_TEMP/trnm-cargo-fuzz/bin" >> "$GITHUB_PATH"
      - name: Run bounded two-target smoke
        env:
          TRNM_FUZZ_SMOKE_SECONDS: "15"
        run: ./scripts/ci/check_canonical_fuzz_smoke.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-canonical-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: trillionnium/fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 14
