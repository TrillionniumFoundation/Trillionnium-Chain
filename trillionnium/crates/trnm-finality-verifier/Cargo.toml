[package]
name = "trnm-finality-verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
ics23 = "=0.12.0"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tendermint = "0.40.4"
tendermint-light-client-verifier = "0.40.4"
tendermint-proto = "0.40.4"
trnm-finality-types = { version = "0.1.0", path = "../trnm-finality-types" }
trnm-protocol = { version = "0.1.0", path = "../trnm-protocol" }
trnm-research-protocol = { version = "0.1.0", path = "../trnm-research-protocol" }

[dev-dependencies]
sha2 = "0.10"
tendermint-testgen = "0.40.4"
