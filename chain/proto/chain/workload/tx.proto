syntax = "proto3";

package chain.workload;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "chain/workload/params.proto";
import "chain/workload/task.proto";
import "chain/workload/challenge.proto";

option go_package = "chain/x/workload/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  
  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams      (MsgUpdateParams     ) returns (MsgUpdateParamsResponse     );
  rpc CreateTask        (MsgCreateTask       ) returns (MsgCreateTaskResponse       );
  rpc AcceptTask        (MsgAcceptTask       ) returns (MsgAcceptTaskResponse       );
  rpc UpdateTask        (MsgUpdateTask       ) returns (MsgUpdateTaskResponse       );
  rpc DeleteTask        (MsgDeleteTask       ) returns (MsgDeleteTaskResponse       );
  rpc RegisterWorker    (MsgRegisterWorker   ) returns (MsgRegisterWorkerResponse   );
  rpc SlashWorker       (MsgSlashWorker      ) returns (MsgSlashWorkerResponse      );
  rpc UnregisterWorker  (MsgUnregisterWorker ) returns (MsgUnregisterWorkerResponse );
  rpc RequestUnbonding  (MsgRequestUnbonding ) returns (MsgRequestUnbondingResponse );
  rpc FinalizeUnbonding (MsgFinalizeUnbonding) returns (MsgFinalizeUnbondingResponse);
  rpc ExtendUnbonding   (MsgExtendUnbonding  ) returns (MsgExtendUnbondingResponse  );
  rpc CommitResult      (MsgCommitResult     ) returns (MsgCommitResultResponse     );
  rpc RevealResult      (MsgRevealResult     ) returns (MsgRevealResultResponse     );
  rpc SubmitResult      (MsgSubmitResult     ) returns (MsgSubmitResultResponse     );
  rpc ChallengeResult   (MsgChallengeResult  ) returns (MsgChallengeResultResponse  );
  rpc ResolveChallenge  (MsgResolveChallenge ) returns (MsgResolveChallengeResponse );
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) =                        "authority";
  option           (amino.name) = "chain/x/workload/MsgUpdateParams";
  
  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

message MsgCreateTask {
  option (cosmos.msg.v1.signer) = "creator";
  string creator    = 1;
  string ipfsHash   = 2;
  uint64 bounty     = 3;
  uint64 status     = 4;
  string worker     = 5;
  string resultHash = 6;
}

message MsgCreateTaskResponse {
  uint64 id = 1;
}

message MsgAcceptTask {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 taskId = 2;
}

message MsgAcceptTaskResponse {}

message MsgUpdateTask {
  option (cosmos.msg.v1.signer) = "creator";
  string creator    = 1;
  uint64 id         = 2;
  string ipfsHash   = 3;
  uint64 bounty     = 4;
  uint64 status     = 5;
  string worker     = 6;
  string resultHash = 7;
}

message MsgUpdateTaskResponse {}

message MsgDeleteTask {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 id      = 2;
}

message MsgDeleteTaskResponse {}

message MsgRegisterWorker {
  option (cosmos.msg.v1.signer) = "creator";
  string creator  = 1;
  string nodeId   = 2;
  string ipfsAddr = 3;
}

message MsgRegisterWorkerResponse {}

message MsgSlashWorker {
  option (cosmos.msg.v1.signer) = "creator";
  string creator      = 1;
  string worker       = 2;
  uint64 slashPercent = 3;
}

message MsgSlashWorkerResponse {}

message MsgUnregisterWorker {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
}

message MsgUnregisterWorkerResponse {}

message MsgRequestUnbonding {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
}

message MsgRequestUnbondingResponse {}

message MsgFinalizeUnbonding {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
}

message MsgFinalizeUnbondingResponse {}

message MsgExtendUnbonding {
  option (cosmos.msg.v1.signer) = "creator";
  string creator     = 1;
  string worker      = 2;
  uint64 extraBlocks = 3;
}

message MsgExtendUnbondingResponse {}

message MsgCommitResult {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 taskId = 2;
  string commitHash = 3;
}

message MsgCommitResultResponse {}

message MsgRevealResult {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 taskId = 2;
  string resultHash = 3;
  string resultUri = 4;
  string revealSalt = 5;
}

message MsgRevealResultResponse {}

message MsgSubmitResult {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 taskId = 2;
  string resultHash = 3;
  string resultUri = 4;
}

message MsgSubmitResultResponse {}

message MsgChallengeResult {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 taskId = 2;
  string reason = 3;
  string evidenceUri = 4;
}

message MsgChallengeResultResponse {}

message MsgResolveChallenge {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 taskId = 2;
  bool challengeSucceeded = 3;
  string finalResultHash = 4;
  string memo = 5;
}

message MsgResolveChallengeResponse {}

