name: shfmt

on:
  push:
    branches: [main]
    paths:
      - 'chain/tools/*.sh'
      - '.github/workflows/shfmt.yml'
  pull_request:
    paths:
      - 'chain/tools/*.sh'
      - '.github/workflows/shfmt.yml'

jobs:
  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
      - name: Check shell formatting
        run: |
          "$(go env GOPATH)/bin/shfmt" -d chain/tools/*.sh
