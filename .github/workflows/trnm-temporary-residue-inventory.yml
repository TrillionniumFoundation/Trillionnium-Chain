name: Temporary residue inventory

on:
  push:
    branches:
      - work/remove-cometbft-residue-20260907

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate tracked-source inventory
        shell: bash
        run: |
          set -euo pipefail
          report=.cleanup-residue-report.txt
          paths=.cleanup-residue-paths.txt
          summary=.cleanup-residue-summary.json
          symbols=.cleanup-genesis-symbol-usage.txt
          : > "$report"
          git grep -n -I -E '(CometBFT|cometbft|Comet|comet|Tendermint|tendermint|ABCI|abci|trnm-consensus-app|trnm_comet)' -- . \
            ':(exclude).github/workflows/trnm-temporary-residue-inventory.yml' \
            ':(exclude).cleanup-residue-report.txt' \
            ':(exclude).cleanup-residue-paths.txt' \
            ':(exclude).cleanup-residue-summary.json' \
            ':(exclude).cleanup-genesis-symbol-usage.txt' > "$report" || true
          awk -F: '{count[$1]++} END {for (path in count) printf "%7d %s\n", count[path], path}' "$report" \
            | sort -k1,1nr -k2,2 > "$paths"
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          report = Path('.cleanup-residue-report.txt')
          paths = Path('.cleanup-residue-paths.txt')
          report_lines = report.read_text(encoding='utf-8').splitlines()
          path_lines = paths.read_text(encoding='utf-8').splitlines()
          payload = {
              'schema': 'trnm-temporary-residue-inventory-v1',
              'matching_lines': len(report_lines),
              'matching_files': len(path_lines),
              'files': path_lines,
          }
          Path('.cleanup-residue-summary.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          source_path = Path('trillionnium/crates/trnm-consensus-types/src/genesis_application.rs')
          source = source_path.read_text(encoding='utf-8')
          names = sorted(set(re.findall(
              r'(?m)^pub\s+(?:struct|enum|trait|const|fn)\s+([A-Za-z_][A-Za-z0-9_]*)',
              source,
          )))
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          rows = []
          for name in names:
              locations = []
              for raw in tracked:
                  if not raw or raw == str(source_path) or raw.startswith('.cleanup-'):
                      continue
                  path = Path(raw)
                  try:
                      text = path.read_text(encoding='utf-8')
                  except (OSError, UnicodeDecodeError):
                      continue
                  count = text.count(name)
                  if count:
                      locations.append(f'{count}:{raw}')
              if locations:
                  rows.append((sum(int(item.split(':', 1)[0]) for item in locations), name, locations))
          rows.sort(key=lambda row: (-row[0], row[1]))
          with Path('.cleanup-genesis-symbol-usage.txt').open('w', encoding='utf-8') as handle:
              for count, name, locations in rows:
                  handle.write(f'{count:5d} {name}\n')
                  for item in locations:
                      handle.write(f'      {item}\n')
          PY
          git config user.name "trnm-cleanup-bot"
          git config user.email "trnm-cleanup-bot@users.noreply.github.com"
          git add "$report" "$paths" "$summary" "$symbols"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh residue and symbol inventory [inventory-bot]"
          git push origin HEAD:work/remove-cometbft-residue-20260907
