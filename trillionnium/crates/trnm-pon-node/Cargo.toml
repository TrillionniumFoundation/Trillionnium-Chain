[package]
name = "trnm-pon-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[package.metadata.trnm]
module = "M15"
role = "experimental-native-composition"
production_activation = false
consensus_authority = false

[dependencies]
trnm-protocol = { path = "../trnm-protocol" }
trnm-crypto-primitives = { path = "../trnm-crypto-primitives" }
trnm-mvcc-fee = { path = "../trnm-mvcc-fee" }
trnm-transport = { path = "../trnm-transport" }
trnm-mempool = { path = "../trnm-mempool" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
fs2 = "0.4"
libc = "0.2"
rustix = { version = "1.1.4", features = ["process"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }

tempfile = "3"
