          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-work-owner-observations/source-after.json" 2>&1 | tee "$RUNNER_TEMP/hia-work-owner-observations/source-after.log"
