          PY
      - name: Execute fresh native Host checkpoints with independent syscall tracing
        run: python3 -B -m hia.platform.host_checkpoint.qualify --require-trace --output "$RUNNER_TEMP/hia-native-host-checkpoint"
      - name: Compare native Host sequences with actual retained original Rust
        run: python3 -B -m hia.platform.host_checkpoint.rust_oracle --repository "$GITHUB_WORKSPACE/chain" --output "$RUNNER_TEMP/hia-native-host-original" --target-dir "$RUNNER_TEMP/host-original-rust"
      - name: Execute the production Host image inside the original fixed parent
        env:
          TRNM_CI_RECEIPT_DIR: ${{ runner.temp }}/hia-native-host-production
        run: python3 -B -m hia.platform.host_checkpoint.qualify_production --build "$RUNNER_TEMP/hia-native-host-checkpoint/build" --output "$RUNNER_TEMP/hia-native-host-production"
