[package]
name = "trnm-consensus-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Trillionnium Contributors"]

[package.metadata.trnm]
lane = "comet-abci-migration-residue"
mainline_role = "none"
release_component = false
native_extraction_required = true

[features]
default = []
recovery-test-support = []
scale-gate = []

[[bin]]
name = "trnm-cometbft-app"
path = "src/bin/trnm-cometbft-app.rs"

[[bin]]
name = "trnm-v3-export-new-genesis"
path = "src/bin/trnm-v3-export-new-genesis.rs"

[[bin]]
name = "trnm-auth-tree-scale"
path = "src/bin/trnm-auth-tree-scale.rs"
required-features = ["scale-gate"]

[[bin]]
name = "trnm-persistent-scale"
path = "src/bin/trnm-persistent-scale.rs"
required-features = ["scale-gate"]

[dependencies]
anyhow = "1"
borsh = { version = "1", features = ["derive"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
fs2 = "0.4"
hex = "0.4"
ics23 = "=0.12.0"
jmt = "=0.12.0"
libc = "0.2"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
sha2 = "0.10"
tendermint-abci = "0.40.4"
tendermint-proto = "0.40.4"
trnm-finality-types = { version = "0.1.0", path = "../trnm-finality-types" }
trnm-finality-verifier = { version = "0.1.0", path = "../trnm-finality-verifier" }
trnm-node = { version = "0.1.0", path = "../trnm-node" }
trnm-protocol = { version = "0.1.0", path = "../trnm-protocol" }
trnm-runtime = { version = "0.1.0", path = "../trnm-runtime" }
trnm-consensus-crypto = { version = "0.1.0", path = "../trnm-consensus-crypto" }
trnm-consensus-core = { version = "0.1.0", path = "../trnm-consensus-core" }
trnm-consensus-safety-store = { version = "0.1.0", path = "../trnm-consensus-safety-store" }
trnm-consensus-types = { version = "0.1.0", path = "../trnm-consensus-types" }

[dev-dependencies]
ed25519-dalek = "2"

# This package is excluded from the active native workspace. Its standalone
# archive workspace exists only so the checked differential vector can be
# independently re-authored and verified without entering the active graph or
# active Cargo.lock.
[workspace]
resolver = "2"
