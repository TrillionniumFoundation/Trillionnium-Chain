name: trnm-merge-gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'trillionnium-rust/**'
      - '.github/workflows/trnm-merge-gates.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'trillionnium-rust/**'
      - '.github/workflows/trnm-merge-gates.yml'

concurrency:
  group: trnm-merge-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-l1-merge-gates:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust workspace tests
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium-rust
          cargo test --workspace

      - name: Run parallel mode sanity (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium-rust
          mkdir -p run run/bench
          cargo run -q -p trnm-node -- \
            --config configs/node1.toml \
            --block-ms 5 \
            --max-blocks 6 \
            --demo-tasks 8 \
            --demo-keys 3 \
            --parallel-workers 4 | tee run/parallel-sanity.log

          if grep -E '\[tx\] apply_error|rollback=true' run/parallel-sanity.log; then
            echo "parallel sanity detected apply_error/rollback" >&2
            exit 2
          fi

      - name: Validate v1 event field freeze (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium-rust
          ./scripts/check_event_fields.sh

      - name: Validate v1 event replay order (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium-rust
          ./scripts/check_event_replay_smoke.sh

      - name: Worker-agent tx-hash receipt hard gate
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          ./scripts/v2/run_worker_receipt_gates.sh

      - name: Aggressive regression check (PR-visible warn)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium-rust

          TXS=${PR_REGRESSION_MATRIX_TXS:-5000} ./scripts/run_bench_regression_matrix.sh

          REPORT="run/bench/aggressive-regression-pr-${GITHUB_RUN_ID:-local}.txt"
          set +e
          MODE=warn \
          AGGRESSIVE_MAX_RATIO_CLASSIC=${AGGRESSIVE_MAX_RATIO_CLASSIC:-4.75} \
          AGGRESSIVE_MAX_RATIO_MIXED=${AGGRESSIVE_MAX_RATIO_MIXED:-3.75} \
          AGGRESSIVE_MAX_RATIO_HOT_STREAK=${AGGRESSIVE_MAX_RATIO_HOT_STREAK:-3.75} \
          ./scripts/check_aggressive_regression.sh 2>&1 | tee "$REPORT"
          rc=${PIPESTATUS[0]}
          set -e

          python3 scripts/summarize_aggressive_profile.py
          python3 scripts/analyze_aggressive_scan_correlation.py
          PROFILE_SUMMARY=$(ls -1t run/bench/aggressive-profile-summary-*.md | head -n 1)
          CORR_SUMMARY=$(ls -1t run/bench/aggressive-scan-correlation-*.md | head -n 1)

          if grep -q "regression ratio above threshold" "$REPORT"; then
            echo "::warning title=Aggressive regression warning::One or more aggressive/original ratios exceeded threshold. See workflow summary + artifact report."
          fi

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$REPORT" ]; then
            {
              echo "## Aggressive Regression (PR Warn Mode)"
              echo
              echo "- mode: warn"
              echo "- txs: ${PR_REGRESSION_MATRIX_TXS:-5000}"
              echo
              echo '```text'
              cat "$REPORT"
              echo '```'
              echo
              echo "## Aggressive Profile Summary"
              echo
              cat "$PROFILE_SUMMARY"
              echo
              echo "## Aggressive Scan Correlation"
              echo
              cat "$CORR_SUMMARY"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          test "$rc" -eq 0

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trnm-gate-artifacts-${{ github.run_id }}
          path: |
            trillionnium-rust/run/parallel-sanity.log
            trillionnium-rust/run/event-field-check.log
            trillionnium-rust/run/event-replay-smoke.log
            trillionnium-rust/run/bench/aggressive-regression-pr-*.txt
            trillionnium-rust/run/bench/bench-regression-matrix-*.csv
            trillionnium-rust/run/bench/aggressive-profile-summary-*.md
            trillionnium-rust/run/bench/aggressive-scan-correlation-*.md
          if-no-files-found: warn
