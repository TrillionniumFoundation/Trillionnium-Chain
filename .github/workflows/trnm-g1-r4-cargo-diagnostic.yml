name: TRNM G1-R4A tested gap closure

on:
  push:
    branches:
      - feature/chain-g1-r4-gap-closure-20260828

permissions:
  contents: write

concurrency:
  group: trnm-g1-r4a-tested-gap-closure
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"

jobs:
  test-and-push:
    name: Apply, test, and push exact R4A closure
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-g1-r4-gap-closure-20260828' &&
      github.actor == 'Tomasrgbsf' &&
      github.triggering_actor == 'Tomasrgbsf'
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 120
    steps:
      - name: Checkout exact R4A target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-g1-r4a-finalization-intent-process-matrix-20260828
          path: trillionnium-chain
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact patches, execute evidence, and push only when green
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/trnm-g1-r4a-evidence.log"
          exec > >(tee "$evidence") 2>&1

          target='feature/chain-g1-r4a-finalization-intent-process-matrix-20260828'
          carrier='feature/chain-g1-r4-gap-closure-20260828'
          expected_head='b91e98160e6a27ca367cb34c611a5eaa7b79c0a6'
          expected_tree='9fe5d8116fc9f2e0d1744e59032aee262505ebd5'
          patch_sha='b4796394e3eb9fd09e2062217e5c161d6f632dfc8698298733ccb3bb0c867075'
          fmt_patch_sha='b0bf42271a073eadfde6b88aa599670f4efaa2522fb5a9226fab0a84cb0e622e'
          format_args_patch_sha='47397248558ab266c52d657b9b209f8194183db38797072614f43a583580fb88'

          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git rev-parse HEAD^{tree})" = "$expected_tree"
          test -z "$(git status --porcelain)"
          test -f _probe
          test -f trillionnium/crates/trnm-poco-node/build.rs
          test ! -f trillionnium/crates/trnm-poco-node/src/finalization_intent_process_prefix_v1.inc

          echo '=== expected baseline preflight failure ==='
          set +e
          bash scripts/project-preflight.sh --dev
          baseline_rc=$?
          set -e
          test "$baseline_rc" -ne 0

          git fetch origin "$carrier:refs/remotes/origin/$carrier"
          git show "origin/$carrier:scripts/ci/trnm-g1-r4a-gap-closure.patch.gz.b64" \
            | base64 -d | gzip -d > "$RUNNER_TEMP/trnm-g1-r4a-gap-closure.patch"
          git show "origin/$carrier:scripts/ci/trnm-g1-r4a-rustfmt-fix.patch.gz.b64" \
            | base64 -d | gzip -d > "$RUNNER_TEMP/trnm-g1-r4a-rustfmt-fix.patch"
          git show "origin/$carrier:scripts/ci/trnm-g1-r4a-format-args-fix.patch.gz.b64" \
            | base64 -d | gzip -d > "$RUNNER_TEMP/trnm-g1-r4a-format-args-fix.patch"
          echo "$patch_sha  $RUNNER_TEMP/trnm-g1-r4a-gap-closure.patch" | sha256sum -c -
          echo "$fmt_patch_sha  $RUNNER_TEMP/trnm-g1-r4a-rustfmt-fix.patch" | sha256sum -c -
          echo "$format_args_patch_sha  $RUNNER_TEMP/trnm-g1-r4a-format-args-fix.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/trnm-g1-r4a-gap-closure.patch"
          git apply "$RUNNER_TEMP/trnm-g1-r4a-gap-closure.patch"
          git apply --check "$RUNNER_TEMP/trnm-g1-r4a-rustfmt-fix.patch"
          git apply "$RUNNER_TEMP/trnm-g1-r4a-rustfmt-fix.patch"
          git apply --check "$RUNNER_TEMP/trnm-g1-r4a-format-args-fix.patch"
          git apply "$RUNNER_TEMP/trnm-g1-r4a-format-args-fix.patch"
          test ! -e _probe

          topic=$(git rev-parse --git-path PROJECT_TOPIC)
          cat > "$topic" <<TOPIC
          project_id=trillionnium-chain
          topic=g1-r4a-finalization-intent-process-matrix
          base_head=$expected_head
          allowed_file=_probe
          allowed_dir=.github/workflows/
          allowed_dir=docs/development/packages/
          allowed_dir=scripts/
          allowed_dir=trillionnium/crates/trnm-poco-node/
          TOPIC

          echo '=== repaired worktree preflight ==='
          bash scripts/project-preflight.sh --dev
          echo '=== focused R4A evidence ==='
          bash scripts/ci/check_finalization_intent_process_matrix_v1.sh
          git diff --check

          git config user.name 'Tomasrgbsf'
          git config user.email '273673612+Tomasrgbsf@users.noreply.github.com'
          git add -A
          bash scripts/project-preflight.sh --staged
          git commit -s -m 'test(poco-node): close finalization-intent process matrix'
          new_head=$(git rev-parse HEAD)
          new_tree=$(git rev-parse HEAD^{tree})
          rm -f "$topic"

          echo '=== committed source preflight ==='
          bash scripts/project-preflight.sh --dev
          printf 'refs/heads/%s %s refs/heads/%s %s\n' \
            "$target" "$new_head" "$target" "$expected_head" \
            | bash scripts/project-preflight.sh --push origin "$(git remote get-url --push origin)"
          git push origin "HEAD:refs/heads/$target"

          printf 'source_commit=%s\nsource_tree=%s\npatch_sha256=%s\nfmt_patch_sha256=%s\nformat_args_patch_sha256=%s\n' \
            "$new_head" "$new_tree" "$patch_sha" "$fmt_patch_sha" "$format_args_patch_sha" \
            | tee "$RUNNER_TEMP/trnm-g1-r4a-source-identity.txt"
          git show --stat --oneline --decorate HEAD

      - name: Upload exact R4A evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-g1-r4a-tested-gap-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/trnm-g1-r4a-evidence.log
            ${{ runner.temp }}/trnm-g1-r4a-gap-closure.patch
            ${{ runner.temp }}/trnm-g1-r4a-rustfmt-fix.patch
            ${{ runner.temp }}/trnm-g1-r4a-format-args-fix.patch
            ${{ runner.temp }}/trnm-g1-r4a-source-identity.txt
          if-no-files-found: warn
          retention-days: 14
