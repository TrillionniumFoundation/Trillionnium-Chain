name: PoCO full qualification R27 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-full-qualification-r27-once-20260910.yml

concurrency:
  group: poco-full-qualification-r27
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r27-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"

jobs:
  qualify:
    name: Qualify immutable native PoCO tree with a reachable closure overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact controller event source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install tools and construct deterministic R27 qualifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep jq
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked

          if [[ ! -f tools/temporary_poco_full_qualifier_r26.py ]]; then
            commit="$(git log --all -1 --format=%H -- tools/temporary_poco_full_qualifier_r26.py)"
            test -n "$commit"
            git show "$commit:tools/temporary_poco_full_qualifier_r26.py" \
              >tools/temporary_poco_full_qualifier_r26.py
          fi
          test -f tools/temporary_poco_gap_overlay_r27.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("tools/temporary_poco_full_qualifier_r26.py")
          text = path.read_text(encoding="utf-8")

          workflow_anchor = '    ".github/workflows/poco-full-qualification-r26-once-20260910.yml",\n'
          workflow_line = '    ".github/workflows/poco-full-qualification-r27-once-20260910.yml",\n'
          if workflow_line not in text:
              if text.count(workflow_anchor) != 1:
                  raise SystemExit("R27 exact cleanup anchor drift")
              text = text.replace(workflow_anchor, workflow_anchor + workflow_line, 1)

          tools_anchor = '    tools = ROOT / "tools"\n'
          cleanup = '''    workflows = ROOT / ".github/workflows"
              if workflows.is_dir():
                  for pattern in (
                      "poco-only-convergence-r*-once-*.yml",
                      "poco-*-diagnostic-once-*.yml",
                      "poco-r7-source-identity-diagnostic*-once-*.yml",
                      "poco-native-vector-refresh-diagnostic-once-*.yml",
                      "apply-poco-only-purge-temporary.yml",
                      "poco-only-full-tree-audit.yml",
                      "poco-purge-source-snapshot.yml",
                  ):
                      for candidate in workflows.glob(pattern):
                          candidate.unlink()
          '''
          if cleanup not in text:
              if text.count(tools_anchor) != 1:
                  raise SystemExit("R27 temporary workflow cleanup anchor drift")
              text = text.replace(tools_anchor, cleanup + tools_anchor, 1)

          old_exclusion = '        if any(term in lowered for term in DISPATCH_EXCLUDE):\n'
          new_exclusion = '        if any(term in relative.casefold() for term in DISPATCH_EXCLUDE):\n'
          if old_exclusion in text:
              text = text.replace(old_exclusion, new_exclusion, 1)
          elif new_exclusion not in text:
              raise SystemExit("R27 dispatch exclusion anchor drift")

          pattern = re.compile(
              r"def restore_overlay\(\) -> None:\n.*?\n\ndef overlay_rounds\(\) -> int:\n",
              re.DOTALL,
          )
          replacement = '''def restore_overlay() -> None:
              source = ROOT / "tools/temporary_poco_gap_overlay_r27.py"
              if not source.is_file():
                  raise RuntimeError("reachable R27 overlay helper is missing")
              shutil.copyfile(source, OVERLAY)
              run(["python3", "-m", "py_compile", str(OVERLAY)])


def overlay_rounds() -> int:
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("R27 restore_overlay function drift")

          path.write_text(text, encoding="utf-8")
          PY

          python3 -m py_compile \
            tools/temporary_poco_gap_overlay_r27.py \
            tools/temporary_poco_full_qualifier_r26.py
          cp tools/temporary_poco_full_qualifier_r26.py /tmp/trnm-r27-qualifier.py
          python3 -m py_compile /tmp/trnm-r27-qualifier.py

      - name: Execute immutable full-tree qualification and authentic evidence orchestration
        id: qualify
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 /tmp/trnm-r27-qualifier.py

      - name: Publish exact R27 readback to PR 117
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '### PoCO R27 immutable full qualification readback'
            echo
            echo "- workflow run: \`$GITHUB_RUN_ID\`"
            echo "- controller event source: \`$GITHUB_SHA\`"
            echo "- qualifier outcome: \`${{ steps.qualify.outcome }}\`"
            if [[ -f /tmp/trnm-r26-final-commit.txt ]]; then
              echo "- immutable candidate commit: \`$(cat /tmp/trnm-r26-final-commit.txt)\`"
            fi
            if [[ -f /tmp/trnm-r26-final-tree.txt ]]; then
              echo "- immutable candidate tree: \`$(cat /tmp/trnm-r26-final-tree.txt)\`"
            fi
            if [[ -f /tmp/trnm-r26-gap-summary.txt ]]; then
              echo
              echo '#### Gap classification'
              echo '```text'
              sed -n '1,180p' /tmp/trnm-r26-gap-summary.txt
              echo '```'
            fi
            if [[ -f /tmp/trnm-r27-overlay-summary.txt ]]; then
              echo
              echo '#### Closure overlay search'
              echo '```text'
              cat /tmp/trnm-r27-overlay-summary.txt
              echo '```'
            fi
            if [[ -f /tmp/trnm-r26-review.json ]]; then
              echo
              echo '#### Independent review'
              echo '```json'
              jq '{source_commit,exact_head_approval_count:(.exact_head_approvals|length),request_returncode}' \
                /tmp/trnm-r26-review.json
              echo '```'
            fi
            if [[ -f /tmp/trnm-r26-external-status.txt ]]; then
              echo
              echo '#### External require-all gate'
              echo '```text'
              cat /tmp/trnm-r26-external-status.txt
              echo '```'
            fi
            echo
            echo 'No external acceptance or physical/human evidence was synthesized.'
          } >/tmp/trnm-r27-pr-comment-workflow.md
          gh pr comment 117 --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/trnm-r27-pr-comment-workflow.md || true

      - name: Upload exact R27 qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r27-full-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 30
          include-hidden-files: true
          path: |
            /tmp/trnm-r26-refresh-pins.log
            /tmp/trnm-r26-overlay-rounds.log
            /tmp/trnm-r27-overlay-search.json
            /tmp/trnm-r27-overlay-summary.txt
            /tmp/trnm-r26-overlay-applied-count.txt
            /tmp/trnm-r26-final-commit.txt
            /tmp/trnm-r26-final-tree.txt
            /tmp/trnm-r26-gap-inventory.json
            /tmp/trnm-r26-gap-summary.txt
            /tmp/trnm-r26-native-only.json
            /tmp/trnm-r26-canonical-plan.log
            /tmp/trnm-r26-mainline.log
            /tmp/trnm-r26-repository-truth.json
            /tmp/trnm-r26-protocol-contract.json
            /tmp/trnm-r26-workspace-check.log
            /tmp/trnm-r26-contract-check.log
            /tmp/trnm-r26-native-execution-test.log
            /tmp/trnm-r26-raw-key-test.log
            /tmp/trnm-r26-workspace-test.log
            /tmp/trnm-r26-contract-test.log
            /tmp/trnm-r26-contract-clippy.log
            /tmp/trnm-r26-boundary-clippy.log
            /tmp/trnm-r26-review.json
            /tmp/trnm-r26-dispatch.json
            /tmp/trnm-r26-external-runs.json
            /tmp/trnm-r26-external-artifacts
            /tmp/trnm-r26-external-evidence.json
            /tmp/trnm-r26-external-evidence.log
            /tmp/trnm-r26-external-status.txt
            /tmp/trnm-r26-pr-comment.md
            /tmp/trnm-r27-pr-comment-workflow.md

      - name: Preserve authentic R27 conclusion
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.qualify.outcome }}" != "success" ]]; then
            exit 1
          fi
