name: repair-native-poco-gate

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/poco-only-purge-20260909
          fetch-depth: 0
          persist-credentials: true
      - name: Restore native-only workflow truth guard and self-clean
        env:
          PLAN_BASE_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
        run: |
          set -euo pipefail
          # One-shot repair: restore the generic guard, convert its retired-package
          # assertions to native-only semantics, validate it, then delete this file.
          git fetch --no-tags origin "$PLAN_BASE_SHA"
          git show "$PLAN_BASE_SHA:scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh" > scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh
          python3 - <<'PY'
          from pathlib import Path

          script = Path("scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh")
          text = script.read_text(encoding="utf-8")
          old = '''workspace_text = workspace_manifest.read_text(encoding="utf-8")
          legacy_marker = '\"crates/trnm-consensus-app\"'
          if legacy_marker not in workspace_text:
              raise SystemExit(f"{path}: expected excluded migration package marker {legacy_marker!r}")
          '''
          new = '''workspace_text = workspace_manifest.read_text(encoding="utf-8")
          retired_markers = ('\"crates/trnm-consensus-app\"', '\"crates/trnm-node\"')
          present = [marker for marker in retired_markers if marker in workspace_text]
          if present:
              raise SystemExit(f"{path}: retired consensus package remains in active workspace: {present!r}")
          '''
          if old not in text:
              raise SystemExit("legacy workspace assertion fixture not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              'if "trillionnium/crates/trnm-consensus-app/**" in trigger_block:\n        fail(\n            f"{trigger_name}: trigger still watches excluded migration package "\n            "trillionnium/crates/trnm-consensus-app/**"\n        )',
              'for retired_path in ("trillionnium/crates/trnm-consensus-app/**", "trillionnium/crates/trnm-node/**"):\n        if retired_path in trigger_block:\n            fail(f"{trigger_name}: trigger still watches retired consensus path {retired_path}")',
              1,
          )
          script.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/trnm-poco-bft-v0.yml")
          wf = workflow.read_text(encoding="utf-8")
          empty = '''      - name: Verify workflow trigger and safety truth
          working-directory: trillionnium-chain

          - name: Verify canonical development plan and anti-pollution boundary
          '''
          fixed = '''      - name: Verify workflow trigger and safety truth
          working-directory: trillionnium-chain
          run: bash ./scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh --self-test

          - name: Verify canonical development plan and anti-pollution boundary
          '''
          if wf.count(empty) != 1:
              raise SystemExit(f"expected exactly one empty trigger-truth step, found {wf.count(empty)}")
          wf = wf.replace(empty, fixed, 1)
          wf = wf.replace('      - "docs/architecture/TRNM_CONSENSUS_DELIVERY_DUAL_TRACK_DECISION_2026-08-11.md"\n', '')
          workflow.write_text(wf, encoding="utf-8")
          PY
          chmod +x scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh
          bash scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh --self-test
          rm .github/workflows/repair-native-poco-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/trnm-poco-bft-v0.yml \
                  scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh \
                  .github/workflows/repair-native-poco-gate.yml
          git diff --cached --check
          git commit -m "ci(poco): restore native-only workflow trigger truth guard"
          git push origin HEAD:chore/poco-only-purge-20260909
