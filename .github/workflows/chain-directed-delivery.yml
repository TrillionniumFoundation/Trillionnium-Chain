name: chain-directed-delivery
on:
  push:
    branches: [dev/chain-directed-delivery-20261006]
permissions:
  contents: write
jobs:
  deliver:
    if: github.repository == 'TrillionniumFoundation/Trillionnium-Chain'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: eee8db836b98cb5b9ca7c657cc94f23018555854
      CANDIDATE: 97e00fcff9b2ad2d67ed7c3c12997f28c0531eb5
      TREE: 5574536445b433452b2e8dd6438f2b4908558613
      DESTINATION: fix/chain-owned-validation-20261007
    steps:
      - name: Checkout exact reviewed base without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve fixed reviewed patch blobs from this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          bash scripts/project-preflight.sh --audit
          mkdir "$RUNNER_TEMP/reviewed-source"
          for sha in 04acbbf3d2290a23a520f4b2f3e0c972cb89f364 314a08a7244b7cf252172ecd3e8dd12b6956fea6 c235b2b39096833180cf5db796b056d733beed52 56b25de21f2a5dbf98410432c905adc91ae8e12c 5038a1acee4257c2dd62791a6c1e4df9f9498351; do
            curl --fail --silent --show-error --max-time 30 --max-filesize 262144 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/TrillionniumFoundation/Trillionnium-Chain/git/blobs/$sha" \
              > "$RUNNER_TEMP/reviewed-source/$sha.json"
          done
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-source'
          for path in sorted(root.glob('*.json')):
              expected = path.stem
              doc = json.loads(path.read_text())
              if doc['encoding'] != 'base64' or doc['sha'] != expected:
                  raise SystemExit('blob identity/encoding mismatch')
              raw = base64.b64decode(doc['content'])
              if len(raw) != doc['size'] or len(raw) > 100000:
                  raise SystemExit('reviewed blob size mismatch')
              actual = subprocess.check_output(['git', 'hash-object', '--stdin'], input=raw).decode().strip()
              if actual != expected:
                  raise SystemExit('reviewed blob bytes mismatch')
              (root / expected).write_bytes(raw)
          PY
      - name: Reconstruct exactly the frozen continuation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          git checkout -b "$DESTINATION" "$BASE"
          for sha in 04acbbf3d2290a23a520f4b2f3e0c972cb89f364 314a08a7244b7cf252172ecd3e8dd12b6956fea6 c235b2b39096833180cf5db796b056d733beed52 56b25de21f2a5dbf98410432c905adc91ae8e12c; do
            git apply --index --check --whitespace=error-all "$RUNNER_TEMP/reviewed-source/$sha"
            git apply --index --whitespace=error-all "$RUNNER_TEMP/reviewed-source/$sha"
          done
          test "$(git write-tree)" = "$TREE"
          python3 - <<'PY'
          import os, pathlib, subprocess
          expected_paths = {
              'docs/architecture/CI_EXECUTION_CONTRACT.md',
              'docs/protocol/pon-nakamoto-v1/details/HISTORY_STATE_RESOURCE_BOUNDS_V1.md',
              'docs/protocol/pon-nakamoto-v1/details/MODEL_OPERATIONS_ACCEPTANCE_V1.md',
              'docs/protocol/pon-nakamoto-v1/details/NATIVE_AUTHENTICATED_STORAGE_V1.md',
              'docs/protocol/pon-nakamoto-v1/details/PUBLIC_POOL_INTAKE_V3.md',
              'formal/pon-nakamoto-v1/llm_adapter_contract.py',
              'formal/pon-nakamoto-v1/model_window_history.py',
              'formal/pon-nakamoto-v1/test_model_window_history.py',
              'scripts/ci/check_ci_contract.py',
              'scripts/ci/ci_job.sh',
              'scripts/ci/test_ci_contract.py',
              'trillionnium/crates/trnm-pon-node/src/ingress.rs',
              'trillionnium/crates/trnm-pon-node/src/native_authenticated_tests.rs',
              'trillionnium/crates/trnm-pon-node/src/store.rs',
              'trillionnium/crates/trnm-pon-node/src/store/native_authenticated.rs',
          }
          actual_paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual_paths != expected_paths:
              raise SystemExit('unexpected source paths')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-source'
          raw = (root / '5038a1acee4257c2dd62791a6c1e4df9f9498351').read_bytes()
          expected = os.environ['CANDIDATE']
          actual = subprocess.check_output(['git', 'hash-object', '-t', 'commit', '-w', '--stdin'], input=raw).decode().strip()
          if actual != expected:
              raise SystemExit('frozen commit mismatch')
          header = raw.split(b'\n\n', 1)[0].decode().splitlines()
          if header[:2] != ['tree ' + os.environ['TREE'], 'parent ' + os.environ['BASE']]:
              raise SystemExit('frozen tree/parent mismatch')
          PY
          git diff --cached --check
          bash scripts/project-preflight.sh --staged
          git update-ref "refs/heads/$DESTINATION" "$CANDIDATE" "$BASE"
          test -z "$(git status --porcelain)"
          bash scripts/project-preflight.sh --audit
          python3 scripts/ci/check_ci_contract.py
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$CANDIDATE"
      - name: Original push guard and normal continuation push only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test -z "$(git status --porcelain)"
          observed="$(git ls-remote origin "refs/heads/$DESTINATION" | cut -f1)"
          test "$observed" = "$BASE"
          printf 'refs/heads/%s %s refs/heads/%s %s\n' "$DESTINATION" "$CANDIDATE" "$DESTINATION" "$BASE" | bash scripts/project-preflight.sh --push origin https://github.com/TrillionniumFoundation/Trillionnium-Chain.git
          cat > "$RUNNER_TEMP/delivery-askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/delivery-askpass"
          trap 'rm -f "$RUNNER_TEMP/delivery-askpass"' EXIT
          GIT_ASKPASS="$RUNNER_TEMP/delivery-askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push origin "HEAD:refs/heads/$DESTINATION"
          test "$(git ls-remote origin "refs/heads/$DESTINATION" | cut -f1)" = "$CANDIDATE"
