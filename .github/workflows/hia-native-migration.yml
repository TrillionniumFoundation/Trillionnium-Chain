name: hia-native-migration
# HIA component coverage plan: split-general-state-import-v1
on:
  pull_request:
  push:
    branches: [feature/chain-hia-native]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hia-native-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
  TRNM_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
jobs:
  source-and-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Checkout exact chain candidate and complete archive history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact archive and source candidate
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-source-observations/source.json"
          bash scripts/project-preflight.sh --audit
          python3 hia/tools/check_migration.py
      - name: Refuse optimized-Python bootstrap false-positive evidence
        run: python3 -m unittest discover -s scripts/ci -p 'test_hia_workflow_bootstrap.py' -v
      - name: Refuse incomplete or stale additional-owner CI evidence
        run: python3 -m unittest discover -s scripts/ci -p 'test_additional_owner_binding.py' -v
      - name: Verify the bounded Settlement evidence companion
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_settlement_companion.py' -v
      - name: Prepare the original scientific conformance environment
        run: |
          set -euo pipefail
          test -x /usr/bin/time
          /usr/bin/time --version
          python3 -m venv "$RUNNER_TEMP/hia-evidence-python"
          "$RUNNER_TEMP/hia-evidence-python/bin/python" -m pip install --disable-pip-version-check -r formal/pon-nakamoto-v1/requirements.txt
          printf '%s/bin\n' "$RUNNER_TEMP/hia-evidence-python" >> "$GITHUB_PATH"
      - name: Verify removed preparation files and retained failures
        run: |
          set -euo pipefail
          python3 scripts/ci/test_historical_archive.py
          python3 scripts/ci/check_historical_archive.py --manifest evidence/pon-learning-outcome-composition-20261111/CHECKOUT_VISIBILITY_ARCHIVE.json
          python3 -m unittest discover -s scripts/ci -p 'test_sealed_ci_archive.py' -v
          python3 scripts/ci/check_sealed_ci_archive.py --manifest evidence/pon-business-gates-819309-final-20261107/ci-819/ORIGINAL_ZIP_ARCHIVE.json
          python3 -m unittest discover -s scripts/ci -p 'test_joint_resource_archive.py' -v
          python3 scripts/ci/check_joint_resource_archive.py --manifest evidence/pon-joint-resource-contract-20261109/ORIGINAL_ARCHIVE_INDEX.json
          python3 -m unittest discover -s scripts/ci -p 'test_pq_triage_archive.py' -v
          python3 scripts/ci/check_pq_triage_archive.py --manifest evidence/pq-authority-preflight-20261108-9d315/NATIVE_TRIAGE_ARCHIVE.json
          python3 -m unittest discover -s scripts/ci -p 'test_public_readiness_archive.py' -v
          TRNM_GNU_TIME=/usr/bin/time python3 -m unittest discover -s scripts/ci -p 'test_public_readiness_evidence.py' -v
          python3 scripts/ci/check_public_readiness_evidence.py --historical --evidence evidence/pon-public-readiness-v1 | tee "$RUNNER_TEMP/hia-source-observations/public-readiness.json"
          python3 -m unittest discover -s scripts/ci -p 'test_hosted_cost_archive.py' -v
          python3 evidence/pon-work-security-eight-samples-20261101/verify_evidence.py | tee "$RUNNER_TEMP/hia-source-observations/hosted-cost.json"
          python3 -m unittest discover -s scripts/ci -p 'test_d26_sqlite_archive.py' -v
          python3 scripts/ci/check_d26_sqlite_archive.py --manifest evidence/pon-business-gates-readback-20261107/D26_SQLITE_ARCHIVE.json | tee "$RUNNER_TEMP/hia-source-observations/d26-sqlite.json"
          python3 -m unittest discover -s scripts/ci -p 'test_w1_complete_archive.py' -v
          python3 evidence/pon-w1-complete-work-20261101/verify_archives.py | tee "$RUNNER_TEMP/hia-source-observations/w1-complete.json"
          python3 scripts/ci/check_pq_research_integration.py | tee "$RUNNER_TEMP/hia-source-observations/pq-source-consistency.json"
          python3 -m unittest discover -s scripts/ci -p 'test_pq_research_integration.py' -v 2>&1 | tee "$RUNNER_TEMP/hia-source-observations/pq-negative-tests.log"
          python3 scripts/refresh_distributed_source_inventory.py --check
          python3 scripts/ci/check_repository.py
      - name: Verify archive candidate sources remained unchanged
        if: always()
        run: python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Retain archive and source observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-source-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-source-observations/
          if-no-files-found: error
          retention-days: 30
  # Keep the complete native corpus, physical OS/storage controls and original
  # executor comparison independent: each retains its 20-minute job limit,
  # exact source/compiler binding and all original service resource limits.
  native-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Checkout exact chain candidate and archive history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the pinned HIA compiler source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: hia-toolchain
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            hepta
            tools
            examples
            docs
            tests
            formal
      - name: Bind exact source and finite migration scope
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-observations/source.json"
          bash scripts/project-preflight.sh --audit
          python3 hia/tools/check_migration.py
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA compiler identity differs from the pinned native compiler')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Compile the original Rust reference policies
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 -O hia/tests/rust_reference.rs -o "$RUNNER_TEMP/trnm-hia-rust-reference"
          rustc --edition=2021 --test hia/tests/rust_reference.rs -o "$RUNNER_TEMP/trnm-rust-original-tests"
          "$RUNNER_TEMP/trnm-rust-original-tests"
          cargo build --locked --manifest-path trillionnium/Cargo.toml -p trnm-protocol -p trnm-checkpoint-types -p trnm-crypto-primitives -p trnm-mvcc-fee -p trnm-types -p trnm-research-protocol --target-dir "$RUNNER_TEMP/original-rust-values" --message-format=json | tee "$RUNNER_TEMP/original-rust-build.jsonl"
          python3 - "$RUNNER_TEMP/original-rust-build.jsonl" "$RUNNER_TEMP" <<'PYCODE'
          import json, os, pathlib, subprocess, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith('{')]
          serde = [row for row in events if row.get('reason') == 'compiler-artifact' and row['target']['name'] == 'serde_json']
          if len(serde) != 1:
              raise SystemExit('one actual locked serde_json artifact required')
          if not serde[0]['package_id'].endswith('serde_json@1.0.149'):
              raise SystemExit('unexpected serde_json package_id: ' + serde[0]['package_id'])
          if set(serde[0]['features']) != {'default', 'std'}:
              raise SystemExit('unexpected serde_json features: ' + repr(serde[0]['features']))
          rlibs = [name for name in serde[0]['filenames'] if name.endswith('.rlib')]
          if len(rlibs) != 1:
              raise SystemExit('one original serde_json rlib required')
          sha2 = [row for row in events if row.get('reason') == 'compiler-artifact'
                  and row['target']['name'] == 'sha2' and row['package_id'].endswith('sha2@0.10.9')]
          if len(sha2) != 1:
              raise SystemExit('one locked sha2 0.10.9 artifact required for the original control-plane crate')
          sha2_rlibs = [name for name in sha2[0]['filenames'] if name.endswith('.rlib')]
          if len(sha2_rlibs) != 1:
              raise SystemExit('one original sha2 rlib required')
          types = [row for row in events if row.get('reason') == 'compiler-artifact'
                   and row['target']['name'] == 'trnm_types']
          if len(types) != 1 or types[0]['features'] != []:
              raise SystemExit('one unchanged original trnm-types dependency profile required')
          types_rlibs = [name for name in types[0]['filenames'] if name.endswith('.rlib')]
          if len(types_rlibs) != 1:
              raise SystemExit('one original trnm-types rlib required')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('HIA_CONTROL_PLANE_SHA2=' + sha2_rlibs[0] + '\n')
              out.write('TRNM_HIA_RUST_TYPES_RLIB=' + types_rlibs[0] + '\n')
          target = pathlib.Path(sys.argv[2]) / 'original-rust-values/debug'
          subprocess.run(['rustc', '--edition=2021', '-O', 'hia/tests/rust_state_reference.rs', '--extern', 'trnm_mvcc_fee=' + str(target / 'libtrnm_mvcc_fee.rlib'), '--extern', 'serde_json=' + rlibs[0], '-L', 'dependency=' + str(target / 'deps'), '-o', str(pathlib.Path(sys.argv[2]) / 'trnm-rust-state')], check=True)
          PYCODE
          rustc --edition=2021 -O hia/tests/rust_protocol_reference.rs --extern trnm_protocol="$RUNNER_TEMP/original-rust-values/debug/libtrnm_protocol.rlib" -L dependency="$RUNNER_TEMP/original-rust-values/debug/deps" -o "$RUNNER_TEMP/trnm-rust-protocol"
          rustc --edition=2021 -O hia/tests/rust_checkpoint_reference.rs --extern trnm_checkpoint_types="$RUNNER_TEMP/original-rust-values/debug/libtrnm_checkpoint_types.rlib" -L dependency="$RUNNER_TEMP/original-rust-values/debug/deps" -o "$RUNNER_TEMP/trnm-rust-checkpoint"
          rustc --edition=2021 -O hia/tests/rust_crypto_reference.rs --extern trnm_crypto_primitives="$RUNNER_TEMP/original-rust-values/debug/libtrnm_crypto_primitives.rlib" -L dependency="$RUNNER_TEMP/original-rust-values/debug/deps" -o "$RUNNER_TEMP/trnm-rust-crypto"
          printf 'TRNM_HIA_RUST_REFERENCE=%s/trnm-hia-rust-reference\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_PROTOCOL_REFERENCE=%s/trnm-rust-protocol\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_CHECKPOINT_REFERENCE=%s/trnm-rust-checkpoint\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_CRYPTO_REFERENCE=%s/trnm-rust-crypto\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_STATE_REFERENCE=%s/trnm-rust-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Fetch the unchanged locked dependencies for every offline general reference
        run: |
          set -euo pipefail
          # Building the policies above does not download Bench's Clap graph.
          # Keep offline mode in the reference tests; prepare the exact existing
          # lockfile here, with both successful and failed fetch streams retained.
          mkdir -p "$RUNNER_TEMP/hia-bench-observations"
          cargo fetch --locked --manifest-path trillionnium/Cargo.toml \
            >"$RUNNER_TEMP/hia-bench-observations/general-cargo-fetch.stdout.raw" \
            2>"$RUNNER_TEMP/hia-bench-observations/general-cargo-fetch.stderr.raw" || {
              cat "$RUNNER_TEMP/hia-bench-observations/general-cargo-fetch.stdout.raw"
              cat "$RUNNER_TEMP/hia-bench-observations/general-cargo-fetch.stderr.raw" >&2
              exit 1
            }
      - name: Prepare exact original M06 and M09 (General only)
        run: |
          set -euo pipefail
          python3 -B -m scripts.ci.prepare_original_m06_m09_oracles \
            --general-cargo-events "$RUNNER_TEMP/original-rust-build.jsonl" \
            --general-target "$RUNNER_TEMP/original-rust-values" \
            --output "$RUNNER_TEMP/m06-m09-original-oracles" \
            --github-env "$GITHUB_ENV"
      - name: Execute every assigned native HIA and independent reference case
        env:
          HIA_CONTROL_GUARD_OUTPUT: ${{ runner.temp }}/hia-control-guard-original
        run: |
          set -euo pipefail
          python3 -B hia/tools/qualify.py --require-rust-oracle --shard general-a --output "$RUNNER_TEMP/hia-observations/qualification.json" 2>&1 | tee "$RUNNER_TEMP/hia-observations/qualification.log"
      - name: Verify candidate sources remained unchanged
        if: always()
        run: python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-observations/source-after.json"
      - name: Retain success and failure observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-components-general-a-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-observations/
            ${{ runner.temp }}/hia-bootstrap/bootstrap.json
            ${{ runner.temp }}/original-rust-build.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: Retain complete original and HIA local guard observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-control-guard-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-control-guard-original/
          if-no-files-found: error
          retention-days: 30
  native-components-general-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Checkout exact chain candidate and archive history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: chain
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the pinned HIA compiler source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: hia-toolchain
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            hepta
            tools
            examples
            docs
            tests
            formal
      - name: Bind exact source and finite migration scope
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-observations/source.json"
          bash scripts/project-preflight.sh --audit
          python3 hia/tools/check_migration.py
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA compiler identity differs from the pinned native compiler')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Compile the original Rust reference policies
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 -O hia/tests/rust_reference.rs -o "$RUNNER_TEMP/trnm-hia-rust-reference"
          rustc --edition=2021 --test hia/tests/rust_reference.rs -o "$RUNNER_TEMP/trnm-rust-original-tests"
          "$RUNNER_TEMP/trnm-rust-original-tests"
          cargo build --locked --manifest-path trillionnium/Cargo.toml -p trnm-protocol -p trnm-checkpoint-types -p trnm-crypto-primitives -p trnm-mvcc-fee -p trnm-types -p trnm-research-protocol --target-dir "$RUNNER_TEMP/original-rust-values" --message-format=json | tee "$RUNNER_TEMP/original-rust-build.jsonl"
          python3 - "$RUNNER_TEMP/original-rust-build.jsonl" "$RUNNER_TEMP" <<'PYCODE'
          import json, os, pathlib, subprocess, sys
          events = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith('{')]
          serde = [row for row in events if row.get('reason') == 'compiler-artifact' and row['target']['name'] == 'serde_json']
          if len(serde) != 1:
              raise SystemExit('one actual locked serde_json artifact required')
          if not serde[0]['package_id'].endswith('serde_json@1.0.149'):
              raise SystemExit('unexpected serde_json package_id: ' + serde[0]['package_id'])
          if set(serde[0]['features']) != {'default', 'std'}:
              raise SystemExit('unexpected serde_json features: ' + repr(serde[0]['features']))
          rlibs = [name for name in serde[0]['filenames'] if name.endswith('.rlib')]
          if len(rlibs) != 1:
              raise SystemExit('one original serde_json rlib required')
          sha2 = [row for row in events if row.get('reason') == 'compiler-artifact'
                  and row['target']['name'] == 'sha2' and row['package_id'].endswith('sha2@0.10.9')]
          if len(sha2) != 1:
              raise SystemExit('one locked sha2 0.10.9 artifact required for the original control-plane crate')
          sha2_rlibs = [name for name in sha2[0]['filenames'] if name.endswith('.rlib')]
          if len(sha2_rlibs) != 1:
              raise SystemExit('one original sha2 rlib required')
          types = [row for row in events if row.get('reason') == 'compiler-artifact'
                   and row['target']['name'] == 'trnm_types']
          if len(types) != 1 or types[0]['features'] != []:
              raise SystemExit('one unchanged original trnm-types dependency profile required')
          types_rlibs = [name for name in types[0]['filenames'] if name.endswith('.rlib')]
          if len(types_rlibs) != 1:
              raise SystemExit('one original trnm-types rlib required')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('HIA_CONTROL_PLANE_SHA2=' + sha2_rlibs[0] + '\n')
              out.write('TRNM_HIA_RUST_TYPES_RLIB=' + types_rlibs[0] + '\n')
          target = pathlib.Path(sys.argv[2]) / 'original-rust-values/debug'
          subprocess.run(['rustc', '--edition=2021', '-O', 'hia/tests/rust_state_reference.rs', '--extern', 'trnm_mvcc_fee=' + str(target / 'libtrnm_mvcc_fee.rlib'), '--extern', 'serde_json=' + rlibs[0], '-L', 'dependency=' + str(target / 'deps'), '-o', str(pathlib.Path(sys.argv[2]) / 'trnm-rust-state')], check=True)
          PYCODE
          rustc --edition=2021 -O hia/tests/rust_protocol_reference.rs --extern trnm_protocol="$RUNNER_TEMP/original-rust-values/debug/libtrnm_protocol.rlib" -L dependency="$RUNNER_TEMP/original-rust-values/debug/deps" -o "$RUNNER_TEMP/trnm-rust-protocol"
          rustc --edition=2021 -O hia/tests/rust_checkpoint_reference.rs --extern trnm_checkpoint_types="$RUNNER_TEMP/original-rust-values/debug/libtrnm_checkpoint_types.rlib" -L dependency="$RUNNER_TEMP/original-rust-values/debug/deps" -o "$RUNNER_TEMP/trnm-rust-checkpoint"
          rustc --edition=2021 -O hia/tests/rust_crypto_reference.rs --extern trnm_crypto_primitives="$RUNNER_TEMP/original-rust-values/debug/libtrnm_crypto_primitives.rlib" -L dependency="$RUNNER_TEMP/original-rust-values/debug/deps" -o "$RUNNER_TEMP/trnm-rust-crypto"
          printf 'TRNM_HIA_RUST_REFERENCE=%s/trnm-hia-rust-reference\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_PROTOCOL_REFERENCE=%s/trnm-rust-protocol\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_CHECKPOINT_REFERENCE=%s/trnm-rust-checkpoint\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_CRYPTO_REFERENCE=%s/trnm-rust-crypto\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TRNM_HIA_RUST_STATE_REFERENCE=%s/trnm-rust-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Fetch the unchanged locked dependencies for every offline general reference
        run: |
          set -euo pipefail
          # Building the policies above does not download Bench's Clap graph.
          # Keep offline mode in the reference tests; prepare the exact existing
          # lockfile here, with both successful and failed fetch streams retained.
          mkdir -p "$RUNNER_TEMP/hia-bench-observations"
          cargo fetch --locked --manifest-path trillionnium/Cargo.toml \
            >"$RUNNER_TEMP/hia-bench-observations/general-cargo-fetch.stdout.raw" \
            2>"$RUNNER_TEMP/hia-bench-observations/general-cargo-fetch.stderr.raw" || {
              cat "$RUNNER_TEMP/hia-bench-observations/general-cargo-fetch.stdout.raw"
              cat "$RUNNER_TEMP/hia-bench-observations/general-cargo-fetch.stderr.raw" >&2
              exit 1
            }
      - name: Prepare exact original M06 and M09 (General only)
        run: |
          set -euo pipefail
          python3 -B -m scripts.ci.prepare_original_m06_m09_oracles \
            --general-cargo-events "$RUNNER_TEMP/original-rust-build.jsonl" \
            --general-target "$RUNNER_TEMP/original-rust-values" \
            --output "$RUNNER_TEMP/m06-m09-original-oracles" \
            --github-env "$GITHUB_ENV"
      - name: Execute every assigned native HIA and independent reference case
        env:
