name: TRNM reproducible campaign build ded43a v1

on:
  push:
    branches:
      - evidence/reproducible-campaign-build-ded43a-v1-20260909

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: trnm-reproducible-campaign-build-ded43a-v1
  cancel-in-progress: false

jobs:
  build:
    name: independent build ${{ matrix.repetition }}
    strategy:
      fail-fast: false
      matrix:
        repetition: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUBJECT_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
      SUBJECT_TREE: c0791ffb57e05fde43f87bfed1a3b4656c09efc0
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out exact immutable subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${SUBJECT_TREE}"
          git diff --quiet
          git diff --cached --quiet

      - name: Install pinned build toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 -Vv | tee "${RUNNER_TEMP}/rustc-version.txt"
          cargo +1.95.0 -V | tee "${RUNNER_TEMP}/cargo-version.txt"
          ld --version | head -1 | tee "${RUNNER_TEMP}/linker-version.txt"

      - name: Build campaign-facing binaries with deterministic inputs
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/trnm-repro-target
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${SUBJECT_SHA}")"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/workspace -C link-arg=-Wl,--build-id=none"
          cargo +1.95.0 build \
            --manifest-path trillionnium/Cargo.toml \
            --locked \
            --release \
            -p trnm-poco-lab-validator \
            -p trnm-poco-node \
            -p trnm-consensus-remote-signer-service \
            -p trnm-consensus-external-watermark \
            -p trnm-consensus-external-node-checkpoint \
            2>&1 | tee "${RUNNER_TEMP}/build.log"

      - name: Normalize and inventory campaign artifacts
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/trnm-repro-target
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/trnm-repro-build-${{ matrix.repetition }}"
          mkdir -p "${root}/bin" "${root}/evidence"
          while IFS= read -r -d '' path; do
            name="$(basename "${path}")"
            case "${name}" in
              build|deps|examples|incremental|*.d|*.rlib|*.rmeta|*.so|*.a) continue ;;
            esac
            cp "${path}" "${root}/bin/${name}"
            chmod 0755 "${root}/bin/${name}"
            strip --strip-all "${root}/bin/${name}"
          done < <(find "${CARGO_TARGET_DIR}/release" -maxdepth 1 -type f -perm /111 -print0 | sort -z)
          count="$(find "${root}/bin" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "${count}" -ge 5
          cp "${RUNNER_TEMP}/rustc-version.txt" "${root}/evidence/"
          cp "${RUNNER_TEMP}/cargo-version.txt" "${root}/evidence/"
          cp "${RUNNER_TEMP}/linker-version.txt" "${root}/evidence/"
          cp "${RUNNER_TEMP}/build.log" "${root}/evidence/"
          cargo +1.95.0 metadata \
            --manifest-path trillionnium/Cargo.toml \
            --locked --format-version 1 \
            > "${root}/evidence/cargo-metadata.json"
          cat > "${root}/evidence/manifest.json" <<EOF
          {
            "schema": "trnm-reproducible-campaign-build-v1",
            "repository": "${GITHUB_REPOSITORY}",
            "workflow_source_sha": "${GITHUB_SHA}",
            "subject_sha": "${SUBJECT_SHA}",
            "subject_tree": "${SUBJECT_TREE}",
            "repetition": "${{ matrix.repetition }}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "binary_count": ${count},
            "production_candidate": false,
            "external_campaign_accepted": false,
            "release_ready": false
          }
          EOF
          (
            cd "${root}/bin"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > "${root}/BINARY_SHA256SUMS"
          )
          (
            cd "${root}"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload independent build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-repro-build-${{ matrix.repetition }}-${{ github.run_id }}
          path: ${{ runner.temp }}/trnm-repro-build-${{ matrix.repetition }}/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Verify no source mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SUBJECT_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${SUBJECT_TREE}"
          git diff --quiet
          git diff --cached --quiet

  compare:
    name: compare independent binary digests
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SUBJECT_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
      SUBJECT_TREE: c0791ffb57e05fde43f87bfed1a3b4656c09efc0
    steps:
      - name: Download both build artifacts from this exact run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/comparison/a" "${RUNNER_TEMP}/comparison/b" "${RUNNER_TEMP}/comparison/evidence"
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "trnm-repro-build-a-${GITHUB_RUN_ID}" --dir "${RUNNER_TEMP}/comparison/a"
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "trnm-repro-build-b-${GITHUB_RUN_ID}" --dir "${RUNNER_TEMP}/comparison/b"

      - name: Verify source binding and compare binaries byte-for-byte
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/comparison"
          for rep in a b; do
            manifest="${root}/${rep}/evidence/manifest.json"
            test -s "${manifest}"
            test "$(jq -r '.subject_sha' "${manifest}")" = "${SUBJECT_SHA}"
            test "$(jq -r '.subject_tree' "${manifest}")" = "${SUBJECT_TREE}"
            test "$(jq -r '.repetition' "${manifest}")" = "${rep}"
            test -s "${root}/${rep}/BINARY_SHA256SUMS"
          done
          diff -u "${root}/a/BINARY_SHA256SUMS" "${root}/b/BINARY_SHA256SUMS" \
            | tee "${root}/evidence/binary-digest.diff"
          a_count="$(find "${root}/a/bin" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          b_count="$(find "${root}/b/bin" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "${a_count}" = "${b_count}"
          test "${a_count}" -ge 5
          cat > "${root}/evidence/comparison.json" <<EOF
          {
            "schema": "trnm-reproducible-campaign-build-comparison-v1",
            "subject_sha": "${SUBJECT_SHA}",
            "subject_tree": "${SUBJECT_TREE}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "independent_build_count": 2,
            "binary_count": ${a_count},
            "byte_identical": true,
            "production_candidate": false,
            "external_campaign_accepted": false,
            "release_ready": false
          }
          EOF
          echo "byte_identical=true" >> "${GITHUB_OUTPUT}"
          (
            cd "${root}/evidence"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-repro-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison/evidence/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Publish bounded result to integration and campaign board
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="${{ steps.compare.outputs.byte_identical }}"
          cat > "${RUNNER_TEMP}/comparison/comment.md" <<EOF
          <!-- trnm-reproducible-campaign-build-ded43a-v1 -->
          ## Independent exact-source campaign build comparison

          - subject: \`${SUBJECT_SHA}\` / \`${SUBJECT_TREE}\`
          - workflow run: \`${GITHUB_RUN_ID}\`
          - byte-identical result: \`${result:-false}\`

          Two independent hosted VMs built the candidate node/lab-validator/remote-signer/watermark/checkpoint package from the same locked source. Complete binaries, manifests, build logs and comparison hashes are retained. This is reproducible-build input only and does not establish multi-host operation, independent custody, HSM, physical power loss, audit, soak, production, testnet, release or activation acceptance.
          EOF
          for issue in 62 81; do
            jq -n --rawfile body "${RUNNER_TEMP}/comparison/comment.md" '{body:$body}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" --input -
          done

      - name: Require both builds and exact binary equality
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.build.result }}" = success
          test "${{ steps.compare.outputs.byte_identical }}" = true
