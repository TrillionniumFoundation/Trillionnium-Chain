name: PoN complete relation and bounded verifier research
on:
  pull_request:
    paths:
      - formal/pon-nakamoto-v1/**
      - config/pon/**
      - trillionnium/**
      - scripts/w1_specialized_relation_observation.py
      - scripts/w1_v2_supervisor*.py
      - scripts/test_w1_v2_supervisor.py
      - scripts/ci/verify_ci_source.py
      - scripts/project-preflight.sh
      - evidence/pon-w1-full-v2-20261105/**
      - .github/workflows/pon-proof-relations-research.yml
permissions:
  contents: read
concurrency:
  group: pon-proof-relations-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  RUST_TEST_THREADS: "1"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  relations:
    name: Complete relation research (${{ matrix.source }}, x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: [head, prospective-merge]
    env:
      SOURCE_KIND: ${{ matrix.source }}
      EXPECTED_SOURCE: ${{ matrix.source == 'head' && github.event.pull_request.head.sha || github.sha }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and isolated outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pon-proof-relations"
          printf 'PROOF_OUT=%s/pon-proof-relations\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/pon-proof-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s/pon-proof-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          args=(--kind "$SOURCE_KIND" --expected-head "$EXPECTED_HEAD")
          if test "$SOURCE_KIND" = prospective-merge; then
            args+=(--expected-base "$EXPECTED_BASE" --expected-merge "$EXPECTED_SOURCE")
          fi
          python3 scripts/ci/verify_ci_source.py "${args[@]}" --output "$RUNNER_TEMP/pon-proof-relations/source-before.json"
          bash scripts/project-preflight.sh --audit
      - name: Install pinned scientific reference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pon-proof-python"
          "$RUNNER_TEMP/pon-proof-python/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r formal/pon-nakamoto-v1/requirements.txt
          "$RUNNER_TEMP/pon-proof-python/bin/python" -m pip freeze > "$PROOF_OUT/python-dependencies.txt"
          printf '%s/pon-proof-python/bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Full W1 and actual process controls before compiler load
        shell: bash
        run: |
          set -euo pipefail
          python3 formal/pon-nakamoto-v1/test_w1_specialized_relation.py -v 2>&1 | tee "$PROOF_OUT/w1-reference-tests.log"
          python3 -m unittest discover -s formal/pon-nakamoto-v1 -p 'test_bounded_process*.py' -v 2>&1 | tee "$PROOF_OUT/bounded-process-tests.log"
          python3 scripts/test_w1_v2_supervisor.py -v 2>&1 | tee "$PROOF_OUT/supervisor-tests.log"
          python3 scripts/w1_specialized_relation_observation.py --out "$PROOF_OUT/complete-reference"
      - name: Install fixed compiler
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustc +1.95.0 --version --verbose | tee "$PROOF_OUT/rustc.txt"
      - name: Locked V2 verifier graph, tests and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          manifest=formal/pon-nakamoto-v1/w1_v2_verifier/Cargo.toml
          cargo +1.95.0 metadata --locked --manifest-path "$manifest" --format-version 1 > "$PROOF_OUT/verifier-graph.json"
          cargo +1.95.0 fmt --manifest-path "$manifest" --all -- --check
          cargo +1.95.0 test --locked --release --manifest-path "$manifest" -- --test-threads=1 2>&1 | tee "$PROOF_OUT/verifier-tests.log"
          cargo +1.95.0 clippy --locked --release --manifest-path "$manifest" --all-targets -- -D warnings 2>&1 | tee "$PROOF_OUT/verifier-clippy.log"
          cargo +1.95.0 build --locked --release --manifest-path "$manifest"
      - name: Actual saved-proof refusal and recovery
        shell: bash
        run: |
          set -euo pipefail
          verifier="$CARGO_TARGET_DIR/release/w1-verify-v2"
          verifier_sha=$(sha256sum "$verifier" | cut -d ' ' -f 1)
          python3 scripts/w1_v2_supervisor_controls.py --verifier "$verifier" --verifier-sha256 "$verifier_sha" \
            --receipt evidence/pon-w1-full-v2-20261105/succinct.bin \
            --header evidence/pon-w1-full-v2-20261105/header.bin \
            --expected-artifacts evidence/pon-w1-full-v2-20261105/expected-artifacts.bin \
            --out "$PROOF_OUT/saved-proof-controls"
      - name: Existing Cell plus explicit v2 native semantics
        shell: bash
        run: |
          set -euo pipefail
          manifest=formal/pon-nakamoto-v1/useful_cell_v2/Cargo.toml
          cargo +1.95.0 metadata --locked --manifest-path "$manifest" --format-version 1 > "$PROOF_OUT/cell-graph.json"
          cargo +1.95.0 fmt --manifest-path "$manifest" --all -- --check
          cargo +1.95.0 test --locked --release --manifest-path "$manifest" -- --test-threads=1 2>&1 | tee "$PROOF_OUT/cell-tests.log"
          cargo +1.95.0 clippy --locked --release --manifest-path "$manifest" --all-targets -- -D warnings 2>&1 | tee "$PROOF_OUT/cell-clippy.log"
          cargo +1.95.0 build --locked --release --manifest-path "$manifest"
          python3 formal/pon-nakamoto-v1/useful_cell_v2/reproduce.py \
            --runner "$CARGO_TARGET_DIR/release/trnm-useful-cell-v2-reference" --out "$PROOF_OUT/cell-replay"
      - name: Retain final source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          args=(--kind "$SOURCE_KIND" --expected-head "$EXPECTED_HEAD")
          if test "$SOURCE_KIND" = prospective-merge; then
            args+=(--expected-base "$EXPECTED_BASE" --expected-merge "$EXPECTED_SOURCE")
          fi
          python3 scripts/ci/verify_ci_source.py "${args[@]}" --output "$RUNNER_TEMP/pon-proof-relations/source-after.json"
      - name: Retain all observations without proof generation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pon-proof-relations-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pon-proof-relations
          if-no-files-found: warn
