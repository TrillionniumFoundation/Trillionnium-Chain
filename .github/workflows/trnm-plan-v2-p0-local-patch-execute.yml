name: TRNM Plan v2 P0 Alternate Storage Repair

on:
  push:
    branches:
      - automation/plan-v2-p0-local-patch-20260901
    paths:
      - .github/workflows/trnm-plan-v2-p0-local-patch-execute.yml

permissions:
  contents: write

concurrency:
  group: trnm-plan-v2-p0-alternate-storage-repair
  cancel-in-progress: false

env:
  CI: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
  TRNM_CARGO_OFFLINE_POLICY: required
  PYTHONDONTWRITEBYTECODE: "1"
  TARGET_BRANCH: integration/native-poco-a04-a19-a23-qualified-v1-20260901
  TARGET_EXPECTED_SHA: 3c46293e78a125dec9504e51c355a20216341338
  PATCH_SHA256: 7c4d3213a83ec1fb50aad0970177c8b3f4ab3199bbf62e721e425d1a4cac1ea8

jobs:
  qualify-and-publish:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/automation/plan-v2-p0-local-patch-20260901' &&
      github.actor == 'Tomasrgbsf' &&
      github.triggering_actor == 'Tomasrgbsf'
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 220
    steps:
      - name: Check out exact carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: trillionnium-chain

      - name: Verify carrier and materialize immutable patch
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "09590fa6a9c897d31417acb96548949c52f7631d"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/trnm-plan-v2-p0-local-patch-execute.yml"
          base64 --decode .github/patches/p0-finalization-history.patch.gz.b64 \
            | gzip --decompress --stdout > "$RUNNER_TEMP/p0-finalization-history.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/p0-finalization-history.patch" \
            | sha256sum --check --strict

      - name: Verify trusted toolchain and offline dependency closure
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 --component rustfmt --component clippy
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock

      - name: Apply repair to exact sole successor
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_EXPECTED_SHA"
          git checkout -B "$TARGET_BRANCH" "$TARGET_EXPECTED_SHA"
          bash scripts/project-preflight.sh --audit
          git apply --check "$RUNNER_TEMP/p0-finalization-history.patch"
          git apply "$RUNNER_TEMP/p0-finalization-history.patch"
          expected_paths="$({
            printf '%s\n' trillionnium/Cargo.lock
            printf '%s\n' trillionnium/crates/trnm-native-application-sqlite/Cargo.toml
            printf '%s\n' trillionnium/crates/trnm-native-application-sqlite/src/finalization_history.rs
          } | sort)"
          actual_paths="$(git diff --name-only | sort)"
          test "$actual_paths" = "$expected_paths"
          git diff --check

      - name: Format and validate storage authority plus consumers
        working-directory: trillionnium-chain/trillionnium
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked -p trnm-native-application-sqlite --all-targets
          cargo clippy --locked -p trnm-native-application-sqlite --all-targets -- -D warnings
          cargo test --locked -p trnm-native-execution-v0 --all-targets
          cargo check --locked -p trnm-poco-node --all-targets

      - name: Publish first fully qualified source-only repair
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_EXPECTED_SHA"
          test ! -e .github/workflows/trnm-plan-v2-p0-local-patch-execute.yml
          test ! -e .github/patches/p0-finalization-history.patch.gz.b64
          git diff --check
          git config user.name "trillionnium-closure-bot"
          git config user.email "trillionnium-closure-bot@users.noreply.github.com"
          git add \
            trillionnium/Cargo.lock \
            trillionnium/crates/trnm-native-application-sqlite/Cargo.toml \
            trillionnium/crates/trnm-native-application-sqlite/src/finalization_history.rs
          git commit -m "fix(storage): close finalization-history namespace and schema gaps"
          test "$(git rev-parse HEAD^)" = "$TARGET_EXPECTED_SHA"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${TARGET_EXPECTED_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
