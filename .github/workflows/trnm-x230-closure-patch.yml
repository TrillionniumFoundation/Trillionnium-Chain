name: TRNM X230 one-shot closure patch

on:
  push:
    branches:
      - integration/native-poco-a04-a19-a23-qualified-v1-20260901
    paths:
      - .github/workflows/trnm-x230-closure-patch.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: trnm-x230-one-shot-closure-patch
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf') &&
      github.triggering_actor == github.actor
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 45
    env:
      CARGO_NET_OFFLINE: "true"
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/native-poco-a04-a19-a23-qualified-v1-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply exact X230 lock, workflow guards, and policy classes
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-27 generate-lockfile \
            --manifest-path trillionnium/fuzz/Cargo.toml \
            --offline
          test "$(sha256sum trillionnium/fuzz/Cargo.lock | awk '{print $1}')" = \
            "f856eaedb0fd390f2a7d47c98efbe7f69ba17669257653803068758dbb089a55"
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} legacy guard blocks, found {actual}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          standard_old = """      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
                (github.event_name == 'schedule' ||
                  (github.actor == 'ProfAlexQI' &&
                   github.triggering_actor == 'ProfAlexQI' &&
                   (github.event_name != 'pull_request' ||
                    github.event.pull_request.head.repo.full_name == github.repository)))
          """
          standard_new = """      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
                (github.event_name == 'schedule' ||
                  ((github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf') &&
                   github.triggering_actor == github.actor &&
                   (github.event_name != 'pull_request' ||
                    github.event.pull_request.head.repo.full_name == github.repository)))
          """
          for path, expected in (
              (".github/workflows/trnm-cometbft-spike.yml", 3),
              (".github/workflows/trnm-gate-quick-check.yml", 1),
              (".github/workflows/trnm-merge-gates.yml", 1),
          ):
              replace_exact(path, standard_old, standard_new, expected)

          poco_old = """      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
                (github.event_name == 'schedule' &&
                 github.ref == 'refs/heads/main' ||
                  (github.actor == 'ProfAlexQI' &&
                   github.triggering_actor == 'ProfAlexQI' &&
                   (github.event_name != 'pull_request' ||
                    github.event.pull_request.head.repo.full_name == github.repository)))
          """
          poco_new = """      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
                (github.event_name == 'schedule' &&
                 github.ref == 'refs/heads/main' ||
                  ((github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf') &&
                   github.triggering_actor == github.actor &&
                   (github.event_name != 'pull_request' ||
                    github.event.pull_request.head.repo.full_name == github.repository)))
          """
          replace_exact(
              ".github/workflows/trnm-poco-bft-v0.yml", poco_old, poco_new, 6
          )

          path = Path("scripts/check_ci_runner_policy.sh")
          text = path.read_text(encoding="utf-8")

          standard_marker = """PAYLOAD_GUARD = (
          """
          maintainer_guard = """MAINTAINER_GUARD = (
              "github.repository == 'TrillionniumFoundation/Trillionnium-Chain' && "
              "(github.event_name == 'schedule' || ((github.actor == 'ProfAlexQI' || "
              "github.actor == 'Tomasrgbsf') && github.triggering_actor == github.actor && "
              "(github.event_name != 'pull_request' || "
              "github.event.pull_request.head.repo.full_name == github.repository)))"
          )

          """
          if text.count(standard_marker) != 1 or "MAINTAINER_GUARD = (" in text:
              raise SystemExit("unexpected standard guard policy shape")
          text = text.replace(standard_marker, maintainer_guard + standard_marker, 1)

          poco_marker = """P1_GUARD = (
          """
          poco_maintainer_guard = """POCO_MAINTAINER_GUARD = (
              "github.repository == 'TrillionniumFoundation/Trillionnium-Chain' && "
              "(github.event_name == 'schedule' && github.ref == 'refs/heads/main' || "
              "((github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf') && "
              "github.triggering_actor == github.actor && "
              "(github.event_name != 'pull_request' || "
              "github.event.pull_request.head.repo.full_name == github.repository)))"
          )

          """
          if text.count(poco_marker) != 1 or "POCO_MAINTAINER_GUARD = (" in text:
              raise SystemExit("unexpected PoCo guard policy shape")
          text = text.replace(poco_marker, poco_maintainer_guard + poco_marker, 1)

          old = '''def required_guard(name: str) -> str:
              if name in {
                  "trnm-payload-replay-recovery-v1.yml",
                  "trnm-replay-to-core-coordinator-v1.yml",
                  "trnm-p2-node-candidate-devnet-cli.yml",
              }:
                  return PAYLOAD_GUARD
              if name == "trnm-poco-bft-v0.yml":
                  return POCO_GUARD
              if name == "p1-rust-sidecar.yml":
                  return P1_GUARD
              return STANDARD_GUARD
          '''
          new = '''def required_guard(name: str) -> str:
              if name in {
                  "trnm-payload-replay-recovery-v1.yml",
                  "trnm-replay-to-core-coordinator-v1.yml",
                  "trnm-p2-node-candidate-devnet-cli.yml",
              }:
                  return PAYLOAD_GUARD
              if name == "trnm-poco-bft-v0.yml":
                  return POCO_MAINTAINER_GUARD
              if name == "p1-rust-sidecar.yml":
                  return P1_GUARD
              if name in {
                  "trnm-canonical-input-fuzz-smoke.yml",
                  "trnm-cometbft-spike.yml",
                  "trnm-gate-quick-check.yml",
                  "trnm-merge-gates.yml",
              }:
                  return MAINTAINER_GUARD
              return STANDARD_GUARD
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one legacy required_guard function")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/trnm-x230-closure-patch.yml
          git diff --check -- \
            .github/workflows/trnm-cometbft-spike.yml \
            .github/workflows/trnm-gate-quick-check.yml \
            .github/workflows/trnm-merge-gates.yml \
            .github/workflows/trnm-poco-bft-v0.yml \
            .github/workflows/trnm-x230-closure-patch.yml \
            scripts/check_ci_runner_policy.sh \
            trillionnium/fuzz/Cargo.lock

      - name: Validate policy, offline readiness, and canonical fuzz smoke
        run: |
          set -euo pipefail
          bash scripts/check_ci_runner_policy.sh --worktree
          bash scripts/check_cargo_offline_policy.sh --worktree
          ./scripts/ci/check_preprovisioned_cargo_fuzz.sh
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain nightly-2026-07-27 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/fuzz/Cargo.toml:trillionnium/fuzz/Cargo.lock
          TRNM_FUZZ_SMOKE_SECONDS=5 ./scripts/ci/check_canonical_fuzz_smoke.sh
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"

      - name: Commit deterministic closure patch and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/trnm-cometbft-spike.yml \
            .github/workflows/trnm-gate-quick-check.yml \
            .github/workflows/trnm-merge-gates.yml \
            .github/workflows/trnm-poco-bft-v0.yml \
            .github/workflows/trnm-x230-closure-patch.yml \
            scripts/check_ci_runner_policy.sh \
            trillionnium/fuzz/Cargo.lock
          mapfile -t changed < <(git diff --cached --name-only | LC_ALL=C sort)
          expected=(
            .github/workflows/trnm-cometbft-spike.yml
            .github/workflows/trnm-gate-quick-check.yml
            .github/workflows/trnm-merge-gates.yml
            .github/workflows/trnm-poco-bft-v0.yml
            .github/workflows/trnm-x230-closure-patch.yml
            scripts/check_ci_runner_policy.sh
            trillionnium/fuzz/Cargo.lock
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          git diff --cached --check
          git commit -m 'ci(x230): close canonical fuzz lock and trusted guard drift'
          git push origin HEAD:integration/native-poco-a04-a19-a23-qualified-v1-20260901
