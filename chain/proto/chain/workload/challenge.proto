syntax = "proto3";
package chain.workload;

option go_package = "chain/x/workload/types";

message Challenge {
  uint64 id = 1;
  uint64 taskId = 2;
  string challenger = 3;
  string worker = 4;
  uint64 status = 5;
  uint64 deposit = 6;
  string reason = 7;
  string evidenceUri = 8;
  uint64 createdHeight = 9;
  uint64 resolvedHeight = 10;
}
