name: PoCO repository metadata cleanup R4 evidence (temporary)

on:
  push:
    branches:
      - ops-poco-metadata-cleanup-20260910-r3
    paths:
      - .github/workflows/poco-repository-metadata-cleanup-r4-evidence-once-20260910.yml

permissions:
  contents: write

env:
  OPS_BRANCH: ops-poco-metadata-cleanup-20260910-r3
  PRODUCT_BRANCH: chore/poco-only-purge-20260909
  EVIDENCE_BRANCH: evidence-poco-metadata-cleanup-20260910

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact operations branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPS_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply metadata cleanup and write exact evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$OPS_BRANCH"

          git fetch --no-tags origin "$PRODUCT_BRANCH" "$EVIDENCE_BRANCH"
          PRODUCT_SHA="$(git rev-parse FETCH_HEAD)"
          PRODUCT_TREE="$(git rev-parse "${PRODUCT_SHA}^{tree}")"

          noop_before=false
          if git ls-remote --exit-code --heads origin refs/heads/noop >/dev/null 2>&1; then
            noop_before=true
            git push origin --delete noop
          fi
          noop_absent=true
          if git ls-remote --exit-code --heads origin refs/heads/noop >/dev/null 2>&1; then
            noop_absent=false
          fi

          set +e
          printf '%s\n' '{"names":["blockchain","poco","rust","trillionnium"]}' \
          | gh api --method PUT \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/topics" \
              --input - \
              >/tmp/topics-write.json 2>/tmp/topics-write.stderr
          topics_write_rc=$?
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/topics" \
              >/tmp/topics-readback.json 2>/tmp/topics-readback.stderr
          topics_read_rc=$?
          set -e

          topics_ok=false
          if test "$topics_write_rc" -eq 0 && test "$topics_read_rc" -eq 0; then
            if jq -e '.names | sort == ["blockchain","poco","rust","trillionnium"]' \
              /tmp/topics-readback.json >/dev/null; then
              topics_ok=true
            fi
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def text(path):
              p = Path(path)
              return p.read_text(errors='replace') if p.exists() else ''

          result = {
              'schema': 'trnm.poco.repository-metadata-cleanup.v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'operations_branch': os.environ['OPS_BRANCH'],
              'product_branch': os.environ['PRODUCT_BRANCH'],
              'product_commit': os.environ['PRODUCT_SHA'],
              'product_tree': os.environ['PRODUCT_TREE'],
              'noop_branch_present_before': os.environ['NOOP_BEFORE'] == 'true',
              'noop_branch_absent_after': os.environ['NOOP_ABSENT'] == 'true',
              'topics_write_return_code': int(os.environ['TOPICS_WRITE_RC']),
              'topics_read_return_code': int(os.environ['TOPICS_READ_RC']),
              'topics_exact_poco_only': os.environ['TOPICS_OK'] == 'true',
              'topics_write_response': text('/tmp/topics-write.json'),
              'topics_write_error': text('/tmp/topics-write.stderr'),
              'topics_readback': text('/tmp/topics-readback.json'),
              'topics_read_error': text('/tmp/topics-readback.stderr'),
          }
          result['success'] = (
              result['noop_branch_absent_after']
              and result['topics_exact_poco_only']
          )
          Path('/tmp/poco-metadata-cleanup-result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n'
          )
          PY
        env:
          PRODUCT_SHA: ${{ env.PRODUCT_SHA }}
          PRODUCT_TREE: ${{ env.PRODUCT_TREE }}
          NOOP_BEFORE: ${{ env.NOOP_BEFORE }}
          NOOP_ABSENT: ${{ env.NOOP_ABSENT }}
          TOPICS_WRITE_RC: ${{ env.TOPICS_WRITE_RC }}
          TOPICS_READ_RC: ${{ env.TOPICS_READ_RC }}
          TOPICS_OK: ${{ env.TOPICS_OK }}

      - name: Publish metadata result to evidence branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/poco-metadata-evidence
          git worktree add -B "$EVIDENCE_BRANCH" /tmp/poco-metadata-evidence "origin/$EVIDENCE_BRANCH"
          mkdir -p /tmp/poco-metadata-evidence/evidence/repository
          cp /tmp/poco-metadata-cleanup-result.json \
            /tmp/poco-metadata-evidence/evidence/repository/poco-metadata-cleanup-v1.json
          git -C /tmp/poco-metadata-evidence add evidence/repository/poco-metadata-cleanup-v1.json
          git -C /tmp/poco-metadata-evidence config user.name "Qian QI"
          git -C /tmp/poco-metadata-evidence config user.email "102159240+ProfHepta@users.noreply.github.com"
          if ! git -C /tmp/poco-metadata-evidence diff --cached --quiet; then
            git -C /tmp/poco-metadata-evidence commit -m "evidence: record PoCO repository metadata cleanup"
            git -C /tmp/poco-metadata-evidence push origin "$EVIDENCE_BRANCH"
          fi

      - name: Require successful metadata cleanup and remove operations branch
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.success == true' /tmp/poco-metadata-cleanup-result.json >/dev/null
          git push origin --delete "$OPS_BRANCH"

      - name: Upload exact failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-metadata-r4-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/poco-metadata-cleanup-result.json
            /tmp/topics-write.json
            /tmp/topics-write.stderr
            /tmp/topics-readback.json
            /tmp/topics-readback.stderr
