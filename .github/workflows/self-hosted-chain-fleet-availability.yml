          uname -a

  claw:
    name: Chain claw-j3160 runner probe
    runs-on: [self-hosted, linux, x64, chain-fleet, claw-j3160]
    timeout-minutes: 10
    steps:
      - name: Verify claw-j3160 slot
        shell: bash
