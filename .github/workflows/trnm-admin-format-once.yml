name: trnm-admin-format-once

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/trnm-admin-format-once.yml

permissions:
  contents: write

env:
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CARGO_TERM_COLOR: never
  EXPECTED_PARENT: 58e4db3d09fb6fe09075f42f456df76cb675e467
  TARGET_BRANCH: work/plan-v2-full-gap-closure-20260902

jobs:
  exact-rustfmt-repair:
    name: exact-rustfmt-repair-x230
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.actor == 'ProfHepta' &&
      github.triggering_actor == github.actor &&
      github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 30
    steps:
      - name: Check out the exact integration branch with bounded write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-shot source identity and toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          test -z "$(git status --porcelain --untracked-files=all)"
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 \
            --component rustfmt

      - name: Apply rustfmt and enforce the exact changed-path closure
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git diff --check
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check

          actual="$RUNNER_TEMP/rustfmt-actual-paths"
          expected="$RUNNER_TEMP/rustfmt-expected-paths"
          git diff --name-only -- . | LC_ALL=C sort > "$actual"
          cat > "$expected" <<'PATHS'
          trillionnium/crates/trnm-durable-file-adapters-v0/src/bin/trnm-candidate-persistent-host.rs
          trillionnium/crates/trnm-durable-file-adapters-v0/tests/candidate_persistent_host_process.rs
          trillionnium/crates/trnm-native-execution-v0/src/overlay_delta_tests.rs
          trillionnium/crates/trnm-node-boundary-v0/src/host_recovery_tests.rs
          trillionnium/crates/trnm-node-boundary-v0/src/lib.rs
          trillionnium/crates/trnm-poco-node-host/tests/authority_session_durable.rs
          trillionnium/crates/trnm-poco-node-production-v0/src/authority_session_tests.rs
          trillionnium/crates/trnm-poco-node-production-v0/src/lib.rs
          trillionnium/crates/trnm-state-sync-v0/tests/staging_admission.rs
          trillionnium/crates/trnm-state-sync-v0/tests/verification_seals.rs
          PATHS
          LC_ALL=C sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          test -z "$(git diff --name-only -- trillionnium/Cargo.lock trillionnium/Cargo.toml .github/workflows ':!/.github/workflows/trnm-admin-format-once.yml')"

      - name: Commit only the verified formatting repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            trillionnium/crates/trnm-durable-file-adapters-v0/src/bin/trnm-candidate-persistent-host.rs \
            trillionnium/crates/trnm-durable-file-adapters-v0/tests/candidate_persistent_host_process.rs \
            trillionnium/crates/trnm-native-execution-v0/src/overlay_delta_tests.rs \
            trillionnium/crates/trnm-node-boundary-v0/src/host_recovery_tests.rs \
            trillionnium/crates/trnm-node-boundary-v0/src/lib.rs \
            trillionnium/crates/trnm-poco-node-host/tests/authority_session_durable.rs \
            trillionnium/crates/trnm-poco-node-production-v0/src/authority_session_tests.rs \
            trillionnium/crates/trnm-poco-node-production-v0/src/lib.rs \
            trillionnium/crates/trnm-state-sync-v0/tests/staging_admission.rs \
            trillionnium/crates/trnm-state-sync-v0/tests/verification_seals.rs
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          test -z "$(git diff --cached --name-only -- trillionnium/Cargo.lock trillionnium/Cargo.toml .github/workflows)"
          git commit --no-gpg-sign -m "style(plan-v2): apply exact Rust 1.95 formatting repair"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
