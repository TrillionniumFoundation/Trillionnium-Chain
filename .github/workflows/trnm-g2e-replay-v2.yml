name: TRNM G2E replay v2 gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/trnm-g2e-replay-v2.yml"
      - "docs/development/packages/TRNM_G2E_*"
      - "docs/evidence/g2c/G2C_AGENT_HANDOFF_V2.json"
      - "docs/evidence/g2e/**"
      - "docs/protocol/poco-ai-native-v1/settlement/**"
      - "scripts/ci/check_g2e_*"
      - "scripts/ci/check_settlement_conservation_model_v1.sh"
      - "simulations/economics/**"

permissions:
  contents: read

concurrency:
  group: trnm-g2e-replay-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  g2e-replay:
    name: Exact A14 binding, multi-asset conservation and economic attack model
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      ((github.actor == 'ProfAlexQI' && github.triggering_actor == 'ProfAlexQI') ||
       (github.actor == 'Tomasrgbsf' && github.triggering_actor == 'Tomasrgbsf') ||
       (github.actor == 'github-actions[bot]' && github.triggering_actor == 'github-actions[bot]' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.author_association == 'MEMBER'))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trillionnium-chain
          persist-credentials: false
          fetch-depth: 0
      - name: Verify G2E replay
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_g2e_replay_v2.sh
      - name: Verify canonical truth boundaries
        working-directory: trillionnium-chain
        run: |
          bash ./scripts/ci/check_canonical_development_plan.sh
          bash ./scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          bash ./scripts/project-preflight.sh --audit
