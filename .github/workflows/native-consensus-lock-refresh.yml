name: native-consensus-lock-refresh

on:
  push:
    branches:
      - chore/chain-native-consensus-only
    paths:
      - 'trillionnium/Cargo.toml'
      - 'trillionnium/crates/**/Cargo.toml'
      - 'trillionnium/Cargo.lock'
      - 'scripts/ci/check_self_consensus_only.sh'
      - '.github/workflows/native-consensus-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0

      - name: Regenerate workspace lock
        run: |
          set -euo pipefail
          cd trillionnium
          cargo generate-lockfile

      - name: Enforce native consensus policy
        run: |
          set -euo pipefail
          bash scripts/ci/check_self_consensus_only.sh

      - name: Validate workspace
        run: |
          set -euo pipefail
          cd trillionnium
          cargo test --workspace --locked
          cargo build -p trnm-node --features self-consensus --bins --locked

      - name: Commit regenerated lock
        run: |
          set -euo pipefail
          git add trillionnium/Cargo.lock
          if git diff --cached --quiet; then
            echo 'lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(chain): regenerate native consensus lockfile'
          git push origin HEAD:chore/chain-native-consensus-only
