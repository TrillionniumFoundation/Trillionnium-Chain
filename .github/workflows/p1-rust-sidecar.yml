name: p1-rust-sidecar

on:
  workflow_dispatch:
  # Intentionally do not run on pull_request: this job executes repository code on
  # a self-hosted runner with local chain access, so only trusted main/workflow_dispatch
  # contexts may invoke it.
  push:
    branches: [main]
    paths:
      - 'scripts/v2/run_p1_integration_gate.sh'
      - 'scripts/v2/run_p1_integration_gate_*_invocation_test.sh'
      - 'scripts/v2/x2_settlement_contract_gate.sh'
      - 'scripts/v2/i2_token_lifecycle_gate.sh'
      - 'scripts/v2/product_layer_smoke.sh'
      - 'examples/sdk-js/**'
      - 'trillionnium/crates/trnm-rpc/src/**'
      - 'trillionnium/crates/trnm-rpc/tests/**'
      - '.github/workflows/p1-rust-sidecar.yml'

permissions:
  contents: read

concurrency:
  group: p1-rust-sidecar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1-with-rust-sidecar:
    # Requires a self-hosted runner with local Trillionnium dev chain environment.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_NUMERIC: C
      LC_COLLATE: C
      LC_TIME: C
      LC_CTYPE: C
      LC_MESSAGES: C
      LC_MONETARY: C
      LC_MEASUREMENT: C
      LC_NAME: C
      LC_PAPER: C
      LC_ADDRESS: C
      LC_TELEPHONE: C
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "UTF-8"
      PYTHONUTF8: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      CI: "true"
      UMASK: "022"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Ensure jq
        run: |
          command -v jq >/dev/null 2>&1 || brew install jq
          jq --version

      - name: Preflight - chain RPC must be reachable
        run: |
          curl -sf http://127.0.0.1:26657/status >/dev/null

      - name: Run P1 integration gate (blocking)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          RUN_DIR="run/p1-integration-gate/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ./scripts/v2/run_p1_integration_gate.sh

      - name: Summarize integration gate result
        if: always()
        id: p1-summary
        run: |
          set -euo pipefail
          P1_SUMMARY_PATH="run/p1-integration-gate/summary-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}.json"
          mkdir -p "$(dirname "$P1_SUMMARY_PATH")"
          latest_dir=$(ls -1dt run/p1-integration-gate/* 2>/dev/null | head -n 1 || true)
          if [[ -z "$latest_dir" ]]; then
            echo "::warning::No run/p1-integration-gate artifacts found"
            cat >"$P1_SUMMARY_PATH" <<EOF
          {
            "status": "warn-missing-artifacts",
            "run_dir": "",
            "github_run_id": "${GITHUB_RUN_ID:-local}",
            "github_run_attempt": "${GITHUB_RUN_ATTEMPT:-1}"
          }
          EOF
            echo "p1_summary_json=$P1_SUMMARY_PATH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using run dir: $latest_dir"
          ls -1 "$latest_dir" || true
          cat >"$P1_SUMMARY_PATH" <<EOF
          {
            "status": "ok",
            "run_dir": "$latest_dir",
            "github_run_id": "${GITHUB_RUN_ID:-local}",
            "github_run_attempt": "${GITHUB_RUN_ATTEMPT:-1}"
          }
          EOF
          echo "p1_summary_json=$P1_SUMMARY_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload P1 integration artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-rust-sidecar-artifacts-${{ github.run_id }}
          path: |
            run/p1-integration-gate/**
          if-no-files-found: warn

      - name: Upload P1 summary artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-rust-sidecar-summary-${{ github.run_id }}
          path: |
            ${{ steps.p1-summary.outputs.p1_summary_json }}
          if-no-files-found: error
