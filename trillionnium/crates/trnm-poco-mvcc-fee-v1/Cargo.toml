[package]
name = "trnm-poco-mvcc-fee-v1"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Trillionnium Contributors"]
publish = false

[package.metadata.trnm]
lane = "poco-ai-native-v1-mvcc-fee-candidate"
protocol = "poco-ai-native-v1"
classification = "candidate-non-normative"
object_mvcc = true
canonical_serial_oracle = true
deterministic_conflict_retry = true
explicit_versioned_read_write_sets = true
complete_success_failure_receipts = true
multi_resource_usage = true
checked_fee_arithmetic = true
per_transaction_fee_deltas = true
block_end_sorted_fee_reduction = true
global_fee_collector_per_transaction_write = false
immutable_read_only_existing_file_preflight = true
atomic_block_state_receipts_fees = true
deterministic_journal_replay_audit = true
real_parallel_worker_pool = true
parallel_worker_pool_scope = "bounded-in-process-candidate"
worker_count_invariant_roots = true
whole_store_rollback_authority = false
authenticated_global_state_tree = false
agent_transaction_wire_complete = false
order_proof_authority_complete = false
node_integration = false
g2_global_complete = false
protocol_implementation_complete = false
normative_freeze = false
production_candidate = false
activation = false

[features]
default = []

[dependencies]
borsh = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
