name: PoN exact CPU conservation source publication
on:
  push:
    branches: [tooling/pon-cpu-conservation-publication-20261011]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5c25ed9eadbb10e8193d062ee92c14ef8a9db1b5
          fetch-depth: 0
      - name: Reconstruct checked literal objects and create one new source branch
        env:
          PATCH_ZLIB_BASE64: 
          COMMIT_ZLIB_BASE64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data).decode().strip()
          assert git('rev-parse', 'HEAD') == '5c25ed9eadbb10e8193d062ee92c14ef8a9db1b5'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'literal-publication'
          out.mkdir()
          # Correct the single known transcription character before decoding;
          # the full original SHA256 still independently gates all resulting bytes.
          encoded = os.environ['PATCH_ZLIB_BASE64'].replace('DzFLbmNwgXMA', 'DzFLbmwgXMA')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          raw = zlib.decompress(base64.b64decode(os.environ['COMMIT_ZLIB_BASE64'], validate=True))
          assert len(patch) == 33257 and hashlib.sha256(patch).hexdigest() == 'e38d0326b609081ff186e5307cc5be8e51264b022630c0313ecad0bbb75d120b'
          assert len(raw) == 1368 and hashlib.sha256(raw).hexdigest() == 'b038c33db3c1623d3029a6171709e7d1c3fdbfe6dfb3db705e02f8a143e5596e'
          path = out / 'source.patch'
          path.write_bytes(patch)
          git('apply', '--check', '--index', str(path))
          git('apply', '--index', str(path))
          tree = git('write-tree')
          assert tree == '977b5d57f1859771f9f5de3abd7c0dd31dfe6e22'
          head = git('hash-object', '-t', 'commit', '-w', '--stdin', data=raw)
          assert head == '634fd8efb8ecc39a386383baef882d6c48d08d80'
          ref = 'refs/heads/work/pon-cpu-conservation-runtime-20261011'
          assert not git('ls-remote', '--heads', 'origin', ref)
          git('push', 'origin', head + ':' + ref)
          assert git('ls-remote', '--heads', 'origin', ref).split()[0] == head
          (out / 'source.txt').write_text(head + '\n' + tree + '\n')
          print('Published exact source:', head, tree)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: literal-source-publication
          path: ${{ runner.temp }}/literal-publication
          if-no-files-found: error
