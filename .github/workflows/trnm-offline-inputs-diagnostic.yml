name: Chain pinned offline inputs diagnostic

on:
  push:
    branches: [fix/chain-offline-inputs-20260922]
    paths: [.github/workflows/trnm-offline-inputs-diagnostic.yml]

permissions:
  contents: read

jobs:
  prepare-offline-inputs:
    if: github.repository == 'TrillionniumFoundation/Trillionnium-Chain'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: a60a38baa5d4cad89a208b51e871093a2dcb6171
    steps:
      - name: Check out immutable candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a60a38baa5d4cad89a208b51e871093a2dcb6171
          persist-credentials: false
      - name: Prepare public compiler and lockfile-pinned crate sources only
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_HOME="$RUNNER_TEMP/trnm-rustup"
          export CARGO_HOME="$RUNNER_TEMP/trnm-cargo"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          kit="$RUNNER_TEMP/trnm-offline-inputs"
          mkdir -p "$kit"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup run 1.95.0 cargo vendor --locked --versioned-dirs \
            --manifest-path trillionnium/Cargo.toml "$kit/vendor" > "$kit/vendor-config.txt"
          compiler="$(rustup which --toolchain 1.95.0 rustc)"
          toolchain="$(dirname "$(dirname "$compiler")")"
          tar -C "$toolchain" -czf "$kit/rust-toolchain-1.95.0.tar.gz" .
          tar -C "$kit" -czf "$kit/vendor-source.tar.gz" vendor
          rm -rf "$kit/vendor"
          rustup run 1.95.0 rustc --version --verbose > "$kit/toolchain-version.txt"
          git rev-parse HEAD 'HEAD^{tree}' > "$kit/source-identity.txt"
          sha256sum trillionnium/Cargo.lock > "$kit/lockfile.sha256"
          git diff --exit-code HEAD -- .
          printf '%s\n' 'scope=public-offline-build-inputs-only; no-test-or-acceptance-credit' > "$kit/SCOPE"
          (cd "$kit" && sha256sum *.tar.gz *.txt lockfile.sha256 SCOPE > SHA256SUMS)
      - name: Retain diagnostic public build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-offline-inputs-a60a38b
          path: ${{ runner.temp }}/trnm-offline-inputs/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
