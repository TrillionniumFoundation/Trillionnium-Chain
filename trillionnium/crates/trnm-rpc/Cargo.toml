[package]
name = "trnm-rpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
trnm-oracle = { version = "0.1.0", path = "../trnm-oracle" }
trnm-types = { version = "0.1.0", path = "../trnm-types" }
trnm-state = { version = "0.1.0", path = "../trnm-state" }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2"
