name: PoN current source inventory delivery
on:
  push:
    branches: [fix/pon-architecture-boundaries-20261008]
    paths: [.github/workflows/pon-current-inventory-delivery.yml]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'TrillionniumFoundation/Trillionnium-Chain' && github.ref == 'refs/heads/fix/pon-architecture-boundaries-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Regenerate only current native inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = a975a688d8ecbf23405198aade77349354375322
          bash scripts/project-preflight.sh --audit
          python3 scripts/refresh_distributed_source_inventory.py
          python3 scripts/refresh_distributed_source_inventory.py --check
          rm .github/workflows/pon-current-inventory-delivery.yml
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert paths == {'.github/workflows/pon-current-inventory-delivery.yml','trillionnium/crates/trnm-pon-node/examples/support/distributed_source_inventory.rs'}, paths
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trillionnium/crates/trnm-pon-node/examples/support/distributed_source_inventory.rs .github/workflows/pon-current-inventory-delivery.yml
          git commit -s -m 'fix(pon): include current growth-reservation source in distributed native inventory'
          git push origin HEAD:refs/heads/fix/pon-architecture-boundaries-20261008
      - name: Execute unchanged repository-truth gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inventory-observations"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/inventory-observations/source.txt"
          bash scripts/ci/ci_job.sh repository-truth 2>&1 | tee "$RUNNER_TEMP/inventory-observations/repository-truth.log"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pon-inventory-repository-truth
          path: ${{ runner.temp }}/inventory-observations/
          if-no-files-found: warn
          retention-days: 14
