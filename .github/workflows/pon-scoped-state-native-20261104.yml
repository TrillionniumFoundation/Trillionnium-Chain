name: PoN scoped state and SQL commit native checks
on:
  push:
    branches: [fix/chain-retained-failure-readback-20261104]
    paths: [.github/workflows/pon-scoped-state-native-20261104.yml]
permissions:
  contents: read
jobs:
  scoped-native-controls:
    name: Original scoped state and SQL commit controls
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_KIND: head
      EXPECTED_HEAD: 6f458c4fbf07a0a44d7d7a6f451aa960c1b0a029
      EXPECTED_TESTED: 6f458c4fbf07a0a44d7d7a6f451aa960c1b0a029
      SELECTOR: ingress::history_import::tests::real_sigkill_history_cuts_preserve_debt_fence_and_committed_blocks
    steps:
      - name: Checkout the exact repair source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 6f458c4fbf07a0a44d7d7a6f451aa960c1b0a029
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source and preserve original preflight
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/scoped-state-native"
          mkdir "$out"
          echo "PQ_OUT=$out" >> "$GITHUB_ENV"
          echo "TRNM_CI_RECEIPT_DIR=$out" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/scoped-state-target" >> "$GITHUB_ENV"
          cat > "$out/run-command.sh" <<'SH'
          set -euo pipefail
          label="$1"
          shift
          command_status=0
          python3 scripts/ci/record_pq_native_command.py --kind head --candidate "$EXPECTED_HEAD" --tested "$EXPECTED_TESTED" --label "$label" --output "$PQ_OUT" -- "$@" || command_status=$?
          if test -f "$PQ_OUT/$label.log"; then
            cat "$PQ_OUT/$label.log"
          fi
          exit "$command_status"
          SH
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_HEAD" --output "$out/source-before.json"
          bash scripts/project-preflight.sh --audit 2>&1 | tee "$out/preflight.log"
          python3 - "$out/scope.json" <<'PY'
          import json, os, pathlib, sys
          value = {
              "schema": "pon-scoped-state-commit-native-scope-v1",
              "workflow_commit": os.environ["GITHUB_SHA"],
              "tested_commit": os.environ["EXPECTED_TESTED"],
              "selector": os.environ["SELECTOR"],
              "profile": "original cargo test profile; lib; all-features",
              "reason": "same-call scoped account parsing, identity-lift arithmetic and four authenticated ledger/reorg Transaction::commit API observations",
              "native_export_selectors": [
                  "store::native_authenticated_tests::native_authenticated_signed_growth_branches_reopen_and_compact_queries",
                  "store::authenticated_migration::tests::authenticated_migration_preserves_signed_branches_and_irreversible_local_facts",
              ],
              "additional_exact_native_selectors": ["account_archive_prototype::native_store::tests::native_lift_arithmetic_cache_binds_every_input_and_keeps_fixed_capacity","store::native_authenticated::current_accounts_tests::cold_complete_reuses_actual_account_parse_and_keeps_all_graph_checkpoints","store::native_authenticated::current_accounts_tests::current_projection_is_bound_to_exact_state_and_never_hides_account_changes","store::native_authenticated::current_accounts_tests::current_projection_preserves_complete_root_and_late_error_priority","store::native_authenticated::current_accounts_tests::current_projection_rereads_corrupt_sql_and_preserves_every_cancellation","store::native_authenticated::history_arithmetic::tests::nested_observations_do_not_hold_a_guard_across_cancellation_or_change_errors","store::native_authenticated::history_arithmetic::tests::old_history_trigger_rolls_back_new_block_and_cached_codec_cannot_create_it","store::native_authenticated::post_write_readback::tests::cross_record_reuse_keeps_current_nonce_existence_grammar_and_working_state_checks","store::native_authenticated::post_write_readback::tests::actual_stored_graph_damage_is_reread_after_a_receipt","store::native_authenticated::post_write_readback::tests::frontier::partial_cancellation_and_no_row_writes_keep_original_boundaries_and_sticky_fences","store::reorg_readback_tests::prehit_write_cannot_restamp_and_callback_errors_keep_original_precedence","store::reorg_readback_tests::non_genesis_common_ancestor_keeps_every_cut_and_publication_on_cold_reopen","store::admission_parent_tests::admission_parent_foreign_sql_change_forces_original_fresh_state_validation","store::admission_parent_tests::admission_parent_keeps_second_boundary_cancellation_and_error_identity","store::reorg_cancellation::tests::cancellation_terminates_only_staging_and_preserves_full_active_state","store::reorg_cancellation::tests::late_staging_cancellation_and_postcommit_control_cannot_rewrite_active_facts","store::reorg_cancellation::tests::cleanup_authorizer_blocks_trigger_writes_and_restores_after_error","store::reorg_cancellation::tests::cleanup_panic_rolls_back_and_restores_sql_guards_without_refunding_unknown_cpu","store::reorg_cancellation::tests::three_actual_sigkill_cuts_keep_active_state_replay_and_unknown_cpu_fence"],
              "independent_storage_oracle_registered_methods": 29,
              "cuts": ["epoch", "w1", "m06", "admitted", "activated"],
              "original_child_import_deadline_seconds": 20,
              "original_parent_wait_seconds": 30,
              "full_node_suite_executed": False,
              "standalone_result_adds_unique_tests": False,
              "performance_acceptance_granted": False,
              "production_activation": False,
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(value, sort_keys=True, indent=2) + "\n")
          print(json.dumps(value, sort_keys=True))
          PY
      - name: Retain original source and claim checks
        shell: bash
        run: |
          set -euo pipefail
          for test_file in test_ci_source_integrity.py test_record_pq_native_command.py test_pq_research_integration.py test_pq_chain_claim_guard.py test_pq_authority_surface_scan.py; do
            bash "$PQ_OUT/run-command.sh" "${test_file%.py}" python3 -m unittest discover -s scripts/ci -p "$test_file" -v
          done
          bash "$PQ_OUT/run-command.sh" pq-source python3 scripts/ci/check_pq_research_integration.py
          bash "$PQ_OUT/run-command.sh" pq-hold python3 scripts/ci/pq_chain_claim_guard.py
          bash "$PQ_OUT/run-command.sh" repository python3 scripts/ci/check_repository.py
          bash "$PQ_OUT/run-command.sh" inventory python3 scripts/refresh_distributed_source_inventory.py --check
      - name: Install the original compiler
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Prepare the original independently pinned provider
        shell: bash
        run: bash scripts/ci/prepare_pq_provider.sh
      - name: Bind compiler graph formatting and original test-profile ELF
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bash "$PQ_OUT/run-command.sh" compiler rustc +1.95.0 -Vv
          bash "$PQ_OUT/run-command.sh" locked-graph cargo +1.95.0 metadata --locked --manifest-path trillionnium/Cargo.toml --format-version 1
          bash "$PQ_OUT/run-command.sh" format cargo +1.95.0 fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          bash "$PQ_OUT/run-command.sh" build cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib --all-features --no-run --message-format=json
      - name: Execute the original scoped state and transaction controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PQ_OUT/check-reorg-sigkill.py" <<'PY'
          #!/usr/bin/env python3
          """Validate the original one-parent/three-SIGKILL-child pretty transcript only."""
          import argparse
          import json
          from pathlib import Path
          import sys
          
          sys.path.insert(0, str(Path("scripts/ci").resolve()))
          from check_required_native_test import RUNNING, TEST, SUMMARY, validate as validate_one
          
          PARENT = "store::reorg_cancellation::tests::three_actual_sigkill_cuts_keep_active_state_replay_and_unknown_cpu_fence"
          CHILD = "store::reorg_cancellation::tests::reorg_cancellation_kill_child"
          CUTS = ("cancel-before-transaction", "cancel-lifecycle-written", "cancel-committed")
          SCHEMA = "native-reorg-termination-sigkill-v2"
          
          
          def need(condition, label):
              if not condition:
                  raise ValueError("required-reorg-sigkill-parent: " + label)
          
          
          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  need(key not in value, "duplicate JSON key")
                  value[key] = item
              return value
          
          
          def validate(lines, expected_test):
              need(expected_test == PARENT, "wrong parent selector")
              lines = [line.rstrip("\r\n") for line in lines]
              markers, observations = [], []
              for index, line in enumerate(lines):
                  if line.startswith("running "):
                      match = RUNNING.fullmatch(line)
                      need(match is not None and match[1] == "1", "not a one-test invocation")
                      markers.append(("running", index))
                  elif line.startswith("test result:"):
                      need(SUMMARY.fullmatch(line) is not None, "non-passing or non-single terminal summary")
                      markers.append(("finished", index))
                  elif line.startswith("test "):
                      match = TEST.fullmatch(line)
                      need(match is not None, "malformed test identity")
                      markers.append((match[1], index))
                  if SCHEMA in line:
                      value = json.loads(line, object_pairs_hook=unique_object)
                      need(isinstance(value, dict) and value.get("schema") == SCHEMA, "cut observation schema")
                      observations.append((index, value))
              expected = ["running", PARENT] + ["running", CHILD] * 3 + ["finished"]
              need([kind for kind, _ in markers] == expected, "parent/child invocation order or terminal count")
              need(len(observations) == 3 and [value.get("cut") for _, value in observations] == list(CUTS),
                   "missing, duplicate or reordered cuts")
              need(all(markers[-2][1] < index < markers[-1][1] for index, _ in observations),
                   "cut observations outside original parent show-output block")
              cut_rows = []
              for (_, value), cut in zip(observations, CUTS):
                  need(type(value.get("signal")) is int and value["signal"] == 9, "cut was not SIGKILL 9")
                  for key in ("pre_reopen_active_state_unchanged", "native_replay_and_audit_bytes_unchanged",
                              "cpu_epoch_retained", "unknown_debt_refuses_public_restart"):
                      need(value.get(key) is True, "missing original preservation fact: " + key)
                  need(value.get("new_cpu_account_available") is False, "new CPU account was available")
                  expected_done = 2 if cut == "cancel-committed" else 0
                  for key in ("pre_reopen_done", "pre_reopen_lifecycle"):
                      need(type(value.get(key)) is int and value[key] == expected_done, "original lifecycle: " + key)
                  need(value.get("original_cancelled_lifecycle_retained") is (cut == "cancel-committed"),
                       "original cancelled lifecycle changed")
                  for key in ("cold_bind_error", "metered_plain_error", "metered_fact_error"):
                      need(value.get(key) == "OWNER_PUBLIC_SERVICE_UNCLEAN_EPOCH", "original debt fence: " + key)
                  flow = value.get("fresh_unbound_domain_flow")
                  need(isinstance(flow, dict) and flow.get("schema") == "public-v3-local-actual-cpu-flow-v1",
                       "missing unbound CPU flow")
                  for key in ("live_owners", "paid_cpu_debit_ns", "booked_reservation_ns"):
                      need(type(flow.get(key)) is int and flow[key] == 0, "unbound CPU flow changed: " + key)
                  cut_rows.append({key: value[key] for key in (
                      "cut", "signal", "pre_reopen_done", "pre_reopen_lifecycle",
                      "pre_reopen_active_state_unchanged", "native_replay_and_audit_bytes_unchanged",
                      "cpu_epoch_retained", "new_cpu_account_available", "unknown_debt_refuses_public_restart",
                      "original_cancelled_lifecycle_retained")})
              # Remove only the six already verified child harness lines. The unchanged
              # checker still validates the one original parent identity and sole terminal.
              child_lines = {index for _, index in markers[2:8]}
              parent = validate_one((line for index, line in enumerate(lines) if index not in child_lines), PARENT)
              return {**parent, "schema": "pon-original-reorg-sigkill-parent-readback-v1",
                      "nested_sigkill_child_invocations": 3, "cuts": cut_rows,
                      "child_invocations_add_unique_tests": False, "performance_acceptance_granted": False,
                      "scope": "One original native parent, three original killed subprocess fixtures; source identity, command exit status and all native assertions remain separate required gates; transcript readback adds no unique native test."}
          
          
          def selfcheck():
              from copy import deepcopy
              def fixture():
                  rows = []
                  for cut in CUTS:
                      done = 2 if cut == "cancel-committed" else 0
                      rows.append({"schema": SCHEMA, "cut": cut, "signal": 9,
                                   "pre_reopen_active_state_unchanged": True,
                                   "native_replay_and_audit_bytes_unchanged": True,
                                   "cpu_epoch_retained": True, "new_cpu_account_available": False,
                                   "unknown_debt_refuses_public_restart": True,
                                   "pre_reopen_done": done, "pre_reopen_lifecycle": done,
                                   "original_cancelled_lifecycle_retained": cut == "cancel-committed",
                                   "cold_bind_error": "OWNER_PUBLIC_SERVICE_UNCLEAN_EPOCH",
                                   "metered_plain_error": "OWNER_PUBLIC_SERVICE_UNCLEAN_EPOCH",
                                   "metered_fact_error": "OWNER_PUBLIC_SERVICE_UNCLEAN_EPOCH",
                                   "fresh_unbound_domain_flow": {"schema": "public-v3-local-actual-cpu-flow-v1",
                                                                "live_owners": 0, "paid_cpu_debit_ns": 0,
                                                                "booked_reservation_ns": 0}})
                  return (["running 1 test", "test " + PARENT + " ..."]
                          + ["running 1 test", "test " + CHILD + " ..."] * 2
                          + ["running 1 test", "test " + CHILD + " ... ok"]
                          + ["successes:", "---- " + PARENT + " stdout ----"]
                          + [json.dumps(row, sort_keys=True) for row in rows]
                          + ["successes:", "    " + PARENT,
                             "test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 999 filtered out; finished in 0.23s"])
              good = fixture()
              need(validate(good, PARENT)["executed_tests"] == 1, "positive control")
              bad_cases = {
                  "missing_child": good[:2] + good[4:],
                  "extra_child": good[:8] + good[2:4] + good[8:],
                  "wrong_child": [line.replace(CHILD, CHILD + "_wrong") for line in good],
                  "duplicate_parent": good[:2] + good[:2] + good[2:],
                  "missing_terminal": good[:-1],
                  "extra_terminal": good + [good[-1]],
                  "failed_terminal": good[:-1] + [good[-1].replace("ok. 1 passed; 0 failed", "FAILED. 0 passed; 1 failed")],
                  "ignored_terminal": good[:-1] + [good[-1].replace("0 ignored", "1 ignored")],
                  "missing_cut": good[:10] + good[11:],
                  "duplicate_cut": good[:11] + [good[10]] + good[12:],
                  "reordered_cuts": good[:10] + [good[11], good[10]] + good[12:],
                  "wrong_signal": [line.replace('"signal": 9', '"signal": 15') for line in good],
                  "false_preservation": [line.replace('"cpu_epoch_retained": true', '"cpu_epoch_retained": false') for line in good],
                  "wrong_debt_error": [line.replace("OWNER_PUBLIC_SERVICE_UNCLEAN_EPOCH", "WRONG_ERROR") for line in good],
                  "bool_lifecycle": [line.replace('"pre_reopen_done": 0', '"pre_reopen_done": false') for line in good],
                  "new_paid_debit": [line.replace('"paid_cpu_debit_ns": 0', '"paid_cpu_debit_ns": 1') for line in good],
                  "duplicate_json_key": [line.replace('"signal": 9', '"signal": 9, "signal": 9') for line in good],
              }
              for name, lines in bad_cases.items():
                  try:
                      validate(lines, PARENT)
                  except (ValueError, TypeError):
                      continue
                  raise ValueError("required-reorg-sigkill-parent: negative control accepted: " + name)
              try:
                  validate(deepcopy(good), CHILD)
              except ValueError:
                  pass
              else:
                  raise ValueError("required-reorg-sigkill-parent: wrong selector accepted")
              return {"schema": "pon-original-reorg-sigkill-reader-controls-v1", "positive_controls": 1,
                      "negative_controls": len(bad_cases) + 1, "native_tests_executed": 0,
                      "unique_native_tests_added": 0, "performance_acceptance_granted": False}
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("log", nargs="?", type=Path)
              parser.add_argument("--test")
              parser.add_argument("--self-test", action="store_true")
              args = parser.parse_args()
              try:
                  if args.self_test:
                      need(args.log is None and args.test is None, "self-test arguments")
                      result = selfcheck()
                  else:
                      need(args.log is not None, "missing log")
                      with args.log.open(encoding="utf-8") as stream:
                          result = validate(stream, args.test)
              except (OSError, UnicodeError, ValueError, TypeError) as error:
                  print(str(error), file=sys.stderr)
                  return 1
              print(json.dumps(result, sort_keys=True))
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          failed=0
          if ! python3 "$PQ_OUT/check-reorg-sigkill.py" --self-test > "$PQ_OUT/reorg-sigkill-checker-controls.json"; then
            failed=1
          fi
          for selector in \
            account_archive_prototype::native_store::tests::native_lift_arithmetic_cache_binds_every_input_and_keeps_fixed_capacity \
            store::native_authenticated::current_accounts_tests::cold_complete_reuses_actual_account_parse_and_keeps_all_graph_checkpoints \
            store::native_authenticated::current_accounts_tests::current_projection_is_bound_to_exact_state_and_never_hides_account_changes \
            store::native_authenticated::current_accounts_tests::current_projection_preserves_complete_root_and_late_error_priority \
            store::native_authenticated::current_accounts_tests::current_projection_rereads_corrupt_sql_and_preserves_every_cancellation \
            store::native_authenticated::history_arithmetic::tests::nested_observations_do_not_hold_a_guard_across_cancellation_or_change_errors \
            store::native_authenticated::history_arithmetic::tests::old_history_trigger_rolls_back_new_block_and_cached_codec_cannot_create_it \
            store::native_authenticated::post_write_readback::tests::cross_record_reuse_keeps_current_nonce_existence_grammar_and_working_state_checks \
            store::native_authenticated::post_write_readback::tests::actual_stored_graph_damage_is_reread_after_a_receipt \
            store::native_authenticated::post_write_readback::tests::frontier::partial_cancellation_and_no_row_writes_keep_original_boundaries_and_sticky_fences \
            store::reorg_readback_tests::prehit_write_cannot_restamp_and_callback_errors_keep_original_precedence \
            store::reorg_readback_tests::non_genesis_common_ancestor_keeps_every_cut_and_publication_on_cold_reopen \
            store::admission_parent_tests::admission_parent_foreign_sql_change_forces_original_fresh_state_validation \
            store::admission_parent_tests::admission_parent_keeps_second_boundary_cancellation_and_error_identity \
            store::reorg_cancellation::tests::cancellation_terminates_only_staging_and_preserves_full_active_state \
            store::reorg_cancellation::tests::late_staging_cancellation_and_postcommit_control_cannot_rewrite_active_facts \
            store::reorg_cancellation::tests::cleanup_authorizer_blocks_trigger_writes_and_restores_after_error \
            store::reorg_cancellation::tests::cleanup_panic_rolls_back_and_restores_sql_guards_without_refunding_unknown_cpu \
            store::reorg_cancellation::tests::three_actual_sigkill_cuts_keep_active_state_replay_and_unknown_cpu_fence; do
            label="scope-${selector##*::}"
            if ! bash "$PQ_OUT/run-command.sh" "$label" cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib --all-features "$selector" -- --exact --show-output --test-threads=1; then
              failed=1
            elif test "$selector" = store::reorg_cancellation::tests::three_actual_sigkill_cuts_keep_active_state_replay_and_unknown_cpu_fence; then
              if ! python3 "$PQ_OUT/check-reorg-sigkill.py" "$PQ_OUT/$label.log" --test "$selector" > "$PQ_OUT/$label-execution.json"; then
                failed=1
              fi
            elif ! python3 scripts/ci/check_required_native_test.py "$PQ_OUT/$label.log" --test "$selector" > "$PQ_OUT/$label-execution.json"; then
              failed=1
            fi
          done
          test "$failed" = 0
      - name: Execute the unchanged complete parent selector once
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$PQ_OUT/run-command.sh" sigkill-parent cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib --all-features "$SELECTOR" -- --exact --show-output --test-threads=1
          python3 scripts/ci/check_required_native_test.py "$PQ_OUT/sigkill-parent.log" --test "$SELECTOR" | tee "$PQ_OUT/sigkill-parent-execution.json"
      - name: Generate both original native storage exports
        id: exports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export TRNM_NATIVE_AUTHENTICATED_STATE_EXPORT_DIR="$PQ_OUT/native-authenticated-state"
          export TRNM_AUTHENTICATED_MIGRATION_EXPORT="$PQ_OUT/authenticated-migration"
          test ! -e "$TRNM_NATIVE_AUTHENTICATED_STATE_EXPORT_DIR"
          test ! -L "$TRNM_NATIVE_AUTHENTICATED_STATE_EXPORT_DIR"
          test ! -e "$TRNM_AUTHENTICATED_MIGRATION_EXPORT"
          test ! -L "$TRNM_AUTHENTICATED_MIGRATION_EXPORT"
          failed=0
          for selector in \
            store::native_authenticated_tests::native_authenticated_signed_growth_branches_reopen_and_compact_queries \
            store::authenticated_migration::tests::authenticated_migration_preserves_signed_branches_and_irreversible_local_facts; do
            label="export-${selector##*::}"
            if ! bash "$PQ_OUT/run-command.sh" "$label" cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib --all-features "$selector" -- --exact --show-output --test-threads=1; then
              failed=1
            elif ! python3 scripts/ci/check_required_native_test.py "$PQ_OUT/$label.log" --test "$selector" > "$PQ_OUT/$label-execution.json"; then
              failed=1
            fi
          done
          test "$failed" = 0
      - name: Execute the complete original independent storage oracle controls
        id: oracle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/storage-oracle-python"
          oracle_python="$RUNNER_TEMP/storage-oracle-python/bin/python"
          bash "$PQ_OUT/run-command.sh" oracle-environment "$oracle_python" -m pip install -r formal/pon-nakamoto-v1/requirements.txt
          bash "$PQ_OUT/run-command.sh" oracle-python "$oracle_python" -VV
          bash "$PQ_OUT/run-command.sh" oracle-dependencies "$oracle_python" -m pip freeze --all
          bash "$PQ_OUT/run-command.sh" independent-storage-controls "$oracle_python" formal/pon-nakamoto-v1/test_native_authenticated_storage_oracle.py -v
          python3 - "$PQ_OUT/independent-storage-controls.log" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          assert re.findall(r"^Ran ([0-9]+) tests? in ", text, re.M) == ["29"]
          assert re.findall(r"^OK$", text, re.M) == ["OK"]
          assert len(re.findall(r"^test_.* \.\.\. ok$", text, re.M)) == 29
          print("independent storage oracle: all 29 original/current registered controls executed")
          PY
      - name: Independently reconstruct both actual Rust storage exports
        if: ${{ !cancelled() && steps.exports.outcome == 'success' && steps.oracle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          oracle_python="$RUNNER_TEMP/storage-oracle-python/bin/python"
          failed=0
          if ! bash "$PQ_OUT/run-command.sh" independent-native-storage "$oracle_python" formal/pon-nakamoto-v1/native_authenticated_storage_oracle.py "$PQ_OUT/native-authenticated-state/native.json" "$PQ_OUT/native-authenticated-state/native.sqlite" --output "$PQ_OUT/native-authenticated-state/oracle.json"; then
            failed=1
          fi
          if ! bash "$PQ_OUT/run-command.sh" independent-native-migration "$oracle_python" formal/pon-nakamoto-v1/native_authenticated_storage_oracle.py "$PQ_OUT/authenticated-migration/native.json" "$PQ_OUT/authenticated-migration/native.sqlite" --migration-source "$PQ_OUT/authenticated-migration/source.sqlite" --output "$PQ_OUT/authenticated-migration/oracle.json"; then
            failed=1
          fi
          test "$failed" = 0
      - name: Keep original strict Node lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$PQ_OUT/run-command.sh" clippy cargo +1.95.0 clippy --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib --tests --all-features -- -D warnings
      - name: Recheck the complete measured source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_HEAD" --output "$PQ_OUT/source-after.json"
          bash scripts/project-preflight.sh --audit 2>&1 | tee "$PQ_OUT/preflight-after.log"
      - name: Retain full records including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scoped-state-ubuntu-24.04-6f458c4fbf07a0a44d7d7a6f451aa960c1b0a029-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoped-state-native/
          if-no-files-found: error
          retention-days: 14
