[package]
name = "w1-full-public-stark-research"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
p3-air = "=0.8.0"
p3-field = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-sha256-air = { version = "=0.8.0", features = ["parallel"] }
p3-matrix = "=0.8.0"
p3-uni-stark = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = { version = "=0.8.0", features = ["parallel"] }
p3-fri = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-security = "=0.8.0"
p3-maybe-rayon = { version = "=0.8.0", features = ["parallel"] }
sha2 = { version = "=0.10.9", features = ["compress"] }
sha3 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
bincode = "=1.3.3"
hex = "=0.4.3"

[profile.release]
codegen-units = 1
lto = "thin"

[workspace]
