name: trnm-closure-hosted-diagnostic

on:
  push:
    branches:
      - tmp/closure-hosted-diagnostic-20260831
    paths:
      - .github/workflows/trnm-closure-hosted-diagnostic.yml
      - scripts/ci/trnm-closure-current.patch.gz.b64

permissions:
  contents: read

concurrency:
  group: trnm-closure-hosted-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 32c1a49a42ff6f2bc1f523ae80a32db41bb543cf
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  diagnose-hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out diagnostic driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: driver
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned compiler
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.95.0

      - name: Decode apply and format current patch
        working-directory: source
        run: |
          set -euo pipefail
          base64 -d ../driver/scripts/ci/trnm-closure-current.patch.gz.b64 | gzip -d >"${RUNNER_TEMP}/closure.patch"
          sha256sum "${RUNNER_TEMP}/closure.patch" | tee "${RUNNER_TEMP}/closure.patch.sha256"
          git apply --check "${RUNNER_TEMP}/closure.patch"
          git apply "${RUNNER_TEMP}/closure.patch"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git diff --check
          git diff --exit-code -- trillionnium/Cargo.lock

      - name: Capture hosted compile and Clippy diagnostics
        working-directory: source
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/trnm-closure-hosted-diagnostic"
          mkdir -p "${out}"
          cp "${RUNNER_TEMP}/closure.patch.sha256" "${out}/input.patch.sha256"
          set +e
          cargo check --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-lab-validator --all-targets --locked \
            --message-format=json >"${out}/cargo-check.jsonl" 2>"${out}/cargo-check.stderr"
          check_rc=$?
          set -e
          printf '%s\n' "${check_rc}" >"${out}/cargo-check.exit-code"
          clippy_rc=125
          if [[ "${check_rc}" -eq 0 ]]; then
            set +e
            cargo clippy --manifest-path trillionnium/Cargo.toml \
              -p trnm-poco-lab-validator --all-targets --locked \
              --message-format=json -- -D warnings \
              >"${out}/cargo-clippy.jsonl" 2>"${out}/cargo-clippy.stderr"
            clippy_rc=$?
            set -e
          else
            : >"${out}/cargo-clippy.jsonl"
            printf '%s\n' 'skipped because cargo check failed' >"${out}/cargo-clippy.stderr"
          fi
          printf '%s\n' "${clippy_rc}" >"${out}/cargo-clippy.exit-code"
          python3 -B - "${out}" <<'PY'
          import collections, json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          def collect(path):
              lints, files, messages = collections.Counter(), collections.Counter(), []
              for raw in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  try: row = json.loads(raw)
                  except json.JSONDecodeError: continue
                  if row.get('reason') != 'compiler-message': continue
                  msg = row.get('message', {})
                  if msg.get('level') != 'error': continue
                  code = (msg.get('code') or {}).get('code') or 'uncoded'
                  spans = [s for s in msg.get('spans', []) if s.get('is_primary')]
                  file = spans[0].get('file_name', 'unknown') if spans else 'unknown'
                  line = spans[0].get('line_start') if spans else None
                  lints[code] += 1; files[file] += 1
                  messages.append({'code': code, 'message': msg.get('message'), 'file': file, 'line': line, 'rendered': msg.get('rendered')})
              return {'error_count': len(messages), 'lints': dict(sorted(lints.items())), 'files': dict(sorted(files.items())), 'messages': messages}
          summary = {
              'schema': 'trnm-closure-hosted-diagnostic-v1',
              'base_sha': '32c1a49a42ff6f2bc1f523ae80a32db41bb543cf',
              'cargo_check_exit_code': int((out/'cargo-check.exit-code').read_text()),
              'cargo_clippy_exit_code': int((out/'cargo-clippy.exit-code').read_text()),
              'cargo_check': collect(out/'cargo-check.jsonl'),
              'cargo_clippy': collect(out/'cargo-clippy.jsonl'),
          }
          (out/'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True), encoding='utf-8')
          PY
          git diff --binary --full-index "${BASE_SHA}" -- . >"${out}/formatted.patch"
          sha256sum "${out}/formatted.patch" >"${out}/formatted.patch.sha256"
          git diff --name-only "${BASE_SHA}" -- . >"${out}/changed-files.txt"

      - name: Upload hosted diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trnm-closure-hosted-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/trnm-closure-hosted-diagnostic/
          if-no-files-found: error
          retention-days: 3
