name: stage-state-migration-hardening-v0

on:
  push:
    branches:
      - work/integrate-repository-cores-v0-20260902
    paths:
      - .github/workflows/zz-stage-state-migration-hardening-v0.yml

permissions:
  contents: write

concurrency:
  group: stage-state-migration-hardening-v0-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: work/integrate-repository-cores-v0-20260902

jobs:
  harden_state_migration:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/integrate-repository-cores-v0-20260902' &&
      github.actor == 'Franksudoman' &&
      github.triggering_actor == github.actor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository-pinned Rust and locked dependency cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          channel="$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'])")"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked

      - name: Harden and qualify state-sync and migration cores
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/stage_state_migration_hardening_v0.py
          python3 scripts/ci/stage_state_migration_fixture_v0.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          for package in trnm-state-sync-v0 trnm-migration-v0
          do
            cargo test --manifest-path trillionnium/Cargo.toml \
              -p "$package" --all-targets --locked --offline
            cargo clippy --manifest-path trillionnium/Cargo.toml \
              -p "$package" --all-targets --locked --offline -- -D warnings
          done
          rm scripts/ci/stage_state_migration_hardening_v0.py
          rm scripts/ci/stage_state_migration_fixture_v0.py
          rm .github/workflows/zz-stage-state-migration-hardening-v0.yml

      - name: Commit validated state-sync and migration hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Franksudoman'
          git config user.email 'sunfocapital@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m '[state-migration-hardening] fix(core): remove cyclic commitments and substitution paths'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

# Qualification rerun after pinned Clippy normalization.
