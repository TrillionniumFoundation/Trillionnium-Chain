syntax = "proto3";

package chain.workload;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "chain/workload/params.proto";
import "chain/workload/task.proto";
import "chain/workload/worker.proto";

option go_package = "chain/x/workload/types";

// GenesisState defines the workload module's genesis state.
message GenesisState {
  
  // params defines all the parameters of the module.
           Params params     = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  repeated Task   taskList   = 2 [(gogoproto.nullable) = false] ;
           uint64 taskCount  = 3;
  repeated Worker workerList = 4 [(gogoproto.nullable) = false] ;
}

