name: PoN directed boundary materialization 20261008
on:
  push:
    branches: [fix/pon-architecture-boundaries-20261008]
    paths: [.github/workflows/pon-directed-boundaries-20261008.yml]
permissions:
  contents: write
jobs:
  source-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Exact preflight and checked patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1ce0f055a6c009e17299b6fbf7b7d453d6d6742d
          bash scripts/project-preflight.sh --audit
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,subprocess
          patch=gzip.decompress(base64.b64decode(''''''))
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          Path('.github/workflows/pon-boundary-source-readback-20261008.yml').unlink()
          Path('.github/workflows/pon-directed-boundaries-20261008.yml').unlink()
          PY
          rustfmt --edition 2021 trillionnium/crates/trnm-pon-node/src/store/growth_reservation_io.rs trillionnium/crates/trnm-pon-node/src/store/authenticated_migration.rs
          git diff --check
          git add trillionnium/crates/trnm-pon-node/src/store/authenticated_migration.rs trillionnium/crates/trnm-pon-node/src/store/growth_reservation_io.rs formal/pon-nakamoto-v1/model_window_history.py formal/pon-nakamoto-v1/test_model_window_history.py docs/development/TRNM_AI_NATIVE_BLOCKCHAIN_DEVELOPMENT_PLAN.md docs/protocol/pon-nakamoto-v1/details/MODEL_OPERATIONS_ACCEPTANCE_V1.md docs/protocol/pon-nakamoto-v1/details/NATIVE_AUTHENTICATED_STORAGE_V1.md .github/workflows/pon-boundary-source-readback-20261008.yml .github/workflows/pon-directed-boundaries-20261008.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -s -m 'fix(pon): bind growth reservation readback and version owner-held no-update decisions' -m 'Preserve current native owners and historical V1 domains. Bounded descriptor-relative reservation reads, durable parent publication and no recursive uncertain cleanup; explicit V2 distinguishes metric gain from adoption authority. No cap inflation, work-hardness, real model installation, independent WAN or activation claim. Remove temporary source workflows.'
          git push origin HEAD:refs/heads/fix/pon-architecture-boundaries-20261008
      - name: Execute delivered native reservation and actual migration regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pon-boundary-tests"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pon-boundary-tests/source.txt"
          cargo test --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib growth_reservation_io -- --nocapture 2>&1 | tee "$RUNNER_TEMP/pon-boundary-tests/reservation.log"
          cargo test --locked --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --lib authenticated_migration_preserves_signed_branches_and_irreversible_local_facts -- --nocapture 2>&1 | tee "$RUNNER_TEMP/pon-boundary-tests/migration.log"
      - name: Replay existing model-window and cost-reader tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pon-boundary-tests"
          python3 formal/pon-nakamoto-v1/test_model_window_history.py 2>&1 | tee "$RUNNER_TEMP/pon-boundary-tests/model-window.log"
          python3 scripts/ci/test_work_rejection_report.py 2>&1 | tee "$RUNNER_TEMP/pon-boundary-tests/rejection-reader.log"
          git status --porcelain > "$RUNNER_TEMP/pon-boundary-tests/status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pon-directed-boundary-tests
          path: ${{ runner.temp }}/pon-boundary-tests
          if-no-files-found: warn
          retention-days: 14
