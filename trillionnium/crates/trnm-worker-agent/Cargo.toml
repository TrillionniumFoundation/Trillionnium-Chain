[package]
name = "trnm-worker-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
shlex = "1"
shell-escape = "0.1"
trnm-types = { version = "0.1.0", path = "../trnm-types" }
wait-timeout = "0.2"
