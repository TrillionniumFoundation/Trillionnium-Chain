name: TRNM one-shot CodeQL log redaction

on:
  push:
    branches:
      - security/codeql-rust-log-redaction-v1-20260909

permissions:
  contents: write

concurrency:
  group: trnm-one-shot-codeql-log-redaction-v1
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_BASE_SHA: 7ab9ce97a5bbc5cb4c7edca7d9d39dc016638d3b
      PATCH_PATH: .trnm/one-shot/codeql-log-redaction.patch
      WORKFLOW_PATH: .github/workflows/trnm-one-shot-codeql-log-redaction.yml
    steps:
      - name: Check out bounded staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact one-shot input surface
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/security/codeql-rust-log-redaction-v1-20260909"
          git merge-base --is-ancestor "${EXPECTED_BASE_SHA}" HEAD
          actual="$(git diff --name-only "${EXPECTED_BASE_SHA}"..HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n%s\n' "${WORKFLOW_PATH}" "${PATCH_PATH}" | LC_ALL=C sort)"
          test "${actual}" = "${expected}"
          git diff --quiet
          git diff --cached --quiet
          git apply --check "${PATCH_PATH}"

      - name: Apply redaction and remove one-shot carriers
        shell: bash
        run: |
          set -euo pipefail
          git apply "${PATCH_PATH}"
          git rm "${PATCH_PATH}" "${WORKFLOW_PATH}"
          git diff --check
          ! grep -Fq 'read authenticated runtime object' trillionnium/crates/trnm-consensus-app/src/lib.rs
          ! grep -Fq 'G1_PROCESS_SUMMARY {:?}' trillionnium/crates/trnm-poco-node/src/bin/trnm-poco-g1-process-host.rs
          ! grep -Fq 'drop session after failed retry-state persist sid=' trillionnium/crates/trnm-rpc/src/reliability.rs
          ! grep -Fq 'drop session after failed retry-state persist sid=' trillionnium/crates/trnm-rpc/src/reliability/recovery.rs

      - name: Verify Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          cd trillionnium
          cargo +1.95.0 fmt --all -- --check

      - name: Publish bounded source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            trillionnium/crates/trnm-consensus-app/src/lib.rs \
            trillionnium/crates/trnm-node/src/live/node.rs \
            trillionnium/crates/trnm-poco-node/src/bin/trnm-poco-g1-process-host.rs \
            trillionnium/crates/trnm-rpc/src/reliability.rs \
            trillionnium/crates/trnm-rpc/src/reliability/recovery.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'security(m17): redact sensitive runtime diagnostics' \
            -m 'Remove object keys, session IDs, storage errors and complete debug summaries from process-visible diagnostics while retaining fail-closed behavior. The temporary patch carrier and workflow delete themselves in this commit.' \
            -m 'Primary-Module: M17' \
            -m 'Production-Authority: false'
          git push origin "HEAD:${GITHUB_REF_NAME}"
