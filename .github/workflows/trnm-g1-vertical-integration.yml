name: trnm-g1-vertical-integration

on:
  push:
    branches:
      - integration/g1-vertical-closure-v1-20260830
    paths:
      - .github/workflows/trnm-g1-vertical-integration.yml
      - scripts/ci/run_g1_lab_validator_shards_v1.py

permissions:
  contents: write

concurrency:
  group: trnm-g1-vertical-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-reviewed-candidate-snapshots:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/integration/g1-vertical-closure-v1-20260830'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/g1-vertical-closure-v1-20260830
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source and fetch immutable package heads
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f02a4ad44eb147476b1eb09710c4a143ada8fac0"
          base=0fd31a31d9cc29fd292fab97c3183127e3bdba21
          test "$(git merge-base HEAD "${base}")" = "${base}"
          git fetch --no-tags origin \
            +refs/heads/feature/chain-g1-r3-ordinary-proposal-authority-v1:refs/remotes/origin/g1-a03 \
            +refs/heads/feature/chain-a19-p1-exec-terminal-history-v2-20260830:refs/remotes/origin/g1-a19 \
            +refs/heads/feature/chain-g1-r4-safety-checkpoint-20260829:refs/remotes/origin/g1-a05 \
            +refs/heads/feature/chain-g1-r4-fault-matrix-v2-20260829:refs/remotes/origin/g1-a06 \
            +refs/heads/feature/chain-a21-p1-seal-native-commit-verifier-v1-20260830:refs/remotes/origin/g1-a21
          test "$(git rev-parse refs/remotes/origin/g1-a03)" = "1b9543b3b22cc959d0ea2b3123c349761adada32"
          test "$(git rev-parse refs/remotes/origin/g1-a19)" = "fb19f7346b415fb49ce7b6ed3c577ab5d5d3a7ea"
          test "$(git rev-parse refs/remotes/origin/g1-a05)" = "97f9dec406f1a3bd261ae093c60e44fcd9d4bad6"
          test "$(git rev-parse refs/remotes/origin/g1-a06)" = "e88cda9401eb6219fe1425bebb1ef6b54b4c429d"
          test "$(git rev-parse refs/remotes/origin/g1-a21)" = "b58665a783c0e1bcceb33455acde65ee6ada4034"
          git merge-base --is-ancestor 6e0189e351015ef3230f217ca7ff86149baedcf0 refs/remotes/origin/g1-a03
          git merge-base --is-ancestor f38df4ec81cb76f92c709d8cd45311e164fa5753 refs/remotes/origin/g1-a19
          git merge-base --is-ancestor 6e0189e351015ef3230f217ca7ff86149baedcf0 refs/remotes/origin/g1-a05
          git merge-base --is-ancestor 6e0189e351015ef3230f217ca7ff86149baedcf0 refs/remotes/origin/g1-a06
          git merge-base --is-ancestor 0aeb5a797b3726c6657b003b44f7ec0040d7d423 refs/remotes/origin/g1-a21
          git merge-base --is-ancestor 13ecabcbd9ad6f1320d3d5ff1083d1a0b08f47c0 refs/remotes/origin/g1-a21
          test "$(git rev-parse 13ecabcbd9ad6f1320d3d5ff1083d1a0b08f47c0^{tree})" = \
            "$(git rev-parse 1663abd8935be4e5819f5ff0c7ded250a3664097^{tree})"
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          path = Path("scripts/ci/run_g1_lab_validator_shards_v1.py")
          ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY

      - name: Compose G1 candidate packages without source substitution
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit refs/remotes/origin/g1-a03
          git merge --no-ff --no-edit refs/remotes/origin/g1-a19
          git merge --no-ff --no-edit refs/remotes/origin/g1-a05
          git merge --no-ff --no-edit refs/remotes/origin/g1-a06
          git merge --no-ff --no-edit refs/remotes/origin/g1-a21

      - name: Finalize the source-only integration tree
        run: |
          set -euo pipefail
          git rm .github/workflows/trnm-g1-vertical-integration.yml
          git rm -f --ignore-unmatch -- tmp-probe.txt
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          mkdir -p docs/development/packages
          cat > docs/development/packages/TRNM_G1_VERTICAL_INTEGRATION_V1.md <<'EOF'
          # TRNM G1 vertical integration candidate v1

          This branch composes exact immutable candidate snapshots without promoting any Gate or release flag.

          - A03 ordinary proposal authority: `1b9543b3b22cc959d0ea2b3123c349761adada32`
          - A19 durable terminal finalization history, including its A04 parent: `fb19f7346b415fb49ce7b6ed3c577ab5d5d3a7ea`
          - A05 signer/checkpoint safety: `97f9dec406f1a3bd261ae093c60e44fcd9d4bad6`
          - A06 process fault matrix: `e88cda9401eb6219fe1425bebb1ef6b54b4c429d`
          - A21 sealed native commit verifier, including its A20 parent: `b58665a783c0e1bcceb33455acde65ee6ada4034`
          - A20 verified publication parent: `0aeb5a797b3726c6657b003b44f7ec0040d7d423`
          - normalized A18 source tree: `f80db352e8e2fa50e72b41836fd2079fa0d51e22`
          - integration base: `0fd31a31d9cc29fd292fab97c3183127e3bdba21`

          The A21 lineage descends from A18 commit `13ecabcbd9ad6f1320d3d5ff1083d1a0b08f47c0`. The later A18 hygiene commit `1663abd8935be4e5819f5ff0c7ded250a3664097` has the same Git tree and is therefore bound by exact tree equality rather than a false ancestry claim.

          The full non-ignored `trnm-poco-lab-validator` library test inventory is discovered at run time and executed exactly once through a resource-aware bounded runner. Ordinary tests run in bounded parallel workers; process-, socket-, and filesystem-owning runtime modules run serially after the parallel phase. Child process lifetime, pipe capture, per-test execution, whole-run wall clock and captured output are all bounded. No test is ignored, retried around, or removed. The composition is a review and test candidate only. Independent acceptance, production HSM/anchor, physical power-loss, multi-host campaign, 100,000 arbitrary-block corpus, audit and wall-clock soak remain mandatory.
          EOF
          git add -A
          git diff --cached --check
          git commit -m "integration(g1): compose vertical safety candidates"

      - name: Compile and lint the composed active workspace
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          for package in \
            trnm-native-application \
            trnm-native-application-sqlite \
            trnm-native-execution-v0 \
            trnm-consensus-signer-journal \
            trnm-consensus-external-watermark \
            trnm-poco-node
          do
            cargo clippy --manifest-path trillionnium/Cargo.toml -p "${package}" --locked -- -D warnings
          done
          cargo clippy --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal --lib --locked -- -D warnings

      - name: Run package-owned G1 regressions
        run: |
          set -euo pipefail
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-native-application --lib --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-native-application-sqlite --all-targets --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-native-execution-v0 --lib --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-consensus-signer-journal --all-targets --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-consensus-external-watermark --lib --locked
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-poco-node --lib --locked
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal --lib --locked
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal --doc --locked

      - name: Run bounded complete laboratory-validator inventory
        run: |
          set -euo pipefail
          python3 -B scripts/ci/run_g1_lab_validator_shards_v1.py \
            --workers 4 \
            --minimum-discovered-tests 398 \
            --parallel-test-timeout-seconds 300 \
            --serial-test-timeout-seconds 900 \
            --global-timeout-seconds 14400 \
            --heartbeat-seconds 60 \
            --max-captured-output-bytes 262144 \
            --serial-prefix 'consensus_runtime::' \
            --serial-prefix 'continuous_runtime::' \
            --serial-prefix 'process_event::'

      - name: Run fault, truth and repository contracts
        run: |
          set -euo pipefail
          bash scripts/ci/check_g1_r4_process_matrix_v1.sh
          bash scripts/ci/check_canonical_development_plan.sh
          bash scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          bash scripts/project-preflight.sh --audit
          test ! -e .github/workflows/trnm-g1-vertical-integration.yml
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish exact tested integration commit
        run: |
          set -euo pipefail
          git push origin "HEAD:integration/g1-vertical-closure-v1-20260830"
