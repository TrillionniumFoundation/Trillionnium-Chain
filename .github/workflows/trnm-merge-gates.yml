name: trnm-merge-gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'trillionnium-rust/**'
      - '.github/workflows/trnm-merge-gates.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'trillionnium-rust/**'
      - '.github/workflows/trnm-merge-gates.yml'

concurrency:
  group: trnm-merge-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-p1-gates:
    # Requires a self-hosted runner with local Trillionnium dev chain environment.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq
        run: |
          command -v jq >/dev/null 2>&1 || brew install jq
          jq --version

      - name: Preflight - chain RPC must be reachable
        run: |
          curl -sf http://127.0.0.1:26657/status >/dev/null

      - name: P0 merge gate
        run: |
          HOME_DIR="$HOME/.chain" NODE="tcp://127.0.0.1:26657" ./scripts/p0_merge_gate.sh

      - name: P1 negative suite
        run: |
          HOME_DIR="$HOME/.chain" NODE="tcp://127.0.0.1:26657" ./scripts/p1_negative_suite.sh

      - name: Enforce fail=0 and skip=0
        run: |
          latest_dir=$(ls -1dt data/p1-negative/* | head -n 1)
          summary_json="$latest_dir/summary.json"
          echo "Using summary: $summary_json"
          fail_count=$(jq -r '.fail' "$summary_json")
          skip_count=$(jq -r '.skip' "$summary_json")
          test "$fail_count" = "0"
          test "$skip_count" = "0"

      - name: Rust L1 v1 protocol gates
        run: |
          cd trillionnium-rust
          ./scripts/run_v1_protocol_gates.sh

      - name: Aggressive regression check (PR-visible warn)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium-rust

          TXS=${PR_REGRESSION_MATRIX_TXS:-5000} ./scripts/run_bench_regression_matrix.sh

          REPORT="run/bench/aggressive-regression-pr-${GITHUB_RUN_ID:-local}.txt"
          set +e
          MODE=warn \
          AGGRESSIVE_MAX_RATIO_CLASSIC=${AGGRESSIVE_MAX_RATIO_CLASSIC:-4.75} \
          AGGRESSIVE_MAX_RATIO_MIXED=${AGGRESSIVE_MAX_RATIO_MIXED:-3.75} \
          AGGRESSIVE_MAX_RATIO_HOT_STREAK=${AGGRESSIVE_MAX_RATIO_HOT_STREAK:-3.75} \
          ./scripts/check_aggressive_regression.sh 2>&1 | tee "$REPORT"
          rc=${PIPESTATUS[0]}
          set -e

          if grep -q "regression ratio above threshold" "$REPORT"; then
            echo "::warning title=Aggressive regression warning::One or more aggressive/original ratios exceeded threshold. See workflow summary + artifact report."
          fi

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$REPORT" ]; then
            {
              echo "## Aggressive Regression (PR Warn Mode)"
              echo
              echo "- mode: warn"
              echo "- txs: ${PR_REGRESSION_MATRIX_TXS:-5000}"
              echo
              echo '```text'
              cat "$REPORT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # warn-mode should never block merge gates
          test "$rc" -eq 0

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trnm-gate-artifacts-${{ github.run_id }}
          path: |
            data/p0-acceptance/**
            data/p1-negative/**
            trillionnium-rust/run/parallel-sanity.log
            trillionnium-rust/run/event-field-check.log
            trillionnium-rust/run/event-replay-smoke.log
            trillionnium-rust/run/bench/aggressive-regression-pr-*.txt
            trillionnium-rust/run/bench/bench-regression-matrix-*.csv
          if-no-files-found: warn
