# Separate annotated diagnostic tag; never required pull-request qualification.
name: trnm-required-baseline
run-name: H5DF native stage2 (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-h5df-native-stage2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  h5df_native_stage2:
    name: H5DF native stage2 observation (not qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      CI: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONOPTIMIZE: "0"
      TRNM_EXPECTED_SOURCE_SHA: "5df7ae6f482157c5f7fdcbcd52222117a965053f"
    steps:
      - name: Checkout exact unchanged H5DF subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "5df7ae6f482157c5f7fdcbcd52222117a965053f"
          fetch-depth: 0
          persist-credentials: false
      - name: Bind actual tag control and runner-local subject checkout
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
          GIT_OPTIONAL_LOCKS: "0"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'TRNM_CONTROL_SUBJECT'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess

          REPO = "TrillionniumFoundation/Trillionnium-Chain"
          WORKFLOW = ".github/workflows/trnm-required-baseline.yml"
          SUBJECT = "5df7ae6f482157c5f7fdcbcd52222117a965053f"
          SUBJECT_PARENTS = ["abfcff23d4e2aab7dfd92dfb34937ec7d6021ead", "2a86462a1ab20c68151719ba4635e3c294391e64"]
          TREE = "6be4940d38cc88782657f2684cbefe48866f8b9f"
          TAG = "refs/tags/diagnostic/h5df-native-stage2-tracepoint-capacity-20261114-v2"
          BRANCH = "fix/chain-h5df-native-stage2-20261114"

          def require(ok, message):
              if not ok:
                  raise ValueError(message)

          def pin(path):
              raw = path.read_bytes()
              return {"path": str(path), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}

          context = {name: os.environ.get(name) for name in (
              "GITHUB_ACTIONS", "GITHUB_EVENT_NAME", "GITHUB_REPOSITORY", "GITHUB_REF", "GITHUB_SHA",
              "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB")}
          require(context["GITHUB_ACTIONS"] == "true" and context["GITHUB_EVENT_NAME"] == "workflow_dispatch", "real dispatch context")
          require(context["GITHUB_REPOSITORY"] == REPO and context["GITHUB_REF"] == TAG, "exact repository and tag")
          require(context["GITHUB_WORKFLOW_REF"] == REPO + "/" + WORKFLOW + "@" + TAG, "registered workflow at tag")
          require(context["GITHUB_JOB"] == "h5df_native_stage2", "diagnostic job")
          require(re.fullmatch("[0-9a-f]{40}", context["GITHUB_SHA"] or "") and context["GITHUB_SHA"] != SUBJECT, "actual control commit")
          require(all(re.fullmatch("[1-9][0-9]*", context[k] or "") for k in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")), "actual run context")
          source = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          temporary = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          require(not temporary.is_relative_to(source), "runner temporary root outside full checkout")
          root = temporary / "h5df-native-stage2-control"
          root.mkdir(mode=0o700)
          require(stat.S_IMODE(root.stat().st_mode) == 0o700 and root.stat().st_uid == os.geteuid(), "private owned output")
          out = root / "control"
          out.mkdir(mode=0o700)
          steps = []
          def command(label, argv, expected=0):
              began = dt.datetime.now(dt.timezone.utc).isoformat()
              p = subprocess.run(argv, cwd=source, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60, check=False)
              require(len(p.stdout) <= 16 * 1024 * 1024 and len(p.stderr) <= 65536, "bounded metadata")
              row = {"label": label, "argv": argv, "cwd": str(source), "started_at": began,
                     "finished_at": dt.datetime.now(dt.timezone.utc).isoformat(), "exit_code": p.returncode}
              for stream, data in (("stdout", p.stdout), ("stderr", p.stderr)):
                  path = out / (label + "." + stream)
                  with path.open("xb") as f:
                      f.write(data)
                  row[stream] = pin(path)
              steps.append(row)
              with (out / (label + ".step.json")).open("x") as f:
                  json.dump(row, f, indent=2); f.write("\n")
              require(p.returncode == expected, label)
              return p.stdout

          record = {"schema": "trnm-h5df-native-stage2-control-subject-v1", "status": "HOLD",
                    "actual_github": context, "subject": SUBJECT, "subject_tree": TREE,
                    "subject_parents": SUBJECT_PARENTS, "local_branch": BRANCH,
                    "qualification": False, "production_activation": False, "remote_ref_mutations": False}
          try:
              require(Path(command("root", ["git", "rev-parse", "--show-toplevel"]).decode().strip()).resolve() == source, "full checkout root")
              require(command("control-parents", ["git", "rev-list", "--parents", "-n", "1", context["GITHUB_SHA"]]).decode().split() == [context["GITHUB_SHA"], SUBJECT], "single-parent control")
              record["actual_control_tree"] = command("control-tree", ["git", "rev-parse", context["GITHUB_SHA"] + "^{tree}"]).decode().strip()
              require(command("control-diff", ["git", "diff", "--name-only", SUBJECT, context["GITHUB_SHA"]]).decode().splitlines() == [WORKFLOW], "control changes only workflow")
              require(command("subject-parents", ["git", "rev-list", "--parents", "-n", "1", SUBJECT]).decode().split() == [SUBJECT, *SUBJECT_PARENTS], "exact H5DF ordered two-parent source")
              require(command("subject-tree", ["git", "rev-parse", SUBJECT + "^{tree}"]).decode().strip() == TREE, "actual unchanged H5DF tree")
              require(command("subject-head-before", ["git", "rev-parse", "HEAD"]).decode().strip() == SUBJECT, "explicit H5DF checkout")
              require(not command("subject-clean-before", ["git", "status", "--porcelain=v1", "--untracked-files=all"]), "clean subject checkout")
              flags = command("subject-index-before", ["git", "ls-files", "-v", "-z"]).split(b"\0")
              require(all(row.startswith(b"H ") for row in flags if row), "ordinary tracked index")
              boundary = json.loads((source / "PROJECT_BOUNDARY.json").read_bytes())
              require(BRANCH not in boundary["branch"]["protected"] and re.fullmatch(boundary["branch"]["development_regex"], BRANCH), "original development branch policy")
              command("local-branch-absent", ["git", "show-ref", "--verify", "--quiet", "refs/heads/" + BRANCH], expected=1)
              # Only this fresh runner's local development ref is created. There is no push.
              command("local-development-checkout", ["git", "switch", "--create", BRANCH, SUBJECT])
              require(command("subject-head", ["git", "rev-parse", "HEAD"]).decode().strip() == SUBJECT, "subject checkout")
              require(command("subject-tree-after", ["git", "rev-parse", "HEAD^{tree}"]).decode().strip() == TREE, "subject tree after switch")
              require(command("local-branch", ["git", "branch", "--show-current"]).decode().strip() == BRANCH, "local development branch")
              require(not command("subject-clean", ["git", "status", "--porcelain=v1", "--untracked-files=all"]), "clean subject")
              flags = command("subject-index", ["git", "ls-files", "-v", "-z"]).split(b"\0")
              require(all(row.startswith(b"H ") for row in flags if row), "ordinary subject index")
              record["status"] = "subject_checked_out"
          finally:
              record["steps"] = steps
              record["finished_at"] = dt.datetime.now(dt.timezone.utc).isoformat()
              with (root / "control-subject.json").open("x") as f:
                  json.dump(record, f, indent=2); f.write("\n")
          TRNM_CONTROL_SUBJECT
      - name: Verify diagnostic source before setup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/ci-observations/source.json" > "$RUNNER_TEMP/h5df-native-stage2-control/source-before-setup.stdout" 2> "$RUNNER_TEMP/h5df-native-stage2-control/source-before-setup.stderr"
      - name: Run original default project preflight before any builds
        shell: bash
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/h5df-native-stage2-control"
          set +e
          bash scripts/project-preflight.sh > "$task_root/default-preflight-before-setup.stdout" 2> "$task_root/default-preflight-before-setup.stderr"
          preflight_exit=$?
          set -e
          printf '%s\n' "$preflight_exit" > "$task_root/default-preflight-before-setup.exit"
          exit "$preflight_exit"
      - name: Set isolated Cargo paths after runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_HOME=%s/cargo-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target-%s\n' "$RUNNER_TEMP" "$GITHUB_JOB" >> "$GITHUB_ENV"
          printf 'TRNM_CI_RECEIPT_DIR=%s/ci-observations\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned compiler and tools in isolated hosted runner
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Restore exact external observer, mapper, clock admission and runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'TRNM_NATIVE_STAGE2_HELPERS'
          import base64,hashlib,json,os,stat,zlib
          from pathlib import Path
          directory=Path(os.environ["RUNNER_TEMP"])/'helpers'
          directory.mkdir(mode=0o700)
          if directory.is_symlink() or stat.S_IMODE(directory.stat().st_mode)!=0o700 or directory.stat().st_uid!=os.geteuid(): raise ValueError("private owned helper directory")
          entries=[{'name': 'observe_native_six_sites_tracepoint_v1.c', 'bytes': 40588, 'sha256': 'ee34606dfca9d756ce683ada05d472066e6c948448675d7d15c0a4c8373c5659', 'gzip_bytes': 12098, 'gzip_sha256': 'ba3649df330d1b67b21557d69ac61d7d92650a839751442828f97fae0778b520', 'gzip_base64': ''}, {'name': 'map_and_join_native_tracepoint_v1.py', 'bytes': 27139, 'sha256': 'cfc0c87a1ed196fdf992904888eded5121d49f0330c0f9fc6bde4018c8941777', 'gzip_bytes': 8351, 'gzip_sha256': '99342d5862dd33cfa17c16f6c601a6a18dffb439a99764f65e479352c8e2a119', 'gzip_base64': ''}, {'name': 'admit_h5df_current_elf_clock_v1.py', 'bytes': 14846, 'sha256': '7c13cc8f5bdcb23670ee61053b4b643b48944965ce52cfda601c07974c4a629f', 'gzip_bytes': 5082, 'gzip_sha256': '3a5118019ab9bebded3477509de5e5681c705618827f4368727dd57fdd843225', 'gzip_base64': ''}, {'name': 'run_h5df_native_stage2_v2.py', 'bytes': 46762, 'sha256': 'a8607714114dae302a4030b63193b50fb47cce65777f58cbcfcd24fb0fc8b204', 'gzip_bytes': 13798, 'gzip_sha256': 'e0e533ce5df9240fe1e2291abf21571effe6fd2a29e3582dd53f1f0e6cc36a8e', 'gzip_base64': ''}]
          proofs=[]
          for item in entries:
              packed=base64.b64decode(item["gzip_base64"],validate=True)
              if len(packed)!=item["gzip_bytes"] or hashlib.sha256(packed).hexdigest()!=item["gzip_sha256"]: raise ValueError("gzip pin")
              decoder=zlib.decompressobj(31)
              raw=decoder.decompress(packed,item["bytes"]+1)
              if (not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or len(raw)!=item["bytes"]
                  or hashlib.sha256(raw).hexdigest()!=item["sha256"]): raise ValueError("bounded exact helper bytes")
              if Path(item["name"]).name!=item["name"]: raise ValueError("literal helper basename")
              path=directory/item["name"]
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,"wb") as f: f.write(raw);f.flush()
              if path.read_bytes()!=raw: raise ValueError("helper readback")
              proofs.append({"path":str(path),"bytes":len(raw),"sha256":item["sha256"],"gzip_bytes":item["gzip_bytes"],"gzip_sha256":item["gzip_sha256"]})
          with (directory/"decoded-source-pins.json").open("x") as f:
              json.dump({"schema":"trnm-diagnostic-embedded-source-pins-v1","files":proofs,"qualification":False},f,indent=2);f.write("\n")
          TRNM_NATIVE_STAGE2_HELPERS
      - name: Observe original H5DF native controls under the original Host workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/helpers/run_h5df_native_stage2_v2.py" --source "$GITHUB_WORKSPACE" --control "$GITHUB_SHA" --tag diagnostic/h5df-native-stage2-tracepoint-capacity-20261114-v2 --output "$RUNNER_TEMP/h5df-native-stage2"
      - name: Verify diagnostic source after execution or setup failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/h5df-native-stage2-control"
          if [[ ! -d "$task_root" ]]; then
            echo "HOLD: control-subject setup did not produce a private evidence root"
            exit 1
          fi
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$task_root/source-after-workflow.json" > "$task_root/source-after-workflow.stdout" 2> "$task_root/source-after-workflow.stderr"
      - name: Preserve original failures and diagnostic observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h5df-native-stage2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/h5df-native-stage2/
            ${{ runner.temp }}/h5df-native-stage2-control/
            ${{ runner.temp }}/helpers/
            ${{ runner.temp }}/ci-observations/
          if-no-files-found: error
          retention-days: 30
