name: plan-v2 exact remaining-blocker repair

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/zz-plan-v2-durable-adapter-repair.yml
      - tools/fixup_plan_v2_repair_generator.py
      - tools/repair_plan_v2_remaining_blockers.py
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: plan-v2-one-shot-durable-adapter-repair
  cancel-in-progress: true

env:
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_TIMEOUT: "120"
  RUSTUP_TOOLCHAIN: "1.95.0"
  BRANCH: work/plan-v2-full-gap-closure-20260902

jobs:
  apply-and-qualify:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.actor == 'ProfHepta' &&
      github.triggering_actor == github.actor &&
      github.ref == 'refs/heads/work/plan-v2-full-gap-closure-20260902' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 240
    steps:
      - name: Check out exact triggering branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Construct the canonical Plan v2 repository closure
        run: |
          set -euo pipefail
          python3 tools/finalize_repository_closure_v4.py
          python3 tools/fixup_plan_v2_repair_generator.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/repair_plan_v2_remaining_blockers.py")
          source = path.read_text(encoding="utf-8")
          old = (
              "- **Recovery pipeline:** `payload replay` and `replay-to-Core` bind the same "
              "signed cut hash and catch-up boundary. After SIGKILL, crash, or reopen, only "
              "authenticated, durable, monotonic replay may resume."
          )
          new = (
              "- **Recovery pipeline:** `payload replay` and `replay-to-Core` bind the same "
              "signed cut hash and catch-up boundary and prove crash convergence. After "
              "SIGKILL, crash, or reopen, only authenticated, durable, monotonic replay may resume."
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f"recovery contract source drift: expected one pipeline sentence, found {count}"
              )
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python3 tools/repair_plan_v2_remaining_blockers.py
          git rm \
            .github/workflows/zz-apply-plan-v2-closure-tree.yml \
            .github/workflows/zz-plan-v2-durable-adapter-repair.yml \
            tools/fixup_plan_v2_repair_generator.py

      - name: Prime isolated Cargo registry and prove offline resolution
        run: |
          set -euo pipefail
          test -n "${CARGO_HOME:-}"
          case "$CARGO_HOME" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "CARGO_HOME is not isolated under RUNNER_TEMP: $CARGO_HOME" >&2; exit 2 ;;
          esac
          mkdir -p "$CARGO_HOME"
          mapfile -t lockfiles < <(
            find . -type f -name Cargo.lock \
              -not -path './.git/*' \
              -not -path '*/target/*' \
              -print | LC_ALL=C sort
          )
          test "${#lockfiles[@]}" -gt 0
          for lockfile in "${lockfiles[@]}"; do
            manifest="${lockfile%/Cargo.lock}/Cargo.toml"
            test -f "$manifest"
            echo "priming locked dependencies for $manifest"
            cargo fetch --manifest-path "$manifest" --locked
          done
          for lockfile in "${lockfiles[@]}"; do
            manifest="${lockfile%/Cargo.lock}/Cargo.toml"
            CARGO_NET_OFFLINE=true cargo metadata \
              --manifest-path "$manifest" \
              --locked \
              --format-version 1 \
              --no-deps >/dev/null
          done
          echo 'CARGO_NET_OFFLINE=true' >> "$GITHUB_ENV"

      - name: Verify preinstalled pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain list | grep -Eq '^1\.95\.0(-|$)'
          rustc --version | grep -q '^rustc 1\.95\.0 '
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Normalize and validate generated source
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git diff --check
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib
          root = pathlib.Path(".")
          for path in sorted(root.rglob("*.json")):
              if any(part in {".git", "node_modules", "target"} for part in path.parts):
                  continue
              json.loads(path.read_text(encoding="utf-8"))
          for path in sorted(root.rglob("*.toml")):
              if any(part in {".git", "node_modules", "target"} for part in path.parts):
                  continue
              tomllib.loads(path.read_text(encoding="utf-8"))
          PY
          python3 -m py_compile \
            tools/repair_plan_v2_remaining_blockers.py \
            scripts/check_repository_blocker_registry_v0.py \
            scripts/ci/check_module_documentation_v1.py \
            scripts/ci/check_markdown_links_v1.py

      - name: Run structural and documentation closure gates
        run: |
          set -euo pipefail
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_module_documentation_v1.py
          python3 scripts/ci/check_markdown_links_v1.py
          python3 scripts/ci/check_node_decomposition_v1.py
          python3 scripts/ci/check_build_closures_v1.py --verify-cargo-tree
          python3 scripts/check_repository_blocker_registry_v0.py
          bash scripts/check_ci_runner_policy_test.sh
          bash scripts/check_ci_runner_policy.sh --worktree
          WORKFLOW_SCRIPT_REF_STRICT=1 bash scripts/validate_workflow_script_refs.sh
          bash scripts/ci/check_legacy_harness_freeze.sh
          bash scripts/ci/check_payload_replay_recovery_v1.sh
          bash scripts/ci/check_replay_to_core_coordinator_v1.sh

      - name: Run complete active Rust and contract baseline
        run: |
          set -euo pipefail
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          cargo test --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          cargo check --manifest-path contracts/Cargo.toml --workspace --all-targets --locked
          cargo test --manifest-path contracts/Cargo.toml --workspace --all-targets --locked
          cargo clippy --manifest-path contracts/Cargo.toml --workspace --all-targets --locked -- -D warnings
          for package in \
            trnm-state \
            trnm-consensus-types \
            trnm-consensus-crypto \
            trnm-consensus-core \
            trnm-consensus-safety-rules \
            trnm-consensus-safety-store \
            trnm-consensus-signer-journal \
            trnm-native-application \
            trnm-native-application-sqlite \
            trnm-native-execution-v0 \
            trnm-durable-file-adapters-v0 \
            trnm-tx-lifecycle-v0 \
            trnm-state-sync-v0 \
            trnm-migration-v0 \
            trnm-control-plane-v0 \
            trnm-release-bundle-v0 \
            trnm-node-boundary-v0 \
            trnm-poco-node-production-v0 \
            trnm-production-adapter-conformance-v0 \
            trnm-poco-node \
            trnm-poco-node-authority \
            trnm-poco-node-io \
            trnm-poco-node-host \
            trnm-poco-node-cli
          do
            cargo clippy --manifest-path trillionnium/Cargo.toml \
              -p "${package}" --all-targets --locked -- -D warnings
          done

      - name: Prove production-shaped CLI remains fail-closed
        run: |
          set -euo pipefail
          status=$(cargo run --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node-cli --bin trnm-poco-node-cli --locked -- status)
          printf '%s\n' "$status" | grep -q '"production_candidate":false'
          printf '%s\n' "$status" | grep -q '"authority_gate_open":false'
          printf '%s\n' "$status" | grep -q '"production_activation":false'
          printf '%s\n' "$status" | grep -q '"start_permitted":false'
          set +e
          cargo run --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node-cli --bin trnm-poco-node-cli --locked -- start \
            >"${RUNNER_TEMP}/trnm-node-start.out" \
            2>"${RUNNER_TEMP}/trnm-node-start.err"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'node host start blocked' "${RUNNER_TEMP}/trnm-node-start.err"

      - name: Commit the exact qualified source locally
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'plan-v2-closure-bot'
          git config user.email 'plan-v2-closure-bot@users.noreply.github.com'
          git commit -m 'fix(plan): close remaining repository-owned blockers'

      - name: Bind every plan pin and machine truth to the committed tree
        run: |
          set -euo pipefail
          python3 scripts/ci/check_plan_manifest_pins_v1.py
          python3 scripts/ci/check_repository_truth_v1.py
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_required_baseline_closure_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          python3 scripts/ci/generate_release_status_v1.py --check-deterministic \
            --output "${RUNNER_TEMP}/trnm-release-status-v1.json"
          python3 scripts/ci/check_external_evidence_v1.py \
            --output "${RUNNER_TEMP}/external-evidence-status-v1.json"
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish exact qualified source
        id: publish
        run: |
          set -euo pipefail
          git push origin HEAD:${BRANCH}
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head required baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/345677268/dispatches" \
            --data "{\"ref\":\"${BRANCH}\"}"

      - name: Dispatch specialized exact-branch replays
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow_id in \
            327120359 \
            344348899 \
            348267527 \
            344285694 \
            327120374 \
            327120369 \
            348065274 \
            348112937 \
            346387226 \
            348090683 \
            329835686 \
            327120368 \
            327120367 \
            327120377
          do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
              --data "{\"ref\":\"${BRANCH}\"}"
          done
