name: finalize-native-poco-workflow

on:
  push:
    branches:
      - chore/poco-only-purge-20260909

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/poco-only-purge-20260909
          persist-credentials: true
      - name: Finalize native PoCO workflow and remove repair carriers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/trnm-poco-bft-v0.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          names = [i for i,l in enumerate(lines) if l.strip() == '- name: Verify workflow trigger and safety truth']
          if len(names) != 1:
              raise SystemExit(f'expected one workflow-truth step, found {len(names)}')
          i = names[0]
          j = next((n for n in range(i + 1, len(lines)) if lines[n].lstrip().startswith('- name:')), len(lines))
          if not any(x.strip().startswith('run:') for x in lines[i:j]):
              wd = next((n for n in range(i + 1, j) if lines[n].strip() == 'working-directory: trillionnium-chain'), None)
              if wd is None:
                  raise SystemExit('workflow-truth step missing working-directory')
              lines.insert(wd + 1, '        run: bash ./scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh --self-test')
          lines = [x for x in lines if 'TRNM_CONSENSUS_DELIVERY_DUAL_TRACK_DECISION_2026-08-11.md' not in x]
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh --self-test
          rm -f .github/workflows/repair-native-poco-gate.yml
          rm -f .github/workflows/finalize-native-poco-workflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/trnm-poco-bft-v0.yml \
                  scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh \
                  .github/workflows/repair-native-poco-gate.yml \
                  .github/workflows/finalize-native-poco-workflow.yml
          git diff --cached --check
          git commit -m 'ci(poco): finalize native-only workflow after purge'
          git push origin HEAD:chore/poco-only-purge-20260909
