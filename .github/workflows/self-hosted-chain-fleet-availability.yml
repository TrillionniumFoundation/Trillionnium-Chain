          test "$RUNNER_NAME" = claw-j3160
          uname -a

  pocket4:
    name: Chain Pocket4 runner probe
    runs-on: [self-hosted, linux, x64, chain-fleet, pocket4]
    timeout-minutes: 10
    steps:
      - name: Verify Pocket4 slot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = pocket4
          uname -a

  macbook:
    name: Chain MacBook Pro runner probe
    runs-on: [self-hosted, macOS, ARM64, chain-fleet, macbook]
    timeout-minutes: 10
    steps:
      - name: Verify MacBook Pro slot
