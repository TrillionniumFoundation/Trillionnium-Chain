name: full-gap-closure-finality-hardening-fix

on:
  push:
    branches:
      - work/full-gap-closure-20260831
    paths:
      - .github/workflows/full-gap-closure-finality-hardening-fix.yml

permissions:
  contents: write

concurrency:
  group: full-gap-closure-finality-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-one-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/full-gap-closure-20260831
          fetch-depth: 0
          persist-credentials: true
      - name: Repair digest and lineage assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "22fa5728d4ddbf0e60d0085b937ca50dcc22d67b"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/full-gap-closure-finality-hardening.yml')
          text = path.read_text()
          old_digest = '1b54125434d330f34165dd3c15621db58efeae9d42a5ea93aa8caa34b01f7968'
          new_digest = 'ea95160926c77fe8d0342f60e03bf6ce88903543e37e05e92b76bc5067b72fc6'
          if text.count(old_digest) != 1:
              raise SystemExit('unexpected patch digest occurrence count')
          text = text.replace(old_digest, new_digest)
          old_lineage = '''          test "$(git rev-parse HEAD^)" = "68a35c3ed0c725347a5ac440be695762c8e36a33"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = ".github/workflows/full-gap-closure-finality-hardening.yml"'''
          new_lineage = '''          test "$(git rev-parse HEAD^^)" = "22fa5728d4ddbf0e60d0085b937ca50dcc22d67b"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = $'.github/workflows/full-gap-closure-finality-hardening-fix.yml\\n.github/workflows/full-gap-closure-finality-hardening.yml' '''.rstrip()
          if text.count(old_lineage) != 1:
              raise SystemExit('unexpected lineage assertion occurrence count')
          path.write_text(text.replace(old_lineage, new_lineage))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/full-gap-closure-finality-hardening-fix.yml
          git add .github/workflows/full-gap-closure-finality-hardening.yml
          git diff --cached --check
          git commit -m "fix(ci): bind finality patch to exact digest"
          git push origin "HEAD:work/full-gap-closure-20260831"
