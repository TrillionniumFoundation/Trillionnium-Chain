          import hashlib, json, os, shutil, sys, tarfile
          from pathlib import Path
          stage = sys.argv[1]
          root = Path(os.environ['RUNNER_TEMP'])
          output = root / 'hia-typed-store-artifact'
          output.mkdir(mode=0o700)
          stage_path = root / ('hia-typed-store-' + stage)
          record = {'schema': 'trnm.hia.typed-store.ci-evidence-package.v1', 'stage': stage,
              'source': os.environ.get('TRNM_EXPECTED_SOURCE_SHA'), 'run_id': os.environ.get('GITHUB_RUN_ID'),
              'attempt': os.environ.get('GITHUB_RUN_ATTEMPT'), 'job': os.environ.get('GITHUB_JOB'),
              'qualification_status_not_changed_by_packaging': True,
              'excluded_reconstructible_original_source': 'original/isolated-source',
              'excluded_cargo_target': str(root / 'hia-typed-store-cargo-target'), 'files': {}, 'error': None}
          def identity(path):
              value, size = hashlib.sha256(), 0
              with path.open('rb') as stream:
                  while block := stream.read(1 << 20):
                      value.update(block)
                      size += len(block)
              return {'bytes': size, 'sha256': value.hexdigest()}
          def copy_if_present(source, relative):
              if not source.exists():
                  return
              if source.is_symlink() or not source.is_file():
                  raise ValueError('Expected regular direct handoff: ' + str(source))
              before = identity(source)
              destination = output / relative
              destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
              if identity(destination) != before or identity(source) != before:
                  raise ValueError('Handoff changed during packaging: ' + str(source))
