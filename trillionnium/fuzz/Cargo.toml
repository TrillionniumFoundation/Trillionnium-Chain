[package]
name = "trnm-canonical-input-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.149"
trnm-finality-types = { version = "0.1.0", path = "../crates/trnm-finality-types" }
trnm-protocol = { version = "0.1.0", path = "../crates/trnm-protocol" }

[[bin]]
name = "canonical_tx_json"
path = "fuzz_targets/canonical_tx_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_envelope_json"
path = "fuzz_targets/signed_envelope_json.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
