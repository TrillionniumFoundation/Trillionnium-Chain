name: trnm-convergence-closure-v1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/chain-foundation-recovery-20260908
    paths:
      - '.github/workflows/trnm-convergence-closure-v1.yml'
      - '.github/workflows/trnm-gate-quick-check.yml'
      - 'config/**'
      - 'docs/development/**'
      - 'docs/modules/**'
      - 'scripts/ci/**'
      - 'scripts/v2/**'
      - 'scripts/check_*policy*'
      - 'trillionnium/Cargo.toml'
      - 'trillionnium/Cargo.lock'
      - 'trillionnium/crates/**'

permissions:
  contents: read

concurrency:
  group: trnm-convergence-closure-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: 'true'
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
  TRNM_CARGO_OFFLINE_POLICY: required
  TRNM_EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  convergence-closure:
    name: exact-source-convergence-closure-x230
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.actor == 'ProfHepta' &&
      github.triggering_actor == github.actor &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 240
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trillionnium-chain
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and preprovisioned toolchain
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRNM_EXPECTED_SOURCE_SHA}"
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 --component rustfmt --component clippy
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock

      - name: Validate canonical plan and repository truth
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_plan_manifest_pins_v1.py
          python3 scripts/ci/check_documentation_contracts_v1.py
          python3 scripts/ci/test_documentation_contracts_v1.py
          python3 scripts/ci/check_documentation_reference_closure_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          python3 scripts/ci/check_build_closures_v1.py --verify-cargo-tree
          python3 scripts/ci/check_required_baseline_closure_v1.py
          python3 scripts/ci/check_technical_convergence_v1.py
          python3 scripts/ci/test_technical_convergence_v1.py

      - name: Validate corrected critical gates
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          bash scripts/v2/trnm_gate_quick_check_shellcheck_install_deterministic_apt_guard_test.sh
          bash scripts/ci/check_finalization_intent_process_matrix_v1.sh
          bash scripts/ci/check_replay_to_core_coordinator_v1.sh
          bash scripts/ci/check_payload_replay_recovery_v1.sh
          bash scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover

      - name: Run internal blocker package matrix
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          for package in \
            trnm-native-application-sqlite \
            trnm-node-boundary-v0 \
            trnm-tx-lifecycle-v0 \
            trnm-state-sync-v0 \
            trnm-migration-v0 \
            trnm-control-plane-v0 \
            trnm-production-adapter-conformance-v0 \
            trnm-poco-node-production-v0; do
            cargo test --manifest-path trillionnium/Cargo.toml \
              --locked --offline -p "$package" --all-targets
            cargo clippy --manifest-path trillionnium/Cargo.toml \
              --locked --offline -p "$package" --all-targets -- -D warnings
          done

      - name: Confirm external gates remain fail-closed without evidence
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          python3 scripts/ci/check_external_evidence_v1.py
          if python3 scripts/ci/check_external_evidence_v1.py --release; then
            echo 'external evidence release mode unexpectedly passed' >&2
            exit 1
          fi

      - name: Verify checkout cleanliness and offline inputs
        if: always()
        working-directory: trillionnium-chain
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"
