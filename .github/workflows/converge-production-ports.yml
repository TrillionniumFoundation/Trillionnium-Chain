name: converge-production-ports

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/poco-only-purge-20260909
          fetch-depth: 0
          persist-credentials: true
      - name: Apply clean production-port delta and self-clean
        env:
          SOURCE_SHA: 2ae1915c39774938dc7c8a0799a1224bb5024f2c
        run: |
          set -euo pipefail
          # Preserve the clean product source while applying it onto the already
          # purged native-only tree. Formatting is normalized to the active pinned
          # Rust toolchain before the convergence commit is published.
          git fetch --no-tags origin "$SOURCE_SHA"
          git show "$SOURCE_SHA:trillionnium/crates/trnm-node-boundary-v0/src/production_ports.rs" > trillionnium/crates/trnm-node-boundary-v0/src/production_ports.rs
          git show "$SOURCE_SHA:trillionnium/crates/trnm-tx-lifecycle-v0/src/production.rs" > trillionnium/crates/trnm-tx-lifecycle-v0/src/production.rs
          python3 - <<'PY'
          from pathlib import Path

          edits = [
              (
                  Path("trillionnium/crates/trnm-node-boundary-v0/src/lib.rs"),
                  "use std::{collections::BTreeSet, error::Error, fmt};\n",
                  "mod production_ports;\npub use production_ports::*;\n",
              ),
              (
                  Path("trillionnium/crates/trnm-tx-lifecycle-v0/src/lib.rs"),
                  "use std::{collections::BTreeMap, error::Error, fmt};\n",
                  "mod production;\npub use production::*;\n",
              ),
          ]
          for path, anchor, insertion in edits:
              text = path.read_text(encoding="utf-8")
              if insertion in text:
                  continue
              if text.count(anchor) != 1:
                  raise SystemExit(f"expected exactly one anchor in {path}")
              path.write_text(text.replace(anchor, anchor + "\n" + insertion, 1), encoding="utf-8")
          PY
          (
            cd trillionnium
            cargo fmt -p trnm-node-boundary-v0 -p trnm-tx-lifecycle-v0
            cargo fmt -p trnm-node-boundary-v0 -p trnm-tx-lifecycle-v0 -- --check
          )
          rm .github/workflows/converge-production-ports.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trillionnium/crates/trnm-node-boundary-v0/src/lib.rs \
                  trillionnium/crates/trnm-node-boundary-v0/src/production_ports.rs \
                  trillionnium/crates/trnm-tx-lifecycle-v0/src/lib.rs \
                  trillionnium/crates/trnm-tx-lifecycle-v0/src/production.rs \
                  .github/workflows/converge-production-ports.yml
          git diff --cached --check
          git commit -m "feat(production): converge security ports and durable tx coordinator" \
                     -m "Source product delta: 2ae1915c39774938dc7c8a0799a1224bb5024f2c; formatting normalized to the pinned toolchain."
          git push origin HEAD:chore/poco-only-purge-20260909
