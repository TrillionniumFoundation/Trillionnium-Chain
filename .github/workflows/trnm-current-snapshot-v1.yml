name: TRNM current snapshot v1 gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/trnm-current-snapshot-v1.yml"
      - "docs/development/CURRENT_SNAPSHOT_V1.json"
      - "docs/development/plan-evidence-manifest-v1.json"
      - "docs/development/plan-manifest-v1.toml"
      - "docs/development/CURRENT_TRUTH_PROVENANCE_V1.md"
      - "docs/development/packages/TRNM_G0_TRUTH_PROVENANCE_V1.md"
      - "docs/schemas/current-snapshot-v1.schema.json"
      - "docs/schemas/plan-evidence-manifest-v1.schema.json"
      - "scripts/ci/generate_current_snapshot_v1.py"
      - "scripts/ci/check_current_snapshot_v1.sh"
  push:
    branches:
      - main
      - "docs/chain-poco-bft-mainline-20260825"
    paths:
      - ".github/workflows/trnm-current-snapshot-v1.yml"
      - "docs/development/CURRENT_SNAPSHOT_V1.json"
      - "docs/development/plan-evidence-manifest-v1.json"
      - "docs/development/plan-manifest-v1.toml"
      - "docs/schemas/current-snapshot-v1.schema.json"
      - "docs/schemas/plan-evidence-manifest-v1.schema.json"
      - "scripts/ci/generate_current_snapshot_v1.py"
      - "scripts/ci/check_current_snapshot_v1.sh"

permissions:
  contents: read

concurrency:
  group: trnm-current-snapshot-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: UTF-8
  PYTHONUTF8: "1"

jobs:
  provenance-contract:
    name: Exact truth/provenance observation contract
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      ((github.actor == 'ProfAlexQI' && github.triggering_actor == 'ProfAlexQI') ||
       (github.actor == 'Tomasrgbsf' && github.triggering_actor == 'Tomasrgbsf') ||
       (github.actor == 'github-actions[bot]' &&
        github.triggering_actor == 'github-actions[bot]' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.author_association == 'MEMBER')) &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trillionnium-chain
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reproducible current snapshot
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_current_snapshot_v1.sh
      - name: Verify canonical development plan
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_canonical_development_plan.sh
      - name: Verify native PoCO pre-cutover truth
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
      - name: Verify project boundary
        working-directory: trillionnium-chain
        run: bash ./scripts/project-preflight.sh --audit
