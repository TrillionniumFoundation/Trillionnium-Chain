name: trnm-c0-reviewed-patch-uploader

on:
  push:
    branches:
      - converge/c0-current-gate-closure-20260908
    paths:
      - '.github/workflows/trnm-c0-exact-source-export.yml'
      - '.github/c0-policy.patch.b64.*'

permissions:
  contents: write

concurrency:
  group: trnm-c0-reviewed-patch-uploader
  cancel-in-progress: false

jobs:
  publish-reviewed-tree:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.actor == 'ProfHepta' &&
      github.triggering_actor == github.actor &&
      github.ref == 'refs/heads/converge/c0-current-gate-closure-20260908'
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 20
    steps:
      - name: Check out exact upload source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fixed reviewed patch and validate final tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          patch_file="$RUNNER_TEMP/c0-policy.patch"
          cat \
            .github/c0-policy.patch.b64.00 \
            .github/c0-policy.patch.b64.01 \
            .github/c0-policy.patch.b64.02 \
            .github/c0-policy.patch.b64.030 \
            .github/c0-policy.patch.b64.031 \
            .github/c0-policy.patch.b64.032 \
            .github/c0-policy.patch.b64.040 \
            .github/c0-policy.patch.b64.041 \
            .github/c0-policy.patch.b64.042 \
            .github/c0-policy.patch.b64.050 \
            .github/c0-policy.patch.b64.051 \
            | base64 --decode > "$patch_file"
          printf '%s  %s\n' \
            '67d4661727fc68653d0d2e0750f5d42412fc7e3f0f9f7c4fa1873b711a511e12' \
            "$patch_file" | sha256sum --check --strict
          git apply --check "$patch_file"
          git apply --index "$patch_file"
          rm -f .github/c0-policy.patch.b64.*
          rm -f .github/workflows/trnm-c0-exact-source-export.yml
          git add -A
          git diff --cached --check
          bash scripts/check_ci_runner_policy.sh --worktree
          bash scripts/check_ci_runner_policy_test.sh
          bash scripts/ci/check_poco_bft_v0_workflow_trigger_truth.sh --self-test
          bash scripts/ci/check_canonical_development_plan.sh

          git config user.name 'trnm-c0-reviewed-uploader'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): authorize current code owner and restore exact history'
          git push origin HEAD:refs/heads/tmp/c0-policy-upload-20260908
          {
            echo '## Reviewed C0 tree uploaded'
            echo
            echo "- source: $GITHUB_SHA"
            echo "- commit: $(git rev-parse HEAD)"
            echo "- tree: $(git rev-parse 'HEAD^{tree}')"
            echo '- patch sha256: 67d4661727fc68653d0d2e0750f5d42412fc7e3f0f9f7c4fa1873b711a511e12'
          } >> "$GITHUB_STEP_SUMMARY"
