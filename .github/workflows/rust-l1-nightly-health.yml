name: rust-l1-nightly-health

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'trillionnium/**'
      - 'scripts/**'
      - 'config/alert-policy/**'
      - '.github/workflows/rust-l1-nightly-health.yml'

permissions:
  contents: read

concurrency:
  group: rust-l1-nightly-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-l1-health:
    runs-on: macos-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_NUMERIC: C
      LC_COLLATE: C
      LC_TIME: C
      LC_CTYPE: C
      LC_MESSAGES: C
      LC_MONETARY: C
      LC_MEASUREMENT: C
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "UTF-8"
      CI: "true"
      SOURCE_DATE_EPOCH: "1704067200"
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0

      - name: Install GNU timeout
        run: brew install coreutils

      - name: Rust workspace tests
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          export RUST_TEST_THREADS="${RUST_TEST_THREADS:-1}"
          cd trillionnium
          cargo test --workspace --locked

      - name: Run devnet + state root audit (baseline)
        run: |
          set -euo pipefail
          cd trillionnium
          ./scripts/devnet_up.sh
          # allow initial cargo startup + block production on CI runners
          sleep ${DEVNET_AUDIT_WAIT_SECONDS:-12}
          ./scripts/devnet_down.sh || true
          ./scripts/audit_state_roots.sh

      - name: Run parallel mode sanity (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          cargo run --locked -q -p trnm-node --features legacy-harness --bin trnm-sim -- \
            --config configs/node1.toml \
            --block-ms 5 \
            --max-blocks 6 \
            --demo-tasks 8 \
            --demo-keys 3 \
            --parallel-workers 4 | tee run/parallel-sanity.log

          # hard fail if parallel path shows runtime apply error or rollback
          if grep -E '\[tx\] apply_error|rollback=true' run/parallel-sanity.log; then
            echo "parallel sanity detected apply_error/rollback" >&2
            exit 2
          fi

      - name: Validate v1 event field freeze (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          MVP_MODE=prod ALLOW_MISSING_RESOLVE_EVENT=0 ./scripts/check_event_fields.sh

      - name: Validate PoUW timeout migration gates (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          ./scripts/v2/pouw_commit_timeout_migration_test.sh
          ./scripts/v2/pouw_challenge_timeout_migration_test.sh

      - name: Validate challenge bond enforcement gate (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          ./scripts/v2/challenge_bond_enforcement_test.sh

      - name: Validate parallel flaky streak (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          RUNS=${PARALLEL_FLAKY_RUNS:-5} ./scripts/check_parallel_flaky.sh

      - name: Validate v1 event replay order (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          MVP_MODE=prod ALLOW_PARTIAL_EVENT_REPLAY=0 ./scripts/check_event_replay_smoke.sh

      - name: BFT 4-node consensus smoke (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          ./scripts/check_bft_4node_smoke.sh

      - name: BFT restart recovery (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          RUNS=${BFT_RECOVERY_RUNS:-20} ./scripts/check_bft_restart_recovery.sh

      - name: BFT message auth anti-replay (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          ./scripts/check_bft_message_auth.sh

      - name: BFT round-change + recovery liveness (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          ./scripts/check_bft_round_change.sh

      - name: "Consensus fault matrix (hard gate: baseline/restart/byzantine)"
        if: always()
        id: consensus_fault_hard
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          hard_report="run/health/consensus-fault-matrix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-hard.txt"
          echo "hard_report=${hard_report}" >> "$GITHUB_OUTPUT"
          CONSENSUS_FAULT_MATRIX_OUT="$hard_report" \
          GATE_MODE=hard \
          ALLOW_FAIL=0 \
          EXPECTED_CASES=3 \
          CASE_FILTER="baseline,restart_recovery,byzantine_rounds" \
          BASELINE_MAX_FINALITY_P95_MS=${BASELINE_MAX_FINALITY_P95_MS:-100} \
          RESTART_RECOVERY_MAX_FINALITY_P95_MS=${RESTART_RECOVERY_MAX_FINALITY_P95_MS:-200} \
          BYZANTINE_ROUNDS_MAX_FINALITY_P95_MS=${BYZANTINE_ROUNDS_MAX_FINALITY_P95_MS:-220} \
          BASELINE_MAX_ROUND_CHANGE_TOTAL=${BASELINE_MAX_ROUND_CHANGE_TOTAL:-8} \
          RESTART_RECOVERY_MAX_ROUND_CHANGE_TOTAL=${RESTART_RECOVERY_MAX_ROUND_CHANGE_TOTAL:-8} \
          BYZANTINE_ROUNDS_MAX_ROUND_CHANGE_TOTAL=${BYZANTINE_ROUNDS_MAX_ROUND_CHANGE_TOTAL:-10} \
          ./scripts/run_consensus_fault_matrix.sh

      - name: "Consensus fault matrix (soft gate observe: 5 stress cases)"
        if: always()
        id: consensus_fault_soft
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          soft_report="run/health/consensus-fault-matrix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-soft.txt"
          echo "soft_report=${soft_report}" >> "$GITHUB_OUTPUT"
          CONSENSUS_FAULT_MATRIX_OUT="$soft_report" \
          GATE_MODE=soft \
          EXPECTED_CASES=5 \
          CASE_FILTER="slow_block,faulty_round_backoff,leader_jitter,message_reorder,slow_validator" \
          ALLOW_FAIL=1 \
          SLOW_BLOCK_MAX_FINALITY_P95_MS=${SLOW_BLOCK_MAX_FINALITY_P95_MS:-300} \
          FAULTY_ROUND_BACKOFF_MAX_FINALITY_P95_MS=${FAULTY_ROUND_BACKOFF_MAX_FINALITY_P95_MS:-320} \
          LEADER_JITTER_MAX_FINALITY_P95_MS=${LEADER_JITTER_MAX_FINALITY_P95_MS:-320} \
          MESSAGE_REORDER_MAX_FINALITY_P95_MS=${MESSAGE_REORDER_MAX_FINALITY_P95_MS:-350} \
          SLOW_VALIDATOR_MAX_FINALITY_P95_MS=${SLOW_VALIDATOR_MAX_FINALITY_P95_MS:-320} \
          ./scripts/run_consensus_fault_matrix.sh

      - name: Append consensus fault matrix (hard/soft) to GitHub Step Summary
        if: always()
        run: |
          set -euo pipefail
          cd trillionnium

          hard_report="${{ steps.consensus_fault_hard.outputs.hard_report }}"
          soft_report="${{ steps.consensus_fault_soft.outputs.soft_report }}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Consensus Fault Matrix"
              echo
              if [ -n "$hard_report" ] && [ -f "$hard_report" ]; then
                echo "### Hard gate"
                cat "$hard_report"
                echo
              fi
              if [ -n "$soft_report" ] && [ -f "$soft_report" ]; then
                echo "### Soft observation"
                cat "$soft_report"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Request fault injection (MVP hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          ./scripts/run_request_fault_injection.sh

      - name: Request tx-hash binding (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          ./scripts/check_request_tx_binding.sh

      - name: Challenge reexec bundle smoke (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          ./scripts/challenge_reexec_template_smoke.sh

      - name: Worker-agent tx-hash receipt hard gate
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          ./scripts/v2/run_worker_receipt_gates.sh

      - name: Worker-agent strict real-cli gate (default-on)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          if [[ "${REQUIRE_REAL_TX_CLI:-1}" == "1" ]]; then
            TRNM_TX_CLI="${TRNM_TX_CLI:-./scripts/v2/trnm_tx_cli_wrapper.sh}" ./scripts/v2/run_worker_receipt_gates_real_cli.sh
          else
            echo "[skip] strict real-cli gate disabled (REQUIRE_REAL_TX_CLI=${REQUIRE_REAL_TX_CLI:-1})"
          fi

      - name: Worker-agent multi-agent onboarding smoke (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          TRNM_TX_CLI="${TRNM_TX_CLI:-./scripts/v2/trnm_tx_cli_wrapper.sh}" \
          SKIP_GATES=1 AGENTS=${WORKER_MULTI_AGENTS:-5} \
            ./scripts/v2/worker_agent_mining_onboard.sh

      - name: Executor spot-check regression gate (Original strategy)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium

          OUT_DIR="run/bench"
          mkdir -p "$OUT_DIR"
          SPOT="$OUT_DIR/executor-spotcheck-${GITHUB_RUN_ID:-local}.txt"

          echo "[spotcheck] classic (txs=20000, keys=1000, strategy=original)" | tee "$SPOT"
          cargo run --locked -q -p trnm-bench -- \
            --txs 20000 --keys 1000 --strategy original --profile | tee -a "$SPOT"

          echo "[spotcheck] mixed (txs=20000, keys=2000, read_fanout=4, write_every=2, strategy=original)" | tee -a "$SPOT"
          cargo run --locked -q -p trnm-bench -- \
            --txs 20000 --keys 2000 --workload mixed --read-fanout 4 --write-every 2 --strategy original --profile | tee -a "$SPOT"

          CLASSIC_HARD_MS=${SPOTCHECK_CLASSIC_HARD_MS:-180}
          MIXED_HARD_MS=${SPOTCHECK_MIXED_HARD_MS:-220}

          classic_elapsed=$(awk '/\[spotcheck\] classic/{flag=1; next} flag && /^elapsed_ms=/{print $2; exit}' FS='=' "$SPOT")
          mixed_elapsed=$(awk '/\[spotcheck\] mixed/{flag=1; next} flag && /^elapsed_ms=/{print $2; exit}' FS='=' "$SPOT")

          echo "spotcheck.classic_elapsed_ms=${classic_elapsed}"
          echo "spotcheck.mixed_elapsed_ms=${mixed_elapsed}"

          if [ -z "${classic_elapsed}" ] || [ -z "${mixed_elapsed}" ]; then
            echo "failed to parse spotcheck elapsed_ms" >&2
            exit 3
          fi

          if [ "${classic_elapsed}" -gt "${CLASSIC_HARD_MS}" ]; then
            echo "classic spotcheck regression: ${classic_elapsed}ms > ${CLASSIC_HARD_MS}ms" >&2
            exit 4
          fi

          if [ "${mixed_elapsed}" -gt "${MIXED_HARD_MS}" ]; then
            echo "mixed spotcheck regression: ${mixed_elapsed}ms > ${MIXED_HARD_MS}ms" >&2
            exit 5
          fi

      - name: Run bench matrix
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          TXS=5000 ./scripts/run_bench_matrix.sh

      - name: Run mixed workload matrix
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          TXS=5000 ./scripts/run_bench_mixed_matrix.sh

      - name: Run executor strategy experiment (mixed, non-gate)
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          TXS=10000 KEYS=2000 READ_FANOUT=4 WRITE_EVERY=2 ./scripts/run_executor_strategy_experiment.sh

      - name: Run executor strategy experiment (hotspot, non-gate)
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          TXS=10000 KEYS=256 READ_FANOUT=4 WRITE_EVERY=1 ./scripts/run_executor_hotspot_experiment.sh

      - name: Run aggressive-vs-original regression matrix
        id: regression_matrix
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          TXS=${REGRESSION_MATRIX_TXS:-10000} ./scripts/run_bench_regression_matrix.sh
          regression_csv=$(ls -1t run/bench/bench-regression-matrix-*.csv 2>/dev/null | head -n 1 || true)
          echo "regression_csv=${regression_csv}" >> "$GITHUB_OUTPUT"

      - name: Build aggressive profiling summary
        if: always()
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium

          ./scripts/summarize_aggressive_profile.py
          latest_summary=$(ls -1t run/bench/aggressive-profile-summary-*.md | head -n 1)
          echo "aggressive_profile_summary=${latest_summary}"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "${latest_summary}" ]; then
            cat "${latest_summary}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Check aggressive regression ratio (hard gate)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          MODE=${AGGRESSIVE_REGRESSION_MODE:-hard} \
          AGGRESSIVE_MAX_RATIO_CLASSIC=${AGGRESSIVE_MAX_RATIO_CLASSIC:-2.20} \
          AGGRESSIVE_MAX_RATIO_MIXED=${AGGRESSIVE_MAX_RATIO_MIXED:-2.00} \
          AGGRESSIVE_MAX_RATIO_HOT_STREAK=${AGGRESSIVE_MAX_RATIO_HOT_STREAK:-2.10} \
          ./scripts/check_aggressive_regression.sh

      - name: Run auto-adaptive threshold sweep (non-gate)
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          TXS=5000 KEYS=1000 READ_FANOUT=4 WRITE_EVERY=2 ./scripts/run_auto_adaptive_threshold_sweep.sh

      - name: Build executor profiling summary
        run: |
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          ./scripts/executor_profile_report.py

      - name: Enforce CI thresholds (warning + hard fail)
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium

          # stage2 observation window enabled
          THRESHOLD_PROFILE=${THRESHOLD_PROFILE:-stage2} ./scripts/enforce_ci_thresholds.sh

      - name: Auto-adaptive threshold suggestion (non-gate)
        if: always()
        id: auto_adaptive_suggestion
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium

          ./scripts/suggest_auto_adaptive_thresholds.py
          suggestion_file=$(ls -1t run/health/auto-adaptive-threshold-suggestion-*.txt 2>/dev/null | head -n 1 || true)
          echo "suggestion_file=${suggestion_file}" >> "$GITHUB_OUTPUT"

      - name: Nightly auto-attribution labels (always)
        if: always()
        id: nightly_attribution
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium

          attribution_file="run/health/nightly-attribution-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          NIGHTLY_ATTRIBUTION_OUT="$attribution_file" \
          THRESHOLD_PROFILE=${THRESHOLD_PROFILE:-stage2} ./scripts/nightly_attribution.sh
          echo "attribution_file=${attribution_file}" >> "$GITHUB_OUTPUT"

      - name: Render nightly summary (non-gate)
        if: always()
        id: render_nightly_summary
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium

          summary_out="run/health/nightly-summary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          NIGHTLY_SUMMARY_OUT="${summary_out}" \
          NIGHTLY_ATTRIBUTION_FILE="${{ steps.nightly_attribution.outputs.attribution_file }}" \
          AUTO_ADAPTIVE_SUGGESTION_FILE="${{ steps.auto_adaptive_suggestion.outputs.suggestion_file }}" \
          BENCH_REGRESSION_CSV="${{ steps.regression_matrix.outputs.regression_csv }}" \
          ./scripts/render_nightly_summary.py
          echo "summary_file=${summary_out}" >> "$GITHUB_OUTPUT"

      - name: Append nightly summary to GitHub Step Summary
        if: always()
        run: |
          set -euo pipefail
          cd trillionnium

          summary_file="${{ steps.render_nightly_summary.outputs.summary_file }}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "${summary_file}" ]; then
            {
              echo "## Nightly Health (Rendered)"
              echo
              cat "${summary_file}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: PR-5 treasury reconcile report (non-gate)
        if: always()
        id: pr5_reconcile_report
        continue-on-error: true
        run: |
          set -euo pipefail
          ./scripts/v2/pr5_treasury_reconcile_report.sh

      - name: PR-7 TopN anomaly summary gate
        if: always()
        run: |
          set -euo pipefail
          ./scripts/v2/pr7_topn_summary_gate.sh

      - name: Build PR-6 daily security summary (non-gate)
        if: always()
        id: pr6_daily_security_summary
        continue-on-error: true
        run: |
          set -euo pipefail
          NIGHTLY_ATTRIBUTION_FILE="${{ steps.nightly_attribution.outputs.attribution_file }}" \
          NIGHTLY_SUMMARY_FILE="${{ steps.render_nightly_summary.outputs.summary_file }}" \
          AUTO_ADAPTIVE_SUGGESTION_FILE="${{ steps.auto_adaptive_suggestion.outputs.suggestion_file }}" \
          python3 ./scripts/v2/pr6_daily_security_summary.py

      - name: Build PR-9 weekly alert governance (non-gate)
        if: always()
        id: pr9_weekly_alert_governance
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 ./scripts/v2/pr9_weekly_alert_governance.py

      - name: PR-7 alert delivery gate (non-gate, observable)
        if: always()
        id: pr7_alert_delivery_gate
        continue-on-error: true
        run: |
          set -euo pipefail
          PR7_GATE_LOCK_DIR=run/pr7-alert-delivery/.nightly-gate-lock \
          PR7_GATE_LOCK_WAIT_SECONDS=120 \
          PR7_DELIVERY_FAIL_MODE=escalate DRY_RUN=1 ./scripts/v2/pr7_alert_delivery_gate.sh

      - name: Build P11 policy rollback guard (dry-run, observable)
        if: always()
        id: p11_policy_rollback_guard
        continue-on-error: true
        run: |
          set -euo pipefail
          p11_json="run/pr11/policy-rollback-guard.json"
          P11_ROLLBACK_GUARD_JSON_OUT="$p11_json" \
            ./scripts/v2/p11_policy_rollback_guard.sh
          python3 - "$p11_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("would_rollback") is True or payload.get("status") == "FAIL":
              raise SystemExit("P11 dry-run detected a rollback condition")
          PY

      - name: PR-7 delivery end-to-end replay gate (hard)
        if: always()
        run: |
          set -euo pipefail
          ./scripts/v2/pr7_delivery_e2e_gate.sh
          ./scripts/v2/pr7_global_retry_budget_storm_test.sh

      - name: Append PR-6 daily security summary to GitHub Step Summary
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          summary_file="run/pr6-ops/daily-security-summary.md"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "${summary_file}" ]; then
            {
              echo "## PR-6 Daily Security Ops"
              echo
              cat "${summary_file}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Append PR-9 weekly alert governance to GitHub Step Summary
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          summary_file="run/pr9/weekly-alert-governance.md"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "${summary_file}" ]; then
            {
              echo "## PR-9 Weekly Alert Governance"
              echo
              cat "${summary_file}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Append PR-7 alert delivery gate status to GitHub Step Summary
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          status_file=$(ls -1t run/pr7-alerts/*/pr7-delivery-status.env 2>/dev/null | head -n 1 || true)
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -n "${status_file}" ] && [ -f "${status_file}" ]; then
            {
              echo "## PR-7 Alert Delivery Gate Status"
              echo
              cat "${status_file}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Aggregate nightly critical soft-fail signals
        if: always()
        run: |
          set -euo pipefail

          OUT_DIR="trillionnium/run/health"
          mkdir -p "$OUT_DIR"
          OUT_FILE="$OUT_DIR/nightly-softfail-summary-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}.md"

          pr5_outcome="${{ steps.pr5_reconcile_report.outcome }}"
          pr6_outcome="${{ steps.pr6_daily_security_summary.outcome }}"
          pr9_outcome="${{ steps.pr9_weekly_alert_governance.outcome }}"
          p11_outcome="${{ steps.p11_policy_rollback_guard.outcome }}"
          pr7_outcome="${{ steps.pr7_alert_delivery_gate.outcome }}"

          critical_failed=0
          observe_failed=0

          if [[ "$pr6_outcome" != "success" ]]; then critical_failed=1; fi
          if [[ "$p11_outcome" != "success" ]]; then critical_failed=1; fi
          if [[ "$pr7_outcome" != "success" ]]; then critical_failed=1; fi
          if [[ "$pr5_outcome" != "success" ]]; then observe_failed=1; fi
          if [[ "$pr9_outcome" != "success" ]]; then observe_failed=1; fi

          {
            echo "# Nightly soft-fail summary"
            echo
            echo "| scope | step_id | class | outcome | signal |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| report | pr5_reconcile_report | observe | ${pr5_outcome} | $([[ "$pr5_outcome" == "success" ]] && echo clear || echo soft_fail_observe) |"
            echo "| security | pr6_daily_security_summary | critical | ${pr6_outcome} | $([[ "$pr6_outcome" == "success" ]] && echo clear || echo soft_fail_critical) |"
            echo "| report | pr9_weekly_alert_governance | observe | ${pr9_outcome} | $([[ "$pr9_outcome" == "success" ]] && echo clear || echo soft_fail_observe) |"
            echo "| delivery_guard | p11_policy_rollback_guard | critical | ${p11_outcome} | $([[ "$p11_outcome" == "success" ]] && echo clear || echo soft_fail_critical) |"
            echo "| delivery | pr7_alert_delivery_gate | critical | ${pr7_outcome} | $([[ "$pr7_outcome" == "success" ]] && echo clear || echo soft_fail_critical) |"
            echo
            echo "- critical_soft_fail_present: \`$([[ "$critical_failed" -eq 1 ]] && echo true || echo false)\`"
            echo "- observe_soft_fail_present: \`$([[ "$observe_failed" -eq 1 ]] && echo true || echo false)\`"
            echo "- gate_signal: \`$([[ "$critical_failed" -eq 1 ]] && echo nightly_critical_soft_fail || echo clear)\`"
            echo "- semantics: \`critical soft-fail no longer stays silently green; observe-only soft-fail remains non-blocking but visible in summary\`"
          } > "$OUT_FILE"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Nightly Soft-Fail Signals"
              echo
              cat "$OUT_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$critical_failed" -eq 1 ]]; then
            echo "critical nightly soft-fail detected (security/delivery/reporting-critical path); see $OUT_FILE" >&2
            exit 1
          fi

      - name: Upload nightly health artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-l1-nightly-health-${{ github.run_id }}
          path: |
            trillionnium/run/audit/**
            trillionnium/run/bench/**
            trillionnium/run/health/**
            trillionnium/run/node*.log
            trillionnium/run/parallel-sanity.log
            trillionnium/run/event-field-check.log
            trillionnium/run/event-replay-smoke.log
            trillionnium/run/parallel-sanity-flaky-*.log
            trillionnium/run/bft4-*.txt
            trillionnium/run/bft4-node*.log
            trillionnium/run/bft-restart-recovery-*.txt
            trillionnium/run/bft-restart-*.log
            trillionnium/run/consensus-wal-restart-*/**
            run/pr5-reconcile/**
            run/pr6-ops/**
            run/pr7-topn/**
            run/pr7-alerts/**
            run/pr7-alert-delivery/**
            run/pr9/**
            run/pr11/**
            data/reexec-smoke/**
            data/reexec-bundles/**
            data/worker-onboard/**
          if-no-files-found: warn
