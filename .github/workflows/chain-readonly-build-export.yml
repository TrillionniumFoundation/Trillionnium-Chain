name: chain-readonly-build-export
on:
  push:
    branches: [dev/chain-readonly-build-export-20261006]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 8ee6e5b399cd9f0e46d189b67a3ef2c40715a153
    steps:
      - name: Checkout exact public source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retain exact source objects and identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/source-export"
          git bundle create "$RUNNER_TEMP/source-export/source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/source-export/source.bundle"
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/source-export/source.txt"
          sha256sum "$RUNNER_TEMP/source-export/source.bundle" > "$RUNNER_TEMP/source-export/source.sha256"
      - name: Upload exact source transport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-source-8ee6e5b
          path: ${{ runner.temp }}/source-export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Fetch pinned public offline build inputs
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/offline-cargo"
          mkdir -p "$CARGO_HOME" "$RUNNER_TEMP/toolchain-export"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup run 1.95.0 rustc -Vv > "$RUNNER_TEMP/toolchain-export/rustc.txt"
          rustup run 1.95.0 cargo fetch --locked --manifest-path trillionnium/Cargo.toml
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          sysroot="$(rustup run 1.95.0 rustc --print sysroot)"
          tar -C "$sysroot" -czf "$RUNNER_TEMP/toolchain-export/rust-1.95.0-x64.tar.gz" .
          tar -C "$CARGO_HOME" -czf "$RUNNER_TEMP/toolchain-export/cargo-registry.tar.gz" registry
          sha256sum "$RUNNER_TEMP/toolchain-export/"*.tar.gz > "$RUNNER_TEMP/toolchain-export/archives.sha256"
      - name: Upload public offline build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chain-offline-toolchain-1.95.0
          path: ${{ runner.temp }}/toolchain-export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
