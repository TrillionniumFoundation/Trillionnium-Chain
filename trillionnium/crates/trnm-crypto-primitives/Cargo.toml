[package]
name = "trnm-crypto-primitives"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.trnm]
module = "M01"
role = "portable-component"
profile = "portable-local-v2"
production_activation = false
consensus_authority = false

[features]
# Explicit research verifier only. No caller obtains VerifiedWork or chainwork.
transparent-w1-admission-research = ["dep:borsh", "dep:risc0-binfmt", "dep:risc0-zkvm"]

[dependencies]
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
trnm-protocol = { version = "=0.1.0", path = "../trnm-protocol" }

ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
borsh = { version = "=1.8.0", default-features = false, features = ["std"], optional = true }
risc0-binfmt = { version = "=3.0.5", optional = true }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std", "disable-dev-mode"], optional = true }

[dev-dependencies]
serde_json = "1"
