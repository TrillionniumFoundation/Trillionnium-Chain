name: PQ PCP2 response exact-head native verification
on:
  push:
    branches:
      - fix/pq-cell-provider-reply-pcp2-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pq-reply:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Source and inventory preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "${GITHUB_SHA}" --output "${RUNNER_TEMP}/pq-reply-source.json"
          python3 scripts/refresh_distributed_source_inventory.py --check
      - name: Rust formatting
        run: cargo +1.95.0 fmt --manifest-path trillionnium/Cargo.toml --all -- --check
      - name: New PCP2 real ML-DSA positive/adversarial tests
        run: cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-data-availability --lib cell::discovery::pq_reply_v2::tests -- --test-threads=1
      - name: Existing PCP2 cryptographic controls
        run: cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-crypto-primitives --lib pq_cell_provider::tests -- --test-threads=1
      - name: Existing CDP1 development discovery controls
        run: cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-data-availability --lib cell::discovery::tests -- --test-threads=1
      - name: Strict two-package Clippy
        run: cargo +1.95.0 clippy --locked --manifest-path trillionnium/Cargo.toml -p trnm-data-availability -p trnm-crypto-primitives --all-targets -- -D warnings
      - name: Unmodified checkout
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1)"
