name: tmp-exec-vertical-retry

on:
  push:
    branches:
      - integration/native-poco-node-commit-exec-v1-20260902
    paths:
      - '.github/workflows/tmp-exec-vertical-retry.yml'

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Reuse exact-marker patch and retain serial audit oracle
        run: |
          PATCH_B64="$(sed -n 's/^          PATCH_B64: //p' .github/workflows/tmp-exec-vertical-patch.yml)"
          test -n "$PATCH_B64"
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch_exec.py
          python3 /tmp/patch_exec.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('trillionnium/crates/trnm-poco-mvcc-fee-v1/src/store.rs')
          text = path.read_text()
          old = 'execute_block_with_workers, state_root, validate_genesis, validate_worker_count_v1,'
          new = 'execute_block, execute_block_with_workers, state_root, validate_genesis, validate_worker_count_v1,'
          if text.count(old) != 1:
              raise SystemExit(f'expected one engine import marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/tmp-exec-vertical-patch.yml
          git rm .github/workflows/tmp-exec-vertical-retry.yml
          git diff --check
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
      - name: Prove persistent worker-count execution
        run: |
          cd trillionnium
          cargo fmt --all
          cargo test -p trnm-poco-mvcc-fee-v1 --all-targets
          cargo clippy -p trnm-poco-mvcc-fee-v1 --all-targets -- -D warnings
      - name: Publish tested product commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trillionnium/crates/trnm-poco-mvcc-fee-v1/src/engine.rs
          git add trillionnium/crates/trnm-poco-mvcc-fee-v1/src/store.rs
          git add trillionnium/crates/trnm-poco-mvcc-fee-v1/src/tests.rs
          git commit -am 'execution: persist real worker-count invariant MVCC path'
          git push origin HEAD:integration/native-poco-node-commit-exec-v1-20260902
