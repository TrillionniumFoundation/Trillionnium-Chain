[package]
name = "trnm-crypto-primitives"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.trnm]
module = "M01"
role = "portable-component"
profile = "portable-local-v2"
production_activation = false
consensus_authority = false

[features]
default = []
# Explicit development integration only; does not replace installed Ed25519
# owners, activate a PQ ledger profile or authorize account migration.
pq-native-openssl = ["dep:openssl"]

[dependencies]
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
trnm-protocol = { version = "=0.1.0", path = "../trnm-protocol" }
openssl = { version = "=0.10.81", optional = true }
zeroize = "=1.8.2"

[dev-dependencies]
