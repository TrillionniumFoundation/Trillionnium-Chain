name: stage-repository-cores-import-v0

on:
  push:
    branches:
      - work/integrate-repository-cores-v0-20260902
    paths:
      - .github/workflows/zz-stage-repository-cores-import-v0.yml

permissions:
  contents: write

concurrency:
  group: stage-repository-cores-import-v0-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: "1a181ba453f86055082859e12e3d0be9fc7b18f5"
  TARGET_BRANCH: work/integrate-repository-cores-v0-20260902

jobs:
  stage_import:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/integrate-repository-cores-v0-20260902' &&
      github.actor == 'Franksudoman' &&
      github.triggering_actor == github.actor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository-pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          channel="$(python3 - <<'PY'
          import tomllib
          with open('rust-toolchain.toml', 'rb') as handle:
              print(tomllib.load(handle)['toolchain']['channel'])
          PY
          )"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"

      - name: Import only reviewed repository core source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${SOURCE_COMMIT}"
          for path in \
            trillionnium/crates/trnm-node-boundary-v0 \
            trillionnium/crates/trnm-tx-lifecycle-v0 \
            trillionnium/crates/trnm-state-sync-v0 \
            trillionnium/crates/trnm-migration-v0 \
            trillionnium/crates/trnm-control-plane-v0 \
            trillionnium/crates/trnm-poco-node-production-v0 \
            trillionnium/crates/trnm-production-adapter-conformance-v0 \
            trillionnium/crates/trnm-release-bundle-v0 \
            trillionnium/crates/trnm-durable-file-adapters-v0
          do
            git checkout "${SOURCE_COMMIT}" -- "$path"
          done

          python3 - <<'PY'
          from pathlib import Path

          workspace = Path('trillionnium/Cargo.toml')
          text = workspace.read_text()
          anchor = '  "crates/trnm-runtime",\n]'
          members = [
              'crates/trnm-runtime',
              'crates/trnm-node-boundary-v0',
              'crates/trnm-tx-lifecycle-v0',
              'crates/trnm-state-sync-v0',
              'crates/trnm-migration-v0',
              'crates/trnm-control-plane-v0',
              'crates/trnm-poco-node-production-v0',
              'crates/trnm-production-adapter-conformance-v0',
              'crates/trnm-release-bundle-v0',
              'crates/trnm-durable-file-adapters-v0',
          ]
          additions = ''.join(f'  "{member}",\n' for member in members) + ']'
          if anchor not in text:
              raise SystemExit('workspace member anchor changed')
          workspace.write_text(text.replace(anchor, additions, 1))

          manifest = Path('trillionnium/crates/trnm-release-bundle-v0/Cargo.toml')
          text = manifest.read_text().replace('module = "M17"', 'module = "M15"', 1)
          manifest.write_text(text)

          manifest = Path('trillionnium/crates/trnm-durable-file-adapters-v0/Cargo.toml')
          text = manifest.read_text().replace('module = "M15"', 'module = "M08"', 1)
          text = text.replace('production_allowed = true', 'production_allowed = false', 1)
          if 'adapter_candidate = true' not in text:
              text = text.replace(
                  'production_allowed = false\n',
                  'production_allowed = false\nadapter_candidate = true\nproduction_activation = false\n',
                  1,
              )
          manifest.write_text(text)

          control = Path('trillionnium/crates/trnm-control-plane-v0/src/lib.rs')
          text = control.read_text()
          bad = 'fn forbidden_authority_is_explicitly rejected()'
          good = 'fn forbidden_authority_is_explicitly_rejected()'
          if bad not in text:
              raise SystemExit('control-plane typo anchor changed')
          control.write_text(text.replace(bad, good, 1))

          host_manifest = Path('trillionnium/crates/trnm-poco-node-host/Cargo.toml')
          text = host_manifest.read_text()
          dep = 'trnm-poco-node-production-v0 = { version = "0.1.0", path = "../trnm-poco-node-production-v0" }\n'
          if dep not in text:
              text = text.rstrip() + '\n' + dep
          host_manifest.write_text(text)

          host = Path('trillionnium/crates/trnm-poco-node-host/src/lib.rs')
          text = host.read_text()
          marker = 'use trnm_poco_node_io::{NodeIoRuntimeV0, REQUIRED_NODE_IO_SURFACES_V0};\n'
          lines = [
              marker.rstrip('\n'),
              '',
              '/// Compile-time binding to the reviewed pure repository-core composition.',
              '/// This does not open activation or instantiate domain state.',
              'pub const REPOSITORY_CORE_COMPOSITION_VERSION_V0: u16 =',
              '    trnm_poco_node_production_v0::PRODUCTION_COMPOSITION_VERSION_V0;',
              '',
          ]
          addition = '\n'.join(lines)
          if marker not in text:
              raise SystemExit('node host import anchor changed')
          host.write_text(text.replace(marker, addition, 1))
          PY

          cargo metadata --manifest-path trillionnium/Cargo.toml --format-version 1 --no-deps >/dev/null
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          rm .github/workflows/zz-stage-repository-cores-import-v0.yml

      - name: Commit exact import and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Franksudoman'
          git config user.email 'sunfocapital@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m '[repository-cores-import] feat(core): import reviewed blocker core sources'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
