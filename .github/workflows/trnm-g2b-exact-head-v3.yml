name: TRNM G2B exact-head v3 gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/trnm-g2b-exact-head-v3.yml"
      - "conformance/agent-market/**"
      - "docs/development/packages/TRNM_G2B_*"
      - "docs/evidence/g2b/**"
      - "docs/protocol/poco-ai-native-v1/agent-market/**"
      - "scripts/ci/check_agent_market_*"
      - "tools/agent-market-model/**"
      - "trillionnium/crates/trnm-poco-agent-market-v1/**"

permissions:
  contents: read

concurrency:
  group: trnm-g2b-exact-head-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: UTF-8
  PYTHONUTF8: "1"

jobs:
  exact-head:
    name: Exact-head Agent/Market candidate replay
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      ((github.actor == 'ProfAlexQI' && github.triggering_actor == 'ProfAlexQI') ||
       (github.actor == 'Tomasrgbsf' && github.triggering_actor == 'Tomasrgbsf') ||
       (github.actor == 'github-actions[bot]' && github.triggering_actor == 'github-actions[bot]' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.author_association == 'MEMBER'))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trillionnium-chain
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact package head
        working-directory: trillionnium-chain
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Replay G2B candidate
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_agent_market_replay_v2.sh
      - name: Verify truth boundaries
        working-directory: trillionnium-chain
        run: |
          bash ./scripts/ci/check_canonical_development_plan.sh
          bash ./scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          bash ./scripts/project-preflight.sh --audit
