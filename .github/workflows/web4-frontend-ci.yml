name: web4-frontend-ci

on:
  pull_request:
    paths:
      - 'web4-frontend/**'
      - '.github/workflows/web4-frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web4-frontend/**'
      - '.github/workflows/web4-frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web4-frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' ||
        ((github.actor == 'ProfAlexQI' ||
         github.actor == 'Franksudoman') &&
         github.triggering_actor == github.actor &&
         (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 45
    env:
      # Keep locale/time hashing deterministic for frontend snapshots/log assertions.
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Freeze numeric formatting/collation for locale-sensitive snapshot/log assertions.
      LC_NUMERIC: C
      LC_COLLATE: C
      PYTHONHASHSEED: '0'
      FORCE_COLOR: '0'
      # Disable npm update notifier network check to avoid nondeterministic stderr timing/noise.
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      CI: 'true'
      TRNM_CARGO_OFFLINE_POLICY: "not-applicable"
    defaults:
      run:
        working-directory: web4-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: web4-frontend/package-lock.json

      - name: Install deps
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: npm ci

      - name: Install pinned Playwright Chromium
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npx playwright install chromium

      - name: Run CI checks (enforce e2e)
        env:
          CI_RUN_E2E: '1'
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: npm run ci:check
