name: rust-l1-testnet-preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'trillionnium/**'
      - '.github/workflows/rust-l1-testnet-preflight.yml'

permissions:
  contents: read

concurrency:
  group: rust-l1-testnet-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: macos-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_NUMERIC: C
      LC_COLLATE: C
      LC_TIME: C
      LC_CTYPE: C
      LC_MESSAGES: C
      LC_MONETARY: C
      LC_MEASUREMENT: C
      LC_NAME: C
      LC_PAPER: C
      LC_ADDRESS: C
      LC_TELEPHONE: C
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "UTF-8"
      PYTHONUTF8: "1"
      CI: "true"
      SOURCE_DATE_EPOCH: "1704067200"
      RUST_TEST_THREADS: "1"
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run testnet preflight
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium
          ./scripts/testnet_preflight.sh

      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-l1-testnet-preflight-${{ github.run_id }}
          path: |
            trillionnium/run/preflight/**
            trillionnium/run/audit/**
            trillionnium/run/bench/**
            trillionnium/run/node*.log
            trillionnium/run/parallel-sanity.log
          if-no-files-found: warn
