name: trnm-source-inventory

on:
  workflow_dispatch:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
      - fix/chain-six-class-publish-20260911
    paths:
      - .github/workflows/trnm-source-inventory.yml

permissions:
  contents: read

env:
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  TRNM_EXPECTED_SOURCE_SHA: ${{ github.sha }}

jobs:
  exact-source-inventory:
    name: exact-source-inventory
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' || ((github.actor == 'ProfAlexQI' ||
      github.actor == 'Franksudoman' || github.actor == 'ProfHepta') &&
      github.triggering_actor == github.actor &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 15
    # One-use pinned public source-object upload, removed in the product tree.
    permissions:
      contents: write
    env:
      TRNM_CARGO_OFFLINE_POLICY: "not-applicable"
    steps:
      - name: Upload ten pinned public blobs before checkout
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/chain-six-class-publish-20260911'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise ValueError("authenticated redirect refused")
          sha = "04bece813ac11996f952460c7336de44e89b12ff"
          url = "https://api.github.com/repos/TrillionniumFoundation/Trillionnium-Chain/git/blobs/" + sha
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=45) as response:
                  if response.status != 200:
                      raise ValueError("source transport HTTP status")
                  raw = response.read(20001)
              if len(raw) > 20000:
                  raise ValueError("source transport response bound")
              value = json.loads(raw)
              if value.get("sha") != sha or value.get("encoding") != "base64":
                  raise ValueError("source transport metadata")
              data = base64.b64decode("".join(value["content"].split()), validate=True)
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if len(data) != 9544 or value.get("size") != len(data) or actual != sha:
                  raise ValueError("source transport identity")
              exec(compile(data, "pinned-public-blob-transport", "exec"), {"__name__": "__main__"})
          except Exception as exc:
              print("source transport failed: " + type(exc).__name__)
              raise SystemExit(1)
          PYCODE

      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and package tracked source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRNM_EXPECTED_SOURCE_SHA}"
          root="$RUNNER_TEMP/trnm-source-inventory"
          mkdir -p "$root"
          git rev-parse HEAD > "$root/HEAD"
          git rev-parse 'HEAD^{tree}' > "$root/TREE"
          git ls-files -z > "$root/tracked-files.nul"
          tar --null --files-from "$root/tracked-files.nul" \
            --sort=name --owner=0 --group=0 --numeric-owner \
            --create --gzip --file "$root/tracked-source.tar.gz"
          sha256sum "$root/tracked-source.tar.gz" > "$root/SHA256SUMS"
          printf '%s\n' 'artifact_schema=trnm-exact-source-inventory-v1' > "$root/METADATA.txt"
          printf 'source_commit=%s\n' "$(cat "$root/HEAD")" >> "$root/METADATA.txt"
          printf 'source_tree=%s\n' "$(cat "$root/TREE")" >> "$root/METADATA.txt"
          printf '%s\n' 'authority=read-only-audit-input' >> "$root/METADATA.txt"
          printf '%s\n' 'production_candidate=false' >> "$root/METADATA.txt"
          printf '%s\n' 'release_ready=false' >> "$root/METADATA.txt"
          printf '%s\n' 'activation_authority=false' >> "$root/METADATA.txt"
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload exact-source inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-source-inventory-${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: ${{ runner.temp }}/trnm-source-inventory
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

