name: PQ Hepta Handoff V2 focused native verification
on:
  push:
    branches:
      - fix/pq-hepta-handoff-mldsa-v2-20261030
      - fix/pq-hepta-context-postverify-20261030
    paths:
      - .github/workflows/pq-hepta-handoff-v2-focused.yml
      - trillionnium/crates/trnm-research-protocol/**
      - trillionnium/Cargo.lock
      - trillionnium/crates/trnm-pon-node/examples/support/distributed_source_inventory.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pq-hepta-handoff:
    name: real ML-DSA handoff (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      RUST_TEST_THREADS: "1"
    steps:
      - name: Check out exact pushed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Bind exact source and native project inventory
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1
          git rev-parse HEAD
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "${GITHUB_SHA}" --output "${RUNNER_TEMP}/pq-handoff-source.json"
          python3 scripts/refresh_distributed_source_inventory.py --check
      - name: Check exact source formatting
        run: cargo +1.95.0 fmt --manifest-path trillionnium/Cargo.toml --all -- --check
      - name: Run new real ML-DSA positive and adversarial cases
        run: cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-research-protocol --test pq_hepta_handoff_v2 -- --test-threads=1
      - name: Preserve legacy Ed25519 V1 conformance
        run: cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-research-protocol --test protocol_v1 -- --test-threads=1
      - name: Strict scoped Clippy
        run: cargo +1.95.0 clippy --locked --manifest-path trillionnium/Cargo.toml -p trnm-research-protocol --all-targets -- -D warnings
      - name: Verify source remained unchanged
        if: always()
        shell: bash
        run: |
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"
