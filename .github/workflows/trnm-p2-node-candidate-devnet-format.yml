name: trnm-p2-node-candidate-devnet-format

on:
  push:
    branches:
      - feature/chain-p2-node-candidate-devnet-cli-v1-20260831
    paths:
      - .github/workflows/trnm-p2-node-candidate-devnet-format.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trnm-p2-node-candidate-devnet-format-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: feature/chain-p2-node-candidate-devnet-cli-v1-20260831
  SOURCE_FLOOR: 70708ceeaf150b259ee896138d6c2dc3fbc7bfea

jobs:
  qualify-format:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-p2-node-candidate-devnet-cli-v1-20260831' &&
      (((github.actor == 'ProfAlexQI') && (github.triggering_actor == 'ProfAlexQI')) ||
       ((github.actor == 'Tomasrgbsf') && (github.triggering_actor == 'Tomasrgbsf')))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      candidate_commit: ${{ steps.bundle.outputs.candidate_commit }}
      candidate_tree: ${{ steps.bundle.outputs.candidate_tree }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out exact read-only source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify one-shot source boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${SOURCE_FLOOR}" HEAD
          unexpected="$(
            git diff --name-only "${SOURCE_FLOOR}..HEAD" |
              grep -Ev '^\.github/workflows/trnm-p2-node-candidate-devnet-format\.yml$' || true
          )"
          test -z "${unexpected}"
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 --component rustfmt

      - name: Apply pinned rustfmt only
        run: |
          set -euo pipefail
          rustup run 1.95.0 cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git rm .github/workflows/trnm-p2-node-candidate-devnet-format.yml
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            .github/workflows/trnm-p2-node-candidate-devnet-format.yml
            trillionnium/crates/trnm-poco-lab-validator/src/bin/trnm-poco-candidate-devnet-validator.rs
            trillionnium/crates/trnm-poco-lab-validator/src/candidate_devnet.rs
            trillionnium/crates/trnm-poco-lab-validator/tests/candidate_devnet_cli.rs
          )
          mapfile -t sorted_expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#sorted_expected[@]}"
          diff -u <(printf '%s\n' "${sorted_expected[@]}") <(printf '%s\n' "${changed[@]}")
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(node): format candidate devnet CLI'

      - name: Build qualified Git bundle
        id: bundle
        run: |
          set -euo pipefail
          candidate_commit="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          out="${RUNNER_TEMP}/candidate-format"
          mkdir -p "${out}"
          git update-ref refs/heads/trnm-candidate-format "${candidate_commit}"
          git bundle create "${out}/candidate.bundle" refs/heads/trnm-candidate-format
          git update-ref -d refs/heads/trnm-candidate-format
          sha256sum "${out}/candidate.bundle" > "${out}/candidate.bundle.sha256"
          printf '%s\n' "${GITHUB_SHA}" > "${out}/source-commit"
          printf '%s\n' "${candidate_commit}" > "${out}/candidate-commit"
          printf '%s\n' "${candidate_tree}" > "${out}/candidate-tree"
          echo "candidate_commit=${candidate_commit}" >> "${GITHUB_OUTPUT}"
          echo "candidate_tree=${candidate_tree}" >> "${GITHUB_OUTPUT}"

      - name: Upload qualified format bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trnm-p2-node-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-format/
          if-no-files-found: error
          retention-days: 3

  publish-format:
    needs: qualify-format
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact source without persisted credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact qualified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.qualify-format.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-format

      - name: Verify and publish only qualified tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_COMMIT: ${{ needs.qualify-format.outputs.candidate_commit }}
          EXPECTED_TREE: ${{ needs.qualify-format.outputs.candidate_tree }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/candidate-format"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(cat "${out}/source-commit")" = "${GITHUB_SHA}"
          test "$(cat "${out}/candidate-commit")" = "${EXPECTED_COMMIT}"
          test "$(cat "${out}/candidate-tree")" = "${EXPECTED_TREE}"
          sha256sum --check "${out}/candidate.bundle.sha256"
          git bundle verify "${out}/candidate.bundle"
          git fetch "${out}/candidate.bundle" \
            refs/heads/trnm-candidate-format:refs/remotes/qualified/candidate
          candidate="$(git rev-parse refs/remotes/qualified/candidate)"
          test "${candidate}" = "${EXPECTED_COMMIT}"
          test "$(git rev-parse "${candidate}^{tree}")" = "${EXPECTED_TREE}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "${candidate}"
          if git cat-file -e "${candidate}:.github/workflows/trnm-p2-node-candidate-devnet-format.yml" 2>/dev/null; then
            exit 3
          fi
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git push --atomic origin "${candidate}:refs/heads/${TARGET_BRANCH}"
