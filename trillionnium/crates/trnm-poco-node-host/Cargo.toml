[package]
name = "trnm-poco-node-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[package.metadata.trnm]
lane = "poco-node-host-composition-v0"
composition_only = true
domain_state_machine = false
storage_owner = false
network_owner = false
signing_authority = false
voting_authority = false
finality_authority = false
persistent_authority_composition_candidate = true
recovery_barrier_delegation = true
raw_stage_advance_exported = false
verified_stage_session_required = true
production_candidate = false
production_consensus_activation = false

[features]
default = []
persistent-authority-candidate = [
  "trnm-poco-node-authority/persistent-authority-candidate",
  "dep:trnm-consensus-crypto",
  "dep:trnm-consensus-signer-journal",
  "dep:trnm-consensus-safety-store",
  "dep:trnm-consensus-types",
  "dep:trnm-native-execution-v0",
]
candidate-networked-authority = [
  "persistent-authority-candidate",
  "trnm-poco-node-io/candidate-authenticated-p2p",
  "dep:trnm-durable-file-adapters-v0",
]

[dependencies]
trnm-consensus-safety-store = { version = "0.1.0", path = "../trnm-consensus-safety-store", optional = true }
trnm-consensus-crypto = { version = "0.1.0", path = "../trnm-consensus-crypto", optional = true }
trnm-consensus-signer-journal = { version = "0.1.0", path = "../trnm-consensus-signer-journal", optional = true }
trnm-consensus-types = { version = "0.1.0", path = "../trnm-consensus-types", optional = true }
trnm-native-execution-v0 = { version = "0.1.0", path = "../trnm-native-execution-v0", optional = true }
trnm-durable-file-adapters-v0 = { version = "0.1.0", path = "../trnm-durable-file-adapters-v0", optional = true, features = ["candidate-peer-replay"] }
trnm-node-boundary-v0 = { version = "0.1.0", path = "../trnm-node-boundary-v0" }
trnm-poco-node-authority = { version = "0.1.0", path = "../trnm-poco-node-authority" }
trnm-poco-node-io = { version = "0.1.0", path = "../trnm-poco-node-io" }
trnm-poco-node-production-v0 = { version = "0.1.0", path = "../trnm-poco-node-production-v0" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
