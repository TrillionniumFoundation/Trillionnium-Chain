agents:
- id: A00
  name: TRNM Control Tower
  gate: CONTROL
  package_id: AGENT_CONTROL_PLANE_V1
  priority: P0
  scope: orchestration/read-mostly
  depends_on: []
  recommended_trigger: every 2 hours, read-only by default; write only its own documentation branch
