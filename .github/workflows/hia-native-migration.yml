          rustc_bin="$(rustup which --toolchain "$toolchain" rustc)"
          cargo_bin="$(rustup which --toolchain "$toolchain" cargo)"
          test -x "$rustc_bin"
          test -x "$cargo_bin"
          rustc_dir="$(dirname "$rustc_bin")"
          test "$rustc_dir" = "$(dirname "$cargo_bin")"
          printf '%s\n' "$rustc_dir" >> "$GITHUB_PATH"
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$toolchain"
          export PATH="$rustc_dir:$PATH"
          test "$(command -v rustc)" = "$rustc_bin"
          test "$(command -v cargo)" = "$cargo_bin"
          rustc -Vv
          cargo -Vv
      - name: Run native hash Some CheckedApply and both exact delta boundaries
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/hia-node-commitment/prior-node/native/build"
          evidence="$RUNNER_TEMP/hia-node-commitment"
          python3 -B -m hia.platform.node_commitment.qualify_hash --build "$build" --output "$evidence/hash"
          python3 -B -m hia.platform.node_commitment.qualify_snapshot --group some --build "$build" --output "$evidence/some"
          python3 -B -m hia.platform.node_commitment.qualify_snapshot --group checked --build "$build" --output "$evidence/checked"
          for changes in 65536 65537; do
            python3 -B -m hia.platform.node_commitment.qualify_delta --build "$build" --changes "$changes" --sha-check "$evidence/hash/report.json" --method-check "$evidence/checked/report.json" --output "$evidence/delta$changes"
          done
      - name: Recompile and compare the unchanged original complete methods
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path trillionnium/Cargo.toml
          evidence="$RUNNER_TEMP/hia-node-commitment"
          python3 -B -m hia.platform.node_commitment.rust_oracle --build "$evidence/prior-node/native/build" --some "$evidence/some" --checked "$evidence/checked" --delta65536 "$evidence/delta65536" --delta65537 "$evidence/delta65537" --cargo-target "$RUNNER_TEMP/hia-node-commitment-cargo-target" --output "$evidence/original"
      - name: Verify complete source after success or failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-node-commitment/observations"
          python3 -B scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-node-commitment/observations/source-after.json"
      - name: Preserve complete original native bootstrap and failure bytes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hia-node-commitment"
          if test -d "$RUNNER_TEMP/hia-bootstrap"; then cp -a -- "$RUNNER_TEMP/hia-bootstrap" "$RUNNER_TEMP/hia-node-commitment/bootstrap"; fi
          python3 -B scripts/ci/prepare_artifact_upload.py --source "$RUNNER_TEMP/hia-node-commitment" --output "$RUNNER_TEMP/hia-node-commitment-upload"
      - name: Upload complete commitment observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-node-commitment-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt
            }}
          path: ${{ runner.temp }}/hia-node-commitment-upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
