name: PoCO external evidence pack linker (one-shot)

on:
  push:
    branches:
      - ops/poco-external-blocker-convergence-20260910-r2
    paths:
      - .github/workflows/poco-external-evidence-pack-linker-once-20260910.yml

permissions:
  contents: read
  issues: write
  pull-requests: write
  metadata: read

env:
  PRODUCT_BRANCH: chore/poco-only-purge-20260909
  EVIDENCE_BRANCH: evidence/poco-external-blocker-convergence-20260910-r2
  PR_NUMBER: "117"

jobs:
  link:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact operations branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/poco-external-blocker-convergence-20260910-r2
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pack and link canonical trackers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PRODUCT_BRANCH" "$EVIDENCE_BRANCH"
          product_commit=$(git rev-parse "origin/$PRODUCT_BRANCH")
          product_tree=$(git rev-parse "$product_commit^{tree}")
          git cat-file -e "origin/$EVIDENCE_BRANCH:evidence/external-orchestration/execution-pack-v1/manifest.json"
          pack_manifest=$(git show "origin/$EVIDENCE_BRANCH:evidence/external-orchestration/execution-pack-v1/manifest.json")
          PRODUCT_COMMIT="$product_commit" PRODUCT_TREE="$product_tree" PACK_MANIFEST="$pack_manifest" python3 - <<'PY'
          from __future__ import annotations
          import json, os, urllib.error, urllib.request

          repo=os.environ['GH_REPO']; token=os.environ['GH_TOKEN']
          branch=os.environ['EVIDENCE_BRANCH']; pr=int(os.environ['PR_NUMBER'])
          commit=os.environ['PRODUCT_COMMIT']; tree=os.environ['PRODUCT_TREE']
          manifest=json.loads(os.environ['PACK_MANIFEST'])
          assert manifest['source_commit']==commit
          assert manifest['source_tree']==tree
          assert manifest['all_external_blockers_closed'] is False
          ids=tuple(manifest['blockers'])

          def req(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request('https://api.github.com'+path,data=data,method=method)
              for k,v in {
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'trnm-pack-linker-v1',
              }.items(): r.add_header(k,v)
              try:
                  with urllib.request.urlopen(r,timeout=60) as x:
                      b=x.read(); return x.status,json.loads(b) if b else None
              except urllib.error.HTTPError as e:
                  b=e.read().decode(errors='replace')
                  try:b=json.loads(b)
                  except:b={'message':b}
                  return e.code,b

          issues=[]
          for page in range(1,6):
              status,body=req('GET',f'/repos/{repo}/issues?state=open&per_page=100&page={page}')
              if status!=200: raise SystemExit(f'issue inventory failed: {status} {body}')
              issues.extend(body)
              if len(body)<100: break

          pack_url=f'https://github.com/{repo}/tree/{branch}/evidence/external-orchestration/execution-pack-v1'
          linked=[]
          for bid in ids:
              matches=sorted([
                  i for i in issues
                  if 'pull_request' not in i
                  and bid in ((i.get('title') or '')+'\n'+(i.get('body') or ''))
              ],key=lambda i:i['number'])
              if not matches:
                  linked.append({'blocker':bid,'status':'tracker-missing'})
                  continue
              issue=matches[0]
              marker=f'<!-- trnm-external-pack-v1:{commit}:{bid} -->'
              status,comments=req('GET',f'/repos/{repo}/issues/{issue["number"]}/comments?per_page=100')
              exists=status==200 and any(marker in (c.get('body') or '') for c in comments)
              if exists:
                  linked.append({'blocker':bid,'issue':issue['number'],'status':'already-linked'})
                  continue
              body=(f'{marker}\nExecution pack v1 for `{bid}` is bound to product commit `{commit}` and tree `{tree}`:\n\n'
                    f'{pack_url}\n\nThe pack defines artifact requirements, frozen wall-clock minima and structural validation. '
                    'It does not authenticate signatures, establish identity independence or close the blocker.')
              st,_=req('POST',f'/repos/{repo}/issues/{issue["number"]}/comments',{'body':body})
              linked.append({'blocker':bid,'issue':issue['number'],'status':st})

          summary_marker=f'<!-- trnm-external-pack-v1-summary:{commit} -->'
          status,comments=req('GET',f'/repos/{repo}/issues/{pr}/comments?per_page=100')
          if not (status==200 and any(summary_marker in (c.get('body') or '') for c in comments)):
              body=(f'{summary_marker}\n### Source-bound external evidence execution pack\n\n'
                    f'Product source: `{commit}` / tree `{tree}`.\n\nExecution pack: {pack_url}\n\n'
                    'All six external blockers remain OPEN. Pack publication and tracker linkage are orchestration only; '
                    'release flags remain fail-closed until independent authenticated evidence is accepted.')
              req('POST',f'/repos/{repo}/issues/{pr}/comments',{'body':body})
          print(json.dumps({'source_commit':commit,'source_tree':tree,'linked':linked,'all_external_blockers_closed':False},sort_keys=True))
          PY
