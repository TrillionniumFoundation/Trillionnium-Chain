syntax = "proto3";
package chain.workload;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "chain/x/workload/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "chain/x/workload/Params";
  option (gogoproto.equal) = true;

  string workload_denom = 1;
}