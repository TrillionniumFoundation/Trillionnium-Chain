name: tmp-world-credential-boundary-probe

on:
  push:
    branches:
      - tmp/world-source-materializer-20260830

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_PAT_VALUE: ${{ secrets.GH_PAT }}
      GITHUB_PAT_VALUE: ${{ secrets.GITHUB_PAT }}
      TRNM_GITHUB_TOKEN_VALUE: ${{ secrets.TRNM_GITHUB_TOKEN }}
      TRNM_GITHUB_PAT_VALUE: ${{ secrets.TRNM_GITHUB_PAT }}
      TRILLIONNIUM_GITHUB_TOKEN_VALUE: ${{ secrets.TRILLIONNIUM_GITHUB_TOKEN }}
      CROSS_REPO_TOKEN_VALUE: ${{ secrets.CROSS_REPO_TOKEN }}
      CROSS_REPO_PAT_VALUE: ${{ secrets.CROSS_REPO_PAT }}
      ORG_GITHUB_TOKEN_VALUE: ${{ secrets.ORG_GITHUB_TOKEN }}
      BOT_TOKEN_VALUE: ${{ secrets.BOT_TOKEN }}
      RELEASE_TOKEN_VALUE: ${{ secrets.RELEASE_TOKEN }}
      CI_GITHUB_TOKEN_VALUE: ${{ secrets.CI_GITHUB_TOKEN }}
      PERSONAL_ACCESS_TOKEN_VALUE: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      PAT_VALUE: ${{ secrets.PAT }}
      APP_ID_VALUE: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY_VALUE: ${{ secrets.APP_PRIVATE_KEY }}
      GH_APP_ID_VALUE: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY_VALUE: ${{ secrets.GH_APP_PRIVATE_KEY }}
      TRNM_GITHUB_APP_ID_VALUE: ${{ secrets.TRNM_GITHUB_APP_ID }}
      TRNM_GITHUB_APP_PRIVATE_KEY_VALUE: ${{ secrets.TRNM_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            GH_PAT GITHUB_PAT TRNM_GITHUB_TOKEN TRNM_GITHUB_PAT \
            TRILLIONNIUM_GITHUB_TOKEN CROSS_REPO_TOKEN CROSS_REPO_PAT \
            ORG_GITHUB_TOKEN BOT_TOKEN RELEASE_TOKEN CI_GITHUB_TOKEN \
            PERSONAL_ACCESS_TOKEN PAT APP_ID APP_PRIVATE_KEY GH_APP_ID \
            GH_APP_PRIVATE_KEY TRNM_GITHUB_APP_ID TRNM_GITHUB_APP_PRIVATE_KEY
          do
            variable="${name}_VALUE"
            if test -n "${!variable:-}"; then
              printf '%s\n' "credential_name=${name} present=true"
            else
              printf '%s\n' "credential_name=${name} present=false"
            fi
          done
          printf '%s\n' 'secret_values_printed=false' 'release_credit=none'
