[workspace]
exclude = [
  "fuzz",
  "crates/trnm-consensus-app",
  "crates/trnm-node",
]
members = [
  "crates/trnm-consensus-core",
  "crates/trnm-consensus-safety-rules",
  "crates/trnm-consensus-safety-store",
  "crates/trnm-consensus-signer-journal",
  "crates/trnm-consensus-remote-signer-protocol",
  "crates/trnm-consensus-unix-remote-signer",
  "crates/trnm-consensus-unix-fleet-signer",
  "crates/trnm-consensus-external-watermark",
  "crates/trnm-consensus-peer-lease",
  "crates/trnm-consensus-external-node-checkpoint",
  "crates/trnm-consensus-remote-signer-service",
  "crates/trnm-whole-node-checkpoint-types",
  "crates/trnm-native-application",
  "crates/trnm-native-application-sqlite",
  "crates/trnm-native-execution-v0",
  "crates/trnm-core-restart-v0",
  "crates/trnm-poco-da-v1",
  "crates/trnm-poco-agent-market-v1",
  "crates/trnm-poco-verify-challenge-v1",
  "crates/trnm-poco-mvcc-fee-v1",
  "crates/trnm-poco-consumption-settlement-v1",
  "crates/trnm-poco-cross-plane-readback-v1",
  "crates/trnm-poco-global-execution-v1",
  "crates/trnm-poco-order-application-v1",
  "crates/trnm-poco-order-finality-verifier-v1",
  "crates/trnm-poco-order-state-v1",
  "crates/trnm-poco-order-types-v1",
  "crates/trnm-poco-lab-validator",
  "crates/trnm-poco-node",
  "crates/trnm-consensus-crypto",
  "crates/trnm-consensus-sim",
  "crates/trnm-consensus-types",
  "crates/trnm-types",
  "crates/trnm-state",
  "crates/trnm-pouw",
  "crates/trnm-executor",
  "crates/trnm-mempool",
  "crates/trnm-rpc",
  "crates/trnm-bench",
  "crates/trnm-worker-agent",
  "crates/trnm-cli",
  "crates/trnm-bridge-poc",
  "crates/trnm-oracle",
  "crates/trnm-research-protocol",
  "crates/trnm-finality-types",
  "crates/trnm-application-tx-builder-v0",
  "crates/trnm-finality-verifier",
  "crates/trnm-protocol",
  "crates/trnm-runtime",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Trillionnium Contributors"]

[workspace.metadata.trnm]
lane = "chain-protocol"
consensus_target = "poco-bft-v0"
production_consensus_activation = false
consensus_mainline = "native-poco-bft"
native_poco_mainline_decision = "adopted"
zero_comet_production_dependency_target = true
zero_comet_production_dependency_achieved = true
legacy_comet_migration_residue_present = true
cometbft_role = "migration-residue-only"
cometbft_cleanup_eligible = false
