name: TRNM G2C exact-head v3 gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/trnm-g2c-exact-head-v3.yml"
      - "conformance/verification/**"
      - "docs/development/packages/TRNM_G2C_*"
      - "docs/evidence/g2c/**"
      - "docs/evidence/g2d/G2D_AGENT_HANDOFF_V2.json"
      - "docs/protocol/poco-ai-native-v1/verification/**"
      - "scripts/ci/check_g2c_*"
      - "tools/verification-model/**"
      - "trillionnium/crates/trnm-poco-verify-challenge-v1/**"

permissions:
  contents: read

concurrency:
  group: trnm-g2c-exact-head-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: UTF-8
  PYTHONUTF8: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
  TRNM_CARGO_OFFLINE_POLICY: required

jobs:
  exact-head:
    name: Exact-head profile, challenge and outbox replay
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      ((github.actor == 'ProfAlexQI' && github.triggering_actor == 'ProfAlexQI') ||
       (github.actor == 'Tomasrgbsf' && github.triggering_actor == 'Tomasrgbsf') ||
       (github.actor == 'github-actions[bot]' && github.triggering_actor == 'github-actions[bot]' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.author_association == 'MEMBER'))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trillionnium-chain
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact package head
        working-directory: trillionnium-chain
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Verify Rust toolchain
        working-directory: trillionnium-chain
        run: ./scripts/ci/check_preprovisioned_rust_toolchain.sh --toolchain 1.95.0 --component clippy --component rustfmt
      - name: Verify Cargo offline cache
        id: cargo_offline_ready
        working-directory: trillionnium-chain
        run: ./scripts/ci/check_cargo_offline_ready.sh --toolchain 1.95.0 --state "$RUNNER_TEMP/trnm-g2c-v3-${GITHUB_JOB}" trillionnium/Cargo.toml:trillionnium/Cargo.lock
      - name: Replay G2C candidate
        working-directory: trillionnium-chain
        run: bash ./scripts/ci/check_g2c_replay_v2.sh
      - name: Verify truth boundaries
        working-directory: trillionnium-chain
        run: |
          bash ./scripts/ci/check_canonical_development_plan.sh
          bash ./scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          bash ./scripts/project-preflight.sh --audit
      - name: Verify offline inputs unchanged
        if: always() && steps.cargo_offline_ready.outcome == 'success'
        working-directory: trillionnium-chain
        run: ./scripts/ci/check_cargo_offline_unchanged.sh --state "$RUNNER_TEMP/trnm-g2c-v3-${GITHUB_JOB}"
