name: trnm-source-inventory

on:
  workflow_dispatch:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/trnm-source-inventory.yml

permissions:
  contents: read

env:
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  TRNM_EXPECTED_SOURCE_SHA: ${{ github.sha }}

jobs:
  exact-source-inventory:
    name: exact-source-inventory
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' || ((github.actor == 'ProfAlexQI' ||
      github.actor == 'Franksudoman' || github.actor == 'ProfHepta') &&
      github.triggering_actor == github.actor &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 15
    env:
      TRNM_CARGO_OFFLINE_POLICY: "not-applicable"
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and package tracked source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRNM_EXPECTED_SOURCE_SHA}"
          root="$RUNNER_TEMP/trnm-source-inventory"
          mkdir -p "$root"
          git rev-parse HEAD > "$root/HEAD"
          git rev-parse 'HEAD^{tree}' > "$root/TREE"
          git ls-files -z > "$root/tracked-files.nul"
          tar --null --files-from "$root/tracked-files.nul" \
            --sort=name --owner=0 --group=0 --numeric-owner \
            --create --gzip --file "$root/tracked-source.tar.gz"
          sha256sum "$root/tracked-source.tar.gz" > "$root/SHA256SUMS"
          printf '%s\n' 'artifact_schema=trnm-exact-source-inventory-v1' > "$root/METADATA.txt"
          printf 'source_commit=%s\n' "$(cat "$root/HEAD")" >> "$root/METADATA.txt"
          printf 'source_tree=%s\n' "$(cat "$root/TREE")" >> "$root/METADATA.txt"
          printf '%s\n' 'authority=read-only-audit-input' >> "$root/METADATA.txt"
          printf '%s\n' 'production_candidate=false' >> "$root/METADATA.txt"
          printf '%s\n' 'release_ready=false' >> "$root/METADATA.txt"
          printf '%s\n' 'activation_authority=false' >> "$root/METADATA.txt"
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload exact-source inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-source-inventory-${{ env.TRNM_EXPECTED_SOURCE_SHA }}
          path: ${{ runner.temp }}/trnm-source-inventory
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

# Exact-source audit refresh requested on 2026-09-02; no promotion authority.
