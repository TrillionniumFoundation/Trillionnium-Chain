[package]
name = "trnm-w1-zk-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["client", "disable-dev-mode"] }
trnm-w1-zk-methods = { path = "../methods" }
trnm-w1-zk-relation = { path = "../relation" }
