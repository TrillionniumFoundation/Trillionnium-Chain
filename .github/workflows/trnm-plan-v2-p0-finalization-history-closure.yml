          }

          fn table_sql_v0(
              connection: &Connection,
              name: &str,
          ) -> ValidationStoreResultV0<Option<String>> {
              connection
                  .query_row(
                      "SELECT sql FROM sqlite_schema WHERE type = 'table' AND name = ?1",
                      params![name],
                      |row| row.get::<_, String>(0),
                  )
                  .optional()
                  .map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "finalization_history.schema_read",
                      )
                  })
          }

          fn normalize_sql_v0(value: &str) -> String {
              value.split_whitespace().collect::<Vec<_>>().join(" ")
          }

          fn validate_connection_contract_v0(
              connection: &Connection,
          ) -> ValidationStoreResultV0<()> {
              validate_pragmas_v0(connection)?;
              validate_closed_world_schema_v0(connection)
          }

          fn validate_pragmas_v0(connection: &Connection) -> ValidationStoreResultV0<()> {
              let read_i64 = |sql: &str, context: &'static str| {
                  connection
                      .query_row(sql, [], |row| row.get::<_, i64>(0))
                      .map_err(|_| error(ValidationStoreErrorCodeV0::Storage, context))
              };
              if read_i64("PRAGMA foreign_keys", "finalization_history.pragma_foreign_keys")? != 1
                  || read_i64(
                      "PRAGMA trusted_schema",
                      "finalization_history.pragma_trusted_schema",
                  )? != 0
                  || read_i64("PRAGMA synchronous", "finalization_history.pragma_synchronous")?
                      != 2
                  || read_i64("PRAGMA temp_store", "finalization_history.pragma_temp_store")? != 2
                  || read_i64(
                      "PRAGMA wal_autocheckpoint",
                      "finalization_history.pragma_wal_autocheckpoint",
                  )? != 0
              {
                  return Err(error(
                      ValidationStoreErrorCodeV0::CorruptStore,
                      "finalization_history.pragma_profile",
                  ));
              }
              let journal_mode = connection
                  .query_row("PRAGMA journal_mode", [], |row| row.get::<_, String>(0))
                  .map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "finalization_history.pragma_journal_mode",
                      )
                  })?;
              if !journal_mode.eq_ignore_ascii_case("wal") {
                  return Err(error(
                      ValidationStoreErrorCodeV0::CorruptStore,
                      "finalization_history.pragma_journal_mode",
                  ));
              }
              Ok(())
          }

          fn validate_closed_world_schema_v0(
              connection: &Connection,
          ) -> ValidationStoreResultV0<()> {
              let mut statement = connection
                  .prepare(
                      "SELECT type,name,tbl_name,sql FROM sqlite_schema WHERE name NOT LIKE 'sqlite_autoindex_%' ORDER BY type,name",
                  )
                  .map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "finalization_history.closed_schema_prepare",
                      )
                  })?;
              let rows = statement
                  .query_map([], |row| {
                      Ok((
                          row.get::<_, String>(0)?,
                          row.get::<_, String>(1)?,
                          row.get::<_, String>(2)?,
                          row.get::<_, Option<String>>(3)?,
                      ))
                  })
                  .map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "finalization_history.closed_schema_query",
                      )
                  })?;
              let mut objects = Vec::new();
              for row in rows {
                  objects.push(row.map_err(|_| {
                      error(
                          ValidationStoreErrorCodeV0::Storage,
                          "finalization_history.closed_schema_row",
                      )
                  })?);
              }
              if objects.len() != 2 {
                  return Err(error(
                      ValidationStoreErrorCodeV0::CorruptStore,
                      "finalization_history.closed_schema_count",
                  ));
              }
              let expected = [
                  (
                      "table",
                      "finalization_history_metadata_v0",
                      "finalization_history_metadata_v0",
                      METADATA_SCHEMA_V0,
                  ),
                  (
                      "table",
                      "finalization_history_records_v0",
                      "finalization_history_records_v0",
                      RECORD_SCHEMA_V0,
                  ),
              ];
              for (object_type, name, table_name, sql) in expected {
                  let Some(object) = objects.iter().find(|object| object.1 == name) else {
                      return Err(error(
                          ValidationStoreErrorCodeV0::CorruptStore,
                          "finalization_history.closed_schema_missing",
                      ));
                  };
                  if object.0 != object_type
                      || object.2 != table_name
                      || object
                          .3
                          .as_ref()
                          .is_none_or(|actual| normalize_sql_v0(actual) != normalize_sql_v0(sql))
