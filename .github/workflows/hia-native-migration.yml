          persist-credentials: false
      - name: Checkout the pinned HIA compiler source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: hia-toolchain
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            hepta
            tools
            examples
            docs
            tests
            formal
      - name: Bind exact source and finite migration scope
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-resource-observations/source.json"
          bash scripts/project-preflight.sh --audit
          python3 hia/tools/check_migration.py
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA compiler identity differs from the pinned native compiler')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Reject incomplete and altered resource source bindings
        run: |
          set -euo pipefail
          python3 -B -m unittest hia.platform.host_resource.test_integrity -v 2>&1 | tee "$RUNNER_TEMP/hia-resource-observations/integrity.log"
      - name: Execute every native resource control and capture one exact corpus
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.host_resource.rust_oracle --native-only --repository "$GITHUB_WORKSPACE/chain" --output "$RUNNER_TEMP/hia-native-host-resource" 2>&1 | tee "$RUNNER_TEMP/hia-resource-observations/native.log"
          python3 -B - "$RUNNER_TEMP/hia-native-host-resource/native/native-comparison.json" <<'PY_RESOURCE_TRACE'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if (report['status'] != 'NATIVE_PASS_ORIGINAL_NOT_RUN'
                  or report['native_trace']['status'] != 'PASS'
                  or len(report['cases']) != 172
                  or len(report['native_physical_observations']) != 172
                  or len(report['native_protocol_controls']) != 11
                  or sum(len(row['comparison']) for row in report['cases']) != 180):
              raise SystemExit('Complete native resource controls and actual independent trace are mandatory')
          PY_RESOURCE_TRACE
      - name: Compare that exact native corpus with actual original Host Rust
        run: |
          set -euo pipefail
          python3 -B -m hia.platform.host_resource.rust_oracle --repository "$GITHUB_WORKSPACE/chain" --bundle "$RUNNER_TEMP/hia-native-host-resource/native" --output "$RUNNER_TEMP/hia-native-host-resource-original" --target-dir "$RUNNER_TEMP/host-resource-original-rust" 2>&1 | tee "$RUNNER_TEMP/hia-resource-observations/original.log"
          python3 -B - "$RUNNER_TEMP/hia-native-host-resource-original/original/report.json" <<'PY_RESOURCE_ORIGINAL'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if (report['status'] != 'PASS' or report['controls'] != 172
                  or report['operations'] != 180 or report['failed'] != 0
                  or report['original_sample_counters_cases'] != 148):
              raise SystemExit('The complete actual original resource comparison is required')
          PY_RESOURCE_ORIGINAL
      - name: Verify complete committed source again after success or failure
        if: always()
        run: python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA" --output "$RUNNER_TEMP/hia-resource-observations/source-after.json"
      - name: Package all resource evidence without descending into physical fixtures
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY_RESOURCE_ARTIFACT'
          import hashlib, json, os, sys, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          output = root / 'hia-resource-artifact'
          output.mkdir(mode=0o700)
          record = {'schema': 'trnm.hia.host-resource.ci-evidence-package.v1',
              'source': os.environ.get('TRNM_EXPECTED_SOURCE_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'), 'attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'job': os.environ.get('GITHUB_JOB'), 'qualification_status_not_changed_by_packaging': True,
              'excluded': ['physical fixture namespaces', 'original isolated-source', 'Cargo target'],
              'files': {}, 'error': None}
          def identity(path):
              size, digest = 0, hashlib.sha256()
              with path.open('rb') as stream:
                  while block := stream.read(1 << 20):
                      size += len(block)
                      digest.update(block)
              return {'bytes': size, 'sha256': digest.hexdigest()}
          def add_file(stream, path, name):
              if not path.exists() and not path.is_symlink():
                  return
              if path.is_symlink() or not path.is_file():
                  raise ValueError('Evidence is not a regular file: ' + str(path))
              before = identity(path)
              stream.add(path, arcname=name, recursive=False)
              if identity(path) != before:
                  raise ValueError('Evidence changed during packaging: ' + str(path))
              record['files'][name] = before
          def regular_tree(stream, path, name):
              if not path.exists():
                  return
              if path.is_symlink() or not path.is_dir():
                  raise ValueError('Evidence root is not a directory: ' + str(path))
              for current in sorted(path.rglob('*')):
                  if current.is_symlink():
                      raise ValueError('Aliased evidence: ' + str(current))
                  if current.is_dir():
                      continue
                  add_file(stream, current, name + '/' + current.relative_to(path).as_posix())
          try:
              archive = output / 'complete-evidence.tar.xz'
              with tarfile.open(archive, 'x:xz', preset=1, dereference=False) as stream:
                  regular_tree(stream, root / 'hia-resource-observations', 'observations')
                  add_file(stream, root / 'hia-bootstrap/bootstrap.json', 'bootstrap.json')
                  native = root / 'hia-native-host-resource/native'
                  physical = native / 'physical'
                  for name in ('native-comparison.json', 'corpus.jsonl'):
                      add_file(stream, native / name, 'native/' + name)
                  for name in ('report.json', 'cases.jsonl'):
                      add_file(stream, physical / name, 'native/physical/' + name)
                  regular_tree(stream, physical / 'build', 'native/physical/build')
                  for name in ('syscalls.log', 'stdout.raw', 'stderr.raw'):
                      add_file(stream, physical / 'trace' / name, 'native/physical/trace/' + name)
                  # Only the direct receipt names are read. Test namespaces can
                  # contain unreadable directories, FIFOs, sockets and symlinks.
                  for group in ('semantic', 'controls'):
                      cases = physical / group
                      if not cases.exists():
                          continue
                      for case in sorted(cases.iterdir()):
                          if case.is_symlink() or not case.is_dir():
                              raise ValueError('Unexpected physical case root: ' + str(case))
                          for name in ('stdin.raw', 'stdout.raw', 'stderr.raw', 'observation.json'):
                              add_file(stream, case / name, 'native/physical/' + group + '/' + case.name + '/' + name)
                  original = root / 'hia-native-host-resource-original/original'
                  for name in ('report.json', 'comparison.json', 'corpus.jsonl'):
                      add_file(stream, original / name, 'original/' + name)
                  for name in ('rustc-version', 'cargo-original-test-build', 'list-original-tests',
                               'retained-original-host-tests', 'actual-original-resource-corpus'):
                      regular_tree(stream, original / name, 'original/' + name)
              record['archive'] = dict(identity(archive), name=archive.name)
          finally:
              error = sys.exc_info()[1]
              if error is not None:
                  record['error'] = type(error).__name__ + ': ' + str(error)
              with (output / 'ci-provenance.json').open('x') as stream:
                  json.dump(record, stream, sort_keys=True, indent=2)
                  stream.write('\n')
          PY_RESOURCE_ARTIFACT
      - name: Retain actual resource native original and trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-host-resource-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hia-resource-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
