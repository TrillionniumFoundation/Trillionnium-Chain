name: Publish exact candidate runtime objects

on:
  push:
    branches: [diagnostic/section8-runtime-publish-4276975]
    paths: ['.github/workflows/section8-runtime-objects.yml', 'source-transfer/runtime-4276975/**']

permissions:
  contents: read

jobs:
  objects:
    if: github.repository == 'TrillionniumFoundation/Trillionnium-Chain'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Read fixed source-transfer data without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and verify exact objects without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          BASE = '60bca193a1d8d8eb9ffa43189d97855648e215ea'
          TREE = 'c52558be649bf4eb9977f1c5a132d5fcf9150ea2'
          COMMIT = '4276975c59b481ce9113ce5c9625a7ace88be61d'
          def git(*args, input=None):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args], input=input).decode().strip()
          assert git('rev-parse', BASE + '^{tree}') == '1f0442a730a45794e1b751deea7061261e99ad1f'
          parts = sorted(pathlib.Path('source-transfer/runtime-4276975').glob('part-*.b64'))
          assert [p.name for p in parts] == ['part-00.b64', 'part-01.b64']
          assert all(p.is_file() and not p.is_symlink() and p.stat().st_size <= 12001 for p in parts)
          encoded = ''.join(p.read_text('ascii').strip() for p in parts)
          assert len(encoded) == 17600
          packed = base64.b64decode(encoded, validate=True)
          assert len(packed) == 13200
          assert hashlib.sha256(packed).hexdigest() == '0e756e30f58cc910081bd2067cba764b1af606901151a4e0a5daf11a087be45f'
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch = decoder.decompress(packed, max_length=54290)
          assert decoder.eof and not decoder.unused_data and len(patch) == 54289
          assert hashlib.sha256(patch).hexdigest() == 'cea3b4fff153d4c26188dac9963fc4c72238b191b835d704547876481b8bcd83'
          git('checkout', '--detach', BASE)
          git('apply', '--index', '--check', '-', input=patch)
          git('apply', '--index', '-', input=patch)
          assert git('write-tree') == TREE
          protected = ['.github/workflows', 'docs/protocol', 'rust-toolchain.toml', 'trillionnium/Cargo.lock', 'config/consensus-mainline.json', 'config/build-closures-v1.toml', 'config/repository-policy-v1.json']
          assert not git('diff', '--cached', '--name-only', BASE, '--', *protected)
          assert len(git('diff', '--cached', '--name-only', BASE).splitlines()) == 12
          git('diff', '--cached', '--check')
          raw = base64.b64decode('', validate=True)
          assert raw.startswith(('tree ' + TREE + '\nparent ' + BASE + '\n').encode())
          assert git('hash-object', '-w', '-t', 'commit', '--stdin', input=raw) == COMMIT
          assert git('rev-parse', COMMIT + '^{tree}') == TREE
          assert git('rev-parse', COMMIT + '^') == BASE
          print('verified_candidate=' + COMMIT + '\nverified_tree=' + TREE)
          PY
      - name: Publish objects to the dedicated diagnostic reference only
        shell: bash
        env:
          OBJECT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, subprocess
          remote = 'https://github.com/TrillionniumFoundation/Trillionnium-Chain.git'
          ref = 'refs/heads/diagnostic/section8-runtime-objects-4276975'
          commit = '4276975c59b481ce9113ce5c9625a7ace88be61d'
          auth = base64.b64encode(('x-access-token:' + os.environ['OBJECT_TOKEN']).encode()).decode()
          command = ['git', '-c', 'core.hooksPath=/dev/null', '-c', 'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + auth]
          current = subprocess.check_output(command + ['ls-remote', '--refs', remote, ref], text=True).split()
          assert not current or current[0] == commit, 'Diagnostic reference moved; stop'
          subprocess.run(command + ['push', remote, commit + ':' + ref], check=True)
          actual = subprocess.check_output(command + ['ls-remote', '--refs', remote, ref], text=True).split()
          assert actual and actual[0] == commit
          print('published_objects=' + commit)
          PY
