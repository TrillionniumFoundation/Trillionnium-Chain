[workspace]

[package]
name = "trnm-w1-hardened-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
bincode = "1.3"
hex = "0.4"
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std", "disable-dev-mode"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = 1
incremental = false

