[package]
name = "trnm-research-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata.trnm]
lane = "research-evidence-only"
build_role = "evidence"
production_candidate = false
production_dependency = false
runtime_authority = false

[dependencies]
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
serde_json = "1"
