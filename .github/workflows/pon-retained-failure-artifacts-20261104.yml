name: Retained native failure evidence (read only)
on:
  push:
    branches:
      - fix/chain-retained-failure-readback-20261104
    paths:
      - .github/workflows/pon-retained-failure-artifacts-20261104.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: retained-failure-readback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify diagnostic source and original project boundary
        shell: bash
        run: |
          set -euo pipefail
          export READBACK_OUT="$RUNNER_TEMP/retained-failure-readback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$READBACK_OUT"
          echo "READBACK_OUT=$READBACK_OUT" >> "$GITHUB_ENV"
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$GITHUB_SHA" --output "$READBACK_OUT/source-before.json"
          bash scripts/project-preflight.sh --audit
      - name: Read eleven exact original artifacts without executing their contents
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.error, urllib.parse, urllib.request, uuid, zipfile
          from pathlib import Path, PurePosixPath
          
          REPO = "TrillionniumFoundation/Trillionnium-Chain"
          BRANCH = "fix/chain-retained-failure-readback-20261104"
          TARGETS = json.loads(r'''[{"id":13284469302,"name":"pq-system-ubuntu-24.04-head-362fbebe5027d731f16c88f710bfef7e922cd230-1","size":1053225,"digest":"sha256:a73afaa8fcf10d306f3b89095f8958f4b7caf32ee93c17d2bb967058708f090a","run":41746463373,"job":126300605830,"head":"362fbebe5027d731f16c88f710bfef7e922cd230"},{"id":13287122967,"name":"pon-fixed-host-root-f0-x64-head-f35ee6dc61feaba7c68b16e1f9384b5c3794a976-1","size":19665544,"digest":"sha256:41e30555cf4efa4662eba0c2d6ad7e8eac3ceadd1dd4101c1e42e45bbc1b6607","run":41752900351,"job":126322033940,"head":"f35ee6dc61feaba7c68b16e1f9384b5c3794a976"},{"id":13283953563,"name":"pon-native-campaign-x64-head-release-362fbebe5027d731f16c88f710bfef7e922cd230-1","size":60835230,"digest":"sha256:fc4693f5b3bee2c24b760b5dcac6cdd631e670687b0d8e44a2fe65643faf23c6","run":41746463223,"job":126300603089,"head":"362fbebe5027d731f16c88f710bfef7e922cd230"},{"id":13284616264,"name":"priority-ubuntu-24.04-arm-head-history-b4bdf142f513081715ecc8d1f9674291e85302cc-1","size":53187443,"digest":"sha256:e64496907fb666244ed2930bda9c342a06fa1ea6f26057942ae891ecbcd9d3af","run":41732369945,"job":126277462314,"head":"b4bdf142f513081715ecc8d1f9674291e85302cc"},{"id":13284611411,"name":"priority-ubuntu-24.04-arm-prospective-merge-history-b4bdf142f513081715ecc8d1f9674291e85302cc-1","size":52915730,"digest":"sha256:c6402ea1546e9bf7597f3fffec82da8080e90de740cfa7c880f183e8a88be23d","run":41732369945,"job":126277462527,"head":"b4bdf142f513081715ecc8d1f9674291e85302cc"},{"id":13286673364,"name":"pon-fixed-host-root-f0-x64-head-be0d5f978dc86008115524a6be85c38e03982b33-1","size":15946259,"digest":"sha256:90a1834ddc7a083fc9103285c6f42f9c00d421b8c6d6206139f9db3e7f4da042","run":41753071420,"job":126323929045,"head":"be0d5f978dc86008115524a6be85c38e03982b33"},{"id":13288600275,"name":"pon-native-campaign-x64-head-release-be0d5f978dc86008115524a6be85c38e03982b33-1","size":59518668,"digest":"sha256:06bd58d9fb7e10fea73e6f57f2e008295b6515e7be490532deea74711aa6d1be","run":41753071468,"job":126326178742,"head":"be0d5f978dc86008115524a6be85c38e03982b33"},{"id":13290599543,"name":"pon-native-campaign-x64-head-release-01627151f3ab50750eac2adeb46d8883a601265f-1","size":56503959,"digest":"sha256:7737b4114625c241425e9f35c3779515aa698ff10aa8c1af2805cda432cd5771","run":41760813065,"job":126349481887,"head":"01627151f3ab50750eac2adeb46d8883a601265f"},{"id":13291962180,"name":"pon-fixed-host-root-f0-x64-head-01627151f3ab50750eac2adeb46d8883a601265f-1","size":15793484,"digest":"sha256:c9416f8df9b478c2168790ab24d2c1ca9690b58490f77b4ebb01df0af203751a","run":41760812979,"job":126353223160,"head":"01627151f3ab50750eac2adeb46d8883a601265f"},{"id":13293036116,"name":"w1-fresh-service-prospective-merge-554a76fb8e21f160806692c753ca3ea6ad53a42f-1","size":5292126,"digest":"sha256:57fcc90f2661af1e362e88ed98a73e129340e8fbdccd35427786fbb9f890b932","run":41760812907,"job":126358234949,"head":"01627151f3ab50750eac2adeb46d8883a601265f"},{"id":13293036964,"name":"w1-fresh-service-head-01627151f3ab50750eac2adeb46d8883a601265f-1","size":5289751,"digest":"sha256:586470235a89df90a49645fb8916939a6405d06e1f1e6aa706c241f65e0d01c9","run":41760812907,"job":126358235097,"head":"01627151f3ab50750eac2adeb46d8883a601265f"}]''')
          ROOT = Path(os.environ["READBACK_OUT"])
          API = "https://api.github.com/repos/" + REPO
          TOKEN = os.environ["GH_TOKEN"]
          MAX_METADATA = 2 * 1024 * 1024
          MAX_MEMBER = 32 * 1024 * 1024
          MAX_SELECTED = 160 * 1024 * 1024
          MAX_MEMBERS = 25000
          MAX_STDOUT = 70000
          
          class Refused(Exception):
              pass
          
          def require(condition, label):
              if not condition:
                  raise Refused(label)
          
          require(os.environ["GITHUB_REPOSITORY"] == REPO, "REPOSITORY")
          require(os.environ["GITHUB_REF"] == "refs/heads/" + BRANCH, "REF")
          require(os.environ["GITHUB_EVENT_NAME"] == "push", "EVENT")
          require(len(TARGETS) == len({x["id"] for x in TARGETS}) == 11, "TARGETS")
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          AUTH = urllib.request.build_opener(NoRedirect())
          
          def request_api(path):
              require(path.startswith("/actions/"), "API_PATH")
              req = urllib.request.Request(API + path, headers={
                  "Authorization": "Bearer " + TOKEN,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "trnm-retained-failure-readback-v1",
              })
              return AUTH.open(req, timeout=60)
          
          def read_json(path):
              with request_api(path) as response:
                  raw = response.read(MAX_METADATA + 1)
              require(len(raw) <= MAX_METADATA, "METADATA_LIMIT")
              return json.loads(raw)
          
          def write_json(path, value):
              raw = (json.dumps(value, indent=2, sort_keys=True) + "\n").encode("utf-8")
              with path.open("xb") as stream:
                  stream.write(raw)
              return hashlib.sha256(raw).hexdigest()
          
          def archive(target, destination):
              # Only the GitHub API receives Authorization. The signed artifact URL is
              # fetched using a new request with no token and is never printed or saved.
              try:
                  response = request_api("/actions/artifacts/" + str(target["id"]) + "/zip")
              except urllib.error.HTTPError as error:
                  require(error.code in (301, 302, 303, 307, 308), "ARCHIVE_REDIRECT_STATUS")
                  location = error.headers.get("Location")
                  error.close()
                  require(isinstance(location, str), "ARCHIVE_LOCATION")
                  parsed = urllib.parse.urlsplit(location)
                  require(parsed.scheme == "https" and parsed.hostname
                          and parsed.username is None and parsed.password is None,
                          "ARCHIVE_LOCATION_SCHEME")
                  unsigned = urllib.request.Request(location, headers={
                      "User-Agent": "trnm-retained-failure-readback-v1"})
                  response = urllib.request.build_opener(NoRedirect()).open(unsigned, timeout=120)
              digest = hashlib.sha256()
              total = 0
              with response, destination.open("xb") as stream:
                  while True:
                      block = response.read(1024 * 1024)
                      if not block:
                          break
                      total += len(block)
                      require(total <= target["size"], "ARCHIVE_SIZE_OVERRUN")
                      digest.update(block)
                      stream.write(block)
              require(total == target["size"], "ARCHIVE_SIZE")
              require("sha256:" + digest.hexdigest() == target["digest"], "ARCHIVE_DIGEST")
              return total
          
          MATCH = re.compile(
              r"^test result:|^failures:|^thread .*panicked|^test .+ \.\.\. FAILED"
              r"|^error(?:\[[^]]+\])?:|^Error:|^Caused by:")
          KEY = re.compile(
