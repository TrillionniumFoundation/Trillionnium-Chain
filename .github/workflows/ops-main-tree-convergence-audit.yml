name: ops-main-tree-convergence-audit

on:
  push:
    branches:
      - ops/main-tree-convergence-audit-20260909

permissions:
  contents: read

concurrency:
  group: ops-main-tree-convergence-audit-20260909
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'TrillionniumFoundation/Trillionnium-Chain'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANONICAL_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
      CANONICAL_TREE: c0791ffb57e05fde43f87bfed1a3b4656c09efc0
      EXPECTED_PARENT_SHA: 4883afcb8aaec127c2b84c2d558e8217411ec623
      CARRIER_BRANCH: ops/main-tree-convergence-audit-20260909
    steps:
      - name: Check out exact audit carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind carrier and fetch every live branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only "$EXPECTED_PARENT_SHA" HEAD)" = ".github/workflows/ops-main-tree-convergence-audit.yml"
          git cat-file -e "$CANONICAL_SHA^{commit}"
          test "$(git rev-parse "$CANONICAL_SHA^{tree}")" = "$CANONICAL_TREE"
          git fetch --force --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git ls-remote --heads origin | LC_ALL=C sort > "$RUNNER_TEMP/branch-heads.txt"

      - name: Classify patch equivalence and final-file absorption
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/main-tree-convergence-audit-v2"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP/branch-heads.txt" "$OUT/branch-heads.txt"
          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import os
          import subprocess
          from collections import Counter, defaultdict
          from pathlib import Path

          canonical = os.environ["CANONICAL_SHA"]
          canonical_tree = os.environ["CANONICAL_TREE"]
          carrier_branch = os.environ["CARRIER_BRANCH"]
          out = Path(os.environ["OUT"])

          def text(*args: str, allow_failure: bool = False) -> str:
              result = subprocess.run(
                  ["git", *args], text=True, stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE, check=False,
              )
              if result.returncode and not allow_failure:
                  raise SystemExit(
                      f"git {' '.join(args)} failed ({result.returncode}): {result.stderr.strip()}"
                  )
              return result.stdout.strip()

          def binary(*args: str) -> bytes:
              result = subprocess.run(
                  ["git", *args], stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE, check=False,
              )
              if result.returncode:
                  raise SystemExit(
                      f"git {' '.join(args)} failed ({result.returncode}): "
                      f"{result.stderr.decode(errors='replace').strip()}"
                  )
              return result.stdout

          def ancestor(left: str, right: str) -> bool:
              return subprocess.run(
                  ["git", "merge-base", "--is-ancestor", left, right],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0

          def tree_map(commit: str) -> dict[str, tuple[str, str, str]]:
              mapping: dict[str, tuple[str, str, str]] = {}
              for raw in binary("ls-tree", "-r", "-z", commit).split(b"\0"):
                  if not raw:
                      continue
                  header, raw_path = raw.split(b"\t", 1)
                  mode, kind, sha = header.decode().split(" ")
                  mapping[raw_path.decode("utf-8", errors="surrogateescape")] = (mode, kind, sha)
              return mapping

          def paths_between(base: str, tip: str) -> list[str]:
              raw = binary("diff", "--name-only", "--no-renames", "-z", base, tip)
              return sorted(
                  item.decode("utf-8", errors="surrogateescape")
                  for item in raw.split(b"\0") if item
              )

          def is_ephemeral(branch: str, path: str) -> bool:
              kind = branch.split("/", 1)[0]
              if path == "micro_patch.diff" or path.startswith("tmp/"):
                  return True
              if path.startswith(".github/workflows/") and kind in {
                  "tmp", "ops", "automation", "diagnostic", "audit", "qualification"
              }:
                  return True
              if path.startswith("tools/"):
                  name = Path(path).name.lower()
                  return any(word in name for word in ("trigger", "fixup", "repair", "finalize"))
              return False

          prefix = "refs/remotes/origin/"
          refs: list[tuple[str, str]] = []
          for line in text(
              "for-each-ref", "--format=%(refname)\t%(objectname)", prefix
          ).splitlines():
              ref, tip = line.split("\t", 1)
              name = ref[len(prefix):]
              if name != "HEAD":
                  refs.append((name, tip))
          refs.sort()

          canonical_files = tree_map(canonical)
          names_by_tip: dict[str, list[str]] = defaultdict(list)
          for name, tip in refs:
              names_by_tip[tip].append(name)

          by_tip: dict[str, dict[str, object]] = {}
          for tip in sorted(names_by_tip):
              merge_base = text("merge-base", canonical, tip, allow_failure=True)
              cherry = text(
                  "rev-list", "--left-right", "--cherry-pick", "--no-merges",
                  f"{canonical}...{tip}", allow_failure=True,
              ).splitlines()
              tip_files = tree_map(tip)
              changed = paths_between(merge_base or tip, tip)
              counts: Counter[str] = Counter()
              unresolved: list[dict[str, object]] = []
              for path in changed:
                  branch_entry = tip_files.get(path)
                  canonical_entry = canonical_files.get(path)
                  if branch_entry == canonical_entry:
                      state = "absorbed_exact"
                  elif branch_entry is None and canonical_entry is None:
                      state = "absorbed_deletion"
                  elif branch_entry is None:
                      state = "branch_deleted_canonical_retained"
                  elif canonical_entry is None:
                      state = "branch_only"
                  else:
                      state = "content_or_mode_differs"
                  counts[state] += 1
                  if not state.startswith("absorbed_"):
                      unresolved.append({
                          "path": path,
                          "state": state,
                          "branchMode": branch_entry[0] if branch_entry else None,
                          "branchBlob": branch_entry[2] if branch_entry else None,
                          "canonicalMode": canonical_entry[0] if canonical_entry else None,
                          "canonicalBlob": canonical_entry[2] if canonical_entry else None,
                      })
              by_tip[tip] = {
                  "tip": tip,
                  "tree": text("rev-parse", f"{tip}^{{tree}}"),
                  "mergeBase": merge_base or None,
                  "tipIsAncestorOfCanonical": ancestor(tip, canonical),
                  "canonicalIsAncestorOfTip": ancestor(canonical, tip),
                  "aheadCommits": int(text("rev-list", "--count", f"{canonical}..{tip}")),
                  "behindCommits": int(text("rev-list", "--count", f"{tip}..{canonical}")),
                  "patchUniqueNonMergeCommitsOnTip": sum(line.startswith(">") for line in cherry),
                  "patchUniqueNonMergeCommitsOnCanonical": sum(line.startswith("<") for line in cherry),
                  "branchFinalChangedPathCount": len(changed),
                  "absorptionCounts": dict(sorted(counts.items())),
                  "unresolvedPathCount": len(unresolved),
                  "unresolvedPaths": unresolved[:500],
                  "unresolvedPathsTruncated": len(unresolved) > 500,
              }

          records: list[dict[str, object]] = []
          variants: dict[tuple[str, str | None, str | None], list[str]] = defaultdict(list)
          for name, tip in refs:
              row = dict(by_tip[tip])
              row["branch"] = name
              row["branchesSharingTip"] = sorted(names_by_tip[tip])
              unresolved = list(row["unresolvedPaths"])
              if name == "main":
                  disposition = "main_destination"
              elif name == carrier_branch:
                  disposition = "audit_carrier_remove_after_acceptance"
              elif bool(row["tipIsAncestorOfCanonical"]):
                  disposition = "history_fully_reachable"
              elif int(row["unresolvedPathCount"]) == 0:
                  disposition = "final_content_absorbed_exact"
              elif int(row["patchUniqueNonMergeCommitsOnTip"]) == 0:
                  disposition = "patch_equivalent_but_final_state_differs_review"
              elif unresolved and all(is_ephemeral(name, str(item["path"])) for item in unresolved):
                  disposition = "ephemeral_candidate_only_review"
              else:
                  disposition = "implementation_or_evidence_content_review_required"
              row["provisionalDisposition"] = disposition
              for item in unresolved:
                  variants[(
                      str(item["path"]), item.get("branchBlob"), item.get("canonicalBlob")
                  )].append(name)
              records.append(row)

          disposition_counts = Counter(str(row["provisionalDisposition"]) for row in records)
          summary = {
              "schema": "trnm-main-tree-convergence-audit-v2",
              "repository": "TrillionniumFoundation/Trillionnium-Chain",
              "canonicalSha": canonical,
              "canonicalTree": canonical_tree,
              "carrierSha": os.environ["GITHUB_SHA"],
              "branchCount": len(records),
              "distinctTipCount": len(names_by_tip),
              "dispositionCounts": dict(sorted(disposition_counts.items())),
              "branchesRequiringContentReview": disposition_counts[
                  "implementation_or_evidence_content_review_required"
              ],
              "unresolvedVariantCount": len(variants),
              "safeForDeletion": False,
              "policyReason": (
                  "Repository policy prohibits branch deletion and requires PR-only, two "
                  "independent approvals, last-push approval, exact checks, no merge commits, "
                  "and no force push. This artifact is read-only classification evidence."
              ),
          }

          ordered_variants = []
          for key, branches in sorted(
              variants.items(),
              key=lambda item: tuple("" if value is None else str(value) for value in item[0]),
          ):
              ordered_variants.append({
                  "path": key[0],
                  "branchBlob": key[1],
                  "canonicalBlob": key[2],
                  "branches": sorted(branches),
              })

          (out / "branch-content-audit.json").write_text(
              json.dumps({
                  "summary": summary,
                  "branches": records,
                  "unresolvedVariants": ordered_variants,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          fields = [
              "branch", "tip", "tree", "mergeBase", "aheadCommits", "behindCommits",
              "patchUniqueNonMergeCommitsOnTip", "branchFinalChangedPathCount",
              "unresolvedPathCount", "provisionalDisposition",
          ]
          with (out / "branch-content-audit.tsv").open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter="\t", extrasaction="ignore")
              writer.writeheader()
              writer.writerows(records)
          print(json.dumps(summary, sort_keys=True))
          PY
          (
            cd "$OUT"
            sha256sum branch-heads.txt branch-content-audit.json branch-content-audit.tsv summary.json \
              | LC_ALL=C sort > SHA256SUMS
          )
          cat "$OUT/summary.json"
          cat "$OUT/SHA256SUMS"

      - name: Upload immutable content-absorption audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-tree-convergence-content-audit-${{ github.sha }}
          path: ${{ runner.temp }}/main-tree-convergence-audit-v2
          if-no-files-found: error
          retention-days: 7
