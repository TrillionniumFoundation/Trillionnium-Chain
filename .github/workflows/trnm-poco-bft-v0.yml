name: TRNM PoCO-BFT v0 gates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/trnm-poco-bft-v0.yml"
      - "PROJECT_ID"
      - "PROJECT_BOUNDARY.json"
      - "README.md"
      - "RELEASE_READINESS.md"
      - "config/consensus-mainline.json"
      - "config/module-coverage-v1.toml"
      - "config/blocker-execution-v1.json"
      - "docs/development/**"
      - "docs/modules/**"
      - "docs/protocol/poco-bft-v0/**"
      - "formal/quint/poco-bft-v0/**"
      - "proto/trnm/poco/**"
      - "scripts/ci/**"
      - "scripts/poco-fleet/**"
      - "trillionnium/Cargo.toml"
      - "trillionnium/Cargo.lock"
      - "trillionnium/crates/trnm-consensus-*/**"
      - "trillionnium/crates/trnm-native-*/**"
      - "trillionnium/crates/trnm-finality-types/**"
      - "trillionnium/crates/trnm-mempool/**"
      - "trillionnium/crates/trnm-poco-node*/**"
      - "trillionnium/crates/trnm-protocol/**"
      - "trillionnium/crates/trnm-runtime/**"
      - "trillionnium/fuzz/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/trnm-poco-bft-v0.yml"
      - "PROJECT_ID"
      - "PROJECT_BOUNDARY.json"
      - "README.md"
      - "RELEASE_READINESS.md"
      - "config/consensus-mainline.json"
      - "config/module-coverage-v1.toml"
      - "config/blocker-execution-v1.json"
      - "docs/development/**"
      - "docs/modules/**"
      - "docs/protocol/poco-bft-v0/**"
      - "formal/quint/poco-bft-v0/**"
      - "proto/trnm/poco/**"
      - "scripts/ci/**"
      - "scripts/poco-fleet/**"
      - "trillionnium/Cargo.toml"
      - "trillionnium/Cargo.lock"
      - "trillionnium/crates/trnm-consensus-*/**"
      - "trillionnium/crates/trnm-native-*/**"
      - "trillionnium/crates/trnm-finality-types/**"
      - "trillionnium/crates/trnm-mempool/**"
      - "trillionnium/crates/trnm-poco-node*/**"
      - "trillionnium/crates/trnm-protocol/**"
      - "trillionnium/crates/trnm-runtime/**"
      - "trillionnium/fuzz/**"

permissions:
  contents: read

concurrency:
  group: trnm-poco-bft-v0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: UTF-8
  PYTHONUTF8: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  TRNM_CARGO_OFFLINE_POLICY: "required"
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"

jobs:
  protocol-contract:
    name: protocol-contract
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' ||
       ((github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf' || github.actor == 'Franksudoman' || github.actor == 'ProfHepta') &&
        github.triggering_actor == github.actor &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner-provisioned Rust toolchain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh --toolchain 1.95.0

      - name: Verify Cargo offline cache readiness
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock

      - name: Validate Plan v2 authority and native mainline
        run: |
          set -euo pipefail
          bash ./scripts/ci/check_canonical_development_plan.sh
          python3 ./scripts/ci/check_repository_truth_v1.py
          python3 ./scripts/ci/check_module_coverage_v1.py
          python3 ./scripts/ci/check_required_baseline_closure_v1.py
          python3 ./scripts/ci/check_required_protocol_contract_v1.py
          python3 ./scripts/ci/check_build_closures_v1.py --verify-cargo-tree
          bash ./scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          bash ./scripts/ci/check_poco_bft_v0_ci_truth.sh

      - name: Validate frozen protocol vectors and schemas
        run: |
          set -euo pipefail
          python3 ./scripts/ci/check_poco_bft_v0_parameters.py
          python3 ./scripts/ci/check_poco_bft_v0_wire_vectors.py
          python3 ./scripts/ci/check_poco_bft_v0_wire_reference.py
          python3 ./scripts/ci/check_poco_bft_v0_wire_semantic_reference.py
          python3 ./scripts/ci/check_poco_bft_v0_anchor_finality_vectors.py
          python3 ./scripts/ci/check_poco_bft_v0_ordered_roots.py
          bash ./scripts/ci/check_poco_bft_v0_qc_tc_vectors.sh
          bash ./scripts/ci/check_poco_bft_v0_handoff_vectors.sh
          bash ./scripts/ci/check_poco_bft_v0_registry_reference.sh --self-test
          bash ./scripts/ci/check_poco_bft_v0_registry.sh
          bash ./scripts/ci/check_poco_bft_v0_logical_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_anchor_handoff_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_epoch_commitment_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_block_body_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_checkpoint_finality_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_joint_handoff_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_snapshot_candidate_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_consumption_certificate_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_snapshot_namespace_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_snapshot_transition_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_checkpoint_execution_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_business_semantics_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_application_authority_schema.sh
          bash ./scripts/ci/check_poco_bft_v0_authenticated_candidate_selection.sh
          bash ./scripts/ci/check_poco_bft_v0_authenticated_next_epoch_commitment.sh
          bash ./scripts/ci/check_poco_bft_v0_authenticated_checkpoint_handoff.sh

      - name: Validate protobuf projection and repository boundary
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/protoc-29.3"
          protoc_path="$(./scripts/ci/install_pinned_protoc.sh "$install_root")"
          PROTOC="$protoc_path" bash ./scripts/ci/check_poco_bft_v0_proto.sh
          bash ./scripts/project-preflight.sh --audit
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify Cargo offline inputs remained unchanged
        if: always()
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"

  rust-baseline:
    name: rust-baseline
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' ||
       ((github.actor == 'ProfAlexQI' || github.actor == 'Tomasrgbsf' || github.actor == 'Franksudoman' || github.actor == 'ProfHepta') &&
        github.triggering_actor == github.actor &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify toolchain and offline inputs
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 --component rustfmt --component clippy
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock

      - name: Format, test and lint native consensus baseline
        run: |
          set -euo pipefail
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-consensus-types \
            -p trnm-consensus-crypto \
            -p trnm-consensus-core \
            -p trnm-runtime \
            -p trnm-native-application \
            -p trnm-native-execution-v0 \
            -p trnm-poco-node \
            --lib --locked --offline
          cargo clippy --manifest-path trillionnium/Cargo.toml \
            -p trnm-consensus-types \
            -p trnm-consensus-crypto \
            -p trnm-consensus-core \
            -p trnm-runtime \
            -p trnm-native-application \
            -p trnm-native-execution-v0 \
            -p trnm-poco-node \
            --lib --locked --offline -- -D warnings

      - name: Revalidate exact-source authority and cleanliness
        run: |
          set -euo pipefail
          python3 ./scripts/ci/check_repository_truth_v1.py
          python3 ./scripts/ci/check_build_closures_v1.py --verify-cargo-tree
          bash ./scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify Cargo offline inputs remained unchanged
        if: always()
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"
