name: Trillionnium Plan v2 Contract Clippy Repair Once 20260906c

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/trnm-plan-v2-contract-clippy-repair-once-20260906c.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trnm-plan-v2-contract-clippy-repair-once-20260906c
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      (github.event_name == 'schedule' ||
      ((github.actor == 'ProfAlexQI' || github.actor == 'Franksudoman' ||
      github.actor == 'ProfHepta') && github.triggering_actor == github.actor &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 300
    env:
      TARGET_BRANCH: work/plan-v2-full-gap-closure-20260902
      WORKFLOW_PATH: .github/workflows/trnm-plan-v2-contract-clippy-repair-once-20260906c.yml
    steps:
      - name: Check out exact source with publish lease credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source identity and provisioned toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          cargo +1.95.0 --version
          rustc +1.95.0 --version

      - name: Apply deterministic contract lint repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrences, found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "contracts/governance-guard/src/lib.rs",
              "    pub fn propose(\n",
              "    #[allow(clippy::too_many_arguments)]\n    pub fn propose(\n",
          )
          replace_exact(
              "contracts/settlement-vault/src/lib.rs",
              'assert!(vault.balances.get("ghost").is_none());',
              'assert!(!vault.balances.contains_key("ghost"));',
          )
          replace_exact(
              "contracts/settlement-vault/src/lib.rs",
              "&event.event_type[..],",
              "event.event_type,",
          )
          replace_exact(
              "contracts/settlement-vault/src/lib.rs",
              'assert!(vault.balances.get("alice").is_none());',
              'assert!(!vault.balances.contains_key("alice"));',
              expected=2,
          )
          replace_exact(
              "contracts/bridge-relay/src/lib.rs",
              "&vec![replay_sig],",
              "&[replay_sig],",
          )
          PY
          rm -- "${WORKFLOW_PATH}"
          cargo +1.95.0 fmt --manifest-path contracts/Cargo.toml --all
          git diff --check
          python3 - <<'PY'
          import subprocess

          expected = {
              "D  .github/workflows/trnm-plan-v2-contract-clippy-repair-once-20260906c.yml",
              " M contracts/bridge-relay/src/lib.rs",
              " M contracts/governance-guard/src/lib.rs",
              " M contracts/settlement-vault/src/lib.rs",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "status", "--short", "--untracked-files=all"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"unexpected repair diff: expected={sorted(expected)} actual={sorted(actual)}"
              )
          PY

      - name: Qualify final tree without the transient workflow
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --manifest-path contracts/Cargo.toml --all -- --check
          cargo +1.95.0 check --manifest-path contracts/Cargo.toml --workspace --all-targets --locked --offline
          cargo +1.95.0 test --manifest-path contracts/Cargo.toml --workspace --all-targets --locked --offline
          cargo +1.95.0 clippy --manifest-path contracts/Cargo.toml --workspace --all-targets --locked --offline -- -D warnings
          bash scripts/check_ci_runner_policy.sh --worktree
          bash scripts/check_cargo_offline_policy.sh --worktree
          python3 scripts/ci/test_module_coverage_guard_v1.py
          python3 scripts/ci/test_node_candidate_boundary_v1.py
          python3 scripts/ci/test_cargo_source_inventory_v1.py
          python3 scripts/ci/test_bounded_workspace_tests_v1.py
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_required_baseline_closure_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          bash scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path

          truth = json.loads(Path("config/consensus-mainline.json").read_text())
          for key in (
              "all_gaps_closed",
              "production_candidate",
              "production_consensus_activation",
              "public_testnet_ready",
              "release_ready",
          ):
              if truth.get(key) is True:
                  raise SystemExit(f"repository repair cannot promote {key}")
          PY

      - name: Commit and lease-publish qualified repair
        run: |
          set -euo pipefail
          start="${GITHUB_SHA}"
          git add --all -- \
            "${WORKFLOW_PATH}" \
            contracts/bridge-relay/src/lib.rs \
            contracts/governance-guard/src/lib.rs \
            contracts/settlement-vault/src/lib.rs
          git diff --cached --check
          git config user.name trillionnium-plan-v2-bot
          git config user.email trillionnium-plan-v2-bot@users.noreply.github.com
          git commit -m "fix(contracts): close strict Clippy blockers"
          candidate="$(git rev-parse HEAD)"
          git fetch origin "refs/heads/${TARGET_BRANCH}"
          remote="$(git rev-parse FETCH_HEAD)"
          test "${remote}" = "${start}"
          git push \
            "--force-with-lease=refs/heads/${TARGET_BRANCH}:${start}" \
            origin "${candidate}:refs/heads/${TARGET_BRANCH}"
          printf 'qualified_candidate=%s\n' "${candidate}"
