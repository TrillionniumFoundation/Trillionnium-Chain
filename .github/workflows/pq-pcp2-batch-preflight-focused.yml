name: PCP2 whole-batch cheap rejection exact-head native verification
on:
  push:
    branches:
      - fix/pq-pcp2-batch-cheap-replay-expiry-preflight-20261030
      - fix/pq-pcp2-one-budget-discovery-fetch-20261030
      - fix/pq-pcp2-publish-deadline-result-20261030
      - fix/pq-pcp2-roster-preflight-verified-cost-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pq-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rust 1.95 fmt and Clippy
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Exact source and cold inventory
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "${GITHUB_SHA}" --output "${RUNNER_TEMP}/pq-batch-source.json"
          python3 scripts/refresh_distributed_source_inventory.py --check
      - name: Rustfmt original gate
        run: cargo +1.95.0 fmt --manifest-path trillionnium/Cargo.toml --all -- --check
      - name: Whole-batch PCP2 and one-budget end-to-end real Cell controls
        run: cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-data-availability --lib cell::discovery::pq_reply_v2::tests -- --test-threads=1
      - name: Original discovery controls
        run: cargo +1.95.0 test --locked --manifest-path trillionnium/Cargo.toml -p trnm-data-availability --lib cell::discovery::tests -- --test-threads=1
      - name: Strict all-target Clippy
        run: cargo +1.95.0 clippy --locked --manifest-path trillionnium/Cargo.toml -p trnm-data-availability --all-targets -- -D warnings
      - name: No source mutations
        if: always()
        run: test -z "$(git status --porcelain=v1)"
