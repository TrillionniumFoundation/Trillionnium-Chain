[package]
name = "w1-node-adapter-research"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
w1-full-public-stark-research = { path = "../w1_public_stark_research" }
trnm-pon-node = { path = "../../../trillionnium/crates/trnm-pon-node" }
trnm-protocol = { path = "../../../trillionnium/crates/trnm-protocol" }
trnm-crypto-primitives = { path = "../../../trillionnium/crates/trnm-crypto-primitives" }
p3-uni-stark = "=0.8.0"
bincode = "=1.3.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
hex = "=0.4.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"

[workspace]

# Isolated diagnostic only: exact vendor copy with stderr cache request/miss events.
[patch.crates-io]
p3-dft = { path = "diagnostic_vendor/p3-dft-0.8.0" }

p3-uni-stark = { path = "diagnostic_vendor/p3-uni-stark-0.8.0" }
p3-fri = { path = "diagnostic_vendor/p3-fri-0.8.0" }
