name: PoCO-only convergence R13 (temporary)

on:
  push:
    branches:
      - chore/poco-only-purge-20260909
    paths:
      - .github/workflows/poco-only-convergence-r13-once-20260910.yml
      - tools/temporary_poco_convergence_r13.sh
      - tools/temporary_poco_native_convergence_r13.py
      - tools/temporary_poco_r13_postfix.py

concurrency:
  group: poco-only-final-convergence
  cancel-in-progress: true

permissions:
  contents: write

env:
  TARGET_BRANCH: chore/poco-only-purge-20260909
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: /tmp/trnm-r13-target
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "33554432"
  PRODUCTION_PORTS_COMMIT: 2ae1915c39774938dc7c8a0799a1224bb5024f2c
  REMOTE_SIGNER_FIX_COMMIT: 2f01213918e8da288ce5f598447318c9113edaa2

jobs:
  converge:
    name: Qualify and publish the native-domain PoCO product tree
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact convergence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned qualification tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          rustc --version
          cargo --version
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fetch --manifest-path contracts/Cargo.toml --locked
          bash -n tools/temporary_poco_convergence_r13.sh
          python3 -m py_compile \
            tools/temporary_poco_native_convergence_r13.py \
            tools/temporary_poco_r13_postfix.py

      - name: Harden one-shot transformation and invoke post-transform corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path("tools/temporary_poco_native_convergence_r13.py")
          text = helper.read_text(encoding="utf-8")
          needle = '    tests_path.write_text(text, encoding="utf-8")\n'
          insertion = (
              '    stripped = text.rstrip()\n'
              '    orphan = "#[test]"\n'
              '    if stripped.endswith(orphan):\n'
              '        text = stripped[: -len(orphan)].rstrip() + "\\n"\n'
          )
          if text.count(needle) != 1:
              raise SystemExit("R13 test-write insertion point drift")
          helper.write_text(text.replace(needle, insertion + needle, 1), encoding="utf-8")

          postfix = Path("tools/temporary_poco_r13_postfix.py")
          postfix_text = postfix.read_text(encoding="utf-8")
          overstrong = '''    if "AUTH_TREE_SNAPSHOT_CODEC_VERSION_V0" in text:
              raise RuntimeError("authenticated-tree codec constant still referenced")
          '''
          if postfix_text.count(overstrong) != 1:
              raise SystemExit("R13 obsolete-codec overstrong guard drift")
          postfix.write_text(postfix_text.replace(overstrong, "", 1), encoding="utf-8")

          shell = Path("tools/temporary_poco_convergence_r13.sh")
          script = shell.read_text(encoding="utf-8")
          call = "python3 tools/temporary_poco_native_convergence_r13.py\n"
          replacement = call + "python3 tools/temporary_poco_r13_postfix.py\n"
          if script.count(call) != 1:
              raise SystemExit("R13 native-transform call drift")
          shell.write_text(script.replace(call, replacement, 1), encoding="utf-8")
          PY
          python3 -m py_compile \
            tools/temporary_poco_native_convergence_r13.py \
            tools/temporary_poco_r13_postfix.py
          bash -n tools/temporary_poco_convergence_r13.sh

      - name: Materialize, calibrate, qualify and publish exact tree
        shell: bash
        run: bash tools/temporary_poco_convergence_r13.sh

      - name: Upload exact failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poco-r13-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/trnm-r13-final-commit.txt
            /tmp/trnm-r13-final-tree.txt
            /tmp/trnm-r13-vector-calibration.log
            /tmp/trnm-r13-native-only.json
            /tmp/trnm-r13-native-only-final.json
            /tmp/trnm-r13-external-evidence.json
            /tmp/trnm-r13-external-evidence.stdout
            /tmp/trnm-r13-external-evidence.stderr
            /tmp/trnm-r13-workspace-check.log
            /tmp/trnm-r13-contract-check.log
            /tmp/trnm-r13-native-execution-test.log
            /tmp/trnm-r13-raw-key-test.log
            /tmp/trnm-r13-workspace-test.log
            /tmp/trnm-r13-contract-test.log
            /tmp/trnm-r13-contract-clippy.log
            /tmp/trnm-r13-boundary-clippy.log
