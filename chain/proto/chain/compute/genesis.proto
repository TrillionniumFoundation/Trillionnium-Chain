syntax = "proto3";
package chain.compute;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "chain/compute/params.proto";
import "chain/compute/job.proto";

option go_package = "chain/x/compute/types";

// GenesisState defines the compute module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Job job_list = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint64 job_count = 3;
}
