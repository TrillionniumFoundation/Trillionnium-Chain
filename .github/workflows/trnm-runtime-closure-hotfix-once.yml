name: trnm-runtime-closure-hotfix-once
on:
  push:
    branches: [fix/full-runtime-closure-20260916]
    paths: [.trnm/runtime-closure/hotfix.patch]
permissions:
  contents: write
concurrency:
  group: trnm-runtime-closure-hotfix-once
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - shell: bash
        run: |
          set -euo pipefail
          patch=.trnm/runtime-closure/hotfix.patch
          test -f "$patch" && test ! -L "$patch"
          test "$(wc -c < "$patch")" -le 4096
          git diff --quiet && git diff --cached --quiet
          git apply --check --index --whitespace=error-all "$patch"
          git apply --index --whitespace=error-all "$patch"
          test "$(git diff --cached --name-only)" = 'trillionnium/crates/trnm-poco-lab-validator/src/consensus_runtime.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'runtime: fix direct topology match syntax'
          git push origin "HEAD:${GITHUB_REF_NAME}"
