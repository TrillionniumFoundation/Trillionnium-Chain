name: temporary-codeql-fixture-security-publisher-v2

on:
  push:
    branches:
      - fix/chain-codeql-fixture-security-v2-20260908

permissions:
  contents: write

concurrency:
  group: temporary-codeql-fixture-security-publisher-v2
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.actor == 'ProfHepta' &&
      github.triggering_actor == github.actor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 521726e47ce0efad6b732a5fc31afcd2cc52593d
      TARGET_BRANCH: fix/chain-codeql-fixture-security-v2-20260908
      PATCH_SHA256: 45d1417cc3db0fdb96927c3492c8b48e82059da4c09f1d397e3d5c6001ee0c29
      WORKFLOW_PATH: .github/workflows/temporary-codeql-fixture-security-publisher-v2.yml
    steps:
      - name: Check out publisher commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable bootstrap boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA"...HEAD)" = "$WORKFLOW_PATH"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply exact reviewed patch and validate the closed path set
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/codeql-fixture-security.patch"
          printf '%s' '' | base64 --decode | xz --decompress > "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$PATCH_SHA256"
          git apply --index --whitespace=error "$patch"
          git rm "$WORKFLOW_PATH"
          expected="$(printf '%s\n' \
            "$WORKFLOW_PATH" \
            scripts/ci/check_poco_ai_native_v1_order_finality_light_client.py \
            scripts/min_faucet_server.py \
            scripts/min_faucet_server_test.py \
            scripts/poco-fleet/stage0_direct_seven_bundle_v1_test.py | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check

      - name: Run focused security and semantic regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/min_faucet_server.py \
            scripts/min_faucet_server_test.py \
            scripts/poco-fleet/stage0_direct_seven_bundle_v1_test.py \
            scripts/ci/check_poco_ai_native_v1_order_finality_light_client.py
          python3 scripts/min_faucet_server_test.py
          python3 scripts/poco-fleet/stage0_direct_seven_bundle_v1_test.py
          python3 scripts/ci/check_poco_ai_native_v1_order_finality_light_client.py \
            --check-ordinary-advance --self-test-ordinary-advance-mutants
          python3 scripts/ci/check_poco_ai_native_v1_order_finality_light_client.py \
            --check-trust-path --self-test-trust-path-mutants

      - name: Commit reviewed source without temporary publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'fix(security): harden faucet and anonymous fixture signing'
          expected="$(printf '%s\n' \
            scripts/ci/check_poco_ai_native_v1_order_finality_light_client.py \
            scripts/min_faucet_server.py \
            scripts/min_faucet_server_test.py \
            scripts/poco-fleet/stage0_direct_seven_bundle_v1_test.py | sort)"
          actual="$(git diff --name-only "$BASE_SHA"...HEAD | sort)"
          test "$actual" = "$expected"
          test ! -e "$WORKFLOW_PATH"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Revalidate canonical source-bound gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          python3 scripts/ci/check_technical_convergence_v1.py
          python3 scripts/ci/test_technical_convergence_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push validated commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $authorization" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
