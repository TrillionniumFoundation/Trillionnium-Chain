name: consolidate-repository-owned-v2

on:
  push:
    branches:
      - work/plan-v2-full-gap-closure-20260902
    paths:
      - .github/workflows/zz-consolidate-repository-owned-v2.yml

permissions:
  contents: write

concurrency:
  group: consolidate-repository-owned-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: work/plan-v2-full-gap-closure-20260902
  NODE_SPLIT_BRANCH: work/node-split-v1-20260902
  CORE_SOURCE_SHA: 1a181ba453f86055082859e12e3d0be9fc7b18f5
  CORE_SOURCE_TREE: cae204e1638ba4bba92a9a852f0552adb41ca494
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  consolidate:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/plan-v2-full-gap-closure-20260902' &&
      github.actor == 'Franksudoman' &&
      github.triggering_actor == github.actor &&
      !contains(github.event.head_commit.message, '[repository-owned-v2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Import exact validated surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin \
            "+refs/heads/${NODE_SPLIT_BRANCH}:refs/remotes/origin/${NODE_SPLIT_BRANCH}" \
            "${CORE_SOURCE_SHA}"
          node_sha="$(git rev-parse "refs/remotes/origin/${NODE_SPLIT_BRANCH}")"
          test "$(git show -s --format=%T "${CORE_SOURCE_SHA}")" = "${CORE_SOURCE_TREE}"
          test "$(git ls-tree -r --name-only "${node_sha}" -- .github/workflows/zz-stage-node-split-lock.yml | wc -l)" -eq 0
          for path in \
            .github/CODEOWNERS \
            .github/workflows/trnm-required-baseline.yml \
            config/build-closures-v1.toml \
            config/module-coverage-v1.toml \
            config/node-decomposition-v1.toml \
            docs/modules/TRNM_MODULE_TECHNICAL_REFERENCE_V1.md \
            scripts/ci/check_build_closures_v1.py \
            scripts/ci/check_node_decomposition_v1.py \
            trillionnium/Cargo.toml \
            trillionnium/Cargo.lock \
            trillionnium/crates/trnm-poco-node-authority \
            trillionnium/crates/trnm-poco-node-io \
            trillionnium/crates/trnm-poco-node-host \
            trillionnium/crates/trnm-poco-node-cli
          do
            git checkout "${node_sha}" -- "${path}"
          done
          core_paths=(
            config/repository-blocker-cores-v0.toml
            scripts/check_repository_blocker_registry_v0.py
            trillionnium/crates/trnm-control-plane-v0
            trillionnium/crates/trnm-durable-file-adapters-v0
            trillionnium/crates/trnm-migration-v0
            trillionnium/crates/trnm-node-boundary-v0
            trillionnium/crates/trnm-poco-node-production-v0
            trillionnium/crates/trnm-production-adapter-conformance-v0
            trillionnium/crates/trnm-release-bundle-v0
            trillionnium/crates/trnm-state-sync-v0
            trillionnium/crates/trnm-tx-lifecycle-v0
          )
          git checkout "${CORE_SOURCE_SHA}" -- "${core_paths[@]}"
          git show "${CORE_SOURCE_SHA}:docs/development/TRNM_DURABLE_FILE_ADAPTERS_V0.md" > docs/modules/TRNM_DURABLE_FILE_ADAPTERS_V0.md
          git show "${CORE_SOURCE_SHA}:docs/development/TRNM_PRODUCTION_ADAPTER_CONFORMANCE_V0.md" > docs/modules/TRNM_PRODUCTION_ADAPTER_CONFORMANCE_V0.md
          git show "${CORE_SOURCE_SHA}:docs/development/TRNM_REPOSITORY_BLOCKER_CORES_V0.md" > docs/modules/TRNM_REPOSITORY_BLOCKER_CORES_V0.md
          sed -i 's#docs/development/TRNM_DURABLE_FILE_ADAPTERS_V0.md#docs/modules/TRNM_DURABLE_FILE_ADAPTERS_V0.md#g; s#docs/development/TRNM_PRODUCTION_ADAPTER_CONFORMANCE_V0.md#docs/modules/TRNM_PRODUCTION_ADAPTER_CONFORMANCE_V0.md#g; s#docs/development/TRNM_REPOSITORY_BLOCKER_CORES_V0.md#docs/modules/TRNM_REPOSITORY_BLOCKER_CORES_V0.md#g' \
            config/repository-blocker-cores-v0.toml scripts/check_repository_blocker_registry_v0.py
          printf 'node_sha=%s\n' "${node_sha}" >> "${GITHUB_ENV}"

      - name: Register crates and technical ownership idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          workspace = Path('trillionnium/Cargo.toml')
          text = workspace.read_text()
          marker = ']\nresolver = "2"'
          members = [
              'crates/trnm-control-plane-v0','crates/trnm-durable-file-adapters-v0',
              'crates/trnm-migration-v0','crates/trnm-node-boundary-v0',
              'crates/trnm-poco-node-production-v0','crates/trnm-production-adapter-conformance-v0',
              'crates/trnm-release-bundle-v0','crates/trnm-state-sync-v0','crates/trnm-tx-lifecycle-v0',
          ]
          if marker not in text: raise SystemExit('workspace marker drift')
          for member in members:
              row=f'  "{member}",\n'
              if row not in text: text=text.replace(marker,row+marker,1)
          workspace.write_text(text)

          coverage=Path('config/module-coverage-v1.toml')
          text=coverage.read_text()
          mapping={
              'M03':['trnm-durable-file-adapters-v0'],
              'M05':['trnm-tx-lifecycle-v0'],
              'M13':['trnm-migration-v0','trnm-state-sync-v0'],
              'M15':['trnm-node-boundary-v0','trnm-poco-node-production-v0','trnm-release-bundle-v0'],
              'M16':['trnm-control-plane-v0'],
              'M17':['trnm-production-adapter-conformance-v0'],
          }
          for mid,names in mapping.items():
              pat=rf'(\[\[module_coverage\]\]\nid = "{mid}"\n.*?primary_crates = \[)(.*?)(\]\n)'
              m=re.search(pat,text,re.S)
              if not m: raise SystemExit(f'module section missing: {mid}')
              items=re.findall(r'"([^"]+)"',m.group(2))
              for name in names:
                  if name not in items: items.append(name)
              rep=m.group(1)+', '.join(f'"{x}"' for x in items)+m.group(3)
              text=text[:m.start()]+rep+text[m.end():]
          coverage.write_text(text)

          ref=Path('docs/modules/TRNM_MODULE_TECHNICAL_REFERENCE_V1.md')
          current=ref.read_text()
          appendix='''\n\n---\n\n## Repository blocker core implementation map v0\n\nThese repository-owned cores are fail-closed and confer no production, public-testnet, release, or activation authority.\n\n| Crate | Module | Boundary |\n|---|---|---|\n| `trnm-durable-file-adapters-v0` | M03 | locked authority and snapshot CAS |\n| `trnm-tx-lifecycle-v0` | M05 | bounded transaction lifecycle |\n| `trnm-migration-v0` | M13 | source-bound migration verification |\n| `trnm-state-sync-v0` | M13 | authenticated state sync |\n| `trnm-node-boundary-v0` | M15 | node boundary |\n| `trnm-poco-node-production-v0` | M15 | production-shaped fail-closed node |\n| `trnm-release-bundle-v0` | M15 | reproducible release bundle |\n| `trnm-control-plane-v0` | M16 | observer-first control plane |\n| `trnm-production-adapter-conformance-v0` | M17 | conformance authority only |\n'''
          if '## Repository blocker core implementation map v0' not in current:
              ref.write_text(current.rstrip()+appendix+'\n')
          PY

      - name: Build, test and prove fail-closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'])
          PY
          )"
          rustup toolchain install "${toolchain}" --profile minimal --component rustfmt --component clippy
          rustup default "${toolchain}"
          cargo check --manifest-path trillionnium/Cargo.toml --workspace
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          python3 scripts/ci/check_node_decomposition_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_build_closures_v1.py --verify-cargo-tree
          python3 scripts/check_repository_blocker_registry_v0.py
          packages=(
            trnm-poco-node-authority trnm-poco-node-io trnm-poco-node-host trnm-poco-node-cli
            trnm-control-plane-v0 trnm-durable-file-adapters-v0 trnm-migration-v0
            trnm-node-boundary-v0 trnm-poco-node-production-v0
            trnm-production-adapter-conformance-v0 trnm-release-bundle-v0
            trnm-state-sync-v0 trnm-tx-lifecycle-v0
          )
          for package in "${packages[@]}"; do
            cargo test --manifest-path trillionnium/Cargo.toml -p "${package}" --all-targets --locked --offline
            cargo clippy --manifest-path trillionnium/Cargo.toml -p "${package}" --all-targets --locked --offline -- -D warnings
          done
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked --offline
          status="$(cargo run --manifest-path trillionnium/Cargo.toml -p trnm-poco-node-cli --bin trnm-poco-node-cli --locked --offline -- status)"
          printf '%s\n' "${status}" | grep -q '"production_candidate":false'
          printf '%s\n' "${status}" | grep -q '"authority_gate_open":false'
          printf '%s\n' "${status}" | grep -q '"production_activation":false'
          printf '%s\n' "${status}" | grep -q '"start_permitted":false'
          test "$(find docs/development -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 1

      - name: Record non-promotion qualification and commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/repository
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          Path('docs/evidence/repository/REPOSITORY_OWNED_CONSOLIDATION_V2.json').write_text(json.dumps({
              'schema':'trnm-repository-owned-consolidation-report-v2',
              'integration_parent':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'node_split_source_commit':os.environ['node_sha'],
              'repository_core_source_commit':os.environ['CORE_SOURCE_SHA'],
              'repository_core_source_tree':os.environ['CORE_SOURCE_TREE'],
              'qualified_crates':13,
              'cargo_tree_verified':True,
              'tests_and_clippy':'PASS',
              'external_evidence':False,
              'production_candidate':False,
              'production_consensus_activation':False,
              'public_testnet_ready':False,
              'release_ready':False,
              'result':'PASS',
          },indent=2,sort_keys=True)+'\n')
          PY
          for path in .github/workflows/zz-*.yml; do
            [[ -e "${path}" ]] && git rm "${path}"
          done
          git config user.name 'Franksudoman'
          git config user.email 'sunfocapital@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m '[repository-owned-v2] feat(plan): qualify repository-owned blocker cores'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
