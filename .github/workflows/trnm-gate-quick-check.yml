name: trnm-gate-quick-check

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'trillionnium-rust/scripts/**'
      - '.github/workflows/trnm-gate-quick-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'trillionnium-rust/scripts/**'
      - '.github/workflows/trnm-gate-quick-check.yml'
  workflow_dispatch:

concurrency:
  group: trnm-gate-quick-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-static-checks:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Keep numeric parsing/formatting locale-stable (decimal separator, etc.)
      # for shell/python probes that may emit or compare numeric evidence.
      LC_NUMERIC: C
      # Force bytewise collation so sort/uniq behavior is reproducible across
      # runner image refreshes and locale package changes.
      LC_COLLATE: C
      # Keep month/day names and locale-sensitive time formatting stable for
      # any date evidence emitted by shell/python helpers.
      LC_TIME: C
      # Force locale-driven message strings to remain stable across runner
      # image updates so grep/assertions on stderr stay deterministic.
      LC_MESSAGES: C
      # Freeze Python hash randomization so set/dict iteration in shell-driven
      # regression scripts stays deterministic across CI re-runs.
      PYTHONHASHSEED: "0"
      # Normalize shell/test behavior for tools that branch on CI mode.
      CI: "true"
      # Pin a stable build timestamp for any tooling that emits date metadata
      # (zip/tar/python wheel/etc.) so artifact ordering stays reproducible.
      SOURCE_DATE_EPOCH: "1704067200"
      # Avoid sporadic apt interactive prompts on runner image/package drift.
      DEBIAN_FRONTEND: noninteractive
    # This workflow runs dozens of regression scripts; 10 minutes can truncate
    # coverage and hide late-stage failures. Keep enough headroom for full sweep.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          retry() {
            local attempts="$1"; shift
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "Command failed after ${attempts} attempts: $*" >&2
                return 1
              fi
              n=$((n+1))
              sleep 2
            done
          }
          retry 3 sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          retry 3 sudo apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends shellcheck

      - name: Quick shell gate (bash -n + shellcheck)
        run: |
          QUICK_GATE_SUMMARY_PATH=run/quick-gate/summary.json \
          ./scripts/quick_gate_shell.sh scripts trillionnium-rust/scripts

      - name: Validate workflow script refs (exist + executable)
        run: |
          WORKFLOW_SCRIPT_REF_STRICT=1 \
          WORKFLOW_SCRIPT_REF_SUMMARY_PATH=run/quick-gate/workflow-script-refs-summary.json \
          ./scripts/validate_workflow_script_refs.sh

      - name: Quick gate summary path guard regression
        run: |
          ./scripts/v2/quick_gate_summary_path_guard_test.sh

      - name: Merge gates deterministic env guard regression
        run: |
          ./scripts/v2/trnm_merge_gates_deterministic_env_guard_test.sh

      - name: PR5 reconcile skip-when-missing-log regression
