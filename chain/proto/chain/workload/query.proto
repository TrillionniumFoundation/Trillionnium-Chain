syntax = "proto3";

package chain.workload;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "chain/workload/params.proto";
import "chain/workload/task.proto";
import "chain/workload/worker.proto";
import "chain/workload/unbonding.proto";
import "chain/workload/challenge.proto";

option go_package = "chain/x/workload/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/chain/workload/params";
  
  }
  
  // Queries a list of Task items.
  rpc Task    (QueryGetTaskRequest) returns (QueryGetTaskResponse) {
    option (google.api.http).get = "/chain/workload/task/{id}";
  
  }
  rpc TaskAll (QueryAllTaskRequest) returns (QueryAllTaskResponse) {
    option (google.api.http).get = "/chain/workload/task";
  
  }
  
  // Queries a list of Worker items.
  rpc Worker    (QueryGetWorkerRequest) returns (QueryGetWorkerResponse) {
    option (google.api.http).get = "/chain/workload/worker/{creator}";
  
  }
  rpc WorkerAll (QueryAllWorkerRequest) returns (QueryAllWorkerResponse) {
    option (google.api.http).get = "/chain/workload/worker";
  
  }
  
  // Queries a list of Unbonding items.
  rpc Unbonding    (QueryGetUnbondingRequest) returns (QueryGetUnbondingResponse) {
    option (google.api.http).get = "/chain/workload/unbonding/{creator}";
  
  }
  rpc UnbondingAll (QueryAllUnbondingRequest) returns (QueryAllUnbondingResponse) {
    option (google.api.http).get = "/chain/workload/unbonding";
  
  }

  // Queries a list of Challenge items.
  rpc Challenge    (QueryGetChallengeRequest) returns (QueryGetChallengeResponse) {
    option (google.api.http).get = "/chain/workload/challenge/{id}";
  
  }
  rpc ChallengeAll (QueryAllChallengeRequest) returns (QueryAllChallengeResponse) {
    option (google.api.http).get = "/chain/workload/challenge";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryGetTaskRequest {
  uint64 id = 1;
}

message QueryGetTaskResponse {
  Task Task = 1 [(gogoproto.nullable) = false];
}

message QueryAllTaskRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllTaskResponse {
  repeated Task                                   Task       = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetWorkerRequest {
  string creator = 1;
}

message QueryGetWorkerResponse {
  Worker worker = 1 [(gogoproto.nullable) = false];
}

message QueryAllWorkerRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllWorkerResponse {
  repeated Worker                                 worker     = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetUnbondingRequest {
  string creator = 1;
}

message QueryGetUnbondingResponse {
  Unbonding unbonding = 1 [(gogoproto.nullable) = false];
}

message QueryAllUnbondingRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllUnbondingResponse {
  repeated Unbonding                              unbonding  = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetChallengeRequest {
  uint64 id = 1;
}

message QueryGetChallengeResponse {
  Challenge challenge = 1 [(gogoproto.nullable) = false];
}

message QueryAllChallengeRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllChallengeResponse {
  repeated Challenge                              challenge  = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

