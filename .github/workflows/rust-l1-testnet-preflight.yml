name: rust-l1-testnet-preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'trillionnium-rust/**'
      - '.github/workflows/rust-l1-testnet-preflight.yml'

concurrency:
  group: rust-l1-testnet-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: macos-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LC_NUMERIC: C
      LC_COLLATE: C
      LC_TIME: C
      LC_MESSAGES: C
      PYTHONHASHSEED: "0"
      CI: "true"
      SOURCE_DATE_EPOCH: "1704067200"
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run testnet preflight
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/rustup/bin:$PATH"
          cd trillionnium-rust
          ./scripts/testnet_preflight.sh

      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-l1-testnet-preflight-${{ github.run_id }}
          path: |
            trillionnium-rust/run/preflight/**
            trillionnium-rust/run/audit/**
            trillionnium-rust/run/bench/**
            trillionnium-rust/run/node*.log
            trillionnium-rust/run/parallel-sanity.log
          if-no-files-found: warn
