name: lifecycle-smoke-observability

on:
  push:
    branches: [main]
    paths:
      - 'chain/tools/*.sh'
      - '.github/workflows/lifecycle-smoke-observability.yml'
  pull_request:
    paths:
      - 'chain/tools/*.sh'
      - '.github/workflows/lifecycle-smoke-observability.yml'

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - chain/tools/lifecycle_smoke.sh
          - chain/tools/lifecycle_smoke_observability_test.sh
          - chain/tools/demo_denom_governance_flow.sh
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck ${{ matrix.script }}
        run: shellcheck "${{ matrix.script }}"

  shell-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: lifecycle-observability-regression
            command: bash chain/tools/lifecycle_smoke_observability_test.sh
          - name: lifecycle-smoke-syntax
            command: bash -n chain/tools/lifecycle_smoke.sh
          - name: demo-denom-flow-syntax
            command: bash -n chain/tools/demo_denom_governance_flow.sh
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
