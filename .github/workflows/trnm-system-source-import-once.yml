name: trnm-system-source-import-once

on:
  push:
    branches: [diagnostic/chain-system-import-20260914]
    paths: [.ci/system-import-8bbd4581.part2.txt]

permissions:
  contents: write

jobs:
  source-object-transport:
    if: github.repository == 'TrillionniumFoundation/Trillionnium-Chain' && github.ref == 'refs/heads/diagnostic/chain-system-import-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Read transport data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: transport
          persist-credentials: false
          sparse-checkout: .ci
      - name: Read exact source parent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 999ef793fb242eae46a49b4b4177ba3788a44ec0
          path: trillionnium-chain
          persist-credentials: false
          fetch-depth: 0
      - name: Reconstruct and validate inert Git objects
        working-directory: trillionnium-chain
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, hashlib, json, subprocess, zlib
          from pathlib import Path
          BASE = '999ef793fb242eae46a49b4b4177ba3788a44ec0'
          BASE_TREE = '753045ef0200325a6e5791b2cafc8956f2519a4d'
          TARGET = '8bbd4581fa3752ae96b6a8b4ee8a15647c710037'
          TARGET_TREE = '4f9f831e19dfa1a6423c081229214c4173d877fc'
          ALLOWED = {
              '.github/pull_request_template.md',
              'docs/development/plan-manifest-v1.toml',
              'docs/modules/TRNM_MODULE_IMPLEMENTATION_GUIDE_V1.md',
              'trillionnium/crates/trnm-consensus-signer-journal/src/handoff_schema_v1.rs',
              'trillionnium/crates/trnm-consensus-signer-journal/src/handoff_sqlite_v1.rs',
              'trillionnium/crates/trnm-consensus-signer-journal/src/schema.rs',
              'trillionnium/crates/trnm-consensus-signer-journal/src/sqlite.rs',
              'trillionnium/crates/trnm-native-execution-v0/src/durable.rs',
              'trillionnium/crates/trnm-native-execution-v0/src/native_parallel.rs',
              'trillionnium/crates/trnm-native-execution-v0/src/native_parallel_scheduler_tests.rs',
              'trillionnium/crates/trnm-native-execution-v0/src/store.rs',
          }
          def require(value, message):
              if not value:
                  raise SystemExit(message)
          def git(*args, data=None):
              return subprocess.check_output(['git', '-c', 'core.hooksPath=/dev/null', *args], input=data)
          require(git('rev-parse', 'HEAD').decode().strip() == BASE, 'source mismatch')
          require(git('rev-parse', 'HEAD^{tree}').decode().strip() == BASE_TREE, 'source tree mismatch')
          require(not git('status', '--porcelain'), 'source not clean')
          parts = []
          for index in range(3):
              path = Path(f'../transport/.ci/system-import-8bbd4581.part{index}.txt')
              require(not path.is_symlink() and path.is_file(), 'regular input required')
              require(path.stat().st_size <= 8192, 'transport part too large')
              parts.append(path.read_bytes())
          raw = b''.join(parts)
          require(hashlib.sha256(raw).hexdigest() == '91fef3c2a4e77177dc3fb0fdeb483d23cc1348262b42c463541908878ad99ea1', 'transport digest mismatch')
          envelope = json.loads(raw)
          require(set(envelope) == {'patch', 'commit'}, 'unexpected fields')
          compressed = base64.b64decode(envelope['patch'], validate=True)
          require(len(compressed) <= 65536, 'compressed patch too large')
          decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
          patch = decoder.decompress(compressed, 1048576)
          require(decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data, 'incomplete or oversized patch')
          require(hashlib.sha256(patch).hexdigest() == '18081d003b54932eb029050d666c37626c7c72aa96224745babd486eee6569bf', 'patch digest mismatch')
          commit = base64.b64decode(envelope['commit'], validate=True)
          require(len(commit) <= 8192, 'commit too large')
          require(hashlib.sha1(b'commit ' + str(len(commit)).encode() + b'\0' + commit).hexdigest() == TARGET, 'commit identity mismatch')
          headers = commit.split(b'\n\n', 1)[0].splitlines()
          require([x for x in headers if x.startswith(b'tree ')] == [b'tree ' + TARGET_TREE.encode()], 'commit tree mismatch')
          require([x for x in headers if x.startswith(b'parent ')] == [b'parent ' + BASE.encode()], 'commit parent mismatch')
          # Git processes inert data only. No target script, hook or binary runs.
          git('apply', '--cached', '--whitespace=error', '--binary', '-', data=patch)
          changed = {x.decode() for x in git('diff', '--cached', '--name-only', '-z', BASE).split(b'\0') if x}
          require(changed == ALLOWED, 'unexpected path set')
          for line in git('ls-files', '--stage', '-z', '--', *sorted(ALLOWED)).split(b'\0'):
              if line:
                  require(line.split(b' ', 1)[0] == b'100644', 'unexpected file mode')
          require(git('write-tree').decode().strip() == TARGET_TREE, 'reconstructed tree mismatch')
          require(git('hash-object', '-t', 'commit', '-w', '--stdin', data=commit).decode().strip() == TARGET, 'stored commit mismatch')
          print(f'source_transport=verified target={TARGET} tree={TARGET_TREE} candidate_code_executed=false acceptance=not-assessed')
          PY
      - name: Publish only the exact object-transport branch
        working-directory: trillionnium-chain
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          target=8bbd4581fa3752ae96b6a8b4ee8a15647c710037
          ref=refs/heads/diagnostic/system-objects-8bbd4581
          url=https://github.com/TrillionniumFoundation/Trillionnium-Chain.git
          test "$(git rev-parse "${target}^{tree}")" = 4f9f831e19dfa1a6423c081229214c4173d877fc
          basic=$(printf 'x-access-token:%s' "${GITHUB_TOKEN:?}" | base64 -w0)
          printf '::add-mask::%s\n' "$basic"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          current=$(git ls-remote --heads "$url" "$ref")
          if [ -n "$current" ]; then
            test "${current%%[[:space:]]*}" = "$target"
            echo 'source_transport=already-present'
          else
            git -c core.hooksPath=/dev/null push --porcelain "$url" "$target:$ref"
          fi
          echo 'main_unchanged=true activation_unchanged=true no_candidate_execution=true'
