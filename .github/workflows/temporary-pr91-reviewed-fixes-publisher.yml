name: temporary-pr91-reviewed-fixes-publisher

on:
  push:
    branches:
      - automation/pr91-review-fixes-20260908a

permissions:
  contents: read

env:
  BASE_SHA: 82a5bdf00169b49489d4af6069b3c7558df4f9eb
  TARGET_BRANCH: fix/chain-codeql-fixture-security-v2-20260908
  TARGET_TREE: 4b5ed9f7e16cf0d8a9b28b604faa0ac7a133e70d
  PATCH_XZ_SHA256: a0d99407014f2fc41d63e827ff725dd616c6013862b81d21d2a64502e2c3fff9
  PATCH_SHA256: e4fcdc435d3aaddb2c9212917b7b0f6fe0572c42e30d2e6ca2abd483dc60d46d
  PATCH_B64: 

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply and validate exact reviewed patch without credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/fix.patch.xz"
          echo "$PATCH_XZ_SHA256  $RUNNER_TEMP/fix.patch.xz" | sha256sum --check --strict
          xz -dc "$RUNNER_TEMP/fix.patch.xz" > "$RUNNER_TEMP/fix.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/fix.patch" | sha256sum --check --strict
          git apply --index "$RUNNER_TEMP/fix.patch"
          test "$(git diff --cached --name-only | paste -sd, -)" = ".github/workflows/trnm-gate-quick-check.yml,scripts/min_faucet_server.py,scripts/min_faucet_server_test.py,scripts/poco-fleet/stage0_direct_seven_bundle_v1_test.py,scripts/v2/faucet_service_up.sh"
          test "$(git write-tree)" = "$TARGET_TREE"
          python3 -m py_compile scripts/min_faucet_server.py scripts/min_faucet_server_test.py scripts/poco-fleet/stage0_direct_seven_bundle_v1_test.py
          python3 scripts/min_faucet_server_test.py
          PYTHONPATH=scripts/poco-fleet python3 - <<'PY'
          import stage0_direct_seven_bundle_v1_test as fixture
          fixture.missing_memfd_sealing_capability_control()
          fixture.anonymous_sign_fixture_control()
          print('memfd_security_regressions=passed')
          PY
          bash -n scripts/v2/faucet_service_up.sh
          git diff --check --cached

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact reviewed output with expected-head CAS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/fix.patch.xz"
          echo "$PATCH_XZ_SHA256  $RUNNER_TEMP/fix.patch.xz" | sha256sum --check --strict
          xz -dc "$RUNNER_TEMP/fix.patch.xz" > "$RUNNER_TEMP/fix.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/fix.patch" | sha256sum --check --strict
          git apply --index "$RUNNER_TEMP/fix.patch"
          test "$(git write-tree)" = "$TARGET_TREE"
          git config user.name 'Trillionnium reviewed patch publisher'
          git config user.email 'reviewed-patch-publisher@users.noreply.github.com'
          git commit -m 'fix(security): fence faucet effects and require sealed memfd'
          test "$(git show -s --format=%P HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$BASE_SHA" origin "HEAD:refs/heads/$TARGET_BRANCH"
