name: tmp-rustfmt-node-commit

on:
  push:
    branches:
      - integration/native-poco-node-commit-exec-v1-20260902
    paths:
      - 'trillionnium/crates/trnm-consensus-external-node-checkpoint/src/node_commit_ledger_v1.rs'
      - '.github/workflows/tmp-rustfmt-node-commit.yml'

permissions:
  contents: write

jobs:
  rustfmt-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup override set 1.95.0
      - name: Format exact workspace and remove helper
        run: |
          cd trillionnium
          cargo fmt --all
          cd ..
          git rm .github/workflows/tmp-rustfmt-node-commit.yml
          git diff --check
      - name: Publish deterministic cleanup commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trillionnium/crates/trnm-consensus-external-node-checkpoint/src/node_commit_ledger_v1.rs
          git commit -m 'checkpoint: rustfmt node commit ledger and remove helper'
          git push origin HEAD:integration/native-poco-node-commit-exec-v1-20260902
