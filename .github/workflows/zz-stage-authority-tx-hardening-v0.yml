name: stage-authority-tx-hardening-v0

on:
  push:
    branches:
      - work/integrate-repository-cores-v0-20260902
    paths:
      - .github/workflows/zz-stage-authority-tx-hardening-v0.yml

permissions:
  contents: write

concurrency:
  group: stage-authority-tx-hardening-v0-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: work/integrate-repository-cores-v0-20260902

jobs:
  harden_authority_tx:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/work/integrate-repository-cores-v0-20260902' &&
      github.actor == 'Franksudoman' &&
      github.triggering_actor == github.actor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository-pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          channel="$(python3 - <<'PY'
          import tomllib
          with open('rust-toolchain.toml', 'rb') as handle:
              print(tomllib.load(handle)['toolchain']['channel'])
          PY
          )"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
          cargo fetch --manifest-path trillionnium/Cargo.toml --locked

      - name: Harden node authority boundary and transaction lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          node = Path('trillionnium/crates/trnm-node-boundary-v0/src/lib.rs')
          text = node.read_text()
          text = text.replace(
              'use std::{error::Error, fmt};',
              'use std::{collections::BTreeSet, error::Error, fmt};',
              1,
          )
          text = text.replace(
              'pub const MAX_INGRESS_ITEMS_PER_STEP_V0: u32 = 256;\npub const MAX_AUTHORITY_ADVANCES_PER_STEP_V0: u32 = 32;',
              'pub const MAX_INGRESS_ITEMS_PER_STEP_V0: u32 = 256;\npub const MAX_OUTBOUND_ITEMS_PER_STEP_V0: u32 = 256;\npub const MAX_INGRESS_BYTES_PER_STEP_V0: u64 = MAX_INGRESS_FRAME_BYTES_V0 as u64 * 8;\npub const MAX_OUTBOUND_BYTES_PER_STEP_V0: u64 = MAX_OUTBOUND_FRAME_BYTES_V0 as u64 * 8;\npub const MAX_AUTHORITY_ADVANCES_PER_STEP_V0: u32 = 32;',
              1,
          )
          text = text.replace(
              '''            || self.max_outbound_items == 0
            || self.max_ingress_bytes == 0
            || self.max_outbound_bytes == 0
''',
              '''            || self.max_outbound_items == 0
            || self.max_outbound_items > MAX_OUTBOUND_ITEMS_PER_STEP_V0
            || self.max_ingress_bytes == 0
            || self.max_ingress_bytes > MAX_INGRESS_BYTES_PER_STEP_V0
            || self.max_outbound_bytes == 0
            || self.max_outbound_bytes > MAX_OUTBOUND_BYTES_PER_STEP_V0
''',
              1,
          )
