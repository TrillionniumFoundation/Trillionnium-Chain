name: CI

on:
  pull_request:
    paths:
      - 'chain/x/workload/keeper/**'
      - 'chain/x/workload/types/**'
      - 'chain/testutil/keeper/**'
      - 'chain/go.mod'
      - 'chain/go.sum'
      - 'chain/.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'chain/x/workload/keeper/**'
      - 'chain/x/workload/types/**'
      - 'chain/testutil/keeper/**'
      - 'chain/go.mod'
      - 'chain/go.sum'
      - 'chain/.github/workflows/ci.yml'

jobs:
  workload-lifecycle-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: chain/go.mod

      - name: Keeper edge tests (expanded)
        run: go test ./x/workload/keeper -run 'TestFinalizeUnbonding_HeightEdges|TestFinalizeUnbonding_BankTransferError_NoFinalizeEvent|TestExtendUnbonding_Edges|TestRequestUnbonding_.*|TestSlashWorker_Edges|TestDenomParamUsedInFinalizeUnbonding|TestFinalizeUnbonding_EmptyDenomFallsBackToDefault|TestFinalizeUnbonding_ZeroAmountSkipsBankTransfer' -count=1

      # shell observability regression is covered in .github/workflows/lifecycle-smoke-observability.yml
