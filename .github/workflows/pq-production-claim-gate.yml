name: P0 post-quantum false-activation claim gate
on:
  push:
    branches:
      - fix/pq-production-claim-guard-20261030
      - audit/pq-w1-proof-profile-failclosed-20261030
      - audit/pq-json-duplicate-member-refusal-20261030
      - fix/pq-claim-required-ci-contract-20261030
      - audit/pq-w1-pinned-research-parameters-20261030
      - audit/pq-w1-provenance-strict-json-20261030
      - audit/pq-w1-guest-source-ci-coverage-20261030
      - audit/pq-w1-closed-manifest-schema-20261030
      - audit/pq-classical-boundary-drift-refusal-20261030
      - audit/pq-da-classical-auth-default-deny-20261030
    paths:
      - .github/workflows/pq-production-claim-gate.yml
      - scripts/security/**
      - config/consensus-mainline.json
      - trillionnium/crates/trnm-research-protocol/src/hepta_handoff.rs
      - trillionnium/crates/trnm-data-availability/src/cell/discovery.rs
      - trillionnium/crates/trnm-data-availability/src/types.rs
      - trillionnium/crates/trnm-data-availability/src/retrieval.rs
      - trillionnium/crates/trnm-pon-node/src/ingress.rs
      - trillionnium/crates/trnm-types/src/transfer.rs
      - trillionnium/crates/trnm-mvcc-fee/src/pon_executor.rs
      - trillionnium/crates/trnm-research-protocol/src/command.rs
      - trillionnium/crates/trnm-research-protocol/src/state.rs
      - trillionnium/crates/trnm-task-kernel/src/store.rs
      - trillionnium/crates/trnm-service-settlement/src/engine.rs
      - trillionnium/crates/trnm-crypto-primitives/guests/w1-risc0/**
      - trillionnium/crates/trnm-crypto-primitives/src/pon_work/full_relation.rs
      - trillionnium/crates/trnm-crypto-primitives/src/pon_work/full_relation_tests.rs
  pull_request:
    paths:
      - .github/workflows/pq-production-claim-gate.yml
      - scripts/security/**
      - config/consensus-mainline.json
      - trillionnium/crates/trnm-research-protocol/src/hepta_handoff.rs
      - trillionnium/crates/trnm-data-availability/src/cell/discovery.rs
      - trillionnium/crates/trnm-data-availability/src/types.rs
      - trillionnium/crates/trnm-data-availability/src/retrieval.rs
      - trillionnium/crates/trnm-pon-node/src/ingress.rs
      - trillionnium/crates/trnm-types/src/transfer.rs
      - trillionnium/crates/trnm-mvcc-fee/src/pon_executor.rs
      - trillionnium/crates/trnm-research-protocol/src/command.rs
      - trillionnium/crates/trnm-research-protocol/src/state.rs
      - trillionnium/crates/trnm-task-kernel/src/store.rs
      - trillionnium/crates/trnm-service-settlement/src/engine.rs
      - trillionnium/crates/trnm-crypto-primitives/guests/w1-risc0/**
      - trillionnium/crates/trnm-crypto-primitives/src/pon_work/full_relation.rs
      - trillionnium/crates/trnm-crypto-primitives/src/pon_work/full_relation_tests.rs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pq-claim-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact source HEAD
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Exercise adversarial PQ claim gate controls
        run: python3 -m unittest discover -s scripts/security -p 'test_pq_claim_gate.py' -v
      - name: Refuse any unreviewed PQ128 or unsafe production activation
        run: python3 scripts/security/pq_claim_gate.py --root . --assert-unqualified
      - name: Require clean source
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1)"
