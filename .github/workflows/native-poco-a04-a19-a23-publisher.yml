name: native-poco-a04-a19-a23-publisher

on:
  push:
    branches:
      - integration/native-poco-a04-a19-a23-publisher-20260901
    paths:
      - .github/workflows/native-poco-a04-a19-a23-publisher.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-poco-a04-a19-a23-publisher-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: fddc8e919a77f3be42b72ad4b8a7f8ff91d7abdc
  A04_HEAD: 1fa71c942e129ce88937a030c3054c8f72649aaf
  A19_HEAD: fa7aa82a5fa8fe1910b26845caae99784211746b
  A23_HEAD: 69ad386f1248d79a89c6e677d7c71a431747b646
  TARGET_BRANCH: integration/native-poco-a04-a19-a23-qualified-v1-20260901
  CI: "true"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  qualify:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/integration/native-poco-a04-a19-a23-publisher-20260901' &&
      (((github.actor == 'Tomasrgbsf') &&
        (github.triggering_actor == 'Tomasrgbsf')) ||
       ((github.actor == 'ProfAlexQI') &&
        (github.triggering_actor == 'ProfAlexQI')))
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      TRNM_CARGO_OFFLINE_POLICY: "required"
    outputs:
      candidate_commit: ${{ steps.freeze.outputs.candidate_commit }}
      candidate_tree: ${{ steps.freeze.outputs.candidate_tree }}
      a04_commit: ${{ steps.freeze.outputs.a04_commit }}
      a19_commit: ${{ steps.freeze.outputs.a19_commit }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out exact read-only carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trillionnium-chain
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify carrier and immutable source objects
        working-directory: trillionnium-chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${SOURCE_COMMIT}"
          mapfile -t changed < <(git diff --name-only "${SOURCE_COMMIT}..HEAD" | sort)
          expected=(.github/workflows/native-poco-a04-a19-a23-publisher.yml)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
          for commit in "${SOURCE_COMMIT}" "${A04_HEAD}" "${A19_HEAD}" "${A23_HEAD}"; do
            git fetch --no-tags origin "${commit}"
            test "$(git rev-parse "${commit}")" = "${commit}"
            git fsck --no-dangling --no-progress "${commit}"
          done

      - name: Verify runner-provisioned Rust and offline Cargo cache
        working-directory: trillionnium-chain
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 --component rustfmt --component clippy
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock

      - name: Build exact linear A04 A19 A23 candidate
        id: freeze
        working-directory: trillionnium-chain
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${SOURCE_COMMIT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          a04_impl="$(
            git log --format=%H \
              -G'NativeFinalization(Intent|ApplyReadback)V0' \
              "${A04_HEAD}" -- trillionnium/crates/trnm-native-application \
              | head -n 1
          )"
          test -n "${a04_impl}"
          test "$(git cat-file -t "${a04_impl}")" = commit
          a04_parent="$(git rev-parse "${a04_impl}^")"
          mapfile -t a04_all < <(
            git diff --name-only "${a04_parent}..${a04_impl}" | sort
          )
          a04_paths=()
          for path in "${a04_all[@]}"; do
            case "${path}" in
              docs/development/packages/*A04*.md|trillionnium/crates/trnm-native-application/*)
                a04_paths+=("${path}")
                ;;
              .github/workflows/*)
                ;;
              *)
                printf 'unexpected non-wrapper A04 path: %s\n' "${path}" >&2
                exit 2
                ;;
            esac
          done
          test "${#a04_paths[@]}" -gt 0
          for path in "${a04_paths[@]}"; do
            test "$(git diff --name-only --diff-filter=D "${a04_parent}..${a04_impl}" -- "${path}")" = ""
            git cat-file -e "${A04_HEAD}:${path}"
          done
          printf '%s\n' "${a04_paths[@]}" | sort -u > "$RUNNER_TEMP/a04-paths"
          git checkout "${A04_HEAD}" -- "${a04_paths[@]}"
          git add -- "${a04_paths[@]}"
          git diff --cached --check
          git diff --cached --exit-code -- trillionnium/Cargo.lock
          git commit -m 'feat(app): restack canonical native application finality carrier'
          a04_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${SOURCE_COMMIT}"
          rg -q 'NativeFinalizationIntentV0' trillionnium/crates/trnm-native-application
          rg -q 'NativeFinalizationApplyReadbackV0' trillionnium/crates/trnm-native-application

          a19_paths=(
            docs/development/packages/TRNM_A19_P1_EXEC_TERMINAL_HISTORY_V1.md
            trillionnium/crates/trnm-native-application-sqlite/Cargo.toml
            trillionnium/crates/trnm-native-application-sqlite/src/finalization_history.rs
            trillionnium/crates/trnm-native-application-sqlite/src/lib.rs
          )
          for path in "${a19_paths[@]}"; do
            git cat-file -e "${A19_HEAD}:${path}"
          done
          git checkout "${A19_HEAD}" -- "${a19_paths[@]}"
          git add -- "${a19_paths[@]}"
          git diff --cached --check
          git diff --cached --exit-code -- trillionnium/Cargo.lock
          git commit -m 'feat(exec): restack durable terminal finalization history'
          a19_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${a04_commit}"

          a23_paths=(
            docs/development/packages/TRNM_A23_P2_NATIVE_REPLAY_FLOOR_V1.md
            trillionnium/crates/trnm-native-execution-v0/src/durable.rs
            trillionnium/crates/trnm-native-execution-v0/src/durable/replay_floor_v1.rs
            trillionnium/crates/trnm-native-execution-v0/src/lib.rs
            trillionnium/crates/trnm-poco-node/src/tx_admission_wal.rs
            trillionnium/crates/trnm-poco-node/src/tx_admission_wal_native_replay_floor_v1.inc
            trillionnium/crates/trnm-poco-node/src/tx_admission_wal_tombstone_gc_v1.inc
          )
          for path in "${a23_paths[@]}"; do
            git cat-file -e "${A23_HEAD}:${path}"
          done
          git checkout "${A23_HEAD}" -- "${a23_paths[@]}"
          git add -- "${a23_paths[@]}"
          git diff --cached --check
          git diff --cached --exit-code -- trillionnium/Cargo.lock
          git commit -m 'feat(tx): bind tombstone GC to native finalized replay floor'
          candidate_commit="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$(git rev-parse HEAD^)" = "${a19_commit}"
          test "$(git rev-parse HEAD^^)" = "${a04_commit}"
          test "$(git rev-parse HEAD^^^)" = "${SOURCE_COMMIT}"

          {
            cat "$RUNNER_TEMP/a04-paths"
            printf '%s\n' "${a19_paths[@]}"
            printf '%s\n' "${a23_paths[@]}"
          } | sort -u > "$RUNNER_TEMP/expected-final-paths"
          git diff --name-only "${SOURCE_COMMIT}..${candidate_commit}" \
            | sort -u > "$RUNNER_TEMP/actual-final-paths"
          diff -u "$RUNNER_TEMP/expected-final-paths" "$RUNNER_TEMP/actual-final-paths"
          test -z "$(grep '^\.github/workflows/' "$RUNNER_TEMP/actual-final-paths" || true)"
          test -z "$(git status --porcelain --untracked-files=all)"

          echo "a04_commit=${a04_commit}" >> "$GITHUB_OUTPUT"
          echo "a19_commit=${a19_commit}" >> "$GITHUB_OUTPUT"
          echo "candidate_commit=${candidate_commit}" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=${candidate_tree}" >> "$GITHUB_OUTPUT"
          printf 'A04 implementation source: %s\n' "${a04_impl}"
          printf 'A04 candidate: %s\nA19 candidate: %s\nA23 candidate: %s\n' \
            "${a04_commit}" "${a19_commit}" "${candidate_commit}"
          git diff --stat "${SOURCE_COMMIT}..${candidate_commit}"

      - name: Format and compile complete native finality stack
        working-directory: trillionnium-chain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.freeze.outputs.candidate_commit }}"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo check --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-application --all-targets --locked --offline
          cargo check --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-application-sqlite --all-targets --locked --offline
          cargo check --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-execution-v0 --all-targets --locked --offline
          cargo check --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal \
            --all-targets --locked --offline

      - name: Strict lint complete native finality stack
        working-directory: trillionnium-chain
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-application --all-targets --locked --offline -- -D warnings
          cargo clippy --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-application-sqlite --all-targets --locked --offline -- -D warnings
          cargo clippy --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-execution-v0 --all-targets --locked --offline -- -D warnings
          cargo clippy --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal \
            --all-targets --locked --offline -- -D warnings

      - name: Run A04 A19 A23 regression matrix
        working-directory: trillionnium-chain
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-application --lib --locked --offline
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-application --doc --locked --offline
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-application-sqlite --all-targets --locked --offline
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-execution-v0 --lib --locked --offline
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-native-execution-v0 --doc --locked --offline
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal --lib --locked --offline
          cargo test --manifest-path trillionnium/Cargo.toml \
            -p trnm-poco-node --features tx-admission-wal --doc --locked --offline

      - name: Revalidate authority repository and plan truth
        working-directory: trillionnium-chain
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/a22_capability_authority_audit_v1.py
          python3 -B - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('/tmp/trnm-capability-authority-audit-v2.json').read_text(
                  encoding='utf-8'
              )
          )
          assert report['unresolved_total'] == 0, report
          assert report['authority_sink_findings'] == [], report
          assert report['missing_compile_fail_proofs'] == [], report
          assert report['stale_policy_entries'] == [], report
          assert report['production_migration_authority_impl_findings'] == [], report
          PY
          bash scripts/ci/a22_inert_capability_compile_fail_v1.sh
          bash scripts/check_ci_runner_policy_test.sh
          bash scripts/check_ci_runner_policy.sh --head
          bash scripts/check_cargo_offline_policy.sh --head
          python3 scripts/ci/check_repository_truth_v1.py
          python3 scripts/ci/check_blocker_execution_v1.py
          bash scripts/ci/check_poco_bft_mainline_truth.sh --pre-cutover
          bash scripts/ci/check_canonical_development_plan.sh
          bash scripts/project-preflight.sh --audit
          git diff --check
          git diff --exit-code -- .
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build content-addressed qualified bundle
        working-directory: trillionnium-chain
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-poco-a04-a19-a23-qualified"
          mkdir -p "$out"
          candidate="${{ steps.freeze.outputs.candidate_commit }}"
          tree="${{ steps.freeze.outputs.candidate_tree }}"
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
          git update-ref refs/heads/native-poco-a04-a19-a23-qualified "$candidate"
          git bundle create "$out/candidate.bundle" \
            refs/heads/native-poco-a04-a19-a23-qualified
          git update-ref -d refs/heads/native-poco-a04-a19-a23-qualified
          sha256sum "$out/candidate.bundle" > "$out/candidate.bundle.sha256"
          printf '%s\n' "${SOURCE_COMMIT}" > "$out/source-commit"
          printf '%s\n' "${{ steps.freeze.outputs.a04_commit }}" > "$out/a04-commit"
          printf '%s\n' "${{ steps.freeze.outputs.a19_commit }}" > "$out/a19-commit"
          printf '%s\n' "$candidate" > "$out/candidate-commit"
          printf '%s\n' "$tree" > "$out/candidate-tree"
          cp "$RUNNER_TEMP/expected-final-paths" "$out/changed-paths"

      - name: Upload qualified candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-poco-a04-a19-a23-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-poco-a04-a19-a23-qualified/
          if-no-files-found: error
          retention-days: 7

      - name: Verify Cargo offline inputs remained unchanged
        if: always()
        working-directory: trillionnium-chain
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"

  publish:
    needs: qualify
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out carrier without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: trillionnium-chain
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download qualified bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          path: ${{ runner.temp }}/native-poco-a04-a19-a23-qualified

      - name: Verify and atomically publish qualified code-only tree
        working-directory: trillionnium-chain
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_COMMIT: ${{ needs.qualify.outputs.candidate_commit }}
          EXPECTED_TREE: ${{ needs.qualify.outputs.candidate_tree }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-poco-a04-a19-a23-qualified"
          test "$(cat "$out/source-commit")" = "${SOURCE_COMMIT}"
          test "$(cat "$out/candidate-commit")" = "$EXPECTED_COMMIT"
          test "$(cat "$out/candidate-tree")" = "$EXPECTED_TREE"
          sha256sum --check "$out/candidate.bundle.sha256"
          git bundle verify "$out/candidate.bundle"
          git fetch "$out/candidate.bundle" \
            refs/heads/native-poco-a04-a19-a23-qualified:refs/remotes/qualified/native-stack
          candidate="$(git rev-parse refs/remotes/qualified/native-stack)"
          test "$candidate" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "${candidate}^{tree}")" = "$EXPECTED_TREE"
          test "$(git rev-parse "${candidate}^^^")" = "${SOURCE_COMMIT}"
          test -z "$(git diff --name-only "${SOURCE_COMMIT}..${candidate}" | grep '^\.github/workflows/' || true)"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [[ -n "$remote_head" && "$remote_head" != "$candidate" ]]; then
            printf 'target branch already exists at unexpected commit: %s\n' "$remote_head" >&2
            exit 2
          fi
          if [[ "$remote_head" = "$candidate" ]]; then
            printf 'target branch already published at %s\n' "$candidate"
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git push --atomic origin "${candidate}:refs/heads/${TARGET_BRANCH}"
