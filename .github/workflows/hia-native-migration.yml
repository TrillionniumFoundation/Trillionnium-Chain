          set -euo pipefail
          python3 -B - "$TRNM_TYPED_STAGE" <<'PY_TYPED_BINDING'
          import hashlib, json, os, sys
          from pathlib import Path
          from hia.platform.typed_store.rust_oracle import ORIGINAL_TESTS

          stage = sys.argv[1]
          root = Path(os.environ['RUNNER_TEMP'])
          observations = root / 'hia-typed-store-observations'
          def require(value, message):
              if not value:
                  raise ValueError(message)
