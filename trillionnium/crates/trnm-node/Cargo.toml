[package]
name = "trnm-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
autobins = false
publish = false

[features]
default = ["self-consensus"]
self-consensus = []
# Deprecated compatibility alias for existing local scripts. It does not select
# another implementation; it enables the same native consensus code.
legacy-harness = ["self-consensus"]

[package.metadata.trnm]
lane = "self-developed-consensus"
protocol_features_frozen = false
production_candidate = false
development_only = true
consensus_authority = "native-only"

[[bin]]
name = "trnm-sim"
path = "src/main.rs"
required-features = ["self-consensus"]

[[bin]]
name = "trnm-chain-node"
path = "src/bin/trnm-chain-node.rs"
required-features = ["self-consensus"]

[[bin]]
name = "trnm-chain-validator"
path = "src/bin/trnm-chain-validator.rs"
required-features = ["self-consensus"]

[[bin]]
name = "trnm-chain-cli"
path = "src/bin/trnm-chain-cli.rs"
required-features = ["self-consensus"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }
trnm-pouw = { version = "0.1.0", path = "../trnm-pouw" }
trnm-state = { version = "0.1.0", path = "../trnm-state" }
trnm-types = { version = "0.1.0", path = "../trnm-types" }
trnm-executor = { version = "0.1.0", path = "../trnm-executor" }
trnm-mempool = { version = "0.1.0", path = "../trnm-mempool" }
trnm-research-protocol = { version = "0.1.0", path = "../trnm-research-protocol" }
trnm-finality-types = { version = "0.1.0", path = "../trnm-finality-types" }
trnm-finality-verifier = { version = "0.1.0", path = "../trnm-finality-verifier" }

[dev-dependencies]
trnm-state = { version = "0.1.0", path = "../trnm-state", features = ["test-utils"] }
