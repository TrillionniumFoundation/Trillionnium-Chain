name: PoN pressure window source staging
on:
  push:
    branches: [ci/pon-pressure-window-source-20261010]
    paths: [.github/workflows/pon-pressure-window-source.yml]
permissions:
  contents: write
jobs:
  native:
    if: github.repository == 'TrillionniumFoundation/Trillionnium-Chain' && github.ref == 'refs/heads/ci/pon-pressure-window-source-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Install original pinned native compiler and formatter
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Freeze and publish exact four-file native candidate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pressure-window"
          mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/pressure-target" >> "$GITHUB_ENV"
          cp .github/pressure_stage_?.py "$out/"
          git checkout --detach 228b156dc14ea938300b9503092e1ddd55014e4a
          bash scripts/project-preflight.sh --audit | tee "$out/preflight-before.log"
          for part in 0 1 2 3; do python3 "$out/pressure_stage_$part.py"; done
          sha256sum --check <<'HASHES'
          fa10502d074786d6399c27fcdb23d326b08f078d93688d15d8fca3d18ec09a15  trillionnium/crates/trnm-pon-node/tests/public_v3_from_zero.rs
          54f5b04f02b7a837b85c7d0500007483d6cbc31f5a2f7ccf76d70c726b42efa0  scripts/ci/run_from_zero_native.py
          c48bd151a2baa7f8cc6d58c44e4f1ccb1694b13cc810ac419c5d20d9596fc2f8  scripts/ci/test_run_from_zero_native.py
          88aaf13920497cedcc725f9a7957e80da2f4f276e095e4b84e6837eb2706050a  docs/protocol/pon-nakamoto-v1/details/DEPLETED_PUBLIC_OVERLAP.md
          HASHES
          git diff --binary > "$out/before-format.patch"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all
          git diff --check
          git diff --binary > "$out/delivered.patch"
          git add trillionnium/crates/trnm-pon-node/tests/public_v3_from_zero.rs scripts/ci/run_from_zero_native.py scripts/ci/test_run_from_zero_native.py docs/protocol/pon-nakamoto-v1/details/DEPLETED_PUBLIC_OVERLAP.md
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          test -z "$(git diff --name-only)"
          tree=$(git write-tree)
          commit=$(git -c user.name='OpenAI' -c user.email='noreply@openai.com' commit-tree "$tree" -p 228b156dc14ea938300b9503092e1ddd55014e4a <<'MESSAGE'
          fix(pon): bind public pressure calls to their window and distinguish contention from depletion

          Preserve the existing native service owner, fixed resource policy, all original finite controls and full state/reopen checks. Clip each attack RPC to the earlier of the existing two-second call budget and shared four-second window. Record exact interval and deadline coordinates; retain separate original honest service deadlines and joined cleanup. Add actual expired-client zero-connection/zero-search control to the original native selector.

          Version the sustained observation to V2 and recompute deadline, refusal and pressure aggregates in its original source-bound reader. Low stored credit includes reservations and worker refusal does not prove remotely induced budget depletion. Keep causal depletion and independent acceptance unclaimed. Original63 plus8 additive reader tests passed locally; native execution must supply its own result on this committed source. No original controls, budgets, runtime protocol, consensus, model/final-use authority, README or readiness flags are changed.
          MESSAGE
          )
          git checkout --detach "$commit"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$commit" "$tree" > "$out/source-before.txt"
          git push origin "$commit:refs/heads/fix/pon-pressure-window-native-20261010"
          git ls-remote origin refs/heads/fix/pon-pressure-window-native-20261010 > "$out/published-ref.txt"
          test "$(cut -f1 "$out/published-ref.txt")" = "$commit"
      - name: Run complete reader suite and actual source-recompiled native service
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_run_from_zero_native.py -v 2>&1 | tee "$OUT/reader-tests.log"
          grep -E '^Ran 71 tests in ' "$OUT/reader-tests.log"
          grep -x OK "$OUT/reader-tests.log"
          python3 scripts/ci/run_from_zero_native.py --out "$OUT/native"
      - name: Preserve strict native lint and source identity
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --release --manifest-path trillionnium/Cargo.toml -p trnm-pon-node --test public_v3_from_zero --all-features -- -D warnings 2>&1 | tee "$OUT/clippy.log"
          bash scripts/project-preflight.sh --audit | tee "$OUT/preflight-after.log"
          git rev-parse HEAD HEAD^{tree} > "$OUT/source-after.txt"
          cmp "$OUT/source-before.txt" "$OUT/source-after.txt"
          test -z "$(git status --porcelain)"
      - name: Retain source and every result including failure
        if: always()
        shell: bash
        run: |
          set -eu
          out="$RUNNER_TEMP/pressure-window"
          mkdir -p "$out"
          git rev-parse HEAD HEAD^{tree} > "$out/observed-terminal-source.txt"
          git status --porcelain > "$out/observed-terminal-status.txt"
          git bundle create "$out/source.bundle" HEAD
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pressure-window-native-source
          path: ${{ runner.temp }}/pressure-window
          if-no-files-found: error
