          if test -f "$RUNNER_TEMP/hia-work-owner-packaging.log"; then
            cp -- "$RUNNER_TEMP/hia-work-owner-packaging.log" "$RUNNER_TEMP/hia-work-owner-artifact/packaging.log"
          fi
