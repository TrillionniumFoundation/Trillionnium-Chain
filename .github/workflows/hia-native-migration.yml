          bash scripts/project-preflight.sh --audit
          python3 hia/tools/check_migration.py
          printf 'HIA_TOOLCHAIN_ROOT=%s/hia-toolchain\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Bootstrap and self-reproduce the native HIA compiler
        run: |
          set -euo pipefail
          python3 -B hia/tools/bootstrap.py --output "$RUNNER_TEMP/hia-bootstrap"
          python3 - "$RUNNER_TEMP/hia-bootstrap/bootstrap.json" "$GITHUB_ENV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('status') != 'PASS':
              raise SystemExit('HIA compiler bootstrap did not pass')
          if value.get('compiler_sha256') != '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54':
              raise SystemExit('HIA compiler identity differs from the pinned native compiler')
          if not value.get('compiler'):
              raise SystemExit('HIA native compiler path is absent')
          with open(sys.argv[2], 'a') as out:
              out.write('HIA_NATIVE_COMPILER=' + value['compiler'] + '\n')
              out.write('HIA_NATIVE_COMPILER_SHA256=' + value['compiler_sha256'] + '\n')
          PY
      - name: Execute finite native Linux controls and retain open owner gates
        run: |
          set -euo pipefail
          python3 -B hia/tools/qualify_platform.py --output "$RUNNER_TEMP/hia-platform"
      - name: Execute native stream deadlines and reusable contexts
        run: python3 -B hia/tools/qualify_platform.py --reactor --output "$RUNNER_TEMP/hia-reactor"
      - name: Execute native transaction owner and crash recovery controls
        run: python3 -B hia/tools/qualify_storage.py --output "$RUNNER_TEMP/hia-storage"
      - name: Execute native interrupted initialization recovery controls
        run: python3 -B -m hia.tools.qualify_storage_recovery --output "$RUNNER_TEMP/hia-native-storage-recovery"
      - name: Verify candidate sources remained unchanged
        if: always()
        run: python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$TRNM_EXPECTED_SOURCE_SHA"
      - name: Retain success and failure observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hia-platform-${{ env.TRNM_EXPECTED_SOURCE_SHA }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hia-observations/
            ${{ runner.temp }}/hia-bootstrap/bootstrap.json
            ${{ runner.temp }}/hia-platform/
            ${{ runner.temp }}/hia-reactor/
            ${{ runner.temp }}/hia-storage/
            ${{ runner.temp }}/hia-native-storage-recovery/
          if-no-files-found: error
          retention-days: 30
  native-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: chain
    steps:
      - name: Checkout exact chain candidate and archive history
