[package]
name = "trnm-poco-verify-challenge-v1"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Trillionnium Contributors"]
publish = false

[package.metadata.trnm]
lane = "poco-ai-native-v1-verify-challenge-candidate"
protocol = "poco-ai-native-v1"
classification = "candidate-non-normative"
verification_class = "stake-quorum-only"
fresh_genesis_trust_bundle_is_consensus_object = false
bootstrap_unique_trust_keys = true
committed_profile_hash_recomputed = true
order_finalized_execution_context_is_consensus_object = false
order_finalized_execution_context_cas = true
order_proof_authority_complete = false
execution_receipt_kernel = true
atomic_evaluation_pair = true
challenge_evidence_response_adjudication_kernel = true
verifier_identity_weighted_quorum = true
exact_claim_statement_evidence_sequence_binding = true
required_da_policy_hash_bound = true
required_registered_verifier_count = 4
maximum_evidence_entries = 64
checked_transition_arithmetic = true
immutable_read_only_existing_file_preflight = true
durable_state_and_journal_tail_roots = true
durable_finalized_order_block_journal = true
settlement_integration = false
artifact_da_verification = false
agent_transaction_wire_complete = false
whole_store_rollback_authority = false
node_integration = false
g2_global_complete = false
protocol_implementation_complete = false
normative_freeze = false
production_candidate = false
activation = false

[features]
default = []

[dependencies]
borsh = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
trnm-poco-agent-market-v1 = { path = "../trnm-poco-agent-market-v1" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
