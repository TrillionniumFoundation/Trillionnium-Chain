              if create {
                  flags |= OpenFlags::SQLITE_OPEN_CREATE;
              }
              let connection = Connection::open_with_flags(path, flags).map_err(|_| {
                  error(
                      ValidationStoreErrorCodeV0::Storage,
                      "finalization_history.open",
                  )
