name: History V6 exact-source native recovery
on:
  pull_request:
    paths:
      - trillionnium/crates/trnm-pon-node/src/store/history_effect_v6.rs
      - trillionnium/crates/trnm-pon-node/src/store/history_effect_v6/**
      - trillionnium/crates/trnm-pon-node/src/store.rs
      - trillionnium/crates/trnm-pon-node/src/operator_checkpoint_tile.rs
      - trillionnium/crates/trnm-pon-node/src/ingress/public_v3/scalar_cpu.rs
      - trillionnium/crates/trnm-crypto-primitives/src/pon_work.rs
      - trillionnium/crates/trnm-mvcc-fee/src/checkpoint_tile_material_v1.rs
      - trillionnium/crates/trnm-mvcc-fee/tests/checkpoint_tile_material_v1.rs
      - trillionnium/crates/trnm-pon-node/src/service_cpu_budget*
      - trillionnium/Cargo.toml
      - trillionnium/Cargo.lock
      - scripts/ci/history_effect_v6_process_guard.py
      - scripts/ci/history_startup_no_native_process_guard.py
      - scripts/ci/test_history_startup_no_native_guard.py
      - scripts/ci/ci_job.sh
      - scripts/ci/test_history_effect_v6_guard.py
      - scripts/ci/run_history_effect_v6_native.py
      - scripts/ci/test_history_effect_v6_native_runner.py
      - scripts/ci/history_reorg_continuation_process_guard_v1.py
      - scripts/ci/run_history_reorg_continuation_native_v1.py
      - scripts/ci/test_history_reorg_continuation_native_v1.py
      - scripts/ci/history_lifecycle_process_guard_v1.py
      - scripts/ci/run_history_lifecycle_native_v1.py
      - scripts/ci/test_history_lifecycle_native_v1.py
      - trillionnium/crates/trnm-pon-node/src/native_progress.rs
      - trillionnium/crates/trnm-pon-node/src/host_kernel_parent.rs
      - trillionnium/crates/trnm-pon-node/src/account_archive_prototype/native_store.rs
      - trillionnium/crates/trnm-pon-node/src/ingress.rs
      - trillionnium/crates/trnm-pon-node/src/ingress/history_graph_resource_v1*
      - trillionnium/crates/trnm-pon-node/src/ingress/history_graph_resource_v1/**
      - trillionnium/crates/trnm-pon-node/src/store/history_graph_resource_v1*
      - trillionnium/crates/trnm-pon-node/src/store/history_graph_resource_v1/**
      - scripts/ci/history_graph_resource_guardian_v1.py
      - scripts/ci/run_history_graph_resource_native_v1.py
      - scripts/ci/read_history_graph_resource_native_v1.py
      - scripts/ci/test_history_graph_resource_native_v1.py
      - scripts/ci/read_native_history_verifier.py
      - scripts/ci/test_native_history_verifier.py
      - .github/workflows/pon-history-epoch-v1-native.yml
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character candidate commit from this repository
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: history-native-${{ github.event.pull_request.head.sha || inputs.source_sha }}
  cancel-in-progress: false
jobs:
  history-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Allocate isolated output and Cargo paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/history-native"
          echo "OUT=$RUNNER_TEMP/history-native" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/history-cargo" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/history-target" >> "$GITHUB_ENV"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every tracked byte and original project boundary
        id: source
        run: |
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_SOURCE" --output "$OUT/checkout-source.json"
          bash scripts/project-preflight.sh --audit
      - name: Install the pinned release compiler
        timeout-minutes: 10
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Reject missing or substituted mandatory tests
        run: python3 -m unittest discover -s scripts/ci -p test_history_effect_v6_native_runner.py -v
      - name: Retain exact release binary and run all original 21 plus first-Startup closure
        id: native
        run: python3 scripts/ci/run_history_effect_v6_native.py --expected-source "$EXPECTED_SOURCE" --out "$OUT/execution"
      - name: Collect actual terminal state and unchanged source
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['OUT'])
          execution = out / 'execution/terminal.json'
          result = {'schema': 'history-native-workflow-terminal-v1',
                    'expected_source': os.environ['EXPECTED_SOURCE'],
                    'source_step': os.environ['SOURCE_OUTCOME'],
                    'native_step': os.environ['NATIVE_OUTCOME'],
                    'actual_execution_terminal_present': execution.is_file(),
                    'passed': False,
                    'whole_history_p0_closed': False, 'production_qualified': False}
          if execution.is_file():
              result['execution'] = json.loads(execution.read_text())
              result['passed'] = (result['source_step'] == 'success'
                                  and result['native_step'] == 'success'
                                  and result['execution'].get('passed') is True)
          (out / 'workflow-terminal.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_SOURCE" --output "$OUT/final-source.json"
      - name: Retain complete source, logs, process receipts and native fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-native-${{ env.EXPECTED_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-native/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  history-reorg-continuation:
    needs: history-native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Allocate independent reorg lane output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/history-reorg"
          echo "OUT=$RUNNER_TEMP/history-reorg" >> "$GITHUB_ENV"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout the same exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Obtain the original gate's exact retained binary and terminal
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: history-native-${{ env.EXPECTED_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-baseline
      - name: Verify current tracked source and independent lane contracts
        id: source
        run: |
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_SOURCE" --output "$OUT/checkout-source.json"
          python3 -m unittest discover -s scripts/ci -p test_history_reorg_continuation_native_v1.py -v
      - name: Run every fresh reorg continuation case under its own 900-second bound
        id: native
        run: python3 scripts/ci/run_history_reorg_continuation_native_v1.py --expected-source "$EXPECTED_SOURCE" --baseline-terminal "$RUNNER_TEMP/history-baseline/execution/terminal.json" --out "$OUT/execution"
      - name: Retain independent lane actual terminal state
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['OUT'])
          path = out / 'execution/terminal.json'
          result = {'schema': 'history-reorg-continuation-workflow-terminal-v1',
                    'expected_source': os.environ['EXPECTED_SOURCE'],
                    'source_step': os.environ['SOURCE_OUTCOME'],
                    'native_step': os.environ['NATIVE_OUTCOME'], 'passed': False,
                    'actual_execution_terminal_present': path.is_file(),
                    'whole_history_p0_closed': False, 'production_qualified': False}
          if path.is_file():
              result['execution'] = json.loads(path.read_text())
              result['passed'] = (result['source_step'] == 'success'
                                  and result['native_step'] == 'success'
                                  and result['execution'].get('passed') is True)
          (out / 'workflow-terminal.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_SOURCE" --output "$OUT/final-source.json"
      - name: Retain reorg source, logs, exact binary, closed-process receipts and native fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-reorg-continuation-${{ env.EXPECTED_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-reorg/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  history-lifecycle:
    needs: history-native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Allocate independent lifecycle lane output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/history-lifecycle"
          echo "OUT=$RUNNER_TEMP/history-lifecycle" >> "$GITHUB_ENV"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout the same exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Obtain the original gate's exact retained binary and terminal
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: history-native-${{ env.EXPECTED_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-baseline
      - name: Verify current tracked source and independent lane contracts
        id: source
        run: |
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_SOURCE" --output "$OUT/checkout-source.json"
          python3 -m unittest discover -s scripts/ci -p test_history_lifecycle_native_v1.py -v
      - name: Run every fresh lifecycle recovery case under its own 900-second bound
        id: native
        run: python3 scripts/ci/run_history_lifecycle_native_v1.py --expected-source "$EXPECTED_SOURCE" --baseline-terminal "$RUNNER_TEMP/history-baseline/execution/terminal.json" --out "$OUT/execution"
      - name: Retain independent lane actual terminal state
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['OUT'])
          path = out / 'execution/terminal.json'
          result = {'schema': 'history-lifecycle-workflow-terminal-v1',
                    'expected_source': os.environ['EXPECTED_SOURCE'],
                    'source_step': os.environ['SOURCE_OUTCOME'],
                    'native_step': os.environ['NATIVE_OUTCOME'], 'passed': False,
                    'actual_execution_terminal_present': path.is_file(),
                    'whole_history_p0_closed': False, 'production_qualified': False}
          if path.is_file():
              result['execution'] = json.loads(path.read_text())
              result['passed'] = (result['source_step'] == 'success'
                                  and result['native_step'] == 'success'
                                  and result['execution'].get('passed') is True)
          (out / 'workflow-terminal.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_SOURCE" --output "$OUT/final-source.json"
      - name: Retain lifecycle source, logs, exact binary, closed-process receipts and native fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-lifecycle-${{ env.EXPECTED_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-lifecycle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  history-graph-resource-v1:
    needs: history-native
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Allocate independent explicit v1 physical evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/history-graph-resource-v1"
          echo "OUT=$RUNNER_TEMP/history-graph-resource-v1" >> "$GITHUB_ENV"
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout the same exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Obtain the unchanged original gate's actual retained executable
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: history-native-${{ env.EXPECTED_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-baseline
      - name: Verify source and finite reader plus real directory-race controls
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_SOURCE" --output "$OUT/checkout-source.json"
          bash scripts/project-preflight.sh --audit
          python3 -m unittest discover -s scripts/ci -p test_history_graph_resource_native_v1.py -v 2>&1 | tee "$OUT/physical-reader-controls.log"
          grep -E '^Ran 8 tests in ' "$OUT/physical-reader-controls.log"
          grep -x OK "$OUT/physical-reader-controls.log"
          python3 -m unittest discover -s scripts/ci -p test_history_fixed_parent_v2.py -v 2>&1 | tee "$OUT/fixed-parent-controls.log"
          grep -E '^Ran 4 tests in ' "$OUT/fixed-parent-controls.log"
          grep -x OK "$OUT/fixed-parent-controls.log"
      - name: Provision only this run's root-leased original fixed parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object config/systemd/trnmponpublic.slice)" = 8981b6aeed4c08c21679664940366b36a991444a
          sudo -n python3 -B scripts/ci/history_fixed_parent_v2.py provision \
            --owner "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --source "$GITHUB_WORKSPACE/config/systemd/trnmponpublic.slice" \
            > "$OUT/fixed-parent-provision.json"
      - name: Execute all 23 physical mutations and complete ordinary continuations
        id: native
        shell: bash
        run: |
          set -euo pipefail
          unit="trnm-history-graph-v1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.service"
          cleanup() {
            original_status=$?
            trap - EXIT INT TERM
            set +e
            sudo -n systemctl stop "$unit" >> "$OUT/outer-cleanup.log" 2>&1
            cleanup_status=$?
            printf 'original_exit=%s\ncleanup_exit=%s\n' "$original_status" "$cleanup_status" >> "$OUT/outer-cleanup.log"
            exit "$original_status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # A new independent 1800s lane; original22/7/12 and campaign budgets are unchanged.
          sudo -n systemd-run --unit="$unit" --wait --pipe --collect \
            --service-type=exec --expand-environment=no \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            --property=CPUAccounting=yes --property=MemoryAccounting=yes \
            --property=CPUQuota=400% --property=CPUQuotaPeriodSec=100ms \
            --property=MemoryMax=17179869184 --property=Nice=10 \
            --property=KillMode=control-group --property=TimeoutStopSec=20s \
            --property=RuntimeMaxSec=1860s --setenv="PATH=$PATH" \
            --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv=RUST_TEST_THREADS=1 \
            /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/ci/run_history_graph_resource_native_v1.py" \
            --expected-source "$EXPECTED_SOURCE" \
            --baseline-terminal "$RUNNER_TEMP/history-baseline/execution/terminal.json" \
            --owner "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" --out "$OUT/execution" \
            2>&1 | tee "$OUT/physical-native.log"
      - name: Close only this run's original root lease
        if: always()
        id: cleanup
        run: |
          sudo -n python3 -B scripts/ci/history_fixed_parent_v2.py cleanup \
            --owner "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" > "$OUT/fixed-parent-cleanup.json"
      - name: Retain exact final source and explicit physical terminal
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_ci_source.py --kind head --expected-head "$EXPECTED_SOURCE" --output "$OUT/final-source.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['OUT']);path = out / 'execution/terminal.json'
          result = {'schema': 'history-graph-resource-physical-workflow-terminal-v1',
                    'expected_source': os.environ['EXPECTED_SOURCE'],
                    'profile': 'history-account-graph-resource-fence-v1',
                    'source_step': os.environ['SOURCE_OUTCOME'],
                    'native_step': os.environ['NATIVE_OUTCOME'],
                    'cleanup_step': os.environ['CLEANUP_OUTCOME'],
                    'passed': False, 'whole_history_p0_closed': False, 'production_qualified': False}
          if path.is_file():
              result['execution'] = json.loads(path.read_text())
              result['passed'] = (all(result[key] == 'success' for key in ('source_step', 'native_step', 'cleanup_step'))
                                  and result['execution'].get('passed') is True)
          (out / 'workflow-terminal.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Preserve complete successful, failed and partial physical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-graph-resource-v1-${{ env.EXPECTED_SOURCE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-graph-resource-v1/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
