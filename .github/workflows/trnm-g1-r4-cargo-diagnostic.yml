name: TRNM G1-R4 workspace export and Cargo diagnostic

on:
  push:
    branches:
      - feature/chain-g1-r4-gap-closure-20260828

permissions:
  contents: read

concurrency:
  group: trnm-g1-r4-workspace-export-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: UTC
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_NET_OFFLINE: "true"
  CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"

jobs:
  diagnose-and-export:
    name: Diagnose authority drift and export exact R4A source
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.ref == 'refs/heads/feature/chain-g1-r4-gap-closure-20260828' &&
      github.actor == 'Tomasrgbsf' &&
      github.triggering_actor == 'Tomasrgbsf'
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 45
    steps:
      - name: Checkout exact R4A branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/chain-g1-r4a-finalization-intent-process-matrix-20260828
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b91e98160e6a27ca367cb34c611a5eaa7b79c0a6"
          test "$(git rev-parse HEAD^{tree})" = "9fe5d8116fc9f2e0d1744e59032aee262505ebd5"
          test -z "$(git status --porcelain)"

      - name: Verify runner-provisioned Rust toolchain
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 \
            --component clippy \
            --component rustfmt

      - name: Diagnose exact Cargo drift without mutating cache
        run: |
          set -euo pipefail
          current=a259e0b28a2d9dea838f5ceac0e805803ac51dd4
          reviewed=9966186e104fb03e4844a356cd87391f54de1caf
          stamp="$HOME/.cargo/trnm-chain-offline-cache-v2.sha256"
          echo "stamp=$(cat "$stamp")"
          echo "current_lock_sha=$(git show "$current:trillionnium/Cargo.lock" | sha256sum)"
          echo "reviewed_lock_sha=$(git show "$reviewed:trillionnium/Cargo.lock" | sha256sum)"
          echo '=== changed manifests ==='
          git diff --name-only "$reviewed".."$current" -- '**/Cargo.toml' | sort
          echo '=== fs2 manifests ==='
          git grep -n -E '(^|[[:space:]])fs2([[:space:]]|=)' "$current" -- '**/Cargo.toml' || true
          echo '=== fs2 source refs ==='
          git grep -n -E 'fs2::|FileExt|lock_exclusive|try_lock_exclusive|unlock\(' "$current" -- '*.rs' || true
          echo '=== rustix manifests ==='
          git grep -n -E '(^|[[:space:]])rustix([[:space:]]|=)' "$current" -- '**/Cargo.toml' || true
          git show "$current:trillionnium/Cargo.lock" > "$RUNNER_TEMP/current.lock"
          git show "$reviewed:trillionnium/Cargo.lock" > "$RUNNER_TEMP/reviewed.lock"
          python3 - "$RUNNER_TEMP/reviewed.lock" "$RUNNER_TEMP/current.lock" <<'PY'
          import sys, tomllib
          def pkgs(path):
              data = tomllib.loads(open(path, 'rb').read().decode())
              return {(p['name'], p['version'], p.get('source', 'path')) for p in data['package']}
          old, new = pkgs(sys.argv[1]), pkgs(sys.argv[2])
          print('added:')
          for value in sorted(new - old):
              print(value)
          print('removed:')
          for value in sorted(old - new):
              print(value)
          PY
          cp "$RUNNER_TEMP/reviewed.lock" trillionnium/Cargo.lock
          set +e
          cargo metadata --manifest-path trillionnium/Cargo.toml --format-version 1 --locked --offline >/dev/null
          rc=$?
          set -e
          echo "reviewed_locked_metadata_rc=$rc"
          git checkout -- trillionnium/Cargo.lock

      - name: Export exact tracked source archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trnm-chain-r4a-b91e98160e6a27ca.tar.gz"
          checksum="$archive.sha256"
          git archive --format=tar --prefix=Trillionnium-Chain/ HEAD | gzip -n -9 > "$archive"
          sha256sum "$archive" > "$checksum"
          tar -tzf "$archive" | grep -Fx 'Trillionnium-Chain/trillionnium/crates/trnm-poco-node/build.rs'
          tar -tzf "$archive" | grep -Fx 'Trillionnium-Chain/trillionnium/crates/trnm-poco-node/src/lab_authority.rs'
          tar -tzf "$archive" | grep -Fx 'Trillionnium-Chain/trillionnium/crates/trnm-poco-node/src/finalization_intent_wal.rs'
          cat "$checksum"

      - name: Upload exact tracked source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-chain-r4a-source-b91e98160e6a27ca-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/trnm-chain-r4a-b91e98160e6a27ca.tar.gz
            ${{ runner.temp }}/trnm-chain-r4a-b91e98160e6a27ca.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
