name: TEMP repair remote signer clean-runner daemon test

on:
  push:
    branches:
      - fix/remote-signer-clean-runner-daemon-20260909

permissions:
  contents: write

concurrency:
  group: temp-remote-signer-clean-runner-fix
  cancel-in-progress: false

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable repair input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ded43a0704b455cd4bef724cb3ca40fb6db9465d HEAD
          test "$(git hash-object trillionnium/crates/trnm-consensus-remote-signer-service/tests/external_authority_adapter.rs)" = "19ed99d895af283a7b7997c46f345469fc673f7e"

      - name: Make the integration test self-contained across a real process boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("trillionnium/crates/trnm-consensus-remote-signer-service/tests/external_authority_adapter.rs")
          source = path.read_text()

          replacements = [
              (
                  "//! This test deliberately exercises the real external watermark daemon and\n//! response hash-chain, but it does not claim Core/SafetyRules authority or a\n//! production signer. Vote requests remain fail-closed.",
                  "//! This test deliberately exercises the real external watermark daemon\n//! implementation in an isolated child process and its response hash-chain,\n//! but it does not claim Core/SafetyRules authority or a production signer.\n//! Vote requests remain fail-closed.",
              ),
              (
                  "use trnm_consensus_external_watermark::{\n    ExternalWatermarkAuthorityError, ExternalWatermarkSemanticBindingV1, UnixWatermarkClient,\n};",
                  "use trnm_consensus_external_watermark::{\n    run_semantic_daemon, ExternalWatermarkAuthorityError, ExternalWatermarkSemanticBindingV1,\n    UnixWatermarkClient,\n};",
              ),
              (
                  "const CAPABILITY: [u8; 32] = [0x33; 32];",
                  "const CAPABILITY: [u8; 32] = [0x33; 32];\nconst DAEMON_CHILD_ENV: &str = \"TRNM_TEST_EXTERNAL_WATERMARK_DAEMON_CHILD\";\nconst DAEMON_SOCKET_ENV: &str = \"TRNM_TEST_EXTERNAL_WATERMARK_SOCKET\";\nconst DAEMON_LOG_ENV: &str = \"TRNM_TEST_EXTERNAL_WATERMARK_LOG\";\nconst DAEMON_SCOPE_ENV: &str = \"TRNM_TEST_EXTERNAL_WATERMARK_SCOPE\";\nconst DAEMON_JOURNAL_ENV: &str = \"TRNM_TEST_EXTERNAL_WATERMARK_JOURNAL\";\nconst DAEMON_CAPABILITY_ENV: &str = \"TRNM_TEST_EXTERNAL_WATERMARK_CAPABILITY\";",
              ),
              (
                  '''impl AuthorityProcess {
    fn binary() -> PathBuf {
        if let Ok(path) = env::var("CARGO_BIN_EXE_trnm-external-watermark-v0") {
            return PathBuf::from(path);
        }
        Path::new(env!("CARGO_MANIFEST_DIR")).join("../../target/debug/trnm-external-watermark-v0")
    }

    fn start(
        root: &Path,
        binding: trnm_consensus_remote_signer_protocol::RemoteSignerRequestBindingV1,
    ) -> Self {
        let socket = root.join("authority.sock");
        let log = root.join("authority.log");
        let scope = UnixExternalTimeoutAuthorityV1::scope_for_binding(binding);
        let journal = UnixExternalTimeoutAuthorityV1::journal_id_for_binding(binding);
        let child = Command::new(Self::binary())
            .args([
                "semantic",
                "--socket",
                socket.to_str().expect("authority socket path"),
                "--log",
                log.to_str().expect("authority log path"),
                "--scope",
                &hex32(scope),
                "--journal-id",
                &hex32(journal),
                "--capability",
                &hex32(CAPABILITY),
            ])
            .spawn()
            .expect("spawn external watermark daemon");''',
                  '''impl AuthorityProcess {
    fn command(
        socket: &Path,
        log: &Path,
        binding: trnm_consensus_remote_signer_protocol::RemoteSignerRequestBindingV1,
    ) -> Command {
        let scope = UnixExternalTimeoutAuthorityV1::scope_for_binding(binding);
        let journal = UnixExternalTimeoutAuthorityV1::journal_id_for_binding(binding);
        let mut command = Command::new(
            env::current_exe().expect("resolve external authority integration test executable"),
        );
        command
            .args([
                "--exact",
                "external_watermark_daemon_process",
                "--nocapture",
            ])
            .env(DAEMON_CHILD_ENV, "1")
            .env(DAEMON_SOCKET_ENV, socket)
            .env(DAEMON_LOG_ENV, log)
            .env(DAEMON_SCOPE_ENV, hex32(scope))
            .env(DAEMON_JOURNAL_ENV, hex32(journal))
            .env(DAEMON_CAPABILITY_ENV, hex32(CAPABILITY));
        command
    }

    fn start(
        root: &Path,
        binding: trnm_consensus_remote_signer_protocol::RemoteSignerRequestBindingV1,
    ) -> Self {
        let socket = root.join("authority.sock");
        let log = root.join("authority.log");
        let scope = UnixExternalTimeoutAuthorityV1::scope_for_binding(binding);
        let journal = UnixExternalTimeoutAuthorityV1::journal_id_for_binding(binding);
        let child = Self::command(&socket, &log, binding)
            .spawn()
            .expect("spawn isolated external watermark daemon process");''',
              ),
              (
                  '''fn hex32(bytes: [u8; 32]) -> String {
    bytes.iter().map(|byte| format!("{byte:02x}")).collect()
}

#[test]
fn timeout_bridge_orders_cas_sign_bind_and_replays_after_daemon_restart() {''',
                  '''fn hex32(bytes: [u8; 32]) -> String {
    bytes.iter().map(|byte| format!("{byte:02x}")).collect()
}

fn daemon_env_path(name: &str) -> PathBuf {
    env::var_os(name)
        .map(PathBuf::from)
        .unwrap_or_else(|| panic!("missing child daemon environment variable {name}"))
}

fn daemon_env_hex32(name: &str) -> [u8; 32] {
    let value = env::var(name)
        .unwrap_or_else(|_| panic!("missing child daemon environment variable {name}"));
    assert_eq!(value.len(), 64, "{name} must contain exactly 32 bytes");
    let mut output = [0_u8; 32];
    for (index, byte) in output.iter_mut().enumerate() {
        *byte = u8::from_str_radix(&value[index * 2..index * 2 + 2], 16)
            .unwrap_or_else(|_| panic!("{name} must contain canonical hexadecimal"));
    }
    assert_ne!(output, [0_u8; 32], "{name} must not be the zero identifier");
    output
}

#[test]
fn external_watermark_daemon_process() {
    if env::var_os(DAEMON_CHILD_ENV).is_none() {
        return;
    }
    let binding = ExternalWatermarkSemanticBindingV1::new(
        daemon_env_hex32(DAEMON_SCOPE_ENV),
        daemon_env_hex32(DAEMON_JOURNAL_ENV),
        daemon_env_hex32(DAEMON_CAPABILITY_ENV),
    )
    .expect("child daemon semantic binding");
    run_semantic_daemon(
        daemon_env_path(DAEMON_SOCKET_ENV),
        daemon_env_path(DAEMON_LOG_ENV),
        binding,
    )
    .expect("isolated external watermark daemon must fail closed on invalid durable state");
}

#[test]
fn timeout_bridge_orders_cas_sign_bind_and_replays_after_daemon_restart() {''',
              ),
              (
                  '''    let failed = Command::new(AuthorityProcess::binary())
        .args([
            "semantic",
            "--socket",
            authority.socket.to_str().unwrap(),
            "--log",
            authority.log.to_str().unwrap(),
            "--scope",
            &hex32(UnixExternalTimeoutAuthorityV1::scope_for_binding(
                fixture.binding,
            )),
            "--journal-id",
            &hex32(UnixExternalTimeoutAuthorityV1::journal_id_for_binding(
                fixture.binding,
            )),
            "--capability",
            &hex32(CAPABILITY),
        ])
        .output()
        .expect("spawn tampered authority");''',
                  '''    let failed = AuthorityProcess::command(&authority.socket, &authority.log, fixture.binding)
        .output()
        .expect("spawn tampered authority");''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one repair target, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          git diff --check
          git diff -- trillionnium/crates/trnm-consensus-remote-signer-service/tests/external_authority_adapter.rs

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustc +1.95.0 -Vv
          cargo +1.95.0 -V

      - name: Prove clean-runner independence from sibling target cache
        shell: bash
        run: |
          set -euo pipefail
          rm -f trillionnium/target/debug/trnm-external-watermark-v0
          test ! -e trillionnium/target/debug/trnm-external-watermark-v0
          cargo +1.95.0 fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo +1.95.0 test --manifest-path trillionnium/Cargo.toml --locked \
            -p trnm-consensus-remote-signer-service \
            --test external_authority_adapter -- --test-threads=1
          test ! -e trillionnium/target/debug/trnm-external-watermark-v0
          cargo +1.95.0 clippy --manifest-path trillionnium/Cargo.toml --locked \
            -p trnm-consensus-remote-signer-service \
            --test external_authority_adapter -- -D warnings

      - name: Commit only the proven source repair and delete this carrier
        shell: bash
        run: |
          set -euo pipefail
          carrier=.github/workflows/zz-ephemeral-remote-signer-clean-runner-fix.yml
          rm "$carrier"
          git add trillionnium/crates/trnm-consensus-remote-signer-service/tests/external_authority_adapter.rs "$carrier"
          git diff --cached --check
          git config user.name "trillionnium-automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(remote-signer): remove sibling binary cache dependency"
          git push origin HEAD:fix/remote-signer-clean-runner-daemon-20260909
