name: candidate-clippy-harness-probe-x230-5383

on:
  push:
    branches:
      - tmp/candidate-clippy-harness-probe-5383-20260831
    paths:
      - .github/workflows/candidate-clippy-harness-probe-x230-5383.yml
      - scripts/ci/check_candidate_devnet_clippy_v1.sh

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'TrillionniumFoundation/Trillionnium-Chain' &&
      github.actor == 'Tomasrgbsf' &&
      github.triggering_actor == 'Tomasrgbsf'
    runs-on: [self-hosted, Linux, X64, x230, trillionnium-chain]
    timeout-minutes: 60
    env:
      CARGO_NET_OFFLINE: "true"
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"
      TRNM_CARGO_OFFLINE_POLICY: "required"
    steps:
      - name: Check out exact probe source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply exact const-assertion candidate fix locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path('trillionnium/crates/trnm-poco-lab-validator/src/candidate_devnet.rs')
          text = path.read_text(encoding='utf-8')
          old = '\n'.join([
              '        assert!(CANDIDATE_DEVNET_VALIDATOR_CLI_V1);',
              '        assert!(CANDIDATE_DEVNET_EXTERNAL_FENCE_REQUIRED_V1);',
              '        assert!(CANDIDATE_DEVNET_LOCAL_TEST_KEYS_V1);',
              '        assert!(!CANDIDATE_DEVNET_HSM_AUTHORITY_V1);',
              '        assert!(!CANDIDATE_DEVNET_HOST_ATTESTATION_V1);',
              '        assert!(!CANDIDATE_DEVNET_PRODUCTION_ACTIVATION_V1);',
              '        assert!(!CANDIDATE_DEVNET_PUBLIC_TESTNET_READY_V1);',
          ]) + '\n'
          new = '\n'.join([
              '        const {',
              '            assert!(CANDIDATE_DEVNET_VALIDATOR_CLI_V1);',
              '            assert!(CANDIDATE_DEVNET_EXTERNAL_FENCE_REQUIRED_V1);',
              '            assert!(CANDIDATE_DEVNET_LOCAL_TEST_KEYS_V1);',
              '            assert!(!CANDIDATE_DEVNET_HSM_AUTHORITY_V1);',
              '            assert!(!CANDIDATE_DEVNET_HOST_ATTESTATION_V1);',
              '            assert!(!CANDIDATE_DEVNET_PRODUCTION_ACTIVATION_V1);',
              '            assert!(!CANDIDATE_DEVNET_PUBLIC_TESTNET_READY_V1);',
              '        }',
          ]) + '\n'
          if text.count(old) != 1:
              raise SystemExit('candidate const assertion source drift')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git add trillionnium/crates/trnm-poco-lab-validator/src/candidate_devnet.rs
          git config user.name 'probe-only'
          git config user.email 'probe-only@example.invalid'
          git commit -m 'probe: const candidate non-claims'

      - name: Verify toolchain and offline cache
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/check_preprovisioned_rust_toolchain.sh \
            --toolchain 1.95.0 --component clippy
          ./scripts/ci/check_cargo_offline_ready.sh \
            --toolchain 1.95.0 \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}" \
            trillionnium/Cargo.toml:trillionnium/Cargo.lock

      - name: Run isolated harness and retain diagnostic
        shell: bash
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/candidate-clippy-harness"
          mkdir -p "${out}"
          set +e
          bash scripts/ci/check_candidate_devnet_clippy_v1.sh >"${out}/harness.log" 2>&1
          rc=$?
          set -e
          printf 'harness_rc=%s\n' "${rc}" | tee "${out}/result.env"
          grep -E '^(error|warning):|candidate_devnet_clippy=' "${out}/harness.log" || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-clippy-harness-probe-x230-5383
          path: ${{ runner.temp }}/candidate-clippy-harness/
          if-no-files-found: error
          retention-days: 3

      - name: Verify offline inputs unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ci/check_cargo_offline_unchanged.sh \
            --state "$RUNNER_TEMP/trnm-cargo-offline-${GITHUB_JOB}"
